<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ディサースリア 2026 試験対策</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --primary: #2d6a9f;
    --primary-light: #e8f0fa;
    --accent: #e8543a;
    --accent-light: #fdecea;
    --green: #1e8c5a;
    --green-light: #e6f6ef;
    --text: #1a2332;
    --muted: #6b7a8d;
    --border: #dce3ec;
    --shadow: 0 2px 12px rgba(45,106,159,0.10);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  /* ヘッダー */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header .label {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 900;
    color: var(--primary);
    letter-spacing: -0.5px;
    line-height: 1.2;
  }
  .header .sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* 進捗バー */
  .progress-wrap {
    max-width: 680px;
    margin: 0 auto 20px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), #4a9fd4);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* カテゴリフィルター */
  .filter-wrap {
    max-width: 680px;
    margin: 0 auto 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 2px solid var(--border);
    background: var(--card);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* カード */
  .card-wrap {
    max-width: 680px;
    margin: 0 auto;
  }
  .question-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 28px 24px;
    margin-bottom: 16px;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .question-card.revealed {
    border-color: var(--primary-light);
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .q-num {
    min-width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--primary-light);
    color: var(--primary);
    font-size: 13px;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .q-meta {
    flex: 1;
  }
  .q-category {
    font-size: 10px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .q-text {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.55;
    color: var(--text);
  }
  .q-star {
    color: #f5a623;
    font-size: 14px;
    margin-left: 4px;
  }

  /* 選択肢 */
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 14px;
  }
  .option-btn {
    width: 100%;
    text-align: left;
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .option-btn.correct {
    background: var(--green-light);
    border-color: var(--green);
    color: var(--green);
    font-weight: 700;
  }
  .option-btn.wrong {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }
  .option-btn:disabled { cursor: default; }

  /* 回答ボタン（記述式） */
  .reveal-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .reveal-btn:hover { opacity: 0.85; }

  /* 解答エリア */
  .answer-box {
    margin-top: 14px;
    padding: 16px 18px;
    background: var(--green-light);
    border-radius: 10px;
    border-left: 4px solid var(--green);
    display: none;
  }
  .answer-box.show { display: block; }
  .answer-label {
    font-size: 10px;
    font-weight: 900;
    color: var(--green);
    letter-spacing: 1.5px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .answer-text {
    font-size: 14px;
    line-height: 1.7;
    color: #1a4a35;
    font-weight: 500;
    white-space: pre-wrap;
  }

  /* 注意書き */
  .note-box {
    margin-top: 10px;
    padding: 10px 14px;
    background: #fff8e6;
    border-radius: 8px;
    border-left: 3px solid #f5a623;
    font-size: 12px;
    color: #7a5800;
    line-height: 1.6;
    display: none;
  }
  .note-box.show { display: block; }

  /* 自己採点 */
  .self-score {
    display: none;
    gap: 8px;
    margin-top: 12px;
  }
  .self-score.show { display: flex; }
  .score-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 2px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }
  .score-btn.ok {
    background: var(--green-light);
    color: var(--green);
    border-color: var(--green);
  }
  .score-btn.ng {
    background: var(--accent-light);
    color: var(--accent);
    border-color: var(--accent);
  }
  .score-btn.ok:hover { background: var(--green); color: #fff; }
  .score-btn.ng:hover { background: var(--accent); color: #fff; }
  .score-btn:disabled { opacity: 0.5; cursor: default; }

  /* スコア表示 */
  .result-badge {
    display: none;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
  }
  .result-badge.show { display: flex; }
  .badge-ok { color: var(--green); }
  .badge-ng { color: var(--accent); }

  /* 全体スコア */
  .score-panel {
    max-width: 680px;
    margin: 0 auto 24px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px 24px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .score-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: conic-gradient(var(--primary) 0%, var(--primary) 0%, var(--border) 0%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .score-circle-inner {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    color: var(--primary);
  }
  .score-detail { flex: 1; }
  .score-detail h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .score-detail p { font-size: 12px; color: var(--muted); }
  .reset-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.15s;
  }
  .reset-btn:hover { border-color: var(--primary); color: var(--primary); }

  /* OX問題 */
  .ox-wrap { display: flex; gap: 12px; margin-bottom: 14px; }
  .ox-btn {
    flex: 1;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    font-size: 28px;
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .ox-btn:hover:not(:disabled) { transform: scale(1.04); }
  .ox-btn.correct { background: var(--green-light); border-color: var(--green); }
  .ox-btn.wrong { background: var(--accent-light); border-color: var(--accent); }
  .ox-btn:disabled { cursor: default; }
</style>
</head>
<body>

<div class="header">
  <div class="label">ST 養成課程 · 2026</div>
  <h1>ディサースリア 試験対策</h1>
  <div class="sub">全30問 ｜ 解答を確認して自己採点しよう ✏️</div>
</div>

<div class="score-panel">
  <div class="score-circle" id="scoreCircle">
    <div class="score-circle-inner" id="scoreNum">0%</div>
  </div>
  <div class="score-detail">
    <h3>現在のスコア</h3>
    <p id="scoreText">まだ採点していません</p>
  </div>
  <button class="reset-btn" onclick="resetAll()">リセット</button>
</div>

<div class="progress-wrap">
  <div class="progress-info">
    <span id="progressText">0 / 30 問 回答済み</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="filter-wrap" id="filterWrap"></div>

<div class="card-wrap" id="cardWrap"></div>

<script>
const questions = [
  // ① 定義・概論
  {
    num: 1, cat: "定義・概論", star: true, type: "desc",
    q: "ディサースリアの定義を答えてください。",
    a: "神経・筋系の疾患に起因する、発声発語器官の運動機能障害（speech）による発話の障害"
  },
  {
    num: 2, cat: "定義・概論", star: true, type: "desc",
    q: "運動障害性構音障害と失語症の共通点・相違点を説明してください。",
    a: "【共通点】「話す」ことが障害されるコミュニケーション障害\n\n【相違点】\n・失語症：発声器官の障害はない。脳損傷による言語機能障害（話す・聴く・書く・読む すべてが障害）\n・ディサースリア：発話に関する音声言語コミュニケーション障害で、言語機能の障害ではない"
  },
  {
    num: 3, cat: "定義・概論", type: "desc",
    q: "ディサースリアの復職率と失語症の復職率に違いがあるのはなぜか説明してください。",
    a: "失語症の方がディサースリアより復職率が低い。\n\n失語症は「話す・聴く・書く・読む」4つの言語機能すべてが障害されるのに対し、ディサースリアは「話す」ことのみが障害され、筆談やAACなど代替コミュニケーション手段を活用することで代償しやすいから。",
    note: "💡 ディサースリアの復職率 約22%、失語症 約18〜19%、脳卒中 約20〜34%（試験で数字を問われることもあり）"
  },

  // ② 解剖
  {
    num: 4, cat: "解剖", star: true, type: "desc",
    q: "内舌筋を4つあげてください。",
    a: "① 上縦舌筋（舌を短くし、舌先を上へ向ける）\n② 下縦舌筋（舌を短くし、舌先を下へ向ける）\n③ 横舌筋（舌を細長く伸ばし、幅を狭くする）\n④ 垂直舌筋（舌を薄く平らにし、幅を広げる）"
  },
  {
    num: 5, cat: "解剖", type: "desc",
    q: "外舌筋を3つあげてください。",
    a: "① オトガイ舌筋（舌を前方へ突き出す）\n② 舌骨舌筋（舌を下方・後方へ引き下げる）\n③ 茎突舌筋（舌を上後方へ引き上げる）\n\n※ いずれも舌下神経支配"
  },
  {
    num: 6, cat: "解剖", star: true, type: "desc",
    q: "中枢神経と末梢神経の違いを以下の用語を使って説明してください。（大脳・小脳・脳幹・脊髄）",
    a: "【中枢神経】大脳・小脳・脳幹・脊髄から構成され、情報を統合・処理して運動の命令を出す\n\n【末梢神経】中枢神経と全身の器官を連絡し、感覚情報を中枢神経へ伝えたり、中枢神経からの運動指令を筋へ伝えたりする"
  },
  {
    num: 7, cat: "解剖", star: true, type: "desc",
    q: "皮質延髄路の走行を以下の用語を使って説明してください。（運動野・内包・中脳）",
    a: "皮質延髄路は、一次運動野から起こり、内包を通過し中脳へ下行。その後、橋・延髄を通り脳神経運動核へ至る。\n（顔面・舌・咽頭・喉頭などの随意運動を支配）"
  },

  // ③ 分類・病態
  {
    num: 8, cat: "分類・病態", star: true, type: "multi",
    q: "運動低下性ディサースリアの病態特徴をすべて選んでください。",
    options: ["可動範囲（振幅）の縮小", "不随意運動", "筋萎縮・筋力低下", "筋緊張の変動", "仮面様顔貌・流涎"],
    correct: [0, 2, 4],
    a: "✅ 可動範囲（振幅）の縮小／筋萎縮・筋力低下／仮面様顔貌・流涎\n\n原因：パーキンソン病・パーキンソン症候群（錐体外路系・大脳基底核の障害）"
  },
  {
    num: 9, cat: "分類・病態", type: "multi",
    q: "運動過多性ディサースリアの病態特徴をすべて選んでください。",
    options: ["不随意運動", "筋緊張の変動", "筋萎縮", "協調運動障害", "仮面様顔貌"],
    correct: [0, 1],
    a: "✅ 不随意運動／筋緊張の変動\n\n原因：ハンチントン病、ジスキネジア、チックなど（大脳基底核障害による不随意運動群）"
  },
  {
    num: 10, cat: "分類・病態", star: true, type: "desc",
    q: "球麻痺と仮性球麻痺の類似点と相違点を説明してください。",
    a: "【類似点】嚥下障害がある\n\n【相違点】\n障害部位：球麻痺→下位運動ニューロン　仮性球麻痺→上位運動ニューロン\n構音障害：球麻痺→嗄声・鼻声　仮性球麻痺→痙性言語\n下顎反射：球麻痺→減弱（低下）　仮性球麻痺→亢進\n筋萎縮：球麻痺→あり　仮性球麻痺→なし\n感情失禁：仮性球麻痺でみられる"
  },

  // ④ 発話特徴
  {
    num: 11, cat: "発話特徴", star: true, type: "desc",
    q: "嗄声（させい）の種類を4つあげてください。",
    a: "① 努力性嗄声：声帯の過剰な締め付けによる力んだ声\n② 無力性嗄声：声帯の緊張低下による力のない弱い声\n③ 気息性嗄声：声門閉鎖不全によるかすれたハスキー声\n④ 粗燥性嗄声：振動の不規則性によるだみ声・ガラガラ声"
  },
  {
    num: 12, cat: "発話特徴", star: true, type: "desc",
    q: "開鼻声とはどのような発話か説明してください。",
    a: "鼻咽腔閉鎖不全により、非通鼻音の生成時に呼気が不適切に鼻腔へ流出して鼻腔共鳴が過剰になり、声が鼻音化する発話症状のこと。\n/p/ /b/ /m/ に近くなり、/t/ /d/ /n/ に近くなるなど母音も鼻音化する。"
  },
  {
    num: 13, cat: "発話特徴", star: true, type: "choice",
    q: "発声発語器官の運動時に左右差が認められることの多いディサースリアのタイプを1つあげてください。",
    options: ["弛緩性ディサースリア", "UUMNディサースリア", "失調性ディサースリア", "運動低下性ディサースリア"],
    correct: 1,
    a: "✅ UUMNディサースリア\n\n一側性の大脳皮質または皮質核路の障害により生じるため、顔面・舌・口唇などに左右差が現れやすい。"
  },
  {
    num: 14, cat: "発話特徴", star: true, type: "desc",
    q: "失調性ディサースリアに特徴的な発話症状を2つ記載してください。",
    a: "① 爆発性の発話（大きさの異常）\n② 断綴性発話（モーラごとにとぎれとぎれになる）\n\nその他：スキャン発話、音の大きさ・高さの異常、発話の不規則な崩れ"
  },

  // ⑤ UUMN
  {
    num: 15, cat: "分類・病態", star: true, type: "choice",
    q: "UUMNディサースリアを呈する患者について、予想される神経学的所見・神経心理学的所見の組み合わせとして最も正しいものを選んでください。",
    options: [
      "a. 弛緩性麻痺＋視覚失認",
      "b. 痙性麻痺＋注意障害",
      "c. 運動失調＋記憶障害",
      "d. 左上下肢麻痺＋失語症",
      "e. 半盲＋左半側空間無視"
    ],
    correct: 1,
    a: "✅ b. 痙性麻痺＋注意障害\n\nUUMNは片側の上位運動ニューロン障害→痙性麻痺。注意障害は前頭葉病変で合併しやすい。\n\n❌ a：弛緩性は下位MN障害、視覚失認は後頭葉\n❌ c：運動失調は小脳障害、記憶障害は海馬\n❌ d：左上下肢麻痺（右脳）と失語症（左脳）は矛盾\n❌ e：ディサースリアの所見なし"
  },

  // ⑥ 観察
  {
    num: 16, cat: "観察・評価", type: "desc",
    q: "運動障害性構音障害が疑われる患者様に対して観察を行う理由を説明してください。",
    a: "・合併症があるかの確認\n・他の障害を除外するため\n・障害部位の推定\n・重症度の把握\n・治療計画への活用\n・音声の質や発話明瞭度の確認・評価"
  },

// カテゴリ一覧
const categories = ["すべて", ...new Set(questions.map(q => q.cat))];

// 状態管理
let results = {}; // { qIndex: 'ok' | 'ng' | null }
let answered = {}; // 回答済み
let currentFilter = "すべて";

function init() {
  // フィルター
  const fw = document.getElementById('filterWrap');
  fw.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === currentFilter ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      currentFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    };
    fw.appendChild(btn);
  });
  renderCards();
  updateScore();
}

function renderCards() {
  const wrap = document.getElementById('cardWrap');
  wrap.innerHTML = '';
  const filtered = questions.filter(q => currentFilter === "すべて" || q.cat === currentFilter);

  filtered.forEach((q, i) => {
    const idx = questions.indexOf(q);
    const card = document.createElement('div');
    card.className = 'question-card' + (answered[idx] ? ' revealed' : '');
    card.id = `card-${idx}`;

    let innerHTML = `
      <div class="q-header">
        <div class="q-num">${q.num}</div>
        <div class="q-meta">
          <div class="q-category">${q.cat}</div>
          <div class="q-text">${q.q}${q.star ? '<span class="q-star">★</span>' : ''}</div>
        </div>
      </div>`;

    if (q.type === 'ox') {
      innerHTML += `<div class="ox-wrap">
        <button class="ox-btn" id="ox-o-${idx}" onclick="answerOX(${idx}, '○')" ${answered[idx] ? 'disabled' : ''}>○</button>
        <button class="ox-btn" id="ox-x-${idx}" onclick="answerOX(${idx}, '×')" ${answered[idx] ? 'disabled' : ''}>×</button>
      </div>`;
      if (answered[idx]) {
        const userAns = answered[idx];
        const correct = q.correct;
        document.querySelectorAll(`#ox-o-${idx}, #ox-x-${idx}`).forEach(() => {});
      }
    } else if (q.type === 'choice') {
      innerHTML += `<div class="options">`;
      q.options.forEach((opt, oi) => {
        let cls = '';
        if (answered[idx] !== undefined) {
          if (oi === q.correct) cls = 'correct';
          else if (answered[idx] === oi) cls = 'wrong';
        }
        innerHTML += `<button class="option-btn ${cls}" onclick="answerChoice(${idx}, ${oi})" ${answered[idx] !== undefined ? 'disabled' : ''}>${opt}</button>`;
      });
      innerHTML += `</div>`;
    } else if (q.type === 'multi') {
      innerHTML += `<div class="options" id="multi-${idx}">`;
      q.options.forEach((opt, oi) => {
        let cls = '';
        if (answered[idx]) {
          if (q.correct.includes(oi)) cls = 'correct';
          else if (answered[idx].includes(oi)) cls = 'wrong';
        }
        innerHTML += `<button class="option-btn ${cls}" onclick="toggleMulti(${idx}, ${oi})" ${answered[idx] ? 'disabled' : ''}>${opt}</button>`;
      });
      innerHTML += `</div>`;
      if (!answered[idx]) {
        innerHTML += `<button class="reveal-btn" onclick="submitMulti(${idx})">▶ 答え合わせ</button>`;
      }
    } else {
      // desc
      innerHTML += `<button class="reveal-btn" id="revbtn-${idx}" onclick="revealDesc(${idx})" ${answered[idx] ? 'style="display:none"' : ''}>▶ 解答を見る</button>`;
    }

    // 解答ボックス
    innerHTML += `<div class="answer-box ${answered[idx] ? 'show' : ''}" id="ans-${idx}">
      <div class="answer-label">正答・解説</div>
      <div class="answer-text">${q.a}</div>
    </div>`;

    // 注意書き
    if (q.note) {
      innerHTML += `<div class="note-box ${answered[idx] ? 'show' : ''}" id="note-${idx}">${q.note}</div>`;
    }

    // 自己採点（desc・multi確定後）
    if (q.type === 'desc' || (q.type === 'multi' && answered[idx])) {
      const scored = results[idx];
      innerHTML += `<div class="self-score ${answered[idx] ? 'show' : ''}" id="self-${idx}">
        <button class="score-btn ok" onclick="setSelf(${idx},'ok')" ${scored ? 'disabled' : ''}>✅ できた</button>
        <button class="score-btn ng" onclick="setSelf(${idx},'ng')" ${scored ? 'disabled' : ''}>❌ 要復習</button>
      </div>`;
      if (scored) {
        innerHTML += `<div class="result-badge show ${scored === 'ok' ? 'badge-ok' : 'badge-ng'}">${scored === 'ok' ? '✅ できた！' : '❌ 要復習'}</div>`;
      }
    }

    card.innerHTML = innerHTML;
    wrap.appendChild(card);

    // OX: クラス反映
    if (q.type === 'ox' && answered[idx]) {
      setTimeout(() => {
        const oBtn = document.getElementById(`ox-o-${idx}`);
        const xBtn = document.getElementById(`ox-x-${idx}`);
        if (oBtn && xBtn) {
          if (q.correct === '○') { oBtn.classList.add('correct'); if (answered[idx] === '×') xBtn.classList.add('wrong'); }
          else { xBtn.classList.add('correct'); if (answered[idx] === '○') oBtn.classList.add('wrong'); }
        }
      }, 0);
    }
  });
  updateProgress();
}

// multiの選択状態（描画前に保持）
let multiSelected = {};

function toggleMulti(idx, oi) {
  if (!multiSelected[idx]) multiSelected[idx] = [];
  const sel = multiSelected[idx];
  const pos = sel.indexOf(oi);
  if (pos === -1) sel.push(oi);
  else sel.splice(pos, 1);
  // ボタンのスタイル更新
  const btns = document.querySelectorAll(`#multi-${idx} .option-btn`);
  btns.forEach((b, bi) => {
    b.style.background = sel.includes(bi) ? 'var(--primary-light)' : '';
    b.style.borderColor = sel.includes(bi) ? 'var(--primary)' : '';
  });
}

function submitMulti(idx) {
  const q = questions[idx];
  const sel = multiSelected[idx] || [];
  answered[idx] = sel;
  // 正誤表示
  const btns = document.querySelectorAll(`#multi-${idx} .option-btn`);
  btns.forEach((b, bi) => {
    b.disabled = true;
    b.style.background = '';
    b.style.borderColor = '';
    if (q.correct.includes(bi)) b.classList.add('correct');
    else if (sel.includes(bi)) b.classList.add('wrong');
  });
  // 解答ボックス
  document.getElementById(`ans-${idx}`).classList.add('show');
  if (q.note) document.getElementById(`note-${idx}`)?.classList.add('show');
  // 自己採点ボタン追加
  const selfDiv = document.createElement('div');
  selfDiv.className = 'self-score show';
  selfDiv.id = `self-${idx}`;
  selfDiv.innerHTML = `<button class="score-btn ok" onclick="setSelf(${idx},'ok')">✅ できた</button><button class="score-btn ng" onclick="setSelf(${idx},'ng')">❌ 要復習</button>`;
  document.getElementById(`card-${idx}`).appendChild(selfDiv);
  // 答え合わせボタン非表示
  const revBtn = document.getElementById(`card-${idx}`)?.querySelector('.reveal-btn');
  if (revBtn) revBtn.style.display = 'none';
  document.getElementById(`card-${idx}`).classList.add('revealed');
  updateProgress();
}

function answerOX(idx, val) {
  const q = questions[idx];
  answered[idx] = val;
  const oBtn = document.getElementById(`ox-o-${idx}`);
  const xBtn = document.getElementById(`ox-x-${idx}`);
  oBtn.disabled = true; xBtn.disabled = true;
  if (q.correct === '○') { oBtn.classList.add('correct'); if (val === '×') xBtn.classList.add('wrong'); }
  else { xBtn.classList.add('correct'); if (val === '○') oBtn.classList.add('wrong'); }
  // 正誤を自動記録
  results[idx] = val === q.correct ? 'ok' : 'ng';
  document.getElementById(`ans-${idx}`).classList.add('show');
  if (q.note) document.getElementById(`note-${idx}`)?.classList.add('show');
  // 結果バッジ
  const badge = document.createElement('div');
  badge.className = `result-badge show ${results[idx] === 'ok' ? 'badge-ok' : 'badge-ng'}`;
  badge.textContent = results[idx] === 'ok' ? '✅ 正解！' : '❌ 不正解';
  document.getElementById(`card-${idx}`).appendChild(badge);
  document.getElementById(`card-${idx}`).classList.add('revealed');
  updateScore(); updateProgress();
}

function answerChoice(idx, oi) {
  const q = questions[idx];
  answered[idx] = oi;
  results[idx] = oi === q.correct ? 'ok' : 'ng';
  const btns = document.querySelectorAll(`#card-${idx} .option-btn`);
  btns.forEach((b, bi) => {
    b.disabled = true;
    if (bi === q.correct) b.classList.add('correct');
    else if (bi === oi) b.classList.add('wrong');
  });
  document.getElementById(`ans-${idx}`).classList.add('show');
  if (q.note) document.getElementById(`note-${idx}`)?.classList.add('show');
  const badge = document.createElement('div');
  badge.className = `result-badge show ${results[idx] === 'ok' ? 'badge-ok' : 'badge-ng'}`;
  badge.textContent = results[idx] === 'ok' ? '✅ 正解！' : '❌ 不正解';
  document.getElementById(`card-${idx}`).appendChild(badge);
  document.getElementById(`card-${idx}`).classList.add('revealed');
  updateScore(); updateProgress();
}

function revealDesc(idx) {
  answered[idx] = true;
  document.getElementById(`ans-${idx}`).classList.add('show');
  const note = document.getElementById(`note-${idx}`);
  if (note) note.classList.add('show');
  document.getElementById(`revbtn-${idx}`).style.display = 'none';
  // 自己採点
  const selfDiv = document.createElement('div');
  selfDiv.className = 'self-score show';
  selfDiv.id = `self-${idx}`;
  selfDiv.innerHTML = `<button class="score-btn ok" onclick="setSelf(${idx},'ok')">✅ できた</button><button class="score-btn ng" onclick="setSelf(${idx},'ng')">❌ 要復習</button>`;
  document.getElementById(`card-${idx}`).appendChild(selfDiv);
  document.getElementById(`card-${idx}`).classList.add('revealed');
  updateProgress();
}

function setSelf(idx, val) {
  results[idx] = val;
  const selfDiv = document.getElementById(`self-${idx}`);
  if (selfDiv) { selfDiv.querySelectorAll('button').forEach(b => b.disabled = true); }
  const badge = document.createElement('div');
  badge.className = `result-badge show ${val === 'ok' ? 'badge-ok' : 'badge-ng'}`;
  badge.textContent = val === 'ok' ? '✅ できた！' : '❌ 要復習';
  document.getElementById(`card-${idx}`).appendChild(badge);
  updateScore();
}

function updateScore() {
  const total = Object.keys(results).length;
  const ok = Object.values(results).filter(v => v === 'ok').length;
  const pct = total > 0 ? Math.round(ok / total * 100) : 0;
  document.getElementById('scoreNum').textContent = pct + '%';
  document.getElementById('scoreText').textContent = total > 0 ? `${ok} / ${total} 問正解` : 'まだ採点していません';
  // サークル
  const circle = document.getElementById('scoreCircle');
  circle.style.background = `conic-gradient(var(--primary) ${pct * 3.6}deg, var(--border) 0deg)`;
}

function updateProgress() {
  const done = Object.keys(answered).length;
  const total = questions.length;
  const pct = Math.round(done / total * 100);
  document.getElementById('progressText').textContent = `${done} / ${total} 問 回答済み`;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function resetAll() {
  if (!confirm('全ての回答をリセットしますか？')) return;
  results = {}; answered = {}; multiSelected = {};
  renderCards();
  updateScore();
}

init();
</script>
</body>
</html>
