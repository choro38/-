<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学総論 記述テスト対策｜さや専用</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --card: #21253a;
    --border: #2e3350;
    --accent: #5b8dee;
    --accent2: #e05c8a;
    --accent3: #4ecba8;
    --warn: #f5a623;
    --text: #e8eaf6;
    --text-dim: #8892b0;
    --correct: #4ecba8;
    --star: #f5c518;
    --red: #e05c8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    line-height: 1.7;
  }

  header {
    background: linear-gradient(135deg, #141728 0%, #1a2040 100%);
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    letter-spacing: .04em;
    background: linear-gradient(90deg, var(--accent), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }
  header p { font-size: .78rem; color: var(--text-dim); margin-top: 3px; }

  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 80px; }

  .intro-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    font-size: .85rem;
    color: var(--text-dim);
    line-height: 1.8;
  }
  .intro-box strong { color: var(--accent3); }

  /* カテゴリタブ */
  #filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .tab-btn {
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: .8rem;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  .tab-btn.active, .tab-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 問題カード */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 20px;
    overflow: hidden;
    transition: all .2s;
  }
  .q-card:hover { border-color: var(--accent); }

  .q-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .q-num {
    font-size: .75rem;
    font-weight: 700;
    color: var(--text-dim);
    background: var(--surface);
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--border);
  }
  .q-badge {
    font-size: .72rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 99px;
  }
  .badge-1 { background: rgba(91,141,238,.15); color: var(--accent); border: 1px solid rgba(91,141,238,.3); }
  .badge-23 { background: rgba(78,203,168,.15); color: var(--accent3); border: 1px solid rgba(78,203,168,.3); }
  .badge-4 { background: rgba(245,166,35,.15); color: var(--warn); border: 1px solid rgba(245,166,35,.3); }
  .badge-5 { background: rgba(224,92,138,.15); color: var(--red); border: 1px solid rgba(224,92,138,.3); }
  .star-badge {
    color: var(--star);
    font-size: .85rem;
  }

  .q-title {
    padding: 14px 20px 12px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    line-height: 1.5;
  }
  .q-subtitle {
    padding: 0 20px 14px;
    font-size: .82rem;
    color: var(--text-dim);
  }

  /* 記述欄 */
  .answer-area {
    padding: 0 20px 16px;
  }
  .answer-area label {
    font-size: .78rem;
    color: var(--text-dim);
    display: block;
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: .88rem;
    padding: 10px 12px;
    resize: vertical;
    min-height: 90px;
    line-height: 1.7;
    transition: border-color .2s;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* ボタン */
  .btn-row {
    display: flex;
    gap: 10px;
    padding: 0 20px 16px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 7px 18px;
    border-radius: 8px;
    border: none;
    font-size: .82rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-check { background: var(--accent); color: #fff; }
  .btn-clear { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .btn:hover { opacity: .85; transform: translateY(-1px); }

  /* 模範解答 */
  .model-answer {
    display: none;
    margin: 0 20px 16px;
    background: rgba(78,203,168,.07);
    border: 1px solid rgba(78,203,168,.25);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .model-answer.show { display: block; }
  .model-answer h4 {
    font-size: .78rem;
    color: var(--accent3);
    font-weight: 700;
    margin-bottom: 10px;
    letter-spacing: .05em;
  }
  .model-answer p {
    font-size: .85rem;
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 8px;
  }
  .model-answer p:last-child { margin-bottom: 0; }
  .model-answer .kw {
    background: rgba(91,141,238,.2);
    color: #8ab4f8;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
  }
  .model-answer .step {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 6px;
    font-size: .85rem;
    line-height: 1.75;
  }
  .step-num {
    background: var(--accent);
    color: #fff;
    font-size: .7rem;
    font-weight: 700;
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 3px;
    flex-shrink: 0;
  }
  .model-answer .note {
    font-size: .78rem;
    color: var(--text-dim);
    border-top: 1px solid rgba(78,203,168,.2);
    margin-top: 10px;
    padding-top: 10px;
  }
  .point-table {
    width: 100%;
    border-collapse: collapse;
    font-size: .82rem;
    margin: 8px 0;
  }
  .point-table th {
    background: rgba(91,141,238,.15);
    color: var(--accent);
    padding: 5px 8px;
    text-align: left;
    font-size: .75rem;
  }
  .point-table td {
    padding: 5px 8px;
    border-bottom: 1px solid rgba(46,51,80,.7);
    color: var(--text);
    vertical-align: top;
  }

  /* 非表示切替 */
  .q-card.hidden { display: none; }

  /* まとめボタン */
  #global-ctrl {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    font-size: .83rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all .2s;
  }
  .ctrl-btn.primary { background: var(--accent3); color: #0a2920; }
  .ctrl-btn.secondary { background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); }
  .ctrl-btn:hover { opacity: .85; }

  /* スコア */
  #scorebar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 18px;
    margin-bottom: 20px;
    display: flex;
    gap: 18px;
    align-items: center;
    flex-wrap: wrap;
    font-size: .82rem;
  }
  #scorebar span { font-weight: 700; font-size: 1rem; }
  .sc-done span { color: var(--accent3); }
  .sc-total span { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>✏️ 医学総論 記述テスト対策</h1>
  <p>試験配点：記述30点（1問）＋選択60点＋出席10点｜さや専用</p>
</header>

<main>

  <div class="intro-box">
    <strong>使い方：</strong>各テーマの問いを読んで、テキストエリアに自分なりの答えを書く →「模範解答を見る」で確認。★は出題可能性が高いテーマです。<br>
    ⑦回目はテスト範囲外のため収録していません。
  </div>

  <div id="scorebar">
    <div class="sc-done">確認済み：<span id="cnt-done">0</span></div>
    <div class="sc-total">全テーマ：<span id="cnt-total">0</span></div>
  </div>

  <div id="filter-tabs">
    <button class="tab-btn active" onclick="filterCards('all')">すべて</button>
    <button class="tab-btn" onclick="filterCards('①')">①細胞・水分</button>
    <button class="tab-btn" onclick="filterCards('②③')">②③遺伝・感染</button>
    <button class="tab-btn" onclick="filterCards('④')">④循環器・呼吸器</button>
    <button class="tab-btn" onclick="filterCards('⑤')">⑤腫瘍・老化・栄養</button>
  </div>

  <div id="global-ctrl">
    <button class="ctrl-btn primary" onclick="showAll()">全テーマの解答を一括表示</button>
    <button class="ctrl-btn secondary" onclick="resetAll()">リセット</button>
  </div>

  <div id="quiz-container"></div>

</main>

<script>
const QUESTIONS = [

  // ──────── ① 細胞・水分 ────────
  {
    id: 1, unit: '①', star: true,
    title: '高齢者が脱水症状になりやすい機序・理由を説明しなさい',
    hint: '①細胞内水分量の減少 ②水分摂取の減少 ③腎機能の低下 ④代謝水の産出低下　の4つの観点から書くと完璧！',
    answer: `<h4>★ 模範解答：高齢者の脱水機序（4つのポイント）</h4>

<div class="step"><div class="step-num">1</div><div>
<span class="kw">細胞内水分量の減少（加齢に伴う）</span><br>
加齢により細胞数が減少し、特に筋肉・脂肪組織などの貯蔵水分量が低下する。体水分量は胎児90%→新生児75%→成人男性65%→老人50%と加齢とともに減少する。
</div></div>

<div class="step"><div class="step-num">2</div><div>
<span class="kw">水分摂取の減少</span><br>
中枢神経機能の低下による<strong>口渇感の衰弱</strong>（のどが渇いても感じにくくなる）。また頻尿・尿失禁を恐れての飲水制限、嚥下障害による飲水制限、食欲低下を来す基礎疾患も関与する。
</div></div>

<div class="step"><div class="step-num">3</div><div>
<span class="kw">腎臓におけるNa保持機能の低下</span><br>
抗利尿ホルモン（バソプレシン：ADH）に対する反応性が低下し、腎臓内で水分の再吸収がうまく促されず大量の尿となる。腎濃縮力の減少→尿量が増える。
</div></div>

<div class="step"><div class="step-num">4</div><div>
<span class="kw">代謝水の産出低下</span><br>
代謝水は栄養素がエネルギーに変わる時に作られる体内で唯一産生できる水。高齢者は食欲低下・利尿薬の使用などで代謝水の産出も低下する。
</div></div>

<div class="note">💡 保育園で見た脱水：夏場に運動した後の高齢ボランティアさんが「のどが渇かない」と言っても積極的に水分補給を勧めていたのと同じ仕組みです！</div>`
  },

  {
    id: 2, unit: '①', star: true,
    title: '水の生理作用（生理的機能）を5つ挙げて説明しなさい',
    hint: '①溶媒 ②輸送 ③pH・浸透圧 ④化学反応の場 ⑤体温調節、の5つが基本！',
    answer: `<h4>★ 模範解答：水の5大生理作用</h4>
<table class="point-table">
<tr><th>#</th><th>作用</th><th>内容</th></tr>
<tr><td>①</td><td><span class="kw">溶媒（溶かす）</span></td><td>物質を溶かす溶媒として働く。電解質・栄養素・老廃物を溶解する</td></tr>
<tr><td>②</td><td><span class="kw">輸送（運ぶ）</span></td><td>栄養素や代謝産物（老廃物）を全身に運搬する</td></tr>
<tr><td>③</td><td><span class="kw">pH・浸透圧の調整</span></td><td>体液のpHバランスと浸透圧（細胞の水分量）を一定に保つ</td></tr>
<tr><td>④</td><td><span class="kw">化学反応の場</span></td><td>細胞内で行われる代謝（酵素反応）の場を提供する</td></tr>
<tr><td>⑤</td><td><span class="kw">体温調節</span></td><td>発汗・蒸発により熱を放散し体温を一定に保つ</td></tr>
</table>
<p>＊体中の約60%は水（老人は50%）。人は水なしでは数日で死ぬが、食事なしでは2週間〜1か月生きることができる。</p>`
  },

  {
    id: 3, unit: '①', star: true,
    title: '体水分量が多い順に正しく並べ、それぞれの割合を示しなさい',
    hint: '胎児・新生児・成人男性・成人女性・老人の5つ。割合も一緒に覚えよう！',
    answer: `<h4>★ 模範解答：体水分量の多い順</h4>
<table class="point-table">
<tr><th>順位</th><th>対象</th><th>体水分量</th></tr>
<tr><td>1位</td><td><span class="kw">胎児</span></td><td>約90%</td></tr>
<tr><td>2位</td><td><span class="kw">新生児</span></td><td>約75%</td></tr>
<tr><td>3位</td><td><span class="kw">成人男性</span></td><td>約65%</td></tr>
<tr><td>4位</td><td><span class="kw">成人女性</span></td><td>約60%</td></tr>
<tr><td>5位</td><td><span class="kw">老人</span></td><td>約50%</td></tr>
</table>
<div class="note">💡 加齢とともに筋肉量が減り脂肪が増える→水分量が低下。女性は男性より脂肪が多いため水分率が低い。体の60%は水！</div>`
  },

  // ──────── ②③ 遺伝・感染 ────────
  {
    id: 4, unit: '②③', star: true,
    title: 'ダウン症（Down syndrome）の染色体異常の発生機序と主な特徴を説明しなさい',
    hint: '21トリソミー・減数分裂の不分離・母親の高齢・特徴（外見・知的障害など）',
    answer: `<h4>★ 模範解答：ダウン症の発生機序と特徴</h4>

<div class="step"><div class="step-num">機序</div><div>
<span class="kw">21番染色体トリソミー（21 trisomy）</span><br>
通常46本（常染色体44本＋性染色体2本）の染色体が、21番染色体のみ3本になる（計47本）。<br>
原因：生殖細胞（精子・卵子）形成時の<strong>減数分裂における染色体不分離</strong>により発生。母親が高齢になるほど発生頻度が増加（40歳で1/100、35歳で1/300、20歳で1/2000程度）。
</div></div>

<div class="step"><div class="step-num">特徴</div><div>
<table class="point-table">
<tr><th>分類</th><th>特徴</th></tr>
<tr><td>顔貌・外見</td><td>目の距離が遠い・つり目がち・鼻が低い・体全体が小柄でやや肥満傾向</td></tr>
<tr><td>筋肉・関節</td><td>関節や筋肉の緊張が弱く体が柔らかい。動作がゆっくり</td></tr>
<tr><td>内臓</td><td>心臓の奇形（先天性心疾患）を合併することが多い</td></tr>
<tr><td>知的発達</td><td>知的障害あり（単純作業は可能）。自立生活は困難なことが多い</td></tr>
</table>
</div></div>
<div class="note">💡 常染色体異常（ダウン症）は知的障害あり。性染色体異常（ターナー・クラインフェルター）は知的障害なし、という違いも重要！</div>`
  },

  {
    id: 5, unit: '②③', star: true,
    title: 'ターナー症候群（Turner syndrome）とクラインフェルター症候群（Klinefelter syndrome）をそれぞれ説明しなさい',
    hint: '染色体構成・性別・特徴の違いを整理して書く！',
    answer: `<h4>★ 模範解答：性染色体異常の2疾患</h4>
<table class="point-table">
<tr><th>項目</th><th>ターナー症候群</th><th>クラインフェルター症候群</th></tr>
<tr><td>染色体</td><td><span class="kw">45, XO（モノソミー）</span></td><td><span class="kw">47, XXY（トリソミー）</span></td></tr>
<tr><td>表現型</td><td>女性</td><td>男性</td></tr>
<tr><td>特徴</td><td>卵巣の形成不全（卵巣が小さい）・低身長・翼状頚・外反肘</td><td>体型は高身長・女性化乳房・精巣は小さく精子は作れない→生殖不能</td></tr>
<tr><td>知的障害</td><td>なし（ゆっくりだが理解でき学校についていける）</td><td>なし（多くは軽度知能障害）</td></tr>
<tr><td>生殖</td><td>無月経・不妊</td><td>生殖不能（精子形成不全）</td></tr>
</table>`
  },

  {
    id: 6, unit: '②③', star: true,
    title: '血友病（hemophilia）はどのような遺伝形式か。なぜ男性に多いかを含めて説明しなさい',
    hint: 'X連鎖劣性遺伝・保因者（女性）・男性は1コピーで発症',
    answer: `<h4>★ 模範解答：血友病の遺伝形式</h4>

<div class="step"><div class="step-num">遺伝形式</div><div>
<span class="kw">X染色体連鎖劣性遺伝（X-linked recessive inheritance）</span><br>
別名：伴性（伴X性）劣性遺伝。
</div></div>

<div class="step"><div class="step-num">なぜ男性に多いか</div><div>
・女性の染色体：<strong>XX</strong>→片方のXに変異があっても、もう片方の正常なXが補う→<strong>保因者（発症せず）</strong><br>
・男性の染色体：<strong>XY</strong>→Xが1本しかないため、変異があれば必ず発症する<br>
→ そのため<strong>男性のみが発症し、女性は保因者</strong>となることが多い
</div></div>

<div class="step"><div class="step-num">疾患の特徴</div><div>
凝固因子（第VIII因子または第IX因子）が欠乏し、出血が止まりにくくなる疾患。
</div></div>`
  },

  {
    id: 7, unit: '②③', star: true,
    title: 'HIV（ヒト免疫不全ウイルス）がAIDS（後天性免疫不全症候群）を引き起こす機序を説明しなさい',
    hint: 'CD4陽性Tリンパ球（ヘルパーT細胞）→破壊→免疫崩壊→日和見感染',
    answer: `<h4>★ 模範解答：HIV→AIDSの機序</h4>

<div class="step"><div class="step-num">1</div><div>
HIV（Human Immunodeficiency Virus）は<span class="kw">CD4陽性Tリンパ球（ヘルパーT細胞）</span>に感染・破壊する。
</div></div>

<div class="step"><div class="step-num">2</div><div>
ヘルパーT細胞はキラーT細胞・B細胞に「攻撃命令」を送る司令塔。これが破壊されると<span class="kw">体液性免疫（B細胞→抗体）と細胞性免疫（キラーT細胞）の両方が停止</span>する。
</div></div>

<div class="step"><div class="step-num">3</div><div>

</div></div>

<p>感染経路：血液媒介（輸血・血液製剤）・母子感染・性的接触<br>
潜伏期間：7〜8年。HIV抗体があるだけではAIDSとは呼ばない（指標疾患1つ以上の発生が必要）。</p>
<div class="note">💡 ヘルパーT細胞は胸腺で産生されるが、胸腺は5〜6歳頃に体内から消滅→補充できない！</div>`

let doneSet = new Set();
let currentFilter = 'all';

function renderCards() {
  const container = document.getElementById('quiz-container');
  container.innerHTML = '';
  document.getElementById('cnt-total').textContent = QUESTIONS.length;
  updateScore();

  QUESTIONS.forEach(q => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.dataset.unit = q.unit;
    card.id = `card-${q.id}`;

    const badgeClass = {
      '①': 'badge-1',
      '②③': 'badge-23',
      '④': 'badge-4',
      '⑤': 'badge-5'
    }[q.unit] || 'badge-1';

    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${q.id}</span>
        <span class="q-badge ${badgeClass}">${q.unit}</span>
        ${q.star ? '<span class="star-badge" title="出題可能性高">★ 出題頻度高</span>' : ''}
      </div>
      <div class="q-title">${q.title}</div>
      <div class="q-subtitle">💬 ヒント：${q.hint}</div>
      <div class="answer-area">
        <label>あなたの解答を書いてみよう</label>
        <textarea id="ta-${q.id}" placeholder="ここに記述してみましょう…"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-check" onclick="showAnswer(${q.id})">模範解答を見る</button>
        <button class="btn btn-clear" onclick="clearAnswer(${q.id})">クリア</button>
      </div>
      <div class="model-answer" id="ans-${q.id}">
        ${q.answer}
      </div>
    `;
    container.appendChild(card);
  });

  applyFilter();
}

function showAnswer(id) {
  const el = document.getElementById(`ans-${id}`);
  el.classList.add('show');
  doneSet.add(id);
  updateScore();
}

function clearAnswer(id) {
  document.getElementById(`ta-${id}`).value = '';
  const el = document.getElementById(`ans-${id}`);
  el.classList.remove('show');
  doneSet.delete(id);
  updateScore();
}

function showAll() {
  QUESTIONS.forEach(q => {
    document.getElementById(`ans-${q.id}`).classList.add('show');
    doneSet.add(q.id);
  });
  updateScore();
}

function resetAll() {
  QUESTIONS.forEach(q => {
    document.getElementById(`ta-${q.id}`).value = '';
    document.getElementById(`ans-${q.id}`).classList.remove('show');
  });
  doneSet.clear();
  updateScore();
}

function filterCards(unit) {
  currentFilter = unit;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  applyFilter();
}

function applyFilter() {
  QUESTIONS.forEach(q => {
    const card = document.getElementById(`card-${q.id}`);
    if (currentFilter === 'all' || q.unit === currentFilter) {
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
    }
  });
}

function updateScore() {
  document.getElementById('cnt-done').textContent = doneSet.size;
  document.getElementById('cnt-total').textContent = QUESTIONS.length;
}

renderCards();
</script>
