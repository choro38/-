<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言語学 授業内テスト対策</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap');

  :root {
    --bg: #F0F4FF;
    --card: #FFFFFF;
    --primary: #3B5BDB;
    --primary-light: #E8EDFF;
    --accent: #F76707;
    --accent-light: #FFF4E6;
    --correct: #2F9E44;
    --correct-light: #EBFBEE;
    --wrong: #C92A2A;
    --wrong-light: #FFF5F5;
    --text: #1A1A2E;
    --text-sub: #555577;
    --border: #D0D8FF;
    --tag-bg: #EEF1FF;
    --shadow: 0 2px 12px rgba(59,91,219,0.10);
    --radius: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  /* ===== ヘッダー ===== */
  header {
    background: var(--primary);
    color: #fff;
    padding: 18px 24px 14px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(59,91,219,0.18);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .04em; }
  header p  { font-size: .78rem; opacity: .82; margin-top: 2px; }

  /* ===== 進捗バー ===== */
  #progress-wrap {
    background: var(--card);
    padding: 12px 20px 10px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  #progress-bar-bg {
    flex: 1; height: 8px; background: var(--border); border-radius: 99px; overflow: hidden;
  }
  #progress-bar {
    height: 100%; background: var(--primary); border-radius: 99px;
    transition: width .4s ease;
  }
  #progress-text { font-size: .78rem; color: var(--text-sub); white-space: nowrap; min-width: 60px; text-align: right; }

  /* ===== スコアバッジ ===== */
  #score-badges {
    display: flex; gap: 10px; padding: 10px 20px 8px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  .badge {
    display: flex; align-items: center; gap: 5px;
    font-size: .78rem; font-weight: 700; padding: 3px 10px;
    border-radius: 99px; border: 1.5px solid;
  }
  .badge.ok  { color: var(--correct); border-color: var(--correct); background: var(--correct-light); }
  .badge.ng  { color: var(--wrong);   border-color: var(--wrong);   background: var(--wrong-light); }
  .badge.rem { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }

  /* ===== フィルタータブ ===== */
  #filter-row {
    display: flex; gap: 6px; padding: 10px 20px 8px;
    background: var(--card); border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  #filter-row::-webkit-scrollbar { display: none; }
  .filter-btn {
    white-space: nowrap; padding: 5px 14px;
    border: 1.5px solid var(--border); border-radius: 99px;
    background: #fff; color: var(--text-sub); font-size: .78rem;
    cursor: pointer; font-family: inherit; transition: all .15s;
  }
  .filter-btn.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
  }

  /* ===== カードリスト ===== */
  #card-list {
    padding: 16px; display: flex; flex-direction: column; gap: 16px;
    max-width: 800px; margin: 0 auto;
  }

  /* ===== 問題カード ===== */
  .q-card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1.5px solid var(--border);
    overflow: hidden; transition: box-shadow .2s;
  }
  .q-card.answered-ok { border-color: var(--correct); }
  .q-card.answered-ng { border-color: var(--wrong); }

  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px 0;
  }
  .q-num {
    background: var(--primary); color: #fff;
    font-size: .72rem; font-weight: 700; border-radius: 6px;
    padding: 2px 8px; min-width: 34px; text-align: center;
  }
  .q-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .q-tag {
    background: var(--tag-bg); color: var(--primary);
    font-size: .7rem; padding: 2px 8px; border-radius: 99px;
    border: 1px solid var(--border);
  }
  .q-tag.star { background: var(--accent-light); color: var(--accent); border-color: #FFD8B0; }

  .q-text {
    padding: 10px 16px 12px;
    font-size: .93rem; font-weight: 700; line-height: 1.6;
  }

  /* ===== 選択肢 ===== */
  .choices { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 7px; }
  .choice-btn {
    width: 100%; text-align: left;
    padding: 9px 14px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--bg);
    font-size: .86rem; font-family: inherit; color: var(--text);
    cursor: pointer; line-height: 1.5;
    transition: background .12s, border-color .12s;
  }
  .choice-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
  .choice-btn.correct { background: var(--correct-light); border-color: var(--correct); color: var(--correct); font-weight: 700; }
  .choice-btn.wrong   { background: var(--wrong-light);   border-color: var(--wrong);   color: var(--wrong); }
  .choice-btn:disabled { cursor: default; }

  /* ===== 記述式 ===== */
  .desc-area {
    padding: 0 14px 10px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .desc-area textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1.5px solid var(--border); font-family: inherit;
    font-size: .86rem; resize: vertical; min-height: 70px;
    background: var(--bg); color: var(--text);
  }
  .desc-area textarea:focus { outline: none; border-color: var(--primary); }
  .desc-submit {
    align-self: flex-start; padding: 7px 20px;
    background: var(--primary); color: #fff; border: none;
    border-radius: 99px; font-family: inherit; font-size: .84rem;
    cursor: pointer; font-weight: 700;
  }
  .desc-submit:hover { background: #2848c8; }

  /* ===== 解説パネル ===== */
  .explanation {
    margin: 0 14px 14px; padding: 12px 14px;
    border-radius: 10px; font-size: .83rem; line-height: 1.7;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation.ok-exp { background: var(--correct-light); border-left: 3px solid var(--correct); }
  .explanation.ng-exp { background: var(--wrong-light);   border-left: 3px solid var(--wrong); }
  .explanation .ans-label { font-weight: 700; margin-bottom: 4px; display: block; }
  .explanation .exp-body  { color: var(--text-sub); }

  /* ===== リセットボタン ===== */
  #reset-wrap {
    padding: 20px; text-align: center;
    max-width: 800px; margin: 0 auto;
  }
  #reset-btn {
    padding: 11px 32px; background: var(--accent); color: #fff;
    border: none; border-radius: 99px; font-size: .9rem;
    font-weight: 700; font-family: inherit; cursor: pointer;
    box-shadow: 0 2px 8px rgba(247,103,7,.25);
  }
  #reset-btn:hover { background: #e05c00; }

  /* ===== 完了バナー ===== */
  #done-banner {
    display: none; margin: 0 16px 16px;
    background: var(--primary); color: #fff;
    border-radius: var(--radius); padding: 18px 20px;
    text-align: center; max-width: 800px; margin: 0 auto 16px;
  }
  #done-banner h2 { font-size: 1.1rem; margin-bottom: 4px; }
  #done-banner p  { font-size: .86rem; opacity: .88; }
</style>
</head>
<body>

<header>
  <h1>📚 言語学 授業内テスト対策</h1>
  <p>全40問｜選択肢・解説つき</p>
</header>

<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
  <div id="progress-text">0 / 40</div>
</div>

<div id="score-badges">
  <div class="badge ok">✓ 正解 <span id="cnt-ok">0</span></div>
  <div class="badge ng">✗ 不正解 <span id="cnt-ng">0</span></div>
  <div class="badge rem">… 未回答 <span id="cnt-rem">40</span></div>
</div>

<div id="filter-row">
  <button class="filter-btn active" onclick="applyFilter('all')">すべて</button>
  <button class="filter-btn" onclick="applyFilter('unanswered')">未回答</button>
  <button class="filter-btn" onclick="applyFilter('wrong')">不正解</button>
  <button class="filter-btn" onclick="applyFilter('correct')">正解済み</button>
  <button class="filter-btn" onclick="applyFilter('star')">★頻出</button>
</div>

<div id="card-list"></div>
<div id="done-banner">
  <h2>🎉 全問回答完了！</h2>
  <p id="done-msg"></p>
</div>
<div id="reset-wrap">
  <button id="reset-btn" onclick="resetAll()">🔄 最初からやり直す</button>
</div>

// --- State ---
const state = {};
QUESTIONS.forEach(q => state[q.id] = { status: 'unanswered', selected: [] });

let currentFilter = 'all';

function getStatus(id) { return state[id].status; }

function updateCounts() {
  const ok  = QUESTIONS.filter(q => state[q.id].status === 'correct').length;
  const ng  = QUESTIONS.filter(q => state[q.id].status === 'wrong').length;
  const rem = QUESTIONS.length - ok - ng;
  const done = ok + ng;
  document.getElementById('cnt-ok').textContent  = ok;
  document.getElementById('cnt-ng').textContent  = ng;
  document.getElementById('cnt-rem').textContent = rem;
  document.getElementById('progress-bar').style.width = (done / QUESTIONS.length * 100) + '%';
  document.getElementById('progress-text').textContent = done + ' / ' + QUESTIONS.length;

  if (done === QUESTIONS.length) {
    const banner = document.getElementById('done-banner');
    banner.style.display = 'block';
    const pct = Math.round(ok / QUESTIONS.length * 100);
    document.getElementById('done-msg').textContent =
      `正解率 ${pct}%（${ok}問正解 / ${ng}問不正解）お疲れさま！`;
  }
}

function buildCard(q) {
  const s = state[q.id];
  const card = document.createElement('div');
  card.className = 'q-card';
  card.dataset.id = q.id;
  card.dataset.status = s.status;
  card.dataset.star = q.star ? '1' : '0';

  if (s.status === 'correct') card.classList.add('answered-ok');
  if (s.status === 'wrong')   card.classList.add('answered-ng');

  // head
  const head = document.createElement('div');
  head.className = 'card-head';
  head.innerHTML = `<span class="q-num">Q${q.id}</span><div class="q-tags"><span class="q-tag">${q.topic}</span>${q.star ? '<span class="q-tag star">★頻出</span>' : ''}</div>`;
  card.appendChild(head);

  // question
  const qt = document.createElement('div');
  qt.className = 'q-text';
  qt.textContent = q.q;
  card.appendChild(qt);

  // choices or desc
  if (q.type === 'single' || q.type === 'multi') {
    const wrap = document.createElement('div');
    wrap.className = 'choices';

    const labels = ['①','②','③','④','⑤'];
    q.choices.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = labels[i] + ' ' + c;
      btn.dataset.idx = i;

      if (s.status !== 'unanswered') {
        btn.disabled = true;
        if (q.correct.includes(i)) btn.classList.add('correct');
        else if (s.selected.includes(i)) btn.classList.add('wrong');
      }

      btn.addEventListener('click', () => handleChoice(q, btn, i, wrap));
      wrap.appendChild(btn);
    });

    // multi: 決定ボタン
    if (q.type === 'multi' && s.status === 'unanswered') {
      const submit = document.createElement('button');
      submit.className = 'desc-submit';
      submit.style.marginTop = '6px';
      submit.textContent = '回答する';
      submit.addEventListener('click', () => submitMulti(q, wrap, submit));
      wrap.appendChild(submit);
    }
    card.appendChild(wrap);
  } else {
    // desc
    const dw = document.createElement('div');
    dw.className = 'desc-area';
    if (s.status === 'unanswered') {
      const ta = document.createElement('textarea');
      ta.placeholder = 'ここに答えを書いてください…';
      const sb = document.createElement('button');
      sb.className = 'desc-submit';
      sb.textContent = '答えを確認する';
      sb.addEventListener('click', () => showDescAnswer(q, card));
      dw.appendChild(ta);
      dw.appendChild(sb);
    } else {
      dw.innerHTML = `<div style="font-size:.85rem;color:var(--text-sub);padding:6px 0;">（記述式：自己採点）</div>`;
    }
    card.appendChild(dw);
  }

  // explanation
  const exp = document.createElement('div');
  exp.className = 'explanation';
  if (s.status !== 'unanswered') {
    exp.classList.add('show');
    exp.classList.add(s.status === 'correct' ? 'ok-exp' : 'ng-exp');
  }
  exp.innerHTML = `<span class="ans-label">✅ 正解：${q.ans.replace(/\n/g,'<br>')}</span><span class="exp-body">${q.exp}</span>`;
  card.appendChild(exp);

  return card;
}

function handleChoice(q, btn, idx, wrap) {
  if (state[q.id].status !== 'unanswered') return;
  if (q.type === 'single') {
    state[q.id].selected = [idx];
    submitSingle(q, wrap);
  } else {
    // multi: toggle
    const sel = state[q.id].selected;
    const pos = sel.indexOf(idx);
    if (pos >= 0) {
      sel.splice(pos, 1);
      btn.style.background = '';
      btn.style.borderColor = '';
      btn.style.color = '';
    } else {
      sel.push(idx);
      btn.style.background = 'var(--primary-light)';
      btn.style.borderColor = 'var(--primary)';
      btn.style.color = 'var(--primary)';
    }
  }
}

function submitSingle(q, wrap) {
  const sel = state[q.id].selected;
  const ok = JSON.stringify(sel.slice().sort()) === JSON.stringify(q.correct.slice().sort());
  state[q.id].status = ok ? 'correct' : 'wrong';
  applyResult(q, wrap);
  finalizeCard(q);
}

function submitMulti(q, wrap, submitBtn) {
  const sel = state[q.id].selected;
  if (sel.length === 0) { alert('選択肢を選んでください'); return; }
  const ok = JSON.stringify(sel.slice().sort()) === JSON.stringify(q.correct.slice().sort());
  state[q.id].status = ok ? 'correct' : 'wrong';
  submitBtn.remove();
  applyResult(q, wrap);
  finalizeCard(q);
}

function applyResult(q, wrap) {
  wrap.querySelectorAll('.choice-btn').forEach(btn => {
    btn.disabled = true;
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
    const i = parseInt(btn.dataset.idx);
    if (q.correct.includes(i)) btn.classList.add('correct');
    else if (state[q.id].selected.includes(i)) btn.classList.add('wrong');
  });
}

function showDescAnswer(q, card) {
  state[q.id].status = 'correct'; // 記述は自己採点として正解扱い
  finalizeCard(q);
  // desc area update
  const dw = card.querySelector('.desc-area');
  dw.innerHTML = `<div style="font-size:.85rem;color:var(--text-sub);padding:6px 0;">（記述式：自己採点）</div>`;
}

function finalizeCard(q) {
  const card = document.querySelector(`.q-card[data-id="${q.id}"]`);
  if (!card) return;
  card.dataset.status = state[q.id].status;
  card.classList.remove('answered-ok','answered-ng');
  if (state[q.id].status === 'correct') card.classList.add('answered-ok');
  if (state[q.id].status === 'wrong')   card.classList.add('answered-ng');
  const exp = card.querySelector('.explanation');
  exp.classList.add('show');
  exp.classList.remove('ok-exp','ng-exp');
  exp.classList.add(state[q.id].status === 'correct' ? 'ok-exp' : 'ng-exp');
  updateCounts();
  applyFilter(currentFilter);
}

function applyFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.filter-btn').forEach(b => {
    if (b.getAttribute('onclick').includes(`'${f}'`)) b.classList.add('active');
  });

  const list = document.getElementById('card-list');
  list.innerHTML = '';
  const visible = QUESTIONS.filter(q => {
    if (f === 'all') return true;
    if (f === 'unanswered') return state[q.id].status === 'unanswered';
    if (f === 'wrong')      return state[q.id].status === 'wrong';
    if (f === 'correct')    return state[q.id].status === 'correct';
    if (f === 'star')       return q.star;
    return true;
  });
  visible.forEach(q => list.appendChild(buildCard(q)));

  if (visible.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-sub);font-size:.9rem;">該当する問題はありません</div>';
  }
}

function resetAll() {
  if (!confirm('本当に最初からやり直しますか？')) return;
  QUESTIONS.forEach(q => { state[q.id] = { status: 'unanswered', selected: [] }; });
  document.getElementById('done-banner').style.display = 'none';
  updateCounts();
  applyFilter('all');
}

// Init
updateCounts();
applyFilter('all');
</script>
</body>
