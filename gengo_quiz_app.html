<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言語学 過去問アプリ｜ST国試対策</title>
<style>
:root{--bg:#f0f4f8;--card:#fff;--pr:#2d6a9f;--pl:#e8f1fa;--ac:#e85d2f;--al:#fff0eb;--ok:#1a7f5a;--okl:#e6f7f1;--ng:#c0392b;--ngl:#fdecea;--tx:#1a202c;--mu:#6b7280;--bd:#d1dce8;--sh:0 2px 12px rgba(45,106,159,.10);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:60px;}
header{background:linear-gradient(135deg,#1b4f7a,#2d6a9f 60%,#3b82c4);color:#fff;padding:20px 16px 14px;text-align:center;}
header .sub{font-size:11px;letter-spacing:3px;opacity:.75;margin-bottom:4px;}
header h1{font-size:19px;font-weight:700;}
header .tag{margin-top:5px;font-size:11px;opacity:.8;}
.pw{background:rgba(255,255,255,.2);border-radius:4px;height:5px;margin:11px auto 0;max-width:280px;overflow:hidden;}
.pb{background:#7ecfff;height:100%;border-radius:4px;transition:width .4s;}
.pl{font-size:10px;opacity:.7;margin-top:3px;}
main{max-width:720px;margin:0 auto;padding:14px 12px;}
/* score */
.sb{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center;margin-bottom:13px;box-shadow:var(--sh);flex-wrap:wrap;}
.si{text-align:center;flex:1;min-width:50px;}
.sn{font-size:22px;font-weight:700;line-height:1;}
.sn.c{color:var(--ok);}.sn.w{color:var(--ng);}.sn.r{color:var(--pr);}
.sl{font-size:10px;color:var(--mu);margin-top:2px;}
.sd{width:1px;height:30px;background:var(--bd);}
.rb{padding:7px 12px;background:var(--al);border:1.5px solid var(--ac);border-radius:8px;color:var(--ac);font-size:11px;cursor:pointer;font-weight:500;margin-left:auto;}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px;}
.tab{padding:5px 11px;border:1.5px solid var(--bd);border-radius:18px;background:#fff;color:var(--mu);font-size:11px;cursor:pointer;font-weight:500;}
.tab.on{background:var(--pr);border-color:var(--pr);color:#fff;}
/* block tabs */
.btabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:13px;}
.btab{padding:5px 11px;border:1.5px solid var(--bd);border-radius:18px;background:#fff;color:var(--mu);font-size:11px;cursor:pointer;font-weight:500;}
.btab.on{color:#fff;}
.btab[data-b="1"].on{background:#2d6a9f;border-color:#2d6a9f;}
.btab[data-b="2"].on{background:#1a7f5a;border-color:#1a7f5a;}
.btab[data-b="3"].on{background:#7b3f9e;border-color:#7b3f9e;}
.btab[data-b="4"].on{background:#b5540b;border-color:#b5540b;}
.btab[data-b="5"].on{background:#b5200b;border-color:#b5200b;}
.btab[data-b="6"].on{background:#555;border-color:#555;}
/* card */
.qc{background:#fff;border:1.5px solid var(--bd);border-radius:12px;padding:15px;margin-bottom:11px;box-shadow:var(--sh);}
.qm{display:flex;align-items:center;gap:5px;margin-bottom:8px;flex-wrap:wrap;}
.qn{font-size:10px;font-weight:700;color:var(--pr);background:var(--pl);padding:2px 7px;border-radius:9px;}
.qcat{font-size:10px;color:var(--mu);background:#f3f4f6;padding:2px 7px;border-radius:9px;}
.star{font-size:10px;background:#fffbeb;border:1px solid #fcd34d;color:#92400e;padding:2px 6px;border-radius:9px;}
.ab{font-size:10px;margin-left:auto;padding:2px 7px;border-radius:9px;font-weight:600;}
.ab.ok{background:var(--okl);color:var(--ok);}.ab.ng{background:var(--ngl);color:var(--ng);}
.qt{font-size:14px;line-height:1.65;margin-bottom:12px;font-weight:500;}
.ml{font-size:11px;color:var(--ac);font-weight:600;margin-left:3px;}
.opts{display:flex;flex-direction:column;gap:6px;}
.ob{display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1.5px solid var(--bd);border-radius:9px;background:#fafbfc;cursor:pointer;text-align:left;font-size:13px;line-height:1.5;color:var(--tx);width:100%;}
.ob:hover:not([disabled]){border-color:var(--pr);background:var(--pl);color:var(--pr);}
.ob[disabled]{cursor:default;}
.ob.ok{border-color:var(--ok);background:var(--okl);color:var(--ok);font-weight:600;}
.ob.ng{border-color:var(--ng);background:var(--ngl);color:var(--ng);font-weight:600;}
.on2{font-weight:700;font-size:12px;min-width:16px;margin-top:1px;flex-shrink:0;}
.cbtn{margin-top:9px;padding:7px 18px;background:var(--pr);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;}
.exp{margin-top:11px;border-top:1px solid var(--bd);padding-top:10px;display:none;}
.exp.show{display:block;}
.eh{font-size:11px;font-weight:700;color:var(--pr);margin-bottom:4px;}
.eb{font-size:12px;line-height:1.75;color:#374151;}
.eb strong{color:var(--pr);}
.empty{text-align:center;padding:40px 16px;color:var(--mu);font-size:14px;}
.fin{background:var(--okl);border:2px solid var(--ok);border-radius:12px;padding:20px;text-align:center;margin-bottom:15px;display:none;}
.fin.show{display:block;}
.fin h2{font-size:18px;color:var(--ok);margin-bottom:4px;}
.fin p{color:#065f46;font-size:12px;}
.sh{font-size:12px;font-weight:700;padding:6px 10px;background:var(--pl);border-radius:7px;margin-bottom:8px;margin-top:4px;color:var(--pr);}
</style>
</head>
<body>
<header>
  <div class="sub">ST 国試対策</div>
  <h1>言語学 過去問アプリ</h1>
  <div class="tag">全6ブロック・第1〜26回収録 💪</div>

    <button class="tab" data-f="unanswered">未回答</button>

</main>

<script>
var Q=[
/* ==============================
   ブロック1：言語の一般的特徴
   ============================== */
{id:1,b:1,sec:"言語の一般的特徴",star:true,
 text:"【第1回 問題84】誤っているのはどれか。",
 opts:["言語とは、その言語の単語の集合のことである。","言語は、音素や形態素などいくつかのレベルの単位に分けることができる。","音声言語は、音素という単位が時間軸上に並んで成り立っているとみなせる。","どの言語も、文を成り立たせる仕組みとしての文法をもつ。","世界中の言語の数は、数千にのぼると言われている。"],
 ans:[0],multi:false,
 exp:"言語は<strong>語彙＋文法</strong>から成る。「単語の集合」では文法が含まれないので誤り。世界の言語数は<strong>6000〜7000</strong>と考えられている。正答1"},
{id:2,b:1,sec:"言語の一般的特徴",star:true,
 text:"【第2回 問題84】正しいのはどれか。",
 opts:["言語によっては音素・語など異なるレベルの言語単位を取り出すことができない。","言語単位や文法をもつ言語はヒトに特有ではない。","文法とは文を無数に作り出す仕組みと捉えることができる。","統語装置としての文法をもたない言語もある。","人類の進化史上、文字言語は音声言語よりも早く出現した。"],
 ans:[2],multi:false,
 exp:"<strong>文法＝文を無数に作り出す統語装置</strong>なので3は正しい。言語単位・文法はヒト固有（2は誤り）。書き言葉のない言語は存在するが話し言葉のない言語はない（5は誤り）。正答3"},
{id:3,b:1,sec:"言語の一般的特徴",star:false,
 text:"【第3回 問題84】誤っているのはどれか。",
 opts:["どの民族も言語を持つ。","どの言語も母音と子音を持つ。","どの言語も語や形態素を持つ。","どの言語も文を成立たせる仕組みとしての文法を持つ。","どの言語も文字を持つ。"],
 ans:[4],multi:false,
 exp:"<strong>文字（書き言葉）を持たない言語は存在する</strong>（例：かつてのアイヌ語）。1〜4は言語普遍性として正しい。正答5"},
{id:4,b:1,sec:"言語の一般的特徴",star:true,
 text:"【第3回 問題85】言語の単位を小さい順に並べたのはどれか。",
 opts:["音素＜音節＜語＜形態素＜文","音素＜音節＜形態素＜語＜文","音素＜形態素＜音節＜語＜文","音節＜音素＜語＜形態素＜文","音節＜音素＜形態素＜語＜文"],
 ans:[1],multi:false,
 exp:"正しい順序：<strong>音素＜音節＜形態素＜語＜文</strong>。音素・音節は表面のみに関わる単位。形態素は意味も担うため複合的で大きい。正答2"},
{id:5,b:1,sec:"言語の一般的特徴",star:true,
 text:"【第4回 問題87】どの言語も持つ性質として該当しないのはどれか。",
 opts:["音と意味との関係の恣意性","音声言語の時間的線条性","二重分節性","文を無数に作り出すことができる創造性","文字の表意性"],
 ans:[4],multi:false,
 exp:"<strong>文字の表意性</strong>は表意文字を有する言語にしか該当しない。話し言葉としてしか存在しない言語もある。1〜4はすべての言語の性質として正しい。正答5"},
{id:6,b:1,sec:"二重分節性",star:true,
 text:"【第5回 問題86】言語の二重分節性について正しいのはどれか。",
 opts:["線条性と階層性との二つの観点からの分節","音声レベルでの分節と文字レベルでの分節","音素への分節と音節への分節","形態素への分節と音素への分節","統語論と意味論との二つの観点からの分節"],
 ans:[3],multi:false,
 exp:"二重分節性とは<strong>第1次分節（文→形態素）と第2次分節（形態素の記号表現→音素）</strong>の2段階の分節のこと。正答4（★頻出）"},
{id:7,b:1,sec:"ラングとパロール",star:true,
 text:"【第6回 問題82】ラング（langue）について正しいのはどれか。",
 opts:["言語の個人的な側面を指す。","現実に使用されている日常の言語を指す。","その社会に共有されている言語知識を指す。","一回一回使われるものとしての言葉を指す。","歴史的な規範に基づく言語を指す。"],
 ans:[2],multi:false,
 exp:"ソシュール（Saussure、スイス・言語学者）の概念。<strong>ラング＝「ある言語の話し手が集団的に共有していると考えられる言語的知識」</strong>。パロール＝個人が実際に発した言葉。正答3（★頻出）"},
{id:8,b:1,sec:"言語記号の恣意性",star:true,
 text:"【第8回 問題84】言語の恣意性について正しいのはどれか。",
 opts:["音素やその組み合わせである語の数に制約がない。","語の意味が使用の文脈による影響を受け一定しない。","語の自由な組み合わせで新しい文を無限に産出できる。","音素レベルの分節と形態素レベルの分節に分かれる。","語の音と意味の結びつきに必然性がない。"],
 ans:[4],multi:false,
 exp:"<strong>言語記号の恣意性＝語の音（記号表現）と意味（記号内容）の結びつきに必然性がないこと</strong>。1は生産性、3は創造性、4は二重分節性の説明。正答5（★頻出）"},
{id:9,b:1,sec:"言語記号の恣意性",star:false,
 text:"【第9回 問題84】言語の恣意性の反例とされることがあるのはどれか。",
 opts:["類義語","外来語","翻訳語","合成語","擬音・擬態語"],
 ans:[4],multi:false,
 exp:"<strong>オノマトペ（擬音語・擬態語）</strong>は音と意味の間に何らかの必然性（有契性）が認められるため恣意性の反例とされる。正答5"},
{id:10,b:1,sec:"二重分節性",star:true,
 text:"【第10回 問題84】「限られた数の音を組合わせて語を作り、語をつなぎ合わせて文を作る」という言語の性質を表すのはどれか。",
 opts:["恣意性","二重分節","線状性","普遍文法","有契性"],
 ans:[1],multi:false,
 exp:"「限られた数の音（音素）を組合わせて形態素を作り（第2次分節）、語をつなぎ合わせて文を作る（第1次分節）」は<strong>二重分節性</strong>の説明。正答2（★頻出）"},
{id:11,b:1,sec:"言語の性質",star:false,
 text:"【第12回（午前）問題43】言語の性質として認められないのはどれか。",
 opts:["恣意性","線状性","反射性","二重性","有契性"],
 ans:[2],multi:false,
 exp:"<strong>反射性</strong>は言語の一般的性質として挙げられない。恣意性・線状性・二重性（二重分節性）・有契性はいずれも言語の性質。正答3"},
{id:12,b:1,sec:"言語の性質",star:false,
 text:"【第16回（午前）問題43】誤っているのはどれか。",
 opts:["音や単語が一次元に配列される性質を「線状性」という。","新たな単語や文を作り出す性質を「生産性」という。","意味するものと意味されるものとの間に必然的な関係がないことを「恣意性」という。","文が文脈中で適切に使用されているか否かの母語話者の直観的判断を「文法性判断」という。","文を形態素に、形態素を音素に分解できる性質を「二重分節性」という。"],
 ans:[3],multi:false,
 exp:"「文脈中で適切かどうかの判断」は<strong>語用論的適切性判断</strong>。<strong>文法性判断</strong>とは文脈なしに文が文法的かどうかを判断すること。正答4"},
{id:13,b:1,sec:"言語の生産性",star:false,
 text:"【第18回（午前）問題43】言語の「生産性」と最も関係の深いのはどれか。",
 opts:["線条性","規範性","共時性","二重分節性","言語変異"],
 ans:[3],multi:false,
 exp:"チョムスキー（Chomsky）の「言語の創造性＝生産性」は<strong>二重分節性</strong>（文は形態素の継起からなる）が必要。正答4"},
{id:14,b:1,sec:"有契性",star:true,
 text:"【第22回（午前）問題43】下線部について記号表現（能記）と記号内容（所記）との間に有契性がないのはどれか。",
 opts:["公園でわんわんを見たよ。","日々もんもんと暮らしている。","鐘がごーんと鳴った。","外からぼんぼんと音がする。","上の住民がどんどんとうるさい。"],
 ans:[1],multi:false,
 exp:"「わんわん」「ごーん」「ぼんぼん」「どんどん」は擬音語で有契性あり。<strong>「もんもん（悶々）」は漢語由来で擬音語・擬態語ではなく有契性がない</strong>。正答2（★頻出）"},
{id:15,b:1,sec:"言語的コミュニケーション",star:false,
 text:"【第24回（午前）問題51】言語的コミュニケーションについて誤っているのはどれか。",
 opts:["文字は記号の一種である。","伝達すべき意味内容のことをメッセージという。","受信した記号から意味を抽出することを符号化という。","文脈はコミュニケーションを構成する要素の一つである。","コード体系は言語間で異なる。"],
 ans:[2],multi:false,
 exp:"「受信した記号から意味を抽出する」操作は<strong>解読（decoding）</strong>。<strong>符号化（encoding）＝伝達すべき情報をコードを介して記号列に置き換えること</strong>。正答3"},
{id:16,b:1,sec:"擬音語・擬態語",star:false,
 text:"【第26回 問題43】擬態語を含むのはどれか。a.雷がごろごろと響く　b.ネコがのどをごろごろ鳴らしている　c.父が床にごろごろしている　d.目にゴミが入ってごろごろする　e.良い選手がごろごろいる",
 opts:["a, b, c","a, b, e","a, d, e","b, c, d","c, d, e"],
 ans:[4],multi:false,
 exp:"<strong>擬態語</strong>は非音響的な物事の状態・様子を感覚的に音声化したもの。c「床にごろごろ」・d「ゴミがごろごろ」・e「選手がごろごろ」が擬態語。a・bは音を模した擬音語。正答5"},

/* ==============================
   ブロック2：形態論
   ============================== */
{id:17,b:2,sec:"形態素の定義",star:true,
 text:"【第1回 問題85】形態素について誤っているのはどれか。",

{id:18,b:2,sec:"形態素の定義",star:true,
 text:"【第2回 問題85】意味をになう最小の言語単位はどれか。",
 opts:["音素","意義素","形態素","語（単語）","語彙"],
 ans:[2],multi:false,
 exp:"<strong>形態素＝意味を担う最小の言語単位＝最小の言語記号</strong>。意義素とは「発話の意味を『意味』、文の意味を『意義』と読んで区別した場合の文を構成する形態素の意味」を指す。正答3（★頻出）"},
{id:19,b:2,sec:"連濁",star:true,
 text:"【第3回 問題72】複合語形成において生じる音韻現象はどれか。",

{id:20,b:2,sec:"異形態",star:true,
 text:"【第4回 問題86】異形態の例はどれか。",
 opts:["「ころころ」と「ごろごろ」","「ほんだな」の「だな」と「たな」","「山」を表す「サン」と「やま」","「やまみち」と「さかみち」","「たべる」と「たべられる」"],
 ans:[1],multi:false,

{id:21,b:2,sec:"語の類型",star:true,
 text:"【第4回 問題89】類型論的に分類した場合、日本語はどれか。",

{id:22,b:2,sec:"形態素の分析",star:true,
 text:"【第5回 問題85】日本語の形態素の例で正しいのはどれか。",
 opts:["/s/","「しろ（白）」の「し」","「しろ（白）」","「しろさ（白さ）」","「しろくま（白熊）」"],
 ans:[2],multi:false,
 exp:"/s/は音素。「し」は単独で意味を持たない。<strong>「しろ（白）」は意味を有する最小の言語単位で1形態素</strong>。「しろさ」は「しろ」＋「-さ」の2形態素（派生語）。正答3"},
{id:23,b:2,sec:"青白さの形態素分析",star:false,
 text:"【第6回 問題86】「青白さ」における形態素として正しいのはどれか。",
 opts:["「青白さ」全体","「青白」と「さ」","「青白」の部分だけ","「青」と「白」と「さ」","「青」と「白」だけ"],

 exp:"「青白さ」は「青」＋「白」＋「さ」の3形態素。語根「青」＋語根「白」からなる「青白-」が<strong>派生基部</strong>で、派生接尾辞「-さ」が結合。正答4"},
{id:24,b:2,sec:"連濁",star:true,
 text:"【第7回 問題85】連濁の例はどれか。",

{id:25,b:2,sec:"形態素分析",star:true,
 text:"【第7回 問題86】「言語学を勉強する。」の形態素分析で誤っているのはどれか。",
 opts:["「言語」は自由形態素である。","「学」は自由形態素である。","「を」は拘束形態素である。","「勉強」は自由形態素である。","「する」は拘束形態素である。"],
 ans:[1],multi:false,
 exp:"<strong>「学」は「学府」「学がある」のように語として使用可能なので自由形態素</strong>（2は正しい→誤りではない）。「言語」は「言」＋「語」の複合語なので単一の自由形態素ではない（1は誤り）。「を」は単独では使えない拘束形態素（3は正しい）。「する」は拘束形態素的性格もあるが自由形態素でもある（5は正しい）。正答2（★頻出）"},
{id:26,b:2,sec:"使役受身の形態素分析",star:true,
 text:"【第8回 問題86】「調べさせられた」を構成する形態素は何個か。",
 opts:["3","4","5","6","7"],

 exp:"「調べさせられた」＝<strong>「調べ」（語幹）＋「させ」（使役）＋「られ」（受身）＋「た」（過去）</strong>の4形態素。同様の例「食べさせられた」「調べられた」「調べさせた」「調べさせられる」で練習を。正答2（★頻出）"},
{id:27,b:2,sec:"音便",star:true,
 text:"【第9回 問題89】「〜テ」形に活用したとき擦音便が現れるのはどれか。",
 opts:["切る","付く","着る","飛ぶ","食べる"],
 ans:[3],multi:false,
 exp:"動詞の音便形を判別するには中止形に「-て」を加えると判断できる。<strong>「飛ぶ」の中止形「飛び」→「飛んで」が撥音便</strong>（「び」→「ん」）。「切る」→「切って」（促音便）、「付く」→「付いて」（イ音便）。正答4（★頻出）"},
{id:28,b:2,sec:"可能動詞",star:true,
 text:"【第12回（午後）問題44】可能動詞が作れるのはどれか。",
 opts:["見る","好む","寝る","行く","降る"],

{id:29,b:2,sec:"形態素分析",star:false,
 text:"【第13回（午前）問題43】「約束しております」を形態素に分けたのはどれか。",

 ans:[4],multi:false,
 exp:"最も細かく分けると#jakusoku#si-te#or-i-mas-u#と分析可能。「約束」「し」「て」「おり」「ます」の5形態素が最も詳細な分析。正答5"},
{id:30,b:2,sec:"異形態",star:false,
 text:"【第13回（午前）問題44】下線部が異形態の関係にない組み合わせはどれか。",
 opts:["おおあめ（大雨）－こさめ（小雨）","あめもよう（雨模様）－こうりょう（降雨量）","あまやどり（雨宿り）－あめふり（雨降り）","さかや（酒屋）－さけかす（酒粕）","さかむし（酒蒸し）－あまざけ（甘酒）"],
 ans:[1],multi:false,

{id:31,b:2,sec:"ら抜き言葉",star:true,
 text:"【第13回（午後）問題44】「ら抜き言葉」でないのはどれか。",
 opts:["考えれる","切れる","食べれる","見れる","寝れる"],
 ans:[1],multi:false,
 exp:"ら抜き言葉＝<strong>母音語幹動詞の語幹＋られ＋る</strong>を終止形とする派生動詞のら脱落形。「切る」は命令形「切れ」とエ段で終わる<strong>子音語幹動詞</strong>なので「切れる」はら抜き言葉ではなく可能動詞。正答2（★頻出）"},
{id:32,b:2,sec:"子音語幹動詞",star:false,
 text:"【第14回（午後）問題43】子音語幹動詞（五段動詞）が存在しないのはどの行か。",
 opts:["か行","が行","さ行","ざ行","ば行"],

{id:33,b:2,sec:"異形態",star:false,
 text:"【第15回（午前）問題44】同一形態素を含まない組合せはどれか。",
 opts:["部屋－部室","眼鏡－金物","腐る－臭い","落ちる－落とす","おずおず－怖気づく（おじけづく）"],
 ans:[0],multi:false,

{id:34,b:2,sec:"異形態",star:true,
 text:"【第16回（午前）問題44】異形態に関する説明として適切でないのはどれか。",
 opts:["ら抜き可能形はその一例である。","同一音素の場合に限られる。","屈折、派生、複合、いずれにも現れ得る。","母語話者はその音韻的な違いが分かる。","表記上区別されないこともある。"],
 ans:[1],multi:false,

{id:35,b:2,sec:"可能動詞",star:false,
 text:"【第17回（午前）問題44】可能形として用いることができないのはどれか。",
 opts:["乗れる","取れる","立てる","見える","会える"],
 ans:[3],multi:false,
 exp:"可能動詞は意志的な動作・行為を指示する子音語幹動詞から作られる。<strong>「見える」は「見る」に対応する可能形ではなく</strong>、「見られる」（ら有り言葉）か「見れる」（ら抜き言葉）が可能形。正答4"},
{id:36,b:2,sec:"複合動詞",star:false,
 text:"【第17回（午前）問題45】複合動詞はどれか。",
 opts:["汗ばむ","寒がる","春めく","気付く","大人ぶる"],
 ans:[3],multi:false,
 exp:"複合動詞＝語幹が2つ以上の語根の結合からなる動詞。<strong>「気付く」は語幹「気付k-」が「気」と「付k-」の複合</strong>。「汗ばむ」「寒がる」「春めく」「大人ぶる」は派生動詞。正答4"},
{id:37,b:2,sec:"異形態",star:false,
 text:"【第18回（午前）問題44】同一形態素を含まないのはどれか。a.愛す－愛しい　b.教える－教わる　c.漬ける－浸かる（つかる）　d.座る－据える　e.押す－惜しい",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[1],multi:false,
 exp:"漢字の訓読みと音読みは同一形態素の異形態ではない（p.17）。「愛す」と「愛しい」の「あい」と「いとし」は別々の形態素、e「押す-」と「惜し-」の間には意味的関連なし。正答2"},
{id:38,b:2,sec:"母音語幹動詞",star:true,
 text:"【第18回（午後）問題43】母音語幹動詞でないのはどれか。",
 opts:["減る","寝る","出る","得る","似る"],
 ans:[0],multi:false,
 exp:"母音語幹動詞は命令形が「-ろ」か「-よ」で終わる。選択肢の命令形：1「減れ」2「寝ろ」3「出ろ」4「得ろ」5「似ろ」。<strong>「減る」だけが命令形がエ段（「減れ」）で終わる子音語幹動詞</strong>。正答1（★頻出）"},
{id:39,b:2,sec:"異形態",star:false,
 text:"【第20回（午前）問題44】「長雨（ながあめ）」の「あめ」と同一形態素の異形態であるのはどれか。a.雨合羽（あまがっぱ）　b.小雨（こさめ）　c.豪雨（ごうう）　d.五月雨（さみだれ）　e.水飴（みずあめ）",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[0],multi:false,
 exp:"異形態は記号内容（意味）が同一で音形が異なるもの。「長雨」の「あめ」と同じ「大気から水の滴が落下する気象現象」の意味を持ちながら音形が異なるのは<strong>a「雨合羽」の「あま」とb「小雨」の「さめ」</strong>。正答1"},
{id:40,b:2,sec:"ら抜き言葉",star:true,
 text:"【第21回（午前）問題45】「ら抜き言葉」はどれか。a.切れる　b.食べれる　c.見れる　d.踊れる　e.走れる",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[2],multi:false,
 exp:"ら抜き言葉は<strong>母音語幹動詞</strong>（命令形が-ろ/-よで終わる）から派生する。「食べる」「見る」は母音語幹動詞なので、「食べれる」「見れる」がら抜き言葉。「切る」「踊る」「走る」は子音語幹動詞なので「切れる」等はら抜き言葉ではなく可能動詞。正答3（★頻出）"},
{id:41,b:2,sec:"子音語幹動詞",star:false,
 text:"【第21回（午後）問題42】子音語幹動詞（五段活用動詞）はどれか。",
 opts:["帰る","落ちる","化ける","モテる","カビる"],
 ans:[0],multi:false,
 exp:"子音語幹動詞は命令形がエ段で終わる。「帰る」の命令形は「帰れ」→エ段で終わる<strong>子音語幹動詞</strong>。残りはすべて命令形「落ちろ」「化けろ」「モテろ」「カビろ」で母音語幹動詞。正答1"},
{id:42,b:2,sec:"重複",star:false,
 text:"【第23回（午前）問題44】形態論的プロセスとしての重複には完全重複と部分重複があるが、いずれでもないのはどれか。",
 opts:["やまやま","ひとびと","しんじん","つつく","あやや"],
 ans:[2],multi:false,
 exp:"完全重複＝形態素の全体の繰り返し（やまやま・ひとびと）。部分重複＝形態素の一部の繰り返し（つつく・あやや）。<strong>「しんじん（新人・信心・深甚・審尋）」は同じ形態素が繰り返されているわけではない</strong>。正答3"},
{id:43,b:2,sec:"語形成",star:false,
 text:"【第25回（午前）問題44】「高等学校」→「高校」と同じプロセスによる語形成はどれか。a.やった、学割が使える　b.今日は温度が低い　c.学校へ行くには道路を渡って行く　d.海水はしょっぱい　e.基地に空母が配備された",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[1],multi:false,
 exp:"「高等学校」→「高校」は刈り込み（clipping）というプロセス。同様に<strong>「学生割引」→「学割」（a）</strong>と<strong>「航空母艦」→「空母」（e）</strong>が刈り込みの例。正答2"},
{id:44,b:2,sec:"名詞派生",star:false,
 text:"【第26回 問題142】「み」が形容詞から名詞を派生しているのはどれか。a.重み　b.励み　c.好み　d.歩み　e.厚み",

{id:46,b:3,sec:"日本語の統語的特徴",star:true,

{id:47,b:3,sec:"母語獲得",star:false,

 opts:["ヒトという種に特有のものである。","一定の年齢までに基本的な習得は完成する。","周囲で話されている言語を資料として、習得する。","母語としては親と同じ言語を習得する。","同じ言語を習得する複数の個人の習得結果は、本質的な点では同じであるとみなせる。"],

{id:48,b:3,sec:"日本語の基本語順",star:true,

 opts:["OSV","SVO","OVS","VSO","SOV"],

{id:49,b:3,sec:"母語獲得",star:false,

{id:50,b:3,sec:"句構造",star:true,
 text:"【第3回 問題86】「言葉の回復を支える言語聴覚士」の統語構造として正しいのはどれか。",
 opts:["[言葉の[回復を[支える言語聴覚士]]]","[言葉の[[回復を支える]言語聴覚士]]","[[言葉の[回復を支える]]言語聴覚士]","[[[言葉の回復]を支える]言語聴覚士]"],
 ans:[3],multi:false,
 exp:"NPの主要部「言語聴覚士」と付加詞「言葉の回復を支える」に分かれ、さらに「言葉の回復を」と「支える」に分かれる。<strong>[[[言葉の回復]を支える]言語聴覚士]</strong>が正しい構造。正答4（★頻出）"},
{id:51,b:3,sec:"日本語の配列規則",star:false,
 text:"【第4回 問題90】日本語の配列上の規則性として誤っているのはどれか。",
 opts:["音配列の基本はCVである。","主語の位置は文頭である。","述語は文あるいは節の末尾に置かれる。","名詞を修飾する要素は名詞に先行する。","名詞の格を示す助詞が名詞の直後に置かれる。"],
 ans:[1],multi:false,
 exp:"日本語の主語の位置は文頭に固定されていない（かきまぜ語順）。2は誤り。他はすべて日本語の配列規則として正しい。正答2"},
{id:52,b:3,sec:"句構造分析",star:false,
 text:"【第6回 問題87】「白い犬と猫が私のペットだ」という文の構造として、あり得るのはどれか。a.[白い][[[犬と猫]が][私のペットだ]]　b.[白い][[犬と][[猫が][私のペットだ]]]　c.[[[白い][犬と猫]]が][私のペットだ]　d.[[[白い犬]と猫]が][私のペットだ]　e.[[白い犬]と][[猫が][私のペットだ]]",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[3],multi:false,
 exp:"「白い」が「犬と猫」全体を修飾する場合はc、「白い」が「犬」のみを修飾してdの構造となる。<strong>c, d</strong>がいずれもあり得る構造。正答4（★頻出）"},
{id:53,b:3,sec:"言語獲得理論",star:true,
 text:"【第6回 問題89】Chomskyの言語獲得理論に含まれないのはどれか。",
 opts:["大人の働き掛けがあれば文法を獲得できる。","言語の違いを超えて普遍文法が存在する。","文法知識は言語使用の知識から独立している。","言語獲得は生得的にプログラムされている。","特別な練習をしなくても文法規則を獲得する。"],
 ans:[0],multi:false,
 exp:"チョムスキー（Chomsky）の言語獲得理論では<strong>「大人の働き掛けがなくても文法を獲得できる（生得的）」</strong>とする。「大人の働き掛けがあれば」は行動主義的考え方で、チョムスキーの対極。正答1（★頻出）"},
{id:54,b:3,sec:"日本語の文の特徴",star:false,
 text:"【第7回 問題88】日本語文の文法的記述として誤っているのはどれか。",
 opts:["語順が格を表す。","基本語順はSOVである。","形容詞も述語となる。","述語に形態素を膠着的に付加できる。","述語以外の要素の語順変更が可能である。"],
 ans:[0],multi:false,
 exp:"日本語では<strong>格は語順ではなく格助詞によって表示される</strong>。「太郎が花子に飴を貰った」と「花子に太郎が飴を貰った」は語順が異なっても格関係は同じ。正答1（★頻出）"},
{id:55,b:3,sec:"句構造",star:false,
 text:"【第8回 問題88】「君の好きなあの赤い花」の統語構造として正しいのはどれか。",
 opts:["[[[君の好きな]あの赤い]花]","[君の[好きな][あの]赤い花]","[[君の好きな][あの赤い]花]","[[君の[好きなあの]]赤い花]","[[君の好きな][あの赤い花]]"],
 ans:[2],multi:false,
 exp:"「君の好きなあの赤い花」のNPは、関係節「君の好きな（=君が好きな）」と名詞句「あの赤い花」に分かれ、「あの」はDetで「赤い花」全体に付く。最終的に<strong>[[君の][好きな]][[あの][赤い花]]</strong>。正答5"},
{id:56,b:3,sec:"日本語の類型論",star:true,
 text:"【第8回 問題89】日本語の類型論的特徴として正しいのはどれか。",
 opts:["SVO型、前置詞型","SVO型、後置詞型","VSO型、前置詞型","SOV型、後置詞型","SOV型、前置詞型"],
 ans:[3],multi:false,
 exp:"日本語は<strong>SOV型</strong>であり、θ役割・主題役割・意味役割の表示に前置詞ではなく<strong>後置詞（格助詞）が用いられる</strong>。正答4（★頻出）"},
{id:57,b:3,sec:"格",star:false,
 text:"【第8回 問題90】文法的な格関係を表さない助詞はどれか。",
 opts:["は","を","で","の","から"],
 ans:[0],multi:false,
 exp:"非生成文法的な日本語学では「は」のみが「とりたて助詞」であり異質。格助詞（が・を・に・の一部）と後置詞（に・で・へ・から・より・まで）を一括して「格助詞」として扱うことが多い。<strong>「は」だけが格関係を表さない</strong>。正答1"},
{id:58,b:3,sec:"句構造",star:false,
 text:"【第9回 問題87】「大きな桜のきれいな庭」の統語構造としてあり得るのはどれか。a.[[[大きな桜の]きれいな]庭]　b.[[大きな桜の][きれいな庭]]　c.[大きな桜の][きれいな][庭]　d.[[大きな][桜のきれいな]庭]　e.[[大きな][桜のきれいな]庭]",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[0],multi:false,
 exp:"「大きな」が「桜」を修飾する場合はa、「大きな」が「庭」を修飾する場合はb。<strong>a, b</strong>の2通りがあり得る構造。正答1"},
{id:59,b:3,sec:"日本語の特徴",star:false,
 text:"【第11回（午後）問題44】日本語の特徴で正しいのはどれか。a.述語の位置は文末に近い傾向がある　b.格助詞は原則として省略されない　c.活用の仕方はヨーロッパ諸語に近い　d.語順によって文法的関係を表す　e.前置詞ではなく後置詞を用いる",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[1],multi:false,
 exp:"a（述語が文末傾向）とe（後置詞を用いる）は正しい。b「格助詞の省略は口語では存在する」c「ヨーロッパ諸語の活用＝屈折、日本語は膠着」d「文法関係は語順でなく格助詞で表す」。正答2"},
{id:60,b:3,sec:"SOV型言語",star:false,
 text:"【第13回（午前）問題45】SOVタイプの言語の説明として適切でないのはどれか。a.後置詞を持つことが多い　b.連体修飾が名詞の後ろに置かれることが多い　c.接続辞による屈折や派生が一般的なことが多い　d.複合語の主要部が最後に来ることが多い　e.日本語は通時的に見てもこのタイプに属する",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[2],multi:false,
 exp:"日本語（SOV型）の特徴：a（後置詞あり）b（連体修飾は名詞の前）d（複合語の主要部は最後）e（上代から常にSOV）は正しい。<strong>c「接続辞による屈折は誤り。日本語は接頭辞より接尾辞による派生が優勢な膠着語」</strong>。正答3"},
{id:61,b:3,sec:"ヲ格",star:false,
 text:"【第15回（午前）問題45】ヲ格を要求する2項述語はどれか。",
 opts:["渡る","もらう","詳しい","散歩する","泣く"],
 ans:[0],multi:false,
 exp:"「渡る」は「AがBを渡る」で二項述語。「もらう」は「AがBからCをもらう」で三項述語。「詳しい」は「AがBに詳しい」で二項述語（ヲ格不要）。「散歩する」は一項述語。<strong>ヲ格を要求する二項述語は「渡る」</strong>。正答1"},
{id:62,b:3,sec:"従属節",star:true,
 text:"【第15回（午前）問題46】「[」が従属節の初めを示さないのはどれか。",
 opts:["彼は彼女に[婚約を解消することを告げた。","友人から[頼んでいた資料をやっと受け取った。","先週[旅行先で気になっていたバッグを買った。","彼は[大学を卒業した直後にアメリカに留学した。","生鮮食品も[家族がネットで見つけた店で買っている。"],
 ans:[2],multi:false,
 exp:"3「先週[旅行先で気になっていたバッグを買った」において「[」は従属節の始まりを示していない（「旅行先で」は従属節ではなく主節の動詞「買った」の付加詞）。正答3（★頻出）"},
{id:63,b:3,sec:"三項述語",star:false,
 text:"【第17回（午後）問題43】三項述語として用いられないのはどれか。",
 opts:["超える","はずす","渡す","注ぐ","約束する"],
 ans:[0],multi:false,
 exp:"「はずす」「渡す」「注ぐ」「約束する」はいずれも「AがBにCを…」または「AがBからCを…」の構文をとる三項動詞。<strong>「超える」は「AがCを超える」の形で用いられる二項動詞</strong>。正答1"},
{id:64,b:3,sec:"従属節",star:true,
 text:"【第17回（午後）問題44】「[」が従属節の始まりを示していないのはどれか。",
 opts:["やっと今日[彼女に三日前に頼んでおいた資料を受け取ることができた。","彼女が[もし出席できないとしたら残念だ。","彼女から[我々が提案した案件について反対意見が出された。","彼は[机の下に置いてある箱の中から雑誌を取り出した。","彼は[退院してからすぐに温泉旅行に出かけた。"],
 ans:[1],multi:false,
 exp:"2「彼女が[もし出席できないとしたら残念だ」の「[」は従属節の途中に置かれている（主節「残念だ」を修飾する副詞節の始まりは「もし」でなく「彼女が」）。正答2"},
{id:65,b:3,sec:"受身文",star:true,
 text:"【第19回（午前）問題46】間接受身文はどれか。",
 opts:["花子が先生からほめられた。","妹が犬にかみつかれた。","姉が駅員に呼び止められた。","太郎が友だちに足を踏まれた。","弟が社長に転勤を命じられた。"],
 ans:[3],multi:false,
 exp:"間接受身（所有受身）とは「基本文の内項NP（太郎の足）に含まれる所有者NP（太郎の）が受動形態素『られ』の働きによって最上位NPとして取り出された文」。<strong>「太郎が友だちに足を踏まれた」が所有受身文</strong>。正答4（★頻出）"},
{id:66,b:3,sec:"使役受身",star:true,
 text:"【第20回（午前）問題46】「花子は太郎にご飯を無理やり食べさせられた」の下線部「られ」の文法機能はどれか。",
 opts:["可能","尊敬","自発","受身","使役"],
 ans:[3],multi:false,
 exp:"この文は「花子がご飯を食べた」を基本文とする使役受動文。「食べ-させ-られ-た」の「させ」が<strong>使役</strong>を、<strong>「られ」が受身</strong>を表示する。正答4（★頻出）"},
{id:67,b:3,sec:"動作主のが格",star:false,
 text:"【第20回（午後）問題42】「が」が動作主を表しているのはどれか。",
 opts:["花子はリンゴが食べたい。","太郎は中国語が分かる。","花子は英語が話せる。","太郎は足が速い。","荷物は花子が送った。"],
 ans:[4],multi:false,
 exp:"各述語の項構造を検討すると、1「食べ-」の動作主は「花子」（「リンゴが」は対象）、2「分かr-」の「中国語が」は経験者・対象、3「話s-」の「英語が」は対象。<strong>5「送r-」の動作主が「花子が」</strong>。正答5"},
{id:68,b:3,sec:"複合動詞",star:false,
 text:"【第20回（午後）問題43】語彙的複合動詞はどれか。",
 opts:["飛び上がる","食べ残す","歌い終える","歩き続ける","話し始める"],
 ans:[0],multi:false,
 exp:"「語彙的複合動詞」は第1要素をそうし-に置き換え不可。「飛び上がる」→「*そうし上がる」で置き換え不可。<strong>「飛び上がる」が語彙的複合動詞</strong>。「歌い終える」「歩き続ける」「話し始める」は統語的複合動詞（第1要素を「そうし-」に置き換え可能）。正答1"},
{id:69,b:3,sec:"自他動詞",star:false,
 text:"【第21回（午後）問題44】自動詞と他動詞の組み合わせでないのはどれか。",
 opts:["起きる－起こす","裂ける－裂く","溶ける－溶かす","はいる－いれる","走る－走れる"],
 ans:[4],multi:false,
 exp:"他動詞の目語「Bを」が自動詞文では主語「Bが」となる対応を確認。「走る」→「走れる」は自動詞とその可能動詞の対であり、<strong>自動詞と他動詞の対ではない</strong>。正答5"},
{id:70,b:3,sec:"他動詞",star:false,
 text:"【第22回（午前）問題45】述語が他動詞である文はどれか。a.小包が母から届いた　b.みきが電車に乗った　c.まやがボールを蹴った　d.ゆうきがケーキを食べた　e.あすかがバイクにまたがった",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[3],multi:false,
 exp:"他動詞＝「S構造においてヲ格NP/対格NPを項として要求する動詞」。c「蹴る」（ボールを）・d「食べる」（ケーキを）がヲ格NPを項とする他動詞。正答4"},
{id:71,b:3,sec:"条件節",star:false,
 text:"【第22回（午後）問題43】従属節が条件節である複文はどれか。a.宿題が終わるまで、遊びに行けない　b.友達が来るので、お菓子を用意する　c.走っている間、何も考えない　d.雨が降ったら、コンサートに行けない　e.春になれば、花が咲き乱れる",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[4],multi:false,
 exp:"条件節とは主節が表示する事態の成立・不成立に関わる条件を表示している従属節。<strong>d「雨が降ったら」とe「春になれば」が条件節</strong>。a「終わるまで」は継続の終了時、b「来るので」は理由、c「走っている間」は期間。正答5"},
{id:72,b:3,sec:"三項動詞",star:false,
 text:"【第23回（午後）問題43】3項動詞（複他動詞）を述語とする文はどれか。a.AさんがBさんを公園で待った　b.AさんがBさんを車に乗せた　c.AさんがBさんに本をあげた　d.AさんがBさんにフランス語を教えた　e.AさんがBさんに電話でどなった",
 opts:["a, b","a, e","b, c, d","c, d","d, e"],
 ans:[3],multi:false,
 exp:"3項動詞はb「乗せる（AがBをCに乗せる）」c「あげる（AがBにCをあげる）」d「教える（AがBにCを教える）」の3つ。a「待つ」は2項動詞、e「どなる」は2項動詞。公式解答は4のみ（b,c,dのうちb,cは2項動詞の解釈も可）。正答4"},
{id:73,b:3,sec:"自他動詞",star:false,
 text:"【第26回 問題144】他動詞と自動詞の組み合わせでないのはどれか。",
 opts:["落とす－落ちる","付ける－付く","外す－外れる","流す－流れる","書く－書ける"],
 ans:[4],multi:false,
 exp:"「落とす/落ちる」「付ける/付く」「外す/外れる」「流す/流れる」はいずれも共通の語根を有する他動詞と自動詞の対。<strong>「書く」と「書ける」は意志的な動詞とその可能動詞の対であり、自動詞と他動詞の対ではない</strong>。正答5"},

{id:74,b:4,sec:"文字の分類",star:true,

{id:75,b:4,sec:"文字の分類",star:true,

{id:76,b:4,sec:"文字の分類",star:true,
 text:"【第7回 問題87】アルファベット、仮名、漢字について正しいのはどれか。",
 opts:["どれも表音文字である。","どれも表意文字である。","アルファベットだけが表意文字である。","仮名は音節文字ではない。","漢字だけが表意文字である。"],

{id:77,b:4,sec:"文字の種類",star:true,
 text:"【第10回 問題89】文字について正しいのはどれか。",
 opts:["漢字は元来1文字が1語なので表語文字と呼ばれる。","片仮名は平仮名に基づいて後の時代に作られた。","アルファベットはまとまって音を表す音節文字である。","平仮名は漢字の部首を利用した表音記号から発達した。","アラビア数字は物の形を図案化した象形文字である。"],

{id:78,b:4,sec:"漢字の特徴",star:true,
 text:"【第11回（午前）問題43】漢字「晴」「請」「清」に共通する特徴はどれか。",

{id:79,b:4,sec:"漢字の特徴",star:false,
 text:"【第13回（午後）問題43】漢字の特徴として誤っているものはどれか。",

{id:80,b:4,sec:"形態素と漢字",star:false,
 text:"【第16回（午後）問題44】単字として形態素を表さない漢字表記はどれか。a.珈琲　b.空廐　c.本箱　d.夕刊　e.小豆",

{id:110,b:5,sec:"機能語",star:true,
 text:"【第22回（午前）問題44】日本語における機能語はどれか。",
 opts:["名詞","動詞","形容詞","助詞","副詞"],
 ans:[3],multi:false,
 exp:"<strong>機能語・機能形態素</strong>とは「意味役割や事態の成立時点・事態の成立可能性などの文法的機能を表す語・形態素」。<strong>助詞</strong>（格助詞・とりたて詞・接続助詞・終助詞など）が機能語の代表。動詞・名詞・形容詞・副詞は内容語。正答4（★頻出）"},
{id:111,b:5,sec:"敬語",star:false,
 text:"【第24回（午前）問題46】下線部が尊敬語でないのはどれか。",
 opts:["この映画はご覧になりましたか。","いつでもいらっしゃって下さい。","この弁当は電子レンジで温めてからいただいて下さい。","アメリカにはいつ行かれるんですか。","いつお出でになったんですか"],
 ans:[2],multi:false,
 exp:"「いただく」は謙譲語（話し手が動作の受け手として自分を低める）。1「ご覧になる」2「いらっしゃる」4「行かれる」5「お出でになる」はいずれも尊敬語。正答3"},
{id:112,b:5,sec:"直示表現",star:false,
 text:"【第15回（午後）問題44】直示表現（ダイクシス表現）でないのはどれか。",
 opts:["行く・来る","こっち・そっち","好き・嫌い","今日・昨日","私・あなた"],
 ans:[2],multi:false,
 exp:"直示表現（deixis）とは「話し手・聞き手・発話時点・発話場所に依存して具体的な指示対象が決まる言語表現」。「行く/来る」「こっち/そっち」「今日/昨日」「私/あなた」は直示表現。<strong>「好き・嫌い」は直示表現ではない</strong>。正答3"},

{id:113,b:6,sec:"語彙・語種",star:true,
 text:"【第1回 問題87】日本語の語彙について正しいのはどれか。",
 opts:["和語と外来語とに二分するのが一般的である。","外来語は江戸時代末期に初めて輸入された。","「きょろきょろ」などの擬態語は基本的に外来語である。","外来語は文法的にみると名詞と動詞に限られる。","外来語は意味や形の点で原語を改変している場合が多い。"],
 ans:[4],multi:false,
 exp:"外来語は意味・形の点で原語を改変している場合が多い（例：ポルトガル語tabaco→「煙草」）。語彙は「和語・漢語・外来語・オノマトペ」に分類されるので1は誤り。外来語は16世紀室町時代から輸入（2は誤り）。擬態語は外来語ではない（3は誤り）。正答5（★頻出）"},
{id:114,b:6,sec:"語彙・語種",star:false,
 text:"【第3回 問題89】日本語について誤っているのはどれか。",
 opts:["実質的意味を表す要素に文法的機能を表す要素が続く。","語彙は和語・漢語・外来語に分けられる。","擬音語・擬態語が豊富である。","漢字から平仮名が、平仮名から片仮名が作られた。","漢字と仮名との併用によって語句の境界が分かりやすい。"],
 ans:[3],multi:false,

{id:115,b:6,sec:"言語変異",star:false,
 text:"【第5回 問題90】言語の変種の例として適切でないのはどれか。",
 opts:["現代のことばと江戸時代のことば","若者のことばと老人のことば","男性のことばと女性のことば","場面によることばの違い","地域によることばの違い（方言）"],
 ans:[0],multi:false,
 exp:"言語変異（linguistic variation）とは「同一の言語が共時的にさまざまな差異を示すこと」。<strong>「現代のことばと江戸時代のことば」は通時的な言語変化（change）</strong>であり、共時的な変異（variation）ではない。正答1"},
{id:116,b:6,sec:"敬語",star:false,
 text:"【第11回（午後）問題43】敬語の種類が他と異なるのはどれか。",
 opts:["下さる","お休みになる","いらっしゃる","お送りする","召し上がる"],
 ans:[3],multi:false,
 exp:"1「下さる」・2「お休みになる」・3「いらっしゃる」・5「召し上がる」は尊敬語（聞き手や第三者の動作・状態に対して用いる）。<strong>「お送りする」だけが謙譲語</strong>（主として話し手について用いる）。正答4"},
{id:117,b:6,sec:"直示表現とあげる・くれる",star:false,
 text:"【第14回（午後）問題44】日本語（共通語）の「あげる」と「くれる」の説明について適切でないのはどれか。",
 opts:["「あげる」も「くれる」も直示表現である。","「あげる」のほうが無標で「くれる」が有標である。","話し手の視点によって使い分けられる。","両方使える場合がある。","話し手が聞き手に物を与える場合、「くれる」が用いられる。"],
 ans:[4],multi:false,
 exp:"話し手が聞き手に物を与える場合は「あげる」を用いる（「*私はきみにこれをくれる」は不自然）。<strong>「くれる」が用いられるのは聞き手（または第三者）が話し手に与える場合</strong>。正答5"},
{id:118,b:6,sec:"敬語（現代日本語）",star:false,
 text:"【第14回（午後）問題45】現代日本語の敬語の性質として適切なのはどれか。a.話題の人物に対する敬語と聞き手に対する敬語に分けられる　b.相対敬語的というよりは絶対敬語的である　c.尊敬語は従属節内では用いられない　d.「ございます」は尊敬語としても用いられる　e.上下関係だけでなく親疎関係によっても用いる敬語が異なる",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[1],multi:false,
 exp:"<strong>a（話題の人物と聞き手への敬語に分かれる）</strong>と<strong>e（上下・親疎関係によって異なる）</strong>は正しい。b「絶対敬語」は誤りで現代日本語は相対敬語。c「従属節内でも尊敬語は使える」d「ございます」は丁寧語。正答2（★頻出）"},
{id:119,b:6,sec:"誤用・共通語",star:false,
 text:"【第24回（午後）問題144】共通語（東京方言）で誤用とされている用法を含む例はどれか。a.朝ゴミを出しといて　b.昨日青汁を飲んじゃった　c.それでは電報を読まさせていただきます　d.そのキノコは食べれないよ　e.あそこで食べてこうよ",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[2],multi:false,
 exp:"<strong>c「読まさせていただきます」</strong>（正：読ませていただきます）と<strong>d「食べれない」</strong>（ら抜き言葉）が規範的には誤用とされる。a・b・eは話し言葉の短縮形で誤用ではない。正答3"},
{id:120,b:6,sec:"補充法・尊敬語",star:false,
 text:"【第25回（午後）問題42】英語のgoの過去形がwentになるように、屈折・派生に際して語根の異なる形式を用いる現象を補充法という。尊敬語を作るのに補充法を用いていないのはどれか。a.来られる　b.ご覧になる　c.召し上がる　d.おいでになる　e.お食べになる",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[1],multi:false,
 exp:"補充法＝元の動詞と語根が異なる別語形を使う。b「ご覧になる」（見る→ご覧）、c「召し上がる」（食べる→召し上がる）、d「おいでになる」（来る→おいで）は補充法。<strong>a「来られる」</strong>（来る→来られる・語根同一）と<strong>e「お食べになる」</strong>（食べる→お食べ・語根同一）は補充法ではない。正答2"},
{id:121,b:6,sec:"社会方言",star:false,
 text:"【第25回（午後）問題44】地域方言と社会方言のうち、社会方言の例はどれか。a.めんこい（かわいいの意）　b.すいとっと（好きだよの意）　c.しゃり（米の飯の意）　d.オペ（手術の意）　e.おかん（お母さんの意）",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[2],multi:false,
 exp:"社会方言（social dialect）＝「社会的属性によって決定される社会集団の違いに対応する言語変種」。<strong>c「しゃり」（寿司業界の職業語）とd「オペ」（医療現場の職業語）が社会方言</strong>。a・b・eは地域方言。正答3"},
{id:122,b:6,sec:"記述主義vs規範主義",star:false,
 text:"【第23回（午後）問題44】記述主義的な態度でないのはどれか。",
 opts:["[saŋa]と発音する人の割合と[saya]と発音する人の割合を記録した。","「行く」の尊敬語として「行かれる」を使う人の割合を記録した。","「高く」のアクセントが100人の被検者でどのような型に分かれるか記録した。","「食べれる」と言っていた人に介入することで、一定期間後に「食べられる」と言うようになった人の割合を記録した。","「ボルダリングに挑戦する」と言う人と「ボルダリングを挑戦する」と言う人との割合を記録した。"],
 ans:[3],multi:false,
 exp:"記述主義とは「言語がどのように使用されているかをありのままに記録する」態度。<strong>4は介入（教育・矯正）を行っており、規範主義的（特定の形式が正しいと判断して変えようとする）</strong>。正答4"},
{id:123,b:6,sec:"コロケーション",star:false,
 text:"【第26回 問題143】連語（コロケーション）はどれか。",
 opts:["目をかける","油を売る","嘘をつく","動く（≒歩く）","真っ赤な嘘"],
 ans:[2],multi:false,
 exp:"連語（collocation）＝「文において習慣的に共起する語と語の組み合わせ」。<strong>「嘘をつく」</strong>は「嘘」と「つく」が習慣的に共起する連語。「目をかける」「油を売る」はイディオム（慣用表現）、「動く（≒歩く）」は上位語・下位語関係、「真っ赤な嘘」は強調関係。正答3"}

{id:124,b:1,sec:"シニフィアン",star:true,
 text:"【第20回（午前）問題43】音声言語の能記（シニフィアン）について誤っているのはどれか。",
 opts:["a, b（空間的構造を持つ・線条性を持っている）","a, e（空間的構造を持つ・言語普遍的である）","b, c（線条性を持っている・記号表現のことである）","c, d（記号表現のことである・所記との関係は基本的に恣意的である）","d, e（所記との関係は基本的に恣意的である・言語普遍的である）"],
 ans:[1],multi:false,
 exp:"シニフィアン（能記）は<strong>音声からなるので空間構造ではなく時間軸上の線状構造</strong>を持つ（a：誤り）。また各言語が恣意的に選択するので<strong>言語普遍性は持たない</strong>（e：誤り）。正答2（a, e）（★頻出）"},
{id:125,b:1,sec:"言語的コミュニケーション",star:false,
 text:"【第24回（午後）問題51】言語の特徴について誤っているのはどれか。",
 opts:["認知・記憶などの機能と密接に関連している。","発話は形態素からなり、形態素は音素からなることを二重分節という。","記号表現（能記）と記号内容（所記）との結びつきに必然性がないことを恣意性という。","音素や語などが時間軸上に一列に配列される性質を線条（線状）性という。","具象名詞にあって、抽象名詞にはない性質を有契性・有縁性という。"],
 ans:[4],multi:false,
 exp:"有契性・有縁性は名詞の具象・抽象の区別ではなく、<strong>記号表現と記号内容の間に何らかの必然的な結びつきが認められる性質</strong>のこと（オノマトペなど）。正答5"},

{id:126,b:2,sec:"形態素と玉手箱",star:false,
 text:"【第9回 問題86】「玉手箱（タマテバコ）」に関係ないのはどれか。",
 opts:["複合語","連濁","従属関係","漢語","異形態"],
 ans:[3],multi:false,
 exp:"「玉手箱」は<strong>「玉」＋「手」＋「箱」の複合語</strong>（1関係あり）。「手」→「テ」と「箱」→「バコ」の連濁（2関係あり）。「玉」の主要部「手箱」に対する従属部（3関係あり）。「箱」の[hako]と[bako]は同一形態素の異形態（5関係あり）。<strong>漢語は関係なし</strong>。正答4"},
{id:127,b:2,sec:"連濁",star:false,
 text:"【第11回（午後）問題42】下線部が連濁であるのはどれか。",
 opts:["ざらざら","おおどろぼう（大泥棒）","ざま（様）","おおじしん（大地震）","ほのぼの"],
 ans:[4],multi:false,
 exp:"<strong>「ほのぼの」は同じ形態素「ほの」が2回繰り返された畳語法によって2つめの「ほの」が[ぼの]と連濁したもの</strong>。「ざらざら」は初めから濁音、「おおどろぼう」の「泥棒」は単独でも濁音、「様」は単独でも/zama/と濁音。正答5"},
{id:128,b:2,sec:"派生",star:false,
 text:"【第12回（午前）問題44】派生の例として正しいのはどれか。a.真空　b.真面目　c.写真　d.真偽　e.真意",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[1],multi:false,
 exp:"派生とは「接辞の付加による語形成」。a〜eに共通する「真」の中で接頭辞はどれかを考えるとよい。<strong>a「真空」の「真－」（本当の）とe「真意」の「真－」（本当の）が接頭辞による派生語</strong>。b「真面目」の「真」は接頭辞でなく複合。c「写真」「d「真偽」も複合語。正答2（a, e）"},
{id:129,b:2,sec:"音便",star:false,
 text:"【第12回（午前）問題46】音便形でないのはどれか。a.書いて　b.詫びて　c.押して　d.読んで　e.買って",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[2],multi:false,
 exp:"中止形に「て」を加えると：a「書い-て」（イ音便）d「読ん-で」（撥音便）e「買っ-て」（促音便）は音便形。<strong>b「詫びて」と c「押して」は音便が生じていない</strong>（「詫び-て」「押し-て」のまま）。正答3（b, c）"},
{id:130,b:2,sec:"連濁",star:false,
 text:"【第21回（午後）問題43】連濁でないのはどれか。",
 opts:["青空","か細い","それぞれ","ほの暗い","ばかばかしい"],
 ans:[4],multi:false,
 exp:"「ばかばかしい」の第2要素「ばかしい」は単独で発音しても「ばか」であり連濁に該当しない。「青空」の「ぞら」、「か細い」の「ぼそい」、「それぞれ」の「ぞれ」、「ほの暗い」の「ぐらい」はいずれも連濁の例。正答5"},
{id:131,b:2,sec:"形態素分析",star:false,
 text:"【第21回（午後）問題42】二つの形態素からなる語はどれか。a.お好み焼き　b.物知り顔　c.遠浅　d.高さ　e.山",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[3],multi:false,
 exp:"<strong>c「遠浅」は「遠」＋「浅」の2形態素、d「高さ」は「高」＋「さ」の2形態素</strong>。a「お好み焼き」は3形態素以上、b「物知り顔」は3形態素以上、e「山」は1形態素。正答4（c, d）"},
{id:132,b:2,sec:"形態音韻論",star:false,
 text:"【第19回（午後）問題43】下線部が形態音韻論的交替でないのはどれか。",
 opts:["ame（雨）－amaasi（雨足）","nomareru（飲まれる）－mirareru（見られる）","niwatori（鶏）－hinadori（雛鳥）","hondana（本棚）－hombako（本箱）","kaihatu（開発）－hampatu（反発）"],
 ans:[3],multi:false,
 exp:"<strong>「hondana（本棚）－hombako（本箱）」の「hon」と「hom」の交替は音素/N/の異音レベルでの交替（音韻論的交替）</strong>。形態音韻論的交替は音韻論的に対立する音素の交替。正答4"},
{id:133,b:2,sec:"子音語幹動詞",star:false,
 text:"【第24回（午前）問題44】五段活用動詞（子音語幹動詞）はどれか。a.落ちます　b.飛びます　c.羽ばたきます　d.寝ます　e.起きます",
 opts:["a, b","a, e","b, c","c, d","d, e"],
 ans:[2],multi:false,
 exp:"接尾辞「-ます」を削除して各動詞の命令形を見るとよい。<strong>b「飛ぶ→飛べ」とc「羽ばたく→羽ばたけ」がエ段で終わる子音語幹動詞</strong>。a「落ちる→落ちろ」d「寝る→寝ろ」e「起きる→起きろ」は母音語幹動詞。正答3（b, c）"},
{id:134,b:2,sec:"日本語の表記",star:false,
 text:"【第15回（午後）問題42】日本語の表記について適切なのはどれか。",
 opts:["「お」と「を」とは音韻的対立を示すことがある。","「打つ」と「撃つ」とは同音異義語である。","漢字の音と訓とは同一形態素を表さない。","「出鱈目（でたらめ）」のような当て字も単字で形態素を表す。","訓よりも音のほうが自由形態素を表すことが多い。"],
 ans:[2],multi:false,
 exp:"<strong>漢字の音読みと訓読みは同一形態素を表さない</strong>（cf. 授業プリントp.17）。「部屋」の「へ（部）」と「部室」の「ぶ（部）」は同一漢字の訓読みと音読みだが同一形態素の異形態の関係にはない。正答3"},

{id:135,b:3,sec:"2項述語",star:false,
 text:"【第18回（午前）問題45】2項の形容詞述語として用いられないのはどれか。",
 opts:["遅い","強い","怖い","不便だ","好きだ"],
 ans:[0],multi:false,

{id:136,b:3,sec:"連体修飾節",star:true,
 text:"【第20回（午前）問題45】外の関係の連体修飾節はどれか。",

];

var state={};
var cf='all'; // filter
var cb=0;    // block (0=all)

function init(){
  Q.forEach(function(q){state[q.id]={ans:null,sel:[]};});
  renderAll();
}

function getFiltered(){
  var qs=Q;
  if(cb>0) qs=qs.filter(function(q){return q.b===cb;});

  if(cf==='unanswered') qs=qs.filter(function(q){return state[q.id].ans===null;});
  else if(cf==='wrong') qs=qs.filter(function(q){return state[q.id].ans===false;});
  else if(cf==='star') qs=qs.filter(function(q){return q.star;});
  return qs;
}

function renderAll(){
  updateScore();
  var qs=getFiltered();
  var c=document.getElementById('qz');
  if(!qs.length){
    c.innerHTML='<div class="empty">該当する問題がありません ✅</div>';
    return;
  }
  var html='';
  var lastSec='';
  qs.forEach(function(q){
    if(q.sec!==lastSec){
      html+='<div class="sh">📌 '+q.sec+'</div>';
      lastSec=q.sec;
    }
    html+=buildCard(q);
  });
  c.innerHTML=html;
}

function buildCard(q){
  var s=state[q.id];
  var answered=s.ans!==null;
  var badge=answered?(s.ans?'<span class="ab ok">✓ 正解</span>':'<span class="ab ng">✗ 不正解</span>'):'';
  var ml=q.multi?'<span class="ml">（複数選択）</span>':'';
  var opts=q.opts.map(function(opt,i){
    var cls='';
    if(answered){
      if(q.ans.indexOf(i)>=0) cls='ok';
      else if(s.sel.indexOf(i)>=0) cls='ng';
    }
    return '<button class="ob '+cls+'" onclick="pick('+q.id+','+i+')"'+(answered?' disabled':'')+'>'
      +'<span class="on2">'+(i+1)+'.</span><span>'+opt+'</span></button>';
  }).join('');
  var confirmBtn='';
  if(q.multi&&!answered) confirmBtn='<button class="cbtn" onclick="confirm2('+q.id+')">回答する</button>';
  return '<div class="qc" id="qcard'+q.id+'">'
    +'<div class="qm"><span class="qn">Q'+q.id+'</span>'
    +'<span class="qcat">B'+q.b+'</span>'
    +(q.star?'<span class="star">★ 頻出</span>':'')+badge+'</div>'
    +'<div class="qt">'+q.text+ml+'</div>'
    +'<div class="opts">'+opts+'</div>'
    +confirmBtn
    +'<div class="exp'+(answered?' show':'')+'"><div class="eh">💡 解説</div><div class="eb">'+q.exp+'</div></div>'
    +'</div>';
}

function pick(id,sel){
  var q=Q.find(function(x){return x.id===id;});
  if(!q||state[id].ans!==null) return;
  if(q.multi){
    var idx=state[id].sel.indexOf(sel);
    if(idx>=0) state[id].sel.splice(idx,1);
    else state[id].sel.push(sel);
    var card=document.getElementById('qcard'+id);
    if(card) card.outerHTML=buildCard(q);
  } else {
    state[id].sel=[sel];
    state[id].ans=(q.ans[0]===sel);
    var card=document.getElementById('qcard'+id);
    if(card) card.outerHTML=buildCard(q);
    updateScore(); checkComplete();
  }
}

function confirm2(id){
  var q=Q.find(function(x){return x.id===id;});
  if(!q||state[id].ans!==null) return;
  var sel=state[id].sel.slice().sort(function(a,b){return a-b;});
  var ans=q.ans.slice().sort(function(a,b){return a-b;});
  state[id].ans=(sel.length===ans.length&&sel.every(function(v,i){return v===ans[i];}));
  var card=document.getElementById('qcard'+id);
  if(card) card.outerHTML=buildCard(q);
  updateScore(); checkComplete();
}

function updateScore(){
  var total=Q.length;
  var c=Q.filter(function(q){return state[q.id].ans===true;}).length;
  var w=Q.filter(function(q){return state[q.id].ans===false;}).length;
  var r=Q.filter(function(q){return state[q.id].ans===null;}).length;
  document.getElementById('sC').textContent=c;
  document.getElementById('sW').textContent=w;
  document.getElementById('sR').textContent=r;
  document.getElementById('pb').style.width=((total-r)/total*100)+'%';
  document.getElementById('pl').textContent=(total-r)+' / '+total+' 問 回答済み';
}

function checkComplete(){
  var r=Q.filter(function(q){return state[q.id].ans===null;}).length;
  var c=Q.filter(function(q){return state[q.id].ans===true;}).length;
  var f=document.getElementById('fin');
  if(r===0&&cf==='all'&&cb===0){
    var pct=Math.round(c/Q.length*100);
    f.classList.add('show');
    document.getElementById('ft').textContent='正解率 '+pct+'%（'+c+' / '+Q.length+'問）！'+(pct>=80?'さすがです🎊 国試合格まちがいなし！':'間違えた問題をもう一度確認しよう💪');
  }else{f.classList.remove('show');}
}

document.getElementById('resetBtn').addEventListener('click',function(){
  Q.forEach(function(q){state[q.id]={ans:null,sel:[]};});
  document.getElementById('fin').classList.remove('show');
  renderAll();
});

document.querySelectorAll('.btab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.btab').forEach(function(b){b.classList.remove('on');});
    btn.classList.add('on');
    cb=parseInt(btn.getAttribute('data-b'));
    renderAll();
  });
});

document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
    btn.classList.add('on');
    cf=btn.getAttribute('data-f');
    renderAll();
  });
});

init();
</script>
