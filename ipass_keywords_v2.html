<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート キーワード単語帳 Ver.2</title>
<style>
:root {
  --bg:#0f1117; --surface:#1a1d27; --card:#22263a; --border:#2d3250;
  --accent:#6c8fff; --accent2:#a78bfa; --green:#34d399; --red:#f87171;
  --yellow:#fbbf24; --text:#e8eaf6; --sub:#8892b0; --radius:16px;
  --font:'Helvetica Neue','Hiragino Sans','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:16px 12px 48px;}

/* ── ヘッダー ── */
.hd{text-align:center;padding:18px 0 10px;}
.hd h1{font-size:1.3rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hd p{color:var(--sub);font-size:.73rem;margin-top:3px;}

/* ── モード切り替え ── */
.mode-wrap{display:flex;justify-content:center;gap:8px;margin:12px 0;}
.mode-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:30px;color:var(--sub);cursor:pointer;font-size:.82rem;font-weight:700;padding:7px 20px;transition:all .18s;}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ── カテゴリタブ ── */
.tabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:0 auto 14px;max-width:680px;}
.tab-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:30px;color:var(--sub);cursor:pointer;font-size:.7rem;font-weight:600;padding:4px 12px;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{border-color:var(--accent);color:var(--accent);}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* ── 検索 ── */
.search-wrap{max-width:500px;margin:0 auto 12px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:40px;padding:9px 16px 9px 40px;color:var(--text);font-size:.9rem;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-wrap .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none;}

/* ── 進捗 ── */
.prog-wrap{max-width:480px;margin:0 auto 12px;}
.prog-bar-bg{background:var(--surface);border-radius:99px;height:6px;overflow:hidden;}
.prog-bar{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:99px;transition:width .4s;}
.prog-label{text-align:center;font-size:.72rem;color:var(--sub);margin-top:4px;}
.prog-label span{color:var(--accent);font-weight:700;}

/* ════════════════════════════════
   フラッシュカードモード
   ════════════════════════════════ */
#flashMode{display:block;}
.flash-area{max-width:480px;margin:0 auto;}
.flash-card{
  background:var(--card);border:2px solid var(--border);border-radius:var(--radius);
  padding:28px 24px 22px;text-align:center;cursor:pointer;
  min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  transition:border-color .2s,box-shadow .2s;user-select:none;
}
.flash-card:hover{border-color:var(--accent);box-shadow:0 8px 28px rgba(108,143,255,.18);}
.flash-card.revealed .front{display:none;}
.flash-card.revealed .back-side{display:flex;}
.flash-card .front,.flash-card .back-side{width:100%;}
.flash-card .back-side{display:none;flex-direction:column;gap:8px;}

.flash-cat{font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.07em;background:rgba(108,143,255,.12);padding:3px 12px;border-radius:99px;}
.flash-kw{font-size:1.05rem;font-weight:800;line-height:1.55;color:var(--text);}
.flash-hint{font-size:.7rem;color:var(--sub);margin-top:6px;}
.flash-ans{font-size:1.25rem;font-weight:900;color:var(--green);background:rgba(52,211,153,.08);border-radius:10px;padding:10px 14px;border-left:3px solid var(--green);text-align:left;line-height:1.35;}
.flash-desc{font-size:.76rem;color:var(--sub);line-height:1.65;text-align:left;}
.back-close{font-size:.65rem;color:var(--sub);text-align:right;}

.flash-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;}
.nav-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:.82rem;font-weight:700;padding:8px 18px;transition:all .15s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.mark-btn{background:none;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.78rem;padding:7px 14px;transition:all .15s;font-weight:700;}
.mark-btn.ok{color:var(--green);border-color:var(--green);}
.mark-btn.ng{color:var(--red);border-color:var(--red);}

/* ════════════════════════════════
   4択クイズモード
   ════════════════════════════════ */
#quizMode{display:none;}
.quiz-area{max-width:480px;margin:0 auto;}
.quiz-q{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:22px 20px 18px;margin-bottom:12px;}
.qcat{font-size:.66rem;font-weight:700;color:var(--accent2);background:rgba(167,139,250,.1);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:10px;}
.qtext{font-size:.98rem;font-weight:800;line-height:1.55;}
.qsub{font-size:.7rem;color:var(--sub);margin-top:8px;}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:.85rem;font-weight:600;padding:11px 14px;text-align:left;transition:all .18s;line-height:1.4;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(108,143,255,.08);}
.choice-btn.correct{border-color:var(--green)!important;background:rgba(52,211,153,.12)!important;color:var(--green)!important;}
.choice-btn.wrong{border-color:var(--red)!important;background:rgba(248,113,113,.1)!important;color:var(--red)!important;}
.choice-btn:disabled{cursor:default;}
.quiz-fb{background:var(--surface);border-radius:10px;padding:12px 16px;font-size:.78rem;color:var(--sub);line-height:1.6;display:none;border-left:3px solid var(--border);}
.quiz-fb.show{display:block;}
.quiz-fb.ok{border-left-color:var(--green);}
.quiz-fb.ng{border-left-color:var(--red);}
.fb-verdict{font-weight:800;font-size:.88rem;margin-bottom:4px;}
.quiz-fb.ok .fb-verdict{color:var(--green);}
.quiz-fb.ng .fb-verdict{color:var(--red);}
.quiz-next{display:none;width:100%;background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.9rem;font-weight:800;padding:13px;margin-top:10px;}
.quiz-next.show{display:block;}

/* ── スコア ── */
.score-screen{display:none;text-align:center;padding:32px 20px;max-width:480px;margin:0 auto;}
.score-screen.show{display:block;}
.score-big{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.score-label{font-size:.83rem;color:var(--sub);margin-top:4px;}
.score-msg{font-size:.98rem;font-weight:700;margin:14px 0 6px;}
.retry-btn{background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.9rem;font-weight:800;padding:13px 32px;margin-top:14px;}
.miss-list{margin-top:18px;text-align:left;}
.miss-list h3{font-size:.78rem;color:var(--sub);margin-bottom:8px;font-weight:700;}
.miss-item{background:var(--card);border-radius:8px;padding:9px 12px;margin-bottom:6px;border-left:3px solid var(--red);}
.miss-item .mt{font-size:.8rem;font-weight:800;}
.miss-item .mk{font-size:.7rem;color:var(--sub);margin-top:3px;}
</style>
</head>
<body>

<div class="hd">
  <h1>📘 ITパスポート キーワード単語帳 Ver.2</h1>
  <p>シラバスVer.6.5準拠 ─ キーワードを見て用語を当てよう</p>
</div>

<div class="mode-wrap">
  <button class="mode-btn active" id="btnFlash" onclick="switchMode('flash')">🃏 フラッシュカード</button>
  <button class="mode-btn" id="btnQuiz" onclick="switchMode('quiz')">✅ 4択クイズ</button>
</div>

<div class="search-wrap">
  <span class="ico">🔍</span>
  <input type="text" id="searchInput" placeholder="用語・キーワードを検索…" oninput="onSearch()">
</div>

<div class="tabs" id="tabWrap"></div>
<div class="prog-wrap" id="progWrap">
  <div class="prog-bar-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
  <div class="prog-label" id="progLabel"></div>
</div>

<!-- フラッシュカード -->
<div id="flashMode">
  <div class="flash-area">
    <div class="flash-card" id="flashCard" onclick="revealFlash()">
      <div class="front">
        <span class="flash-cat" id="fCat"></span>
        <div class="flash-kw" id="fKw"></div>
        <div class="flash-hint">👆 タップして用語を確認</div>
      </div>
      <div class="back-side">
        <span class="flash-cat" id="fCat2"></span>
        <div style="font-size:.7rem;color:var(--accent2);font-weight:700;letter-spacing:.06em;">✅ これを選べば正解！</div>
        <div class="flash-ans" id="fAns"></div>
        <div class="flash-desc" id="fDesc"></div>
        <div class="back-close">もう一度タップで戻る</div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="nav-btn" id="fPrev" onclick="flashMove(-1)">◀ 前</button>
      <button class="mark-btn ok" onclick="markFlash(true)">✅ 覚えた</button>
      <button class="mark-btn ng" onclick="markFlash(false)">❌ もう一度</button>
      <button class="nav-btn" id="fNext" onclick="flashMove(1)">次 ▶</button>
    </div>
    <div style="text-align:center;margin-top:10px;display:flex;gap:6px;justify-content:center;">
      <button class="nav-btn" onclick="shuffleFlash()" style="font-size:.72rem;padding:5px 12px;">🔀 シャッフル</button>
      <button class="nav-btn" onclick="resetFlash()" style="font-size:.72rem;padding:5px 12px;">🔄 リセット</button>
    </div>
  </div>
</div>

<!-- 4択クイズ -->
<div id="quizMode">
  <div class="quiz-area" id="quizBody">
    <div class="quiz-q">
      <span class="qcat" id="qCat"></span>
      <div class="qtext" id="qKw"></div>
      <div class="qsub">↑ このキーワードが表す用語はどれ？</div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="quiz-fb" id="quizFb">
      <div class="fb-verdict" id="fbVerdict"></div>
      <div id="fbDesc"></div>
    </div>
    <button class="quiz-next" id="quizNext" onclick="nextQuiz()">次の問題 ▶</button>
  </div>
  <div class="score-screen" id="scoreScreen">
    <div class="score-big" id="scoreBig"></div>
    <div class="score-label" id="scoreLabel"></div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="miss-list" id="missList"></div>
    <button class="retry-btn" onclick="startQuiz()">🔄 もう一度</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// データ（シラバスVer.6.5準拠）
// ══════════════════════════════════════════════
const DATA = [
// ─ 企業活動 ─
{cat:"企業活動",term:"CSR（企業の社会的責任）",keyword:"企業が社会・環境・ステークホルダーへ配慮する責務",desc:"Corporate Social Responsibility。株主だけでなく社員・地域社会・環境など全ステークホルダーへの責任を果たす経営姿勢。ISO 26000が関連規格。"},
{cat:"企業活動",term:"SDGs",keyword:"2030年までの17の持続可能な開発目標",desc:"Sustainable Development Goals。貧困・格差・気候変動など17目標・169ターゲットで構成される国連の国際目標。"},
{cat:"企業活動",term:"DX（デジタルトランスフォーメーション）",keyword:"デジタル技術で事業・社会を根本から変革すること",desc:"単なるIT化ではなく、デジタル技術によってビジネスモデルや価値創造の方法を根本から変えること。"},
{cat:"企業活動",term:"GX（グリーントランスフォーメーション）",keyword:"化石燃料から脱却しカーボンニュートラルを目指す変革",desc:"温室効果ガスの削減と産業構造転換を同時に進める取り組み。GX推進法が関連法規。"},
{cat:"企業活動",term:"PDCA",keyword:"Plan→Do→Check→Actの継続改善サイクル",desc:"計画・実行・評価・改善を繰り返して品質や業務を継続的に向上させるフレームワーク。"},
{cat:"企業活動",term:"BCP（事業継続計画）",keyword:"災害・障害時に中核事業を継続するための計画",desc:"Business Continuity Plan。大規模災害・障害発生時に事業をできる限り継続・迅速復旧するための計画。"},
{cat:"企業活動",term:"リスキリング",keyword:"新しいスキルを身に付け直す学び直し",desc:"技術変化・業務変革に対応するために、労働者が新しい職業スキルを習得し直すこと。"},
{cat:"企業活動",term:"ブレーンストーミング",keyword:"批判禁止で自由にアイデアを出し合う発想法",desc:"他者の意見への便乗もOK・批判禁止のルールで多くのアイデアを短時間に集める会議手法。"},
{cat:"企業活動",term:"BYOD",keyword:"従業員が私物端末を業務利用する制度",desc:"Bring Your Own Device。私物のスマートフォン・PCを会社が許可した上で業務に活用する方式。セキュリティ管理が課題。"},
{cat:"企業活動",term:"テレワーク",keyword:"自宅など会社以外の場所で働く勤務形態",desc:"在宅勤務・モバイルワーク・サテライトオフィス勤務などの総称。労務管理やセキュリティ対策が重要。"},
{cat:"企業活動",term:"事業部制組織",keyword:"製品・地域ごとに独立した事業部を置く組織形態",desc:"各事業部が販売・製造・人事など一連の機能を持ち責任と権限を持って自律的に動く組織形態。"},
{cat:"企業活動",term:"マトリックス組織",keyword:"職能別と事業別の二つの命令系統を持つ組織",desc:"従業員が職能部門と事業部門の両方の上司に属する組織。柔軟な対応が可能だが指揮系統が複雑になる。"},
{cat:"企業活動",term:"CxO",keyword:"CEO・CIO・CISOなど最高○○責任者の総称",desc:"Chief x Officer。CEO（最高経営責任者）・CIO（最高情報責任者）・CISO（最高情報セキュリティ責任者）などの役職。"},
{cat:"企業活動",term:"損益分岐点",keyword:"売上と費用が等しくなる利益ゼロの販売量",desc:"固定費÷（1－変動費率）で計算。この点を超えると利益が出る経営の基本指標。"},
{cat:"企業活動",term:"貸借対照表（B/S）",keyword:"資産・負債・純資産の残高を示す財務諸表",desc:"Balance Sheet。ある時点での財政状態を示す。資産合計＝負債合計＋純資産合計が成立する。"},
{cat:"企業活動",term:"自己資本比率",keyword:"総資産に占める純資産の割合で財務安定性を示す指標",desc:"純資産÷総資産×100。数値が高いほど財務が安定している。銀行融資審査などで重視される。"},
{cat:"企業活動",term:"間接費",keyword:"特定製品に直接紐付けられない共通費用",desc:"工場管理費・光熱費・設備維持費など。製品原価に直接算入できず按分配賦する。直接費と対比される概念。"},

{cat:"企業活動",term:"OJT",keyword:"職場での実務を通じた上司・先輩による教育訓練",desc:"On the Job Training。実際の業務を通じて指導する教育方法。Off-JT（職場外研修）・e-ラーニングと対比。"},

{cat:"法律・知財",term:"商標権",keyword:"ブランド名・ロゴを保護する産業財産権",desc:"商品・サービスを識別するマーク（文字・図形・音等）を保護。更新すれば半永久的に維持できる。"},
{cat:"法律・知財",term:"パブリシティ権",keyword:"有名人が氏名・肖像の商業利用をコントロールできる権利",desc:"芸能人・スポーツ選手などが自分の氏名・顔写真の無断商業利用を禁止できる権利。法律ではなく判例で認められた権利。"},
{cat:"法律・知財",term:"不正アクセス禁止法",keyword:"正当な権限なく他者のコンピュータに侵入することを禁止",desc:"フィッシング等でID取得すること・他人のIDでログインすること等を禁止する法律。未遂も処罰対象。"},
{cat:"法律・知財",term:"個人情報保護法",keyword:"氏名・生年月日など個人を識別できる情報の取り扱いを規制",desc:"個人情報取扱事業者に、収集目的の明示・安全管理・第三者提供の制限などを義務付ける法律。"},
{cat:"法律・知財",term:"匿名加工情報",keyword:"復元できないように法令の方法で加工した個人情報",desc:"個人を識別できないように加工し復元不可にした情報。本人同意なく第三者提供・利活用が可能。"},
{cat:"法律・知財",term:"GDPR",keyword:"EUの個人データ保護に関する包括的規則",desc:"General Data Protection Regulation。EU市民の個人データを厳格に保護するEUの法規制。日本企業でもEU向けサービスには適用される。"},
{cat:"法律・知財",term:"サイバーセキュリティ基本法",keyword:"日本のサイバーセキュリティ施策の基本理念と国の責務を定める",desc:"情報通信ネットワークへの不正侵入等対処施策に関し、基本理念・国の責務・地方公共団体の責務などを定めた法律。"},
{cat:"法律・知財",term:"コピーレフト",keyword:"改変・再配布する際も元のライセンス（GPL等）を継続する義務",desc:"OSSのGPLライセンスで採用。改変版ソフトウェアを配布する場合、元のライセンスを適用し続けなければならない条件。"},
{cat:"法律・知財",term:"景品表示法",keyword:"誇大広告・ステルスマーケティングを規制する消費者保護法",desc:"実際より著しく優れていると示す不当表示や過大景品を規制する。広告と明示しないステルスマーケティングも違反対象。"},
{cat:"法律・知財",term:"プロバイダ責任制限法",keyword:"ネット権利侵害に対するISPの責任範囲と発信者情報開示を規定",desc:"インターネット上の誹謗中傷・権利侵害に関しプロバイダの責任を限定し、被害者が発信者情報を開示請求できる手続きを定める。"},
// ─ 経営戦略 ─
{cat:"経営戦略",term:"SWOT分析",keyword:"強み・弱み・機会・脅威の4象限で内外環境を整理",desc:"Strengths・Weaknesses・Opportunities・Threats。内部環境（強み・弱み）と外部環境（機会・脅威）を整理する経営分析手法。"},
{cat:"経営戦略",term:"3C分析",keyword:"Customer・Competitor・Companyの3視点で市場を分析",desc:"顧客・競合・自社の3軸から事業環境を分析する手法。市場参入・戦略立案時の基本フレームワーク。"},
{cat:"経営戦略",term:"PPM",keyword:"市場成長率×占有率でSBUを花形・金のなる木等に分類",desc:"Product Portfolio Management。花形・金のなる木・問題児・負け犬で事業を分類し、投資優先度を決める経営分析手法。"},
{cat:"経営戦略",term:"BSC（バランストスコアカード）",keyword:"財務・顧客・内部業務・学習成長の4視点でバランスよく評価",desc:"Balanced Scorecard。財務指標だけでなく顧客・社内プロセス・学習・成長の非財務指標も加えた業績評価手法。"},
{cat:"経営戦略",term:"KPI",keyword:"目標達成度を数値で測る重要業績評価指標",desc:"Key Performance Indicator。戦略目標（KGI）の達成に向けた中間目標を数値で設定し達成状況を管理する指標。"},
{cat:"経営戦略",term:"ニッチ戦略",keyword:"大手が手を出さない特定の小市場に集中する競争戦略",desc:"規模が小さくても競合が少ない特定セグメントに経営資源を集中し、高い利益率を狙う戦略。"},
{cat:"経営戦略",term:"M&A",keyword:"企業の合併・買収による外部成長戦略",desc:"Mergers & Acquisitions。自社開発より素早く経営資源・技術・市場を獲得する手段。TOB（公開買付け）もその形態の一つ。"},
{cat:"経営戦略",term:"アウトソーシング",keyword:"自社業務を外部企業に委託しコア業務に集中する戦略",desc:"コア業務以外を専門の外部企業に委託してコスト削減・品質向上・経営資源の集中を図る経営手法。"},
{cat:"経営戦略",term:"コアコンピタンス",keyword:"競合に容易に真似できない自社固有の中核的競争力",desc:"他社が模倣困難な企業固有の強み・能力。経営戦略立案の出発点。競争優位の源泉。"},
{cat:"経営戦略",term:"バリューエンジニアリング（VE）",keyword:"価値＝機能÷コストの向上を目指す体系的手法",desc:"製品・サービスの価値を機能とコストの比で捉え、コストを下げるか機能を高めることで価値向上を図る。"},
{cat:"経営戦略",term:"CRM",keyword:"顧客との関係を管理・強化して売上と満足を向上するシステム",desc:"Customer Relationship Management。顧客の購買履歴・属性を一元管理し、個別最適化したサービスで顧客ロイヤルティを高める。"},
{cat:"経営戦略",term:"SCM（サプライチェーンマネジメント）",keyword:"調達〜製造〜流通〜販売の一連の流れを統合最適化",desc:"Supply Chain Management。サプライヤーから顧客までの全プロセスを統合管理してリードタイム短縮・在庫削減・コスト低減を図る。"},
{cat:"経営戦略",term:"ERP",keyword:"財務・人事・生産・販売など企業の基幹業務を統合管理",desc:"Enterprise Resource Planning。基幹業務パッケージシステム。リアルタイムでデータを一元管理し経営の効率化・可視化を実現。"},
{cat:"経営戦略",term:"ロングテール",keyword:"多数の少量販売商品の合計売上がヒット商品を上回る現象",desc:"ECサイトで、売れない多数の商品群（尾部）の合計売上がヒット商品を上回る現象。インターネット販売で顕著。"},
{cat:"経営戦略",term:"フィンテック",keyword:"金融×IT融合の革新的サービス（FinTech）",desc:"Finance＋Technology。モバイル決済・AI資産運用・クラウドファンディング・暗号資産などのIT活用金融サービス。"},
{cat:"経営戦略",term:"シェアリングエコノミー",keyword:"個人の遊休資産をネットで他者と共有・貸し借りする経済",desc:"車・部屋・スキル・時間などをインターネットで他者と共有・貸し借りするビジネスモデル。Uber・Airbnbが代表例。"},
{cat:"経営戦略",term:"キャズム",keyword:"アーリーアダプターとアーリーマジョリティの間の越えにくい溝",desc:"新製品・サービス普及においてイノベーター・アーリーアダプターから一般大衆（マジョリティ）への移行時に生じる大きな障壁。"},
{cat:"経営戦略",term:"ハッカソン",keyword:"エンジニアらが短期集中でアイデアを競い開発するイベント",desc:"HackとMarathonの合成語。数時間〜数日の短期間でソフトウェア開発のアイデアを競い合うイベント。"},
{cat:"経営戦略",term:"リスティング広告",keyword:"検索キーワードに連動して表示されるクリック課金型Web広告",desc:"検索エンジン利用者が入力したキーワードに連動して検索結果画面に表示される広告。クリックごとに課金される。"},
{cat:"経営戦略",term:"RFP（提案依頼書）",keyword:"発注者がベンダーに調達条件を示し提案書提出を依頼する文書",desc:"Request For Proposal。システム導入時に発注者がIT企業（ベンダー）へ要件・条件を明示し提案書の提出を依頼する文書。"},
{cat:"経営戦略",term:"ASP",keyword:"サーバ上のアプリをインターネット経由でサービス提供する事業者",desc:"Application Service Provider。ネットワーク経由でソフトウェアを提供するサービス形態。SaaSの前身にあたる概念。"},
{cat:"経営戦略",term:"コンカレントエンジニアリング",keyword:"複数の開発工程を並行実施して製品開発期間を短縮",desc:"設計・試作・製造準備などを同時並行で進めることで開発期間を大幅短縮する手法。"},
{cat:"経営戦略",term:"デジタルツイン",keyword:"実物のデジタルコピーを仮想空間に構築してシミュレーション",desc:"工場設備・建物などをセンサーデータでリアルタイムに仮想空間に再現。異常予知・最適化・シミュレーションに活用。"},
{cat:"経営戦略",term:"リーン生産方式",keyword:"ムリ・ムラ・ムダを徹底排除して生産効率を最大化",desc:"トヨタ生産方式を体系化。JIT（ジャストインタイム）・かんばん方式などで在庫・待機・過剰生産を排除する生産方式。"},
{cat:"経営戦略",term:"ブルーオーシャン戦略",keyword:"競合のいない未開拓市場を創造して戦う戦略",desc:"既存市場（血みどろのレッドオーシャン）ではなく、競争のない新市場（ブルーオーシャン）を創り出す戦略。"},
// ─ マネジメント ─
{cat:"マネジメント",term:"WBS",keyword:"プロジェクト作業を階層的に分解した成果物一覧図",desc:"Work Breakdown Structure。プロジェクト全体の作業を管理可能な単位（ワークパッケージ）に細分化した構造図。"},
{cat:"マネジメント",term:"クリティカルパス",keyword:"プロジェクトの最長経路＝遅延すると全体に影響",desc:"プロジェクト最短完了のための作業連鎖。この経路上の作業が遅れると必ずプロジェクト全体が遅延する。"},
{cat:"マネジメント",term:"ガントチャート",keyword:"工程の開始・終了・進捗を横棒で表す進捗管理図",desc:"縦軸に作業・横軸に時間をとり、作業期間を横棒で表現する図。進捗状況を直感的に把握できる。"},
{cat:"マネジメント",term:"プロジェクト憲章",keyword:"新規プロジェクトを正式に認可するPMBOKの文書",desc:"プロジェクトの目的・スコープ・スケジュール・予算・責任者などを定め、プロジェクトの存在を正式承認する文書。"},
{cat:"マネジメント",term:"アジャイル開発",keyword:"短い反復サイクルで変化に柔軟に対応する開発手法",desc:"スプリント単位（通常2週間）で計画・開発・テスト・リリースを繰り返す。スクラムが代表的なフレームワーク。"},
{cat:"マネジメント",term:"ウォーターフォールモデル",keyword:"要件定義→設計→開発→テストを順序良く完了する開発手法",desc:"前工程完了後に次工程へ進む。要件が明確・変更が少ないプロジェクトに適する。手戻りが発生するとコストが大きい。"},
{cat:"マネジメント",term:"スパイラルモデル",keyword:"リスク分析を繰り返しながらプロトタイプを作り込む開発モデル",desc:"プロトタイプを繰り返し作成してリスクを評価しながら開発を進める。要件が不明確・リスクが高いシステムに適する。"},
{cat:"マネジメント",term:"SLA（サービスレベル合意書）",keyword:"ITサービス品質目標を提供者と顧客が合意した文書",desc:"Service Level Agreement。稼働率・応答時間・障害対応時間などサービス品質の目標値を契約として定める文書。"},
{cat:"マネジメント",term:"サービスデスク",keyword:"稼働後のITサービスで利用者問合せを一元受付する窓口",desc:"SPOC（Single Point of Contact）機能。ITサービスの利用者の問題・質問・要求を一元的に受け付ける組織・機能。"},
{cat:"マネジメント",term:"インシデント管理",keyword:"IT障害を迅速に復旧しサービスを回復するプロセス",desc:"ITサービスの中断・品質低下を検知し、できる限り早くサービスを正常な状態に戻す活動。根本原因解決は問題管理が担う。"},
{cat:"マネジメント",term:"問題管理",keyword:"繰り返すインシデントの根本原因を調査・排除するプロセス",desc:"インシデントの根本原因を特定し恒久対策を行うプロセス。インシデント管理（応急処置）と目的が異なる。"},
{cat:"マネジメント",term:"システム監査",keyword:"ITシステムのリスク対応を独立した立場で検証・評価する活動",desc:"システム監査人が情報システムリスクへの対応状況を客観的に検証・評価し改善提案を行う活動。"},
{cat:"マネジメント",term:"ファシリティマネジメント",keyword:"建物・設備・環境を最適状態に維持・改善する管理活動",desc:"オフィス・データセンターなどの施設・設備を総合管理し、コスト最適化・快適性・安全性を向上させる活動。"},
{cat:"マネジメント",term:"ITガバナンス",keyword:"経営陣がITの利活用方針を示し組織全体を統制する仕組み",desc:"取締役会等がステークホルダーのニーズに基づきIT戦略・方針を策定し、その実現を統制・モニタリングする活動。"},
{cat:"マネジメント",term:"内部統制",keyword:"健全・効率的な組織運営のための自己管理体制",desc:"業務プロセスの明確化・職務分掌・実施ルール設定・チェック体制確立によって組織が自ら構築・運用する管理の仕組み。"},
{cat:"マネジメント",term:"FP法（ファンクションポイント法）",keyword:"システムの機能規模を数値化して開発工数を見積もる手法",desc:"Function Point法。入力・出力・照会・内部ファイル等の数と複雑さでシステム規模を定量的に見積もる手法。"},
{cat:"マネジメント",term:"アノテーション",keyword:"機械学習の教師データに正解ラベルを付与する作業",desc:"AIの教師あり学習で使う訓練データに「これは猫」などの正解情報（ラベル）を人間が付与する作業。"},
{cat:"マネジメント",term:"サービスレベル管理（SLM）",keyword:"SLAの計画・合意・測定・改善を継続的に実施するプロセス",desc:"Service Level Management。SLAの策定から計測・報告・改善まで、サービスレベルを継続的に維持・向上させる管理プロセス。"},
{cat:"マネジメント",term:"DevOps",keyword:"開発チームと運用チームが連携して継続的に高速リリース",desc:"Development＋Operations。開発と運用を統合しCI/CD（継続的インテグレーション・デリバリー）を実践して高頻度かつ安定したリリースを実現する。"},
// ─ ハードウェア ─
{cat:"ハードウェア",term:"CPU",keyword:"演算・制御を担うコンピュータの中央処理装置",desc:"Central Processing Unit。プログラム命令を解釈・実行する。クロック周波数・コア数が主な性能指標。"},
{cat:"ハードウェア",term:"GPU",keyword:"画像処理・AI並列計算に特化したプロセッサ",desc:"Graphics Processing Unit。多数のコアで並列処理を実行。AI・機械学習の大規模計算にも不可欠。"},
{cat:"ハードウェア",term:"RAM（主記憶）",keyword:"プログラム実行中のデータを高速に一時保存する揮発性メモリ",desc:"電源を切ると消える。CPUが直接読み書きする作業領域。容量が大きいほど多くのプログラムを快適に実行できる。"},
{cat:"ハードウェア",term:"SSD",keyword:"フラッシュメモリを使う高速・省電力・耐衝撃のストレージ",desc:"Solid State Drive。HDDより高速・静音・耐衝撃だが書き換え回数に寿命がある。"},
{cat:"ハードウェア",term:"VRAM",keyword:"PC画面表示データを格納する画面表示専用メモリ",desc:"Video RAM。GPUが画面の描画データを格納するための専用メモリ。大きいほど高解像度・高品質な描画が可能。"},
{cat:"ハードウェア",term:"キャッシュメモリ",keyword:"CPUと主記憶の速度差を埋める高速小容量バッファメモリ",desc:"CPUの高速処理に主記憶が追いつけないため、頻繁に使うデータを格納しておく高速メモリ。L1/L2/L3の階層がある。"},
{cat:"ハードウェア",term:"稼働率",keyword:"システムが正常動作している時間の割合（MTBF÷（MTBF＋MTTR））",desc:"稼働率＝MTBF÷（MTBF＋MTTR）。MTBFが大きく・MTTRが小さいほど稼働率が高い。信頼性の主要指標。"},
{cat:"ハードウェア",term:"MTBF",keyword:"故障と故障の間の平均動作時間（平均故障間隔）",desc:"Mean Time Between Failures。システムが正常に動作し続ける平均時間。値が大きいほど故障しにくい。"},
{cat:"ハードウェア",term:"MTTR",keyword:"障害発生から正常復旧までの平均修復時間",desc:"Mean Time To Repair。値が小さいほど迅速に修復できる。稼働率の計算式に使われる指標。"},
{cat:"ハードウェア",term:"フェールセーフ",keyword:"障害発生時に安全側（被害最小）の状態に自動移行する設計",desc:"システム故障時に被害を最小化する方向に自動移行する設計思想。電車の自動停止・信号機の赤点灯などが例。"},
{cat:"ハードウェア",term:"フールプルーフ",keyword:"人間のミスが起きにくく・起きても重大事態にならない設計",desc:"誤操作しても重大な結果にならないよう、誤りにくい構造にする設計思想。USBコネクタの裏表がわかりやすい形状など。"},
{cat:"ハードウェア",term:"RAID",keyword:"複数HDDを組み合わせて冗長性・速度を向上させる技術",desc:"Redundant Arrays of Inexpensive Disks。RAID0（速度）・RAID1（ミラーリング）・RAID5（分散パリティ）などのレベルがある。"},
{cat:"ハードウェア",term:"仮想化",keyword:"1台の物理サーバを複数の仮想マシンとして動作させる技術",desc:"ハイパーバイザー等を使い1台の物理サーバ上に複数のOSを独立稼働させる。リソース有効活用・コスト削減に貢献。"},
// ─ ソフトウェア ─
{cat:"ソフトウェア",term:"OS（オペレーティングシステム）",keyword:"ハードウェアとアプリの橋渡しをする基本ソフトウェア",desc:"Windows・macOS・Linux・iOS・Android等。ファイル管理・入出力管理・プロセス管理などをアプリに提供する。"},
{cat:"ソフトウェア",term:"バックアップ",keyword:"データ損失に備えてデータの複製を別の場所に保管する対策",desc:"フルバックアップ（全データ）・差分バックアップ（前回フルからの変更）・増分バックアップ（前回バックアップ以降の変更）の3種類がある。"},
{cat:"ソフトウェア",term:"OSS（オープンソースソフトウェア）",keyword:"ソースコードが公開され自由に利用・改変・再配布できるソフト",desc:"Linux・Apache・MySQLなどが代表例。ライセンス条件（GPL等のコピーレフトや、BSDライセンス等）を守る必要がある。"},
{cat:"ソフトウェア",term:"ウィザード",keyword:"質問に対話形式で答えると複雑な操作が完了するUI機能",desc:"ステップごとに質問・選択肢を示して操作を誘導するUI機能。ソフトウェアのインストールや設定で多く使われる。"},
{cat:"ソフトウェア",term:"レスポンシブWebデザイン",keyword:"画面サイズに応じてレイアウトが自動変化するWeb設計",desc:"スマートフォン・タブレット・PCなど異なる端末・画面サイズに対し、1つのHTMLで最適なレイアウトを自動提供する設計手法。"},
{cat:"ソフトウェア",term:"SaaS",keyword:"ソフトウェアをインターネット経由でサービスとして提供",desc:"Software as a Service。インストール不要でブラウザから利用するクラウドサービス。GmailやSalesforceが代表例。"},
{cat:"ソフトウェア",term:"PaaS",keyword:"アプリの開発・実行環境をクラウドで提供するサービス",desc:"Platform as a Service。OS・ミドルウェア・開発環境をクラウドで提供。インフラ管理なしでアプリ開発に集中できる。"},
{cat:"ソフトウェア",term:"IaaS",keyword:"サーバ・ストレージ・ネットワーク等のインフラをクラウドで提供",desc:"Infrastructure as a Service。仮想サーバ・ストレージ等をクラウドで提供。AWS・Azure・GCPが代表例。"},
// ─ データベース ─
{cat:"データベース",term:"RDBMS",keyword:"テーブル形式でデータを管理する関係データベースシステム",desc:"Relational Database Management System。SQL・主キー・外部キーによるテーブル間関連付けでデータを管理する。"},
{cat:"データベース",term:"SQL",keyword:"データベースを操作するための問い合わせ言語",desc:"Structured Query Language。SELECT（検索）・INSERT（挿入）・UPDATE（更新）・DELETE（削除）などでDBを操作する。"},
{cat:"データベース",term:"主キー",keyword:"テーブルの各行を一意に識別する列（重複不可・NULL不可）",desc:"Primary Key。テーブル内のレコードを唯一特定できる列。値の重複とNULLは許可されない。"},

const CATS = ["すべて", ...new Set(DATA.map(d=>d.cat))];
let activeCat = "すべて";
let currentMode = "flash";
let searchQ = "";

function getPool(){
  return DATA.filter(d=>{
    const matchCat = activeCat==="すべて" || d.cat===activeCat;
    const q = searchQ.toLowerCase();
    const matchQ = !q || d.term.toLowerCase().includes(q) || d.keyword.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}
function shuffle(arr){ return [...arr].sort(()=>Math.random()-.5); }

function buildTabs(){
  const w = document.getElementById("tabWrap");
  w.innerHTML = "";
  CATS.forEach(cat=>{
    const n = cat==="すべて" ? DATA.length : DATA.filter(d=>d.cat===cat).length;
    const b = document.createElement("button");
    b.className = "tab-btn"+(cat===activeCat?" active":"");
    b.textContent = `${cat}(${n})`;
    b.onclick = ()=>{ activeCat=cat; searchQ=""; document.getElementById("searchInput").value=""; buildTabs(); if(currentMode==="flash") initFlash(); else startQuiz(); };
    w.appendChild(b);
  });
}

function onSearch(){
  searchQ = document.getElementById("searchInput").value.trim();
  if(currentMode==="flash") initFlash();
  else startQuiz();
}

function switchMode(m){
  currentMode = m;
  document.getElementById("btnFlash").className = "mode-btn"+(m==="flash"?" active":"");
  document.getElementById("btnQuiz").className  = "mode-btn"+(m==="quiz"?" active":"");
  document.getElementById("flashMode").style.display = m==="flash"?"block":"none";
  document.getElementById("quizMode").style.display  = m==="quiz"?"block":"none";
  if(m==="flash") initFlash(); else startQuiz();
}

function setProgress(cur,total){
  const pct = total ? Math.round(cur/total*100) : 0;
  document.getElementById("progBar").style.width = pct+"%";
  document.getElementById("progLabel").innerHTML = `<span>${cur}</span> / ${total}問`;
}

let fDeck=[], fIdx=0, fOkSet=new Set();

function initFlash(){
  fDeck = shuffle(getPool());
  fIdx = 0; fOkSet.clear();
  if(fDeck.length===0){ document.getElementById("fKw").textContent="該当なし"; return; }
  showFlashCard();
}

function showFlashCard(){
  if(!fDeck.length) return;
  const d = fDeck[fIdx];
  document.getElementById("flashCard").classList.remove("revealed");
  document.getElementById("fCat").textContent  = d.cat;
  document.getElementById("fCat2").textContent = d.cat;
  document.getElementById("fKw").textContent   = d.keyword;
  document.getElementById("fAns").textContent  = d.term;
  document.getElementById("fDesc").textContent = d.desc;
  document.getElementById("fPrev").disabled = fIdx===0;
  document.getElementById("fNext").disabled = fIdx===fDeck.length-1;
  setProgress(fIdx+1, fDeck.length);
}

function revealFlash(){
  document.getElementById("flashCard").classList.toggle("revealed");
}

function flashMove(dir){
  fIdx = Math.max(0, Math.min(fDeck.length-1, fIdx+dir));
  showFlashCard();
}

function markFlash(ok){
  if(ok){ fOkSet.add(fDeck[fIdx].term); }
  else   { fOkSet.delete(fDeck[fIdx].term); }
  if(fIdx < fDeck.length-1){ fIdx++; showFlashCard(); }
  else{
    const ng = fDeck.length - fOkSet.size;
    alert(`お疲れさまでした！\n✅覚えた: ${fOkSet.size}語　❌もう一度: ${ng}語`);
    if(ng > 0){
      fDeck = shuffle(fDeck.filter(d=>!fOkSet.has(d.term)));
      fIdx = 0; showFlashCard();
    }
  }
}

function shuffleFlash(){ initFlash(); }
function resetFlash()  { initFlash(); }

// ══════════════════════════════════════════════
// 4択クイズ
// ══════════════════════════════════════════════
let qPool=[], qIdx=0, qScore=0, qMiss=[], qAnswered=false;

function startQuiz(){
  document.getElementById("quizBody").style.display    = "block";
  document.getElementById("scoreScreen").className     = "score-screen";
  qPool = shuffle(getPool());
  qIdx=0; qScore=0; qMiss=[];
  if(qPool.length===0){ document.getElementById("qKw").textContent="該当なし"; return; }
  showQuiz();
}

function showQuiz(){
  if(qIdx >= qPool.length){ showScore(); return; }
  qAnswered = false;
  const d = qPool[qIdx];
  document.getElementById("qCat").textContent = d.cat;
  document.getElementById("qKw").textContent  = d.keyword;

  const sameCat = DATA.filter(x=>x.cat===d.cat && x.term!==d.term);
  let pool3 = shuffle(sameCat).slice(0,3);
  if(pool3.length < 3){
    const extra = shuffle(DATA.filter(x=>x.term!==d.term&&!pool3.includes(x))).slice(0,3-pool3.length);
    pool3 = pool3.concat(extra);
  }
  const choices = shuffle([d, ...pool3]);

  const box = document.getElementById("choices");
  box.innerHTML = "";
  choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = c.term;
    btn.onclick = ()=>answerQuiz(c.term, d.term, d.desc, btn);
    box.appendChild(btn);
  });

  document.getElementById("quizFb").className = "quiz-fb";
  document.getElementById("quizNext").className = "quiz-next";
  setProgress(qIdx, qPool.length);
}

function answerQuiz(chosen, correct, desc, btn){
  if(qAnswered) return;
  qAnswered = true;
  document.querySelectorAll(".choice-btn").forEach(b=>{
    b.disabled = true;
    if(b.textContent===correct) b.classList.add("correct");
  });
  const fb = document.getElementById("quizFb");
  const verdict = document.getElementById("fbVerdict");
  if(chosen===correct){
    btn.classList.add("correct");
    fb.className = "quiz-fb show ok";
    verdict.textContent = "✅ 正解！";
    qScore++;
  } else {
    btn.classList.add("wrong");
    fb.className = "quiz-fb show ng";
    verdict.textContent = "❌ 不正解";
    qMiss.push({term:correct, keyword:qPool[qIdx].keyword});
  }
  document.getElementById("fbDesc").textContent = desc;
  const nxt = document.getElementById("quizNext");
  nxt.className = "quiz-next show";
  nxt.textContent = qIdx===qPool.length-1 ? "結果を見る 🎉" : "次の問題 ▶";
}

function nextQuiz(){ qIdx++; showQuiz(); }

function showScore(){
  document.getElementById("quizBody").style.display = "none";
  const sc = document.getElementById("scoreScreen");
  sc.className = "score-screen show";
  const pct = Math.round(qScore/qPool.length*100);
  document.getElementById("scoreBig").textContent   = pct+"%";
  document.getElementById("scoreLabel").textContent = `${qScore} / ${qPool.length} 問正解`;
  let msg = pct===100?"🎉 完璧！全問正解！":pct>=80?"👏 素晴らしい！":pct>=60?"📚 もう少し！苦手を確認しよう":"💪 一緒に頑張ろう！";
  document.getElementById("scoreMsg").textContent = msg;
  setProgress(qPool.length, qPool.length);
  const ml = document.getElementById("missList");
  if(qMiss.length>0){
    ml.innerHTML = `<h3>❌ もう一度確認（${qMiss.length}語）</h3>`;
    qMiss.forEach(m=>{ ml.innerHTML += `<div class="miss-item"><div class="mt">✏️ ${m.term}</div><div class="mk">${m.keyword}</div></div>`; });
  } else { ml.innerHTML = ""; }
}

// 初期化
buildTabs();
initFlash();
</script>
