<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嚥下障害 表の穴埋め</title>
<style>
  :root{
    --bg:#f0f4f8; --surface:#fff; --surface2:#e8eef5;
    --primary:#2563a8; --primary-light:#dbeafe; --primary-dark:#1a4480;
    --correct:#15803d; --correct-bg:#dcfce7; --wrong:#b91c1c; --wrong-bg:#fee2e2;
    --text:#1e293b; --text-sub:#475569; --text-muted:#94a3b8; --border:#cbd5e1;
    --pink:#f9a8c9; --pink-l:#fce7f3; --pink-d:#6b2144; --star:#f59e0b;
    --blank:#fffbeb; --accent:#0e7490;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:84px}
  header{background:var(--primary);color:#fff;padding:14px 18px 10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  header h1{font-size:1rem;font-weight:700}
  header p{font-size:.74rem;opacity:.85;margin-top:2px}
  main{max-width:920px;margin:0 auto;padding:14px 10px}

  /* メニュー */
  .sec-title{font-size:.78rem;font-weight:700;color:var(--text-sub);margin:6px 2px 8px}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cat{background:var(--surface);border:2px solid var(--primary);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font-family:inherit;transition:background .15s}
  .cat:hover{background:var(--primary-light)}
  .cat .n{display:block;font-size:1rem;font-weight:700;color:var(--primary-dark)}
  .cat .c{display:block;font-size:.74rem;color:var(--text-muted);margin-top:4px}
  .sub-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .sub{background:var(--surface);border:1.5px solid var(--border);border-radius:8px;padding:10px 6px;font-size:.82rem;font-weight:700;color:var(--text-sub);cursor:pointer;font-family:inherit}
  .sub:hover{border-color:var(--primary);color:var(--primary)}
  .howto{margin-top:18px;padding:10px 12px;background:var(--surface);border-radius:8px;border-left:3px solid var(--primary);font-size:.76rem;line-height:1.6;color:var(--text-sub)}

  /* 練習画面 */
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .back{background:none;border:1.5px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.78rem;cursor:pointer;color:var(--text-sub);font-family:inherit}
  .ttl{flex:1;font-weight:700;font-size:.9rem;color:var(--text-sub)}
  .score{font-size:.9rem;font-weight:700;color:var(--primary);white-space:nowrap}
  .seg{display:flex;margin-bottom:10px;border:1.5px solid var(--primary);border-radius:8px;overflow:hidden}
  .seg button{flex:1;border:none;background:var(--surface);color:var(--primary);font-weight:700;font-size:.85rem;padding:9px 6px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--primary);color:#fff}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
  .chips .note{font-size:.76rem;color:var(--text-sub);font-weight:700}
  .chip{border:1.5px solid var(--border);background:var(--surface);border-radius:16px;padding:5px 12px;font-size:.8rem;font-weight:700;color:var(--text-sub);cursor:pointer;font-family:inherit}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .hint{font-size:.72rem;color:var(--text-muted);margin-bottom:12px;line-height:1.5}
  .empty{padding:20px;text-align:center;color:var(--text-muted);font-size:.85rem}

  .tsec{margin-bottom:22px}
  .tt{font-size:.82rem;font-weight:700;color:var(--text-sub);padding:6px 10px;background:var(--surface2);border-left:3px solid var(--primary);border-radius:6px;margin-bottom:8px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  table.tb{border-collapse:collapse;background:var(--surface);font-size:.8rem;min-width:640px;width:100%}
  table.tb.narrow{min-width:420px}
  table.tb td{border:1px solid var(--border);padding:6px 7px;vertical-align:middle;line-height:1.45}
  td.th{background:var(--pink);color:#5b1a38;font-weight:700;text-align:center;font-size:.76rem}
  td.k-cat,td.k-stage{background:var(--pink-l);color:var(--pink-d);font-weight:700;text-align:center}
  td.k-name{background:#fffbf5;font-weight:600}
  td.k-func,td.k-obs,td.k-bg{text-align:left}
  td.void{background:var(--bg);border:none}
  td.src{border:none;font-size:.72rem;color:var(--text-muted);background:transparent}
  td.vh{writing-mode:vertical-rl;letter-spacing:.15em;text-align:center;background:var(--pink);color:#5b1a38;font-weight:700;padding:6px 4px}
  .stm{color:var(--star);font-size:.75rem;margin-right:2px}

  /* 空欄セル（タップ） */
  td.tc{position:relative;cursor:pointer;min-width:76px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;scroll-margin-top:130px}
  td.tc.hid{background:var(--blank)}
  td.tc.hid .av{visibility:hidden}
  td.tc.hid::after{content:attr(data-ph);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.66rem;color:var(--primary);background:var(--primary-light);padding:2px 8px;border-radius:10px;font-weight:700;white-space:nowrap;pointer-events:none}
  td.tc.shown,td.tc.ok{background:var(--correct-bg)}
  td.tc.shown .av,td.tc.ok .av{color:var(--correct);font-weight:700}
  td.tc.ng{background:var(--wrong-bg)}
  td.tc.ng .av{color:var(--wrong);font-weight:700}
  td.tc .mk{font-size:.8rem;margin-left:4px}
  td.tc.cur{outline:3px solid var(--primary);outline-offset:-3px}

  /* 下部バー */
  .act{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 10px;display:flex;gap:6px;z-index:60}
  .act button{flex:1;border:none;border-radius:8px;padding:11px 4px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}
  .a1{background:var(--primary);color:#fff}
  .a2{background:var(--wrong-bg);color:var(--wrong)}
  .a3{background:var(--surface2);color:var(--text-sub)}

  /* 選択肢シート */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;display:none}
  .sheet.open{display:block}
  .sh-box{background:var(--surface);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:12px 14px 16px;max-height:66vh;overflow-y:auto;max-width:720px;margin:0 auto}
  .sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .sh-prog{font-size:.74rem;color:var(--text-muted);font-weight:700}
  .sh-x{border:none;background:var(--surface2);border-radius:50%;width:28px;height:28px;font-size:.9rem;cursor:pointer}
  .sh-ctx{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:.78rem;line-height:1.6;color:var(--text-sub);margin-bottom:8px}
  .sh-ctx b{color:var(--text)}
  .sh-q{font-size:.98rem;font-weight:700;margin-bottom:8px}
  .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:.9rem;font-family:inherit;color:var(--text);cursor:pointer;line-height:1.4}
  .opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-light)}
  .opt.right{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);font-weight:700}
  .opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong)}
  .sh-ex{margin-top:8px;padding:9px 11px;border-radius:8px;background:#e6f6fa;border-left:3px solid var(--accent);font-size:.78rem;line-height:1.65;color:var(--text);display:none}
  .sh-ex .h{font-weight:700;color:var(--accent);margin-bottom:3px}
  .sh-ex .nt{margin-top:4px;font-weight:700}
  .sh-nav{display:none;margin-top:10px}
  .sh-nav button{width:100%;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:inherit;background:var(--primary);color:#fff}
  .toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 16px;border-radius:20px;font-size:.82rem;font-weight:700;z-index:90;display:none;white-space:nowrap}

  @media(max-width:480px){ .cat-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <h1>嚥下障害　表の穴埋め</h1>
  <p>ミニテスト範囲：表1 嚥下モデル／表2 咀嚼筋／表3 嚥下に関わる筋／表8 摂食場面の観察</p>
</header>
<main>
  <div id="menu"></div>
  <div id="prac" style="display:none">
    <div class="bar">
      <button class="back" onclick="goMenu()">← 戻る</button>
      <div class="ttl" id="ttl"></div>
      <div class="score" id="score"></div>
    </div>
    <div class="seg" id="seg">
      <button id="seg-tap" onclick="setMode('tap')">👆 タップで答えを見る</button>
      <button id="seg-choice" onclick="setMode('choice')">🔘 選択肢（5択）</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="hint" id="hint"></div>
    <div id="tables"></div>
  </div>
</main>
<div class="act" id="act" style="display:none"></div>

<div class="sheet" id="sheet">
  <div class="sh-box">
    <div class="sh-head"><span class="sh-prog" id="sh-prog"></span><button class="sh-x" onclick="closeQ()">✕</button></div>
    <div class="sh-ctx" id="sh-ctx"></div>
    <div class="sh-q" id="sh-q"></div>
    <div id="sh-opts"></div>
    <div class="sh-ex" id="sh-ex"></div>
    <div class="sh-nav" id="sh-nav"><button onclick="nextQ()">次の問題へ →</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===========================
// セル定義
//  S=固定 / N=名称 / C=分類 / V=神経 / F=機能・内容 / ST=期 / OB=観察ポイント / BG=背景要因
//  オプション: rs,cs=結合 / star=頻出 / s=選択肢用の短縮表記(30字以内) / ex=選択肢に出さない語 / nc=選択肢不可 / note=解説
// ===========================
const S=(t,o)=>Object.assign({t:t},o||{});
const mk=k=>(a,o)=>Object.assign({k:k,a:a},o||{});
const N=mk('name'),C=mk('cat'),V=mk('nerve'),F=mk('func'),ST=mk('stage'),OB=mk('obs'),BG=mk('bg');

const HEAD2=[S('分類',{cs:3,cls:'th'}),S('筋の名称',{cls:'th'}),S('機能',{cls:'th',cs:2}),S('神経支配',{cls:'th'})];
const HEAD3=[S('分類',{cs:3,cls:'th'}),S('筋の名称',{cls:'th'}),S('機能',{cls:'th'}),S('神経支配',{cls:'th'})];
const NOVAG=['迷走神経（Ⅹ）'];

const TABLES={

t1a:{axis:'col',ncol:7,head:null,title:'表1　嚥下モデル（液体やペーストの一口嚥下）',rows:[
 [S('液体やペーストの一口嚥下',{rs:5,cls:'vh'}), C('5期モデル',{cs:6,nc:1})],
 [S('',{cs:2,cls:'void'}), C('4期モデル',{cs:4,nc:1})],
 [N('先行期',{cs:2}), N('準備期（口腔準備期）',{rs:2}), C('3期モデル',{cs:3,nc:1})],
 [N('認知期'),N('捕食期'),N('口腔期'),N('咽頭期'),N('食道期')],
 [F('食物を認識する段階'),F('食物を口へ運ぶ段階'),
  F('口腔に取り込んだものをひとまとまりの食塊にして保持する段階'),
  F('舌運動によって食塊を咽頭へ送る段階'),
  F('咽喉頭の複数の運動によって食塊を食道へ送る段階'),
  F('蠕動運動によって食塊を胃へ送る段階')]
]},

t1b:{axis:'col',ncol:7,head:null,title:'表1　嚥下モデル（固形物の咀嚼を伴う嚥下）',rows:[
 [S('固形物の咀嚼を伴う嚥下',{rs:3,cls:'vh'}), C('プロセスモデル',{cs:6,nc:1})],
 [N('stage I transport（第一期輸送）'), N('processing（食物の粉砕と唾液との混和）',{cs:2}),
  N('stage II transport（第二期輸送）'), N('咽頭期'), N('食道期')],
 [F('口腔に取り込んだ食物を舌で臼歯部咬合面へ移動させる段階'),
  F('咀嚼によって食塊を粉砕し，唾液と混ぜて食塊を形成し，嚥下に適した状態になった食塊を部分的に咽頭に送り込む段階',{cs:3,s:'咀嚼して食塊を形成し，部分的に咽頭へ送る段階'}),
  F('咽喉頭の複数の運動によって食塊を食道へ送る段階'),
  F('蠕動運動によって食塊を胃へ送る段階')]
]},

t2:{axis:'row',ncol:7,head:HEAD2,title:'表2　咀嚼運動に関わる筋の機能と神経支配',rows:[
 [C('下顎運動',{rs:8}), C('咀嚼筋',{rs:5}), C('閉口筋',{rs:4}), N('咬筋'),
  F('下顎の挙上',{rs:4,cs:2}), V('三叉神経（Ⅴ）',{rs:7})],
 [N('側頭筋')],
 [N('内側翼突筋')],
 [N('外側翼突筋（上頭）')],
 [C('開口筋',{rs:4,star:true}), N('外側翼突筋（下頭）',{star:true,note:'外側翼突筋（下頭）は咀嚼筋のうち唯一の開口筋。'}),
  F('下顎の下制（舌骨固定時）',{rs:4}),
  F('嚥下時／下顎固定時は舌骨が挙上',{rs:3})],
 [C('舌骨上筋',{rs:3}), N('顎舌骨筋')],
 [N('顎二腹筋（前腹）',{star:true,note:'顎二腹筋は前腹が三叉神経（Ⅴ）、後腹が顔面神経（Ⅶ）。'})],
 [N('オトガイ舌骨筋',{star:true}),
  F('嚥下時／下顎固定時は舌骨が挙上，特に前方へ移動'),
  V('舌下神経（Ⅻ）',{star:true})],
 [C('その他の協調運動',{rs:4}), C('表情筋',{rs:2,cs:2}), N('口輪筋'),
  F('咀嚼中の食物口腔内保持（口唇閉鎖）',{cs:2}), V('顔面神経（Ⅶ）',{rs:2})],
 [N('頬筋'), F('咀嚼中の食物口腔内保持',{cs:2})],
 [C('舌筋',{cs:3}), F('咀嚼中の食物口腔内保持',{cs:2}), V('舌下神経（Ⅻ）')],
 [C('口蓋の筋',{cs:3}), F('咀嚼中の食物口腔内保持と気道確保',{cs:2}), V('咽頭神経叢（Ⅸ・Ⅹ）',{ex:NOVAG})]
]},

t3a:{axis:'row',ncol:6,head:HEAD3,title:'表3　嚥下に関わる筋の機能と神経支配（舌の筋）',rows:[
 [C('舌の筋',{rs:7}), C('内舌筋',{rs:4}), C('形を変える',{rs:4}), N('上縦舌筋'),
  F('舌尖を上にあげる，舌を短くして舌背にくぼみを作る'), V('舌下神経（Ⅻ）',{rs:7})],
 [N('下縦舌筋'), F('舌尖を下に向ける，舌を短くして舌背を凸にする')],
 [N('横舌筋'), F('舌の幅を狭める，舌を伸ばす，舌背を高くする')],
 [N('垂直舌筋'), F('舌の幅を広げる，舌を平らに薄くする')],
 [C('外舌筋',{rs:3}), C('位置を変える',{rs:3}), N('オトガイ舌筋'), F('舌の突出，舌の下制')],
 [N('舌骨舌筋'), F('舌の後退，舌の下制')],
 [N('茎突舌筋'), F('舌の後退，舌背の挙上')]
]},

t3b:{axis:'row',ncol:6,head:HEAD3,title:'表3　嚥下に関わる筋の機能と神経支配（軟口蓋の筋）',rows:[
 [C('軟口蓋の筋',{rs:5}), C('軟口蓋の動き',{rs:5,cs:2}), N('口蓋帆張筋',{star:true}),
  F('軟口蓋を緊張，嚥下時の耳管拡張と空気圧調整'),
  V('三叉神経（Ⅴ）',{star:true,note:'軟口蓋の筋のうち口蓋帆張筋だけが三叉神経（Ⅴ）。他は咽頭神経叢（Ⅸ・Ⅹ）。'})],
 [N('口蓋帆挙筋'), F('軟口蓋を挙上，鼻咽腔閉鎖'),
  V('咽頭神経叢（Ⅸ・Ⅹ）／迷走',{rs:4,s:'咽頭神経叢（Ⅸ・Ⅹ）',ex:NOVAG})],
 [N('口蓋垂筋'), F('口蓋垂の緊張と短縮，鼻咽腔閉鎖の補助')],
 [N('口蓋舌筋'), F('軟口蓋下降，口峡を狭くする，口蓋と舌を近づける')],
 [N('口蓋咽頭筋'), F('軟口蓋下降，口峡を狭くする，咽頭側壁を前内方へ牽引')]
]},

t3c:{axis:'row',ncol:6,head:HEAD3,title:'表3　嚥下に関わる筋の機能と神経支配（咽頭の筋）',rows:[
 [C('咽頭の筋',{rs:6}), C('咽頭の挙上',{rs:2,cs:2}), N('茎突咽頭筋'),
  F('咽頭を挙上'),
  V('舌咽神経（Ⅸ）',{note:'茎突咽頭筋は舌咽神経（Ⅸ）。咽頭の他の筋は咽頭神経叢（Ⅸ・Ⅹ）。'})],
 [N('耳管咽頭筋'), F('咽頭を挙上'), V('咽頭神経叢（Ⅸ・Ⅹ）',{rs:5,ex:NOVAG})],
 [C('咽頭の収縮',{rs:4,cs:2}), N('上咽頭収縮筋'),
  F('咽頭壁の連続的収縮，咽頭腔を狭くする（咽頭縮小）',{rs:3})],
 [N('中咽頭収縮筋')],
 [N('下咽頭収縮筋（甲状咽頭筋）')],
 [N('下咽頭収縮筋（輪状咽頭筋／上食道括約筋）',{star:true,s:'下咽頭収縮筋（輪状咽頭筋）'}),
  F('食道入口部の緊張と弛緩．下咽頭収縮筋に含めない研究者もいる',{s:'食道入口部の緊張と弛緩'})]
]},

t3d:{axis:'row',ncol:6,head:HEAD3,title:'表3　嚥下に関わる筋の機能と神経支配（喉頭の筋）',rows:[
 [C('喉頭の筋',{rs:5}), C('内喉頭筋',{rs:5}), C('声門の動き',{rs:5}), N('輪状甲状筋'),
  F('声帯の伸展'), V('上喉頭神経（Ⅹ）',{ex:NOVAG})],
 [N('甲状披裂筋'), F('声門閉鎖',{rs:3}), V('反回神経（Ⅹ）',{rs:4,ex:NOVAG})],
 [N('披裂筋')],
 [N('外側輪状披裂筋')],
 [N('後輪状披裂筋'), F('声門開大')]
]},

t3e:{axis:'row',ncol:6,head:HEAD3,title:'表3　嚥下に関わる筋の機能と神経支配（舌骨の筋）',rows:[
 [C('舌骨の筋',{rs:9}), C('舌骨上筋',{rs:5}), C('舌骨の動き',{rs:9}), N('顎舌骨筋'),
  F('下顎固定時の舌骨挙上（前上方）'), V('三叉神経（Ⅴ）')],
 [N('顎二腹筋（前腹）',{star:true}), F('下顎固定時の舌骨挙上（前上方）'), V('三叉神経（Ⅴ）',{star:true})],

(function initLayout(){
  Object.keys(TABLES).forEach(tid=>{
    const t=TABLES[tid], rows=(t.head?[t.head]:[]).concat(t.rows), occ=[]; let n=0;
    TCELLS[tid]=[];
    rows.forEach((row,r)=>{
      occ[r]=occ[r]||[]; let c=0;
      row.forEach(cell=>{
        while(occ[r][c]) c++;
        const rs=cell.rs||1, cs=cell.cs||1;
        for(let dr=0;dr<rs;dr++){ occ[r+dr]=occ[r+dr]||[]; for(let dc=0;dc<cs;dc++) occ[r+dr][c+dc]=1; }
        cell.tid=tid; cell.r0=r; cell.r1=r+rs-1; cell.c0=c; cell.c1=c+cs-1;
        if(!(t.head && r===0)){ cell.id=tid+'-'+(n++); BYID[cell.id]=cell; TCELLS[tid].push(cell); }
        c+=cs;
      });
    });

})();

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const optText=c=>String(c.s!==undefined?c.s:(c.a||'')).replace(/\n/g,'');
const fullText=c=>String(c.a||'').replace(/\n/g,'');
const rngOf=(c,ax)=>ax==='col'?[c.c0,c.c1]:[c.r0,c.r1];
const ovl=(a,b)=>a[0]<=b[1]&&b[0]<=a[1];
const within=(a,b)=>b[0]<=a[0]&&a[1]<=b[1];
const dedupe=a=>Array.from(new Set(a));
const clip=(a,n)=>a.length>n?a.slice(0,n).join('・')+'ほか'+(a.length-n)+'件':a.join('・');
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function availKinds(){ return KIND_ORDER.filter(k=>viewTables().some(t=>TCELLS[t].some(c=>c.k===k))); }
function setDefaults(){

// ===========================
// 選択肢の生成（5択）
// ===========================
function matches(kind,text,pref){
  const all=[]; ALL.forEach(t=>TCELLS[t].forEach(c=>{ if(c.k===kind&&optText(c)===text) all.push(c); }));
  const p=all.filter(c=>c.tid===pref); return p.length?p:all;
}
function relList(m,ks){
  const ax=TABLES[m.tid].axis, R=rngOf(m,ax);
  return TCELLS[m.tid].filter(x=>x!==m&&ks.indexOf(x.k)>=0&&ovl(rngOf(x,ax),R));
}
function describe(kind,text,pref,self){
  const ms=self?[self]:matches(kind,text,pref);
  if(!ms.length) return text+'：この表には対応する項目がない';
  const rel=ks=>dedupe([].concat.apply([],ms.map(m=>relList(m,ks).map(optText))));
  // 筋名の列がない行（舌筋・口蓋の筋）は、いちばん細かい分類名で代用
  const subject=()=>{
    const n=rel(['name']); if(n.length) return clip(n,3);
    const cs=[].concat.apply([],ms.map(m=>relList(m,['cat']))).sort((x,y)=>(x.r1-x.r0+x.c1-x.c0)-(y.r1-y.r0+y.c1-y.c0));
    return cs.length?optText(cs[0]):'';
  };
  switch(kind){
    case 'nerve': return text+'：'+subject()+'の神経支配';
    case 'func':  return text+'：'+subject()+'の機能';
    case 'cat':   { const n=rel(['name']); return text+'：'+(n.length?clip(n,3)+'を含む':'筋名の記載なし（'+(rel(['func'])[0]||'')+'）'); }
    case 'name':  return text+'：'+[rel(['func'])[0],rel(['nerve'])[0]].filter(Boolean).join('／');
    case 'stage': return text+'：'+clip(rel(['obs']),2);
    case 'obs':   return text+'：'+clip(rel(['stage']),2)+'の観察ポイント';
    case 'bg':    { const o=rel(['obs'])[0]; return text+'：'+clip(rel(['stage']),2)+(o?'「'+o+'」':'')+'の背景要因'; }
  }
  return text;
}
const ctxLabel=(tid,k)=>({cat:'分類',stage:'期',name:tid==='t1a'||tid==='t1b'?'段階':'筋',obs:'観察ポイント',func:tid==='t1a'||tid==='t1b'?'内容':'機能',nerve:'神経支配',bg:'背景要因'})[k];
function qLine(cell){
  const t1=cell.tid==='t1a'||cell.tid==='t1b';
  if(cell.k==='name') return t1?'段階の名称は？':'筋の名称は？';
  return ctxLabel(cell.tid,cell.k)+'は？';
}

function buildQ(cell,blankSet){
  const t=TABLES[cell.tid], ax=t.axis, R=rngOf(cell,ax), same=TCELLS[cell.tid];
  const ans=optText(cell); if(!ans||ans.length>30) return null;
  const ctx=same.filter(x=>x!==cell&&x.k&&x.k!==cell.k&&ovl(rngOf(x,ax),R)&&!blankSet.has(x.id));
  const ex=cell.ex||[];
  // この空欄と同じ行/列に重なる同種セルの答え（＝正解にもなり得る語）は選択肢に出さない
  const banned={}; banned[ans]=1;
  same.forEach(x=>{ if(x!==cell&&x.k===cell.k&&ovl(rngOf(x,ax),R)) banned[optText(x)]=1; });
  const okText=x=>{const tx=optText(x);return tx&&tx.length<=30&&!banned[tx]&&ex.indexOf(tx)<0&&!x.nc;};
  const subj=x=>dedupe(relList(x,['name']).map(optText));
  const tn=cell.k==='name'?[]:subj(cell);
  const mid=(R[0]+R[1])/2;
  const dist=x=>{const r=rngOf(x,ax);return Math.abs((r[0]+r[1])/2-mid);};
  const uniq=arr=>{const s={},o=[];arr.forEach(x=>{const tx=optText(x);if(!s[tx]){s[tx]=1;o.push(x);}});return o;};
  const L=ans.length;
  const byLen=arr=>arr.map(x=>({x:x,k:Math.abs(optText(x).length-L)+Math.random()*3})).sort((a,b)=>a.k-b.k).map(o=>o.x);

  // 同じ表の候補：同じ行/列に重ならず、手がかり全部に当てはまらないもの
  let p0=same.filter(x=>x!==cell&&x.k===cell.k&&okText(x)&&!ovl(rngOf(x,ax),R)
        &&!(ctx.length&&ctx.every(y=>within(rngOf(x,ax),rngOf(y,ax)))));
  p0=uniq(shuffle(p0).sort((a,b)=>dist(a)-dist(b)));
  let p1=[];
  (FAMS[FAM[cell.tid]]||[]).forEach(o=>{ if(o!==cell.tid) TCELLS[o].forEach(x=>{
    if(x.k!==cell.k||!okText(x)) return;
    if(tn.length&&subj(x).some(n=>tn.indexOf(n)>=0)) return;   // 同じ筋について述べている別表の項目は除外
    p1.push(x);
  }); });
  p1=uniq(p1);

  const picked=[], used={}; used[ans]=1;
  const add=tx=>{ if(used[tx]) return false; used[tx]=1; picked.push(tx); return true; };
  p0.slice(0,2).forEach(x=>add(optText(x)));                       // 隣接概念
  byLen(p0.slice(2)).forEach(x=>{ if(picked.length<4) add(optText(x)); });
  if(picked.length<4) byLen(p1).forEach(x=>{ if(picked.length<4) add(optText(x)); });
  if(picked.length<4) (EXTRA[cell.k]||[]).forEach(tx=>{ if(picked.length<4&&tx.length<=30&&ex.indexOf(tx)<0&&!banned[tx]) add(tx); });
  if(picked.length<4) return null;

  // 正解だけ長くならないよう調整
  const lens=picked.map(s=>s.length);
  if(L>Math.max.apply(null,lens)*1.15){
    const reserve=p0.concat(p1).map(optText).filter(tx=>!used[tx]).sort((a,b)=>b.length-a.length);
    if(reserve.length&&reserve[0].length>Math.min.apply(null,lens)){
      const si=lens.indexOf(Math.min.apply(null,lens)); picked[si]=reserve[0];
    }
  }
  const opts=shuffle(picked.concat([ans])); const ai=opts.indexOf(ans);

  // 手がかり表示
  const ORDERC=['cat','stage','name','obs','func','nerve','bg'];
  const ctxHTML=ORDERC.map(k=>{
    const items=dedupe(ctx.filter(x=>x.k===k).map(fullText));
    return items.length?'<b>'+ctxLabel(cell.tid,k)+'</b>：'+esc(clip(items,4)):'';
  }).filter(Boolean).join('<br>')||'（手がかりなし）';

  // 解説（各選択肢がどこの答えか）
  const lines=opts.map((tx,i)=>{
    const d=(i===ai)?describe(cell.k,tx,cell.tid,cell):describe(cell.k,tx,cell.tid,null);
    return (i===ai?'<b>':'')+OPT_NUM[i]+' '+esc(d)+(i===ai?'</b>':'');
  });
  return {opts:opts,ans:ai,ctx:ctxHTML,qline:qLine(cell),ex:lines.join('<br>'),note:cell.note||''};
}

function pickBlankIds(){
  const cand=[]; viewTables().forEach(t=>TCELLS[t].forEach(c=>{ if(c.k) cand.push(c); }));
  const base=c=>mode==='tap'||(!c.nc&&optText(c)&&optText(c).length<=30);
  const greedy=(list,n)=>{
    const out=new Set(), taken=[];
    for(const c of list){
      if(out.size>=n) break;
      if(mode==='choice'){
        const ax=TABLES[c.tid].axis, R=rngOf(c,ax);
        if(taken.some(x=>x.tid===c.tid&&ovl(rngOf(x,ax),R))) continue;   // 同じ行/列に空欄を重ねない
      }
      out.add(c.id); taken.push(c);
    }
    return out;
  };
  if(view.type==='random') return greedy(shuffle(cand.filter(base)),Math.round(cand.length*0.3));
  if(view.type==='star')   return greedy(cand.filter(c=>c.star&&base(c)),9999);
  const out=new Set(); cand.filter(c=>kinds.has(c.k)&&base(c)).forEach(c=>out.add(c.id)); return out;
}

  if(c.k&&BLANKSET.has(c.id)){
    blanks[c.id]={c:c,state:'hid',q:QMAP[c.id]};
    return '<td class="tc hid k-'+c.k+'"'+a+' id="c-'+c.id+'" data-ph="'+(mode==='tap'?'タップ':'選ぶ')+'" onclick="cellTap(\''+c.id+'\')">'+star+'<span class="av">'+pre+full+'</span><span class="mk"></span></td>';
  }
  const cls=c.cls||(c.k?'k-'+c.k:'');
  return '<td class="'+cls+'"'+a+'>'+star+pre+full+'</td>';
}
function tableHTML(tid){
  const t=TABLES[tid], before=Object.keys(blanks).length;
  let body=''; t.rows.forEach(r=>{ body+='<tr>'+r.map(cellHTML).join('')+'</tr>'; });
  const added=Object.keys(blanks).length-before;
  if(added===0&&view.type!=='cat') return '';
  const head=t.head?'<tr>'+t.head.map(cellHTML).join('')+'</tr>':'';
  return '<div class="tsec"><div class="tt">'+t.title+'</div><div class="tw"><table class="tb'+(t.narrow?' narrow':'')+'">'+head+body+'</table></div></div>';
}
function render(){
  blanks={}; ORDER=[]; closeQ();
  BLANKSET=pickBlankIds(); QMAP={};
  if(mode==='choice'){
    Array.from(BLANKSET).forEach(id=>{
      const q=buildQ(BYID[id],BLANKSET);
      if(q) QMAP[id]=q; else BLANKSET.delete(id);
    });
  }
  let h=''; viewTables().forEach(t=>{ h+=tableHTML(t); });
  ORDER=Object.keys(blanks);
  if(!ORDER.length) h='<div class="empty">選んだ項目の空欄がここにはありません。上の項目を切り替えてください。</div>';
  $('tables').innerHTML=h;

  $('seg-tap').classList.toggle('on',mode==='tap'); $('seg-choice').classList.toggle('on',mode==='choice');
  $('hint').textContent=mode==='tap'?'空欄をタップすると答えが出ます。もう一度タップで隠せます。':'空欄をタップすると5択の問題が出ます。選ぶとすぐ採点・解説。';
  updateChips(); renderBar(); updateScore(); window.scrollTo(0,0);

function updateChips(){
  const box=$('chips');
  if(view.type==='random'||view.type==='star'){
    box.innerHTML='<span class="note">'+(view.type==='random'?'全項目から約30%をランダムに空欄化（リセットで再抽選）':'★頻出の箇所だけを空欄化')+'</span>'; return;
  }
  box.innerHTML='<span class="note">'+(mode==='choice'?'空欄にする項目（1つ選ぶ）：':'空欄にする項目：')+'</span>'
    +availKinds().map(k=>'<button class="chip '+(kinds.has(k)?'on':'')+'" onclick="toggleKind(\''+k+'\')">'+KIND_LABEL[k]+'</button>').join('');
}
function toggleKind(k){
  if(mode==='choice') kinds=new Set([k]);
  else { if(kinds.has(k)){ if(kinds.size===1) return; kinds.delete(k); } else kinds.add(k); }
  render();
}
function renderBar(){
  $('act').innerHTML=mode==='tap'
   ? '<button class="a1" onclick="showAll()">👁 全て表示</button><button class="a3" onclick="hideAll()">🙈 全て隠す</button><button class="a3" onclick="render()">🔄 リセット</button>'
   : '<button class="a1" onclick="startFirst()">▶ 出題スタート</button><button class="a2" onclick="retryWrong()">❌だけ再挑戦</button><button class="a3" onclick="render()">🔄 リセット</button>';
}

// ===========================
// セル操作
// ===========================
function paint(id){
  const b=blanks[id], td=$('c-'+id);
  td.classList.remove('hid','shown','ok','ng'); td.classList.add(b.state);
  td.querySelector('.mk').textContent=b.state==='ok'?'⭕':b.state==='ng'?'❌':'';
}
function cellTap(id){
  const b=blanks[id]; if(!b) return;
  if(mode==='tap'){ b.state=b.state==='shown'?'hid':'shown'; paint(id); updateScore(); }
  else openQ(id);
}
function showAll(){ ORDER.forEach(id=>{ blanks[id].state='shown'; paint(id); }); updateScore(); }
function hideAll(){ ORDER.forEach(id=>{ blanks[id].state='hid'; paint(id); }); updateScore(); }
function updateScore(){
  const total=ORDER.length; if(!total){ $('score').textContent=''; return; }
  if(mode==='tap'){ $('score').textContent='👁 '+ORDER.filter(i=>blanks[i].state==='shown').length+' / '+total; }
  else {
    const ok=ORDER.filter(i=>blanks[i].state==='ok').length, done=ORDER.filter(i=>blanks[i].state==='ok'||blanks[i].state==='ng').length;
    $('score').textContent='⭕ '+ok+' / '+total+(done?'（回答'+done+'）':'');
  }
}

// ===========================
// 選択肢シート
// ===========================
function openQ(id){
  const b=blanks[id]; if(!b||!b.q) return;
  curId=id;
  document.querySelectorAll('td.cur').forEach(e=>e.classList.remove('cur')); $('c-'+id).classList.add('cur');
  const q=b.q;
  $('sh-prog').textContent='第 '+(ORDER.indexOf(id)+1)+' 問 / 全 '+ORDER.length+' 問';
  $('sh-ctx').innerHTML=q.ctx; $('sh-q').textContent=q.qline;
  const box=$('sh-opts'); box.innerHTML='';
  q.opts.forEach((t,i)=>{
    const btn=document.createElement('button'); btn.className='opt'; btn.textContent=OPT_NUM[i]+'  '+t;
    btn.onclick=function(){ pickOpt(i); }; box.appendChild(btn);
  });
  $('sh-ex').style.display='none'; $('sh-nav').style.display='none';
  if(b.state==='ok'||b.state==='ng') showResult(b);
  $('sheet').classList.add('open');
  $('c-'+id).scrollIntoView({block:'start',inline:'center',behavior:'smooth'});
}
function pickOpt(i){
  const b=blanks[curId]; if(!b||b.state==='ok'||b.state==='ng') return;
  b.picked=i; b.state=(i===b.q.ans)?'ok':'ng'; paint(curId); showResult(b); updateScore();
}
function showResult(b){
  const q=b.q, btns=$('sh-opts').children;
  for(let i=0;i<btns.length;i++){
    btns[i].disabled=true;
    if(i===q.ans) btns[i].classList.add('right'); else if(i===b.picked) btns[i].classList.add('wrong');
  }
  const ok=b.state==='ok';
  $('sh-ex').innerHTML='<div class="h">'+(ok?'⭕ 正解　':'❌ 不正解　')+'正解は '+OPT_NUM[q.ans]+'</div>'+q.ex+(q.note?'<div class="nt">💡 '+esc(q.note)+'</div>':'');
  $('sh-ex').style.display='block'; $('sh-nav').style.display='block';
}
function closeQ(){
  $('sheet').classList.remove('open'); curId=null;
  document.querySelectorAll('td.cur').forEach(e=>e.classList.remove('cur'));
}
function nextQ(){
  const i=ORDER.indexOf(curId);
  const rest=ORDER.slice(i+1).concat(ORDER.slice(0,i+1));
  const nx=rest.find(id=>blanks[id].state==='hid');
  if(nx) openQ(nx);
  else {
    closeQ();
    const ok=ORDER.filter(x=>blanks[x].state==='ok').length;
    toast('全問終了　⭕ '+ok+' / '+ORDER.length);
  }
}
function startFirst(){
  const nx=ORDER.find(id=>blanks[id].state==='hid');
  if(nx) openQ(nx); else toast('未回答の空欄はありません');
}
function retryWrong(){
  const ng=ORDER.filter(id=>blanks[id].state==='ng');
  if(!ng.length){ toast('❌はありません'); return; }
  const set=new Set(ORDER);
  ng.forEach(id=>{
    const q=buildQ(BYID[id],set); if(q) blanks[id].q=q;
    blanks[id].state='hid'; blanks[id].picked=undefined; paint(id);
  });
  closeQ(); updateScore(); startFirst();
}
let toastTimer=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.display='none';},2200);
}

buildMenu();
</script>
</body>
