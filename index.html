<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>STクイズ道場｜科目一覧</title>
<style>
  :root{
    --navy:#1d3a6e;
    --navy-deep:#132a52;
    --paper:#f5f5f7;
    --card:#ffffff;
    --line:#e3e6ee;
    --text:#22283a;
    --sub:#8890a2;
    --accent:#3f7fd9;
    --gold:#c8973a;
  }
  
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--paper);
    color:var(--text);
    min-height:100vh;
  }
  #app{max-width:480px;margin:0 auto;padding:20px 16px 40px}

  /* ヘッダー */
  .hero{
    background:linear-gradient(155deg,var(--navy) 0%,var(--navy-deep) 100%);
    border-radius:18px;
    padding:26px 22px 22px;
    color:#fff;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    right:-30px;top:-30px;
    width:140px;height:140px;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
  }
  .hero-eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    color:var(--gold);
    font-weight:700;
    margin-bottom:6px;
  }
  .hero h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  .hero p{
    font-size:12.5px;
    color:rgba(255,255,255,.72);
    line-height:1.6;
  }

  /* セクション見出し */
  .section-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    color:var(--sub);
    letter-spacing:.06em;
    margin:22px 4px 10px;
  }
  .section-label .bar{
    width:3px;height:14px;
    background:var(--accent);
    border-radius:2px;
  }

  /* クイズリスト */
  .quiz-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .quiz-btn{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 16px;
    text-decoration:none;
    color:var(--text);
    box-shadow:0 1px 3px rgba(20,30,60,.04);
    transition:transform .12s, box-shadow .12s, border-color .12s;
  }
  .quiz-btn:active{
    transform:scale(0.97);
    background:#fafbfe;
  }
  .quiz-icon{
    flex-shrink:0;
    width:42px;height:42px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;
    background:var(--icon-bg,#e8f0fe);
  }
  .quiz-body{flex:1;min-width:0}
  .quiz-title{
    font-size:14.5px;
    font-weight:700;
    color:var(--text);
    margin-bottom:2px;
  }
  .quiz-desc{
    font-size:11.5px;
    color:var(--sub);
    line-height:1.4;
  }
  .quiz-arrow{
    flex-shrink:0;
    color:#c4cadb;
    font-size:18px;
    font-weight:700;
  }

  /* 準備中カード */
  .quiz-btn.disabled{
    opacity:.5;
    pointer-events:none;
  }
  .badge-soon{
    font-size:9.5px;
    font-weight:700;
    color:#fff;
    background:#b5bbc9;
    padding:2px 7px;
    border-radius:8px;
    margin-left:6px;
    vertical-align:middle;
  }

  footer{
    text-align:center;
    font-size:10.5px;
    color:#aab0c0;
    margin-top:32px;
    line-height:1.6;
  }
</style>
</head>
