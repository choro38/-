<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST定期テスト対策｜呼吸・発声・発話系 後半</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text: #2c2825;
    --sub: #7a7168;
    --accent: #8a3a3a;
    --accent-light: #f7e8e8;
    --correct: #2d7a4f;
    --correct-bg: #eaf5ef;
    --wrong: #c0392b;
    --wrong-bg: #fdf0ee;
    --star: #c8860a;
    --tag-bg: #eee9e1;
    --unit8: #8a3a3a;
    --unit10: #3a6b8a;
    --unit11: #5a7a3a;
    --unit12: #7a4a8a;
    --unit13: #8a6a3a;
    --unit14: #3a7a7a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  header {
    background: var(--accent);
    color: white;
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; }
  header p { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 80px; }

  #start-menu h2 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border);
  }

  .mode-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    background: var(--tag-bg);
    border-radius: 10px;
    padding: 4px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: transparent;
    color: var(--sub);
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .cat-btn {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .cat-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .cat-btn .cat-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 4px; }
  .cat-btn .cat-title { font-size: 0.9rem; font-weight: 700; }
  .cat-btn .cat-count { font-size: 0.72rem; color: var(--sub); margin-top: 4px; }
  .cat-btn[data-unit="8"] .cat-label { color: var(--unit8); }
  .cat-btn[data-unit="10"] .cat-label { color: var(--unit10); }
  .cat-btn[data-unit="11"] .cat-label { color: var(--unit11); }
  .cat-btn[data-unit="12"] .cat-label { color: var(--unit12); }
  .cat-btn[data-unit="13"] .cat-label { color: var(--unit13); }
  .cat-btn[data-unit="14"] .cat-label { color: var(--unit14); }

  .special-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
  }
  .special-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 700;
    transition: opacity 0.15s;
  }
  .special-btn:hover { opacity: 0.85; }
  .special-btn.star-btn { background: var(--star); }

  #progress-bar-wrap { display: none; margin-bottom: 16px; }
  #progress-info { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--sub); margin-bottom: 6px; }
  #progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  #progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }

  #quiz-area { display: none; }

  .q-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 14px;
    border: 1.5px solid var(--border);
  }

  .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .q-num { font-size: 0.72rem; font-weight: 700; color: var(--sub); letter-spacing: 0.05em; }
  .q-unit-tag { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--tag-bg); letter-spacing: 0.04em; }
  .q-unit-tag.u8 { background: #f7e8e8; color: var(--unit8); }
  .q-unit-tag.u10 { background: #e8f1f7; color: var(--unit10); }
  .q-unit-tag.u11 { background: #edf3e8; color: var(--unit11); }
  .q-unit-tag.u12 { background: #f3eaf7; color: var(--unit12); }
  .q-unit-tag.u13 { background: #f7f0e8; color: var(--unit13); }
  .q-unit-tag.u14 { background: #e8f5f5; color: var(--unit14); }
  .star-mark { font-size: 0.75rem; color: var(--star); font-weight: 700; }

  .q-text { font-size: 0.95rem; font-weight: 600; margin-bottom: 16px; line-height: 1.7; }

  .answer-input {
    width: 100%;
    min-height: 90px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.88rem;
    font-family: inherit;
    resize: vertical;
    background: var(--bg);
    transition: border-color 0.15s;
    line-height: 1.6;
  }
  .answer-input:focus { outline: none; border-color: var(--accent); background: white; }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 700; font-family: inherit; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary { background: var(--tag-bg); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }
  .btn-correct { background: var(--correct); color: white; }
  .btn-wrong { background: var(--wrong); color: white; }
  .btn-skip { background: transparent; color: var(--sub); border: 1.5px solid var(--border); }

  .answer-reveal { display: none; margin-top: 16px; border-top: 1.5px solid var(--border); padding-top: 14px; }
  .answer-reveal.show { display: block; }
  .answer-label { font-size: 0.72rem; font-weight: 700; color: var(--sub); letter-spacing: 0.08em; margin-bottom: 8px; }
  .answer-text { font-size: 0.9rem; line-height: 1.75; white-space: pre-wrap; color: var(--text); }
  .result-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 700; margin-bottom: 10px; }
  .badge-correct { background: var(--correct-bg); color: var(--correct); }
  .badge-wrong { background: var(--wrong-bg); color: var(--wrong); }

  /* 選択肢 */
  .choices-wrap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .choice-btn {
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    line-height: 1.5;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
  .choice-btn .choice-label { font-weight: 700; color: var(--accent); min-width: 20px; }
  .choice-btn.correct-ans { border-color: var(--correct); background: var(--correct-bg); }
  .choice-btn.correct-ans .choice-label { color: var(--correct); }
  .choice-btn.wrong-ans { border-color: var(--wrong); background: var(--wrong-bg); }
  .choice-btn.wrong-ans .choice-label { color: var(--wrong); }
  .choice-btn:disabled { cursor: default; }

  #score-screen {
    display: none;
    background: var(--surface);
    border-radius: 14px;
    padding: 32px 24px;
    text-align: center;
    border: 1.5px solid var(--border);
  }
  #score-screen h2 { font-size: 1.4rem; margin-bottom: 8px; }
  #score-num { font-size: 3rem; font-weight: 700; color: var(--accent); }
  #score-sub { font-size: 0.88rem; color: var(--sub); margin-top: 4px; margin-bottom: 24px; }
  #wrong-list { text-align: left; margin-top: 20px; }
  #wrong-list h3 { font-size: 0.85rem; font-weight: 700; color: var(--wrong); margin-bottom: 10px; }
  .wrong-item { font-size: 0.82rem; padding: 8px 10px; background: var(--wrong-bg); border-radius: 6px; margin-bottom: 6px; line-height: 1.5; }

  #nav-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1.5px solid var(--border);
    padding: 10px 16px;
    display: none;
    gap: 8px;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #nav-bar.show { display: flex; }
  #nav-bar .btn { flex: 1; max-width: 160px; text-align: center; }

  @media (max-width: 480px) {
    .category-grid { grid-template-columns: 1fr; }
    .special-grid { grid-template-columns: 1fr; }
    .q-text { font-size: 0.88rem; }
  }
</style>
</head>
<body>

<header>
  <h1>呼吸・発声・発話系の構造・機能 ｜ 定期テスト対策</h1>
  <p>後半分（⑧〜⑭）記述・選択 切替可｜全問収録</p>
</header>

<main>
  <div id="start-menu">
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-btn-write" onclick="setMode('write')">✏️ 記述モード</button>
      <button class="mode-btn" id="mode-btn-choice" onclick="setMode('choice')">🔘 選択モード</button>
    </div>
    <h2>カテゴリーから選ぶ</h2>
    <div class="category-grid">
      <button class="cat-btn" data-unit="8" onclick="startQuiz('unit8')">
        <div class="cat-label">⑧ SESSION 8</div>
        <div class="cat-title">口腔咽頭の病態</div>
        <div class="cat-count">口腔内疾患・唾液腺・咽頭・扁桃</div>
      </button>
      <button class="cat-btn" data-unit="10" onclick="startQuiz('unit10')">
        <div class="cat-label">⑩ SESSION 10</div>
        <div class="cat-title">呼吸器・食道の病態</div>
        <div class="cat-count">肺炎・肺結核・気道異物・GERD</div>
      </button>
      <button class="cat-btn" data-unit="11" onclick="startQuiz('unit11')">
        <div class="cat-label">⑪ SESSION 11</div>
        <div class="cat-title">音声障害１（良性疾患）</div>
        <div class="cat-count">声帯ポリープ・結節・喉頭炎・LMS</div>
      </button>
      <button class="cat-btn" data-unit="12" onclick="startQuiz('unit12')">
        <div class="cat-label">⑫ SESSION 12</div>
        <div class="cat-title">音声障害２（悪性腫瘍）</div>
        <div class="cat-count">喉頭癌・TNM分類・治療・VHI</div>
      </button>
      <button class="cat-btn" data-unit="13" onclick="startQuiz('unit13')">
        <div class="cat-label">⑬ SESSION 13</div>
        <div class="cat-title">音声障害３（機能的）</div>
        <div class="cat-count">変声障害・心因性失声・痙攣性発声</div>
      </button>
      <button class="cat-btn" data-unit="14" onclick="startQuiz('unit14')">
        <div class="cat-label">⑭ SESSION 14</div>
        <div class="cat-title">反回神経麻痺・甲状腺</div>
        <div class="cat-count">喉頭麻痺・声帯位置・甲状腺疾患</div>
      </button>
    </div>
    <h2 style="margin-top:20px;">まとめて解く</h2>
    <div class="special-grid">
      <button class="special-btn" onclick="startQuiz('all')">全問</button>
      <button class="special-btn" onclick="startQuiz('random')">ランダム30問</button>
      <button class="special-btn star-btn" onclick="startQuiz('star')">★頻出のみ</button>
    </div>
  </div>

  <div id="progress-bar-wrap">
    <div id="progress-info">
      <span id="progress-text">1 / 30</span>
      <span id="progress-score">正解: 0</span>
    </div>
    <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  </div>

  <div id="quiz-area"></div>

  <div id="score-screen">
    <h2>お疲れさまでした！</h2>
    <div id="score-num">0 / 0</div>
    <div id="score-sub">正解率</div>
    <button class="btn btn-primary" onclick="showMenu()" style="margin-top:16px;">メニューに戻る</button>
    <div id="wrong-list"></div>
  </div>
</main>

<div id="nav-bar">
  <button class="btn btn-secondary" onclick="prevQ()">◀ 前へ</button>
  <button class="btn btn-primary" onclick="nextQ()">次へ ▶</button>
</div>

<script>
const allQuestions = [
  // ===== ⑧ 口腔咽頭の病態 =====
  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:false,
   q:'アフタ性口内炎の原因と治療を答えよ。',
   a:'原因：外傷・感染・消化器障害・内分泌異常・精神的要因（ストレス）などで生じ疼痛を認める\n治療：ステロイド軟膏の塗布・ビタミン剤投与・咳嗽による口腔内衛生に努める',
   choices:['ステロイド軟膏の塗布・ビタミン剤投与・口腔内衛生','抗生物質の点滴投与・安静','鉄剤投与・生活習慣の改善','切開排膿・抗生物質投与'], correctIndex:0},

  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:false,
   q:'口腔カンジダ症の原因菌と発症しやすい状況を2つ答えよ。',
   a:'原因菌：Candida albicans（カンジダ・アルビカンス）による真菌感染症\n発症しやすい状況：①長期抗生物質投与　②高齢による免疫低下',
   choices:['Candida albicans・長期抗生物質投与・免疫低下','EBウイルス・ストレス・過労','レンサ球菌・喫煙・飲酒','ムンプスウィルス・唾液腺炎・腫脹'], correctIndex:0},

  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:false,
   q:'黒毛舌の病態と原因を答えよ。また糸状乳頭の本来の役割も答えよ。',
   a:'病態：舌背後部に糸状乳頭が異常に長く伸びた状態（本来短いはずの糸状乳頭の延長）\n役割：舌の表面に無数にあり食物を口の中で保持・移動させる摩擦の役割を担う（味蕾は持たない）\n原因：抗生物質・ステロイド剤の長期投与などにより誘発される',
   choices:['糸状乳頭が延長した状態・摩擦の役割・抗生物質・ステロイド剤の長期投与が原因','有郭乳頭が増殖した状態・味覚の役割・ウイルス感染が原因','茸状乳頭が延長した状態・摩擦の役割・真菌感染が原因','糸状乳頭が延長した状態・味覚の役割・喫煙が原因'], correctIndex:0},

  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:true,
   q:'舌ガンについて、好発部位・組織型・基本的治療法を答えよ。また舌を半分以上摘出する場合に必要なことも答えよ。',
   a:'好発部位：舌縁\n組織型：扁平上皮ガンが多い\n治療：手術による切除が基本。放射線照射・化学療法も効果的\n半分以上摘出する場合：再建が必要（遊離再建・有茎再建・前腹皮弁・腹直筋皮弁・大胸筋皮弁など）\n部分切除で再建が必要ない場合でも構音機能・嚥下機能に影響がでる可能性がある',
   choices:['舌縁に好発・扁平上皮ガン・手術が基本・半分以上で再建必要','舌根に好発・腺ガン・放射線が第一選択・全摘後に再建必要','舌尖部に好発・扁平上皮ガン・化学療法が基本・再建不要','舌背に好発・腺ガン・手術が基本・半分以上で再建必要'], correctIndex:0},

  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:true,
   q:'流行性耳下腺炎（おたふくかぜ）について、原因・病態の特徴・感音難聴との関係を答えよ。',
   a:'原因：ムンプスウィルス感染症\n病態の特徴：両側性・通常は1回罹患・顎下腺も腫脹する・血中・尿中アミラーゼが高値となる\n感音難聴との関係：感音難聴を生じ得る3M（ムンプス・麻疹・髄膜炎）の1つ',
   choices:['ムンプスウィルス・両側性・3M（ムンプス・麻疹・髄膜炎）の1つ','EBウイルス・一側性・感音難聴とは関係なし','レンサ球菌・両側性・伝音難聴の原因','ムンプスウィルス・一側性・感音難聴を必ず合併する'], correctIndex:0},

  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:false,
   q:'化膿性耳下腺炎と化膿性顎下腺炎の違いを答えよ。（側性・原因）',
   a:'化膿性耳下腺炎：一側性・細菌感染・子供に多く反復性・治療は抗生物質の投与\n化膿性顎下腺炎：一側性・細菌感染',
   choices:['両方一側性・細菌感染','耳下腺は両側性・顎下腺は一側性・ウイルス感染','耳下腺は一側性・顎下腺は両側性・細菌感染','両方両側性・ウイルス感染'], correctIndex:0},

  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:true,
   q:'唾石症について説明せよ。またほとんどが何腺に発症するか答えよ。',
   a:'一側性。細菌感染を伴うと発赤を認める\n繰り返す場合・疼痛が重度の場合：顎下腺ごと摘出する\n好発：ほとんどが顎下腺に発症する',
   choices:['一側性・ほとんどが顎下腺に発症・繰り返す場合は顎下腺ごと摘出','両側性・ほとんどが耳下腺に発症・保存的治療のみ','一側性・ほとんどが耳下腺に発症・顔面神経麻痺を合併することがある','一側性・ほとんどが舌下腺に発症・薬物療法で治療'], correctIndex:0},

  {unit:'unit8', unitTag:'⑧ 口腔咽頭', star:true,
   q:'唾液腺腫瘍について、悪性腫瘍では何神経麻痺が伴うか。また耳下腺腫瘍の良性・悪性の比率と良性腫瘍の代表的なものを2つ答えよ。',
   a:'伴う神経麻痺：顔面神経麻痺（顔面神経麻痺があれば悪性腫瘍を疑う）\n耳下腺腫瘍の比率：80%が良性・20%が悪性（顎下腺腫瘍は4〜5割が悪性）\n良性腫瘍の代表：①多形腺腫（一側性・単発が多い）②ワルチン腫瘍（両側性・男性・中年期・複数個・軟らかい）',

// ===== アプリロジック =====
let currentList = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let revealed = [];
let currentMode = 'write';
let choiceCache = {};

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-btn-write').classList.toggle('active', mode === 'write');
  document.getElementById('mode-btn-choice').classList.toggle('active', mode === 'choice');
}

function startQuiz(mode) {
  let list = [];
  if (mode === 'all') list = [...allQuestions];
  else if (mode === 'random') {
    const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
    list = shuffled.slice(0, 30);
  } else if (mode === 'star') {
    list = allQuestions.filter(q => q.star);
  } else {
    list = allQuestions.filter(q => q.unit === mode);
  }

  currentList = list;
  currentIndex = 0;
  correctCount = 0;
  wrongList = [];
  revealed = new Array(list.length).fill(false);
  choiceCache = {};

  document.getElementById('start-menu').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('progress-bar-wrap').style.display = 'block';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('nav-bar').classList.add('show');

  renderQuestion();
}

function renderQuestion() {
  const q = currentList[currentIndex];
  const total = currentList.length;
  const pct = (currentIndex / total * 100).toFixed(0);

  document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById('progress-score').textContent = `正解: ${correctCount}`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const uMap = {unit8:'u8',unit10:'u10',unit11:'u11',unit12:'u12',unit13:'u13',unit14:'u14'};
  const unitClass = uMap[q.unit] || '';
  const starHtml = q.star ? '<span class="star-mark">★ 頻出</span>' : '';

  const metaHtml = `
    <div class="q-meta">
      <span class="q-num">Q${currentIndex + 1}</span>
      <span class="q-unit-tag ${unitClass}">${q.unitTag}</span>
      ${starHtml}
    </div>
    <div class="q-text">${q.q}</div>`;

  if (currentMode === 'write') {
    renderWriteMode(q, metaHtml);
  } else {
    renderChoiceMode(q, metaHtml);
  }
  window.scrollTo(0, 0);
}

function renderWriteMode(q, metaHtml) {
  const savedAnswer = sessionStorage.getItem(`ans_${currentIndex}`) || '';
  const isRevealed = revealed[currentIndex];
  const savedResult = sessionStorage.getItem(`result_${currentIndex}`);

  let revealHtml = '';
  if (isRevealed) {
    const badgeClass = savedResult === 'correct' ? 'badge-correct' : 'badge-wrong';
    const badgeText = savedResult === 'correct' ? '✓ 正解' : '✗ 要復習';
    revealHtml = `
      <div class="answer-reveal show">
        <div class="result-badge ${badgeClass}">${badgeText}</div>
        <div class="answer-label">ANSWER</div>
        <div class="answer-text">${q.a.replace(/\n/g, '<br>')}</div>
      </div>`;
  }

  const btnHtml = isRevealed ? `
    <div class="btn-row">
      <button class="btn btn-correct" onclick="markResult('correct')">✓ 正解だった</button>
      <button class="btn btn-wrong" onclick="markResult('wrong')">✗ 要復習</button>
    </div>` : `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="revealAnswer()">解答を見る</button>
      <button class="btn btn-skip" onclick="skipQ()">スキップ</button>
    </div>`;

  document.getElementById('quiz-area').innerHTML = `
    <div class="q-card">
      ${metaHtml}
      <textarea class="answer-input" id="user-answer" placeholder="ここに答えを書いてみましょう…">${savedAnswer}</textarea>
      ${btnHtml}
      ${revealHtml}
    </div>`;

  document.getElementById('user-answer')?.addEventListener('input', e => {
    sessionStorage.setItem(`ans_${currentIndex}`, e.target.value);
  });
}

function renderChoiceMode(q, metaHtml) {
  const isRevealed = revealed[currentIndex];
  if (!q.choices) {
    renderWriteMode(q, metaHtml);
    return;
  }

  // シャッフル済み選択肢をキャッシュ
  if (!choiceCache[currentIndex]) {
    const choices = [...q.choices];
    const correctText = choices[q.correctIndex];
    const shuffled = choices.sort(() => Math.random() - 0.5);
    const newCorrectIndex = shuffled.indexOf(correctText);
    choiceCache[currentIndex] = { choices: shuffled, correctIndex: newCorrectIndex };
  }

  const { choices, correctIndex, selectedIndex } = choiceCache[currentIndex];
  const labels = ['A', 'B', 'C', 'D', 'E'];

  if (isRevealed) {
    const savedResult = sessionStorage.getItem(`result_${currentIndex}`);
    const isCorrect = savedResult === 'correct';
    let choicesHtml = choices.map((c, i) => {
      let cls = '';
      if (i === correctIndex) cls = 'correct-ans';
      else if (i === selectedIndex && i !== correctIndex) cls = 'wrong-ans';
      return `<button class="choice-btn ${cls}" disabled>
        <span class="choice-label">${labels[i]}</span>
        <span>${c}</span>
      </button>`;
    }).join('');

    const badgeClass = isCorrect ? 'badge-correct' : 'badge-wrong';
    const badgeText = isCorrect ? '✓ 正解！' : '✗ 不正解';

    document.getElementById('quiz-area').innerHTML = `
      <div class="q-card">
        ${metaHtml}
        <div class="choices-wrap">${choicesHtml}</div>
        <div class="answer-reveal show">
          <div class="result-badge ${badgeClass}">${badgeText}</div>
          <div class="answer-label">ANSWER</div>
          <div class="answer-text">${q.a.replace(/\n/g, '<br>')}</div>
        </div>
        <div class="btn-row" style="margin-top:12px;">
          <button class="btn btn-primary" onclick="nextQ()">次の問題へ ▶</button>
        </div>
      </div>`;
  } else {
    const choicesHtml = choices.map((c, i) => `
      <button class="choice-btn" onclick="selectChoice(${i}, ${correctIndex})">
        <span class="choice-label">${labels[i]}</span>
        <span>${c}</span>
      </button>`).join('');

    document.getElementById('quiz-area').innerHTML = `
      <div class="q-card">
        ${metaHtml}
        <div class="choices-wrap">${choicesHtml}</div>
        <div class="btn-row">
          <button class="btn btn-skip" onclick="skipQ()">スキップ</button>
        </div>
      </div>`;
  }
}

function selectChoice(selectedIndex, correctIndex) {
  const isCorrect = selectedIndex === correctIndex;
  if (isCorrect) correctCount++;
  else { if (!wrongList.includes(currentIndex)) wrongList.push(currentIndex); }

  choiceCache[currentIndex].selectedIndex = selectedIndex;
  sessionStorage.setItem(`result_${currentIndex}`, isCorrect ? 'correct' : 'wrong');
  revealed[currentIndex] = true;
  document.getElementById('progress-score').textContent = `正解: ${correctCount}`;

  const q = currentList[currentIndex];
  const uMap = {unit8:'u8',unit10:'u10',unit11:'u11',unit12:'u12',unit13:'u13',unit14:'u14'};
  const unitClass = uMap[q.unit] || '';
  const starHtml = q.star ? '<span class="star-mark">★ 頻出</span>' : '';
  const metaHtml = `
    <div class="q-meta">
      <span class="q-num">Q${currentIndex + 1}</span>
      <span class="q-unit-tag ${unitClass}">${q.unitTag}</span>
      ${starHtml}
    </div>
    <div class="q-text">${q.q}</div>`;
  renderChoiceMode(q, metaHtml);
}

function revealAnswer() {
  const ans = document.getElementById('user-answer')?.value || '';
  sessionStorage.setItem(`ans_${currentIndex}`, ans);
  revealed[currentIndex] = true;
  renderQuestion();
}

function markResult(result) {
  sessionStorage.setItem(`result_${currentIndex}`, result);
  if (result === 'correct') correctCount++;
  else { if (!wrongList.includes(currentIndex)) wrongList.push(currentIndex); }
  revealed[currentIndex] = true;
  document.getElementById('progress-score').textContent = `正解: ${correctCount}`;
  renderQuestion();
  setTimeout(() => nextQ(), 500);
}

function skipQ() { nextQ(); }

function nextQ() {
  const ua = document.getElementById('user-answer');
  if (ua) sessionStorage.setItem(`ans_${currentIndex}`, ua.value);
  if (currentIndex < currentList.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showScore();
  }
}

function prevQ() {
  const ua = document.getElementById('user-answer');
  if (ua) sessionStorage.setItem(`ans_${currentIndex}`, ua.value);
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

function showScore() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('progress-bar-wrap').style.display = 'none';
  document.getElementById('nav-bar').classList.remove('show');
  document.getElementById('score-screen').style.display = 'block';

  const total = currentList.length;
  const pct = total > 0 ? Math.round(correctCount / total * 100) : 0;
  document.getElementById('score-num').textContent = `${correctCount} / ${total}`;
  document.getElementById('score-sub').textContent = `正解率 ${pct}%`;

  let wrongHtml = '';
  if (wrongList.length > 0) {
    wrongHtml = '<h3>📝 要復習リスト</h3>';
    wrongList.forEach(i => {
      const q = currentList[i];
      wrongHtml += `<div class="wrong-item"><strong>Q${i+1}：</strong>${q.q}</div>`;
    });
  } else {
    wrongHtml = '<div style="text-align:center;color:var(--correct);font-weight:700;margin-top:16px;">全問正解！素晴らしい🎉</div>';
  }
  document.getElementById('wrong-list').innerHTML = wrongHtml;
}

function showMenu() {
  sessionStorage.clear();
  choiceCache = {};
  document.getElementById('start-menu').style.display = 'block';
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('progress-bar-wrap').style.display = 'none';
  document.getElementById('nav-bar').classList.remove('show');
}
</script>
