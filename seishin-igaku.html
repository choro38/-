<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>精神医学 定期試験対策</title>
<style>
:root{
  --paper:#F5F7FA; --card:#FFFFFF; --ink:#1B2437; --ink2:#5A6580; --line:#D8DDE8;
  --accent:#1F6F7A; --accent-soft:#E1F0F2; --on-accent:#FFFFFF;
  --ok:#2B7A4B; --ok-bg:#E4F3EA; --ng:#B3372F; --ng-bg:#FBE8E6;
  --amber:#8F5F0A; --amber-bg:#FFF1D1;
  --shadow:0 1px 2px rgba(27,36,55,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#10151E; --card:#1A212E; --ink:#E8ECF4; --ink2:#9AA6BF; --line:#2C364A;
    --accent:#5CB8C4; --accent-soft:#1B3238; --on-accent:#0B1A1D;
    --ok:#6FD39A; --ok-bg:#1A3025; --ng:#FF8F85; --ng-bg:#3A1F1D;
    --amber:#F2C260; --amber-bg:#3A2D12; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  font-size:16px; line-height:1.75;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
main{max-width:640px; margin:0 auto; padding:20px 16px 56px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
h1{font-size:22px; line-height:1.4; margin:4px 0 2px; letter-spacing:.02em}
.sub{margin:0; color:var(--ink2); font-size:13px}
.sec{font-size:15px; margin:28px 0 10px; font-weight:700}
.sec small{font-weight:400; color:var(--ink2); margin-left:6px}

/* 絞り込み */
.filters{display:flex; flex-wrap:wrap; gap:6px 14px; margin:14px 0 0; align-items:center}
.fgroup{display:flex; gap:4px; align-items:center}
.fgroup > span{font-size:12px; color:var(--ink2); margin-right:2px}
.chip{border:1px solid var(--line); background:transparent; border-radius:999px; padding:2px 11px; font-size:13px; line-height:1.7; color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}

/* 回・単元（メイン） */
.lectures{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.lec{
  width:100%; display:grid; grid-template-columns:52px 1fr auto; gap:12px; align-items:center; text-align:left;
  background:var(--card); border:1px solid var(--line); border-left:6px solid var(--accent);
  border-radius:10px; padding:14px 14px 14px 10px; box-shadow:var(--shadow);
}
.lec:disabled{opacity:.45; cursor:default}
.lec .num{font-size:34px; font-weight:800; line-height:1; text-align:center; color:var(--accent); font-variant-numeric:tabular-nums}
.lec .num small{display:block; font-size:11px; font-weight:600; color:var(--ink2); margin-top:3px}
.lec b{display:block; font-size:17px; line-height:1.45}
.lec .meta{display:block; font-size:12.5px; color:var(--ink2); margin-top:2px}
.bar{display:block; height:5px; background:var(--line); border-radius:3px; margin-top:8px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ok)}
.lec .stat{font-size:12px; color:var(--ink2); text-align:right; white-space:nowrap}

/* 教科書の章（サブ） */
.chaps{gap:6px}
.chap{width:100%; display:grid; grid-template-columns:44px 1fr auto; gap:10px; align-items:center; text-align:left;
  background:var(--card); border:1px solid var(--line); border-left:4px solid var(--ink2); border-radius:8px; padding:8px 12px 8px 8px}
.chap:disabled{opacity:.45; cursor:default}
.chap .cn{font-size:15px; font-weight:800; text-align:center; color:var(--ink2); font-variant-numeric:tabular-nums}
.chap b{display:block; font-size:15px; line-height:1.45}
.chap .bar{margin-top:5px; height:4px}
.chap .stat{font-size:12px; color:var(--ink2); white-space:nowrap}

/* まとめて解く（サブ） */
.bulk{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.bulk button{
  background:transparent; border:1px solid var(--line); border-radius:8px; padding:10px 6px; font-size:14px; line-height:1.45;
}
.bulk button small{display:block; color:var(--ink2); font-size:12px}
.bulk button.review{border-color:var(--amber); color:var(--amber); background:var(--amber-bg)}
.bulk button.review small{color:var(--amber)}
.bulk button:disabled{opacity:.45; cursor:default}
.help{margin:14px 0 0; font-size:13px; color:var(--ink2); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px}
.help b{color:var(--amber)}
.foot{margin-top:28px; display:flex; justify-content:space-between; font-size:12px; color:var(--ink2)}
.link{background:none; border:none; padding:0; text-decoration:underline; color:var(--ink2); font-size:12px}

/* クイズ */
.qbar{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.back{border:1px solid var(--line); background:transparent; border-radius:8px; padding:4px 12px; font-size:14px}
.prog{flex:1}
.prog .t{font-size:12.5px; color:var(--ink2); display:flex; justify-content:space-between}
.prog .bar{margin-top:3px}
.prog .bar i{background:var(--accent)}
.qcard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 16px 18px; box-shadow:var(--shadow)}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.tag{font-size:12px; padding:0 8px; border-radius:4px; background:var(--accent-soft); color:var(--accent); line-height:1.8}
.tag.rv{background:var(--amber-bg); color:var(--amber); font-weight:700}
.q{font-size:18px; line-height:1.8; margin:0 0 16px}
.choices{display:grid; gap:8px}
.choices.ox{grid-template-columns:1fr 1fr}
.choice{
  display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:11px 12px; font-size:16px; line-height:1.6;
}
.choice .n{flex:none; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ink2); font-size:13px; line-height:21px; text-align:center; color:var(--ink2)}
.choices.ox .choice{justify-content:center; align-items:center; font-size:34px; font-weight:700; padding:14px 0}
.choices.ox .choice .n{display:none}
.choice:not(:disabled):hover{border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--ok); background:var(--ok-bg)}
.choice.right .n{background:var(--ok); border-color:var(--ok); color:var(--card)}
.choice.wrong{border-color:var(--ng); background:var(--ng-bg)}
.choice.wrong .n{background:var(--ng); border-color:var(--ng); color:var(--card)}
.fb{margin-top:16px; border-radius:10px; padding:12px 14px; font-size:15px}
.fb.ok{background:var(--ok-bg); border-left:5px solid var(--ok)}
.fb.ng{background:var(--ng-bg); border-left:5px solid var(--ng)}
.fb .v{font-weight:800; font-size:17px; margin:0 0 4px}
.fb.ok .v{color:var(--ok)} .fb.ng .v{color:var(--ng)}
.fb p{margin:0}
.next{margin-top:14px; width:100%; background:var(--accent); color:var(--on-accent); border:none; border-radius:10px; padding:12px; font-size:16px; font-weight:700}

/* 記述 */
textarea{width:100%; min-height:130px; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; background:var(--card); color:var(--ink); resize:vertical}
.hint{font-size:12.5px; color:var(--ink2); margin:4px 0 10px}
.reveal{width:100%; background:transparent; border:1.5px solid var(--accent); color:var(--accent); border-radius:10px; padding:11px; font-weight:700}
.blk{margin-top:14px}
.blk h3{font-size:13px; margin:0 0 4px; color:var(--ink2); font-weight:700}
.kws{display:flex; flex-wrap:wrap; gap:6px}
.kw{font-size:13.5px; background:var(--accent-soft); color:var(--ink); border-radius:6px; padding:1px 8px; line-height:1.7}
.model{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:15px}
.mine{border-left:4px solid var(--line); padding-left:10px; color:var(--ink2); font-size:14px}
.grade{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.grade button{border:1.5px solid var(--line); background:transparent; border-radius:10px; padding:10px 4px; font-size:15px; line-height:1.4}
.grade button small{display:block; font-size:11.5px; color:var(--ink2)}
.grade button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}

/* 結果 */
.score{text-align:center; padding:18px 8px 10px}
.score .big{font-size:48px; font-weight:800; line-height:1.2; font-variant-numeric:tabular-nums}
.score .big small{font-size:18px; font-weight:600; color:var(--ink2)}
.score p{margin:4px 0 0; color:var(--ink2); font-size:14px}
.btns{display:grid; gap:8px; margin:12px 0 4px}
.btns .primary{background:var(--accent); color:var(--on-accent); border:none; border-radius:10px; padding:12px; font-weight:700}
.btns .ghost{background:transparent; border:1.5px solid var(--line); border-radius:10px; padding:11px}
.wlist{list-style:none; padding:0; margin:0; display:grid; gap:8px}
.wlist li{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:14px}
.wlist summary{cursor:pointer}
.wlist .ans{margin:6px 0 0; font-size:13.5px; color:var(--ink2)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 16px; border-radius:999px; font-size:14px; z-index:9}
@media (prefers-reduced-motion: no-preference){ .bar i{transition:width .4s ease} }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = {"topics": {"1": "心身症・概論", "2": "神経症・ストレス関連障害", "3": "気分症群・統合失調症", "4": "器質因（せん妄・認知症）", "5": "睡眠・摂食・物質使用症", "6": "神経発達症・性格のかたより", "7": "薬物療法・精神保健福祉法"}, "chapters": {"1": "精神疾患とは", "2": "精神症状のみかた", "3": "精神疾患の診断", "4": "薬物療法", "5": "心理療法・支援の基本", "6": "多職種連携とリエゾン精神医学", "7": "統合失調症", "8": "うつ病・双極症", "9": "強迫症・不安症群", "10": "ストレス関連症群・解離症群", "11": "神経発達症群", "12": "物質関連症・嗜癖症", "14": "ジェンダーをめぐる問題", "15": "高齢期における心理的問題"}, "items": [{"t": "ox", "src": "form", "lec": 1, "q": "非特異的刺激による共通の変化というストレスの現象として、予期不安、暗示、条件反射といった要因が加わり、心身症に関連がある。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：非特異的刺激による共通のストレス現象は、ホメオスタシス・筋肉運動・免疫の3つ。予期不安・暗示・条件反射は別の機序（学習された行動）。【型】正しい知識2つのつなぎ方を誤らせる。", "flag": 1, "id": 1}, {"t": "ox", "src": "form", "lec": 1, "q": "抗うつ薬は、細胞の繊維末端からセロトニンが放出される時、再吸収作用を抑制し、シナプス間隙中の伝達物質を高める作用をもつ向精神薬の一つである。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：抗うつ薬は、抗精神病薬なども含めた向精神薬の一つ。抗うつ薬＝抗精神病薬ではない（第3回で詳しく解説）。", "flag": 0, "id": 2}, {"t": "ox", "src": "form", "lec": 1, "q": "心身症と呼ばれる病態には、過敏性腸症候群、アトピー性皮膚炎、狭心症、失感情症、本態性高血圧、書痙、無月経、片頭痛、痙性斜頸、腰痛症、メニエール病などが該当する可能性がある。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：様々な診療科、広範囲の病態が心身症に該当する可能性がある。心身症は病名ではなく病態。", "flag": 0, "id": 3}, {"t": "ox", "src": "form", "lec": 1, "q": "狭心症や心筋梗塞は野心的・行動的な性格傾向に伴うタイプA行動が問題とされており、みな精神的に問題のある心身症であり、冠動脈硬化症を発症する。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：狭心症や心筋梗塞の患者がみな精神的に問題があるわけではない。循環器疾患であることが前提。【型】「みな」「発症する」の極端表現。", "flag": 0, "id": 4}, {"t": "ox", "src": "form", "lec": 2, "q": "パニック発作は身震いや振戦、死への恐怖、嘔気や不快感、喉が詰まったような窒息感が生じる。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：パニック発作における症状の項目に該当（13項目中4つ以上でパニック発作）。", "flag": 0, "id": 5}, {"t": "ox", "src": "form", "lec": 2, "q": "解離症ではストレスとの関連を認めることは少ない。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：ストレスから意識を遠ざけようとするために防衛機制が働いている。ストレスとの関連は多い。", "flag": 0, "id": 6}, {"t": "ox", "src": "form", "lec": 2, "q": "大震災の直後、避難所にいる方々への初期対応として、PFAに基づいて心的外傷体験を聞き出しながら、うつ病を発症しているかもしれないと説明をした。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：災害時は心のケアが第一優先ではない。急性期に精神疾患を断定できない。資料より、積極的に語らせない・レッテルを貼らない。【型】誤りが2つ重なる。", "flag": 0, "id": 7}, {"t": "ox", "src": "form", "lec": 2, "q": "強迫観念はパニック症の中核症状である。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：強迫観念は強迫症の中核症状。パニック症の中核は予期不安とパニック発作の反復。【型】疾患の入れ替え。", "flag": 0, "id": 8}, {"t": "ox", "src": "form", "lec": 2, "q": "不安症や強迫症には抗うつ薬の適用があり、薬物療法を望む患者も多く主たる治療として知られている。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：抗うつ薬は保険適用だが、特に強迫症では薬物治療を望まないこともあり、心理治療が主となることがある。【型】前半が正しく後半が誤り。", "flag": 0, "id": 9}, {"t": "ox", "src": "form", "lec": 2, "q": "適応障害はその他の診断名に該当するものが無い場合に診断されることがある。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：精神症状を伴う場合でも仮に適応障害と診断される場合がある。非専門家が安易にこの病名を用いない。「適応障害って言われてるんだって？」と本人に言うのはNG。", "flag": 0, "id": 10}, {"t": "ox", "src": "form", "lec": 3, "q": "統合失調症の急性期には意識障害がみられる。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：意識状態に異常はない。意識障害は器質因（せん妄など）で出る。", "flag": 0, "id": 11}, {"t": "ox", "src": "form", "lec": 3, "q": "うつ病では身体症状の愁訴が顕在化してみられることがよく起こりうる。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：心理・精神的な症状のみの精神疾患ではない。むしろ身体症状が顕在化する場合もある（身体症状が先行し、最初に内科を受診する例が多い）。", "flag": 0, "id": 12}, {"t": "ox", "src": "form", "lec": 3, "q": "滅裂思考は躁病で見られる思考障害である。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：主に統合失調症でみられる症状の一つ。躁病は観念奔逸・談話心迫。【型】疾患の入れ替え。", "flag": 0, "id": 13}, {"t": "ox", "src": "form", "lec": 3, "q": "双極症の薬物療法として炭酸リチウムやデパケンといった気分安定薬を用いる。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：双極症は気分安定薬を用いる。抑うつ症状があっても、抗うつ薬は禁忌。", "flag": 0, "id": 14}, {"t": "ox", "src": "form", "lec": 3, "q": "統合失調症の家族歴があると、同じ統合失調症を発症した場合にその人の予後が悪い。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：予後が悪いとされるのは破瓜型（解体型）の病型。家族負因の有無で予後については指摘されていない。【型】根拠のない一言を足す。", "flag": 1, "id": 15}, {"t": "ox", "src": "form", "lec": 3, "q": "スーパーに買い物に行ったが、30分以上商品の前で立ち尽くして何も買うことができない、といった症状はうつ病に起こりうる。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：「知的活動能力の減衰」にあたる（抑うつエピソードの⑧思考力・集中力の減退、決断困難とも重なる）。", "flag": 0, "id": 16}, {"t": "ox", "src": "form", "lec": 4, "q": "睡眠覚醒リズムの症状はせん妄を引き起こす可能性があることを考えておく必要がある。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：DST（せん妄スクリーニングツール）のA項目の一つ。", "flag": 0, "id": 17}, {"t": "ox", "src": "form", "lec": 4, "q": "せん妄を起こしやすい疾患として、躁うつ病、強迫症、摂食障害、人格障害、認知症、統合失調症のどれも該当しない。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：認知症はせん妄を起こしやすい疾患（準備因子）。【型】「どれも該当しない」の言い切り。", "flag": 0, "id": 18}, {"t": "ox", "src": "form", "lec": 4, "q": "緊急入院の術後に入院も長期化して後遺症のリハビリが思うように進んでおらず、ストレスも感じている60歳代前半の患者さんで夜間急に不穏になる場合がある。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：ストレスが促進因子になって不穏となることはありうる。ただし急性期を抜けており、せん妄を起こす可能性は低い。せん妄は主に脳機能障害で、心理的ストレスで意識障害が起きる可能性は低い。〇の根拠は「不穏」であり「せん妄」ではない。", "flag": 0, "id": 19}, {"t": "ox", "src": "form", "lec": 4, "q": "Treatable Dementiaとして慢性硬膜下血腫や正常圧水頭症、ビタミンB1欠乏によるウェルニッケ・コルサコフ症候群などがある。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：ビタミンB1欠乏は主にウェルニッケ・コルサコフ症候群で起きる症状で、アルコール関連疾患。【型】正しい疾患名の中に1つ紛れ込ませる。", "flag": 1, "id": 20}, {"t": "ox", "src": "form", "lec": 4, "q": "アルツハイマー型認知症の中核症状として、認知機能が1日の中でも変動する症状がある。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：アルツハイマー型は緩徐に進行し、日内変動は起きにくい（動揺性はレビー小体型）。【型】疾患の入れ替え。", "flag": 0, "id": 21}, {"t": "ox", "src": "form", "lec": 4, "q": "一番身近な介護者に攻撃的発言をしたり易怒性を表出する認知症患者への対応方法として、ユマニチュードを学習することは有益である。", "ch": ["〇", "✕"], "a": 1, "ex": "資料より：認知機能低下のある患者の関わり方として、ユマニチュードやパーソンセンタードケアが参考になる。", "flag": 0, "id": 22}, {"t": "ox", "src": "form", "lec": 5, "q": "パチンコの依存は習慣および衝動の障害として治療の適用はない。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：習慣および衝動の障害である依存症の一つ。治療の対象。【型】「治療の適用はない」の言い切り。", "flag": 0, "id": 23}, {"t": "ox", "src": "form", "lec": 5, "q": "神経性過食症では自己誘発性嘔吐や下剤乱用、拒食におよぶことがある。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：「不適切な代償行動」の具体的な内容。", "flag": 0, "id": 24}, {"t": "ox", "src": "form", "lec": 5, "q": "熟眠障害の自覚と妻から無呼吸を指摘されている男性は、1か月以上睡眠で困っているので、医療現場でよく使われるエチゾラム（デパス）やブロチゾラム（レンドルミン）を用いて、まずは睡眠確保から治療を開始する。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：熟眠障害の原因がSAS（睡眠時無呼吸症候群）だとしたら、ベンゾジアゼピン系の使用は呼吸抑制を促進して危険。", "flag": 0, "id": 25}, {"t": "ox", "src": "form", "lec": 5, "q": "夜勤や日勤など不規則交代制勤務をする医療従事者に起こりやすい睡眠障害としてレム睡眠行動障害が考えられる。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：勤務で24時間周期のリズムにズレが生じる、概日リズム睡眠-覚醒障害が正解。", "flag": 0, "id": 26}, {"t": "ox", "src": "form", "lec": 5, "q": "神経性無食欲症の主な特徴として活動性が低下するといった症状がある。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：活動性が亢進する特徴（過活動）がある。【型】「亢進」を「低下」に逆にする。", "flag": 0, "id": 27}, {"t": "ox", "src": "form", "lec": 5, "q": "睡眠衛生指導をする場合、早寝早起きは健康維持に有効で、特に早く眠ることを推奨する。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：早起きが早寝に通じる。起床から約16時間後に徐々に眠気が生じてくる。【型】常識（早寝早起き）で包む。", "flag": 0, "id": 28}, {"t": "ox", "src": "form", "lec": 6, "q": "ADHDや自閉スペクトラム症、学習症にはそれぞれに主たる薬物療法の適用がある。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：厳密な適用はADHDのみ。ASDには対症療法として、LDには適用がない。【型】3つをまとめて言い切る。", "flag": 0, "id": 29}, {"t": "ox", "src": "form", "lec": 6, "q": "不登校は社会現象であって、何かの心理・身体症状を抱えていることは無い。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：不登校自体は病気や疾患名ではないが、初期の身体化の時期に腹痛・頭痛・嘔吐などの身体症状や、不眠・気分の落ち込みがみられることは多分にある。【型】前半が正しく後半が誤り。", "flag": 0, "id": 30}, {"t": "ox", "src": "form", "lec": 6, "q": "何らかのパーソナリティ症が疑われる場合であっても、基本前提は傾聴を含めたサポーティブな介入をすることである。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：受診しても中断しやすい等の問題はあるが、根底に心理的苦悩を抱えている可能性は高く、年単位の治療的関わりで問題行動が目立たなくなることがある。", "flag": 0, "id": 31}, {"t": "ox", "src": "form", "lec": 6, "q": "ADHDの当事者が症状の自覚に欠けるため、パートナーが長年苦労している事例が起きうる。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：ADHD当事者は自分に苦手な面があることを自覚している場合が多い。正常発達のパートナーがカサンドラ症候群と呼ばれて苦労するのは、ASDの特徴を持つパートナーがいる場合。ASD本人は症状や他者理解に欠けるため根深い問題となることがある。【型】ADHDとASDの入れ替え。", "flag": 0, "id": 32}, {"t": "ox", "src": "form", "lec": 6, "q": "選択性かん黙は、職場では全くと言って良いほど会話をしないが、自宅では問題なく会話があるので問題が顕在化しない場合があり、極度の緊張感がみられるので治療の適用がある。", "ch": ["〇", "✕"], "a": 1, "ex": "先生の解説：神経症圏に該当する選択性かん黙は、対症療法として抗不安薬などを用いることもあり、根気強く対話による療法を受けていく。", "flag": 0, "id": 33}, {"t": "ox", "src": "form", "lec": 6, "q": "小学校に入学してから学習障害が疑われた児童には、自立を促すためになるべく一人で課題に取り組ませるのが望ましい。", "ch": ["〇", "✕"], "a": 2, "ex": "先生の解説：LDは明確な能力の問題があり、問題が顕在化した時点で具体的支援が必要。怠けでも努力の問題でもないため、自発性などと言って一人で取り組ませてしまわないこと。【型】聞こえのよい言葉で包む。", "flag": 0, "id": 34}, {"t": "ox", "src": "form", "lec": 7, "q": "電気けいれん療法の適用は重症うつ病や統合失調症であるが、骨折や有害事象を軽減するため筋弛緩薬や静脈麻酔薬を用いた修正型もある。", "ch": ["〇", "✕"], "a": 1, "ex": "資料より：適応は主に気分障害・統合失調症。短時間麻酔薬と筋弛緩薬を用いる修正型（mECT）が導入されている。※第7回は先生の解説スライド未確認（資料ベース）。", "flag": 0, "id": 35}, {"t": "ox", "src": "form", "lec": 7, "q": "選択セロトニン再取り込み阻害薬（SSRI）の抗うつ効果の評価は、副作用も含めて投与開始の数日後に行う。", "ch": ["〇", "✕"], "a": 2, "ex": "資料より：抗うつ薬は内服直後に効果を実感できることは少なく、約2週間かかると説明しておく。【型】時期をずらす。", "flag": 0, "id": 36}, {"t": "ox", "src": "form", "lec": 7, "q": "精神科病院の入院形態として2名以上の精神保健指定医による診察結果の一致が要件となる形態は医療保護入院である。", "ch": ["〇", "✕"], "a": 2, "ex": "資料より：指定医2名の診察の一致が要件となるのは措置入院（知事の命令で入院）。医療保護入院は家族の同意で入院。【型】要件の入れ替え。", "flag": 0, "id": 37}, {"t": "ox", "src": "form", "lec": 7, "q": "高齢者の不眠対策として、せん妄を懸念して向精神薬ではなく抑肝散を処方開始したが、低カリウム血症や間質性肺炎には注意が必要である。", "ch": ["〇", "✕"], "a": 1, "ex": "動画スライドより：抑肝散は高齢者の易怒性や不眠に使用されることが多く、依存性は無いが効果も弱い。漢方全般の副作用として低カリウム血症・間質性肺炎に注意。食前内服の場合が多い。【注意】PDF配布資料になく動画のみで示された内容。", "flag": 1, "id": 38}, {"t": "ox", "src": "form", "lec": 7, "q": "流涎や筋固縮、動作緩慢がみられたため、DIEPSSを用いて評価を行ったところジスキネジアを疑った。", "ch": ["〇", "✕"], "a": 2, "ex": "資料より：流涎・筋固縮・動作緩慢はパーキンソニズムの症状。ジスキネジアは口唇・顔面周囲に多い繰り返す不随意運動。DIEPSSで評価すること自体は正しい。【型】症状名の入れ替え。", "flag": 1, "id": 39}, {"t": "ox", "src": "form", "lec": 7, "q": "抗うつ薬や抗精神病薬を睡眠薬の代わりに使ったり、易怒性に抗精神病薬を使うことは臨床上しばしばみられる。", "ch": ["〇", "✕"], "a": 1, "ex": "資料より：クエチアピン・オランザピンは鎮静や眠剤代わりに使うこともある。ASDの易刺激性・多動・興奮に補完的に少量の抗精神病薬が奏功する場合もある。", "flag": 0, "id": 40}, {"t": "ox", "src": "yosou", "lec": 1, "q": "心身症は、身体疾患の中で発症や経過に心理社会的因子が密接に関与する病態であり、神経症やうつ病に伴う身体症状は除外される。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】心身症の定義（日本心身医学会）。定義は丸ごとセットで覚える。【型】定義の一部を欠かした文は✕になる。", "flag": 0, "id": 41}, {"t": "ox", "src": "yosou", "lec": 1, "q": "心身症は特定の疾患名であり、気管支喘息の患者はすべて心身症に該当する。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】心身症は病名ではなく病態。同じ病名でも、心理社会的因子が関与する人だけが該当しうる。【型】「すべて」の極端表現。", "flag": 0, "id": 42}, {"t": "ox", "src": "yosou", "lec": 1, "q": "精神疾患の原因を鑑別する際は、心因、内因、器質因の順に除外していく。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】鑑別は器質因→内因→心因の順（うつの3分類も外因性→内因性→心因性の順）。【型】順序の逆転。", "flag": 0, "id": 43}, {"t": "ox", "src": "yosou", "lec": 1, "q": "神経内科は脳神経内科のことで、精神科や心療内科とは別の診療科として扱われる。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】精神科＝心療内科＝メンタルヘルス科＝神経科。神経内科（脳神経内科）は別。【型】名称の混同。", "flag": 0, "id": 44}, {"t": "ox", "src": "yosou", "lec": 1, "q": "ICD-11では、disorderの訳語が「症」から「障害」へ変更された。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】ICD-11では「障害」から「症」へ変更（例：パニック障害→パニック症）。【型】向きの逆転。", "flag": 0, "id": 45}, {"t": "ox", "src": "yosou", "lec": 1, "q": "アレキシサイミアは、感情の言語化が得意で、心身症になりにくい特徴を指す。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】アレキシサイミア（失感情症）は、感情の認知・言語表現が不十分な特徴。体が代わりに表現し心身症になりやすい。【型】特徴の逆転。", "flag": 0, "id": 46}, {"t": "ox", "src": "yosou", "lec": 1, "q": "抗精神病薬は向精神薬の一つであり、抗うつ薬は抗精神病薬とは別の薬である。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】向精神薬（上位概念）に抗精神病薬・抗うつ薬・気分安定薬・抗不安薬・睡眠薬が含まれる。抗うつ薬＝抗精神病薬ではない。", "flag": 0, "id": 47}, {"t": "ox", "src": "yosou", "lec": 2, "q": "パニック発作を起こした患者は、必ずパニック症と診断される。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】パニック発作＝パニック症ではない。限局性恐怖症や社交不安症でも発作は起こる。【型】「必ず」の極端表現。", "flag": 0, "id": 48}, {"t": "ox", "src": "yosou", "lec": 2, "q": "変換症の患者は無意識に症状を引き起こしているが、作為症や詐病では症状は意図的である。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】変換症＝無意識。作為症（関心を集める目的）・詐病（金品・義務逃れの目的）＝意図的。", "flag": 0, "id": 49}, {"t": "ox", "src": "yosou", "lec": 2, "q": "詐病は、周囲の関心を集める目的で病気をねつ造する疾患である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】関心を集める目的は作為症。詐病は金品を得る・義務を逃れる目的で、疾患ではない。【型】2疾患の特徴の入れ替え。", "flag": 0, "id": 50}, {"t": "ox", "src": "yosou", "lec": 2, "q": "強迫症の患者には、気にしないようにと励ますことが有効な関わりである。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】「気にしないように」は逆効果。まず症状に伴う苦痛に共感的に対応する。【型】対応の逆転。", "flag": 0, "id": 51}, {"t": "ox", "src": "yosou", "lec": 2, "q": "解離性同一症では、別人格の存在を否定して出現を拒むことで症状が改善する。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】否定・拒否は一見減るようでも難治化させる。各人格を尊重しながら治療的な対話を行う。向精神薬（特に抗不安薬）は適用とならず悪化させる可能性。", "flag": 0, "id": 52}, {"t": "ox", "src": "yosou", "lec": 2, "q": "心的外傷後ストレス症の支援では、体験を積極的に語らせることが回復に有効である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】語られる場面があれば共感的に対応するが、積極的に語らせてはいけない。心の傷に土足で踏み込まない。【型】対応の逆転。", "flag": 0, "id": 53}, {"t": "ox", "src": "yosou", "lec": 2, "q": "遷延性悲嘆症では、うつ病にみられる日内変動は認められない。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】遷延性悲嘆症（死別後6か月以上、程度が想定を著しく超える）では日内変動はみられない。第3回のうつ病の日内変動との対比で出る。", "flag": 0, "id": 54}, {"t": "ox", "src": "yosou", "lec": 3, "q": "双極症の抑うつエピソードには、気分安定薬ではなく抗うつ薬が第一選択となる。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】双極症は抑うつ状態でも気分安定薬。抗うつ薬は効果がなく、自殺や急速交代型のリスクが高まる。躁転・混合状態では抗うつ薬を即中止。", "flag": 0, "id": 55}, {"t": "ox", "src": "yosou", "lec": 3, "q": "うつ病に特有の日内変動は、朝に最も悪く、夕方以降に回復する。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】心因性の抑うつ・遷延性悲嘆・器質性の抑うつには原則みられない。", "flag": 0, "id": 56}, {"t": "ox", "src": "yosou", "lec": 3, "q": "貧困妄想・罪業妄想・心気妄想は、統合失調症の代表的な妄想である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】3大妄想はうつ病（微小妄想）。統合失調症は一次妄想や被害関係妄想。誇大妄想・観念奔逸は躁うつ病。【型】疾患の入れ替え。", "flag": 0, "id": 57}, {"t": "ox", "src": "yosou", "lec": 3, "q": "統合失調症では、発症時に本人が病識を持つことは容易である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】発症時に病識を持つことは困難。治療初期は“疑い”で開始するのが通例。", "flag": 0, "id": 58}, {"t": "ox", "src": "yosou", "lec": 3, "q": "破瓜型は予後が良好で、緊張型は予後不良の病型である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】予後不良は破瓜型（解体型）。緊張型は激しい症状でも薬物やECTの反応が良好で比較的予後が良い。【型】2病型の入れ替え。", "flag": 0, "id": 59}, {"t": "ox", "src": "yosou", "lec": 3, "q": "統合失調症の診断では、DSM-5の5症状のうち2つ以上が必要だが、4と5の組み合わせは認められない。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】1幻覚・2妄想・3話のまとまらなさ・4行動のまとまらなさ/緊張病・5陰性症状のうち2つ以上、4と5の組合せは不可。治療しなければ半年以上持続。", "flag": 0, "id": 60}, {"t": "ox", "src": "yosou", "lec": 3, "q": "抑うつエピソードは、9症状のうち5つ以上で、抑うつ気分か興味・喜びの減退のいずれかを含み、2週間以上続く。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】DSM-5の抑うつエピソードの定義。①か②のどちらかを必ず含む。", "flag": 0, "id": 61}, {"t": "ox", "src": "yosou", "lec": 4, "q": "せん妄は数週間かけて緩徐に進行し、1日の中での症状の変動はみられない。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】せん妄は数時間〜数日で急に生じ、1日の中でも変動（迂動性）。緩徐に進行するのは認知症。【型】特徴の入れ替え。", "flag": 0, "id": 62}, {"t": "ox", "src": "yosou", "lec": 4, "q": "ベンゾジアゼピン系薬剤は、せん妄を誘発するため、定期内服患者では厳重な注意が必要である。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】ベンゾ系はせん妄の直接因子になりうる。抗コリン作用のある薬も誘発・増強する。", "flag": 0, "id": 63}, {"t": "ox", "src": "yosou", "lec": 4, "q": "レビー小体型認知症の幻視は意識障害を伴って生じ、本人は記憶していないことが多い。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】レビー小体型の幻視は意識障害がなく生じ、本人もよく記憶している。認知症にせん妄が重なった幻視は記憶不明瞭。", "flag": 0, "id": 64}, {"t": "ox", "src": "yosou", "lec": 4, "q": "前頭側頭型認知症では、初期から記銘力低下が目立ち、性格変化は後期にみられる。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】記銘力低下が目立たない点が他の認知症と異なり、初期から性格（人格）変化が目立つ。40〜65歳の比較的若年で発症。", "flag": 0, "id": 65}, {"t": "ox", "src": "yosou", "lec": 4, "q": "正常圧水頭症は、認知障害・歩行障害・尿失禁を3症候とし、シャント術で改善することが多い。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】歩行障害が初発症状のことが多い。髄液圧は正常範囲だが脳室拡大。脳神経外科へコンサルト。", "flag": 0, "id": 66}, {"t": "ox", "src": "yosou", "lec": 4, "q": "血管性認知症は、緩徐に直線的に進行し、他の認知症より感情失禁がみられにくい。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】典型的には階段状に悪化し、能力に差がある「まだら認知症」。他の認知症より感情失禁がみられる。", "flag": 0, "id": 67}, {"t": "ox", "src": "yosou", "lec": 4, "q": "認知症の定義は、後天的な脳の機能障害により知的機能が全般的に低下し、意識障害のないときにみられる状態である。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】日本神経学会（2010）の定義。「意識障害のないとき」がせん妄との鑑別ポイント。", "flag": 0, "id": 68}, {"t": "ox", "src": "yosou", "lec": 5, "q": "不眠の訴えがあれば、本人が苦痛に感じているかにかかわらず、不眠症として扱う。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】本人が苦痛に感じていなければ不眠症として扱わない。睡眠衛生指導を先に行う。【型】条件を外した言い切り。", "flag": 0, "id": 69}, {"t": "ox", "src": "yosou", "lec": 5, "q": "レストレスレッグス症候群は、睡眠中に下肢が周期的に動く疾患である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】睡眠中に四肢の運動が周期的に生じるのは周期性四肢運動障害。レストレスレッグス症候群は夜間に足がムズムズして眠れない。両者は合併しやすい。", "flag": 0, "id": 70}, {"t": "ox", "src": "yosou", "lec": 5, "q": "レム睡眠行動障害は、レビー小体型認知症やパーキンソン病の前駆症状となりうる。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】中年〜老年期に出現。運動障害がなくても数年以内に発症する可能性が高い。不規則勤務で起こるのは概日リズム睡眠-覚醒障害。", "flag": 0, "id": 71}, {"t": "ox", "src": "yosou", "lec": 5, "q": "神経性過食症の診断基準は、BMIが18.5以下であることである。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】BMI18.5以下は神経性やせ症（AN）の診断基準。神経性過食症は過食と不適切な代償行為で診断し、SSRIが有効。【型】疾患の入れ替え。", "flag": 0, "id": 72}, {"t": "ox", "src": "yosou", "lec": 5, "q": "アルコール離脱せん妄は、長期かつ多量の飲酒後に急な減量や中止をした際に生じる。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】振戦せん妄。意識障害が起きたらこれを疑い、ベンゾジアゼピン系の注射等を検討（呼吸抑制に注意）。", "flag": 0, "id": 73}, {"t": "ox", "src": "yosou", "lec": 5, "q": "ウェルニッケ脳症の三徴は、健忘・作話・失見当識である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】三徴は眼球運動障害・運動失調・意識障害。健忘・作話・失見当識はコルサコフ症候群。原因はビタミンB1欠乏（アルコール関連疾患）。【型】2つの病像の入れ替え。", "flag": 0, "id": 74}, {"t": "ox", "src": "yosou", "lec": 5, "q": "家族が借金を肩代わりすることは、依存症の回復を促す適切な支援である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】家族が不始末を代行する「イネイブラー」は回復を妨げる。家族全体への働きかけが必要。【型】対応の逆転。", "flag": 0, "id": 75}, {"t": "ox", "src": "yosou", "lec": 6, "q": "17歳以上でADHDと診断するには、不注意または多動性・衝動性が6つ以上必要である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】16歳以下は6つ以上（12歳以前から存在）。17歳以上は5つ以上残っていれば成人のADHD診断。【型】数値のずらし。", "flag": 0, "id": 76}, {"t": "ox", "src": "yosou", "lec": 6, "q": "学習症（SLD）には、メチルフェニデートなどの薬物療法が第一選択である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】学習症は薬物治療が奏功しない。適切な療育や支援につなげる。ADHDの薬は中枢神経刺激薬・アトモキセチン・グアンファシン。", "flag": 0, "id": 77}, {"t": "ox", "src": "yosou", "lec": 6, "q": "ASDの診断は、少し変わっている、対人関係が苦手といった理由だけでは行わない。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】定められた診断基準に該当するか確認し、幼少期から一貫しているかも重要。基準に合う症状が確認できるまでは「〜疑い/傾向」にとどめる。", "flag": 0, "id": 78}, {"t": "ox", "src": "yosou", "lec": 6, "q": "ASDの支援では、してはいけない行動を禁止して弱化することが最も効果的である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】禁止（弱化）だけでは適応できないことが多く、代わりの行動を具体的に提示する。感情的な叱責は情動不安定にし、適切な行動も減る。", "flag": 0, "id": 79}, {"t": "ox", "src": "yosou", "lec": 6, "q": "パーソナリティ症には、薬物療法が主たる治療として適用される。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】薬物療法の適用はなく、心理・精神療法が主体。侮辱語になるため「人格障害」とせずカタカナ表記を用いる。", "flag": 0, "id": 80}, {"t": "ox", "src": "yosou", "lec": 6, "q": "選択性かん黙は、自宅でも家族との会話が困難な状態である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】会話自体は可能だが学校等の特定場面で話さない。自宅では家族と問題なく会話できる。", "flag": 0, "id": 81}, {"t": "ox", "src": "yosou", "lec": 6, "q": "不登校は病気や疾患名ではなく、国際診断基準にも該当項目はない。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】学校があるために生じた社会現象。ただし初期の身体化の時期には身体症状や不眠・気分の落ち込みがみられることは多分にある。", "flag": 0, "id": 82}, {"t": "ox", "src": "yosou", "lec": 7, "q": "医療保護入院は、指定医2名の診察の一致と知事の命令により入院させる形態である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】指定医2名の一致＋知事の命令は措置入院。医療保護入院は指定医の診察＋家族の同意。【型】要件の入れ替え。", "flag": 0, "id": 83}, {"t": "ox", "src": "yosou", "lec": 7, "q": "医療保護入院では家族の同意が必要だが、おじ・おば、甥・姪、未成年者は同意者になれない。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】同意は電話による口頭でも可。任意入院でも指定医が必要と認めれば72時間を限度に退院制限ができる（資料の記載）。", "flag": 0, "id": 84}, {"t": "ox", "src": "yosou", "lec": 7, "q": "修正型の電気けいれん療法では、麻酔薬や筋弛緩薬を使わずに通電を行う。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】修正型（mECT）は短時間麻酔薬と筋弛緩薬を用いる。週2〜3回ペースで計6〜12回。", "flag": 0, "id": 85}, {"t": "ox", "src": "yosou", "lec": 7, "q": "睡眠薬や抗不安薬を内服中は自動車運転が可能だが、抗精神病薬を内服中は不可である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】睡眠薬・抗不安薬は運転×。抗精神病薬も原則禁止。最終的な判断は患者本人に委ねられる。【型】一部だけ許可する言い方。", "flag": 0, "id": 86}, {"t": "ox", "src": "yosou", "lec": 7, "q": "流涎・筋固縮・動作緩慢は、錐体外路症状のうちアカシジアの症状である。", "ch": ["〇", "✕"], "a": 2, "ex": "【根拠】それらはパーキンソニズム。アカシジアは足がムズムズしてじっとしていられない（座位不能）。【型】症状名の入れ替え。", "flag": 0, "id": 87}, {"t": "ox", "src": "yosou", "lec": 7, "q": "悪性症候群が疑われた時点で、直ちに薬を中止し、点滴留置や電解質の補正を行う。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】強い筋強剛＋高熱・血清CK高値・意識障害・自律神経症状。頻度は低いが死に至ることもある。", "flag": 0, "id": 88}, {"t": "ox", "src": "yosou", "lec": 7, "q": "クエチアピンやオランザピンは、糖尿病患者には禁忌である。", "ch": ["〇", "✕"], "a": 1, "ex": "【根拠】DM禁忌。鎮静や眠剤代わりに使うこともあり、錐体外路症状は出にくい。", "flag": 0, "id": 89}, {"t": "mc", "src": "yosou", "lec": 1, "q": "心身症の定義として正しいものはどれか。", "ch": ["神経症に伴う身体症状が主となる病態", "心理的ストレスのみで発症する身体疾患", "検査で器質的異常を認めない身体症状", "身体疾患に心理社会的因子が関わる病態", "うつ病に伴う身体症状が主となる病態"], "a": 4, "ex": "心身症は、身体疾患の中で発症や経過に心理社会的因子が密接に関与し、器質的ないし機能的障害が認められる病態。神経症やうつ病など他の精神障害に伴う身体症状は除外する。", "flag": 0, "id": 90}, {"t": "mc", "src": "yosou", "lec": 2, "q": "変換症の説明として正しいものはどれか。", "ch": ["検査に合わない症状を無意識に呈する", "関心を集める目的で意図的に症状を偽る", "金品を得る目的で意図的に症状を偽る", "病気ではと6か月以上心配し続ける", "身体症状に過度にとらわれ訴え続ける"], "a": 1, "ex": "変換症は無意識。関心目的の意図的な偽りは作為症、金品・義務逃れ目的は詐病、病気への不安は心気症（病気不安症）、身体症状へのとらわれは身体的苦痛症。", "flag": 0, "id": 91}, {"t": "mc", "src": "yosou", "lec": 3, "q": "双極症の抑うつエピソードに用いる薬剤はどれか。", "ch": ["パロキセチン（パキシル）", "デュロキセチン（サインバルタ）", "アルプラゾラム（ソラナックス）", "ハロペリドール（セレネース）", "炭酸リチウム（リーマス）"], "a": 5, "ex": "双極症は抑うつ状態でも気分安定薬を用いる。抗うつ薬（SSRI・SNRI）は効果がなく、自殺や急速交代型のリスクが高まるため避ける。抗不安薬は対症療法、ハロペリドールは定型抗精神病薬。", "flag": 0, "id": 92}, {"t": "mc", "src": "yosou", "lec": 3, "q": "次のうち、予後が悪いとされるのはどれか。", "ch": ["妄想型", "破瓜型（解体型）", "緊張型", "統合失調感情障害", "妄想性障害"], "a": 2, "ex": "破瓜型は陰性症状が進行し無為・閉居に陥りやすく予後不良。緊張型は薬物治療やECTの反応が良好で比較的予後が良い。統合失調感情障害・妄想性障害は症状による分類（病型ではない）。", "flag": 0, "id": 93}, {"t": "mc", "src": "yosou", "lec": 4, "q": "レビー小体型認知症に特徴的で、アルツハイマー型との鑑別点となるのはどれか。", "ch": ["初期から目立つ近時記憶の障害", "海馬を含む側頭葉内側の萎縮", "認知機能の日内変動（動揺性）", "緩徐に進行する物忘れの症状", "進行に伴う遠隔記憶の障害"], "a": 3, "ex": "日内・日間・月間の動揺性はレビー小体型の中核的特徴。アルツハイマー型は日内変動が起きにくく、近時記憶障害から始まり、側頭葉内側の萎縮が特徴。", "flag": 0, "id": 94}, {"t": "mc", "src": "yosou", "lec": 4, "q": "せん妄の促進因子に該当するのはどれか。", "ch": ["70歳以上の高齢であること", "認知症の既往歴があること", "手術を受けた経過があること", "アルコールの離脱があること", "入院での環境変化があること"], "a": 5, "ex": "促進因子（油）は身体的苦痛・精神的苦痛・環境変化・睡眠障害。高齢・認知症・せん妄既往は準備因子（薪）、身体疾患・薬剤・手術・アルコール離脱は直接因子（ライター）。", "flag": 0, "id": 95}, {"t": "mc", "src": "yosou", "lec": 5, "q": "神経性やせ症の特徴として正しいものはどれか。", "ch": ["低体重でも活動性が亢進している", "徐脈ではなく頻脈がみられる", "低体重への深刻さが強くみられる", "無月経ではなく過多月経がみられる", "体温と血圧がともに上昇する"], "a": 1, "ex": "過活動が特徴。無月経・徐脈・低体温・低血圧・うぶ毛の増加がみられ、低体重に対する深刻さは欠如している。診断基準はBMI18.5以下。", "flag": 0, "id": 96}, {"t": "mc", "src": "yosou", "lec": 5, "q": "アルコール離脱せん妄を疑った際の対応として適切なのはどれか。", "ch": ["抗酒薬のシアナマイドを直ちに開始する", "断酒会への参加を最優先で勧める", "ビペリデンの内服を直ちに開始する", "ベンゾジアゼピン系の注射を検討する", "動機づけ面接を継続して実施する"], "a": 4, "ex": "意識障害が起きた場合は離脱せん妄を疑い、ベンゾジアゼピン系の静脈注射・筋肉注射、ハロペリドール点滴の併用を検討する。呼吸抑制に注意。抗酒薬・断酒会・動機づけ面接は離脱期の対応ではなく治療・援助の段階。", "flag": 0, "id": 97}, {"t": "mc", "src": "yosou", "lec": 6, "q": "ADHDの治療に用いられる薬剤はどれか。", "ch": ["リスペリドン（リスパダール）", "アリピプラゾール（エビリファイ）", "グアンファシン（インチュニブ）", "ドネペジル（アリセプト）", "ラメルテオン（ロゼレム）"], "a": 3, "ex": "ADHDの薬はアトモキセチン（ストラテラ）・メチルフェニデート徐放錠（コンサータ）・グアンファシン（インチュニブ）。リスペリドン・アリピプラゾールはASDの周辺症状への補完的な対症療法、ドネペジルは抗認知症薬、ラメルテオンは概日リズム用。", "flag": 0, "id": 98}, {"t": "mc", "src": "yosou", "lec": 7, "q": "口唇や顔面周囲に多い、繰り返し持続する不随意運動はどれか。", "ch": ["パーキンソニズム", "ジスキネジア", "アカシジア", "ジストニア", "悪性症候群"], "a": 2, "ex": "遅発性ジスキネジアは口唇・顔面周囲に多く、処方の中止など。パーキンソニズムは流涎・筋固縮・動作緩慢、アカシジアは足のムズムズ、ジストニアは持続する筋収縮と姿勢異常。", "flag": 0, "id": 99}, {"t": "mc", "src": "yosou", "lec": 7, "q": "睡眠薬の第一選択と言える薬はどれか。", "ch": ["ゾルピデム（マイスリー）", "エチゾラム（デパス）", "フルニトラゼパム（サイレース）", "ラメルテオン（ロゼレム）", "スボレキサント（ベルソムラ）"], "a": 5, "ex": "オレキシン受容体阻害薬（ベルソムラ・デエビゴ）は依存や耐性が生じず安全性が高く、初めての内服に適切。ベンゾジアゼピン系は耐性・依存に注意。ラメルテオンは概日リズムへ作用し効果は弱め。", "flag": 0, "id": 100}, {"t": "mc", "src": "yosou", "lec": 1, "q": "抗精神病薬が主に作用する神経伝達物質はどれか。", "ch": ["ドパミン", "セロトニン", "GABA", "アセチルコリン", "ノルアドレナリン"], "a": 1, "ex": "抗精神病薬はドパミン受容体への結合を競合的に阻害する。抗うつ薬はセロトニン・ノルアドレナリン、抗不安薬はGABA、抗認知症薬はアセチルコリンに作用する。", "flag": 0, "id": 101}, {"t": "mc", "src": "yosou", "lec": 1, "q": "セリエのストレス学説で、非特異的刺激に共通して増加するとされるのはどれか。", "ch": ["副腎髄質ホルモン", "甲状腺ホルモン", "副腎皮質ホルモン", "成長ホルモン", "性腺刺激ホルモン"], "a": 3, "ex": "セリエ（Hans Selye：ハンガリー系カナダ・内分泌学者）は、異なる刺激に共通して副腎皮質ホルモン分泌が増加する現象を「ストレス」と命名した。副腎髄質ホルモン（アドレナリン）は、キャノンの闘争・逃走反応と結びつく隣接概念。", "flag": 0, "id": 102}, {"t": "mc", "src": "yosou", "lec": 1, "q": "心身症が生じる機序のうち、学習された行動と考えられるのはどれか。", "ch": ["恒常性の保持の破綻", "筋肉運動による疼痛", "免疫機能の低下", "自律神経の過剰反応", "条件反射による症状出現"], "a": 5, "ex": "ホメオスタシス・筋肉運動・免疫は非特異的刺激への共通の変化。予期不安・暗示・条件反射の3つは学習された行動と考える（パブロフ的反応）。", "flag": 0, "id": 103}, {"t": "mc", "src": "yosou", "lec": 1, "q": "タイプA行動との関連が指摘されている疾患はどれか。", "ch": ["気管支喘息", "冠動脈疾患", "過敏性腸症候群", "胃・十二指腸潰瘍", "円形脱毛症"], "a": 2, "ex": "時間に追われ熱中しやすく野心的・行動的な性格傾向（タイプA行動）は、冠動脈硬化症との関連が指摘されている。他は心身症に含まれる疾患だが、タイプA行動との関連で問われるのは冠動脈疾患。", "flag": 0, "id": 104}, {"t": "mc", "src": "yosou", "lec": 1, "q": "アレキシサイミア（失感情症）の特徴はどれか。", "ch": ["感情表出が過剰になる状態", "現実と空想の区別がつかない状態", "行為の無意味さを自覚している状態", "感情の認知と言語化が困難な状態", "感情を意識から切り離した状態"], "a": 4, "ex": "アレキシサイミアは感情の認知・言語表現が不十分で、想像活動に困難さをもつ特徴。体が代わりに表現し心身症につながりやすい。「行為の無意味さの自覚」は強迫症、「意識から切り離す」は解離症の隣接概念。", "flag": 0, "id": 105}, {"t": "mc", "src": "yosou", "lec": 2, "q": "神経症の共通点として正しいものはどれか。", "ch": ["幻覚や妄想が高頻度にみられる", "現実検討能力が保たれている", "人柄が大きく変化する", "入院治療が原則となる", "了解が困難な症状が中心となる"], "a": 2, "ex": "神経症では病的な体験と外界の現実を混同しない（現実検討能力が保たれる）。統合失調症との重要な鑑別点。行為に問題があっても人柄は変わらず、外来治療で対応できることが多い。", "flag": 0, "id": 106}, {"t": "mc", "src": "yosou", "lec": 2, "q": "広場恐怖に対する治療として適切なものはどれか。", "ch": ["恐怖対象の完全な回避指導", "抗不安薬の定時内服の継続", "気にしないよう励ますこと", "恐怖対象への段階的な暴露", "症状の原因の徹底的な追及"], "a": 4, "ex": "広場恐怖は逃げ出せない・助けが来ない状況への強い不安で、恐怖の対象に徐々に暴露する暴露療法を行う。回避を続けると不安は維持される。", "flag": 0, "id": 107}, {"t": "mc", "src": "yosou", "lec": 2, "q": "変換症で生じやすい症状はどれか。", "ch": ["突然の失声や難聴", "全生活史に及ぶ健忘", "現実が変容した感覚", "洗浄や確認の反復行為", "自分の体への過度な心配"], "a": 1, "ex": "変換症は医学的検査に合わない運動・感覚症状（失立・失歩・失声・難聴など）。全生活史健忘は解離性健忘、現実の変容は離人感・現実感消失症、反復行為は強迫症、体への過度な心配は身体的苦痛症・心気症。STが関わる失声・難聴は器質因の除外が先決。", "flag": 0, "id": 108}, {"t": "mc", "src": "yosou", "lec": 2, "q": "遷延性悲嘆症と比べ、うつ病に特有とされるのはどれか。", "ch": ["悲しみの程度が強い", "故人を思う追慕が続く", "時間とともに回復に向かう", "死別が契機となって生じる", "朝に悪く夕方に回復する"], "a": 5, "ex": "うつ病に特有の日内変動（朝に最も悪く夕方以降に回復）は、遷延性悲嘆症・心因性の抑うつ・器質性の抑うつには原則みられない。", "flag": 0, "id": 109}, {"t": "mc", "src": "yosou", "lec": 2, "q": "解離性同一症の患者への対応として適切なものはどれか。", "ch": ["別人格の出現を禁止する", "別人格の存在を否定する", "各人格を尊重して対話する", "抗不安薬を積極的に使用する", "症状を繰り返し詳しく聞く"], "a": 3, "ex": "別人格の否定・拒否は症状を難治化させるため、各人格を尊重しながら治療的な対話を行う。向精神薬（特に抗不安薬）は適用とならず悪化させる可能性がある。中核は心理療法による人格の統合。", "flag": 0, "id": 110}, {"t": "mc", "src": "yosou", "lec": 3, "q": "抑うつ状態の鑑別で、最初に除外するのはどれか。", "ch": ["心因性（反応性）の抑うつ", "内因性（自然発症）の抑うつ", "外因性（器質性）の抑うつ", "季節性（冬季）の抑うつ", "仮面うつ病（身体症状型）"], "a": 3, "ex": "鑑別は外因性（器質性）→内因性→心因性（反応性）の順。脳梗塞・疼痛・糖尿病など身体の病気に伴う抑うつをまず除外する。うつ病は内因性に該当する。", "flag": 0, "id": 111}, {"t": "mc", "src": "yosou", "lec": 3, "q": "抗うつ薬の開始後に易怒性や軽躁状態が出現した際の対応はどれか。", "ch": ["抗うつ薬を増量する", "抗精神病薬を併用する", "睡眠薬を追加する", "抗不安薬を定時内服させる", "抗うつ薬を中止する"], "a": 5, "ex": "アクティベーション症候群（賦活症候群）は抗うつ薬開始後の易怒性・軽躁状態などで、内服を中止する。治療中に妄想が生じた場合は双極症を疑う。", "flag": 0, "id": 112}, {"t": "mc", "src": "yosou", "lec": 3, "q": "統合失調症の陰性症状はどれか。", "ch": ["幻聴", "感情の平板化", "滅裂思考", "奇異な行動", "被害関係妄想"], "a": 2, "ex": "陰性症状は感情の平板化・無気力・自発性の低下・自閉など精神機能の減退。幻覚・妄想・滅裂思考・奇異な行動は陽性症状。", "flag": 0, "id": 113}, {"t": "mc", "src": "yosou", "lec": 3, "q": "一次妄想に該当するのはどれか。", "ch": ["貧困妄想", "罪業妄想", "心気妄想", "妄想知覚", "誇大妄想"], "a": 4, "ex": "一次妄想（脈絡がない）は妄想気分・妄想知覚・妄想着想で統合失調症。貧困・罪業・心気妄想はうつ病の二次妄想（微小妄想）、誇大妄想は躁うつ病の二次妄想。", "flag": 0, "id": 114}, {"t": "mc", "src": "yosou", "lec": 3, "q": "炭酸リチウムの使用上の注意として正しいものはどれか。", "ch": ["中毒で振戦や運動失調がみられる", "高アンモニア血症に注意が必要", "てんかん患者でも使用しやすい", "腎機能が低下した者に適している", "糖尿病患者では禁忌である"], "a": 1, "ex": "炭酸リチウム（リーマス）は腎機能低下・QT延長に注意、てんかん患者は禁忌で、中毒で振戦・運動失調・消化器症状が出る。高アンモニア血症はバルプロ酸、糖尿病禁忌はクエチアピン・オランザピン。", "flag": 0, "id": 115}, {"t": "mc", "src": "yosou", "lec": 4, "q": "せん妄の準備因子に該当するのはどれか。", "ch": ["周術期の侵襲", "ベンゾジアゼピン系薬剤の使用", "アルコール離脱", "認知症の既往", "入院による環境変化"], "a": 4, "ex": "準備因子（薪）は高齢（70歳以上）・認知症・器質因やせん妄の既往・アルコール多飲でリスク評価に使う。手術・薬剤・アルコール離脱は直接因子（ライター）、環境変化は促進因子（油）。", "flag": 0, "id": 116}, {"t": "mc", "src": "yosou", "lec": 4, "q": "低活動型せん妄の特徴として正しいものはどれか。", "ch": ["不穏を伴わず活動性が低下する", "過剰で無目的な行動が目立つ", "幻視が高頻度に出現する", "数週間かけて緩徐に進行する", "意識清明な状態で生じる"], "a": 1, "ex": "低活動型せん妄は不穏を伴わない。高活動型せん妄はせん妄と不穏が重複する。せん妄は意識障害で、数時間〜数日で急に生じ1日の中でも変動（迂動性）する。", "flag": 0, "id": 117}, {"t": "mc", "src": "yosou", "lec": 4, "q": "レビー小体型認知症の中核的特徴はどれか。", "ch": ["初期から目立つ性格変化", "階段状に悪化する経過", "認知機能の日内・日間変動", "近時記憶障害が初発症状", "歩行障害と尿失禁の併存"], "a": 3, "ex": "中核的特徴は認知機能の動揺性・パーキンソニズム・幻視（初期から）。性格変化は前頭側頭型、階段状悪化は血管性、近時記憶障害はアルツハイマー型、歩行障害・尿失禁は正常圧水頭症。", "flag": 0, "id": 118}, {"t": "mc", "src": "yosou", "lec": 4, "q": "手術によって改善する可能性がある認知症の原因はどれか。", "ch": ["前頭側頭葉の変性", "レビー小体の蓄積", "アミロイドβの蓄積", "多発性脳梗塞の出現", "頭部外傷後の血腫形成"], "a": 5, "ex": "慢性硬膜下血腫は軽微な頭部外傷後に血腫ができ、穿頭血腫ドレナージ術で改善しうるTreatable Dementia（治る認知症）。正常圧水頭症もシャント術で改善する。", "flag": 0, "id": 119}, {"t": "mc", "src": "yosou", "lec": 4, "q": "認知症のBPSDへの対応として適切なものはどれか。", "ch": ["抗精神病薬を第一選択とする", "非薬物療法による介入を重視する", "興奮時は身体拘束を原則とする", "ベンゾジアゼピン系を定時内服する", "抗認知症薬を速やかに増量する"], "a": 2, "ex": "BPSDへの薬物療法は低ナトリウム血症・QT延長・転倒・誤嚥などのリスクがあるため安易に使わず、非薬物療法が重要。ユマニチュードやパーソンセンタードケアが関わり方の参考になる。", "flag": 0, "id": 120}, {"t": "mc", "src": "yosou", "lec": 5, "q": "睡眠時無呼吸症候群の患者に避けるべき睡眠薬はどれか。", "ch": ["ラメルテオン（ロゼレム）", "スボレキサント（ベルソムラ）", "レンボレキサント（デエビゴ）", "トラゾドン（レスリン）", "エチゾラム（デパス）"], "a": 5, "ex": "ベンゾジアゼピン系（エチゾラム・ゾルピデムなど）は呼吸抑制によりSASを悪化させる。SASの確定診断は呼吸器内科・循環器内科で行う。", "flag": 0, "id": 121}, {"t": "mc", "src": "yosou", "lec": 5, "q": "ナルコレプシーの症状はどれか。", "ch": ["夢に左右された睡眠中の行動", "情動脱力発作や睡眠麻痺", "睡眠中の周期的な下肢の運動", "夕方からの足のむずむず感", "睡眠中の10秒以上の呼吸停止"], "a": 2, "ex": "ナルコレプシーは昼間の睡眠発作・情動脱力発作（カタプレキシー）・睡眠麻痺（金縛り）・入眠時幻覚。選択肢の順に、レム睡眠行動障害・周期性四肢運動障害・レストレスレッグス症候群・睡眠時無呼吸症候群。", "flag": 0, "id": 122}, {"t": "mc", "src": "yosou", "lec": 5, "q": "神経性過食症の発作抑制に有効とされる薬剤はどれか。", "ch": ["抗精神病薬", "気分安定薬", "抗不安薬", "抗うつ薬", "睡眠薬"], "a": 4, "ex": "神経性過食症では、セロトニン再取り込み抑制作用をもつ抗うつ薬が過食発作の抑制に有効。過食を客観視させ、時間・内容・金額を記録して過食パターンを共有する。", "flag": 0, "id": 123}, {"t": "mc", "src": "yosou", "lec": 5, "q": "アルコール依存症の家族がイネイブラーになる行動はどれか。", "ch": ["本人の借金を代わりに返済する", "専門外来への受診を勧める", "家族全体で病気への理解を深める", "断酒会や家族会に参加する", "飲酒時の対応を家族で統一する"], "a": 1, "ex": "イネイブラーは借金や不始末の処理、酒の購入などを代行してしまう家族で、回復を妨げる（家族病理）。家族全体への働きかけが必要。", "flag": 0, "id": 124}, {"t": "mc", "src": "yosou", "lec": 5, "q": "ウェルニッケ脳症の三徴はどれか。", "ch": ["健忘・作話・失見当識", "振戦・幻視・発汗", "眼球運動障害・運動失調・意識障害", "認知障害・歩行障害・尿失禁", "無月経・徐脈・低体温"], "a": 3, "ex": "ウェルニッケ脳症の三徴は眼球運動障害・運動失調・意識障害（原因はビタミンB1欠乏）。健忘・作話・失見当識はコルサコフ症候群、振戦・幻視は振戦せん妄、認知障害・歩行障害・尿失禁は正常圧水頭症、無月経・徐脈・低体温は神経性やせ症。", "flag": 0, "id": 125}, {"t": "mc", "src": "yosou", "lec": 6, "q": "ADHDについて正しいものはどれか。", "ch": ["多動は成長後も変わらず残存する", "12歳以前から症状が存在している", "薬物療法の適用はない", "学習面の問題のみで診断される", "自覚が乏しく苦手な面に気づかない"], "a": 2, "ex": "ADHDは欠陥ではなく、12歳以前から存在する不注意または多動性・衝動性。多動は成長に従い消失することがある一方、不注意は残存しやすい。薬物療法の適用があり、当事者は自分の苦手な面を自覚していることが多い。", "flag": 0, "id": 126}, {"t": "mc", "src": "yosou", "lec": 6, "q": "限局性学習症（SLD）への対応として適切なものはどれか。", "ch": ["メチルフェニデートを第一選択とする", "努力不足として課題量を増やす", "一人で取り組ませて自立を促す", "療育や支援につなげて具体的に援助する", "抗不安薬で緊張を和らげる"], "a": 4, "ex": "SLDは明確な能力の問題で、怠けでも努力不足でもない。薬物治療は奏功せず、適切な療育や支援につなげる。問題が顕在化した時点で具体的支援が必要。", "flag": 0, "id": 127}, {"t": "mc", "src": "yosou", "lec": 6, "q": "ウィング（Wing, L.）の「三つ組」に含まれるのはどれか。", "ch": ["イマジネーションの障害", "注意の持続の障害", "衝動性の制御の障害", "読字の障害", "運動の協調の障害"], "a": 1, "ex": "ウィング（英・精神科医）の三つ組は、対人相互的交流の障害・社会的コミュニケーションの障害・イマジネーションの障害。注意・衝動性はADHD、読字はSLD、運動の協調は別の神経発達症。", "flag": 0, "id": 128}, {"t": "mc", "src": "yosou", "lec": 6, "q": "自閉スペクトラム症（ASD）への支援として適切なものはどれか。", "ch": ["感情的に叱って行動を改めさせる", "してはいけない行動を禁止する", "曖昧な表現で察する力を促す", "視覚情報を制限せず刺激を増やす", "具体的に伝え代わりの行動を示す"], "a": 5, "ex": "平易で具体的に伝え、視覚化し、感情的な叱責を避ける。禁止だけでは適応できないことが多く、代わりの行動を具体的に提示して、できたら褒める（好子出現による強化）。", "flag": 0, "id": 129}, {"t": "mc", "src": "yosou", "lec": 6, "q": "パーソナリティ症への対応として適切なものはどれか。", "ch": ["薬物療法を主体に治療する", "受診が中断しない前提で進める", "傾聴を含む支持的な介入を行う", "問題行動を厳しく指摘し修正する", "数週間で改善する前提で関わる"], "a": 3, "ex": "薬物療法の適用はなく、心理・精神療法が主体。根底に心理的苦悩があり、受診が中断しやすい等の問題はあるが、年単位の治療的関わりで特徴が目立たなくなることがある。表記は「人格障害」ではなくカタカナ。", "flag": 0, "id": 130}, {"t": "mc", "src": "yosou", "lec": 7, "q": "錐体外路症状のうち、足がむずむずして座位を保てないのはどれか。", "ch": ["パーキンソニズム", "ジスキネジア", "アカシジア", "ジストニア", "悪性症候群"], "a": 3, "ex": "アカシジアは足のムズムズ感でじっとしていられない（座位不能）。レストレスレッグス症候群と訴えが似る。パーキンソニズムは振戦・筋強剛・流涎・動作緩慢、ジスキネジアは口唇・顔面の不随意運動、ジストニアは持続する筋収縮による姿勢異常。", "flag": 0, "id": 131}, {"t": "mc", "src": "yosou", "lec": 7, "q": "抗うつ薬について正しいものはどれか。", "ch": ["内服直後から気分を上げる", "効果が不十分なら速やかに中止する", "症状が改善したら直ちに中止する", "双極症の抑うつ状態に第一選択となる", "効果の実感まで約2週間を要する"], "a": 5, "ex": "抗うつ薬は「うつ病に効く薬」で気分を上げる薬ではなく、効果の実感まで約2週間かかる。中止時は漸減し、急な中止は症状再燃・離脱症状を招く。双極症の抑うつ状態には避ける。", "flag": 0, "id": 132}, {"t": "mc", "src": "yosou", "lec": 7, "q": "定型抗精神病薬に該当するのはどれか。", "ch": ["リスペリドン", "ハロペリドール", "クエチアピン", "オランザピン", "アリピプラゾール"], "a": 2, "ex": "定型抗精神病薬の代表はハロペリドール（セレネース）で、錐体外路症状を生じやすい。他は非定型で、新規開始は非定型が優先される。", "flag": 0, "id": 133}, {"t": "mc", "src": "yosou", "lec": 7, "q": "リスペリドン内用液で生じうる、STに関連する副作用はどれか。", "ch": ["味覚障害", "聴覚過敏", "失声", "薬剤性嚥下障害", "咽喉頭異常感"], "a": 4, "ex": "リスペリドン（主に内用液の頓服）は薬剤性嚥下障害を起こす場合があり、STの嚥下評価でも注意が必要。咽喉頭異常感は半夏厚朴湯の適用（咽中炙臠）の訴え。", "flag": 0, "id": 134}, {"t": "mc", "src": "yosou", "lec": 7, "q": "抑肝散の説明として正しいものはどれか。", "ch": ["高齢者の易怒性や不眠に用いられる", "依存性が強く効果も強い", "副作用として高カリウム血症が多い", "咽の詰まり感に用いる", "食後の内服が原則である"], "a": 1, "ex": "抑肝散は高齢者の易怒性・不眠、小児の夜泣き・ひきつけに用いられ、依存性はないが効果も弱い。副作用は低カリウム血症・間質性肺炎、食前内服が多い。咽の詰まり感は半夏厚朴湯。※PDF資料になく授業動画のスライドのみの内容。", "flag": 0, "id": 135}, {"t": "essay", "src": "form", "lec": 3, "q": "双極症に関する要点を説明し、関わり方についても回答せよ。（記述式）", "kw": "双極症／躁状態と抑うつ状態／うつ病と決めつけない／気分安定薬／抑うつエピソードでも抗うつ薬は禁忌／躁転・混合状態では抗うつ薬を即中止／病識欠如／家族からの聴取", "model": "双極症は躁病（軽躁病）エピソードと抑うつエピソードを繰り返す疾患であり、落ち込んでいる様子だけでうつ病と決めつけず、双極症の可能性も考える。躁状態では病識に欠けることが多く、周囲の家族からの情報が重要となる。治療は気分安定薬（炭酸リチウム・デパケン）が基本で、抑うつエピソードでも抗うつ薬は用いない。うつ病として治療中に躁転したり混合状態になった場合は、抗うつ薬を直ちに中止する。関わりでは、躁状態では制止せず中立的に対応し、抑うつ状態では共感的・支持的に関わり、服薬の継続を支える。", "pt": "人が落ち込むのを見て、うつ病と決めつけない／双極症の可能性もありうる／抑うつエピソードの薬物治療は気分安定薬／躁転・混合状態では抗うつ薬を即中止（P105）", "mine": "躁状態とうつ状態がある。躁状態の時は病識に欠けているので周りの方が気づきやすい。躁状態の時に他の関係とトラブルになることも多いため、病状をよく知り接することが大切。（表記のみ整えています）", "flag": 0, "id": 136}, {"t": "essay", "src": "form", "lec": 4, "q": "Dementia（認知症）、Delirium（せん妄）、Depression（うつ）で高齢者の「3D」とも呼ばれるが、これらの鑑別の要点を簡潔に回答せよ。（記述式）", "kw": "器質因としてまず認知症を検討／急性期か慢性期か／一過性の不穏・せん妄／見当識障害の有無／BPSD／レビー小体型の前駆症状／せん妄・うつ病の既往で再発しやすい／心因性の抑うつ", "model": "まず器質因として認知症の可能性を検討する。同時に急性期か慢性期かを確認し、急性期であれば一過性の不穏やせん妄を、慢性期であれば認知症を考える。見当識障害の有無も鑑別の参考になる。抑うつは内因性とされるが、BPSDの症状やレビー小体型認知症の前駆症状として起きていることもあるため、十分に鑑別する。せん妄やうつ病の既往があれば再発しやすい可能性も考慮し、それらに該当しない場合は心因性の抑うつも考える。（補足：せん妄は意識障害を伴い急性、認知症は意識清明で緩徐、うつは朝に悪い日内変動）", "pt": "まず器質因として認知症の可能性を検討／急性期か慢性期か／見当識障害の有無／抑うつはBPSD・レビー小体型の前駆症状の可能性／せん妄・うつ病の既往で再発しやすい／該当しなければ心因性の抑うつ", "mine": "せん妄は意識障害で急に生じ改善しうるが、認知症は徐々に進行する。うつは日内変動があるが、認知症はレビー小体型以外は日内変動が少なく、型も異なる。", "flag": 0, "id": 137}, {"t": "essay", "src": "form", "lec": 5, "q": "嗜癖行動症、ギャンブル依存や子どものゲーム依存といった問題と対応の難しさについて、浮かぶことを回答して下さい（アンケート形式）。", "kw": "学校や仕事の支障／現実の人間関係かSNS上のみか／ルール設定と対話（学童期）／本人の了承と一定の枠組み／強く条件づけられやすい／認知行動療法／行動分析学／根気強い介入／否認／イネイブラー／家族全体への働きかけ", "model": "ギャンブルやゲームの問題では、まず学校や仕事に支障が出ているかを確認する。ゲームの場合は、現実の人間関係があるのか、SNS上のみの関係なのかで関わりが変わる。ルール設定は、脳が脆弱な学童期の子どもとは対話をしながら、本人の了承を取りつつ一定の枠組みを守る。強く条件づけされやすい行動のため、認知行動療法や行動分析学などによる根気強い介入が必要である。本人が問題を認めない「否認」や、家族が借金を肩代わりする「イネイブラー」の問題もあり、家族全体への働きかけも大切である。", "pt": "学校や仕事に支障が出ているか／ゲームでは現実の人間関係かSNSのみか／ルール設定（学童期は対話、本人の了承と枠組み）／強く条件づけされやすい嗜好行動／認知行動療法・行動分析学等による根気強い介入", "mine": "難しさは、本人が問題を認識しにくく否認の病であるという点である。嘘をついたり問題を隠すことが多く、支援者との信頼関係の構築に時間がかかる。また、家族がイネイブラーになりやすく、借金や不始末を代行してしまうことが回復を妨げる要因となる。そのため家族全体への働きかけが不可欠であり、家族全員が同じ姿勢で病気に向き合うことが重要である。一方で、家族自身も長年の対応により精神的に疲弊していることが多く、二次障害への配慮も必要となる。子どものゲーム依存については、本人が問題と感じていない場合が多く、ゲームが唯一の居場所になっているケースや発達障害が関わる可能性があるため、学校・家庭・医療が連携した包括的な支援が求められる。", "flag": 0, "id": 138}, {"t": "essay", "src": "form", "lec": 6, "q": "自らの性格についてどう捉えているか、その性格がどのように作られてきたか、また自身や他者の性格のかたよりについて、考えたことを回答せよ。（記述式）", "kw": "生まれつきか後天的か単純に言えない／一卵性双生児で基本的行動特性の一致度が高い／模倣による学習／弁別刺激や言語行動による条件づけ（環境）／心理的経過（周囲への態度・自己評価・感情欲求の統制・生活問題への対処）／本人が納得できる支援", "model": "性格は生まれつきか後天的につくられるか単純には言えないが、一卵性双生児の研究では基本的な行動特性の一致度が高く、気質の影響が考えられる。一方で、模倣による学習や、他者の言葉かけ・反応によって条件づけられてきた環境の影響もある。私自身も育った環境と経験から形づくられた部分がある。性格のかたよりは「直すべき問題」ではなく、その人の経験の積み重ねとして理解し、本人が納得できる形で支援を考えることが大切である。（自分の体験を具体的に入れる）", "pt": "性格は生まれつきか後天的か単純に言えない難しさ／一卵性双生児で基本的行動特性の一致度が高い／形成過程：①模倣による学習 ②他者による弁別刺激・言語行動での条件づけ（環境）／心理的経過：①周囲への態度 ②自己評価 ③感情・欲求の統制・表出（対処行動）④生活上の諸問題への取り組み（対処行動）", "mine": "私の性格は、共働きの家庭で育ち干渉が少なかったことから、自己決定や自由を重んじる傾向が強い。一方で、両親の子育て方針が異なっていたため、幼い頃から周囲の顔色を伺いながら立ち回る習慣が身についた。また「自分のことは自分でできる」という環境の中で育ったため、人に頼ることへの苦手意識があり、何でも一人でこなそうとする傾向がある。このように性格は気質だけでなく、成育歴や環境との相互作用によって形成されるものであり、表現された言葉だけでその人の性格を判断することはできない。表情や身体の動きなど、本人が自覚していない部分にも目を向けることが重要である。若い頃は自分と異なる考えを尊重することが難しかったが、様々な人との出会いや経験を重ねることで他者の多様な視点を理解できるようになった。これはメタ認知の発達や認知的複雑性の増加によるものと考える。他者の性格のかたよりについても、その背景にある成育歴や環境を理解しようとする姿勢が支援の出発点となる。支援においては本人が納得できる形でアプローチを模索することが大切であり、性格のかたよりを「直すべき問題」ではなく「その人らしさ」として理解することがポイントと考える。", "flag": 0, "id": 139}, {"t": "essay", "src": "form", "lec": 7, "q": "向精神薬の内服をめぐる患者の心理や、内服行動や内服を維持することについて、考えたり浮かんだことについて回答せよ。（記述式）", "kw": "自尊心／服薬への抵抗・やめたい焦り／急な自己中断・自己判断の減薬は不利益／信頼関係に基づく心理教育／副作用・依存への不安／コンプライアンスからアドヒアランスへ／病気とうまく付き合う", "model": "向精神薬を服薬していること自体が自尊心を損ねているように感じる患者は少なくないと考える。薬を飲まなくても自分をコントロールできることは本来の人としての喜びでもあるため、薬をやめたいという希望や焦りが生まれやすい。しかし、急な自己中断や自己判断での減薬は患者にとって不利益となることがあるため、支援者は信頼関係に基づき、副作用や依存への不安にも触れながら十分な心理教育を行う必要がある。また、医療者に従う「コンプライアンス」ではなく、患者自身が治療方針を自分のものとして守る「アドヒアランス」の考え方が重要である。そのうえで、うまく服薬を続けられている自分を認められるようになり、病気とうまく付き合っていくことが大切だと考える。", "pt": "【先生の解説は後日classroomに掲示予定のため未確認】資料より：急な自己中断・自己判断の減薬は不利益／信頼関係に基づく心理教育／副作用の十分な説明／コンプライアンス→アドヒアランス", "mine": "服薬をしていること自体が自尊心を損ねているように感じる。薬を飲まなくても自分をコントロールできることは本来の人としての喜びとなるので、薬を飲まなくなることへの希望や焦りが生まれる。そこの自分を客観的に見て、むしろうまく服薬していけるようになった自分を認められる。うまく障害や病と付き合うことが重要と考える。（さやの元の記述。提出は整えた文章）", "flag": 0, "id": 140}, {"t": "essay", "src": "yosou", "lec": 1, "q": "心身症の定義を述べ、神経症やうつ病に伴う身体症状との違いを説明せよ。", "kw": "身体疾患／心理社会的因子が密接に関与／器質的ないし機能的障害／病態（病名ではない）／神経症・うつ病に伴う身体症状は除外／心が主に出るのが神経症", "model": "心身症は、身体疾患の中で、その発症や経過に心理社会的因子が密接に関与し、器質的ないし機能的障害が認められる病態をいう。特定の病名ではなく病態であり、様々な診療科の疾患が該当しうる。神経症やうつ病など他の精神障害に伴う身体症状は除外される。心身症は心理的ストレスが体に症状として現れる状態で、不安など精神的苦痛が主であれば神経症と区別する。", "pt": "第1・2回の頻出。定義を丸ごと書けるか、除外規定を落とさないかが採点ポイント。", "mine": "", "flag": 0, "id": 141}, {"t": "essay", "src": "yosou", "lec": 2, "q": "変換症・作為症・詐病の違いを、症状の出方（意図性）と目的の観点から説明せよ。", "kw": "変換症＝無意識／作為症＝意図的・関心を集める・疾患／詐病＝意図的・金品や義務逃れ／ミュンヒハウゼン症候群は児童虐待として対応／疾病利得", "model": "変換症は、解決困難なストレスに対して無意識に運動・感覚症状（失立・失声・難聴など）が生じ、医学的検査では説明がつかない。作為症は、周囲の関心を集める目的で意図的に病気や怪我をねつ造するもので、疾患として扱う。ミュンヒハウゼン症候群は家族を病気に仕立てる場合があり児童虐待として対応する。詐病は金品を得る、義務を逃れるなどの目的で意図的に症状を偽るもので、疾患ではない。", "pt": "身体症状症のまとめ問題。「意図性」「目的」「疾患か」の3点セットで書く。", "mine": "", "flag": 0, "id": 142}, {"t": "essay", "src": "yosou", "lec": 3, "q": "統合失調症の主要な症状を挙げ、患者への基本的な関わり方を説明せよ。", "kw": "陽性症状／陰性症状／思考と認知の障害／病識欠如／恐怖感／支持的に関わる／否定・訂正しない／つかず離れずの中立的態度／繰り返し聞かない／服薬の継続（アドヒアランス）", "model": "統合失調症の主要症状は、幻覚・妄想・滅裂思考などの陽性症状、感情の平板化・無気力などの陰性症状、記銘力低下や注意障害などの思考と認知の障害である。発症時は病識を持つことが困難で、恐怖感を抱えていることが多い。関わりでは、支持的に関わり続け、症状を否定したり訂正したりせず、症状を繰り返し聞くことは避ける。妄想には「つかず離れず」の中立的態度で、片足は患者の世界、片足は現実世界に置く。疎通性が乏しくても理解されたいと望んでいるため、対話をあきらめない。服薬は急な自己中断を避け、信頼関係に基づく心理教育でアドヒアランスを支える。", "pt": "レポート課題（統合失調症の患者の視点）とも重なる。第3回記述・第7回の服薬の話とつなげて書ける。", "mine": "", "flag": 0, "id": 143}, {"t": "essay", "src": "yosou", "lec": 4, "q": "せん妄の発生に関わる3つの因子を挙げ、予防と環境調整について説明せよ。", "kw": "準備因子（高齢・認知症・既往）／直接因子（身体疾患・薬剤・手術・アルコール離脱）／促進因子（身体的苦痛・精神的苦痛・環境変化・睡眠）／昼夜のリズム／カレンダー・時計／ベンゾジアゼピン系に注意／身体拘束は悪化させうる", "model": "せん妄は、準備因子（薪：高齢・認知症・器質因やせん妄の既往・アルコール多飲）、直接因子（ライター：身体疾患・薬剤・手術・アルコール離脱）、促進因子（油：身体的苦痛・精神的苦痛・環境変化・睡眠の乱れ）が重なって生じる。入院時にリスクを評価しハイリスクを同定し、多職種で共有する。促進因子の除去として、日中はカーテンを開けて明るくし夜間は薄暗くして睡眠覚醒リズムを整える、カレンダーや時計で見当識を支える、家族の写真や使い慣れた物で不安を減らす、担当看護師を固定するなどを行う。ベンゾジアゼピン系薬剤はせん妄を誘発するため注意し、身体拘束は悪化させることもあるため見守れる時間帯は解除を考慮する。", "pt": "第4回の核心。3因子を「薪・ライター・油」で整理して書く。ST（入院中の評価・訓練）にも直結。", "mine": "", "flag": 0, "id": 144}, {"t": "essay", "src": "yosou", "lec": 6, "q": "ADHDと自閉スペクトラム症の特徴と支援の違いを、自覚・薬物療法・関わり方の観点から説明せよ。", "kw": "ADHD：不注意・多動性・衝動性、自覚していることが多い、薬物療法に適用あり（ストラテラ・コンサータ・インチュニブ）、ペアレントトレーニング／ASD：社会的コミュニケーション・限局した反復行動、自覚に欠けることがある、カサンドラ症候群、薬物適用なし・対症療法／具体的に伝える・視覚化・代わりの行動を提示", "model": "ADHDは不注意や多動性・衝動性が幼少期から続くもので、欠陥ではなく、当事者は自分の苦手な面を自覚していることが多い。ADHDの薬物療法には適用があり、アトモキセチン・メチルフェニデート徐放錠・グアンファシンを用いる。支援は行動分析学に基づき、課題を区切り迅速にフィードバックし、保護者にはペアレントトレーニングを行う。ASDは社会的コミュニケーションの困難と限局した反復的な行動・興味が特徴で、自分の特徴の自覚に欠けることがあり、パートナーがカサンドラ症候群となることもある。ASDへの薬物適用はなく、周辺症状への対症療法にとどまる。支援は、平易で具体的に伝え、視覚情報を用い、感情的に叱らず、禁止だけでなく代わりの行動を示す。", "pt": "第6回で先生が強調（ADHDとASDの入れ替え）。比較表の形で頭に入れて書く。", "mine": "", "flag": 0, "id": 145}, {"t": "essay", "src": "yosou", "lec": 7, "q": "抗精神病薬の副作用である錐体外路症状の種類と対応を説明せよ。", "kw": "パーキンソニズム（流涎・筋固縮・動作緩慢）／アカシジア／ジスキネジア／ジストニア／悪性症候群／DIEPSS／抗パ薬の前に薬の見直し／抗コリン薬はジスキネジア以外／リスペリドン内用液と薬剤性嚥下障害", "model": "錐体外路症状は抗精神病薬のドパミン遮断により生じ、DIEPSSで評価する。パーキンソニズムは振戦・筋強剛・流涎・動作緩慢・小刻み歩行、アカシジアは足がムズムズしてじっとしていられず座位が保てない、ジスキネジアは口唇・顔面周囲に多い繰り返す不随意運動、ジストニアは持続する筋収縮による姿勢異常である。悪性症候群は強い筋強剛に高熱・CK高値・意識障害を伴い、疑った時点で直ちに薬を中止し点滴・電解質補正を行う。パーキンソニズムやアカシジアには抗パ薬を用いるが、使用前に抗精神病薬の中止・減量・変更を検討する。抗コリン薬はジスキネジア以外が対象である。リスペリドン内用液は薬剤性嚥下障害を起こすことがあり、STの嚥下評価でも注意が必要である。", "pt": "第7回の中心テーマ。症状名とキーワードの対応を問う記述に備える。STの視点（嚥下）まで書けると強い。", "mine": "", "flag": 0, "id": 146}, {"t": "mc", "src": "text", "lec": null, "ch": ["健康な側面も含めて全人的に理解する", "検査の目的は診断名の確定に限られる", "検査者と被検者の関係は結果に影響しない", "検査は多く組み合わせるほど正確になる", "医師が診断を決める際は検査が必須である"], "ref": "Q1 p.18", "sub": "心理検査", "q": "医療領域で心理職が心理検査を行う際の考え方として適切なのはどれか。", "a": 1, "ex": "心理検査は診断のためだけでなく、不適応な面と健康な面の両方を評価して全人的な理解を目指す。検査者と被検者の関係が結果に影響しうるため配慮し、機械的に進めず、信頼関係（ラポール）を築く力が求められる。", "flag": 0, "chn": 1, "id": 147}, {"t": "mc", "src": "text", "lec": null, "ch": ["要支援者の人生と尊厳に敬意を払って接する", "専門的な理解に基づき慎重に現実検討へ関わる", "検査や相談を含む多面的な視野を持つ", "限界を超える事例は一人で抱え込む", "支援者自身の人間性も深めていく"], "ref": "Q2 p.18-19", "sub": "臨床姿勢", "q": "精神疾患をもつ要支援者に関わる心理職の姿勢として、適切でないものはどれか。", "a": 4, "ex": "自分の専門や能力を超える事例は、一人で抱え込まず、多職種連携や地域資源の活用で対応するのが適切な姿勢。【元の形式】適切なものをすべて選ぶ設問（答えは5つすべて）。ここでは1つを反転して単一選択にした。", "flag": 0, "chn": 1, "id": 148}, {"t": "mc", "src": "text", "lec": null, "ch": ["観念奔逸", "昏迷", "保続", "連合弛緩", "微小妄想"], "ref": "Q1 p.28", "sub": "思考の異常", "q": "次のうち、思考の異常に分類されないものはどれか。", "a": 2, "ex": "昏迷は意欲・行動の異常で、統合失調症や解離症群でみられる。観念奔逸は躁状態、保続は認知症などでみられる思考過程の異常、連合弛緩は統合失調症の思考過程の異常、微小妄想は思考内容（うつ病）の異常。", "flag": 0, "chn": 2, "id": 149}, {"t": "mc", "src": "text", "lec": null, "ch": ["躁状態では貧困妄想が多くみられる", "統合失調症では微小妄想が多くみられる", "突然に確信した妄想は一次妄想である", "せん妄の被害妄想は体系化されている", "レビー小体型では誇大妄想が多くみられる"], "ref": "Q2 p.28-29", "sub": "妄想", "q": "妄想についての記述として正しいものはどれか。", "a": 3, "ex": "躁状態は誇大妄想、うつ病は貧困・罪業などの微小妄想（二次妄想）、統合失調症は被害妄想が多い。せん妄の妄想は断片的で変わりやすい。レビー小体型は幻視に基づく妄想やカプグラ症候群がみられる。発生過程が追えない突発的な妄想が一次妄想。", "flag": 0, "chn": 2, "id": 150}, {"t": "mc", "src": "text", "lec": null, "ch": ["認知症は外因性の疾患に分類される", "鑑別は内因、心因、外因の順に進める", "統合失調症は外因性の疾患に分類される", "典型的な症状があれば身体疾患の検索は不要", "心因性の疾患は体質の影響を受けない"], "ref": "Q1 p.41", "sub": "外因・内因・心因", "q": "外因・内因・心因の考え方として正しいものはどれか。", "a": 1, "ex": "鑑別は外因→内因→心因の順。統合失調症は内因性だが、てんかん・物質使用症・自己免疫性脳炎などの外因が似た病像を示すため除外が必要。三分法は理念的な図式で、外因でも体質や環境、内因でも心理社会的要因の影響を受ける。", "flag": 0, "chn": 3, "id": 151}, {"t": "mc", "src": "text", "lec": null, "ch": ["面接の前半はオープンエンドの質問を使う", "専門用語はできるだけ控えて話す", "家族が無断で渡す情報には慎重に対応する", "問診を誰から始めるかは患者に配慮する", "病識がない時は家族の側に立って進める"], "ref": "Q2 p.41-42", "sub": "初診面接", "q": "初診時面接の注意点として、誤っているものはどれか。", "a": 5, "ex": "本人が望まない受診では、面接者は本人と家族の利害の狭間に立つ。病識がなくても本人の意思を尊重し、あなたを中心に考えていると伝え続ける。家族の側に立つ姿勢は誤り。【元の形式】誤っているものを選ぶ設問。", "flag": 0, "chn": 3, "id": 152}, {"t": "mc", "src": "text", "lec": null, "ch": ["エスシタロプラム", "アミトリプチリン", "ミアンセリン", "トラゾドン", "スルピリド"], "ref": "Q1 p.53-54", "sub": "抗うつ薬", "q": "うつ病の薬物治療の第一選択として適切なのはどれか。", "a": 1, "ex": "副作用の少ないSSRI・SNRI・ミルタザピンが第一選択。アミトリプチリンは三環系、ミアンセリンは四環系、トラゾドン・スルピリドはその他に分類され、第一選択ではない。【元の形式】2つ選択（エスシタロプラムとミルタザピン）。", "flag": 0, "chn": 4, "id": 153}, {"t": "mc", "src": "text", "lec": null, "ch": ["タンドスピロン", "ラメルテオン", "スボレキサント", "レンボレキサント", "フルニトラゼパム"], "ref": "Q2 p.54", "sub": "睡眠薬・抗不安薬", "q": "ベンゾジアゼピン系の睡眠薬はどれか。", "a": 5, "ex": "フルニトラゼパム（サイレース）はベンゾジアゼピン系。タンドスピロンはセロトニン5-HT1A受容体部分作動薬、ラメルテオンはメラトニン受容体作動薬、スボレキサント・レンボレキサントはオレキシン受容体拮抗薬。【元の形式】ベンゾジアゼピン系を2つ選択（ロラゼパムとフルニトラゼパム）。", "flag": 0, "chn": 4, "id": 154}, {"t": "mc", "src": "text", "lec": null, "ch": ["ハロペリドール", "リスペリドン", "オランザピン", "アリピプラゾール", "クエチアピン"], "ref": "Q3 p.54", "sub": "抗精神病薬", "q": "第2世代（非定型）抗精神病薬でないものはどれか。", "a": 1, "ex": "ハロペリドールは代表的な第1世代（定型）抗精神病薬。非定型は錐体外路症状が少なく、新規の開始では優先される。", "flag": 0, "chn": 4, "id": 155}, {"t": "mc", "src": "text", "lec": null, "ch": ["転移や抵抗の解釈を中心に進める", "自動思考への気づきを中心に進める", "家族の文化にジョイニングして進める", "夢の内容の分析を中心に進める", "無意識の葛藤には深く立ち入らない"], "ref": "Q1 p.65", "sub": "支持的心理療法", "q": "支持的心理療法の原則として適切なのはどれか。", "a": 5, "ex": "支持的心理療法では、無意識の葛藤やパーソナリティの問題には深く立ち入らないのが原則。転移・抵抗の解釈は精神分析的心理療法、自動思考への気づきは認知行動療法、ジョイニングは家族療法の特徴。【元の形式】不適切なものを選ぶ設問。", "flag": 0, "chn": 5, "id": 156}, {"t": "mc", "src": "text", "lec": null, "ch": ["治療構造は特に意識しなくてよい", "地域で活動する時も環境は考慮しない", "セラピストの態度や身なりも重要な要素である", "病態水準によって関わりを変える必要はない", "症状は個人の問題としてのみ検討する"], "ref": "Q2 p.65", "sub": "心理職の役割", "q": "心理療法の構成要素についての記述として適切なのはどれか。", "a": 3, "ex": "セラピストの態度や身なりも心理療法を構成する重要な要素。治療構造を意識し、コミュニティで活動する際は環境も考え、病態水準に応じた工夫をし、症状は所属集団の視点からも検討する。【元の形式】不適切なものを選ぶ設問。", "flag": 0, "chn": 5, "id": 157}, {"t": "mc", "src": "text", "lec": null, "ch": ["情報は担当者が一人で管理する", "チームでの情報共有について患者に伝える", "自職種の記録は他職種に見せない", "他職種の役割の理解は不要である", "自職種の振る舞いを点検する必要はない"], "ref": "Q1 p.80", "sub": "多職種協働", "q": "多職種協働で支援する際の対応として適切なのはどれか。", "a": 2, "ex": "チーム連携があっても、どの職種が関わりどう連絡し合うかは、本人が同意・納得していることが原則で、伝えるべき。伝えないと本人不在のまま支援が進み、主体的に治療に関わる姿勢も奪われる。【元の形式】誤っているものを選ぶ設問。", "flag": 0, "chn": 6, "id": 158}, {"t": "mc", "src": "text", "lec": null, "ch": ["患者が判断できるよう十分な情報を提供する", "患者に害を及ぼさず苦痛を少なくする", "すべての患者に平等な態度で接する", "患者に最善の努力で利益をもたらす", "患者に正義の気持ちをもってもらう"], "ref": "Q2 p.80-81", "sub": "医療倫理", "q": "医療倫理の「正義原則」の説明として正しいのはどれか。", "a": 3, "ex": "正義原則は、医療者側がすべての患者に正義感をもち、平等な態度で接することを求めるもの。患者に正義の気持ちを求めるものではない。情報提供は自律尊重原則、害を避けるのは無危害原則、利益をもたらすのは善行原則。", "flag": 0, "chn": 6, "id": 159}, {"t": "mc", "src": "text", "lec": null, "ch": ["身体的苦痛", "精神的苦痛", "社会的苦痛", "スピリチュアルな苦痛", "家族関係に由来する苦痛"], "ref": "Q3 p.81", "sub": "全人的苦痛", "q": "がん患者の全人的苦痛のうち、生きる意味の喪失や死と向き合う課題にあたるのはどれか。", "a": 4, "ex": "全人的苦痛は身体的・社会的・精神的・スピリチュアルの4つ。生きる意味がわからない、なぜ死ななくてはいけないのか、など生きる意味を問う根源的な苦痛がスピリチュアルな苦痛。", "flag": 0, "chn": 6, "id": 160}, {"t": "mc", "src": "text", "lec": null, "ch": ["感情鈍麻", "抑うつ気分", "高揚気分", "貧困妄想", "観念奔逸"], "ref": "Q1 p.95", "sub": "症状", "q": "統合失調症でみられる症状はどれか。", "a": 1, "ex": "感情鈍麻（情動表出の減少）は陰性症状の一つ。抑うつ気分と貧困妄想はうつ病、高揚気分と観念奔逸は双極症の躁エピソードでみられる。【元の形式】2つ選択（妄想気分と感情鈍麻）。", "flag": 0, "chn": 7, "id": 161}, {"t": "mc", "src": "text", "lec": null, "ch": ["多弁", "自尊心の肥大", "リスクの高い活動への熱中", "行動のまとまりの著しい欠如", "罪責感と無価値観"], "ref": "Q2 p.95-96", "sub": "症状", "q": "統合失調症の症状として正しいのはどれか。", "a": 4, "ex": "行動の著しいまとまりのなさは、カタトニア性の行動を含む行動症状群で、統合失調症でみられる。多弁・自尊心の肥大・リスクの高い活動への熱中は双極症の躁エピソード、罪責感と無価値観はうつ病・双極症の抑うつエピソードの症状。【元の形式】2つ選択（行動の著しい統合不全と情動表出の減少）。", "flag": 0, "chn": 7, "id": 162}, {"t": "mc", "src": "text", "lec": null, "ch": ["薬物療法", "認知行動療法", "急性期のオープン・ダイアローグ", "持効性注射剤による再発予防", "精神分析療法"], "ref": "Q3 p.95-96", "sub": "治療", "q": "統合失調症の治療のうち、効果が実証されていないのはどれか。", "a": 5, "ex": "薬物療法・認知行動療法・オープン・ダイアローグ（急性期）・持効性注射剤（再発予防）は有効性が実証されている。精神分析療法は、教科書では現在、統合失調症患者に対して禁忌とされている。※「禁忌」は教科書の記載で、授業では扱っていない内容。", "flag": 0, "chn": 7, "id": 163}, {"t": "mc", "src": "text", "lec": null, "ch": ["精神運動制止", "観念奔逸", "不眠", "食欲低下", "倦怠感"], "ref": "Q1 p.112-113", "sub": "症状", "q": "うつ状態でみられない症状はどれか。", "a": 2, "ex": "観念奔逸は、観念が次々と現れて思考が脇道にそれ、目的観念を失う状態で、躁状態の患者にみられる。", "flag": 0, "chn": 8, "id": 164}, {"t": "mc", "src": "text", "lec": null, "ch": ["バルプロ酸ナトリウム", "炭酸リチウム", "フェニトイン", "エスシタロプラム", "アミトリプチリン"], "ref": "Q2 p.112-113", "sub": "薬物療法", "q": "うつ病の治療（増強療法を含む）に用いられない薬剤はどれか。", "a": 3, "ex": "抗うつ薬は忍容性の高いSSRIなどが主流で、三環系も伝統的に使われてきた。バルプロ酸ナトリウムやカルバマゼピンなどの抗てんかん薬は、気分安定薬として躁エピソードの治療や抗うつ薬の増強にも用いられる。炭酸リチウムも躁エピソードの治療と増強に使われる。フェニトインは抗てんかん薬の代表だが、この目的では用いない。【元の形式】誤っているものを選ぶ設問。", "flag": 0, "chn": 8, "id": 165}, {"t": "mc", "src": "text", "lec": null, "ch": ["若年での発症", "重症度が高いこと", "パーソナリティ症の併存", "女性であること", "アルコールなどの物質依存"], "ref": "Q3 p.112-113", "sub": "予後", "q": "うつ病の予後不良因子に含まれないものはどれか。", "a": 4, "ex": "予後不良因子は、若年発症、抑うつエピソードの長さ、重症度、精神病症状や不安症状の併存、パーソナリティ症の併存、物質依存の併存など。治療反応性や経過に性差は認められていない。", "flag": 0, "chn": 8, "id": 166}, {"t": "mc", "src": "text", "lec": null, "ch": ["うつ病が併存することはほとんどない", "強迫性パーソナリティ症とほぼ同義である", "親の育て方が主な原因である", "自我違和感の有無で常同行動と区別できる", "強迫行為は駆り立てられる過剰な反復行動"], "ref": "Q1", "sub": "強迫症", "q": "強迫症について正しいのはどれか。", "a": 5, "ex": "強迫観念は繰り返し生じる思考、強迫行為はそれに駆り立てられて行う過剰な反復行動。強迫症の約40％にうつ病が併存するといわれる。強迫性パーソナリティ症は強迫観念・強迫行為がみられず別物。原因は脳機能や神経伝達物質などの複合的要因。強迫行為は一般に自我違和感を伴うが、乏しいものもあり、それだけでは自閉スペクトラム症の常同行為と区別できない。", "flag": 0, "chn": 9, "id": 167}, {"t": "mc", "src": "text", "lec": null, "ch": ["全ての強迫症患者に必ず実施する", "薬物療法より先に必ず実施する", "最も苦手な対象から曝露を始めるのが通常", "不安場面に直面し強迫行為をしないで耐える", "患者が納得していなくても積極的に行う"], "ref": "Q2", "sub": "認知行動療法", "q": "強迫症に対する曝露反応妨害法の説明として正しいのはどれか。", "a": 4, "ex": "曝露反応妨害法は、回避していた不安刺激場面に直面（曝露）し、強迫行為をあえてしないで我慢する（反応妨害）ことを繰り返す方法。重症で不合理感に乏しい場合や強迫性緩慢では適応外のこともあり、抑うつ・不安が強い場合は薬物療法を先に行うこともある。患者の洞察や理解がなければ効果が上がらず、通常は取り組みやすいものから段階的に曝露する。", "flag": 0, "chn": 9, "id": 168}, {"t": "mc", "src": "text", "lec": null, "ch": ["男性に多い疾患である", "単回の出来事では診断しない", "適応反応症との併存が多い", "薬物療法がトラウマ焦点化心理療法より有効", "一定の割合で自然に回復する人がいる"], "ref": "Q1 p.144", "sub": "PTSD", "q": "心的外傷後ストレス症（PTSD）について正しいのはどれか。", "a": 5, "ex": "女性に多い。単回でも複数回でも、心的外傷的出来事を体験していることが診断基準の1つ。PTSDの診断基準を満たせば適応反応症の診断はつかないため併存しない。一定の割合で自然治癒がある。薬物療法よりトラウマ焦点化心理療法（PE、CPT、EMDRなど）の効果が高いとされる。", "flag": 0, "chn": 10, "id": 169}, {"t": "mc", "src": "text", "lec": null, "ch": ["自殺の危険性は低い", "薬物療法が第一選択である", "身体疾患に併存することが多い", "ストレス因との因果関係のみで説明できる", "ストレス耐性が高ければ発症しない"], "ref": "Q2 p.144-145", "sub": "適応反応症", "q": "適応反応症について正しいのはどれか。", "a": 3, "ex": "適応反応症は自殺企図・自殺の危険増大と関連し、治療は心理療法が主体。がんの診断などで身体疾患に併存する。ストレス因だけでなく個人的要因や緩衝要因など複数の要因が関わり、ストレス耐性が高くても非常に衝撃的なストレス因では不調をきたしうる（ストレス-脆弱性モデル）。", "flag": 0, "chn": 10, "id": 170}, {"t": "mc", "src": "text", "lec": null, "ch": ["できるだけ早く外傷体験を取り上げる", "健忘があれば自殺の危険性は低い", "てんかん発作との鑑別は必要ない", "関係が成立する前は外傷体験に触れない", "多くの人は健忘に深刻さを強く感じる"], "ref": "Q3 p.144-145", "sub": "解離症群", "q": "解離症群への対応として適切なのはどれか。", "a": 4, "ex": "治療関係が成立していない段階で心的外傷的出来事を取り上げることは適切でない。解離症群は自殺の危険性が高く、てんかん様の発作では心因性非てんかん発作（PNES）との鑑別が必要。幼少期の被虐待体験との関連が高く、多くの人は健忘に深刻さを感じていない。【元の形式】誤っているものを選ぶ設問。", "flag": 0, "chn": 10, "id": 171}, {"t": "mc", "src": "text", "lec": null, "ch": ["知的発達症", "注意欠如多動症", "自閉スペクトラム症", "限局性学習症", "不安症"], "ref": "Q1 p.161", "sub": "分類", "q": "神経発達症群に分類されないものはどれか。", "a": 5, "ex": "神経発達症群は幼少期から症状がある疾患の一群で、DSM-5-TRでは自閉スペクトラム症、ADHD、限局性学習症、知的発達症などが含まれる。不安症は不安症状が主体の精神疾患で、神経発達症群とは異なる。", "flag": 0, "chn": 11, "id": 172}, {"t": "mc", "src": "text", "lec": null, "ch": ["血液検査の結果の確認", "行動観察と生育歴の聴取", "遺伝子検査の結果の確認", "脳画像検査の所見の確認", "心理検査の結果のみで判断"], "ref": "Q2 p.161", "sub": "診断", "q": "神経発達症群の診断の基本として正しいのはどれか。", "a": 2, "ex": "診断の基本は、行動観察と、本人や養育者からの生育歴の聞き取り。脳画像・遺伝子・血液検査は現時点では研究段階で、診断には使えない。心理検査は診断の補助材料で、結果のみで診断するのは危険。【元の形式】診断に必須のものを選ぶ設問。", "flag": 0, "chn": 11, "id": 173}, {"t": "mc", "src": "text", "lec": null, "ch": ["自分の意志で止められない状態を身体依存という", "急に止めた時の不快な症状を渇望という", "同じ量でも効果が出にくくなることを耐性という", "不快症状を避けて薬を求める状態を精神依存という", "依存性の薬物はすべて身体依存が強い"], "ref": "Q1 p.177", "sub": "依存の用語", "q": "薬物依存症の用語の説明として正しいのはどれか。", "a": 3, "ex": "自分の意志では止められない状態は精神依存、不快症状を避けるために薬を求める状態は身体依存、急に止めて生じる不快な症状は離脱症状（渇望は摂取欲求）。覚醒剤・大麻・コカイン・幻覚剤では身体依存はほとんどみられない。", "flag": 0, "chn": 12, "id": 174}, {"t": "mc", "src": "text", "lec": null, "ch": ["アルコールは主に腎臓で代謝される", "家族が酒を買ってくることを断酒支援という", "コルサコフ症候群では記銘力が保たれる", "振戦せん妄にベンゾジアゼピン系薬を用いる", "抗酒薬は離脱せん妄の治療薬である"], "ref": "Q2 p.177", "sub": "アルコール", "q": "アルコール依存症について正しいのはどれか。", "a": 4, "ex": "アルコールは肝臓で代謝される。家族が暴力を避けようとして酒を買うなどの対応は、イネイブリング（結果的に飲酒を助長）と呼ばれる。コルサコフ症候群では記銘障害・失見当識・作話が遷延する。振戦せん妄などの離脱症状の改善にベンゾジアゼピン系薬を投与することがあり、置換療法という。抗酒薬は断酒維持のために使う。【元の形式】誤っているものを選ぶ設問。", "flag": 0, "chn": 12, "id": 175}, {"t": "mc", "src": "text", "lec": null, "ch": ["ゲームができない環境を作ることが基本", "節度あるゲームや減ゲームを目指す", "ゲームを完全にやめさせる方針を取る", "本人との対話なしに利用規則を決める", "家族への let store = load();
function rec(id, ok){
  const r = store.r[id] || {c:0, w:0};
  if(ok) r.c++; else r.w++;
  r.last = ok ? 'c' : 'w';
  store.r[id] = r; save();
}

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pool(lec, chn){
  return ITEMS.filter(it =>
    (lec == null || it.lec === lec) &&
    (chn == null || it.chn === chn) &&
    (filt.type === 'all' || it.type === filt.type || it.t === filt.type) &&
    (filt.src === 'all' || it.src === filt.src));
}
function lab(it){ return it.src==='text' ? `教科書 ${it.chn}章｜${DATA.chapters[it.chn]}` : `第${it.lec}回｜${DATA.topics[it.lec]}`; }
const TORDER = {ox:0, mc:1, essay:2};
function ordered(list){ return list.slice().sort((a,b) => TORDER[a.t]-TORDER[b.t] || a.id-b.id); }
function toast(msg){
  const d = document.createElement('div'); d.className='toast'; d.textContent=msg; document.body.appendChild(d);

}

  const main = it.src==='text'
    ? `<span class="tag">教科書 ${it.chn}章｜${esc(DATA.chapters[it.chn])}</span><span class="tag">${esc(it.ref)}</span><span class="tag">${esc(it.sub)}</span>`
    : `<span class="tag">${esc(lab(it))}</span><span class="tag">${TYPE[it.t]}</span><span class="tag">${SRC[it.src]}</span>`;
  return `<div class="tags">${main}${needsReview(it)?'<span class="tag rv">要見直し</span>':''}</div>`;
}
function renderQ(){
  const it = S.list[S.i], total = S.list.length;
  let body = '';
  if(it.t === 'essay'){
    body = renderEssay(it);
  } else {
    const isOx = it.t === 'ox';
    const ch = it.ch.map((c, k) => {
      const n = k + 1; let cls = '';
      if(S.answered){ if(n === it.a) cls = 'right'; else if(n === S.sel) cls = 'wrong'; }
      return `<button class="choice ${cls}" data-c="${n}" ${S.answered?'disabled':''}><span class="n">${n}</span><span>${esc(c)}</span></button>`;
    }).join('');
    body = `<p class="q">${esc(it.q)}</p><div class="choices ${isOx?'ox':''}">${ch}</div>`;
    if(S.answered){
      const ok = S.sel === it.a;
      body += `<div class="fb ${ok?'ok':'ng'}" id="fb"><p class="v">${ok?'正解':'不正解'}${ok?'':`（正解：${isOx?esc(it.ch[it.a-1]):it.a}）`}</p><p>${esc(it.ex)}</p></div>
        <button class="next" data-next>${S.i+1<total?'次の問題へ':'結果を見る'}</button>`;
    }
  }
  app.innerHTML = `
    <div class="qbar"><button class="back" id="quit">← 戻る</button>
      <div class="prog"><div class="t"><span>${esc(S.title)}</span><span>${S.i+1} / ${total}</span></div>
      <span class="bar"><i style="width:${(S.i + (S.answered||S.graded!==null?1:0))/total*100}%"></i></span></div></div>
    <article class="qcard">${tagsFor(it)}${body}</article>`;
  const fb = document.getElementById('fb') || document.getElementById('essay-result');
  if(fb) fb.scrollIntoView({block:'nearest'});
}
function renderEssay(it){
  let h = `<p class="q">${esc(it.q)}</p>`;
  if(!S.revealed){
    h += `<textarea id="ans" placeholder="ここに自分の言葉で書いてみましょう（保存はされません）"></textarea>
      <p class="hint">書いてから模範解答を開くと、キーワードの抜けに気づきやすくなります。</p>
      <button class="reveal" data-reveal>模範解答とキーワードを見る</button>`;
  } else {
    const kws = it.kw.split('／').map(k => `<span class="kw">${esc(k)}</span>`).join('');
    const g = S.graded;
    h += `<div id="essay-result">
      <div class="blk"><h3>キーワード（これが入っていれば得点になりやすい）</h3><div class="kws">${kws}</div></div>
      <div class="blk"><h3>模範解答（1例）</h3><div class="model">${esc(it.model)}</div></div>
      ${it.pt?`<div class="blk"><h3>${it.src==='form'?'先生の解説のポイント':'出題の狙い'}</h3><div>${esc(it.pt)}</div></div>`:''}
      ${it.mine?`<div class="blk"><h3>さやさんの解答（フォーム提出時）</h3><div class="mine">${esc(it.mine)}</div></div>`:''}
      <div class="blk"><h3>自己採点</h3>
      <div class="grade">
        <button data-g="2" aria-pressed="${g===2}">○<small>書けた</small></button>
        <button data-g="1" aria-pressed="${g===1}">△<small>一部</small></button>
        <button data-g="0" aria-pressed="${g===0}">×<small>書けない</small></button>
      </div></div>
      ${g!==null?`<button class="next" data-next>${S.i+1<S.list.length?'次の問題へ':'結果を見る'}</button>`:''}</div>`;
  }
  return h;
}
function choose(n){
  if(S.answered) return;
  const it = S.list[S.i]; S.sel = n; S.answered = true;
  const ok = n === it.a; rec(it.id, ok); S.scored++;
  if(ok) S.ok++; else S.wrong.push(it);
  renderQ();
}
function grade(g){
  const it = S.list[S.i];
  if(S.graded === null){ S.essayDone++; if(g===2) S.essayOk++; else S.wrong.push(it); }
  else {
    // 採点のやり直し：前回の集計を取り消す
    if(S.graded === 2) S.essayOk--; else S.wrong = S.wrong.filter(x => x.id !== it.id);
    if(g === 2) S.essayOk++; else S.wrong.push(it);
  }
  S.graded = g; rec(it.id, g === 2); renderQ();
}
function next(){
  if(S.i + 1 >= S.list.length){ return renderResult(); }
  S.i++; S.sel = null; S.answered = false; S.revealed = false; S.graded = null; renderQ(); window.scrollTo(0,0);
}
function renderResult(){
  const sc = S.scored, w = S.wrong;
  const parts = [];
  if(sc) parts.push(`<div class="big">${S.ok}<small> / ${sc}</small></div><p>○×・5択の正解数（${Math.round(S.ok/sc*100)}%）</p>`);
  if(S.essayDone) parts.push(`<p>記述の自己採点：○ ${S.essayOk} / ${S.essayDone}</p>`);
  const wl = w.map(it => {
    const ans = it.t==='essay' ? `キーワード：${esc(it.kw)}` : `正解：${it.t==='ox'?esc(it.ch[it.a-1]):it.a+'．'+esc(it.ch[it.a-1])}　${esc(it.ex)}`;
    return `<li><details><summary>${esc(lab(it).replace('｜',' ｜ ').replace(' ｜ ','｜'))}：${esc(it.q)}</summary><p class="ans">${ans}</p></details></li>`;
  }).join('');
  app.innerHTML = `<h1>${esc(S.title)}｜結果</h1>
    <div class="score">${parts.join('')}</div>
    <div class="btns">
      ${w.length?`<button class="primary" id="retry">間違えた${w.length}問だけやり直す</button>`:''}
      <button class="ghost" id="tomenu">メニューへ戻る</button></div>
    ${w.length?`<h2 class="sec">見直す問題</h2><ul class="wlist">${wl}</ul>`:'<p class="sub" style="text-align:center">全問クリアです。</p>'}`;
  window.scrollTo(0,0);
}

/* ---------- イベント ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.f){ filt[t.dataset.f] = t.dataset.v; return renderMenu(); }
  if(t.dataset.lec){ const n=+t.dataset.lec; return startQuiz(ordered(pool(n)), `第${n}回 ${DATA.topics[n]}`); }
  if(t.dataset.chn){ const n=+t.dataset.chn; return startQuiz(ordered(pool(null,n)), `教科書 ${n}章 ${DATA.chapters[n]}`); }
  if(t.dataset.bulk){
    const b = t.dataset.bulk, all = pool(null);
    if(b==='all') return startQuiz(shuffleKeepOrder(all), '全問');
    if(b==='rand') return startQuiz(shuffle(all).slice(0,10), 'ランダム10問');
    if(b==='review') return startQuiz(shuffle(all.filter(needsReview)), '要見直し');
  }
  if(t.id==='reset'){ if(confirm('これまでの正誤の記録をすべて消します。よろしいですか？')){ store={r:{}}; save(); renderMenu(); toast('記録をリセットしました'); } return; }
  if(t.id==='quit'){ if(S && (S.scored||S.essayDone) && !confirm('途中で終了します。ここまでの記録は保存されています。')) return; return renderMenu(); }
  if(t.id==='tomenu') return renderMenu();
  if(t.id==='retry'){ const list = shuffle(S.wrong); return startQuiz(list, '間違えた問題'); }
  if(t.dataset.c) return choose(+t.dataset.c);
  if(t.dataset.reveal !== undefined){ S.revealed = true; return renderQ(); }
  if(t.dataset.g !== undefined) return grade(+t.dataset.g);
  if(t.dataset.next !== undefined) return next();
});
function shuffleKeepOrder(a){ return ordered(a); }
document.addEventListener('keydown', e => {
  if(!S || e.target.tagName==='TEXTAREA' || e.metaKey || e.ctrlKey) return;
  const it = S.list[S.i]; if(!it) return;
  if(/^[1-5]$/.test(e.key) && it.t!=='essay'){ if(+e.key <= it.ch.length) choose(+e.key); }
  else if(e.key==='Enter'){
    const nb = document.querySelector('[data-next]'); if(nb && document.activeElement!==nb) nb.click();
  }
});
renderMenu();
</script>
</body>
</html>
