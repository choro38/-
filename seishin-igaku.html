    <h2 class="sec">回・単元から覚える<small>上の絞り込みが反映されます</small></h2>
    <ol class="lectures">${rows}</ol>
    <h2 class="sec">まとめて覚える</h2>
    <div class="bulk">
      <button data-kbulk="all" ${all.length?'':'disabled'}>全部<small>${all.length}セット</small></button>
      <button data-kbulk="rand" ${all.length?'':'disabled'}>ランダム<small>${Math.min(10,all.length)}セット</small></button>
      <button class="review" data-kbulk="review" ${rv.length?'':'disabled'}>要見直し<small>${rv.length}セット</small></button>
    </div>
    <p class="help">文中の<b style="color:var(--accent)">空欄</b>に入るキーワードを思い出してから、空欄をタップして確かめます。最後に<b>○覚えた／△あやふや／×覚えていない</b>で自己採点します。<b>要見直し</b>は、△・×にした、または元の問題に確認フラグがあるセットです。○にすると外れます。</p>
    <div class="foot"><span>記録はこの端末のブラウザに保存されます</span><button class="link" id="reset">記録をリセット</button></div>`;
}

/* ---------- クイズ ---------- */
function startQuiz(list, title){
  if(!list.length){ toast('該当する問題がありません'); return; }
  S = {list, title, i:0, ok:0, wrong:[], sel:null, answered:false, revealed:false, graded:null, essayDone:0, essayOk:0, scored:0};
  renderQ();
}
function tagsFor(it){
  const main = it.src==='drug'
    ? `<span class="tag">${esc(lab(it))}</span><span class="tag">${TYPE[it.t]}</span>${it.top?'<span class="tag rv">★ 試験で特に狙われやすい</span>':''}`
    : it.src==='text'
    ? `<span class="tag">教科書 ${it.chn}章｜${esc(DATA.chapters[it.chn])}</span><span class="tag">${esc(it.ref)}</span><span class="tag">${esc(it.sub)}</span>`
    : `<span class="tag">${esc(lab(it))}</span><span class="tag">${TYPE[it.t]}</span><span class="tag">${SRC[it.src]}</span>`;
  const sup = /授業資料外|過去問の補足/.test(it.ex || '') ? '<span class="tag">過去問の補足あり</span>' : '';
  return `<div class="tags">${main}${sup}${needsReview(it)?'<span class="tag rv">要見直し</span>':''}</div>`;
}
function renderQ(){
  const it = S.list[S.i], total = S.list.length;
  let body = '';
  if(it.t === 'essay'){
    body = renderEssay(it);
  } else {
    const isOx = it.t === 'ox';
    const ch = it.ch.map((c, k) => {
      const n = k + 1; let cls = '';
      if(S.answered){ if(n === it.a) cls = 'right'; else if(n === S.sel) cls = 'wrong'; }
      return `<button class="choice ${cls}" data-c="${n}" ${S.answered?'disabled':''}><span class="n">${n}</span><span>${esc(c)}</span></button>`;
    }).join('');
    body = `<p class="q">${esc(it.q)}</p><div class="choices ${isOx?'ox':''}">${ch}</div>`;
    if(S.answered){
      const ok = S.sel === it.a;
      body += `<div class="fb ${ok?'ok':'ng'}" id="fb"><p class="v">${ok?'正解':'不正解'}${ok?'':`（正解：${isOx?esc(it.ch[it.a-1]):it.a}）`}</p><p>${esc(it.ex)}</p></div>
        <button class="next" data-next>${S.i+1<total?'次の問題へ':'結果を見る'}</button>`;
    }
  }
  app.innerHTML = `
    <div class="qbar"><button class="back" id="quit">← 戻る</button>
      <div class="prog"><div class="t"><span>${esc(S.title)}</span><span>${S.i+1} / ${total}</span></div>
      <span class="bar"><i style="width:${(S.i + (S.answered||S.graded!==null?1:0))/total*100}%"></i></span></div></div>
    <article class="qcard">${tagsFor(it)}${body}</article>`;
  const fb = document.getElementById('fb') || document.getElementById('essay-result');
  if(fb) fb.scrollIntoView({block:'nearest'});
}
function renderEssay(it){
  let h = `<p class="q">${esc(it.q)}</p>`;
  if(!S.revealed){
    h += `<textarea id="ans" placeholder="ここに自分の言葉で書いてみましょう（保存はされません）"></textarea>
      <p class="hint">書いてから模範解答を開くと、キーワードの抜けに気づきやすくなります。</p>
      <button class="reveal" data-reveal>模範解答とキーワードを見る</button>`;
  } else {
    const kws = it.kw.split('／').map(k => `<span class="kw">${esc(k)}</span>`).join('');
    const g = S.graded;
    h += `<div id="essay-result">
      <div class="blk"><h3>キーワード（これが入っていれば得点になりやすい）</h3><div class="kws">${kws}</div></div>
      <div class="blk"><h3>模範解答（1例）</h3><div class="model">${esc(it.model)}</div></div>
      ${it.pt?`<div class="blk"><h3>${it.src==='form'?'先生の解説のポイント':'出題の狙い'}</h3><div>${esc(it.pt)}</div></div>`:''}
      ${it.mine?`<div class="blk"><h3>さやさんの解答（フォーム提出時）</h3><div class="mine">${esc(it.mine)}</div></div>`:''}
      <div class="blk"><h3>自己採点</h3>
      <div class="grade">
        <button data-g="2" aria-pressed="${g===2}">○<small>書けた</small></button>
        <button data-g="1" aria-pressed="${g===1}">△<small>一部</small></button>
        <button data-g="0" aria-pressed="${g===0}">×<small>書けない</small></button>
      </div></div>
      ${g!==null?`<button class="next" data-next>${S.i+1<S.list.length?'次の問題へ':'結果を見る'}</button>`:''}</div>`;
  }
  return h;
}
function startK(list, title){
  if(!list.length){ toast('該当するセットがありません'); return; }
  S = {kw:true, list, title, i:0, shown:{}, graded:null, g:[0,0,0], wrong:[]};
  renderK();
}
function kLine(line, c, offset){
  let idx = offset, out = '';
  const re = /\{\{(.+?)\}\}/g; let last = 0, m;
  while((m = re.exec(line))){
    out += esc(line.slice(last, m.index));
    const on = S.shown[idx];
    out += on
      ? `<button class="blank on" disabled>${esc(m[1])}</button>`
      : `<button class="blank" data-b="${idx}" aria-label="空欄${idx+1}（タップで答えを表示）" style="min-width:${Math.min(8, Math.max(3, m[1].length*0.9))}em">&nbsp;</button>`;
    idx++; last = re.lastIndex;
  }
  out += esc(line.slice(last));
  return {html: out, idx};
}
function renderK(){
  const c = S.list[S.i], total = S.list.length, nb = nBlanks(c);
  let off = 0, lines = '';
  for(const ln of c.s){ const r = kLine(ln, c, off); lines += `<p class="kline">${r.html}</p>`; off = r.idx; }
  const shownN = Object.keys(S.shown).length, all = shownN >= nb;
  const g = S.graded;
  app.innerHTML = `
    <div class="qbar"><button class="back" id="quit">← 戻る</button>
      <div class="prog"><div class="t"><span>${esc(S.title)}</span><span>${S.i+1} / ${total}</span></div>
      <span class="bar"><i style="width:${(S.i + (g!==null?1:0))/total*100}%"></i></span></div></div>
    <article class="qcard">
      <div class="tags">${c.it.top?'<span class="tag rv">★ 試験で特に狙われやすい</span>':''}${needsReviewK(c)?'<span class="tag rv">要見直し</span>':''}</div>
      <h2 class="kh">${esc(c.h)}</h2>
      <p class="kmeta">${kmeta(c)}｜空欄 ${shownN} / ${nb} 確認済み</p>
      ${lines}
      ${all ? '' : '<button class="allbtn" data-kall>すべて表示</button>'}
      ${all ? `<div class="kgrade">
        <button class="g2" data-kg="2" aria-pressed="${g===2}">○<small>覚えた</small></button>
        <button class="g1" data-kg="1" aria-pressed="${g===1}">△<small>あやふや</small></button>
        <button class="g0" data-kg="0" aria-pressed="${g===0}">×<small>覚えていない</small></button></div>` : ''}
      ${g!==null ? `<button class="next" data-knext>${S.i+1<total?'次のセットへ':'結果を見る'}</button>` : ''}
    </article>`;
}
function kGrade(g){
  const c = S.list[S.i];
  if(S.graded !== null){ S.g[2 - S.graded]--; S.wrong = S.wrong.filter(x => x.id !== c.id); }
  S.g[2 - g]++; if(g !== 2) S.wrong.push(c);
  S.graded = g; krec(c.id, g); renderK();
}
function kNext(){
  if(S.i + 1 >= S.list.length) return renderKResult();
  S.i++; S.shown = {}; S.graded = null; renderK(); window.scrollTo(0,0);
}
function renderKResult(){
  const w = S.wrong, n = S.list.length;
  const wl = w.map(c => `<li><details><summary>${esc(lab(c.it))}：${esc(c.h)}</summary><p class="ans">${c.s.map(l => esc(l).replace(/\{\{(.+?)\}\}/g,'<b>$1</b>')).join('<br>')}</p></details></li>`).join('');
  app.innerHTML = `<h1>${esc(S.title)}｜結果</h1>
    <div class="score"><div class="big">${S.g[0]}<small> / ${n}</small></div><p>○ 覚えた ${S.g[0]}　△ あやふや ${S.g[1]}　× 覚えていない ${S.g[2]}</p></div>
    <div class="btns">
      ${w.length?`<button class="primary" id="kretry">△・×の${w.length}セットだけやり直す</button>`:''}
      <button class="ghost" id="tomenu">メニューへ戻る</button></div>
    ${w.length?`<h2 class="sec">見直すセット<small>太字が空欄だったキーワード</small></h2><ul class="wlist">${wl}</ul>`:'<p class="sub" style="text-align:center">全セット覚えました。</p>'}`;
  window.scrollTo(0,0);
}
function choose(n){
  if(S.answered) return;
  const it = S.list[S.i]; S.sel = n; S.answered = true;
  const ok = n === it.a; rec(it.id, ok); S.scored++;
  if(ok) S.ok++; else S.wrong.push(it);
  renderQ();
}
function grade(g){
  const it = S.list[S.i];
  if(S.graded === null){ S.essayDone++; if(g===2) S.essayOk++; else S.wrong.push(it); }
  else {
    // 採点のやり直し：前回の集計を取り消す
    if(S.graded === 2) S.essayOk--; else S.wrong = S.wrong.filter(x => x.id !== it.id);
    if(g === 2) S.essayOk++; else S.wrong.push(it);
  }
  S.graded = g; rec(it.id, g === 2); renderQ();
}
function next(){
  if(S.i + 1 >= S.list.length){ return renderResult(); }
  S.i++; S.sel = null; S.answered = false; S.revealed = false; S.graded = null; renderQ(); window.scrollTo(0,0);
}
function renderResult(){
  const sc = S.scored, w = S.wrong;
  const parts = [];
  if(sc) parts.push(`<div class="big">${S.ok}<small> / ${sc}</small></div><p>○×・5択の正解数（${Math.round(S.ok/sc*100)}%）</p>`);
  if(S.essayDone) parts.push(`<p>記述の自己採点：○ ${S.essayOk} / ${S.essayDone}</p>`);
  const wl = w.map(it => {
    const ans = it.t==='essay' ? `キーワード：${esc(it.kw)}` : `正解：${it.t==='ox'?esc(it.ch[it.a-1]):it.a+'．'+esc(it.ch[it.a-1])}　${esc(it.ex)}`;
    return `<li><details><summary>${esc(lab(it).replace('｜',' ｜ ').replace(' ｜ ','｜'))}：${esc(it.q)}</summary><p class="ans">${ans}</p></details></li>`;
  }).join('');
  app.innerHTML = `<h1>${esc(S.title)}｜結果</h1>
    <div class="score">${parts.join('')}</div>
    <div class="btns">
      ${w.length?`<button class="primary" id="retry">間違えた${w.length}問だけやり直す</button>`:''}
      <button class="ghost" id="tomenu">メニューへ戻る</button></div>
    ${w.length?`<h2 class="sec">見直す問題</h2><ul class="wlist">${wl}</ul>`:'<p class="sub" style="text-align:center">全問クリアです。</p>'}`;
  window.scrollTo(0,0);
}

/* ---------- イベント ---------- */
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.mode){ mode = t.dataset.mode; if(mode==='kw' && filt.src==='text') filt.src='all'; return renderMenu(); }
  if(t.dataset.f){ filt[t.dataset.f] = t.dataset.v; return renderMenu(); }
  if(t.dataset.s1){
    const b = t.dataset.s1, all = SDRUG.slice();
    if(b==='all') return startS('group', all, '薬→グループ 全部');
    if(b==='rand') return startS('group', shuffle(all).slice(0,10), '薬→グループ ランダム');
    if(b==='review') return startS('group', shuffle(all.filter(d => sRev('g'+d.id))), '薬→グループ 要見直し');
  }
  if(t.dataset.s2){
    const b = t.dataset.s2, all = classCards(null);
    if(b==='all') return startS('class', all, '薬→分類 全部');
    if(b==='rand') return startS('class', shuffle(all).slice(0,10), '薬→分類 ランダム');
    if(b==='review') return startS('class', shuffle(all.filter(d => sRev('c'+d.id))), '薬→分類 要見直し');
    return startS('class', classCards(b), b);
  }
  if(t.dataset.s3){
    const b = t.dataset.s3;
    if(b==='all') return startS('pat', SPAT.slice(), '病態 全部');
    if(b==='rand') return startS('pat', shuffle(SPAT).slice(0,5), '病態 ランダム');
    if(b==='review') return startS('pat', shuffle(SPAT.filter(p => sRev('p'+p.id))), '病態 要見直し');
    const p = SPAT.find(x => String(x.id) === b); return startS('pat', [p], p.n);
  }
  if(t.dataset.sb !== undefined) return sAnswer(t.dataset.sb);
  if(t.dataset.snext !== undefined) return sNext();
  if(t.dataset.pl !== undefined){ S.place[+t.dataset.pl] = t.dataset.pv; return renderSP(); }
  if(t.dataset.unplace !== undefined){ delete S.place[+t.dataset.unplace]; return renderSP(); }
  if(t.dataset.pcheck !== undefined) return pCheck();
  if(t.id==='sretry') return startS(S.sort, shuffle(S.wrong), '間違えた' + (S.sort==='pat'?'病態':'薬'));
  if(t.dataset.dq){
    const b = t.dataset.dq;
    if(b==='all') return startQuiz(DMC.slice(), '禁忌・注意 選択問題');
    if(b==='top') return startQuiz(shuffle(DMC.filter(x => x.top)), '狙われやすい5つ');
    if(b==='rand') return startQuiz(shuffle(DMC).slice(0,10), '禁忌・注意 ランダム');
    if(b==='review') return startQuiz(shuffle(DMC.filter(needsReview)), '禁忌・注意 要見直し');
  }
  if(t.dataset.dgrp){
    const g = t.dataset.dgrp;
    if(g==='all') return startK(dpool(null), '禁忌・注意 全部');
    if(g==='rand') return startK(shuffle(dpool(null)).slice(0,10), '禁忌・注意 ランダム');
    if(g==='review') return startK(shuffle(dpool(null).filter(needsReviewK)), '禁忌・注意 要見直し');
    return startK(dpool(g), g==='top' ? '狙われやすい5つ' : DG[g][1]);
  }
  if(t.dataset.klec){ const n=+t.dataset.klec; return startK(kpool(n), `第${n}回 ${DATA.topics[n]}`); }
  if(t.dataset.kbulk){
    const b=t.dataset.kbulk, all=kpool(null);
    if(b==='all') return startK(all, '全セット');
    if(b==='rand') return startK(shuffle(all).slice(0,10), 'ランダム10セット');
    if(b==='review') return startK(shuffle(all.filter(needsReviewK)), '要見直し');
  }
  if(t.dataset.b !== undefined){ S.shown[+t.dataset.b] = true; return renderK(); }
  if(t.dataset.kall !== undefined){ const c=S.list[S.i]; for(let k=0;k<nBlanks(c);k++) S.shown[k]=true; return renderK(); }
  if(t.dataset.kg !== undefined) return kGrade(+t.dataset.kg);
  if(t.dataset.knext !== undefined) return kNext();
  if(t.id==='kretry') return startK(shuffle(S.wrong), '△・×のセット');
  if(t.dataset.lec){ const n=+t.dataset.lec; return startQuiz(ordered(pool(n)), `第${n}回 ${DATA.topics[n]}`); }
  if(t.dataset.chn){ const n=+t.dataset.chn; return startQuiz(ordered(pool(null,n)), `教科書 ${n}章 ${DATA.chapters[n]}`); }
  if(t.dataset.bulk){
    const b = t.dataset.bulk, all = pool(null);
    if(b==='all') return startQuiz(shuffleKeepOrder(all), '全問');
    if(b==='rand') return startQuiz(shuffle(all).slice(0,10), 'ランダム10問');
    if(b==='review') return startQuiz(shuffle(all.filter(needsReview)), '要見直し');
  }
  if(t.id==='reset'){ if(confirm('これまでの正誤の記録をすべて消します（問題・キーワード・仕分けのすべて）。よろしいですか？')){ store={r:{}, k:{}, s:{}}; save(); renderMenu(); toast('記録をリセットしました'); } return; }
  if(t.id==='quit'){ if(S && (S.scored||S.essayDone||(S.kw&&(S.g[0]+S.g[1]+S.g[2])>0)) && !confirm('途中で終了します。ここまでの記録は保存されています。')) return; return renderMenu(); }
  if(t.id==='tomenu') return renderMenu();
  if(t.id==='retry'){ const list = shuffle(S.wrong); return startQuiz(list, '間違えた問題'); }
  if(t.dataset.c) return choose(+t.dataset.c);
  if(t.dataset.reveal !== undefined){ S.revealed = true; return renderQ(); }
  if(t.dataset.g !== undefined) return grade(+t.dataset.g);
  if(t.dataset.next !== undefined) return next();
});
function shuffleKeepOrder(a){ return ordered(a); }
document.addEventListener('keydown', e => {
  if(!S || S.kw || S.sort || e.target.tagName==='TEXTAREA' || e.metaKey || e.ctrlKey) return;
  const it = S.list[S.i]; if(!it) return;
  if(/^[1-5]$/.test(e.key) && it.t!=='essay'){ if(+e.key <= it.ch.length) choose(+e.key); }
  else if(e.key==='Enter'){
    const nb = document.querySelector('[data-next]'); if(nb && document.activeElement!==nb) nb.click();
  }
});
let dragVal = null;
app.addEventListener('dragstart', e => {
  const el = e.target.closest ? e.target.closest('[data-dragcard],[data-dchip]') : null; if(!el) return;
  dragVal = el.dataset.dchip !== undefined ? {t:'chip', k:+el.dataset.dchip} : {t:'card'};
  if(e.dataTransfer){ e.dataTransfer.setData('text/plain', 'x'); e.dataTransfer.effectAllowed = 'move'; }
});
app.addEventListener('dragover', e => {
  if(dragVal && e.target.closest && e.target.closest('[data-sb],[data-pbox]')) e.preventDefault();
});
app.addEventListener('drop', e => {
  if(!dragVal || !S || !S.sort) { dragVal = null; return; }
  const b = e.target.closest('[data-sb]'), bx = e.target.closest('[data-pbox]');
  if(dragVal.t === 'card' && b && S.sort !== 'pat'){ e.preventDefault(); sAnswer(b.dataset.sb); }
  else if(dragVal.t === 'chip' && bx && S.sort === 'pat' && !S.checked){ e.preventDefault(); S.place[dragVal.k] = bx.dataset.pbox; renderSP(); }
  dragVal = null;
});
app.addEventListener('dragend', () => { dragVal = null; });
renderMenu();
</script>
</body>
