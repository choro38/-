<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病理学 2023年度テスト対策</title>
<style>
  :root {
    --bg: #F5F4F0;
    --surface: #FFFFFF;
    --surface-2: #F0EFEB;
    --border: #D8D6CF;
    --text: #1A1916;
    --text-sub: #6B6860;
    --accent: #2B5EA7;
    --accent-light: #E8EEF8;
    --correct: #2D6A35;
    --correct-bg: #EAF3EB;
    --wrong: #8B1A1A;
    --wrong-bg: #F5E8E8;
    --neutral: #4A4840;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: var(--accent);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-title { color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .03em; }
  .header-sub { color: rgba(255,255,255,.7); font-size: 12px; margin-top: 2px; }
  .progress-wrap { padding: 1rem 1.5rem .5rem; }
  .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-label { font-size: 12px; color: var(--text-sub); }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
  .stats-row { display: flex; gap: 8px; padding: 0 1.5rem .75rem; }
  .stat { font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-sub); }
  .stat.c { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
  .stat.w { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }
  .main { padding: 0 1.25rem 1.5rem; }
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .q-meta { font-size: 11px; color: var(--text-sub); margin-bottom: .75rem; letter-spacing: .04em; }
  .q-text { font-size: 16px; line-height: 1.65; font-weight: 500; }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    cursor: pointer;
    transition: border-color .12s, background .12s;
    text-align: left;
    font-size: 14px;
    line-height: 1.55;
    color: var(--text);
  }
  .choice:hover:not(.disabled) { border-color: var(--accent); background: var(--accent-light); }
  .choice.disabled { cursor: default; }
  .choice.correct { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
  .choice.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--wrong); }
  .choice.revealed { border-color: var(--correct); background: var(--correct-bg); color: var(--correct); }
  .choice-num {
    width: 22px; height: 22px; min-width: 22px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-sub);
  }
  .choice.correct .choice-num { background: var(--correct); border-color: var(--correct); color: #fff; }
  .choice.wrong .choice-num { background: var(--wrong); border-color: var(--wrong); color: #fff; }
  .choice.revealed .choice-num { background: var(--correct); border-color: var(--correct); color: #fff; }
  .explanation {
    margin-top: 1rem;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    font-size: 13px;
    line-height: 1.65;
    color: var(--neutral);
    display: none;
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--text); }
  .nav-row { display: flex; gap: 8px; margin-top: 1rem; }
  .btn {
    flex: 1; padding: 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 14px; cursor: pointer;
    color: var(--text);
    transition: background .12s;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: #234e8a; }
  .btn:disabled { opacity: .35; cursor: default; }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .result-score { font-size: 48px; font-weight: 700; color: var(--accent); }
  .result-label { font-size: 14px; color: var(--text-sub); margin-top: 4px; margin-bottom: 1.25rem; }
  .result-breakdown { display: flex; justify-content: center; gap: 16px; margin-bottom: 1.5rem; }
  .result-item { text-align: center; }
  .result-num { font-size: 22px; font-weight: 600; }
  .result-item-label { font-size: 12px; color: var(--text-sub); }
  .result-item.c .result-num { color: var(--correct); }
  .result-item.w .result-num { color: var(--wrong); }
  .tag {
    display: inline-block;
    font-size: 10px; padding: 2px 8px;
    border-radius: 10px;
    background: #E8EEF8; color: var(--accent);
    border: 1px solid #C5D3EF;
    margin-bottom: 10px;
  }
  .mode-bar { display: flex; gap: 6px; padding: 0 1.25rem .75rem; }
  .mode-btn {
    font-size: 12px; padding: 5px 12px;
    border-radius: 20px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-sub);
    cursor: pointer; transition: all .12s;
  }
  .mode-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .shuffle-icon { margin-right: 4px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title">病理学 2023年度テスト対策</div>
    <div class="header-sub">選択問題 — 4択</div>
  </div>
</div>

<div id="app"></div>

  },
  {

  {

  {

    exp: "<strong>垂直感染</strong>は親から子への感染（経胎盤感染・産道感染・母乳感染）。水平感染は個体間の感染（接触・飛沫・空気感染など）。"

  },
  {

let deck = [], idx = 0, answered = false;
let correct_count = 0, wrong_count = 0;
let wrong_ids = new Set();
let mode = 'all';

function buildDeck() {
  if (mode === 'weak') {
    deck = ALL_Q.filter((_, i) => wrong_ids.has(i));
    if (deck.length === 0) deck = [...ALL_Q];
  } else {
    deck = ALL_Q.map((q, i) => ({ ...q, _orig: i }));
  }
  deck = deck.map((q, i) => {
    const orig = q._orig !== undefined ? q._orig : ALL_Q.indexOf(q);
    return { ...q, _orig: orig };
  });
  idx = 0; answered = false;
}

function shuffleDeck() {
  buildDeck();
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  render();
}

function setMode(m) {
  mode = m;
  buildDeck();
  render();
}

function selectChoice(ci) {
  if (answered) return;
  answered = true;
  const cur = deck[idx];
  const isCorrect = ci === cur.a;
  if (isCorrect) correct_count++;
  else { wrong_count++; wrong_ids.add(cur._orig); }
  render(ci);
}

function next() {
  idx++;
  answered = false;
  render();
}

function renderStats() {
  document.getElementById('s-total').textContent = `全${deck.length}問`;
  document.getElementById('s-correct').textContent = `正解 ${correct_count}`;
  document.getElementById('s-wrong').textContent = `苦手 ${wrong_ids.size}`;
  const pct = deck.length ? Math.round(idx / deck.length * 100) : 0;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${idx} / ${deck.length}`;
  document.querySelectorAll('.mode-btn').forEach((b, i) => {
    b.classList.toggle('active', ['all', 'weak'][i] === mode);
  });
}

function render(selected = null) {
  const app = document.getElementById('app');
  if (deck.length === 0) { buildDeck(); }

  if (idx >= deck.length) {
    const pct = Math.round(correct_count / (correct_count + wrong_count) * 100) || 0;
    app.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-row"><span class="progress-label">完了</span><span class="progress-label" id="prog-label">${deck.length} / ${deck.length}</span></div>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:100%"></div></div>
      </div>
      <div class="stats-row">
        <span class="stat" id="s-total">全${deck.length}問</span>
        <span class="stat c" id="s-correct">正解 ${correct_count}</span>
        <span class="stat w" id="s-wrong">苦手 ${wrong_ids.size}</span>
      </div>
      <div class="mode-bar">
        <button class="mode-btn ${mode==='all'?'active':''}" onclick="setMode('all')">全問</button>
        <button class="mode-btn ${mode==='weak'?'active':''}" onclick="setMode('weak')">苦手のみ</button>
        <button class="mode-btn" onclick="shuffleDeck()">シャッフル</button>
      </div>
      <div class="main">
        <div class="result-card">
          <div class="result-score">${pct}%</div>
          <div class="result-label">正答率</div>
          <div class="result-breakdown">
            <div class="result-item c"><div class="result-num">${correct_count}</div><div class="result-item-label">正解</div></div>
            <div class="result-item w"><div class="result-num">${wrong_count}</div><div class="result-item-label">不正解</div></div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
            <button class="btn" onclick="idx=0;answered=false;correct_count=0;wrong_count=0;render()">最初から</button>
            ${wrong_ids.size>0?`<button class="btn primary" onclick="setMode('weak')">苦手のみ練習</button>`:''}
            <button class="btn" onclick="shuffleDeck()">シャッフル</button>
          </div>
        </div>
      </div>`;
    return;
  }

  const cur = deck[idx];
  const nums = ['①','②','③','④'];
  const choicesHTML = cur.choices.map((c, ci) => {
    let cls = 'choice';
    if (selected !== null) {
      cls += ' disabled';
      if (ci === cur.a) cls += selected === cur.a ? ' correct' : ' revealed';
      else if (ci === selected) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="selectChoice(${ci})">
      <span class="choice-num">${nums[ci]}</span>
      <span>${c}</span>
    </button>`;
  }).join('');

  const expHTML = selected !== null
    ? `<div class="explanation show">📝 <strong>解説：</strong>${cur.exp}</div>`
    : `<div class="explanation"></div>`;

  const navHTML = selected !== null
    ? `<div class="nav-row"><button class="btn primary" onclick="next()">${idx + 1 < deck.length ? '次の問題 →' : '結果を見る →'}</button></div>`
    : '';

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-row"><span class="progress-label">第 ${idx+1} 問</span><span class="progress-label" id="prog-label">${idx} / ${deck.length}</span></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:${Math.round(idx/deck.length*100)}%"></div></div>
    </div>
    <div class="stats-row">
      <span class="stat" id="s-total">全${deck.length}問</span>
      <span class="stat c" id="s-correct">正解 ${correct_count}</span>
      <span class="stat w" id="s-wrong">苦手 ${wrong_ids.size}</span>
    </div>
    <div class="mode-bar">
      <button class="mode-btn ${mode==='all'?'active':''}" onclick="setMode('all')">全問</button>
      <button class="mode-btn ${mode==='weak'?'active':''}" onclick="setMode('weak')">苦手のみ</button>
      <button class="mode-btn" onclick="shuffleDeck()">シャッフル</button>
    </div>
    <div class="main">
      <div class="q-card">
        <div class="q-meta">問題 ${idx+1} / ${deck.length}</div>
        <div class="q-text">${cur.q}</div>
      </div>
      <div class="choices">${choicesHTML}</div>
      ${expHTML}
      ${navHTML}
    </div>`;
}

buildDeck();
render();
</script>
