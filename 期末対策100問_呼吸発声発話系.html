<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期末対策100問｜呼吸・発声・発話系の構造・機能・病態</title>
<style>
  :root {
    --primary: #2c6e9e;
    --correct: #2e7d4f;
    --wrong: #c0392b;
    --bg: #f5f7fb;
    --card: #ffffff;
    --border: #d0dbe8;
    --text: #1a2433;
    --muted: #6b7a8d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header { background: var(--primary); color: #fff; padding: 16px 20px; text-align: center; }
  header h1 { font-size: 1.1rem; font-weight: bold; }
  header p { font-size: 0.78rem; margin-top: 4px; opacity: 0.85; }

  #progress-bar-wrap { background: #dce6f0; height: 6px; }
  #progress-bar { height: 6px; background: #5ab4f0; width: 0%; transition: width 0.3s; }

  #status-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; font-size: 0.78rem; color: var(--muted); background: #eef2f8; border-bottom: 1px solid var(--border); }

  #quiz-wrap { max-width: 720px; margin: 0 auto; padding: 16px; }

  .q-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .q-meta { font-size: 0.72rem; color: var(--muted); margin-bottom: 8px; display: flex; gap: 10px; align-items: center; }
  .q-num { font-size: 0.9rem; font-weight: bold; color: var(--primary); }
  .star { color: #e8a020; font-size: 0.85rem; }
  .q-text { font-size: 0.95rem; line-height: 1.6; margin-bottom: 16px; font-weight: bold; }

  .choices { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .choices li button {
    width: 100%; text-align: left; background: #f0f4fa; border: 1.5px solid #c8d6e8;
    border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; cursor: pointer;
    line-height: 1.5; transition: background 0.15s, border-color 0.15s;
  }
  .choices li button:hover:not(:disabled) { background: #dce9f8; border-color: var(--primary); }
  .choices li button.correct { background: #d4f0de; border-color: var(--correct); color: var(--correct); font-weight: bold; }
  .choices li button.wrong { background: #fde8e6; border-color: var(--wrong); color: var(--wrong); }
  .choices li button:disabled { cursor: default; }

  .explanation { margin-top: 14px; padding: 12px 14px; background: #fffbee; border-left: 4px solid #e8a020; border-radius: 6px; font-size: 0.84rem; line-height: 1.65; display: none; }
  .explanation.show { display: block; }

  .nav-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px; }
  .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: #e2eaf5; color: var(--primary); }

  #result-screen { display: none; max-width: 500px; margin: 40px auto; text-align: center; background: var(--card); border-radius: 14px; padding: 32px 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  #result-screen h2 { font-size: 1.3rem; color: var(--primary); margin-bottom: 12px; }
  .score-big { font-size: 3rem; font-weight: bold; color: var(--primary); }
  .score-sub { font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
  .result-msg { margin-top: 18px; font-size: 0.9rem; line-height: 1.7; color: var(--text); background: #f0f6ff; border-radius: 8px; padding: 14px; }

  #filter-bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: #eef2f8; border-bottom: 1px solid var(--border); }
  .filter-btn { padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border); background: #fff; font-size: 0.78rem; cursor: pointer; color: var(--text); }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  #start-screen { max-width: 500px; margin: 40px auto; background: var(--card); border-radius: 14px; padding: 32px 24px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  #start-screen h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 16px; }
  .start-info { text-align: left; font-size: 0.85rem; line-height: 1.8; margin-bottom: 20px; color: var(--text); }
  .mode-select { margin-bottom: 16px; }
  .mode-select label { display: block; margin-bottom: 6px; font-size: 0.88rem; font-weight: bold; color: var(--muted); }
  select { width: 100%; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.88rem; }
</style>
</head>
<body>

<header>
  <h1>📝 期末対策100問｜呼吸・発声・発話系</h1>
  <p>インタビュー・ミニテスト頻出テーマ完全網羅版（全148問）</p>
</header>

<div id="start-screen">
  <h2>🎓 期末模擬テスト</h2>
  <div class="start-info">
    <b>収録範囲</b><br>
    ①②口腔・咽頭 ／ ③④呼吸器 ／ ⑤⑥喉頭 ／ ⑦発声メカニズム ／ ⑧〜⑭疾患・検査<br><br>
    <b>問題数：</b>148問（5択1答）<br>
    <b>★マーク：</b>国試頻出問題<br><br>
    解説を読んでから次へ進めます。
  </div>
  <div class="mode-select">
    <label>出題順</label>
    <select id="order-select">
      <option value="sequential">①〜⑭ 順番通り</option>
      <option value="random">ランダム</option>
    </select>
  </div>
  <button class="btn btn-primary" style="width:100%;padding:12px;" onclick="startQuiz()">スタート ▶</button>
</div>

<div id="quiz-area" style="display:none">
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="status-bar">
    <span id="status-text">問題 1 / 100</span>
    <span>✅ <span id="correct-count">0</span>　❌ <span id="wrong-count">0</span></span>
  </div>
  <div id="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all')">全問</button>
    <button class="filter-btn" onclick="setFilter('star')">★国試頻出</button>
    <button class="filter-btn" onclick="setFilter('oral')">口腔・咽頭</button>
    <button class="filter-btn" onclick="setFilter('resp')">呼吸器</button>
    <button class="filter-btn" onclick="setFilter('larynx')">喉頭</button>
    <button class="filter-btn" onclick="setFilter('voice')">発声</button>
    <button class="filter-btn" onclick="setFilter('disease')">疾患</button>
    <button class="filter-btn" onclick="setFilter('nerve')">神経</button>
  </div>
  <div id="quiz-wrap">
    <div id="q-container"></div>
  </div>
</div>

<div id="result-screen">
  <h2>🎉 テスト終了！</h2>
  <div class="score-big" id="score-display">0</div>
  <div class="score-sub" id="score-sub">/ 100問</div>
  <div class="result-msg" id="result-msg"></div>
  <button class="btn btn-primary" style="margin-top:20px;width:100%;padding:12px;" onclick="restartQuiz()">もう一度やる</button>
</div>

<script>
const ALL_QUESTIONS = [
// ===== 口腔・咽頭（Q1〜Q20）=====
{id:1,cat:'oral',star:true,text:'舌前方2/3の味覚を支配する神経の正しい組み合わせはどれか。',
choices:['迷走神経の枝である上喉頭神経','三叉神経第3枝である舌神経','顔面神経の枝である鼓索神経','舌咽神経の枝である鼓室神経','舌下神経の枝である舌深神経'],
ans:2,exp:'★舌前方2/3の味覚＝顔面神経（第Ⅶ）→鼓索神経。同部位の一般知覚（触覚・痛覚）は三叉神経第3枝（舌神経）が担う。この2つのセットは最頻出。'},

{id:2,cat:'oral',star:true,text:'舌前方2/3の一般知覚（触覚・痛覚）を支配するのはどれか。',
choices:['顔面神経の枝である鼓索神経','舌咽神経の舌枝','三叉神経第3枝の舌神経','迷走神経の舌枝','舌下神経の感覚枝'],
ans:2,exp:'★舌前方2/3の一般知覚＝三叉神経第3枝の舌神経。三叉神経は1枝：額、2枝：頬、3枝：顎・舌を支配する。'},

{id:3,cat:'oral',star:true,text:'軟口蓋の運動を支配する脳神経はどれか。',
choices:['顔面神経（第Ⅶ脳神経）','舌咽神経（第Ⅸ脳神経）','迷走神経（第Ⅹ脳神経）','舌下神経（第Ⅻ脳神経）','副神経（第Ⅺ脳神経）'],
ans:2,exp:'★軟口蓋の運動＝迷走神経（第Ⅹ）。知覚は舌咽神経（第Ⅸ）。軟口蓋麻痺（反回神経麻痺でも起こる）ではカーテン徴候が出る。'},

{id:4,cat:'oral',star:false,text:'軟口蓋の知覚を支配する脳神経はどれか。',
choices:['迷走神経（第Ⅹ脳神経）','三叉神経第2枝','顔面神経（第Ⅶ脳神経）','舌咽神経（第Ⅸ脳神経）','副神経（第Ⅺ脳神経）'],
ans:3,exp:'軟口蓋の知覚＝舌咽神経（第Ⅸ）。運動は迷走神経。セットで覚える。'},

{id:5,cat:'oral',star:true,text:'唾液の消化作用を担う酵素はどれか。',
choices:['リパーゼ','トリプシン','アミラーゼ','ペプシン','ラクターゼ'],
ans:2,exp:'★唾液中の消化酵素＝アミラーゼ（プチアリン）。デンプンをマルトースに分解する。流行性耳下腺炎（ムンプス）では血中・尿中アミラーゼが高値を示す。'},

{id:6,cat:'oral',star:true,text:'大唾液腺の組み合わせとして正しいのはどれか。',
choices:['耳下腺・顎下腺・舌下腺','耳下腺・舌下腺・口蓋腺','顎下腺・舌下腺・口唇腺','耳下腺・顎下腺・口蓋腺','耳下腺・舌下腺・口蓋腺'],
ans:0,exp:'★大唾液腺は3つ：耳下腺・顎下腺・舌下腺。耳下腺が最大、舌下腺が最小。耳下腺腫瘍（多形腺腫・ワルチン腫瘍）も頻出。'},

{id:7,cat:'oral',star:true,text:'嚥下の3期のうち、唯一の随意期はどれか。',
choices:['食道期（第3期）','咽頭期（第2期）','口腔期（第1期）','準備期','喉頭期'],
ans:2,exp:'★嚥下の第1期＝口腔期が唯一の随意期。第2期（咽頭期）・第3期（食道期）は不随意。咽頭期では声帯閉鎖・軟口蓋挙上・喉頭挙上が同時に起こる。'},

{id:8,cat:'oral',star:true,text:'嚥下時の声帯の状態はどれか。',
choices:['開大する','閉鎖する','一側のみ閉鎖する','振動する','弛緩する'],
ans:1,exp:'★嚥下時は声帯が閉鎖し気道を保護する。同時に喉頭が前上方へ挙上し、喉頭蓋が気道を覆う。'},

{id:9,cat:'oral',star:false,text:'耳下腺から分泌される唾液の性状はどれか。',
choices:['粘液性','漿液粘液混合性','漿液性','脂肪性','アルカリ性のみ'],
ans:2,exp:'耳下腺＝漿液性（さらさら）。顎下腺＝漿液粘液混合性。舌下腺＝粘液性（ねばねば）。耳下腺の導管はステノン管。'},

{id:10,cat:'oral',star:false,text:'食道入口部を形成する筋はどれか。',
choices:['甲状咽頭筋','上咽頭収縮筋','輪状咽頭筋','茎突咽頭筋','口蓋咽頭筋'],
ans:2,exp:'食道入口部＝輪状咽頭筋。嚥下時以外は常に収縮して閉じており、嚥下時にのみ弛緩して食塊を通過させる（CPバー）。'},

{id:11,cat:'oral',star:false,text:'舌後方1/3の味覚を支配する神経はどれか。',
choices:['顔面神経の鼓索神経','迷走神経の上喉頭神経内枝','三叉神経第3枝の舌神経','舌咽神経の舌枝','舌下神経'],
ans:3,exp:'舌後方1/3の味覚＝舌咽神経（第Ⅸ）。前方2/3は顔面神経（鼓索神経）という分界を覚える。'},

{id:12,cat:'nerve',star:true,text:'頸静脈孔を通過する脳神経の組み合わせとして正しいのはどれか。',
choices:['顔面神経・内耳神経・舌咽神経','舌咽神経・迷走神経・副神経','迷走神経・副神経・舌下神経','舌咽神経・舌下神経・副神経','顔面神経・迷走神経・副神経'],
ans:1,exp:'★頸静脈孔を通る神経：舌咽神経（Ⅸ）・迷走神経（Ⅹ）・副神経（Ⅺ）の3つ。「Ⅸ・Ⅹ・Ⅺ」と番号で覚える。'},

{id:13,cat:'nerve',star:true,text:'第Ⅶ脳神経（顔面神経）が支配する機能の組み合わせとして正しいのはどれか。',
choices:['顔面知覚・舌前方2/3味覚・耳下腺分泌','表情筋運動・舌前方2/3味覚・顎下腺・舌下腺分泌','表情筋運動・咀嚼筋運動・舌前方2/3味覚','舌後方1/3味覚・咽頭筋運動・耳下腺分泌','顔面知覚・表情筋運動・涙腺分泌'],
ans:1,exp:'★顔面神経（Ⅶ）は混合性。運動：表情筋。感覚：舌前方2/3味覚（鼓索神経）。副交感：顎下腺・舌下腺分泌（鼓索神経経由）・涙腺（大錐体神経）。'},

{id:14,cat:'nerve',star:true,text:'第Ⅸ脳神経（舌咽神経）が支配する機能として誤っているのはどれか。',
choices:['舌後方1/3の味覚','軟口蓋の知覚','耳下腺の分泌','舌前方2/3の味覚','咽頭の知覚'],
ans:3,exp:'★舌前方2/3の味覚は顔面神経（鼓索神経）が担う。舌咽神経（Ⅸ）は舌後方1/3の味覚・軟口蓋知覚・耳下腺分泌・咽頭知覚などを支配する。'},

{id:15,cat:'nerve',star:true,text:'第Ⅻ脳神経（舌下神経）の機能と麻痺時の症状の組み合わせとして正しいのはどれか。',
choices:['舌の知覚支配、麻痺側とは逆に舌が偏位','舌筋の運動支配、舌を突出すると患側へ偏位','舌筋の運動支配、舌を突出すると健側へ偏位','咀嚼筋支配、開口時に患側へ偏位','軟口蓋運動支配、カーテン徴候が出現'],
ans:1,exp:'★舌下神経（Ⅻ）は舌筋の運動を支配。麻痺時は患側の舌筋が萎縮・収縮できず、舌は患側へ偏位する。舌下神経麻痺は延髄病変・舌癌手術後などで起こる。'},

{id:16,cat:'oral',star:false,text:'舌癌の好発部位と組織型の組み合わせとして正しいのはどれか。',
choices:['舌背部・腺癌','舌縁部・扁平上皮癌','舌根部・小細胞癌','舌尖部・移行上皮癌','舌背部・粘表皮癌'],
ans:1,exp:'舌癌は舌縁部（側縁）に好発する扁平上皮癌。口腔内の悪性腫瘍の大部分は扁平上皮癌。喫煙・飲酒・慢性刺激が危険因子。'},

{id:17,cat:'oral',star:false,text:'耳下腺腫瘍で顔面神経麻痺が生じる場合、何を示唆するか。',
choices:['良性腫瘍（多形腺腫）の可能性','ワルチン腫瘍の可能性','悪性腫瘍の可能性','シェーグレン症候群の合併','慢性耳下腺炎'],
ans:2,exp:'耳下腺内を顔面神経が貫通するため、耳下腺腫瘍で顔面神経麻痺が出現すれば悪性を強く示唆する。良性腫瘍（多形腺腫・ワルチン腫瘍）では通常麻痺を生じない。'},

{id:18,cat:'oral',star:false,text:'耳下腺に好発する良性腫瘍を2つ選ぶ場合、正しい組み合わせはどれか。',
choices:['粘表皮癌と腺様嚢胞癌','多形腺腫と腺様嚢胞癌','多形腺腫とワルチン腫瘍','ワルチン腫瘍と粘表皮癌','多形腺腫と扁平上皮癌'],
ans:2,exp:'耳下腺良性腫瘍の2大疾患：多形腺腫（最多）とワルチン腫瘍。ワルチン腫瘍は男性・喫煙者に多い。両側性もある。'},

{id:19,cat:'oral',star:true,text:'シェーグレン（Sjögren）症候群について正しいのはどれか。',
choices:['ウイルス感染を原因とする感染症である','シアログラムでアップルツリーサインを認める','SS-A・SS-B抗体は陰性である','耳下腺腫瘍の一種に分類される','主に男性に多い疾患である'],
ans:1,exp:'★シェーグレン症候群は自己免疫疾患（Ⅳ型）。唾液腺・涙腺が標的で、ドライマウス・ドライアイが主症状。シアログラム（唾液腺造影）でアップルツリーサイン、血清でSS-A・SS-B抗体陽性。中年女性に多い。'},

{id:20,cat:'oral',star:false,text:'流行性耳下腺炎（ムンプス）で高値を示す血液検査項目はどれか。',
choices:['リパーゼのみ','アミラーゼのみ','アミラーゼと尿中アミラーゼ','AST・ALT','LDH'],
ans:2,exp:'ムンプス（流行性耳下腺炎）ではムンプスウイルスが耳下腺を侵し、血中・尿中アミラーゼが高値を示す。合併症として難聴・髄膜炎・精巣炎・膵炎がある。'},

// ===== 呼吸器（Q21〜Q40）=====
{id:21,cat:'resp',star:true,text:'左右の主気管支が分岐するレベルはどれか。',
choices:['第3胸椎レベル','第4胸椎レベル','第5胸椎レベル','第6胸椎レベル','第7胸椎レベル'],
ans:2,exp:'★気管分岐部（カリーナ）は第5胸椎レベル。左主気管支は長くて細く水平方向、右は短くて太く急角度。異物は右に迷入しやすい。'},

{id:22,cat:'resp',star:true,text:'左主気管支と右主気管支の違いとして正しいのはどれか。',
choices:['左は右より短く太い','左は右より長くて細い','左右ともに同じ長さ・太さ','右は左より長くて細い','右は左より水平に走行する'],
ans:1,exp:'★左主気管支：長くて細い。右主気管支：短くて太い。右は急角度（気管軸に近い）なので異物・誤嚥は右肺（特に右下葉）に多い。'},

{id:23,cat:'resp',star:false,text:'軟骨が存在しなくなるのはどのレベル以降か。',
choices:['葉気管支以降','区域気管支以降','細気管支以降','肺胞管以降','呼吸細気管支以降'],
ans:2,exp:'細気管支（内径2mm未満）以降には軟骨が存在しない。COPDなどでは細気管支レベルの閉塞・破壊が問題となる。'},

{id:24,cat:'resp',star:true,text:'肺の最小単位と個数の組み合わせとして正しいのはどれか。',
choices:['肺胞・約1億個','肺小葉・約3億個','肺胞・約3億個','肺胞嚢・約3億個','肺胞・約5億個'],
ans:2,exp:'★肺胞が肺の最小単位、約3億個存在。肺胞内面はI型（ガス交換）とII型（サーファクタント産生）の肺胞上皮細胞で覆われる。'},

{id:25,cat:'resp',star:false,text:'気管の内腔を覆う上皮はどれか。',
choices:['単層扁平上皮','重層扁平上皮','多列線毛円柱上皮','単層立方上皮','移行上皮'],
ans:2,exp:'気管内腔は多列線毛円柱上皮（繊毛上皮）で覆われる。粘液・異物を喉頭方向へ運ぶ「粘液繊毛エスカレーター」として機能。'},

{id:26,cat:'resp',star:true,text:'横隔膜の吸気時の動きとして正しいのはどれか。',
choices:['弛緩して上昇する','収縮して上昇する','弛緩して下降する','収縮して下降する','変化しない'],
ans:3,exp:'★横隔膜は吸気時に収縮→下降→胸腔容積増大→肺が拡張→吸気。安静呼吸の約70%を担う最重要呼吸筋。'},

{id:27,cat:'resp',star:true,text:'横隔膜の支配神経の正しい組み合わせはどれか。',
choices:['第2頚髄からの横隔神経','第3頚髄からの横隔神経','第4頚髄からの横隔神経','第5頚髄からの横隔神経','第6頚髄からの横隔神経'],
ans:2,exp:'★横隔神経はC4（第4頚髄）由来。「C3,4,5 keep the diaphragm alive」と覚える。C4以上の頚髄損傷では横隔膜麻痺→人工呼吸が必要。'},

{id:28,cat:'resp',star:true,text:'吸気時に主に働く筋肉の組み合わせとして正しいのはどれか。',
choices:['横隔膜と内肋間筋','外肋間筋と内肋間筋','横隔膜と外肋間筋','腹直筋と横隔膜','内肋間筋と腹筋群'],
ans:2,exp:'★吸気主働筋：横隔膜＋外肋間筋。呼気は安静時は弾性収縮（受動的）。努力呼気では内肋間筋・腹筋群が働く。'},

{id:29,cat:'resp',star:true,text:'安静時の1回換気量として正しいのはどれか。',
choices:['150〜250mL','200〜300mL','350〜500mL','600〜800mL','800〜1000mL'],
ans:2,exp:'★安静時1回換気量は350〜500mL（約400mL）。このうち約150mLは気道の死腔（解剖学的死腔）に留まり肺胞換気に寄与しない。'},

{id:30,cat:'resp',star:true,text:'動脈血液中の正常pHはどれか。',
choices:['7.25','7.30','7.40','7.50','7.55'],
ans:2,exp:'★動脈血液の正常pH：7.35〜7.45（中央値7.40）。7.35未満はアシドーシス、7.45超はアルカローシス。CO2蓄積（高CO2血症）でもpH低下。'},

{id:31,cat:'resp',star:true,text:'スパイロメトリー（spirometry）で直接測定できない肺気量はどれか。',
choices:['1秒量（FEV1.0）','努力性肺活量（FVC）','残気量（RV）','予備吸気量（IRV）','予備呼気量（ERV）'],
ans:2,exp:'★残気量（RV：Residual Volume）は最大呼気後も肺に残る空気量で、スパイロメーターでは測定不能。ヘリウム希釈法や体プレチスモグラフィで測定。'},

{id:32,cat:'resp',star:true,text:'1秒率（FEV1.0%）が低下する呼吸機能障害はどれか。',
choices:['拘束性障害（間質性肺炎など）','閉塞性障害（COPDなど）','混合性障害のみ','筋萎縮性側索硬化症による障害','胸膜疾患による障害'],
ans:1,exp:'★閉塞性障害（COPD・気管支喘息）：FEV1.0%（1秒率）が低下（70%未満）。拘束性障害（肺線維症・胸膜炎）：肺活量が低下し、1秒率は正常〜上昇。'},

{id:33,cat:'resp',star:false,text:'COPDの主な原因として最も多いのはどれか。',
choices:['大気汚染','職業性粉塵暴露','喫煙','α1-アンチトリプシン欠乏症','感染症の既往'],
ans:2,exp:'COPD（慢性閉塞性肺疾患）の原因の約90%は喫煙。長期喫煙により肺胞が破壊（肺気腫）・細気管支炎が起こる。禁煙が最重要治療。'},

{id:34,cat:'resp',star:false,text:'空気感染（飛沫核感染）する感染症の組み合わせとして正しいのはどれか。',
choices:['インフルエンザ・百日咳・肺炎球菌肺炎','結核・麻疹・水痘（水ぼうそう）','結核・マイコプラズマ肺炎・百日咳','麻疹・インフルエンザ・水痘','肺炎球菌・レジオネラ・マイコプラズマ'],
ans:1,exp:'★空気感染（飛沫核感染）：結核・麻疹・水痘の3つ。飛沫感染はインフルエンザ・百日咳など。「空気は結麻水（ゆ）」と覚える。'},

{id:35,cat:'resp',star:false,text:'気胸（pneumothorax）の説明として正しいのはどれか。',
choices:['肺に水が溜まり肺が圧迫される病態','肺の損傷により空気が胸腔に漏れ肺が虚脱する病態','気管支が狭窄し呼気が障害される病態','肺胞が破壊されガス交換が障害される病態','胸膜の炎症で胸水が貯留する病態'],
ans:1,exp:'気胸は肺の損傷（自然気胸・外傷性）などにより空気が胸腔（肺の外）に漏出し、肺が縮こまる（虚脱）病態。自然気胸は若い痩せた男性に多い。'},

{id:36,cat:'resp',star:false,text:'マイコプラズマ肺炎の典型的な胸部X線・CT像はどれか。',
choices:['両肺野のすりガラス影','下肺野のすりガラス影','葉性浸潤影（consolidation）','粟粒影（miliary pattern）','胸水のみ'],
ans:1,exp:'マイコプラズマ肺炎はすりガラス影（ground glass opacity）が下肺野に多い。非定型肺炎の代表で、抗菌薬（マクロライド系）が有効。'},

{id:37,cat:'resp',star:false,text:'市中肺炎（細菌性肺炎）の第一選択治療はどれか。',
choices:['抗ウイルス薬の投与','ステロイド大量投与','抗生物質（抗菌薬）の投与','気管支拡張薬の吸入のみ','免疫抑制薬の投与'],
ans:2,exp:'細菌性肺炎の治療は抗生物質（抗菌薬）投与。必要に応じて酸素投与も行う。肺炎球菌肺炎にはペニシリン系、マイコプラズマにはマクロライド系。'},

{id:38,cat:'resp',star:false,text:'GERD（胃食道逆流症）の咽喉頭症状として最も代表的なものはどれか。',
choices:['嚥下痛','嚥下障害のみ','咽喉頭違和感・慢性咳嗽・音声障害','耳鳴り・難聴','鼻閉・後鼻漏'],
ans:2,exp:'GERDでは胃酸が咽喉頭を刺激し、咽喉頭違和感（つかえ感）・慢性咳嗽・音声障害（嗄声）・胸やけを生じる。STが関与する嚥下・音声障害の鑑別で重要。'},

{id:39,cat:'resp',star:false,text:'Plummer-Vinson症候群の主な症状として正しいものはどれか。',
choices:['嚥下障害・舌炎・貧血・口内炎','下肢のしびれ・嚥下障害・貧血','嚥下障害・難聴・顔面神経麻痺','嚥下障害・声帯麻痺・甲状腺腫大','嚥下障害・耳下腺腫大・口腔乾燥'],
ans:0,exp:'Plummer-Vinson症候群：鉄欠乏性貧血を基盤に、嚥下障害（咽頭Web）・舌炎・口内炎・貧血が生じる。中年女性に多く、鉄剤補充が治療。'},

{id:40,cat:'resp',star:false,text:'甲状腺ホルモンが低下した場合の音声への影響はどれか。',
choices:['高い声・速い発話になる','嗄声（低くしゃがれた声）になりやすい','音声に変化は生じない','声量が増大する','発声持続時間が延長する'],
ans:1,exp:'甲状腺ホルモン低下（甲状腺機能低下症）→粘液水腫により声帯が浮腫→嗄声。甲状腺機能低下では体重増加・浮腫・便秘・倦怠感なども伴う。'},

// ===== 喉頭（Q41〜Q60）=====
{id:41,cat:'larynx',star:true,text:'喉頭を形成する軟骨のうち一対存在するのはどれか。',
choices:['甲状軟骨','輪状軟骨','披裂軟骨','喉頭蓋軟骨','小角軟骨'],
ans:2,exp:'★喉頭軟骨：甲状・輪状・喉頭蓋（各1個）＋披裂軟骨（1対＝2個）。披裂軟骨の内転・外転が声帯開閉を制御する。'},

{id:42,cat:'larynx',star:true,text:'内喉頭筋のうち喉頭の枠組みの外に位置する唯一の筋はどれか。',
choices:['甲状披裂筋（TA筋）','外側輪状披裂筋（LCA筋）','後輪状披裂筋（PCA筋）','披裂横筋（IA筋）','輪状甲状筋（CT筋）'],
ans:4,exp:'★輪状甲状筋（CT筋）のみ喉頭の枠組みの外側（前外側）に位置する。支配神経も他の内喉頭筋（反回神経）と異なり、上喉頭神経外枝。'},

{id:43,cat:'larynx',star:true,text:'声帯そのものを形成している内喉頭筋はどれか。',
choices:['外側輪状披裂筋（LCA筋）','輪状甲状筋（CT筋）','後輪状披裂筋（PCA筋）','甲状披裂筋（TA筋）','披裂横筋（IA筋）'],
ans:3,exp:'★甲状披裂筋（TA筋）が声帯筋（声帯そのもの）を形成する。声帯はTA筋（ボディ）＋粘膜・固有層浅層（カバー）から構成される。'},

{id:44,cat:'larynx',star:true,text:'声帯を開大する唯一の内喉頭筋はどれか。',
choices:['輪状甲状筋（CT筋）','外側輪状披裂筋（LCA筋）','甲状披裂筋（TA筋）','後輪状披裂筋（PCA筋）','披裂横筋（IA筋）'],
ans:3,exp:'★後輪状披裂筋（PCA筋）が唯一の声帯開大筋。両側PCA麻痺→両側声帯正中固定→気道閉塞の危機。他の内喉頭筋はすべて閉鎖方向に働く。'},

{id:45,cat:'larynx',star:true,text:'内喉頭筋のうち両側神経支配を受けるのはどれか。',
choices:['輪状甲状筋（CT筋）','外側輪状披裂筋（LCA筋）','後輪状披裂筋（PCA筋）','甲状披裂筋（TA筋）','披裂横筋（IA筋）'],
ans:4,exp:'★披裂横筋（IA筋）のみ両側神経支配。他の内喉頭筋は一側支配。IA筋は声帯を内転（閉鎖）させる。'},

{id:46,cat:'larynx',star:true,text:'多くの内喉頭筋（輪状甲状筋を除く）を支配する神経はどれか。',
choices:['上喉頭神経外枝','上喉頭神経内枝','反回神経（下喉頭神経）','舌咽神経','副神経'],
ans:2,exp:'★ほぼ全内喉頭筋＝反回神経（下喉頭神経）支配。例外：輪状甲状筋＝上喉頭神経外枝。反回神経麻痺で嗄声・嚥下障害が生じる。'},

{id:47,cat:'larynx',star:true,text:'輪状甲状筋の支配神経として正しいのはどれか。',
choices:['反回神経（下喉頭神経）','上喉頭神経の内枝','上喉頭神経の外枝','舌咽神経の咽頭枝','迷走神経の心臓枝'],
ans:2,exp:'★輪状甲状筋は上喉頭神経の外枝（迷走神経の枝）が支配する。内枝は知覚（喉頭粘膜の知覚）を担う。この例外は頻出！'},

{id:48,cat:'larynx',star:true,text:'反回神経（下喉頭神経）の運動核が存在する脳幹部位はどれか。',
choices:['中脳の動眼神経核','橋の顔面神経核','延髄の疑核','延髄の迷走神経背側核','橋の三叉神経運動核'],
ans:2,exp:'★反回神経（迷走神経の枝）の運動核は延髄の疑核。疑核は咽頭・喉頭・軟口蓋の運動を支配する。迷走神経背側核は副交感（内臓）を担う。'},

{id:49,cat:'larynx',star:true,text:'左反回神経が回り込む解剖学的構造はどれか。',
choices:['鎖骨下動脈','腕頭動脈','大動脈弓','肺動脈弓','総頸動脈'],
ans:2,exp:'★左反回神経は大動脈弓を回って尾側から喉頭へ進入する。右反回神経は鎖骨下動脈を回る。左反回神経の走行が長いため、左側麻痺が多い（大動脈瘤・縦隔腫瘍で）。'},

{id:50,cat:'larynx',star:false,text:'声帯の振動機構的な構成として正しいのはどれか。',
choices:['粘膜層とボディ（声帯筋）','カバー（粘膜・固有層浅層）とボディ（声帯筋）','外側層と内側層','上層と下層','粘膜層と腱膜層'],
ans:1,exp:'声帯はカバー（cover：粘膜上皮＋固有層浅層＝Reinke腔）とボディ（body：声帯筋＝甲状披裂筋内側部）に大別される。ポリープ様声帯はReinke腔の浮腫。'},

{id:51,cat:'larynx',star:false,text:'最も強く声帯閉鎖を生じさせる内喉頭筋はどれか。',
choices:['輪状甲状筋（CT筋）','甲状披裂筋（TA筋）','外側輪状披裂筋（LCA筋）','後輪状披裂筋（PCA筋）','披裂横筋（IA筋）'],
ans:2,exp:'外側輪状披裂筋（LCA筋）が最も強力な声帯内転（閉鎖）筋。嚥下時の声帯閉鎖保護においても重要な役割を担う。'},

{id:52,cat:'larynx',star:false,text:'発声時の輪状披裂関節の動きとして正しいのはどれか。',
choices:['外側に滑走し外側に回転','内側に滑走し内側に回転','内側に滑走し外側に回転','外側に滑走し内側に回転','前後に滑走する'],
ans:1,exp:'発声（声帯内転）時：輪状披裂関節は内側に滑走＋内側に回転→声帯が正中に寄る。呼吸時（外転）は反対方向に動く。'},

{id:53,cat:'larynx',star:false,text:'舌骨上筋群と舌骨下筋群が同時に作用した場合、下顎はどうなるか。',
choices:['挙上する','前方に突出する','下降する','後退する','変化しない'],
ans:2,exp:'舌骨上筋群は舌骨を挙上・下顎を下降させる。舌骨下筋群は舌骨を固定・下降させる。両群同時収縮→舌骨固定→下顎が下降（開口）。'},

{id:54,cat:'disease',star:true,text:'一側性反回神経麻痺の主な症状はどれか。',
choices:['気道閉塞による呼吸困難','嗄声・声の息漏れ（気息性嗄声）','完全失声','飲み込みのみの障害','両側声帯が正中固定'],
ans:1,exp:'★一側性反回神経麻痺では患側声帯が固定し、声門が完全に閉じられず、気息性嗄声（breathy voice）・嗄声が生じる。嚥下時の誤嚥リスクもある。'},

{id:55,cat:'disease',star:true,text:'両側性反回神経麻痺の正中固定例で最優先される治療は何か。',
choices:['音声治療（発声訓練）','嚥下訓練','気道確保（気管切開など）','甲状腺枠組み手術','生体内注入術'],
ans:2,exp:'★両側性反回神経麻痺・正中固定では両側声帯が気道を塞ぎ→呼吸困難→気道確保が最優先。発声は可能でも呼吸が危険。'},

{id:56,cat:'disease',star:false,text:'一側性反回神経麻痺への外科的治療として正しいのはどれか。',
choices:['声帯を切除する手術','甲状腺枠組み手術（喉頭枠組み手術）または生体内注入術','声帯を切断する手術','両側声帯を接合する手術','喉頭全摘術'],
ans:1,exp:'一側性反回神経麻痺：甲状腺枠組み手術（type Ⅰサイロプラスティ）で患側声帯を正中に移動、または生体内注入術でコラーゲン等を注入して声門閉鎖を改善する。'},

{id:57,cat:'disease',star:true,text:'喉頭癌の組織型と性差として正しいのはどれか。',
choices:['腺癌が多く、女性に好発する','扁平上皮癌が多く、男性に好発する','小細胞癌が多く、男性に好発する','移行上皮癌が多く、性差はない','扁平上皮癌が多く、性差はない'],
ans:1,exp:'★喉頭癌は扁平上皮癌が大部分を占め、男性（喫煙者）に多い。声門型・声門上型・声門下型に分類し、声門型が最多で初期から嗄声をきたす。'},

{id:58,cat:'disease',star:true,text:'喉頭癌の中で最も頻度が高く、初期から嗄声をきたす型はどれか。',
choices:['声門上型','声門型','声門下型','梨状陥凹型','喉頭蓋型'],
ans:1,exp:'★声門型が最多（約60%）。声帯そのものに生じるため初期から嗄声（嗄声が唯一の症状）をきたし、早期発見しやすい。声門上型はリンパ節転移が早期に起こる。'},

{id:59,cat:'disease',star:false,text:'喉頭全摘術後の障害者手帳の等級はどれか。',
choices:['身体障害者手帳1級','身体障害者手帳2級','身体障害者手帳3級','身体障害者手帳4級','障害者手帳の対象外'],
ans:2,exp:'喉頭全摘→永続的な失声→身体障害者手帳3級（音声・言語機能の喪失）。人工喉頭・食道発声・気管食道シャント（プロヴォックス）などの代替音声が用いられる。'},

{id:60,cat:'disease',star:false,text:'喉頭全摘後の代替音声として使われるものの組み合わせとして正しいのはどれか。',
choices:['食道発声・電気喉頭・気管食道シャント（TEP）','腹話術・食道発声・電気喉頭','気管切開チューブ・食道発声・嗄声','腹声法・電気喉頭・TEP','食道発声・腹声法・電気喉頭'],
ans:0,exp:'喉頭全摘後の代替音声：①食道発声（空気を食道に取り込み振動）②電気喉頭（電気振動）③気管食道シャント（TEP/プロヴォックス）の3つ。'},

// ===== 発声メカニズム（Q61〜Q75）=====
{id:61,cat:'voice',star:true,text:'声帯振動の理論として、声帯の弾性と空気力学で振動が維持されるとする理論はどれか。',
choices:['カバーボディ理論','ベルヌーイ（Bernoulli）理論のみ','筋弾性・空気力学（myo-elastic aerodynamic）理論','声門下圧理論','共鳴理論'],
ans:2,exp:'★筋弾性・空気力学（Myo-elastic aerodynamic）理論：Van den Berg（オランダ・生理学者）が提唱。声帯の弾性＋空気力学的効果（ベルヌーイ効果）で声帯振動が維持される。'},

{id:62,cat:'voice',star:true,text:'ベルヌーイ（Bernoulli）効果の説明として正しいのはどれか。',
choices:['声門下圧が高まり声帯が押し開かれる力学的現象','気流が加速されると圧力が上がり声帯が閉じる','気流が加速されると周囲の圧力が低下し声帯が引き合う','声帯の弾性力のみで声門が閉じる現象','声門上圧が声帯振動を維持する現象'],
ans:2,exp:'★ベルヌーイ効果：狭い声門を通る気流が加速→声帯周囲の圧力が低下→声帯が内側に引き寄せられる（閉鎖）。これが声帯振動を持続させる。'},

{id:63,cat:'voice',star:true,text:'発声に必要な最低声門下圧はどれか。',
choices:['1 cmH2O','2 cmH2O','4 cmH2O','8 cmH2O','10 cmH2O'],
ans:2,exp:'★発声に必要な最低声門下圧は4 cmH2O。声の強さ（音圧）は主に声門下圧の大きさで決まる。'},

{id:64,cat:'voice',star:true,text:'楽な発声時の呼気流率（MPF）として正しいのはどれか。',
choices:['50〜100 mL/sec','100〜200 mL/sec','200〜300 mL/sec','300〜400 mL/sec','400〜500 mL/sec'],
ans:1,exp:'★楽な発声時の呼気流率は約100〜200 mL/sec（平均140〜160 mL/sec）。この値が大きく逸脱する場合、声門閉鎖不全や過緊張を示唆する。'},

{id:65,cat:'voice',star:true,text:'音声の高さ（pitch）を決める主な因子はどれか。',
choices:['声門下圧の大きさ','声道の共鳴特性','声帯の振動数（基本周波数：F0）','声帯の厚さのみ','気流量の大きさ'],
ans:2,exp:'★音声の高さ＝声帯の振動数（F0：基本周波数）。振動数が多い→高音。F0を上げる主働筋は輪状甲状筋（CT筋）。'},

{id:66,cat:'voice',star:true,text:'基本周波数（F0）を上げるときに最も収縮する内喉頭筋はどれか。',
choices:['甲状披裂筋（TA筋）','後輪状披裂筋（PCA筋）','輪状甲状筋（CT筋）','外側輪状披裂筋（LCA筋）','披裂横筋（IA筋）'],
ans:2,exp:'★輪状甲状筋（CT筋）が収縮→甲状軟骨が前傾→声帯が伸展・薄くなる→F0上昇（高い声）。声楽家は高音域でCT筋を最大限使用する。'},

{id:67,cat:'voice',star:true,text:'最長発声持続時間（MPT：Maximum Phonation Time）の測定方法として正しいのはどれか。',
choices:['高い声を出し続ける最長時間','最大吸気後に/a/を楽に発声し続けられる最長時間','最大呼気後に/a/を発声し続ける時間','普通の息で/a/を発声し続ける最長時間','運動後に/a/を発声し続ける時間'],
ans:1,exp:'★MPT＝最大吸気後に/a/（母音）を楽に発声し続けられる最長時間。成人男性：25秒以上、成人女性：20秒以上が目安。10秒以下は会話に支障が出る。'},

{id:68,cat:'voice',star:true,text:'成人男性のMPT正常値の目安はどれか。',
choices:['約10秒以上','約15秒以上','約20秒以上','約25秒以上','約30秒以上'],
ans:3,exp:'★成人男性MPT：約25秒以上、成人女性：約20秒以上が目安。10秒以下は発声機能の著明な低下を示す。'},

{id:69,cat:'voice',star:false,text:'声道の共鳴によって特定の周波数が強調されたものを何というか。',
choices:['基本周波数（F0）','高調波（harmonic）','フォルマント（formant）','残響（reverberation）','声門雑音'],
ans:2,exp:'フォルマント（formant）：声道（口腔・咽頭腔・鼻腔など）の共鳴で特定の周波数帯が強調されたもの。母音の音色（/a/ /i/ /u/ など）はF1・F2の配置で決まる。'},

{id:70,cat:'voice',star:false,text:'出生時の反射的声の高さとして正しいのはどれか。',
choices:['220 Hz（a）','330 Hz（e1）','440 Hz（a1）','550 Hz（cs2）','660 Hz（e2）'],
ans:2,exp:'出生時の反射的声（泣き声）の高さは440 Hz（a1）。音楽のA音に相当。満1歳までに声域は次第に上昇する。'},

{id:71,cat:'voice',star:false,text:'変声期を引き起こす主なホルモンはどれか。',
choices:['エストロゲン（estrogen）','プロゲステロン（progesterone）','アンドロゲン（androgen）','コルチゾール（cortisol）','甲状腺ホルモン（thyroid hormone）'],
ans:2,exp:'変声期はアンドロゲン（男性ホルモン）が作用し喉頭が前後に拡大、声帯が長くなることで声が低くなる。男子では約1オクターブ低下。女子でも軽度の変声がある。'},

{id:72,cat:'voice',star:false,text:'喉頭ストロボスコピー（laryngostroboscopy）で主に観察するものはどれか。',
choices:['声帯の色調と血管状態','声帯の形態と腫瘍の有無','声帯の弾力性（振動・柔軟性）','喉頭の解剖学的構造','気道の狭窄部位'],
ans:2,exp:'喉頭ストロボスコピーは声帯振動をゆっくり見かけ上スローモーションで観察する装置。声帯の弾力性・柔軟性（振動様式）を評価する。固有層の変化（瘢痕・浮腫）に有効。'},

{id:73,cat:'voice',star:true,text:'GRBAS尺度のSが評価するものはどれか。',
choices:['Roughness（粗糙性）','Breathiness（気息性）','Asthenia（無力性）','Strain（努力性）','Severity（重症度）'],
ans:3,exp:'★GRBAS：G（Grade全般）・R（Rough粗糙）・B（Breathy気息）・A（Asthenic無力）・S（Strained努力性）。音声の聴覚心理的評価として頻用。0〜3で評価。'},

{id:74,cat:'voice',star:false,text:'音響分析検査で主に評価する項目の組み合わせとして正しいのはどれか。',
choices:['F0の揺らぎ・振幅の揺らぎ・雑音の程度','F0のみ','MPT・S/Z比・振幅の揺らぎ','音圧レベルのみ','フォルマント周波数・F0・MPT'],
ans:0,exp:'音響分析検査で主に評価するのは：①基本周波数（F0）の揺らぎ（jitter）②振幅の揺らぎ（shimmer）③雑音の程度（HNR：調波雑音比）の3項目。'},

{id:75,cat:'voice',star:false,text:'声帯ポリープの好発部位として正しいのはどれか。',
choices:['両側声帯膜様部中央','片側声帯前1/3','片側声帯膜様部中央','両側声帯後端','声帯全体'],
ans:2,exp:'声帯ポリープは通常片側の声帯膜様部（vocal fold membrane）の中央に好発する。発声外傷・出血が原因とされ、片側性・有茎性の形態が多い。'},

{id:77,cat:'disease',star:true,text:'3つの声帯疾患（声帯ポリープ・声帯結節・ポリープ様声帯）のうち、音声治療が第一選択になるのはどれか。',
choices:['声帯ポリープ','ポリープ様声帯','声帯結節','3つとも手術が第一選択','3つとも音声治療が第一選択'],

{id:78,cat:'disease',star:true,text:'ポリープ様声帯（polypoid cord）の発生に最も強く関与する因子はどれか。',

{id:79,cat:'disease',star:false,text:'軟口蓋麻痺のカーテン徴候（curtain sign）の説明として正しいのはどれか。',

ans:1,exp:'カーテン徴候：軟口蓋麻痺（反回神経・迷走神経麻痺）では、健側の咽頭収縮筋が収縮するため、発声時に咽頭後壁が健側へ引き寄せられる（カーテンがたなびくように見える）。'},

{id:80,cat:'nerve',star:true,text:'第Ⅰ脳神経（嗅神経）の性質はどれか。',

{id:81,cat:'nerve',star:true,text:'脳神経のうち純粋な運動性神経の組み合わせとして正しいのはどれか。',

ans:1,exp:'★三叉神経（Ⅴ）は混合性。感覚：顔面の知覚（1枝：眼、2枝：上顎、3枝：下顎・舌）。運動：咀嚼筋（咬筋・側頭筋・翼突筋）。'},

{id:83,cat:'nerve',star:true,text:'第Ⅺ脳神経（副神経）が支配する筋の組み合わせとして正しいのはどれか。',

{id:84,cat:'nerve',star:true,text:'第Ⅹ脳神経（迷走神経）の支配範囲として最も広い記述はどれか。',

ans:1,exp:'★迷走神経（Ⅹ）は最も広い支配域を持つ脳神経（混合性）。頸部〜胸部〜腹部の内臓まで支配し、「迷走」の名の通り広くさまよう。副交感・感覚・運動の3機能を持つ。'},

ans:3,exp:'甲状腺機能亢進症（バセドウ病）：頻脈・体重減少・発汗・眼球突出・甲状腺腫大が典型症状。「体重増加・浮腫」は甲状腺機能低下症（橋本病）の症状。'},

{id:86,cat:'disease',star:false,text:'甲状腺機能低下症と嗄声の関係として正しいのはどれか。',

{id:89,cat:'voice',star:false,text:'声区（register）のうち「おもて声・地声・脱声」とも呼ばれるのはどれか。',

{id:90,cat:'voice',star:false,text:'ファルセット（falsetto）発声時の声帯の状態として正しいのはどれか。',

{id:94,cat:'disease',star:false,text:'声帯嚢胞（cyst）の特徴として正しいのはどれか。',
choices:['両側対称性に生じ、音声治療が第一選択','片側性が多く、手術（内視鏡的摘出）が選択される','声帯膜様部中央の両側に生じる','喫煙との関連が最も強い','声帯全体が腫大する'],
ans:1,exp:'声帯嚢胞は片側性の嚢胞で、粘液貯留や後天性上皮嚢胞が多い。保存的治療の効果は乏しく、内視鏡的（マイクロサージェリー）摘出が選択される。'},

{id:95,cat:'disease',star:false,text:'再発性呼吸器乳頭腫症（RRP）の原因として正しいのはどれか。',
choices:['アデノウイルス（adenovirus）','ヒトパピローマウイルス（HPV：Human Papillomavirus）','エプスタイン・バーウイルス（EBV）','サイトメガロウイルス（CMV）','単純ヘルペスウイルス（HSV）'],
ans:1,exp:'再発性呼吸器乳頭腫症（RRP）はHPV（Human Papillomavirus）6型・11型が原因。喉頭に乳頭腫が再発性に生じ嗄声をきたす。'},

{id:96,cat:'disease',star:false,text:'声帯麻痺の原因として最も頻度の高いものはどれか。',
choices:['外傷（頸部手術後）','脳卒中（中枢性）','特発性（原因不明）','肺癌などの縦隔腫瘍','甲状腺癌の浸潤'],
ans:2,exp:'声帯麻痺の原因で最多は特発性（原因不明）、次いで手術後（甲状腺・食道・肺手術など）、悪性腫瘍による圧迫。左側麻痺が右側より多い（左反回神経の走行が長いため）。'},

{id:97,cat:'resp',star:false,text:'誤嚥性肺炎の好発部位として正しいのはどれか。',
choices:['右肺上葉','左肺上葉','右肺下葉（特に右S6）','両肺中葉','左肺下葉のみ'],
ans:2,exp:'誤嚥性肺炎は右肺下葉（特に右S6：下葉上区）に好発する。右主気管支が急角度で短いため、誤嚥物は右肺に流れやすい。STが関与する嚥下障害管理と直結する。'},

{id:98,cat:'disease',star:false,text:'接触性肉芽腫（contact granuloma）の好発部位はどれか。',
choices:['声帯膜様部中央','声帯前端部','披裂軟骨声帯突起部（後端）','声帯靱帯部','仮声帯部'],
ans:2,exp:'接触性肉芽腫は声帯後部（披裂軟骨声帯突起）に生じる良性肉芽腫。GERDや強い発声・咳が原因。LPR（喉頭咽頭逆流）との関連が大きい。'},

{id:99,cat:'voice',star:false,text:'音声治療の主な対象となる疾患・状態として適切でないのはどれか。',
choices:['声帯結節（機能的発声障害）','変声障害（Mutational dysphonia）','機能性失声（心因性）','両側反回神経麻痺の正中固定例','痙攣性発声障害（SD）のリハ補助'],
ans:3,exp:'両側反回神経麻痺の正中固定例は気道閉塞が最優先で、まず気道確保（気管切開）が必要。音声治療よりも外科的介入が先となる。他は音声治療の良い適応。'},

{id:100,cat:'disease',star:true,text:'痙攣性発声障害（SD：Spasmodic Dysphonia）の治療として現在最も有効とされるのはどれか。',
choices:['音声治療（発声訓練）のみ','抗コリン薬内服','ボツリヌス毒素（ボトックス）声帯内注射','甲状腺枠組み手術（タイプⅡ）','全身麻酔下での声帯切除'],
ans:2,exp:'★痙攣性発声障害（内転型SDが多い）の第一選択治療は声帯内へのボツリヌス毒素注射。過剰な内喉頭筋収縮を抑制し、音声を改善する。効果は3〜6か月で再注射が必要。'}
,

// ===== 補完問題（Q101〜Q125）=====

// スパイロメトリー・フローボリューム曲線（5問）
{id:101,cat:'resp',star:true,text:'スパイロメトリー（spirometry）で測定できる肺気量の組み合わせとして正しいのはどれか。',
choices:['残気量・機能的残気量・全肺気量','1回換気量・予備吸気量・予備呼気量・肺活量','残気量・全肺気量のみ','機能的残気量・全肺気量・残気量','肺活量・残気量・全肺気量'],
ans:1,exp:'★スパイロメーターで測定できる：1回換気量・予備吸気量・予備呼気量・肺活量・努力性肺活量・1秒量。測定できない：残気量（RV）・機能的残気量（FRC）・全肺気量（TLC）。これらはヘリウム希釈法や体プレチスモグラフィで測定。'},

{id:102,cat:'resp',star:true,text:'フローボリューム曲線（flow-volume curve）で閉塞性障害（COPDなど）の特徴として正しいのはどれか。',
choices:['曲線全体が左に偏位し、肺活量が低下する','呼気流速が全域で低下しスクープ状（凹型）になる','吸気流速のみが低下する','曲線の形は正常だが全体的に小さくなる','呼気・吸気ともに同程度に流速が低下する'],
ans:1,exp:'★閉塞性障害（COPD・喘息）のフローボリューム曲線：呼気流速が低下し、特に低肺気量域でスクープ状（下に凸の凹型）になる。拘束性障害は曲線の形は正常に近いが全体が小さくなる（肺活量低下）。'},

{id:103,cat:'resp',star:true,text:'努力性肺活量（FVC）に対する1秒量（FEV1.0）の割合を何というか。',
choices:['肺活量比','換気効率','1秒率（FEV1.0%）','最大換気量（MVV）','死腔率'],
ans:2,exp:'★1秒率（FEV1.0%）＝FEV1.0÷FVC×100。正常値は70%以上。70%未満で閉塞性障害と診断。COPDの診断基準に使われる。'},

{id:104,cat:'resp',star:false,text:'拘束性障害（間質性肺炎など）の呼吸機能検査の特徴として正しいのはどれか。',
choices:['1秒率が70%未満に低下する','肺活量が低下し、1秒率は正常〜上昇する','残気量のみが増加する','フローボリューム曲線がスクープ状になる','全ての肺気量が均等に増加する'],
ans:1,exp:'拘束性障害：肺活量（VC）が低下（%VC＜80%）、1秒率は正常〜上昇（肺が縮んでいるため）。間質性肺炎・胸膜疾患・神経筋疾患などで起こる。'},

{id:105,cat:'resp',star:false,text:'S/Z比（S-Z ratio）の説明として正しいのはどれか。',
choices:['/s/の持続時間を/z/の持続時間で割った値','MPTの男女比を示す指標','/z/の持続時間を/s/の持続時間で割った値','声門下圧と呼気流率の比','/a/と/s/の持続時間比'],
ans:0,exp:'S/Z比＝/s/持続時間÷/z/持続時間。正常は1.4以下。声帯に病変があると/z/が短くなりS/Z比が上昇（1.4超）。無侵襲で声帯機能を評価できる簡便な検査。'},

// 喉頭・咽頭疾患概論（5問）
{id:106,cat:'disease',star:true,text:'急性喉頭蓋炎（acute epiglottitis）で最も危険な合併症はどれか。',
choices:['嗄声の悪化','嚥下痛の増悪','急性気道閉塞による窒息','頸部リンパ節腫大','声帯ポリープの形成'],
ans:2,exp:'★急性喉頭蓋炎は喉頭蓋が急速に腫脹し気道を閉塞→窒息の危険。成人でも致死的になりうる。気道確保（気管挿管・気管切開）が最優先。'},

{id:107,cat:'disease',star:false,text:'クループ（croup）の主な原因と好発年齢として正しいのはどれか。',
choices:['細菌感染・成人に好発','ウイルス感染（パラインフルエンザウイルスなど）・乳幼児に好発','アレルギー・学童期に好発','真菌感染・免疫低下患者に好発','自己免疫・青年期に好発'],
ans:1,exp:'クループ（急性喉頭気管支炎）はパラインフルエンザウイルスなどが原因。乳幼児（6か月〜3歳）に好発。犬吠様咳嗽（バーバー様の咳）・吸気性喘鳴・嗄声が特徴。'},

{id:108,cat:'disease',star:false,text:'喉頭・咽頭疾患の分類として「神経性疾患」に該当するのはどれか。',
choices:['声帯ポリープ','声帯結節','喉頭癌','反回神経麻痺','機能性発声障害'],
ans:3,exp:'喉頭・咽頭疾患の分類：良性疾患（ポリープ・結節・嚢胞等）、悪性疾患（喉頭癌等）、機能性疾患（機能性発声障害等）、神経性疾患（反回神経麻痺・痙攣性発声障害等）。'},

{id:109,cat:'disease',star:false,text:'咽頭癌のうちSTの嚥下リハビリと最も関連が深い部位はどれか。',
choices:['上咽頭癌','中咽頭癌','下咽頭癌','口腔咽頭癌','鼻咽腔癌'],
ans:2,exp:'下咽頭癌は食道入口部に近く、手術後に嚥下障害・誤嚥が高頻度で生じる。STによる嚥下機能評価・リハビリが重要。下咽頭は梨状陥凹・輪状咽頭筋後壁・咽頭後壁からなる。'},

{id:110,cat:'disease',star:false,text:'声帯嚢胞（laryngeal cyst）と声帯ポリープの鑑別点として正しいのはどれか。',
choices:['嚢胞は両側性、ポリープは片側性','嚢胞は粘膜下の閉鎖腔に液体貯留、ポリープは粘膜の浮腫性隆起','嚢胞はGERDとの関連が強い','嚢胞は音声治療が第一選択','ポリープのみ手術適応となる'],
ans:1,exp:'声帯嚢胞は粘膜下に液体を含む閉鎖腔（嚢胞）が形成されたもの。声帯ポリープは粘膜の浮腫性隆起。嚢胞は内視鏡的摘出が必要で保存療法では改善しない。'},

// 機能性発声障害（5問）
{id:111,cat:'disease',star:true,text:'機能性発声障害（functional dysphonia）の種類として正しい組み合わせはどれか。',
choices:['心因性失声・過緊張性発声障害・変声障害','声帯ポリープ・結節・嚢胞','反回神経麻痺・痙攣性発声障害・変声障害','心因性失声・声帯ポリープ・嚢胞','声帯結節・変声障害・過緊張性発声障害'],
ans:0,exp:'★機能性発声障害：器質的病変なく発声障害をきたす。主な種類は①心因性失声（conversion aphonia）②過緊張性発声障害（hyperfunctional dysphonia）③変声障害（mutational dysphonia）。'},

{id:112,cat:'disease',star:true,text:'変声障害（mutational dysphonia）の特徴として正しいのはどれか。',
choices:['変声期前の小児に好発する','変声期後も高い声を使い続ける思春期男性に多い','変声期後も低い声から抜け出せない女性に多い','喉頭に器質的変化を伴う','甲状腺疾患が原因となる'],
ans:1,exp:'★変声障害（仮声変声）：変声期が終わりアンドロゲンで喉頭が大きくなったにもかかわらず、心理的要因等で変声前の高い声（仮声）を使い続ける状態。思春期〜青年期男性に多い。'},

{id:113,cat:'disease',star:false,text:'過緊張性発声障害（hyperfunctional dysphonia）の特徴として正しいのはどれか。',
choices:['声帯が開きすぎて気息性嗄声をきたす','喉頭筋群の過剰収縮により努力性の嗄声・絞り出すような声をきたす','発声時に声帯が全く動かない','声帯の弛緩による低音化が主症状','GERDのみが原因となる'],
ans:1,exp:'過緊張性発声障害：内喉頭筋・外喉頭筋の過剰収縮により、努力性・絞り出すような嗄声が特徴。声の酷使・心理的緊張が誘因。ボイスセラピー（発声リラクゼーション）が有効。'},

{id:114,cat:'disease',star:false,text:'心因性失声（conversion aphonia）で保たれる音声機能はどれか。',
choices:['会話時の発声のみ','歌声のみ保たれる','咳・笑い声・泣き声などの反射的音声','すべての音声が失われる','囁き声のみ保たれる'],
ans:2,exp:'心因性失声（転換性障害）：会話の発声はできないが、咳・笑い声・泣き声など反射的・不随意的音声は保たれる。これが器質性疾患との重要な鑑別点。ファイバーで声帯は正常。'},

{id:115,cat:'disease',star:false,text:'痙攣性発声障害（SD：Spasmodic Dysphonia）の内転型の特徴として正しいのはどれか。',
choices:['発声時に声帯が過度に開大し気息性嗄声をきたす','発声時に声帯が過度に内転し声が詰まる・途切れる嗄声をきたす','発声時の声帯振動が消失する','高音発声時にのみ症状が出る','変声期後の男性に限定して起こる'],
ans:1,exp:'内転型SD（最多）：発声時に内喉頭筋が過剰収縮→声帯が過度に閉じる→声が詰まる・途切れる嗄声（strangled voice）。外転型：声帯が過度に開大→気息性嗄声。ボツリヌス毒素注射が第一選択。'},

// 甲状腺疾患（5問）
{id:116,cat:'disease',star:true,text:'バセドウ病（Graves disease）の3主徴として正しいのはどれか。',
choices:['甲状腺腫大・頻脈・体重増加','甲状腺腫大・眼球突出・頻脈（動悸）','眼球突出・浮腫・便秘','甲状腺腫大・徐脈・体重減少','眼球陥凹・甲状腺萎縮・倦怠感'],
ans:1,exp:'★バセドウ病の3主徴：①甲状腺腫大②眼球突出③頻脈（動悸）。自己免疫疾患（TSH受容体抗体が刺激）。体重減少・発汗過多・手指振戦・下痢も伴う。甲状腺機能亢進症の代表。'},

{id:117,cat:'disease',star:true,text:'甲状腺癌のうち最も頻度が高い組織型はどれか。',
choices:['髄様癌','濾胞癌','未分化癌','乳頭癌','扁平上皮癌'],
ans:3,exp:'★甲状腺癌で最多は乳頭癌（約90%）。予後良好で10年生存率は95%以上。リンパ節転移は多いが遠隔転移は少ない。次いで濾胞癌。未分化癌は最も予後不良。'},

{id:118,cat:'disease',star:false,text:'橋本病（慢性甲状腺炎）の特徴として正しいのはどれか。',
choices:['甲状腺機能亢進が持続する自己免疫疾患','抗TPO抗体・抗サイログロブリン抗体が陽性の自己免疫性甲状腺炎','男性に圧倒的に多い疾患','眼球突出を主症状とする','TSH受容体刺激抗体が原因'],
ans:1,exp:'橋本病（慢性甲状腺炎）：抗TPO抗体・抗サイログロブリン抗体陽性の自己免疫疾患。中年女性に多い。甲状腺が徐々に破壊され甲状腺機能低下→粘液水腫・嗄声・浮腫・倦怠感。'},

{id:119,cat:'disease',star:false,text:'甲状腺手術（甲状腺全摘・亜全摘）後に最も注意すべき合併症はどれか。',
choices:['顔面神経麻痺','舌下神経麻痺','反回神経麻痺による嗄声・嚥下障害','舌咽神経麻痺','副神経麻痺'],
ans:2,exp:'甲状腺手術の重要合併症：反回神経麻痺（一側→嗄声、両側→気道閉塞）。反回神経が甲状腺の後内側を走行するため術中損傷リスクがある。術後の音声評価はSTの重要な役割。'},

{id:120,cat:'disease',star:false,text:'甲状腺機能低下時の食事指導として正しいのはどれか。',
choices:['カルシウムを多く含む食品を積極的に摂取する','ヨードを多く含む食品（昆布・わかめ等）を積極的に摂取する','高タンパク食を厳密に制限する','カリウムを制限する','水分を厳密に制限する'],
ans:1,exp:'甲状腺ホルモンの材料はヨード（ヨウ素）。甲状腺機能低下時はヨードを多く含む食品（昆布・わかめ・ひじき等の海藻類）の積極的摂取が推奨される。ただし過剰摂取は逆効果の場合も。'},

// 疾患・検査の補完（5問）
{id:121,cat:'disease',star:false,text:'喉頭ファイバースコピー（laryngofibroscopy）と喉頭ストロボスコピーの違いとして正しいのはどれか。',
choices:['ファイバーは声帯振動を、ストロボは声帯形態を観察する','ファイバーは声帯形態・動きを、ストロボは声帯振動・弾力性を観察する','ストロボは手術中にのみ使用される','ファイバーはX線を使用する検査である','ストロボは音声を録音するための装置である'],
ans:1,exp:'喉頭ファイバースコピー：軟性内視鏡で声帯の形態・色調・動きを直視。喉頭ストロボスコピー：断続光（ストロボ）で声帯振動をスロー映像として観察→弾力性・振動様式の評価。セットで行うことが多い。'},

{id:122,cat:'disease',star:false,text:'嚥下内視鏡検査（VE：videoendoscopy）と嚥下造影検査（VF：videofluoroscopy）の比較として正しいのはどれか。',
choices:['VEはX線被曝があるがVFはない','VEはベッドサイドで施行可能、VFは放射線室が必要','VFは食道の評価ができないがVEはできる','VEは造影剤を使用する','VFは声帯の観察が主目的である'],
ans:1,exp:'VE（嚥下内視鏡）：被曝なし・ベッドサイドで実施可能・声門上の直視が得意。VF（嚥下造影）：X線被曝あり・放射線室が必要・全嚥下過程を側面から観察可能。STが両方の結果を統合して評価する。'},

{id:123,cat:'disease',star:true,text:'誤嚥（aspiration）の定義として正しいのはどれか。',
choices:['食物が咽頭に詰まること','声門（声帯）より下（気管・肺）に食物・液体・分泌物が流入すること','食物が食道ではなく気管に入りかけること','鼻腔への逆流（鼻咽腔逆流）のこと','喉頭蓋が閉じないこと'],
ans:1,exp:'★誤嚥＝声門より下（気管・肺）に食物・液体・分泌物が流入すること。喉頭侵入（penetration）は声門上への侵入で誤嚥より軽度。誤嚥性肺炎はSTが関わる最重要合併症。'},

{id:124,cat:'disease',star:false,text:'不顕性誤嚥（silent aspiration）の説明として正しいのはどれか。',

let questions = [];
let currentIdx = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = [];
let activeFilter = 'all';
let order = 'sequential';

function startQuiz() {
  order = document.getElementById('order-select').value;
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  initQuiz();
}

function initQuiz() {
  questions = filterQuestions(activeFilter);
  if (order === 'random') {
    questions = [...questions].sort(() => Math.random() - 0.5);
  }
  currentIdx = 0;
  correctCount = 0;
  wrongCount = 0;
  answered = new Array(questions.length).fill(false);
  document.getElementById('result-screen').style.display = 'none';
  renderQuestion();
}

function filterQuestions(filter) {
  if (filter === 'all') return [...ALL_QUESTIONS];
  if (filter === 'star') return ALL_QUESTIONS.filter(q => q.star);
  return ALL_QUESTIONS.filter(q => q.cat === filter);
}

function setFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  initQuiz();
}

function renderQuestion() {
  if (currentIdx >= questions.length) {
    showResult();
    return;
  }
  const q = questions[currentIdx];
  const total = questions.length;
  document.getElementById('status-text').textContent = `問題 ${currentIdx + 1} / ${total}`;
  document.getElementById('correct-count').textContent = correctCount;
  document.getElementById('wrong-count').textContent = wrongCount;
  document.getElementById('progress-bar').style.width = `${(currentIdx / total) * 100}%`;

  let choicesHTML = q.choices.map((c, i) =>
    `<li><button onclick="answer(${i})" id="btn-${i}">${i+1}. ${c}</button></li>`
  ).join('');

  document.getElementById('q-container').innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">Q${q.id}</span>
        ${q.star ? '<span class="star">★国試頻出</span>' : ''}
        <span style="color:#aab">[${catLabel(q.cat)}]</span>
      </div>
      <div class="q-text">${q.text}</div>
      <ul class="choices">${choicesHTML}</ul>
      <div class="explanation" id="exp-box">${q.exp}</div>
      <div class="nav-btns">
        <button class="btn btn-secondary" onclick="skip()" id="skip-btn">スキップ</button>
      </div>
    </div>`;
}

function catLabel(cat) {
  const map = {oral:'口腔・咽頭', resp:'呼吸器', larynx:'喉頭', voice:'発声', disease:'疾患', nerve:'神経'};
  return map[cat] || cat;
}

function answer(idx) {
  const q = questions[currentIdx];
  const btns = document.querySelectorAll('.choices button');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add('correct');
    else if (i === idx && idx !== q.ans) b.classList.add('wrong');
  });
  if (idx === q.ans) correctCount++;
  else wrongCount++;
  document.getElementById('exp-box').classList.add('show');
  document.getElementById('skip-btn').textContent = '次の問題 →';
  document.getElementById('skip-btn').onclick = next;
}

function skip() { next(); }
function next() {
  currentIdx++;
  renderQuestion();
}

function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';
  const total = questions.length;
  const pct = Math.round((correctCount / total) * 100);
  document.getElementById('score-display').textContent = `${correctCount}点`;
  document.getElementById('score-sub').textContent = `/ ${total}問中（正答率 ${pct}%）`;
  let msg = '';
  if (pct >= 90) msg = '🌟 完璧です！期末も自信を持って！';
  else if (pct >= 80) msg = '👏 かなりいい感じ！苦手な問題を重点的に復習しよう。';
  else if (pct >= 70) msg = '📚 もう少し！フィルターで苦手カテゴリだけ集中練習しよう。';
  else msg = '💪 基礎に戻って復習しよう。インタビューの頻出ポイントをもう一度！';
  document.getElementById('result-msg').textContent = msg;
}

function restartQuiz() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  initQuiz();
}

// 初期化
</script>
