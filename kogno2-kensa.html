<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高次脳機能障害学Ⅱ 検査一覧 試験対策</title>
<style>
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#1b2a29; --sub:#5b6b69; --line:#d9e1df;
  --pri:#1f6f6b; --pri-ink:#ffffff; --star:#b9770e; --ok:#23703f; --ok-bg:#e4f3e9;
  --ng:#a8342d; --ng-bg:#fbe9e7; --note:#8a5a00; --note-bg:#fff3d6; --blank:#d7ece9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121a19; --card:#1a2524; --ink:#e6efed; --sub:#9bb0ac; --line:#2e3e3c;
    --pri:#4fb3ac; --pri-ink:#0b1514; --star:#e0a443; --ok:#6fd199; --ok-bg:#183326;
    --ng:#ff8f86; --ng-bg:#3a1f1c; --note:#f0c36b; --note-bg:#33280f; --blank:#244744;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
  line-height:1.7;font-size:16px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:720px;margin:0 auto;padding:16px 14px 150px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1{font-size:1.45rem;margin:0;line-height:1.35}
.lead{margin:.2rem 0 0;color:var(--sub);font-size:.9rem}
.sec{font-size:1.05rem;margin:26px 0 10px}
.top{padding:6px 2px 4px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.cats{grid-template-columns:1fr}}
.cat{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:8px solid var(--c);border-radius:12px;padding:14px 14px 12px;min-height:118px;display:flex;flex-direction:column}
.cat:hover{border-color:var(--c)}
.cat .nm{font-size:1.15rem;font-weight:700;line-height:1.35}
.cat .sb{font-size:.8rem;color:var(--sub);margin-top:4px;flex:1}
.cat .ct{font-size:.85rem;margin-top:8px;display:flex;justify-content:space-between}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--pri))}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{flex:1 1 auto;min-width:110px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.mode[disabled]{opacity:.4;cursor:default}
.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.more{grid-template-columns:1fr}}
.more .cat{min-height:0;border-left-width:4px;border-left-color:var(--sub)}
.more .cat .nm{font-size:1rem}
.foot{margin-top:30px;text-align:center}
.link{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:.85rem}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.ttl{font-weight:700;flex:1;font-size:.95rem}
.prog{font-size:.85rem;color:var(--sub);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--sub);background:none}
.chip.flagbtn{border-color:var(--star);color:var(--note);background:var(--note-bg);font-weight:700}
.qtext{font-size:1.05rem;font-weight:600;margin:4px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--card);
  border:1.5px solid var(--line);border-radius:10px}
.opt .n{flex:none;font-weight:700;color:var(--pri)}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.opt[disabled]{cursor:default}
.orow.struck .opt .t{text-decoration:line-through;opacity:.45}
.elim{flex:none;width:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--sub);font-size:1.1rem}
.orow.struck .elim{background:var(--ng-bg);color:var(--ng);border-color:var(--ng)}
.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;border:1.5px solid var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.small{padding:7px 14px;font-size:.88rem}
.btn[disabled]{opacity:.4;cursor:default}
.res{margin-top:14px;padding:10px 14px;border-radius:10px;font-weight:700}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.ng{background:var(--ng-bg);color:var(--ng)}
.exp{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.flag{display:block;margin-top:8px;padding:6px 10px;border-radius:6px;background:var(--note-bg);color:var(--note);font-size:.82rem}
.hint{font-size:.8rem;color:var(--sub);margin:8px 0 0}
.score{font-size:2.2rem;font-weight:800;color:var(--pri);margin:4px 0}
.wlist{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wlist li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem;background:var(--card)}
.wlist .a{color:var(--ok);font-weight:700;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.88rem}
.tab.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--pri));border-radius:12px;padding:12px 14px;margin-bottom:12px}
.tcard .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:700;font-size:1.02rem}
.tcard .ab{color:var(--sub);font-weight:600;font-size:.9rem}
.tcard .bd{margin-top:6px;font-size:.98rem}
.blank{display:inline-block;min-width:3.2em;margin:0 2px;padding:0 8px;border:none;border-bottom:2px solid var(--pri);
  background:var(--blank);color:transparent;border-radius:4px 4px 0 0;user-select:none;line-height:1.6;text-align:center}
.blank.done{color:var(--ink);background:var(--ok-bg);border-bottom-color:var(--ok);font-weight:700}
.blank.miss{color:var(--ink);background:var(--ng-bg);border-bottom-color:var(--ng);font-weight:700}
.blank.target{color:var(--pri);background:var(--blank);font-weight:800}
.given{border-bottom:1px dotted var(--sub);color:var(--sub)}
.kub{font-size:.75rem;color:var(--sub);margin-left:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--pri);
  box-shadow:0 -6px 24px rgba(0,0,0,.25);max-height:75vh;overflow:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:none}
#sheet .in{max-width:720px;margin:0 auto}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.shx{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px}
/* table (間違い探し/原表) */
.dom{font-weight:700;margin:16px 0 8px;font-size:1rem}
.trow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cellb{display:inline-flex;align-items:baseline;gap:6px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:4px 9px;margin:2px 4px 2px 0;max-width:100%}
.cellb .nb{font-size:.72rem;color:var(--sub);flex:none;min-width:1.6em}
.cellb.body{display:flex;width:100%;margin:6px 0 0;padding:8px 10px}
.cellb:hover{border-color:var(--pri)}
.cellb.ok{border-color:var(--ok);background:var(--ok-bg)}
.cellb.half{border-color:var(--star);background:var(--note-bg)}
.cellb.fa{border-color:var(--ng);border-style:dashed;background:var(--ng-bg)}
.cellb.miss{border-color:var(--star);background:var(--note-bg)}
.cellb.static{cursor:default}
.fix{display:block;font-size:.85rem;color:var(--ok);margin-top:4px}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;margin-bottom:8px}
.sum b{color:var(--pri)}
.quote{padding:10px 12px;border-left:4px solid var(--line);background:var(--bg);border-radius:6px;margin:6px 0 10px;font-size:.95rem}
/* ROC */
.t2{border-collapse:collapse;margin:8px 0;font-size:.9rem}
.t2 th,.t2 td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.t2 th{background:var(--bg);font-weight:600}
.inp{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.inp label{display:flex;flex-direction:column;font-size:.85rem;color:var(--sub);gap:2px}
.inp input{font:inherit;font-size:1.1rem;width:8.5em;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.steps{margin:6px 0 0;padding-left:1.2em;font-size:.92rem}
.small{font-size:.85rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="in" id="sheetin"></div></div>
<script>

を行う。"},"B":{"name":"{B10}","abbr":"BVRT","body":"複数の図形の模写、および{B11}する。計 10問。正解数と{B12}による採点を行う。"},"note":null},{"id":"t05","dom":"d2","kubun":"","ref":null,"orig":{"name":"標準高次視知覚検査","abbr":"VPTA","body":"視知覚の基本機能、物品・画像の視覚認知、相貌認知、色彩、地誌的見当識などを総合的に評価する。各検査項目の障害パターンの分析を行う。"},"A":{"name":"標準高次視知覚検査","abbr":"{A9}","body":"視知覚の基本機能、物品・画像の視覚認知、相貌認知、色彩、地誌的見当識などを総合的に評価する。各検査項目の障害パターンの分析を行う。"},"B":{"name":"{B13}","abbr":"VPTA","body":"視知覚の基本機能、物品・画像の視覚認知、{B14}、色彩、{B15}などを総合的に評価する。各検査項目の{B16}の分析を行う。"},"note":null},{"id":"t06","dom":"d2","kubun":"","ref":null,"orig":{"name":"行動性無視検査","abbr":"BIT","body":"通常検査（抹消、模写、二等分、描画）が 146点満点、行動検査が 81点満点。通常検査のカットオフ点は 131/132点。"},"A":{"name":"行動性無視検査","abbr":"{A10}","body":"通常検査（抹消、模写、二等分、描画）が{A11}点満点、行動検査が{A12}点満点。通常検査のカットオフ点は{A13}点。"},"B":{"name":"{B17}","abbr":"BIT","body":"{B18}（抹消、模写、{B19}、描画）が 146点満点、{B20}が 81点満点。通常検査のカットオフ点は 131/132点。"},"note":null},{"id":"t07","dom":"d2","kubun":"","ref":null,"orig":{"name":"Catherine Bergego scale","abbr":"CBS","body":"半側空間無視について生活場面の観察尺度によって評価する。"},"A":{"name":"Catherine Bergego scale","abbr":"{A14}","body":"半側空間無視について生活場面の観察尺度によって評価する。"},"B":{"name":"{B21}","abbr":"CBS","body":"半側空間無視について{B22}の観察尺度によって評価する。"},"note":null},{"id":"t08","dom":"d3","kubun":"","ref":null,"orig":{"name":"ウェクスラー記憶検査","abbr":"WMS-R","body":"言語性記憶、視覚性記憶、一般的記憶、注意/集中力、遅延再生について総合的に評価する。年代別の指標に照らし合わせ、健常者平均を 100点とし、15点を標準偏差とする。"},"A":{"name":"ウェクスラー記憶検査","abbr":"{A15}","body":"言語性記憶、視覚性記憶、一般的記憶、注意/集中力、遅延再生について総合的に評価する。年代別の指標に照らし合わせ、健常者平均を{A16}点とし、{A17}点を標準偏差とする。"},"B":{"name":"{B23}","abbr":"WMS-R","body":"言語性記憶、視覚性記憶、一般的記憶、注意/集中力、{B24}について総合的に評価する。年代別の指標に照らし合わせ、健常者平均を 100点とし、15点を標準偏差とする。"},"note":null},{"id":"t09","dom":"d3","kubun":"","ref":null,"orig":{"name":"日本版リバーミード行動記憶検査","abbr":"RBMT","body":"展望記憶を含む、日常生活における記憶を総合的に評価する。スクリーニング点と標準プロフィール点が算出され、年代別にカットオフ値が示されている。"},"A":{"name":"日本版リバーミード行動記憶検査","abbr":"{A18}","body":"展望記憶を含む、日常生活における記憶を総合的に評価する。スクリーニング点と標準プロフィール点が算出され、年代別にカットオフ値が示されている。"},"B":{"name":"{B25}","abbr":"RBMT function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);

  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}

  } else {
    const Dn=Math.round(p.tp/p.s), H=p.N-Dn, fp=p.pos-p.tp, tn=H-fp;
    q=p.N+'人の、ある障害が疑われる集団を、感度'+Math.round(p.s*100)+'%の検査でスクリーニングしたところ、'+p.pos+'人が検査陽性であった。この'+p.pos+'人に精密検査をしたところ、'+p.tp+'人がその障害を有していた。特異度（小数第2位まで）と、見逃された人数を求めよ。';
    fields=[['特異度'],['見逃された人数（整数）']]; ans=[tn/H,Dn-p.tp];
    steps=['障害あり＝'+p.tp+'÷'+p.s+'＝'+Dn+'人','障害なし＝'+p.N+'－'+Dn+'＝'+H+'人','偽陽性＝'+p.pos+'－'+p.tp+'＝'+fp+'人','真陰性＝'+H+'－'+fp+'＝'+tn+'人','特異度＝'+tn+'／'+H+'＝'+f2(ans[0]),'見逃し（偽陰性）＝'+Dn+'－'+p.tp+'＝'+(Dn-p.tp)+'人'];
  }
  const inputs=fields.map(([l])=>h('input',{type:'text',inputmode:'decimal',autocomplete:'off','aria-label':l}));
  const resBox=h('div',{}); const act=h('div',{class:'act'}); let done=false;
  const check=h('button',{class:'btn',onclick:()=>{ if(done) return;
    const vals=inputs.map(i=>parseFloat(i.value.replace(/[０-９．]/g,ch=>ch==='．'?'.':String.fromCharCode(ch.charCodeAt(0)-65248)).replace(/,/g,'.')));
    if(vals.some(v=>isNaN(v))){ resBox.replaceChildren(h('div',{class:'res ng'},'すべての欄に数値を入力してください')); return; }
    done=true; const marks=vals.map((v,k)=>k===1&&p.t==='B'?Math.abs(v-ans[k])<1e-9:Math.abs(Math.round(v*100)/100-Math.round(ans[k]*100)/100)<1e-9);
    const all=marks.every(Boolean); if(all) R.ok++;
    S.roc[R.title+'|'+R.i+'|'+p.src]=all?'o':'x'; save();
    resBox.replaceChildren(h('div',{class:'res '+(all?'ok':'ng')},(all?'正解　':'不正解　')+fields.map((f,k)=>f[0]+'：'+(marks[k]?'○':'×')+'（正答 '+(k===1&&p.t==='B'?ans[k]:f2(ans[k]))+'）').join('　')),
      h('div',{class:'exp'},h('ol',{class:'steps'},steps.map(s=>h('li',{},s)))));
    act.replaceChildren(h('button',{class:'btn',onclick:()=>{R.i++; if(R.i<R.list.length) renderRoc(); else rocResult();}},R.i+1<R.list.length?'次の問題へ':'結果を見る'));
  }},'答え合わせ');
  act.append(check);
  mount(h('div',{class:'nav'},h('button',{class:'back',onclick:()=>{if(R.i===0||confirm('中断しますか？'))rocMenu();}},'← 戻る'),h('span',{class:'ttl'},R.title),h('span',{class:'prog'},(R.i+1)+' / '+R.list.length)),
    h('div',{class:'card'},h('div',{class:'chips'},h('span',{class:'chip'},p.src),h('span',{class:'chip'},p.t==='A'?'型A：人数から求める':'型B：逆算')),h('div',{class:'qtext'},q),
      h('div',{class:'inp'},fields.map(([l],k)=>h('label',{},l,inputs[k]))),act,resBox));
}
function rocResult(){
  mount(h('div',{class:'nav'},h('span',{class:'ttl'},R.title+' の結果')),h('div',{class:'card'},h('div',{},R.list.length+'問中'),h('div',{class:'score'},R.ok+'問正解'),
    h('div',{class:'act'},h('button',{class:'btn',onclick:rocMenu},'ROC計算メニューへ'),h('button',{class:'btn ghost',onclick:home},'ホームへ'))));
}
home();
</script>
