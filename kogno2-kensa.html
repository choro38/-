<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>高次脳機能障害学Ⅱ 検査一覧 試験対策</title>
<style>
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#1b2a29; --sub:#5b6b69; --line:#d9e1df;
  --pri:#1f6f6b; --pri-ink:#ffffff; --star:#b9770e; --ok:#23703f; --ok-bg:#e4f3e9;
  --ng:#a8342d; --ng-bg:#fbe9e7; --note:#8a5a00; --note-bg:#fff3d6; --blank:#d7ece9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121a19; --card:#1a2524; --ink:#e6efed; --sub:#9bb0ac; --line:#2e3e3c;
    --pri:#4fb3ac; --pri-ink:#0b1514; --star:#e0a443; --ok:#6fd199; --ok-bg:#183326;
    --ng:#ff8f86; --ng-bg:#3a1f1c; --note:#f0c36b; --note-bg:#33280f; --blank:#244744;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
  line-height:1.7;font-size:16px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:720px;margin:0 auto;padding:16px 14px 150px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
h1{font-size:1.45rem;margin:0;line-height:1.35}
.lead{margin:.2rem 0 0;color:var(--sub);font-size:.9rem}
.sec{font-size:1.05rem;margin:26px 0 10px}
.top{padding:6px 2px 4px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.cats{grid-template-columns:1fr}}
.cat{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:8px solid var(--c);border-radius:12px;padding:14px 14px 12px;min-height:118px;display:flex;flex-direction:column}
.cat:hover{border-color:var(--c)}
.cat .nm{font-size:1.15rem;font-weight:700;line-height:1.35}
.cat .sb{font-size:.8rem;color:var(--sub);margin-top:4px;flex:1}
.cat .ct{font-size:.85rem;margin-top:8px;display:flex;justify-content:space-between}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--pri))}
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{flex:1 1 auto;min-width:110px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.mode[disabled]{opacity:.4;cursor:default}
.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.more{grid-template-columns:1fr}}
.more .cat{min-height:0;border-left-width:4px;border-left-color:var(--sub)}
.more .cat .nm{font-size:1rem}
.foot{margin-top:30px;text-align:center}
.link{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:.85rem}
.nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.ttl{font-weight:700;flex:1;font-size:.95rem}
.prog{font-size:.85rem;color:var(--sub);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--sub);background:none}
.chip.flagbtn{border-color:var(--star);color:var(--note);background:var(--note-bg);font-weight:700}
.qtext{font-size:1.05rem;font-weight:600;margin:4px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--card);
  border:1.5px solid var(--line);border-radius:10px}
.opt .n{flex:none;font-weight:700;color:var(--pri)}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.opt[disabled]{cursor:default}
.orow.struck .opt .t{text-decoration:line-through;opacity:.45}
.elim{flex:none;width:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--sub);font-size:1.1rem}
.orow.struck .elim{background:var(--ng-bg);color:var(--ng);border-color:var(--ng)}
.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;border:1.5px solid var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--pri)}
.btn.small{padding:7px 14px;font-size:.88rem}
.btn[disabled]{opacity:.4;cursor:default}
.res{margin-top:14px;padding:10px 14px;border-radius:10px;font-weight:700}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.ng{background:var(--ng-bg);color:var(--ng)}
.exp{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.flag{display:block;margin-top:8px;padding:6px 10px;border-radius:6px;background:var(--note-bg);color:var(--note);font-size:.82rem}
.hint{font-size:.8rem;color:var(--sub);margin:8px 0 0}
.score{font-size:2.2rem;font-weight:800;color:var(--pri);margin:4px 0}
.wlist{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wlist li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem;background:var(--card)}
.wlist .a{color:var(--ok);font-weight:700;margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.88rem}
.tab.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tcard{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--pri));border-radius:12px;padding:12px 14px;margin-bottom:12px}
.tcard .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-weight:700;font-size:1.02rem}
.tcard .ab{color:var(--sub);font-weight:600;font-size:.9rem}
.tcard .bd{margin-top:6px;font-size:.98rem}
.blank{scroll-margin-top:90px;display:inline-block;min-width:3.2em;margin:0 2px;padding:0 8px;border:none;border-bottom:2px solid var(--pri);
  background:var(--blank);color:transparent;border-radius:4px 4px 0 0;user-select:none;line-height:1.6;text-align:center}
.blank.done{color:var(--ink);background:var(--ok-bg);border-bottom-color:var(--ok);font-weight:700}
.blank.miss{color:var(--ink);background:var(--ng-bg);border-bottom-color:var(--ng);font-weight:700}
.blank.target{color:var(--pri);background:var(--blank);font-weight:800}
.given{border-bottom:1px dotted var(--sub);color:var(--sub)}
.kub{font-size:.75rem;color:var(--sub);margin-left:4px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--pri);
  box-shadow:0 -6px 24px rgba(0,0,0,.25);max-height:75vh;overflow:auto;padding:12px 14px calc(14px + env(safe-area-inset-bottom));display:none}
#sheet .in{max-width:720px;margin:0 auto}
#sheet .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.shx{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 12px}
/* table (間違い探し/原表) */
.dom{font-weight:700;margin:16px 0 8px;font-size:1rem}
.trow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cellb{display:inline-flex;align-items:baseline;gap:6px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:4px 9px;margin:2px 4px 2px 0;max-width:100%}
.cellb .nb{font-size:.72rem;color:var(--sub);flex:none;min-width:1.6em}
.cellb.body{display:flex;width:100%;margin:6px 0 0;padding:8px 10px}
.cellb:hover{border-color:var(--pri)}
.cellb.ok{border-color:var(--ok);background:var(--ok-bg)}
.cellb.half{border-color:var(--star);background:var(--note-bg)}
.cellb.fa{border-color:var(--ng);border-style:dashed;background:var(--ng-bg)}
.cellb.miss{border-color:var(--star);background:var(--note-bg)}
.cellb.static{cursor:default}
.fix{display:block;font-size:.85rem;color:var(--ok);margin-top:4px}
.sum{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;margin-bottom:8px}
.sum b{color:var(--pri)}
.quote{padding:10px 12px;border-left:4px solid var(--line);background:var(--bg);border-radius:6px;margin:6px 0 10px;font-size:.95rem}
/* ROC */
.t2{border-collapse:collapse;margin:8px 0;font-size:.9rem}
.t2 th,.t2 td{border:1px solid var(--line);padding:4px 10px;text-align:center}
.t2 th{background:var(--bg);font-weight:600}
.inp{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.inp label{display:flex;flex-direction:column;font-size:.85rem;color:var(--sub);gap:2px}
.inp input{font:inherit;font-size:1.1rem;width:8.5em;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.steps{margin:6px 0 0;padding-left:1.2em;font-size:.92rem}
.small{font-size:.85rem}
.fc-wrap{perspective:1400px;margin:12px 0}
.fc{display:grid;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s ease;-webkit-tap-highlight-color:transparent}
.fc.flip{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.face.back{transform:rotateY(180deg)}
.face.front{justify-content:center;align-items:center;text-align:center}
.fcbig{font-size:clamp(2.4rem,11vw,3.4rem);font-weight:800;letter-spacing:.02em;line-height:1.15;word-break:break-all}
.fcjp{font-size:1.55rem;font-weight:800;line-height:1.4}
.fchint{font-size:.8rem;color:var(--sub);margin-top:14px}
.fcx{font-size:.9rem;border-top:1px solid var(--line);padding-top:8px}
.fcx ul{margin:4px 0 0;padding-left:1.2em}
.fcbar{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
.fcbar .btn{flex:1}
.btn.ng{border-color:var(--ng);color:var(--ng);background:transparent}
.fcrow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:6px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.fcell{text-align:left;background:none;border:none;padding:4px 6px;border-bottom:2px solid transparent;font-size:.98rem;border-radius:4px;line-height:1.5}
.fcell.fcab{font-weight:800}
.fcell.hid{color:transparent;background:var(--blank);border-bottom-color:var(--pri)}
.fcfull{grid-column:1/-1;color:var(--sub)}
@media (prefers-reduced-motion: reduce){.fc{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="in" id="sheetin"></div></div>
<script>
const D = {"domains":[{"id":"d1","name":"行為・構成","sub":"動作・構成の検査（SPTA・コース・ROCFT・BVRT）","color":"#1f6f6b"},{"id":"d2","name":"視空間認知","sub":"視知覚・無視の検査（VPTA・BIT・CBS）","color":"#2f6fa3"},{"id":"d3","name":"記憶","sub":"記憶の検査（WMS-R・RBMT・三宅式・RAVLT）","color":"#9a5a1a"},{"id":"d4","name":"注意","sub":"注意・前頭葉の検査（CAT・TMT・FAB・RSABほか）","color":"#7a4a8c"},{"id":"d5","name":"遂行機能","sub":"遂行機能の検査（BADS・WCST・IGT・DEX）","color":"#a8342d"},{"id":"d6","name":"意欲","sub":"意欲の検査（やる気スコア・CAS）","color":"#b9770e"},{"id":"d7","name":"知的機能","sub":"知能の検査（WAIS-Ⅳ・RCPM）","color":"#3a7d44"},{"id":"d8","name":"認知症","sub":"認知症の検査（MMSE・HDS-R・MoCA・NPI・CDR・FAST）","color":"#555f8c"}],"tests":[{"id":"t01","dom":"d1","kubun":"","ref":null,"orig":{"name":"標準高次動作性検査","abbr":"SPTA","body":"顔面・上肢の模倣や物品を使う動作、描画、積み木など総合的に評価する。誤りが多い検査項目や誤り方の分析を行う。"},"A":{"name":"標準高次動作性検査","abbr":"{A1}","body":"顔面・上肢の模倣や物品を使う動作、描画、積み木など総合的に評価する。誤りが多い検査項目や誤り方の分析を行う。"},"B":{"name":"{B1}","abbr":"SPTA","body":"顔面・上肢の模倣や物品を使う動作、描画、{B2}など総合的に評価する。誤りが多い検査項目や{B3}の分析を行う。"},"note":null},{"id":"t02","dom":"d1","kubun":"","ref":null,"orig":{"name":"コース立方体組み合わせ検査","abbr":"―","body":"各面4色で塗り分けられた立方体を提示された模様図版通りに並べる検査。17問があり、各問の解答に要した時間により採点する。素点とIQが算出できる。"},"A":{"name":"コース立方体組み合わせ検査","abbr":"―","body":"各面{A2}色で塗り分けられた立方体を提示された模様図版通りに並べる検査。{A3}問があり、各問の解答に要した時間により採点する。素点とIQが算出できる。"},"B":{"name":"{B4}","abbr":"―","body":"各面4色で塗り分けられた立方体を提示された{B5}通りに並べる検査。17問があり、各問の{B6}により採点する。素点と{B7}が算出できる。"},"note":null},{"id":"t03","dom":"d1","kubun":"","ref":null,"orig":{"name":"レイの複雑図形検査","abbr":"ROCFT","body":"複雑な図形を模写、および遅延再生する。18部分について採点基準がある、36点満点。"},"A":{"name":"レイの複雑図形検査","abbr":"{A4}","body":"複雑な図形を模写、および遅延再生する。{A5}部分について採点基準がある、{A6}点満点。"},"B":{"name":"{B8}","abbr":"ROCFT","body":"複雑な図形を模写、および{B9}する。18部分について採点基準がある、36点満点。"},"note":null},{"id":"t04","dom":"d1","kubun":"","ref":null,"orig":{"name":"ベントン視覚記銘検査","abbr":"BVRT","body":"複数の図形の模写、および遅延再生する。計 10問。正解数と誤謬数による採点を行う。"},"A":{"name":"ベントン視覚記銘検査","abbr":"{A7}","body":"複数の図形の模写、および遅延再生する。計{A8}問。正解数と誤謬数による採点を行う。"},"B":{"name":"{B10}","abbr":"BVRT","body":"複数の図形の模写、および{B11}する。計 10問。正解数と{B12}による採点を行う。"},"note":null},{"id":"t05","dom":"d2","kubun":"","ref":null,"orig":{"name":"標準高次視知覚検査","abbr":"VPTA","body":"視知覚の基本機能、物品・画像の視覚認知、相貌認知、色彩、地誌的見当識などを総合的に評価する。各検査項目の障害パターンの分析を行う。"},"A":{"name":"標準高次視知覚検査","abbr":"{A9}","body":"視知覚の基本機能、物品・画像の視覚認知、相貌認知、色彩、地誌的見当識などを総合的に評価する。各検査項目の障害パターンの分析を行う。"},"B":{"name":"{B13}","abbr":"VPTA","body":"視知覚の基本機能、物品・画像の視覚認知、{B14}、色彩、{B15}などを総合的に評価する。各検査項目の{B16}の分析を行う。"},"note":null},{"id":"t06","dom":"d2","kubun":"","ref":null,"orig":{"name":"行動性無視検査","abbr":"BIT","body":"通常検査（抹消、模写、二等分、描画）が 146点満点、行動検査が 81点満点。通常検査のカットオフ点は 131/132点。"},"A":{"name":"行動性無視検査","abbr":"{A10}","body":"通常検査（抹消、模写、二等分、描画）が{A11}点満点、行動検査が{A12}点満点。通常検査のカットオフ点は{A13}点。"},"B":{"name":"{B17}","abbr":"BIT","body":"{B18}（抹消、模写、{B19}、描画）が 146点満点、{B20}が 81点満点。通常検査のカットオフ点は 131/132点。"},"note":null},{"id":"t07","dom":"d2","kubun":"","ref":null,"orig":{"name":"Catherine Bergego scale","abbr":"CBS","body":"半側空間無視について生活場面の観察尺度によって評価する。"},"A":{"name":"Catherine Bergego scale","abbr":"{A14}","body":"半側空間無視について生活場面の観察尺度によって評価する。"},"B":{"name":"{B21}","abbr":"CBS","body":"半側空間無視について{B22}の観察尺度によって評価する。"},"note":null},{"id":"t08","dom":"d3","kubun":"","ref":null,"orig":{"name":"ウェクスラー記憶検査","abbr":"WMS-R","body":"言語性記憶、視覚性記憶、一般的記憶、注意/集中力、遅延再生について総合的に評価する。年代別の指標に照らし合わせ、健常者平均を 100点とし、15点を標準偏差とする。"},"A":{"name":"ウェクスラー記憶検査","abbr":"{A15}","body":"言語性記憶、視覚性記憶、一般的記憶、注意/集中力、遅延再生について総合的に評価する。年代別の指標に照らし合わせ、健常者平均を{A16}点とし、{A17}点を標準偏差とする。"},"B":{"name":"{B23}","abbr":"WMS-R","body":"言語性記憶、視覚性記憶、一般的記憶、注意/集中力、{B24}について総合的に評価する。年代別の指標に照らし合わせ、健常者平均を 100点とし、15点を標準偏差とする。"},"note":null},{"id":"t09","dom":"d3","kubun":"","ref":null,"orig":{"name":"日本版リバーミード行動記憶検査","abbr":"RBMT","body":"展望記憶を含む、日常生活における記憶を総合的に評価する。スクリーニング点と標準プロフィール点が算出され、年代別にカットオフ値が示されている。"},"A":{"name":"日本版リバーミード行動記憶検査","abbr":"{A18}","body":"展望記憶を含む、日常生活における記憶を総合的に評価する。スクリーニング点と標準プロフィール点が算出され、年代別にカットオフ値が示されている。"},"B":{"name":"{B25}","abbr":"RBMT function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}

function parseIn(str,f){

  if(!t) return {err:'すべての欄に数値を入力してください'};
  if(/[%％]/.test(t)) return {err:'％は使わず、小数で入力してください（例：90％ → 0.90）'};
  if(!/^(\d+\.?\d*|\.\d+)$/.test(t)) return {err:'数値で入力してください'};
  const v=parseFloat(t);
  if(f.int){ if(!isInt(v)) return {err:'人数は整数で入力してください'}; return {v:Math.round(v)}; }
  if((t.split('.')[1]||'').length>2) return {err:'小数第2位までで入力してください（四捨五入）'};
  if(v>1) return {err:'0〜1の小数で入力してください（例：0.90）'};
  return {v};
}

      h('div',{class:'act'},R.wrong.length?h('button',{class:'btn',onclick:()=>startRoc(R.wrong.slice(),'間違えた問題',R.mode)},'間違いだけやり直す（'+R.wrong.length+'）'):null,
        h('button',{class:'btn ghost',onclick:rocMenu},'ROC計算メニューへ'),h('button',{class:'btn ghost',onclick:home},'ホームへ')))];
  if(R.wrong.length){ const ul=h('ul',{class:'wlist'}); R.wrong.forEach(p=>ul.append(h('li',{},h('div',{},p.src+'（型：'+{T:'2×2表・人数から',A:'人数から',B:'特異度を逆算',R:'感度を逆算',X:'2×2表を完成',F:'人数を求める'}[p.t]+'）')))); nodes.push(h('h2',{class:'sec'},'間違えた問題'),ul); }
  mount(...nodes);
}
/* ---------- フラッシュカード（検査名） ---------- */
let FCARDS=null, FC=null;
function fcCards(){ if(!FCARDS) FCARDS=fcBuild(); return FCARDS; }
function fcBuild(){
  const abbrMap={}; D.tests.forEach(t=>{ if(!t.ref&&t.orig.abbr&&t.orig.abbr!=='―') abbrMap[t.orig.abbr]=t; });
  return D.tests.filter(t=>abbrMap[t.orig.abbr]===t).map(t=>{
    const m=(t.A.abbr||'').match(/\{(A\d+)\}/); const b=m&&D.blanks[m[1]];
    const full=b&&b.m&&b.m.includes('＝')?b.m.split('＝').slice(1).join('＝').trim():'';
    const conf=b?b.o.filter(x=>x!==t.orig.abbr&&abbrMap[x]).slice(0,3).map(x=>({abbr:x,name:abbrMap[x].orig.name})):[];
    const row=ROWT[t.id], traps=[], seen=new Set();
    Object.values(D.errors).forEach(e=>{ if((e.col==='name'||e.col==='abbr')&&row&&row.c[e.col]&&row.c[e.col].n===e.n){ const k=e.set+'|'+e.wrong; if(!seen.has(k)){seen.add(k);traps.push(e);} } });
    traps.sort((a,b)=>(a.set==='past'?0:1)-(b.set==='past'?0:1));
    const first=(t.orig.body||'').split('。')[0];
    return {id:t.id,dom:t.dom,kubun:t.kubun,abbr:t.orig.abbr,name:t.orig.name,full,conf,traps,
      key:first.length>80?first.slice(0,80)+'…':first,note:t.note,en:!/[぀-ヿ一-鿿]/.test(t.orig.name)};
  });
}
function fcMenu(){
  const cards=fcCards(), cfg=S.fcCfg;
  const ng=cards.filter(c=>S.fc[c.id]==='x').length, ok=cards.filter(c=>S.fc[c.id]==='o').length;
  if(cfg.scope==='ng'&&!ng) cfg.scope='all';
  const set=(k,v)=>{cfg[k]=v;save();fcMenu();};
  const scopes=[['all','すべて（'+cards.length+'）']].concat(D.domains.filter(d=>cards.some(c=>c.dom===d.id)).map(d=>[d.id,d.name+'（'+cards.filter(c=>c.dom===d.id).length+'）'])).concat([['ng','まだのカード（'+ng+'）']]);
  const n=cards.filter(c=>cfg.scope==='all'||(cfg.scope==='ng'?S.fc[c.id]==='x':c.dom===cfg.scope)).length;
  mount(h('div',{class:'nav'},h('button',{class:'back',onclick:home},'← ホーム'),h('span',{class:'ttl'},'検査名フラッシュカード')),
    h('p',{class:'lead'},'アルファベットの略字と日本語の検査名を対応させて覚えます。'),
    h('div',{class:'sum',style:'margin-top:10px'},h('span',{},'全',h('b',{},cards.length+'枚')),h('span',{},'覚えた：',h('b',{},ok)),h('span',{},'まだ：',h('b',{},ng))),
    h('h2',{class:'sec'},'向き'),
    h('div',{class:'tabs'},[['a2j','略字 → 日本語名'],['j2a','日本語名 → 略字'],['mix','まぜる']].map(([k,l])=>h('button',{class:'tab'+(cfg.dir===k?' on':''),onclick:()=>set('dir',k)},l))),
    h('h2',{class:'sec'},'範囲'),
    h('div',{class:'tabs'},scopes.map(([k,l])=>h('button',{class:'tab'+(cfg.scope===k?' on':''),disabled:(k==='ng'&&!ng)?'disabled':null,onclick:()=>set('scope',k)},l))),
    h('h2',{class:'sec'},'順番'),
    h('div',{class:'tabs'},[[true,'シャッフル'],[false,'表の順']].map(([k,l])=>h('button',{class:'tab'+(cfg.shuf===k?' on':''),onclick:()=>set('shuf',k)},l))),
    h('div',{class:'act',style:'margin-top:18px'},h('button',{class:'btn',onclick:fcStart},'カードを始める（'+n+'枚）')),
    h('h2',{class:'sec'},'そのほか'),
    h('div',{class:'modes'},h('button',{class:'mode',onclick:()=>fcTable('j')},'一覧で確認（隠してチェック）'),
      h('button',{class:'mode',onclick:()=>{if(confirm('覚えた・まだの記録を消しますか？')){S.fc={};save();fcMenu();}}},'カードの記録をリセット')));
}
function fcStart(){
  const cfg=S.fcCfg; let list=fcCards().filter(c=>cfg.scope==='all'||(cfg.scope==='ng'?S.fc[c.id]==='x':c.dom===cfg.scope));
  if(!list.length) return; if(cfg.shuf) list=shuffle(list);
  FC={list:list.map(c=>({c,dir:cfg.dir==='mix'?(Math.random()<.5?'a2j':'j2a'):cfg.dir})),i:0,ok:[],ng:[],flipped:false};
  fcStudy();
}
function fcExtras(c){
  const ex=[];
  if(c.key) ex.push(h('div',{class:'fcx'},h('b',{},'ポイント　'),c.key+'。'));
  if(c.conf.length) ex.push(h('div',{class:'fcx'},h('b',{},'まぎらわしい略字'),h('ul',{},c.conf.map(x=>h('li',{},x.abbr+'＝'+x.name)))));
  if(c.traps.length) ex.push(h('div',{class:'fcx'},h('b',{},'試験で出た引っかけ'),h('ul',{},c.traps.map(e=>h('li',{},(e.set==='past'?'★過去問：':'予想：')+'「'+e.wrong+'」はまちがい。'+e.note)))));
  if(c.note) ex.push(h('span',{class:'flag'},'◇配布表準拠：'+c.note));
  return ex;
}
function fcStudy(){
  const it=FC.list[FC.i], c=it.c, a2j=it.dir==='a2j', color=DOM[c.dom].color;
  const dchips=h('div',{class:'chips',style:'justify-content:center;margin:0'},h('span',{class:'chip'},DOM[c.dom].name+(c.kubun?'／'+c.kubun:'')));
  const front=h('div',{class:'face front',style:'--c:'+color},dchips,
    a2j?h('div',{class:'fcbig'},c.abbr):h('div',{class:'fcjp'},c.name),
    !a2j&&c.en?h('div',{class:'small',style:'color:var(--sub)'},'（配布表の名称は英語表記）'):null,
    h('div',{class:'fchint'},a2j?'この略字の検査名は？　タップでめくる':'この検査の略字は？　タップでめくる'));
  const back=h('div',{class:'face back',style:'--c:'+color},
    h('div',{class:'chips',style:'margin:0'},h('span',{class:'chip'},DOM[c.dom].name+(c.kubun?'／'+c.kubun:''))),
    a2j?h('div',{class:'fcjp'},c.name):h('div',{class:'fcbig'},c.abbr),
    a2j?h('div',{style:'font-weight:700;color:var(--pri)'},c.abbr):h('div',{class:'fcjp',style:'font-size:1.15rem'},c.name),
    c.full?h('div',{class:'small',style:'color:var(--sub)'},c.full):null,
    ...fcExtras(c));
  back.setAttribute('aria-hidden','true');
  const card=h('div',{class:'fc',id:'fcard',role:'button',tabindex:'0','aria-label':'カードをめくる',onclick:fcFlip},front,back);
  const bar=h('div',{class:'fcbar',id:'fcbar'},h('button',{class:'btn',onclick:fcFlip},'めくる'));
  FC.card=card; FC.bar=bar; FC.front=front; FC.back=back; FC.flipped=false;
  mount(h('div',{class:'nav'},h('button',{class:'back',onclick:()=>{if(FC.i===0||confirm('中断してメニューに戻りますか？'))fcMenu();}},'← 戻る'),h('span',{class:'ttl'},'検査名カード'),h('span',{class:'prog'},(FC.i+1)+' / '+FC.list.length)),
    h('div',{class:'bar',style:'margin:0 0 6px;--c:var(--pri)'},h('i',{style:'width:'+Math.round(FC.i/FC.list.length*100)+'%'})),
    h('div',{class:'fc-wrap'},card),bar);
}
function fcFlip(){
  if(!FC||!FC.card) return; FC.flipped=!FC.flipped; FC.card.classList.toggle('flip',FC.flipped);
  FC.front.setAttribute('aria-hidden',FC.flipped?'true':'false'); FC.back.setAttribute('aria-hidden',FC.flipped?'false':'true');
  FC.bar.replaceChildren(...(FC.flipped?[h('button',{class:'btn ng',onclick:()=>fcMark(false)},'まだ'),h('button',{class:'btn',onclick:()=>fcMark(true)},'覚えた')]:[h('button',{class:'btn',onclick:fcFlip},'めくる')]));
}
function fcMark(right){
  const it=FC.list[FC.i]; S.fc[it.c.id]=right?'o':'x'; save(); (right?FC.ok:FC.ng).push(it); FC.i++;
  if(FC.i<FC.list.length) fcStudy(); else fcResult();
}
function fcResult(){
  const n=FC.list.length, pct=Math.round(FC.ok.length/n*100);
  const nodes=[h('div',{class:'nav'},h('span',{class:'ttl'},'カードの結果')),
    h('div',{class:'card'},h('div',{},n+'枚中'),h('div',{class:'score'},FC.ok.length+'枚 覚えた（'+pct+'%）'),
      h('div',{class:'act'},FC.ng.length?h('button',{class:'btn',onclick:()=>{FC={list:shuffle(FC.ng.slice()),i:0,ok:[],ng:[],flipped:false};fcStudy();}},'まだのカードをもう一度（'+FC.ng.length+'）'):null,
        h('button',{class:'btn ghost',onclick:fcMenu},'設定に戻る'),h('button',{class:'btn ghost',onclick:home},'ホームへ')))];
  if(FC.ng.length){ const ul=h('ul',{class:'wlist'}); FC.ng.forEach(it=>ul.append(h('li',{},h('div',{},h('b',{},it.c.abbr),'＝'+it.c.name),it.c.full?h('div',{class:'small',style:'color:var(--sub)'},it.c.full):null))); nodes.push(h('h2',{class:'sec'},'まだのカード'),ul); }
  mount(...nodes);
}
function fcTable(mode){
  const cards=fcCards();
  const nodes=[h('div',{class:'nav'},h('button',{class:'back',onclick:fcMenu},'← 戻る'),h('span',{class:'ttl'},'検査名の一覧')),
    h('div',{class:'tabs'},[['none','全部見る'],['j','日本語名を隠す'],['a','略字を隠す']].map(([k,l])=>h('button',{class:'tab'+(mode===k?' on':''),onclick:()=>fcTable(k)},l))),
    h('p',{class:'hint'},'隠した欄をタップすると答えが出ます。もう一度タップすると隠れます。')];
  const cell=(t,hid,cls)=>h('button',{class:'fcell'+(hid?' hid':'')+(cls?' '+cls:''),onclick:e=>e.currentTarget.classList.toggle('hid')},t);
  D.domains.forEach(d=>{ const cs=cards.filter(c=>c.dom===d.id); if(!cs.length) return;
    nodes.push(h('div',{class:'dom'},d.name));
    cs.forEach(c=>nodes.push(h('div',{class:'fcrow',style:'--c:'+d.color},cell(c.abbr,mode==='a','fcab'),cell(c.name,mode==='j'),c.full?h('div',{class:'small fcfull'},c.full):null))); });
  mount(...nodes);
}
document.addEventListener('keydown',ev=>{
  if(!document.getElementById('fcard')||!FC) return;
  const tag=(document.activeElement&&document.activeElement.tagName)||'';
  if(tag==='BUTTON'||tag==='INPUT') return;
  if(ev.key===' '||ev.key==='Enter'){ ev.preventDefault(); fcFlip(); }
  else if(FC.flipped&&(ev.key==='ArrowLeft'||ev.key==='1')) fcMark(false);
  else if(FC.flipped&&(ev.key==='ArrowRight'||ev.key==='2')) fcMark(true);
});
home();
</script>
