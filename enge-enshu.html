<style>

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;line-height:1.7;font-size:16px;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

ruby rt{font-size:.55em;color:var(--sub)}

.opt .n{flex:none;font-weight:700;color:var(--pri)}.opt:hover:not([disabled]){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.orow.struck .opt .t{text-decoration:line-through;opacity:.45}

.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}

.flag{display:inline-block;margin-top:8px;padding:2px 10px;border-radius:6px;background:var(--note-bg);color:var(--note);font-size:.8rem}

": 0, "cat": "筋肉・解剖", "q": "<ruby>喉頭下垂<rt>こうとうかすい</rt></ruby>が<ruby>嚥下<rt>えんげ</rt></ruby>に与える影響はどれか。", "opts": ["声門閉鎖が過剰になる", "咽頭収縮力が増加する", "挙上すべき距離が短くなる", "挙上すべき距離が長くなる", "喉頭蓋の反転が過剰になる"], "ans": 3, "exp": "安静時の位置が低いと、嚥下時に挙上すべき距離が長くなり、筋力低下が重なると挙上不全となり誤嚥しやすくなる。", "flag": ""}, {"id": "q037", "g": 0, "cat": "筋肉・解剖", "q": "<ruby>嚥下<rt>えんげ</rt></ruby>時の<ruby>舌骨<rt>ぜっこつ</rt></ruby>の移動方向として正しいのはどれか。", "opts": ["側方へのみ", "後上方", "変化しない", "後下方", "前上方"], "ans": 4, "exp": "嚥下時、舌骨は前上方に挙上する。評価では安静時の位置と挙上の程度を分けて評価する。", "flag": ""}, {"id": "q038", "g": 0, "cat": "筋肉・解剖", "q": "<ruby>喉頭蓋<rt>こうとうがい</rt></ruby>の役割として正しいのはどれか。", "opts": ["唾液分泌を促進する", "鼻咽腔を閉鎖する", "声帯を内転させる", "食道入口部を開大させる", "喉頭口を閉鎖し誤嚥を防ぐ"], "ans": 4, "exp": "喉頭蓋は嚥下時に後ろ（下）へ倒れて喉頭（気管の入り口）をふさぎ、誤嚥を防ぐふたの役割を果たす。", "flag": ""}, {"id": "q039", "g": 0, "cat": "筋肉・解剖", "q": "<ruby>梨状陥凹<rt>りじょうかんおう</rt></ruby>（<ruby>梨状窩<rt>りじょうか</rt></ruby>）の役割として正しいのはどれか。", "opts": ["喉頭挙上を補助する", "食塊を気管を避けて食道入口へ誘導する", "鼻咽腔を閉鎖する", "声帯の振動を増幅する", "喉頭蓋を支持して反転を助ける"], "ans": 1, "exp": "梨状陥凹は食道入口部の両脇にあるくぼみで、喉頭蓋で左右に分けられた食塊を気管を避けて食道入口へ誘導する。", "flag": ""}, {"id": "q040", "g": 0, "cat": "筋肉・解剖", "q": "<ruby>加齢<rt>かれい</rt></ruby>や機能<ruby>低下<rt>ていか</rt></ruby>で<ruby>梨状陥凹<rt>りじょうかんおう</rt></ruby>に食物が<ruby>残留<rt>ざんりゅう</rt></ruby>しやすい場合に行われるリハビリはどれか。", "opts": ["息こらえ嚥下のみ", "頸部回旋嚥下（横向き嚥下）", "頸部前屈のみ", "うなずき嚥下のみ", "メンデルソン手技のみ"], "ans": 1, "exp": "梨状陥凹に残留が生じやすい場合、横向き嚥下（頸部回旋嚥下）などのリハビリが行われる。", "flag": ""}, {"id": "q041", "g": 0, "cat": "筋肉・解剖", "q": "VEで確認できる解剖学的<ruby>部位<rt>ぶい</rt></ruby>のうち、舌の付け根にあたるのはどれか。", "opts": ["舌根", "軟口蓋", "喉頭蓋谷", "咽頭後壁", "梨状窩"], "ans": 0, "exp": "VEで確認できる部位のうち舌根は舌の付け根にあたる。軟口蓋・咽頭後壁・咽頭側壁・舌根・喉頭蓋谷が代表的な観察部位。", "flag": ""}, {"id": "q042", "g": 0, "cat": "筋肉・解剖", "q": "<ruby>頸部聴診<rt>けいぶちょうしん</rt></ruby>の<ruby>位置<rt>いち</rt></ruby>として正しいのはどれか。", "opts": ["肩甲骨の下角", "下顎角の下", "鎖骨の直上", "胸骨柄の上", "甲状軟骨と輪状軟骨の側方"], "ans": 4, "exp": "頸部聴診の位置は喉頭（甲状軟骨・輪状軟骨）の横で、呼吸音・嚥下音が十分聴取でき接触子が嚥下動作を妨げない位置。", "flag": ""}, {"id": "q043", "g": 0, "cat": "筋肉・解剖", "q": "<ruby>頸部聴診<rt>けいぶちょうしん</rt></ruby>で用いる<ruby>聴診器<rt>ちょうしんき</rt></ruby>として<ruby>高齢者<rt>こうれいしゃ</rt></ruby>に扱いやすいとされるのはどれか。", "opts": ["小児用で接触子の小さいもの", "成人用の膜型かつ大きい接触子", "ベル型のみ", "聴診器は不要", "電子式で集音部が大きいもの"], "ans": 0, "exp": "高齢者には接触子の小さい小児用の聴診器が扱いやすいとされる。", "flag": ""}, {"id": "q044", "g": 1, "cat": "筋肉・解剖(補足)", "q": "舌の運動を<ruby>支配<rt>しはい</rt></ruby>する神経として正しいのはどれか（口蓋舌筋を除く）。", "opts": ["副神経", "顔面神経", "舌咽神経", "舌下神経", "三叉神経"], "ans": 3, "exp": "舌筋は主に舌下神経支配である（口蓋舌筋を除く）。舌下神経麻痺では舌を突出すると患側へ偏位する。", "flag": ""}, {"id": "q045", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>舌下神経<rt>ぜっかしんけい</rt></ruby><ruby>麻痺<rt>まひ</rt></ruby>があるとき、舌を<ruby>突出<rt>とっしゅつ</rt></ruby>すると<ruby>舌尖<rt>ぜっせん</rt></ruby>はどちらに<ruby>偏位<rt>へんい</rt></ruby>するか。", "opts": ["上方", "患側", "下方", "正中", "健側"], "ans": 1, "exp": "舌下神経麻痺では患側のオトガイ舌筋が機能せず、健側に押されるため舌尖は患側へ偏位する。", "flag": ""}, {"id": "q046", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>咀嚼筋<rt>そしゃくきん</rt></ruby>を<ruby>支配<rt>しはい</rt></ruby>する神経はどれか。", "opts": ["舌咽神経", "三叉神経", "迷走神経", "舌下神経", "顔面神経"], "ans": 1, "exp": "咀嚼筋（側頭筋・咬筋・内側翼突筋・外側翼突筋）は三叉神経第3枝（下顎神経）支配である。", "flag": ""}, {"id": "q047", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>表情筋<rt>ひょうじょうきん</rt></ruby>や<ruby>口唇<rt>こうしん</rt></ruby>の運動を<ruby>支配<rt>しはい</rt></ruby>する神経はどれか。", "opts": ["迷走神経", "三叉神経", "顔面神経", "舌下神経", "舌咽神経"], "ans": 2, "exp": "表情筋・口唇の運動は顔面神経支配である。顔面神経麻痺では食物が口角からこぼれやすくなる。", "flag": ""}, {"id": "q048", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>咽頭<rt>いんとう</rt></ruby>・<ruby>喉頭<rt>こうとう</rt></ruby>の運動の多くを<ruby>支配<rt>しはい</rt></ruby>する神経はどれか。", "opts": ["舌下神経", "舌咽神経", "顔面神経", "迷走神経", "三叉神経"], "ans": 3, "exp": "咽頭・喉頭の運動の大部分は迷走神経（咽頭枝・反回神経など）の支配を受ける。", "flag": ""}, {"id": "q049", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>咽頭<rt>いんとう</rt></ruby>後壁の<ruby>感覚<rt>かんかく</rt></ruby>を主に<ruby>支配<rt>しはい</rt></ruby>する神経はどれか。", "opts": ["顔面神経", "副神経", "舌咽神経", "舌下神経", "三叉神経"], "ans": 2, "exp": "咽頭の感覚は主に舌咽神経が支配する。咽頭反射の評価にも関わる。", "flag": ""}, {"id": "q050", "g": 1, "cat": "筋肉・解剖(補足)", "q": "顔面神経<ruby>麻痺<rt>まひ</rt></ruby>でみられやすい<ruby>所見<rt>しょけん</rt></ruby>はどれか。", "opts": ["声帯が完全麻痺する", "咀嚼筋が萎縮する", "食物が口角からこぼれる", "舌が患側に偏位する", "咽頭反射が消失する"], "ans": 2, "exp": "顔面神経麻痺では口唇閉鎖が不十分になり、食物が口角からこぼれやすくなる。", "flag": ""}, {"id": "q051", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>輪状甲状筋<rt>りんじょうこうじょうきん</rt></ruby>の主な働きはどれか。", "opts": ["舌骨を下制する", "軟口蓋を挙上する", "喉頭を挙上する", "声帯を伸展し声の高さを調整する", "声帯を内転させ声門を閉鎖する"], "ans": 3, "exp": "輪状甲状筋は声帯を伸展させ、声の高さ（音調）の調整に関わる外喉頭筋である。", "flag": ""}, {"id": "q052", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>軟口蓋<rt>なんこうがい</rt></ruby>の<ruby>挙上<rt>きょじょう</rt></ruby>に関与する筋はどれか。", "opts": ["胸骨舌骨筋", "顎二腹筋", "茎突舌筋", "オトガイ舌筋", "口蓋帆挙筋"], "ans": 4, "exp": "口蓋帆挙筋は軟口蓋を挙上させ、鼻咽腔閉鎖に関与する。", "flag": ""}, {"id": "q053", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>声帯<rt>せいたい</rt></ruby>の<ruby>内転<rt>ないてん</rt></ruby>・<ruby>外転<rt>がいてん</rt></ruby>に関わる筋はどれか。", "opts": ["顎舌骨筋", "輪状甲状筋", "輪状披裂筋", "茎突舌骨筋", "甲状舌骨筋"], "ans": 2, "exp": "輪状披裂筋（外側輪状披裂筋・後輪状披裂筋）は声帯の内転・外転に関与する。", "flag": ""}, {"id": "q054", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>球麻痺<rt>きゅうまひ</rt></ruby>でみられる<ruby>嚥下反射<rt>えんげはんしゃ</rt></ruby>の<ruby>特徴<rt>とくちょう</rt></ruby>はどれか。", "opts": ["惹起遅延のみで反射自体は保たれる", "症状は現れない", "反射が過剰に亢進する", "反射のタイミングのみ早まる", "嚥下反射そのものが消失する"], "ans": 4, "exp": "球麻痺（下位運動ニューロン障害）では嚥下反射そのものが消失する。偽性球麻痺では惹起遅延にとどまる。", "flag": ""}, {"id": "q055", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>偽性球麻痺<rt>ぎせいきゅうまひ</rt></ruby>（<ruby>仮性球麻痺<rt>かせいきゅうまひ</rt></ruby>）の<ruby>嚥下反射<rt>えんげはんしゃ</rt></ruby>の<ruby>特徴<rt>とくちょう</rt></ruby>はどれか。", "opts": ["反射が消失する", "食道入口部のみ障害される", "症状は現れない", "反射の惹起が遅延する", "反射が過剰に亢進する"], "ans": 3, "exp": "偽性球麻痺では嚥下反射の惹起遅延がみられる。各器官の動きのずれが特徴。球麻痺では反射自体が消失する。", "flag": ""}, {"id": "q056", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>反回神経<rt>はんかいしんけい</rt></ruby><ruby>麻痺<rt>まひ</rt></ruby>で生じやすい症状はどれか。", "opts": ["咀嚼筋の麻痺", "声帯麻痺によるかすれ声", "舌の偏位", "表情筋の麻痺", "軟口蓋の挙上不全による開鼻声"], "ans": 1, "exp": "反回神経（迷走神経の枝）の麻痺は声帯麻痺を起こし、かすれ声（嗄声）や誤嚥のリスクを高める。", "flag": ""}, {"id": "q057", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>顎関節<rt>がくかんせつ</rt></ruby>の異常や<ruby>義歯<rt>ぎし</rt></ruby>の不具合が<ruby>咀嚼<rt>そしゃく</rt></ruby>に与える影響として<ruby>適切<rt>てきせつ</rt></ruby>なのはどれか。", "opts": ["嚥下反射が早まる", "唾液分泌が増加する", "咀嚼機能が向上する", "誤嚥が減少する", "咀嚼機能が低下する"], "ans": 4, "exp": "顎関節の異常や義歯不適合は咀嚼を悪化させ、筋肉や感覚の衰え・唾液分泌減少が急速に進むとされる。", "flag": ""}, {"id": "q058", "g": 1, "cat": "筋肉・解剖(補足)", "q": "<ruby>舌圧<rt>ぜつあつ</rt></ruby>の<ruby>測定<rt>そくてい</rt></ruby>が<ruby>評価<rt>ひょうか</rt></ruby>する内容として正しいのはどれか。", "opts": ["咽頭の収縮力のみ", "舌の運動機能（最大舌圧）", "声帯の内転力", "軟口蓋の挙上速度", "喉頭の挙上距離"], "ans": 1, "exp": "舌圧計は舌の運動機能を最大舌圧として測定する機器で、摂食嚥下・構音機能のスクリーニング指標となる。", "flag": ""}, {"id": "q059", "g": 2, "cat": "摂食嚥下の基礎", "q": "<ruby>摂食嚥下<rt>せっしょくえんげ</rt></ruby>の5期モデルで最初の<ruby>段階<rt>だんかい</rt></ruby>はどれか。", "opts": ["咽頭期", "先行期（認知期）", "準備期", "食道期", "口腔期"], "ans": 1, "exp": "5期モデルは先行期（認知期）→準備期→口腔期→咽頭期→食道期の順である。", "flag": ""}, {"id": "q060", "g": 2, "cat": "摂食嚥下の基礎", "q": "<ruby>食塊<rt>しょっかい</rt></ruby>を<ruby>形成<rt>けいせい</rt></ruby>する<ruby>段階<rt>だんかい</rt></ruby>はどれか。", "opts": ["先行期", "食道期", "準備期", "咽頭期", "口腔期"], "ans": 2, "exp": "準備期では咀嚼して食塊を形成する。歯・舌・頬の機能が関わる。", "flag": ""}, {"id": "q061", "g": 2, "cat": "摂食嚥下の基礎", "q": "舌で<ruby>食塊<rt>しょっかい</rt></ruby>を<ruby>咽頭<rt>いんとう</rt></ruby>へ送る<ruby>段階<rt>だんかい</rt></ruby>はどれか。", "opts": ["咽頭期", "準備期", "食道期", "先行期", "口腔期"], "ans": 4, "exp": "口腔期では舌で食塊を咽頭へ送る。舌の機能低下で送り込み不良が起こる。", "flag": ""}, {"id": "q062", "g": 2, "cat": "摂食嚥下の基礎", "q": "<ruby>誤嚥<rt>ごえん</rt></ruby>が起こりやすい<ruby>段階<rt>だんかい</rt></ruby>として最も<ruby>代表的<rt>だいひょうてき</rt></ruby>なのはどれか。", "opts": ["口腔期", "先行期", "咽頭期", "食道期", "準備期"], "ans": 2, "exp": "咽頭期は嚥下反射で食塊を食道へ送る段階で、誤嚥が起こりやすい代表的な段階である。", "flag": ""}, {"id": "q063", "g": 2, "cat": "摂食嚥下の基礎", "q": "5期モデルが主に<ruby>対応<rt>たいおう</rt></ruby>するのはどれか。", "opts": ["唾液嚥下のみ", "咳嗽反射のみ", "固形物の咀嚼嚥下", "構音運動", "液体の命令嚥下"], "ans": 4, "exp": "5期モデルは液体嚥下（お茶をひと口ためてから飲む命令嚥下）のモデルに近い。", "flag": ""}, {"id": "q064", "g": 2, "cat": "摂食嚥下の基礎", "q": "プロセスモデルが主に<ruby>対応<rt>たいおう</rt></ruby>するのはどれか。", "opts": ["固形物の咀嚼嚥下", "食道期のみ", "液体の命令嚥下", "先行期障害のみ", "唾液の自然嚥下"], "ans": 0, "exp": "プロセスモデルは固形物（咀嚼嚥下）のモデルで、実際の食事場面に即している。", : 5, "cat": "VE", "q": "VE<ruby>実施<rt>じっし</rt></ruby>時、<ruby>医師<rt>いし</rt></ruby>が<ruby>内視鏡<rt>ないしきょう</rt></ruby>を<ruby>把持<rt>はじ</rt></ruby>しているためSTが行うことがある<ruby>対応<rt>たいおう</rt></ruby>はどれか。", "opts": ["心電図モニタリングのみ", "X線の操作", "鎮静薬の投与", "造影剤の注入", "貯留物の吸引"], "ans": 4, "exp": "医師は内視鏡を把持しているため吸引ができないことが多く、代わりにSTが吸引を行う場面がある。", "flag": ""}, {"id": "q146", "g": 5, "cat": "VE", "q": "VEの<ruby>目的<rt>もくてき</rt></ruby>として<ruby>適切<rt>てきせつ</rt></ruby>でないのはどれか。", "opts": ["誤嚥の有無を知ることだけを目的とする", "治療方針の決定に役立てる", "嚥下運動のどの段階に異常があるか把握する", "経口摂取の可否を判断するための情報を得る", "代償方法の効果を確認する"], "ans": 0, "exp": "誤嚥の有無を知るだけがVEの目的ではなく、病態把握と治療方針への活用が目的とされる。", "flag": ""}, {"id": "q147", "g": 5, "cat": "VE", "q": "VEの<ruby>問題点<rt>もんだいてん</rt></ruby>として正しいのはどれか。", "opts": ["検査時間が非常に長い", "検査食に制限がない", "被曝量が多い", "ファイバー挿入時の疼痛や鼻出血がありうる", "造影剤アレルギーが起こりうる"], "ans": 3, "exp": "VEの問題点として、ファイバー挿入時の疼痛・鼻出血が挙げられる。", "flag": ""}, {"id": "q148", "g": 5, "cat": "VE", "q": "VEの<ruby>評価<rt>ひょうか</rt></ruby><ruby>項目<rt>こうもく</rt></ruby>のうち、<ruby>唾液<rt>だえき</rt></ruby><ruby>貯留<rt>ちょりゅう</rt></ruby>や食物<ruby>残留<rt>ざんりゅう</rt></ruby>の確認で<ruby>麻痺側<rt>まひそく</rt></ruby>を<ruby>評価<rt>ひょうか</rt></ruby>する<ruby>目的<rt>もくてき</rt></ruby>はどれか。", "opts": ["先行期障害の検出", "呼吸機能の評価", "義歯適合の評価", "食道蠕動の評価", "咽頭麻痺の左右差の把握"], "ans": 4, "exp": "咽頭残留に左右差がある場合、一側性咽頭麻痺を疑う所見となる。", "flag": ""}, {"id": "q149", "g": 5, "cat": "VE", "q": "VEにおける<ruby>早期<rt>そうき</rt></ruby><ruby>咽頭<rt>いんとう</rt></ruby><ruby>流入<rt>りゅうにゅう</rt></ruby>の<ruby>説明<rt>せつめい</rt></ruby>として正しいのはどれか。", "opts": ["食道が拡張する現象", "喉頭が完全に閉鎖する現象", "嚥下反射惹起前に食塊が咽頭へ流入する現象", "嚥下後に咽頭へ食物が逆流する現象", "咽頭収縮で食塊が口腔へ戻る現象"], "ans": 2, "exp": "早期咽頭流入は嚥下反射が惹起される前に食塊が咽頭へ流入してしまう現象で、口腔保持障害などが原因となる。", "flag": ""}, {"id": "q150", "g": 6, "cat": "VF", "q": "VFの日本語名称はどれか。", "opts": ["嚥下内視鏡検査", "嚥下造影検査", "食道造影検査", "声帯機能検査", "咽頭内圧検査"], "ans": 1, "exp": "VFはVideofluoroscopic Examination of Swallowing（嚥下造影検査）の略である。", "flag": "※英語正式名称は解説に記載（選択肢の30字制限のため日本語に変更）"}, {"id": "q151", "g": 6, "cat": "VF", "q": "VFで用いられる<ruby>造影剤<rt>ぞうえいざい</rt></ruby>はどれか。", "opts": ["メチレンブルー", "生理食塩水のみ", "ヨード系消毒薬", "バリウム", "インジゴカルミン"], "ans": 3, "exp": "VFではX線透視下でバリウム（造影剤）を飲み込ませ、嚥下状態を観察する。", "flag": ""}, {"id": "q152", "g": 6, "cat": "VF", "q": "VFが<ruby>評価<rt>ひょうか</rt></ruby>できる<ruby>範囲<rt>はんい</rt></ruby>として正しいのはどれか。", "opts": ["先行期のみ", "食道期のみ", "咽頭期のみ", "口腔期から食道期までの嚥下の5期全体", "準備期から咽頭期まで"], "ans": 3, "exp": "VFは口腔期・咽頭期・食道期を含む嚥下の5期全体の動態評価が可能である。", "flag": ""}, {"id": "q153", "g": 6, "cat": "VF", "q": "VFの<ruby>最大<rt>さいだい</rt></ruby>の<ruby>利点<rt>りてん</rt></ruby>として正しいのはどれか。", "opts": ["嚥下の瞬間を観察できる", "検査時間が短い", "粘膜の色調が鮮明に見える", "ベッドサイドで実施できる", "放射線被曝がない"], "ans": 0, "exp": "VFは外からは分からない誤嚥を含め、嚥下の瞬間を観察できることが最大の利点である。", "flag": ""}, {"id": "q154", "g": 6, "cat": "VF", "q": "VFの<ruby>被曝量<rt>ひばくりょう</rt></ruby>の目安として<ruby>資料<rt>しりょう</rt></ruby>に<ruby>記載<rt>きさい</rt></ruby>されているのはどれか。", "opts": ["約5.0〜10.0mSv", "約0.4〜1.23mSv", "約0.06mSv", "約2.0〜4.0mSv", "約1.5〜2.5mSv"], "ans": 1, "exp": "VF1回の被曝量は約0.4〜1.23mSvとされ、胃のバリウム検査やCTより低い。", "flag": ""}, {"id": "q155", "g": 6, "cat": "VF", "q": "VFの<ruby>診断的<rt>しんだんてき</rt></ruby><ruby>検査<rt>けんさ</rt></ruby>としての<ruby>目的<rt>もくてき</rt></ruby>はどれか。", "opts": ["食事場面の環境を評価すること", "家族指導を行うこと", "食欲を評価すること", "症状と病態の関係を明らかにすること", "訓練方法の効果を判定すること"], "ans": 3, "exp": "診断的VFは症状と病態の関係を明らかにし、形態的・機能的異常や誤嚥・咽頭残留の有無を明らかにする。", "flag": ""}, {"id": "q156", "g": 6, "cat": "VF", "q": "VFの<ruby>治療的<rt>ちりょうてき</rt></ruby><ruby>検査<rt>けんさ</rt></ruby>としての<ruby>目的<rt>もくてき</rt></ruby>はどれか。", "opts": ["感染症の診断", "食形態・摂食体位・摂食方法など治療方針の決定", "骨密度の評価", "放射線量の測定のみ", "症状と病態の関係を明らかにすること"], "ans": 1, "exp": "治療的VFは食形態・摂食体位・摂食方法などの治療方針を決定し、安全な訓練方法を探ることを目的とする。", "flag": ""}, {"id": "q157", "g": 6, "cat": "VF", "q": "VFの<ruby>透視方向<rt>とうしほうこう</rt></ruby>と<ruby>評価<rt>ひょうか</rt></ruby><ruby>順序<rt>じゅんじょ</rt></ruby>として最初に行うのはどれか。", "opts": ["食道蠕動の評価", "正面での口腔〜咽頭の評価", "側面での口腔〜咽頭の評価", "発声や空嚥下による各器官の動き確認", "造影剤を用いた誤嚥の確認"], "ans": 3, "exp": "まず発声や空嚥下を行わせて各器官の動きや嚥下反射の程度を確認し、その後側面→正面の順で評価する。", "flag": ""}, {"id": "q158", "g": 6, "cat": "VF", "q": "VFで<ruby>     h('button',{class:'mode',onclick:()=>startQuiz(shuffle(D.questions),'ランダム')},'ランダム'),
    h('button',{class:'mode',disabled:wrong.length?null:'disabled',onclick:()=>startQuiz(wrong,'間違えた問題')},'間違えた問題（'+wrong.length+'）')));
  nodes.push(h('div',{class:'foot'},h('button',{class:'link',onclick:()=>{if(confirm('学習記録（○×）をすべて消しますか？')){S={res:{}};save();home();}}},'学習記録をリセット')));
  mount(...nodes);
}

let Q=null;
function startQuiz(list,title){if(!list.length){alert('該当する問題がありません。');return;}Q={list:list.slice(),title,i:0,correct:0,wrong:[]};renderQ();}
function renderQ(){
  const q=Q.list[Q.i];let answered=false;
  const opts=h('div',{class:'opts'}),rows=[],resBox=h('div',{}),actBox=h('div',{class:'act'});
  function grade(idx){
    answered=true;const right=idx===q.ans;
    rows.forEach((r,k)=>{const b=r.querySelector('.opt');b.disabled=true;r.querySelector('.elim').disabled=true;
      if(k===q.ans)b.classList.add('ok');else if(k===idx)b.classList.add('ng');});
    S.res[q.id]=right?'o':'x';save();
    if(right)Q.correct++;else Q.wrong.push(q);
    resBox.append(h('div',{class:'res '+(right?'ok':'ng')},right?'正解':'不正解　正答：'+NUM[q.ans]),
      h('div',{class:'exp'},h('div',{},q.exp),q.flag?h('span',{class:'flag'},q.flag):null));
    actBox.replaceChildren(h('button',{class:'btn',onclick:next},Q.i+1<Q.list.length?'次の問題へ':'結果を見る'));
  }
  function next(){Q.i++;if(Q.i<Q.list.length)renderQ();else resultView();}
  q.opts.forEach((t,idx)=>{
    const b=h('button',{class:'opt',onclick:()=>{if(!answered)grade(idx);}},h('span',{class:'n'},NUM[idx]),h('span',{class:'t'},t));
    const row=h('div',{class:'orow'},b,h('button',{class:'elim','aria-label':'この選択肢を消去',title:'消去法：取り消し線',onclick:()=>row.classList.toggle('struck')},'×'));
    rows.push(row);opts.append(row);
  });
  mount(
    h('div',{class:'nav'},h('button',{class:'back',onclick:()=>{if((!answered&&Q.i===0)||confirm('クイズを中断してホームに戻りますか？'))home();}},'← ホーム'),
      h('span',{class:'ttl'},Q.title),h('span',{class:'prog'},(Q.i+1)+' / '+Q.list.length)),
    h('div',{class:'bar',style:'margin:0 0 12px;--c:var(--pri)'},h('i',{style:'width:'+Math.round(Q.i/Q.list.length*100)+'%'})),
    h('div',{class:'card'},h('div',{class:'chips'},h('span',{class:'chip'},q.cat)),
      h('div',{class:'qtext',html:q.q}),opts,h('p',{class:'hint'},'右端の×で選択肢に取り消し線を引けます（消去法）。'),actBox,resBox));
}
function resultView(){
  const n=Q.list.length,pct=Math.round(Q.correct/n*100);
  const nodes=[h('div',{class:'nav'},h('span',{class:'ttl'},Q.title+' の結果')),
    h('div',{class:'card'},h('div',{},n+'問中'),h('div',{class:'score'},Q.correct+'問正解（'+pct+'%）'),
      h('div',{class:'act'},Q.wrong.length?h('button',{class:'btn',onclick:()=>startQuiz(Q.wrong,'間違えた問題')},'間違いだけやり直す（'+Q.wrong.length+'）'):null,
        h('button',{class:'btn ghost',onclick:home},'ホームへ')))];
  if(Q.wrong.length){const ul=h('ul',{class:'wlist'});
    Q.wrong.forEach(q=>ul.append(h('li',{},h('div',{html:q.q}),h('div',{class:'a'},'正答：'+NUM[q.ans]+' '+q.opts[q.ans]))));
    nodes.push(h('h2',{class:'sec'},'間違えた問題'),ul);}
  mount(...nodes);
}
home();
</script>
