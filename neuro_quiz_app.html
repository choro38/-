<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神経系 学習アプリ｜ST国試対策</title>
<style>
  :root {
    --navy: #1B3A6B;
    --teal: #0891B2;
    --gold: #D97706;
    --red: #DC2626;
    --green: #15803D;
    --gray: #374151;
    --lgray: #F1F5F9;
    --mgray: #E2E8F0;
    --white: #FFFFFF;
    --card-radius: 16px;
    --shadow: 0 4px 24px rgba(27,58,107,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'メイリオ', sans-serif;
    background: #EEF2F8;
    color: var(--gray);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    background: var(--navy);
    color: var(--white);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(27,58,107,0.3);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.04em; }
  header span { font-size: 0.78rem; color: #93C5FD; }

  /* TABS */
  .tab-bar {
    display: flex;
    background: var(--navy);
    padding: 0 24px 0;
    border-bottom: 3px solid var(--gold);
  }
  .tab {
    padding: 10px 22px;
    font-size: 0.9rem;
    font-weight: 600;
    color: #93C5FD;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -3px;
    transition: all 0.2s;
    user-select: none;
  }
  .tab.active { color: var(--gold); border-bottom: 3px solid var(--gold); }
  .tab:hover:not(.active) { color: #E0F2FE; }

  /* MAIN */
  .screen { display: none; padding: 20px 16px 40px; max-width: 700px; margin: 0 auto; }
  .screen.active { display: block; }

  /* UNIT SELECTOR */
  .selector-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
  }
  .unit-btn {
    padding: 7px 14px;
    border-radius: 20px;
    border: 2px solid var(--navy);
    background: var(--white);
    color: var(--navy);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
  }
  .unit-btn.active {
    background: var(--navy);
    color: var(--white);
  }
  .unit-btn:hover:not(.active) { background: var(--lgray); }

  /* CARD */
  .card {
    background: var(--white);
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
    padding: 28px 24px 22px;
    margin-bottom: 16px;
    position: relative;
  }
  .card-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .progress-bar-wrap {
    background: var(--mgray);
    border-radius: 4px;
    height: 6px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .progress-bar {
    background: linear-gradient(90deg, var(--teal), var(--navy));
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .progress-text {
    font-size: 0.78rem;
    color: var(--teal);
    text-align: right;
    margin-top: 4px;
    margin-bottom: 10px;
  }

  /* FLASH CARD */
  .flash-face {
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    cursor: pointer;
    padding: 20px 8px;
    user-select: none;
  }
  .flash-face.front { background: linear-gradient(135deg, #EEF2F8 0%, #DBEAFE 100%); border-radius: 12px; }
  .flash-face.back { background: linear-gradient(135deg, #F0FFF4 0%, #DCFCE7 100%); border-radius: 12px; }
  .flash-q { font-size: 1.15rem; font-weight: 700; color: var(--navy); line-height: 1.6; }
  .flash-a { font-size: 1rem; color: var(--green); font-weight: 600; line-height: 1.7; }
  .flash-hint { font-size: 0.78rem; color: #6B7280; margin-top: 10px; }
  .flash-explanation { font-size: 0.82rem; color: var(--gray); margin-top: 12px; line-height: 1.7; background: #F8FAFC; border-left: 3px solid var(--teal); padding: 8px 12px; border-radius: 4px; text-align: left; }
  .flip-indicator {
    font-size: 0.75rem;
    color: #9CA3AF;
    text-align: center;
    margin-top: 10px;
  }

  /* QUIZ */
  .question-text {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.65;
    margin-bottom: 20px;
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    padding: 13px 16px;
    border-radius: 10px;
    border: 2px solid var(--mgray);
    background: var(--white);
    text-align: left;
    font-size: 0.9rem;
    color: var(--gray);
    cursor: pointer;
    transition: all 0.18s;
    line-height: 1.5;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--teal); background: #F0F9FF; }
  .choice-btn.correct { border-color: var(--green); background: #F0FFF4; color: var(--green); font-weight: 700; }
  .choice-btn.wrong { border-color: var(--red); background: #FFF0F0; color: var(--red); }
  .choice-btn:disabled { cursor: default; }

  .explanation-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #F0F9FF;
    border-left: 4px solid var(--teal);
    font-size: 0.85rem;
    line-height: 1.7;
    color: var(--gray);
    display: none;
  }
  .explanation-box.show { display: block; }
  .explanation-box .star { color: var(--red); font-weight: 700; }

  /* BUTTONS */
  .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn {
    padding: 11px 22px;
    border-radius: 8px;
    border: none;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.18s;
    flex: 1;
    min-width: 100px;
  }
  .btn-primary { background: var(--navy); color: var(--white); }
  .btn-primary:hover { background: #254B8F; }
  .btn-secondary { background: var(--mgray); color: var(--gray); }
  .btn-secondary:hover { background: #CBD5E1; }
  .btn-danger { background: #FEF2F2; color: var(--red); border: 2px solid #FECACA; }
  .btn-danger:hover { background: #FEE2E2; }
  .btn-gold { background: var(--gold); color: var(--white); }
  .btn-gold:hover { background: #B45309; }

  /* RESULT */
  .result-card {
    text-align: center;
    padding: 32px 24px;
  }
  .result-score { font-size: 3rem; font-weight: 900; color: var(--navy); }
  .result-sub { font-size: 1rem; color: var(--teal); margin-top: 4px; }
  .result-msg { font-size: 0.9rem; color: var(--gray); margin-top: 14px; line-height: 1.6; }
  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  .badge-unit { background: #DBEAFE; color: var(--navy); }
  .badge-star { background: #FEF3C7; color: var(--gold); }

  /* WRONG LIST */
  .wrong-item {
    padding: 10px 14px;
    border-radius: 8px;
    background: #FFF0F0;
    border-left: 3px solid var(--red);
    font-size: 0.83rem;
    margin-bottom: 8px;
    color: var(--gray);
  }

  /* STATS */
  .stats-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-box {
    flex: 1;
    background: var(--white);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(27,58,107,0.07);
  }
  .stat-num { font-size: 1.6rem; font-weight: 900; }
  .stat-label { font-size: 0.72rem; color: #6B7280; margin-top: 2px; }
  .correct-num { color: var(--green); }
  .wrong-num { color: var(--red); }
  .total-num { color: var(--navy); }

  .section-title {
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--teal);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin: 16px 0 8px;
  }

  /* SHUFFLE icon */
  .shuffle-icon { margin-right: 4px; }
</style>
</head>
<body>

<header>
  <h1>🧠 神経系 学習アプリ</h1>
  <span>ST国試対策 ③神経系の構造・機能・病態</span>
</header>

<div class="tab-bar">
  <div class="tab active" onclick="switchTab('flash')">📇 フラッシュカード</div>
  <div class="tab" onclick="switchTab('quiz')">✅ 選択問題</div>
  <div class="tab" onclick="switchTab('yoso')">🎯 予想問題</div>
</div>

<!-- ===== FLASH CARD SCREEN ===== -->
<div id="screen-flash" class="screen active">
  <div class="card" style="padding-bottom:14px;">
    <div class="section-title">単元を選ぶ</div>
    <div class="selector-row" id="flash-unit-selector"></div>
    <div class="btn-row" style="margin-top:4px;">
      <button class="btn btn-primary" onclick="startFlash()">▶ スタート</button>
      <button class="btn btn-secondary" onclick="shuffleFlash()">🔀 シャッフル</button>
    </div>
  </div>

  <div id="flash-area" style="display:none;">
    <div class="progress-text" id="flash-progress"></div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="flash-bar"></div></div>

    <div class="card" style="padding:0;overflow:hidden;" id="flash-card-wrap">
      <div class="flash-face front" id="flash-front" onclick="flipCard()">
        <div class="card-label">Q</div>
        <div class="flash-q" id="flash-q-text"></div>
        <div class="flash-hint">👆 タップして答えを見る</div>
      </div>
      <div class="flash-face back" id="flash-back" style="display:none;" onclick="flipCard()">
        <div class="card-label">A</div>
        <div class="flash-a" id="flash-a-text"></div>
        <div class="flash-explanation" id="flash-exp"></div>
        <div class="flash-hint">👆 タップして問題に戻る</div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-danger" onclick="markWrong()">✗ もう一度</button>
      <button class="btn btn-primary" onclick="nextFlash()">次へ →</button>
    </div>
    <div style="text-align:center;margin-top:10px;">
      <button class="btn btn-secondary" style="font-size:0.78rem;padding:6px 14px;" onclick="endFlash()">終了</button>
    </div>
  </div>

  <div id="flash-result" style="display:none;">
    <div class="card result-card">
      <div style="font-size:2rem;margin-bottom:8px;">🎉</div>
      <div class="result-score" id="flash-result-score"></div>
      <div class="result-sub">枚完了！</div>
      <div class="result-msg" id="flash-result-msg"></div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn btn-gold" onclick="retryWrongFlash()" id="retry-wrong-flash">✗ 間違いだけ復習</button>
        <button class="btn btn-primary" onclick="resetFlash()">最初から</button>
      </div>
    </div>
    <div id="flash-wrong-list"></div>
  </div>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div id="screen-quiz" class="screen">
  <div class="card" style="padding-bottom:14px;" id="quiz-setup">
    <div class="section-title">単元を選ぶ</div>
    <div class="selector-row" id="quiz-unit-selector"></div>
    <div class="btn-row" style="margin-top:4px;">
      <button class="btn btn-primary" onclick="startQuiz()">▶ スタート</button>
    </div>
  </div>

  <div id="quiz-area" style="display:none;">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num correct-num" id="q-correct">0</div><div class="stat-label">正解</div></div>
      <div class="stat-box"><div class="stat-num wrong-num" id="q-wrong">0</div><div class="stat-label">不正解</div></div>
      <div class="stat-box"><div class="stat-num total-num" id="q-total">0</div><div class="stat-label">残り</div></div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="quiz-bar"></div></div>

    <div class="card">
      <div class="badge badge-unit" id="q-badge"></div>
      <div class="question-text" id="q-text"></div>
      <div class="choices" id="q-choices"></div>
      <div class="explanation-box" id="q-exp"></div>
    </div>

    <div class="btn-row" id="quiz-btn-row" style="display:none;">
      <button class="btn btn-primary" onclick="nextQuiz()" id="quiz-next-btn">次の問題 →</button>
      <button class="btn btn-secondary" onclick="endQuiz()">終了</button>
    </div>
  </div>

  <div id="quiz-result" style="display:none;">
    <div class="card result-card">
      <div id="result-emoji" style="font-size:2.4rem;margin-bottom:8px;"></div>
      <div class="result-score" id="quiz-result-score"></div>
      <div class="result-sub" id="quiz-result-sub"></div>
      <div class="result-msg" id="quiz-result-msg"></div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn btn-danger" onclick="retryWrongQuiz()" id="retry-wrong-quiz">✗ 間違いだけ復習</button>
        <button class="btn btn-primary" onclick="resetQuiz()">最初から</button>
      </div>
    </div>
    <div id="quiz-wrong-list"></div>
  </div>
</div>

<!-- ===== YOSO SCREEN ===== -->
<div id="screen-yoso" class="screen">
  <div class="card" style="padding-bottom:14px;" id="yoso-setup">
    <div class="badge badge-star" style="margin-bottom:8px;">🎯 試験予想問題 60問</div>
    <div style="font-size:0.83rem;color:var(--gray);line-height:1.6;margin-bottom:12px;">
      先生ヒント「溝・孔の名前をしっかり覚えること」を重視した予想問題です。<br>本番20問形式に近い難易度で作成しています。
    </div>
    <div class="section-title">単元を選ぶ</div>
    <div class="selector-row" id="yoso-unit-selector"></div>
    <div class="btn-row" style="margin-top:4px;">
      <button class="btn btn-gold" onclick="startYoso()">▶ スタート</button>
    </div>
  </div>

  <div id="yoso-area" style="display:none;">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num correct-num" id="y-correct">0</div><div class="stat-label">正解</div></div>
      <div class="stat-box"><div class="stat-num wrong-num" id="y-wrong">0</div><div class="stat-label">不正解</div></div>
      <div class="stat-box"><div class="stat-num total-num" id="y-total">0</div><div class="stat-label">残り</div></div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar" id="yoso-bar"></div></div>

    <div class="card">
      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
        <div class="badge badge-unit" id="y-badge"></div>
        <div class="badge badge-star" id="y-hint-badge" style="display:none;">💡 溝・孔</div>
      </div>
      <div class="question-text" id="y-text"></div>
      <div class="choices" id="y-choices"></div>
      <div class="explanation-box" id="y-exp"></div>
    </div>

    <div class="btn-row" id="yoso-btn-row" style="display:none;">
      <button class="btn btn-primary" onclick="nextYoso()">次の問題 →</button>
      <button class="btn btn-secondary" onclick="endYoso()">終了</button>
    </div>
  </div>

  <div id="yoso-result" style="display:none;">
    <div class="card result-card">
      <div id="y-result-emoji" style="font-size:2.4rem;margin-bottom:8px;"></div>
      <div class="result-score" id="y-result-score"></div>
      <div class="result-sub" id="y-result-sub"></div>
      <div class="result-msg" id="y-result-msg"></div>
      <div class="btn-row" style="margin-top:20px;">
        <button class="btn btn-danger" onclick="retryWrongYoso()" id="retry-wrong-yoso">✗ 間違いだけ復習</button>
        <button class="btn btn-gold" onclick="resetYoso()">最初から</button>
      </div>
    </div>
    <div id="yoso-wrong-list"></div>
  </div>
</div>

<script>
// ================================================================
// DATA
// ================================================================
const UNITS = [
  { id:'all', label:'全単元' },
  { id:'1', label:'①ニューロン・グリア' },
  { id:'2', label:'②脳室・CSF・自律神経' },
  { id:'3', label:'③随意運動・小脳・基底核' },
  { id:'4', label:'④脳血管・脳血管障害' },
  { id:'5', label:'⑤神経伝達・認知症' },
  { id:'6', label:'⑥頭部外傷・血腫' },
];

const CARDS = [
  // ---- 単元① ----
  { unit:'1', q:'CNSとPNSをそれぞれ日本語と構成部位で答えよ', a:'CNS＝中枢神経系（脳＋脊髄）、PNS＝末梢神経系（脳神経12対＋脊髄神経31対）', exp:'脳は大脳・間脳・脳幹・小脳で構成。脊髄神経は頸髄8・胸髄12・腰髄5・仙髄5・尾髄1対' },
  { unit:'1', q:'静止膜電位は何mVか？また何によって維持されているか？', a:'約 −70 mV。K⁺の細胞外拡散とNa⁺/K⁺-ATPaseポンプで維持', exp:'内側がマイナス。閾値（約−55mV）を超えるとNa⁺チャネルが開き活動電位が発生する' },
  { unit:'1', q:'「全か無かの法則」とは何か？', a:'閾値以上の刺激なら刺激の強弱に関係なく常に同じ大きさの活動電位が発生する法則', exp:'All-or-None law。閾値以下では発火しない。頻出！' },
  { unit:'1', q:'中枢神経の髄鞘を形成する細胞は何か？末梢神経は？', a:'中枢：オリゴデンドロサイト（乏突起膠細胞）。末梢：シュワン細胞', exp:'1つのオリゴデンドロサイトは複数の軸索を担当。シュワン細胞は1軸索の1区間を担当。対比頻出！' },
  { unit:'1', q:'血液脳関門（BBB）の実体と通過できないものを述べよ', a:'実体：脳毛細血管内皮細胞のタイトジャンクション。通過できないもの：大型タンパク・多くの薬物・病原体', exp:'BBBが弱い部位（脳室周囲器官）：下垂体・松果体・最後野・正中隆起。最後野はCTZとして嘔吐に関与' },
  { unit:'1', q:'シナプス伝達の6ステップを順番に答えよ', a:'①合成・貯蔵 ②活動電位の伝導 ③Ca²⁺流入 ④開口放出（エクソサイトーシス） ⑤受容体結合 ⑥再取込み・分解', exp:'Ca²⁺流入がトリガー。Lambert-Eaton症候群はStep③、重症筋無力症はStep⑤、SSRIはStep⑥を標的とする' },
  { unit:'1', q:'EPSPとIPSPの違いを説明せよ', a:'EPSP（興奮性後シナプス電位）＝脱分極（閾値に近づく）。IPSP（抑制性後シナプス電位）＝過分極（閾値から遠ざかる）', exp:'EPSP主伝達物質：グルタミン酸・ACh。IPSP主伝達物質：GABA・グリシン' },
  { unit:'1', q:'重症筋無力症（MG）の病態と典型症状は？', a:'病態：AChR（アセチルコリン受容体）への自己抗体（Step⑤障害）。症状：眼瞼下垂・複視・易疲労性・日内変動（夕方悪化）', exp:'治療：コリンエステラーゼ阻害薬・ステロイド・胸腺摘除。Lambert-Eaton症候群はCa²⁺チャネルへの抗体（Step③）で区別' },
  { unit:'1', q:'ブロードマン44-45野・22野の名称と障害されたときの症状は？', a:'44-45野＝ブローカ野（運動性失語：非流暢・理解保持）、22野＝ウェルニッケ野（感覚性失語：流暢だが理解障害）', exp:'どちらも左半球が優位半球（右利きの約95%）。STの核心知識！' },
  { unit:'1', q:'大脳皮質の第Ⅳ層（内顆粒細胞層）について特記すべき点は？', a:'一次運動野（4野）では欠如（顆粒細胞欠乏野）。一次視覚野（17野）では最も発達している', exp:'第Ⅴ層にはBetz細胞（大型錐体細胞）→皮質脊髄路の起始細胞' },

  // ---- 単元② ----

    btn.onclick = () => {

      el.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

// ================================================================
// FLASH CARD
// ================================================================
function getDeck(data, unit) {
  const pool = unit === 'all' ? [...data] : data.filter(d => d.unit === unit);
  return pool.sort(() => Math.random() - 0.5);
}

function startFlash() {
  flashDeck = getDeck(CARDS, flashUnit);
  flashIdx = 0; flashWrong = []; flashMode = 'normal';
  showFlashArea();
  renderFlash();
}
function shuffleFlash() {
  startFlash();
}
function retryWrongFlash() {
  if (!flashWrong.length) return;
  flashDeck = [...flashWrong].sort(() => Math.random() - 0.5);
  flashIdx = 0; flashWrong = []; flashMode = 'retry';
  showFlashArea();
  renderFlash();
}
function showFlashArea() {
  document.getElementById('flash-area').style.display = 'block';
  document.getElementById('flash-result').style.display = 'none';
}
function renderFlash() {
  if (flashIdx >= flashDeck.length) { showFlashResult(); return; }
  flashFlipped = false;
  const card = flashDeck[flashIdx];
  document.getElementById('flash-q-text').textContent = card.q;
  document.getElementById('flash-a-text').textContent = card.a;
  document.getElementById('flash-exp').textContent = card.exp || '';
  document.getElementById('flash-front').style.display = 'flex';
  document.getElementById('flash-back').style.display = 'none';
  const total = flashDeck.length;
  const pct = Math.round((flashIdx / total) * 100);
  document.getElementById('flash-progress').textContent = `${flashIdx + 1} / ${total} 枚`;
  document.getElementById('flash-bar').style.width = pct + '%';
}
function flipCard() {
  flashFlipped = !flashFlipped;
  document.getElementById('flash-front').style.display = flashFlipped ? 'none' : 'flex';
  document.getElementById('flash-back').style.display = flashFlipped ? 'flex' : 'none';
}
function markWrong() {
  flashWrong.push(flashDeck[flashIdx]);
  nextFlash();
}
function nextFlash() {
  flashIdx++;
  renderFlash();
}
function endFlash() {
  showFlashResult();
}
function showFlashResult() {
  document.getElementById('flash-area').style.display = 'none';
  const result = document.getElementById('flash-result');
  result.style.display = 'block';
  const total = flashDeck.length + flashWrong.length;
  const done = flashDeck.length;
  document.getElementById('flash-result-score').textContent = done;
  const wrongCount = flashWrong.length;
  let msg = wrongCount === 0 ? '全問パーフェクト！素晴らしい💯' : `${wrongCount}枚を「もう一度」にしました。復習して完璧にしよう！`;
  document.getElementById('flash-result-msg').textContent = msg;
  const retryBtn = document.getElementById('retry-wrong-flash');
  retryBtn.style.display = wrongCount > 0 ? 'block' : 'none';
  const listEl = document.getElementById('flash-wrong-list');
  listEl.innerHTML = wrongCount > 0 ? '<div class="section-title" style="margin-top:16px;">もう一度リスト</div>' + flashWrong.map(c => `<div class="wrong-item"><b>Q：</b>${c.q}<br><span style="color:#059669;">A：</span>${c.a}</div>`).join('') : '';
}
function resetFlash() {
  document.getElementById('flash-area').style.display = 'none';
  document.getElementById('flash-result').style.display = 'none';
  flashWrong = [];
}

// ================================================================
// QUIZ
// ================================================================
function startQuiz() {
  quizDeck = getDeck(QUIZZES, quizUnit);
  quizIdx = 0; quizCorrect = 0; quizWrong = []; quizMode = 'normal';
  document.getElementById('quiz-setup').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('quiz-result').style.display = 'none';
  renderQuiz();
}
function retryWrongQuiz() {
  if (!quizWrong.length) return;
  quizDeck = [...quizWrong].sort(() => Math.random() - 0.5);
  quizIdx = 0; quizCorrect = 0; quizWrong = []; quizMode = 'retry';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('quiz-result').style.display = 'none';
  renderQuiz();
}
function renderQuiz() {
  if (quizIdx >= quizDeck.length) { showQuizResult(); return; }
  quizAnswered = false;
  const q = quizDeck[quizIdx];
  const unitLabel = UNITS.find(u => u.id === q.unit)?.label || '';
  document.getElementById('q-badge').textContent = unitLabel;
  document.getElementById('q-text').textContent = q.q;
  const choicesEl = document.getElementById('q-choices');
  choicesEl.innerHTML = '';
  q.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = `${['ア','イ','ウ','エ'][i]}．${c}`;
    btn.onclick = () => answerQuiz(i);
    choicesEl.appendChild(btn);
  });
  document.getElementById('q-exp').className = 'explanation-box';
  document.getElementById('quiz-btn-row').style.display = 'none';
  updateQuizStats();
  const pct = Math.round((quizIdx / quizDeck.length) * 100);
  document.getElementById('quiz-bar').style.width = pct + '%';
}
function answerQuiz(i) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizDeck[quizIdx];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled = true);
  const isCorrect = i === q.correct;
  btns[i].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    btns[q.correct].classList.add('correct');
    quizWrong.push(q);
  } else {
    quizCorrect++;
  }
  const expEl = document.getElementById('q-exp');
  expEl.innerHTML = (isCorrect ? '✅ 正解！ ' : '❌ 不正解。正解は「' + ['ア','イ','ウ','エ'][q.correct] + '」です。') + '<br><span class="star">★解説：</span>' + q.exp;
  expEl.className = 'explanation-box show';
  document.getElementById('quiz-btn-row').style.display = 'flex';
  updateQuizStats();
}
function updateQuizStats() {
  document.getElementById('q-correct').textContent = quizCorrect;
  document.getElementById('q-wrong').textContent = quizWrong.length;
  document.getElementById('q-total').textContent = quizDeck.length - quizIdx;
}
function nextQuiz() { quizIdx++; renderQuiz(); }
function endQuiz() { showQuizResult(); }
function showQuizResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const result = document.getElementById('quiz-result');
  result.style.display = 'block';
  const total = quizIdx;
  const pct = total > 0 ? Math.round((quizCorrect / total) * 100) : 0;
  let emoji = pct >= 90 ? '🏆' : pct >= 70 ? '✨' : pct >= 50 ? '💪' : '📚';
  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('quiz-result-score').textContent = pct + '%';
  document.getElementById('quiz-result-sub').textContent = `${quizCorrect} / ${total} 問正解`;
  let msg = pct >= 90 ? '完璧です！国試合格レベル💯' : pct >= 70 ? 'よくできました！間違えた問題を復習しよう👍' : pct >= 50 ? 'もう少し！繰り返し練習で確実に定着させよう💪' : '基礎からじっくり見直してみよう📖 まとめノートを再確認！';
  document.getElementById('quiz-result-msg').textContent = msg;
  const retryBtn = document.getElementById('retry-wrong-quiz');
  retryBtn.style.display = quizWrong.length > 0 ? 'block' : 'none';
  const listEl = document.getElementById('quiz-wrong-list');
  listEl.innerHTML = quizWrong.length > 0 ? '<div class="section-title" style="margin-top:16px;">間違えた問題</div>' + quizWrong.map(q => `<div class="wrong-item"><b>Q：</b>${q.q}<br><span style="color:#059669;">正解：</span>${q.choices[q.correct]}</div>`).join('') : '';
}
function resetQuiz() {
  document.getElementById('quiz-setup').style.display = 'block';
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('quiz-result').style.display = 'none';
  quizWrong = [];
}

    correct:1, exp:'慢性硬膜下血腫（CSDH）：被膜に包まれた液状血腫→穿頭血腫洗浄術（小さな骨孔から血腫腔にドレーンを挿入して洗浄）。転帰良好。急性硬膜下血腫は大開頭手術が必要' },
  { unit:'6', hint:false,
    q:'頭蓋内圧亢進の3主徴はどれか？',
    choices:['頭痛・嘔吐・うっ血乳頭','高血圧・徐脈・呼吸不整','発熱・頭痛・項部硬直','意識障害・瞳孔散大・除脳硬直'],
    correct:0, exp:'頭蓋内圧亢進の3主徴：①頭痛、②嘔吐（噴射状・突然）、③うっ血乳頭（視乳頭浮腫）。クッシング現象（高血圧・徐脈・呼吸不整）は頭蓋内圧亢進の末期サイン' },
  { unit:'6', hint:false,
    q:'びまん性軸索損傷（DAI）の診断に最も有用な画像検査はどれか？',
    choices:['単純CT','単純X線','MRI（DWI・SWI）','脳血管造影（DSA）'],
    correct:2, exp:'DAI：CTでは明らかな血腫を認めないが意識障害が遷延する。MRI（拡散強調像DWI・磁化率強調像SWI）が微小出血・軸索損傷の検出に有用。脳梁・脳幹・灰白質境界部に好発' },
  { unit:'6', hint:false,
    q:'小脳扁桃ヘルニア（大後頭孔ヘルニア）が最も危険な理由はどれか？',
    choices:['同側の動眼神経麻痺が起こるため','延髄の呼吸中枢・循環中枢が圧迫されるため','失語症が出現するため','視覚野が障害されるため'],
    correct:1, exp:'小脳扁桃ヘルニア：小脳扁桃が大後頭孔を通じて下方へ移動→延髄圧迫→呼吸中枢・循環中枢の障害→呼吸停止・血圧変動。脳ヘルニアの中で最も致命的' },
  { unit:'6', hint:false,
    q:'外傷後健忘（PTA）の持続期間と重症度の関係として正しいのはどれか？',
    choices:['PTAが長いほど軽症','PTAが長いほど高次脳機能障害が重篤で回復が難しい','PTAの長さと予後は関係ない','PTA24時間以上は重症には含まれない'],
    correct:1, exp:'外傷後健忘（PTA）は外傷性脳損傷の予後指標。PTA24時間以内→軽症、1週間以上→重症。PTAが長いほど注意・記憶・遂行機能障害が重篤で社会復帰が困難' },
  { unit:'6', hint:false,
    q:'TBI（外傷性脳損傷）後に出現する社会的行動障害の特徴として正しいのはどれか？',
    choices:['運動麻痺を必ず伴う','感覚障害が主症状となる','易怒性・脱抑制・共感の困難など対人関係に影響する障害が出現する','発症直後から必ず出現する'],
    correct:2, exp:'TBI後の社会的行動障害：易怒性・脱抑制・共感の困難・社会的に不適切な行動など。前頭葉損傷に多い。運動・感覚の回復後も残存し就労・社会復帰の最大の障壁となる。STが家族指導・就労支援に関与' },
];

// YOSO STATE
let yosoUnit='all', yosoDeck=[], yosoIdx=0, yosoCorrect=0, yosoWrong=[], yosoAnswered=false;

// YOSO INIT
buildUnitSelector('yoso-unit-selector', 'yosoUnit', null);

// YOSO FUNCTIONS
function startYoso(){
  const pool = yosoUnit==='all' ? [...YOSOQ] : YOSOQ.filter(q=>q.unit===yosoUnit);
  yosoDeck = pool.sort(()=>Math.random()-0.5);
  yosoIdx=0; yosoCorrect=0; yosoWrong=[];
  document.getElementById('yoso-setup').style.display='none';
  document.getElementById('yoso-area').style.display='block';
  document.getElementById('yoso-result').style.display='none';
  renderYoso();
}
function retryWrongYoso(){
  if(!yosoWrong.length) return;
  yosoDeck=[...yosoWrong].sort(()=>Math.random()-0.5);
  yosoIdx=0; yosoCorrect=0; yosoWrong=[];
  document.getElementById('yoso-area').style.display='block';
  document.getElementById('yoso-result').style.display='none';
  renderYoso();
}
function renderYoso(){
  if(yosoIdx>=yosoDeck.length){showYosoResult();return;}
  yosoAnswered=false;
  const q=yosoDeck[yosoIdx];
  const unitLabel=UNITS.find(u=>u.id===q.unit)?.label||'';
  document.getElementById('y-badge').textContent=unitLabel;
  const hintBadge=document.getElementById('y-hint-badge');
  hintBadge.style.display=q.hint?'inline-block':'none';
  document.getElementById('y-text').textContent=q.q;
  const choicesEl=document.getElementById('y-choices');
  choicesEl.innerHTML='';
  q.choices.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=`${['ア','イ','ウ','エ'][i]}．${c}`;
    btn.onclick=()=>answerYoso(i);
    choicesEl.appendChild(btn);
  });
  document.getElementById('y-exp').className='explanation-box';
  document.getElementById('yoso-btn-row').style.display='none';
  updateYosoStats();
  const pct=Math.round((yosoIdx/yosoDeck.length)*100);
  document.getElementById('yoso-bar').style.width=pct+'%';
}
function answerYoso(i){
  if(yosoAnswered) return;
  yosoAnswered=true;
  const q=yosoDeck[yosoIdx];
  const btns=document.querySelectorAll('#y-choices .choice-btn');
  btns.forEach(b=>b.disabled=true);
  const isCorrect=i===q.correct;
  btns[i].classList.add(isCorrect?'correct':'wrong');
  if(!isCorrect){btns[q.correct].classList.add('correct');yosoWrong.push(q);}
  else yosoCorrect++;
  const expEl=document.getElementById('y-exp');
  expEl.innerHTML=(isCorrect?'✅ 正解！ ':'❌ 不正解。正解は「'+['ア','イ','ウ','エ'][q.correct]+'」です。')+'<br><span class="star">★解説：</span>'+q.exp;
  expEl.className='explanation-box show';
  document.getElementById('yoso-btn-row').style.display='flex';
  updateYosoStats();
}
function updateYosoStats(){
  document.getElementById('y-correct').textContent=yosoCorrect;
  document.getElementById('y-wrong').textContent=yosoWrong.length;
  document.getElementById('y-total').textContent=yosoDeck.length-yosoIdx;
}
function nextYoso(){yosoIdx++;renderYoso();}
function endYoso(){showYosoResult();}
function showYosoResult(){
  document.getElementById('yoso-area').style.display='none';
  const result=document.getElementById('yoso-result');
  result.style.display='block';
  const total=yosoIdx;
  const pct=total>0?Math.round((yosoCorrect/total)*100):0;
  let emoji=pct>=90?'🏆':pct>=70?'✨':pct>=50?'💪':'📚';
  document.getElementById('y-result-emoji').textContent=emoji;
  document.getElementById('y-result-score').textContent=pct+'%';
  document.getElementById('y-result-sub').textContent=`${yosoCorrect} / ${total} 問正解`;
  let msg=pct>=90?'完璧！本番でもこの調子で💯':pct>=70?'よくできました！間違えた問題を確認しよう👍':pct>=50?'あと一歩！溝・孔の名前を重点的に復習しよう💪':'まとめノートを読み直してから再挑戦しよう📖';
  document.getElementById('y-result-msg').textContent=msg;
  document.getElementById('retry-wrong-yoso').style.display=yosoWrong.length>0?'block':'none';
  const listEl=document.getElementById('yoso-wrong-list');
  listEl.innerHTML=yosoWrong.length>0?'<div class="section-title" style="margin-top:16px;">間違えた問題</div>'+yosoWrong.map(q=>`<div class="wrong-item"><b>Q：</b>${q.q}<br><span style="color:#059669;">正解：</span>${q.choices[q.correct]}</div>`).join(''):'';
}
function resetYoso(){
  document.getElementById('yoso-setup').style.display='block';
  document.getElementById('yoso-area').style.display='none';
  document.getElementById('yoso-result').style.display='none';
  yosoWrong=[];
}
</script>
</body>
</html>
