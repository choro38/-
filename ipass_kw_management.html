<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート マネジメント系キーワード</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#22263a;--border:#2d3250;--accent:#6c8fff;--accent2:#a78bfa;--green:#34d399;--red:#f87171;--text:#e8eaf6;--sub:#8892b0;--radius:16px;--font:'Helvetica Neue','Hiragino Sans','Meiryo',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:16px 12px 48px;}
.hd{text-align:center;padding:16px 0 8px;}
.hd h1{font-size:1.2rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hd p{color:var(--sub);font-size:.72rem;margin-top:3px;}
.mode-wrap{display:flex;justify-content:center;gap:8px;margin:10px 0;}
.mode-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:30px;color:var(--sub);cursor:pointer;font-size:.8rem;font-weight:700;padding:6px 18px;transition:all .18s;}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.search-wrap{max-width:480px;margin:0 auto 10px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:40px;padding:8px 14px 8px 38px;color:var(--text);font-size:.88rem;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none;}
.prog-wrap{max-width:480px;margin:0 auto 10px;}
.prog-bg{background:var(--surface);border-radius:99px;height:5px;overflow:hidden;}
.prog-bar{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:99px;transition:width .4s;}
.prog-label{text-align:center;font-size:.7rem;color:var(--sub);margin-top:4px;}
.prog-label span{color:var(--accent);font-weight:700;}
#flashMode{display:block;}
.flash-area{max-width:480px;margin:0 auto;}
.flash-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:26px 22px 20px;text-align:center;cursor:pointer;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:border-color .2s;user-select:none;}
.flash-card:hover{border-color:var(--accent);}
.flash-card.revealed .front{display:none;}
.flash-card.revealed .back-s{display:flex;}
.front,.back-s{width:100%;}
.back-s{display:none;flex-direction:column;gap:7px;}
.fcat{font-size:.66rem;font-weight:700;color:var(--accent);background:rgba(108,143,255,.12);padding:2px 10px;border-radius:99px;}
.fkw{font-size:1rem;font-weight:800;line-height:1.55;}
.fhint{font-size:.68rem;color:var(--sub);margin-top:4px;}
.fans{font-size:1.1rem;font-weight:900;color:var(--green);background:rgba(52,211,153,.08);border-radius:9px;padding:9px 13px;border-left:3px solid var(--green);text-align:left;line-height:1.35;}
.fdesc{font-size:.74rem;color:var(--sub);line-height:1.65;text-align:left;}
.bclose{font-size:.64rem;color:var(--sub);text-align:right;}
.flash-nav{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;flex-wrap:wrap;}
.nav-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;font-size:.8rem;font-weight:700;padding:7px 16px;transition:all .15s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.mark-btn{background:none;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.76rem;padding:6px 13px;font-weight:700;}
.mark-ok{color:var(--green);border-color:var(--green);}
.mark-ng{color:var(--red);border-color:var(--red);}
#quizMode{display:none;}
.quiz-area{max-width:480px;margin:0 auto;}
.quiz-q{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:20px 18px 16px;margin-bottom:10px;}
.qcat{font-size:.65rem;font-weight:700;color:var(--accent2);background:rgba(167,139,250,.1);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:8px;}
.qtext{font-size:.95rem;font-weight:800;line-height:1.55;}
.qsub{font-size:.68rem;color:var(--sub);margin-top:7px;}
.choices{display:flex;flex-direction:column;gap:7px;margin-bottom:9px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;font-size:.83rem;font-weight:600;padding:10px 13px;text-align:left;transition:all .18s;line-height:1.4;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(108,143,255,.08);}
.choice-btn.correct{border-color:var(--green)!important;background:rgba(52,211,153,.12)!important;color:var(--green)!important;}
.choice-btn.wrong{border-color:var(--red)!important;background:rgba(248,113,113,.1)!important;color:var(--red)!important;}
.choice-btn:disabled{cursor:default;}
.qfb{background:var(--surface);border-radius:9px;padding:11px 14px;font-size:.76rem;color:var(--sub);line-height:1.6;display:none;border-left:3px solid var(--border);}
.qfb.show{display:block;}
.qfb.ok{border-left-color:var(--green);}
.qfb.ng{border-left-color:var(--red);}
.fbv{font-weight:800;font-size:.85rem;margin-bottom:3px;}
.qfb.ok .fbv{color:var(--green);}
.qfb.ng .fbv{color:var(--red);}
.qnext{display:none;width:100%;background:var(--accent);border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:.88rem;font-weight:800;padding:12px;margin-top:9px;}
.qnext.show{display:block;}
.score-sc{display:none;text-align:center;padding:28px 20px;max-width:480px;margin:0 auto;}
.score-sc.show{display:block;}
.sbig{font-size:3.2rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.slabel{font-size:.8rem;color:var(--sub);margin-top:4px;}
.smsg{font-size:.95rem;font-weight:700;margin:12px 0 5px;}
.retry-btn{background:var(--accent);border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:.88rem;font-weight:800;padding:12px 28px;margin-top:12px;}
.miss-list{margin-top:16px;text-align:left;}
.miss-list h3{font-size:.76rem;color:var(--sub);margin-bottom:7px;font-weight:700;}
.miss-item{background:var(--card);border-radius:7px;padding:8px 12px;margin-bottom:5px;border-left:3px solid var(--red);}
.miss-item .mt{font-size:.78rem;font-weight:800;}
.miss-item .mk{font-size:.68rem;color:var(--sub);margin-top:2px;}
</style>
</head>
<body>
<div class="hd"><h1>📘 ITパスポート マネジメント系キーワード</h1><p id="totalLabel"></p></div>
<div class="mode-wrap">
  <button class="mode-btn active" id="btnF" onclick="switchMode('flash')">🃏 フラッシュ</button>
  <button class="mode-btn" id="btnQ" onclick="switchMode('quiz')">✅ 4択クイズ</button>
</div>
<div class="search-wrap"><span class="search-ico">🔍</span><input type="text" id="searchInput" placeholder="用語・キーワードを検索…" oninput="onSearch()"></div>
<div class="prog-wrap"><div class="prog-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div><div class="prog-label" id="progLabel"></div></div>
<div id="flashMode"><div class="flash-area">
  <div class="flash-card" id="flashCard" onclick="revealFlash()">
    <div class="front"><span class="fcat" id="fCat"></span><div class="fkw" id="fKw"></div><div class="fhint">👆 タップして用語を確認</div></div>
    <div class="back-s"><span class="fcat" id="fCat2"></span><div style="font-size:.67rem;color:var(--accent2);font-weight:700;">✅ これを選べば正解！</div><div class="fans" id="fAns"></div><div class="fdesc" id="fDesc"></div><div class="bclose">もう一度タップで戻る</div></div>
  </div>
  <div class="flash-nav">
    <button class="nav-btn" id="fPrev" onclick="flashMove(-1)">◀ 前</button>
    <button class="mark-btn mark-ok" onclick="markFlash(true)">✅ 覚えた</button>
    <button class="mark-btn mark-ng" onclick="markFlash(false)">❌ もう一度</button>
    <button class="nav-btn" id="fNext" onclick="flashMove(1)">次 ▶</button>
  </div>
  <div style="text-align:center;margin-top:9px;"><button class="nav-btn" onclick="initFlash()" style="font-size:.7rem;padding:5px 11px;">🔀 シャッフル</button></div>
</div></div>
<div id="quizMode"><div class="quiz-area" id="quizBody">
  <div class="quiz-q"><span class="qcat" id="qCat"></span><div class="qtext" id="qKw"></div><div class="qsub">↑ このキーワードが表す用語はどれ？</div></div>
  <div class="choices" id="choices"></div>
  <div class="qfb" id="quizFb"><div class="fbv" id="fbVerdict"></div><div id="fbDesc"></div></div>
  <button class="qnext" id="quizNext" onclick="nextQuiz()">次の問題 ▶</button>
</div>
<div class="score-sc" id="scoreScreen">
  <div class="sbig" id="scoreBig"></div><div class="slabel" id="scoreLabel"></div><div class="smsg" id="scoreMsg"></div>
  <div class="miss-list" id="missList"></div>
  <button class="retry-btn" onclick="startQuiz()">🔄 もう一度</button>
</div></div>
<script>
const DATA=[{"cat": "開発プロセス", "term": "PMBOK", "keyword": "プロジェクト管理の国際標準知識体系", "desc": "Project Management Body of Knowledge。スコープ・品質・リスク・コストなど10の知識エリアでプロジェクト管理を体系化した標準。"}, {"cat": "開発プロセス", "term": "プロジェクト憲章", "keyword": "新規プロジェクトを正式に認可する文書", "desc": "プロジェクトの目的・スコープ・スケジュール・予算・責任者などを定めプロジェクトの存在を正式承認する文書。"}, {"cat": "開発プロセス", "term": "WBS", "keyword": "プロジェクト作業を階層的に分解した成果物一覧図", "desc": "Work Breakdown Structure。プロジェクト全体の作業を管理可能な単位（ワークパッケージ）に細分化した構造図。"}, {"cat": "開発プロセス", "term": "クリティカルパス", "keyword": "プロジェクトの最長経路＝遅延すると全体に影響する経路", "desc": "プロジェクト最短完了のための作業連鎖。この経路上の作業が遅れると必ずプロジェクト全体が遅延する。"}, {"cat": "開発プロセス", "term": "ガントチャート", "keyword": "工程の開始・終了・進捗を横棒で表す進捗管理図", "desc": "縦軸に作業・横軸に時間をとり作業期間を横棒で表現する図。進捗状況を直感的に把握できる。"}, {"cat": "開発プロセス", "term": "アローダイアグラム（PERT）", "keyword": "作業の順序・依存関係を矢印で表し最短日数を求める手法", "desc": "作業を矢印（アロー）で表し先行関係を図示する。クリティカルパスを特定してプロジェクト完成までの最短日数を求める。"}, {"cat": "開発プロセス", "term": "ステークホルダー", "keyword": "プロジェクトに利害関係を持つすべての人・組織", "desc": "発注者・ユーザー・開発チーム・経営陣など、プロジェクトに関わるすべての利害関係者。ニーズの把握と調整が重要。"}, {"cat": "開発プロセス", "term": "リスク対応策（回避・軽減・転嫁・受容）", "keyword": "プロジェクトリスクへの4種類の対応方法", "desc": "回避（リスク要因を取り除く）・軽減（影響を小さくする）・転嫁（保険や外注で移す）・受容（あえて受け入れる）の4種類。"}, {"cat": "開発プロセス", "term": "ウォーターフォールモデル", "keyword": "要件定義→設計→開発→テストを順序良く完了する開発手法", "desc": "前工程完了後に次工程へ進む。要件が明確・変更が少ないプロジェクトに適する。手戻りが発生するとコストが大きい。"}, {"cat": "開発プロセス", "term": "アジャイル開発", "keyword": "短い反復サイクルで変化に柔軟に対応する開発手法", "desc": "スプリント単位（通常2週間）で計画・開発・テスト・リリースを繰り返す。スクラムが代表的なフレームワーク。"}, {"cat": "開発プロセス", "term": "スクラム", "keyword": "アジャイル開発の代表的なフレームワーク", "desc": "プロダクトオーナー・スクラムマスター・開発者の3役割でチームを構成。スプリントを繰り返して製品を段階的に完成させる。"}, {"cat": "開発プロセス", "term": "スプリント", "keyword": "スクラムにおける1〜4週間の短い開発反復サイクル", "desc": "スクラムの作業単位。冒頭で計画し、終わりにレビューとふりかえりを行い次のスプリントに活かす。"}, {"cat": "開発プロセス", "term": "プロダクトバックログ", "keyword": "スクラムで実装すべき機能・要求を優先順位付きで並べたリスト", "desc": "プロダクトオーナーが管理する。優先度の高いものから順にスプリントで実装していく。常に更新される生きたリスト。"}, {"cat": "開発プロセス", "term": "スパイラルモデル", "keyword": "リスク分析を繰り返しながらプロトタイプを作り込む開発モデル", "desc": "プロトタイプを繰り返し作成してリスクを評価しながら開発を進める。要件が不明確・リスクが高いシステムに適する。"}, {"cat": "開発プロセス", "term": "プロトタイピングモデル", "keyword": "試作品を早期に作ってユーザーの要件を確認する開発手法", "desc": "本格的な開発前にプロトタイプを作ってユーザーに確認してもらい、要件を確定させてから本開発に入る手法。"}, {"cat": "開発プロセス", "term": "DevOps", "keyword": "開発チームと運用チームが連携して高速・継続的にリリース", "desc": "Development＋Operations。開発と運用の壁をなくしCI/CD（継続的インテグレーション・デリバリー）を実践して高頻度かつ安定したリリースを実現する。"}, {"cat": "開発プロセス", "term": "CI/CD", "keyword": "コード変更を自動ビルド・テスト・デプロイする継続的な仕組み", "desc": "継続的インテグレーション（CI）と継続的デリバリー（CD）の組み合わせ。コード変更を自動でテストし本番環境へ展開する。"}, {"cat": "開発プロセス", "term": "テスト駆動開発（TDD）", "keyword": "テストを先に書いてからコードを実装する開発手法", "desc": "Test Driven Development。まずテストコードを書き、それをパスするように実装する。バグの早期発見とリファクタリングしやすいコードが利点。"}, {"cat": "開発プロセス", "term": "リバースエンジニアリング", "keyword": "完成品を分析して設計・仕様を明らかにする手法", "desc": "既存のソフトウェア・ハードウェアを解析して内部構造・仕様を明らかにする手法。互換製品の開発や脆弱性調査に使われる。"}, {"cat": "開発プロセス", "term": "FP法（ファンクションポイント法）", "keyword": "システムの機能規模を数値化して開発工数を見積もる手法", "desc": "Function Point法。入力・出力・照会・内部ファイル等の数と複雑さでシステム規模を定量的に見積もる手法。"}, {"cat": "開発プロセス", "term": "類推見積法", "keyword": "過去の類似プロジェクトを参考に規模・費用を見積もる手法", "desc": "経験のある類似プロジェクトを参照して規模・コスト・期間を見積もる手法。早期見積もりに向くが精度は低い。"}, {"cat": "開発プロセス", "term": "ブラックボックステスト", "keyword": "内部構造を考慮せず入出力の仕様どおりの動作を確認するテスト", "desc": "プログラムの内部を見ずに仕様書通りの入力に対して正しい出力が得られるかを確認するテスト手法。"}, {"cat": "開発プロセス", "term": "ホワイトボックステスト", "keyword": "プログラムの内部構造・処理経路を確認するテスト", "desc": "ソースコードの内部処理を把握した上で、すべての処理経路・条件分岐が正しく動作するかを確認するテスト手法。"}, {"cat": "開発プロセス", "term": "回帰テスト（リグレッションテスト）", "keyword": "修正後に既存機能への影響がないかを確認するテスト", "desc": "プログラムを修正・変更した後、修正前に正常だった機能が壊れていないかを確認するテスト。"}, {"cat": "開発プロセス", "term": "受入れテスト", "keyword": "発注者がシステムを引き渡し前に要件どおりか確認するテスト", "desc": "開発完了後、発注者（ユーザー側）が実際の業務環境で要件・仕様を満たしているかを確認するテスト。"}, {"cat": "開発プロセス", "term": "コードレビュー", "keyword": "他のメンバーがコードを確認してバグ・品質問題を早期発見", "desc": "プログラムのソースコードを別の開発者が読んで、バグ・セキュリティ問題・保守性の問題を見つけてフィードバックする作業。"}, {"cat": "開発プロセス", "term": "デバッグ", "keyword": "プログラムのバグ（誤り）を発見して修正する作業", "desc": "テストで発見した不具合の原因を特定し修正するプロセス。テストはバグを「見つける」、デバッグはバグを「直す」。"}, {"cat": "開発プロセス", "term": "バージョン管理", "keyword": "ファイルの変更履歴を記録し過去の状態に戻せる仕組み", "desc": "Gitが代表例。誰が・いつ・何を変更したかを記録し、過去の状態への復元・複数人での並行作業を可能にする。"}, {"cat": "開発プロセス", "term": "ペアプログラミング", "keyword": "2人で1台のPCを使って交互にコーディングするXPの手法", "desc": "ドライバー（コードを書く）とナビゲーター（確認・助言する）が役割を交代しながら開発する。品質向上・知識共有の効果がある。"}, {"cat": "開発プロセス", "term": "リファクタリング", "keyword": "外部から見た機能を変えずにコードの内部構造を改善すること", "desc": "動作はそのままにコードをわかりやすく・保守しやすく整理し直す作業。技術的負債を解消し長期的な開発効率を維持する。"}, {"cat": "開発プロセス", "term": "ユーザーストーリー", "keyword": "アジャイル開発でユーザーの要求を短い文章で表現したもの", "desc": "「○○として、〜したい。なぜなら〜だから」の形式でユーザーの要求を表現する。開発チームが実装すべき機能を理解するために使う。"}, {"cat": "開発プロセス", "term": "マイルストーン", "keyword": "プロジェクトの重要な節目となる中間目標・完了地点", "desc": "プロジェクトを進める上での重要な通過点。「設計完了」「結合テスト完了」など進捗管理の基準点として使われる。"}, {"cat": "開発プロセス", "term": "CMMI", "keyword": "ソフトウェア開発組織のプロセス成熟度を5段階で評価するモデル", "desc": "Capability Maturity Model Integration。レベル1（初期）〜レベル5（最適化）でプロセスの成熟度を評価・改善するフレームワーク。"}, {"cat": "開発プロセス", "term": "共通フレーム（SLCP）", "keyword": "ソフトウェア開発・取引の標準的な作業項目を定義した日本の規格", "desc": "Software Life Cycle Process。日本でのソフトウェア取引を適正化するため開発・保守の全プロセスを体系化・標準化した枠組み。"}, {"cat": "開発プロセス", "term": "API", "keyword": "ソフトウェア同士が機能を使い合うための接続口", "desc": "Application Programming Interface。異なるソフトウェア間でデータ・機能をやり取りするための窓口。"}, {"cat": "開発プロセス", "term": "マイクロサービス", "keyword": "アプリを小さな独立したサービスの集合として構築する設計", "desc": "大きなシステムを機能ごとに独立した小さなサービスに分割する設計手法。各サービスを独立して開発・デプロイ・スケールできる。"}, {"cat": "開発プロセス", "term": "コンテナ（Docker）", "keyword": "アプリと実行環境をひとまとめにして軽量に動かす仮想化技術", "desc": "Dockerが代表例。OSを共有しながらアプリごとに隔離された実行環境を作る技術。仮想マシンより軽量で起動が速い。"}, {"cat": "開発プロセス", "term": "IaC（Infrastructure as Code）", "keyword": "インフラ構成をコードで管理して自動構築・変更を実現", "desc": "Infrastructure as Code。サーバ・ネットワーク設定をYAML等のコードで記述し、バージョン管理・自動化を実現する手法。"}, {"cat": "開発プロセス", "term": "ローコード・ノーコード", "keyword": "プログラミングをほとんど書かずにアプリを作れる開発手法", "desc": "ドラッグ＆ドロップなどの視覚的操作でアプリを開発できる。専門知識がなくても業務アプリを作れるためDX推進の手段として注目。"}, {"cat": "サービスマネジメント", "term": "SLA（サービスレベル合意書）", "keyword": "ITサービス品質目標を提供者と顧客が合意した文書", "desc": "Service Level Agreement。稼働率・応答時間・障害対応時間などサービス品質の目標値を契約として定める文書。"}, {"cat": "サービスマネジメント", "term": "SLM（サービスレベル管理）", "keyword": "SLAの計画・合意・測定・改善を継続的に実施するプロセス", "desc": "Service Level Management。SLAの策定から計測・報告・改善まで、サービスレベルを継続的に維持・向上させる管理プロセス。"}, {"cat": "サービスマネジメント", "term": "ITIL", "keyword": "ITサービス管理のベストプラクティスをまとめたフレームワーク", "desc": "IT Infrastructure Library。英国政府が整理したITサービス管理の実践ガイド。インシデント管理・問題管理・変更管理などを定義。"}, {"cat": "サービスマネジメント", "term": "サービスデスク", "keyword": "稼働後のITサービスで利用者問合せを一元受付する窓口（SPOC）", "desc": "Single Point of Contact機能。ITサービスの利用者の問題・質問・要求を一元的に受け付ける組織・機能。"}, {"cat": "サービスマネジメント", "term": "インシデント管理", "keyword": "IT障害を迅速に復旧してサービスを回復するプロセス", "desc": "ITサービスの中断・品質低下を検知し、できる限り早くサービスを正常な状態に戻す活動。根本原因解決は問題管理が担う。"}, {"cat": "サービスマネジメント", "term": "問題管理", "keyword": "繰り返すインシデントの根本原因を調査・排除するプロセス", "desc": "インシデントの根本原因を特定し恒久対策を行うプロセス。インシデント管理（応急処置）と目的が異なる。"}, {"cat": "サービスマネジメント", "term": "変更管理", "keyword": "ITシステムの変更を計画・承認・実施・記録する管理プロセス", "desc": "システムへの変更（パッチ適用・設定変更・機能追加等）を計画的に行い、障害リスクを最小化するプロセス。"}, {"cat": "サービスマネジメント", "term": "構成管理", "keyword": "ITシステムを構成するハードウェア・ソフトウェアの情報をCMDBで管理", "desc": "CMDB（構成管理データベース）にCIアイテム（サーバ・ソフト・ネットワーク機器等）の情報を記録・管理するプロセス。"}, {"cat": "サービスマネジメント", "term": "サービス可用性管理", "keyword": "ITサービスが合意した稼働率・可用性を達成するための管理", "desc": "稼働率目標を設定し、障害予防・迅速復旧・計画的メンテナンスを通じてサービスの継続提供を確保するプロセス。"}, {"cat": "サービスマネジメント", "term": "容量管理（キャパシティ管理）", "keyword": "現在・将来のITリソース需要を予測して適切な容量を確保", "desc": "サーバのCPU・メモリ・ストレージ・ネットワーク帯域などが将来の需要に対応できるよう計画的に管理するプロセス。"}, {"cat": "サービスマネジメント", "term": "エスカレーション", "keyword": "現場で解決できない問題を上位の担当者・組織に引き継ぐ", "desc": "サービスデスクで対応困難なインシデントを専門チームや上位レベルに引き継ぐプロセス。適切なエスカレーションが解決時間を短縮する。"}, {"cat": "サービスマネジメント", "term": "ファシリティマネジメント", "keyword": "建物・設備・環境を最適状態に維持・改善する管理活動", "desc": "オフィス・データセンターなどの施設・設備を総合管理し、コスト最適化・快適性・安全性を向上させる活動。"}, {"cat": "サービスマネジメント", "term": "TCO（総所有コスト）", "keyword": "導入から廃棄まで機器のライフサイクル全体でかかる総費用", "desc": "Total Cost of Ownership。購入費用だけでなく保守・運用・電気代・廃棄費用まで含めた総コスト。IT投資の判断指標。"}, {"cat": "サービスマネジメント", "term": "システム監査", "keyword": "ITシステムのリスク対応を独立した立場で検証・評価する活動", "desc": "システム監査人が情報システムリスクへの対応状況を客観的に検証・評価し改善提案を行う活動。"}, {"cat": "サービスマネジメント", "term": "ITガバナンス", "keyword": "経営陣がITの利活用方針を示し組織全体を統制する仕組み", "desc": "取締役会等がステークホルダーのニーズに基づきIT戦略・方針を策定し、その実現を統制・モニタリングする活動。"}, {"cat": "サービスマネジメント", "term": "内部統制", "keyword": "健全・効率的な組織運営のための自己管理体制", "desc": "業務プロセスの明確化・職務分掌・実施ルール設定・チェック体制確立によって組織が自ら構築・運用する管理の仕組み。"}, {"cat": "サービスマネジメント", "term": "レガシーシステム", "keyword": "古い技術で作られ刷新が困難な既存の情報システム", "desc": "老朽化・複雑化が進み保守が困難になったシステム。DXの妨げになることが多く廃棄・刷新が課題。"}, {"cat": "サービスマネジメント", "term": "システムライフサイクル", "keyword": "システムの計画・開発・運用・廃棄までの全期間", "desc": "要件定義→設計→開発→テスト→運用→廃棄の一連の流れ。各フェーズで適切なコスト管理・品質管理が求められる。"}, {"cat": "サービスマネジメント", "term": "BPR", "keyword": "業務プロセスを根本から見直して劇的な改善を目指す手法", "desc": "Business Process Reengineering。既存の業務の延長線上ではなく、ゼロから業務プロセスを再設計して大幅な効率化・コスト削減を図る。"}, {"cat": "サービスマネジメント", "term": "BPM", "keyword": "業務プロセスを継続的にモニタリング・改善するマネジメント", "desc": "Business Process Management。業務フローを可視化し効率・品質を継続的に監視・改善するための管理手法とツール群。"}, {"cat": "サービスマネジメント", "term": "RPA", "keyword": "定型的なPC操作をソフトウェアロボットで自動化する技術", "desc": "Robotic Process Automation。人が行うPC画面操作（入力・コピー・転記等）を記録して自動実行するツール。"}, {"cat": "サービスマネジメント", "term": "SaaS", "keyword": "ソフトウェアをインターネット経由でサービスとして提供", "desc": "Software as a Service。インストール不要でブラウザから利用するクラウドサービス。GmailやSalesforceが代表例。"}, {"cat": "サービスマネジメント", "term": "PaaS", "keyword": "アプリの開発・実行環境をクラウドで提供するサービス", "desc": "Platform as a Service。OS・ミドルウェア・開発環境をクラウドで提供。インフラ管理なしでアプリ開発に集中できる。"}, {"cat": "サービスマネジメント", "term": "IaaS", "keyword": "サーバ・ストレージ・ネットワーク等のインフラをクラウドで提供", "desc": "Infrastructure as a Service。仮想サーバ・ストレージ等をクラウドで提供。AWS・Azure・GCPが代表例。"}, {"cat": "サービスマネジメント", "term": "オンプレミス", "keyword": "自社のデータセンター・サーバルームにシステムを設置・運用", "desc": "On-Premises。クラウドと対比される自社所有・管理のITインフラ。セキュリティ・カスタマイズの自由度が高い反面初期投資が大きい。"}, {"cat": "サービスマネジメント", "term": "アウトソーシング", "keyword": "自社業務を外部企業に委託しコア業務に集中する戦略", "desc": "コア業務以外を専門の外部企業に委託してコスト削減・品質向上・経営資源の集中を図る経営手法。"}, {"cat": "サービスマネジメント", "term": "マネージドサービス", "keyword": "ITシステムの運用・監視・保守をベンダーに包括委託するサービス", "desc": "サーバの監視・バックアップ・パッチ適用・障害対応などをIT企業に委託することで自社の運用負担を削減する。"}, {"cat": "サービスマネジメント", "term": "EA（エンタープライズアーキテクチャ）", "keyword": "企業全体のITシステム・業務・組織を統一した設計指針で整理", "desc": "Enterprise Architecture。業務・データ・アプリケーション・技術の4層でIT全体像を整理し、全体最適のIT投資・設計を実現する枠組み。"}, {"cat": "サービスマネジメント", "term": "情報システム戦略", "keyword": "経営戦略を実現するためのITシステム全体の方針・計画", "desc": "経営戦略に基づいてどのようなITシステムを構築・活用するかを定めた計画。業務改善・競争優位に向けた投資方針を含む。"}, {"cat": "サービスマネジメント", "term": "グリーン調達", "keyword": "環境負荷が低い製品・サービスを優先的に調達する方針", "desc": "製品の原材料・部品・サービスを選ぶ際に、環境への影響を評価基準に加える調達方針。"}, {"cat": "品質管理", "term": "TQM（総合的品質管理）", "keyword": "組織全体で品質向上に取り組む経営手法", "desc": "Total Quality Management。製品品質だけでなく業務・サービス・組織文化全体の品質向上を全社員で継続的に追求する。"}, {"cat": "品質管理", "term": "シックスシグマ", "keyword": "統計的手法で業務の欠陥・ばらつきを100万分の3.4以下に抑える", "desc": "品質改善手法。統計的分析で問題の根本原因を特定し欠陥率を極限まで低減する。DMAIC（定義・測定・分析・改善・制御）を使う。"}, {"cat": "品質管理", "term": "かんばん方式", "keyword": "必要なものを必要なときに必要な量だけ作る生産管理手法", "desc": "トヨタ生産方式の中核。「かんばん」と呼ぶカードで部品の補充・生産を指示する。在庫の最小化と流れの最適化が目的。"}, {"cat": "品質管理", "term": "JIT（ジャストインタイム）", "keyword": "必要な物を必要な時に必要なだけ供給する生産方式", "desc": "Just In Time。在庫を持たず必要なタイミングで部品・材料を調達・生産する方式。在庫コスト削減とムダの排除が目的。"}, {"cat": "品質管理", "term": "ナレッジマネジメント", "keyword": "組織内の知識・ノウハウを共有・活用する仕組み", "desc": "個人が持つ暗黙知を形式知化して組織全体で共有・活用する管理手法。SECIモデルが有名。"}, {"cat": "品質管理", "term": "SECIモデル", "keyword": "暗黙知と形式知の変換サイクルで組織的な知識創造を説明", "desc": "共同化（暗黙知→暗黙知）・表出化（暗黙知→形式知）・連結化（形式知→形式知）・内面化（形式知→暗黙知）の4プロセス。"}, {"cat": "品質管理", "term": "特性要因図（フィッシュボーン）", "keyword": "問題の原因を魚の骨のような図で体系的に整理する手法", "desc": "品質管理の7つ道具の一つ。問題を引き起こす原因を「人・機械・材料・方法」などの視点から洗い出す。"}, {"cat": "品質管理", "term": "パレート図", "keyword": "問題・原因を重要度順に棒グラフで表す品質管理ツール", "desc": "「80:20の法則」に基づき上位20%の原因が全体の80%の問題を引き起こすという考えで重要課題を特定する。"}, {"cat": "品質管理", "term": "管理図", "keyword": "製品の品質特性の時系列変化を記録して異常を早期発見する図", "desc": "製品の寸法・重量などの品質特性を時系列でプロットし、管理限界線を超えたら異常として対処する品質管理ツール。"}, {"cat": "品質管理", "term": "ヒストグラム", "keyword": "データの分布状況を棒グラフで表す統計的な品質管理ツール", "desc": "測定データをいくつかの区間に分けて各区間の度数を棒グラフで示す。データの分布・ばらつきを直感的に把握できる。"}, {"cat": "品質管理", "term": "散布図", "keyword": "2つの変数の関係（相関）を点で表すグラフ", "desc": "横軸と縦軸に2つの変数をとり、データを点でプロットする。相関関係（正・負・無相関）を視覚的に把握できる。"}, {"cat": "品質管理", "term": "PDCA", "keyword": "Plan→Do→Check→Actの継続改善サイクル", "desc": "計画・実行・評価・改善を繰り返して業務・品質・セキュリティなどを継続的に向上させるフレームワーク。"}, {"cat": "データ分析", "term": "BI（ビジネスインテリジェンス）", "keyword": "データを分析・可視化して経営判断を支援するツール・仕組み", "desc": "Business Intelligence。売上・在庫・顧客データをグラフやダッシュボードで可視化し、経営判断をデータに基づいて行うための仕組み。"}, {"cat": "データ分析", "term": "データウェアハウス", "keyword": "分析用に整理・蓄積された大規模なデータの倉庫", "desc": "業務システムのデータを分析しやすい形に整理して蓄積した大規模DB。BIツールと組み合わせて経営分析に使う。"}, {"cat": "データ分析", "term": "データマイニング", "keyword": "大量データから統計的手法で有用なパターン・法則を発見", "desc": "大量のデータを分析して人間が気づかない法則・パターン・相関関係を発見する技術。マーケティング・不正検知などに使われる。"}, {"cat": "データ分析", "term": "ビッグデータ（3V）", "keyword": "Volume・Velocity・Varietyの3要素を持つ大規模データ群", "desc": "従来DBでは扱えない規模・速度・多様性を持つデータ群。SNS・センサー・購買履歴など。分析にはAIや統計的手法を活用する。"}, {"cat": "データ分析", "term": "データクレンジング", "keyword": "データの誤り・重複・欠損を修正・整理してきれいにする作業", "desc": "AI学習データやDBの品質を高めるため、誤ったデータ・表記ゆれ・重複・欠損値を修正・統一する前処理作業。"}, {"cat": "データ分析", "term": "アノテーション", "keyword": "機械学習の教師データに正解ラベルを付与する作業", "desc": "AIの教師あり学習で使う訓練データに「これは猫」などの正解情報（ラベル）を人間が付与する作業。"}, {"cat": "データ分析", "term": "パレート分析（ABC分析）", "keyword": "品目を重要度でA・B・Cの3グループに分類して管理", "desc": "売上・在庫・不良件数などをパレート図で分析し、上位の少数品目（A）を重点管理する手法。80:20の法則を活用。"}, {"cat": "データ分析", "term": "回帰分析", "keyword": "変数間の関係を数式で表して将来を予測する統計手法", "desc": "1つまたは複数の説明変数から目的変数を予測する式を求める統計手法。売上予測・需要予測などに使われる。"}, {"cat": "データ分析", "term": "相関分析", "keyword": "2つの変数の関係の強さ・方向を数値（相関係数）で表す手法", "desc": "相関係数は-1から1の値。1に近いほど正の相関（一方が増えるともう一方も増える）、-1に近いほど負の相関。0は無相関。"}, {"cat": "データ分析", "term": "クロス集計", "keyword": "2つの変数を縦横に並べてデータの関係を集計する表", "desc": "性別×購入有無、年代×商品など2つのカテゴリ変数の関係を表で整理する手法。マーケティング分析で多用される。"}, {"cat": "データ分析", "term": "オープンデータ", "keyword": "行政・研究機関等が誰でも自由に利用できる形で公開するデータ", "desc": "国・地方自治体・研究機関などが機械可読形式（CSV・JSON等）で公開するデータ。二次利用・加工が自由なデータ。"}, {"cat": "データ分析", "term": "テキストマイニング", "keyword": "大量のテキストデータから有用な知識・パターンを抽出する技術", "desc": "SNSの投稿・アンケート・コールセンターの記録などのテキストを分析して、感情・トレンド・キーワードを抽出する技術。"}, {"cat": "データ分析", "term": "デシジョンツリー", "keyword": "条件分岐を木構造で表し意思決定を支援するツール", "desc": "「もし〜なら」という条件の分岐を木の枝のように展開して各選択肢の結果・確率・期待値を整理する意思決定ツール。"}, {"cat": "データ分析", "term": "シミュレーション", "keyword": "現実の系を数学的モデルで模擬して結果を予測する手法", "desc": "実際に試すことなくコンピュータで模擬実験を行って、様々な条件下での結果を予測・検証する手法。"}, {"cat": "データ分析", "term": "統計的バイアス", "keyword": "データ収集・分析の方法によって生じる系統的な偏り", "desc": "選択バイアス（特定の人しか回答しない）・情報バイアス（思い込みによる誤答）など。バイアスを認識して分析することが重要。"}, {"cat": "データ分析", "term": "仮説検定", "keyword": "データから仮説が正しいかどうかを統計的に判断する手法", "desc": "「薬Aは効果がある」という仮説を、集めたデータと有意水準（通常5%）を使って正しいかどうかを判断する統計的手法。"}, {"cat": "データ分析", "term": "標準偏差", "keyword": "データのばらつきの大きさを表す統計指標", "desc": "平均値からのデータのずれの大きさを示す指標。標準偏差が大きいほどデータがばらついている。偏差値の計算にも使われる。"}, {"cat": "データ分析", "term": "外れ値（異常値）", "keyword": "他のデータと大きく異なるデータ点", "desc": "データの分布から大きく離れた値。入力ミス・センサー故障・本当の異常事態の可能性がある。AI学習前に適切に処理する必要がある。"}, {"cat": "情報システム", "term": "SoR（記録のシステム）", "keyword": "基幹業務データを正確に記録・管理するシステム", "desc": "Systems of Record。ERPや会計システムなど信頼性・正確性が最優先のデータ管理システム。"}, {"cat": "情報システム", "term": "SoE（関与のシステム）", "keyword": "顧客・従業員との関係性・エンゲージメントを高めるシステム", "desc": "Systems of Engagement。SNS・スマホアプリ・CRMなど、ユーザーとの接点でインタラクションを重視するシステム。"}, {"cat": "情報システム", "term": "ハウジングサービス", "keyword": "データセンターの設備・スペースを貸し出すサービス", "desc": "自社のサーバをデータセンターに設置して電源・空調・セキュリティなどの設備を借りるサービス。"}, {"cat": "情報システム", "term": "ホスティングサービス", "keyword": "サーバ本体も含めてデータセンターが管理・提供するサービス", "desc": "サーバの所有・管理もデータセンター側が行い、ユーザーはWebサイトやアプリの運用に専念できるサービス。"}, {"cat": "情報システム", "term": "仮想化", "keyword": "1台の物理サーバを複数の仮想マシンとして動作させる技術", "desc": "ハイパーバイザー等を使い1台の物理サーバ上に複数のOSを独立稼働させる。リソース有効活用・コスト削減に貢献。"}, {"cat": "情報システム", "term": "費用対効果分析", "keyword": "IT投資のコストと得られる効果を定量的に比較・評価", "desc": "導入コスト・運用コストと業務効率化・売上向上などの効果を金額換算して比較し、投資の妥当性を判断する分析手法。"}, {"cat": "情報システム", "term": "デジタルリテラシー", "keyword": "デジタル技術を理解し適切に活用する能力", "desc": "コンピュータ・スマートフォン・インターネットを使いこなし、情報の信頼性を判断し安全に活用できる基礎的な能力。"}, {"cat": "情報システム", "term": "E-R図", "keyword": "エンティティと関係（リレーションシップ）でDB構造を表す設計図", "desc": "Entity Relationship Diagram。DB論理設計で使う図。エンティティ（表）同士の関係を1対多・多対多などで表現する。"}, {"cat": "情報システム", "term": "DFD（データフロー図）", "keyword": "システム内のデータの流れを矢印で表した図", "desc": "Data Flow Diagram。データがどこから来て、どこで処理され、どこへ行くかを図示する。業務分析・システム設計に使う。"}, {"cat": "情報システム", "term": "BPMN", "keyword": "業務プロセスの流れをフローチャート形式で表す国際標準記法", "desc": "Business Process Model and Notation。業務の流れ・条件分岐・並列処理などを標準化された記号で表現する業務設計ツール。"}, {"cat": "情報システム", "term": "ユースケース", "keyword": "システムがユーザーのどのような要求に応えるかを表した仕様", "desc": "システムと外部（ユーザー・他システム）のやり取りを「○○する」の形で列挙したもの。UMLで図示することが多い。"}, {"cat": "情報システム", "term": "UML", "keyword": "ソフトウェアの設計・構造を図で表現する国際標準の記法", "desc": "Unified Modeling Language。クラス図・シーケンス図・ユースケース図など複数の図でシステムの構造・動作を表現する。"}, {"cat": "情報システム", "term": "クラウドネイティブ", "keyword": "クラウドの特性を最大活用した設計・開発のアプローチ", "desc": "コンテナ・マイクロサービス・CI/CD・IaCを組み合わせてクラウドの拡張性・柔軟性を最大限に活用するアーキテクチャ。"}, {"cat": "情報システム", "term": "ERP", "keyword": "財務・人事・生産・販売など企業の基幹業務を統合管理するシステム", "desc": "Enterprise Resource Planning。基幹業務パッケージシステム。リアルタイムでデータを一元管理し経営の効率化・可視化を実現。"}, {"cat": "情報システム", "term": "ソフトウェアライセンス", "keyword": "ソフトウェアの利用条件を定めた許諾契約", "desc": "ソフトウェアを使う権利を与えるための契約。ボリュームライセンス（複数台契約）・サイトライセンス（組織全体契約）などの形態がある。"}, {"cat": "情報システム", "term": "ミドルウェア", "keyword": "OSとアプリの中間に位置してアプリ開発を支援するソフト", "desc": "データベース管理システム（DBMS）・Webサーバ・アプリサーバなどが該当。OSとアプリの橋渡しをする。"}, {"cat": "情報システム", "term": "API（WebAPI）", "keyword": "Webサービス間でデータ・機能を連携させるインタフェース", "desc": "Application Programming Interface。異なるサービス間でデータをやり取りする窓口。天気予報APIや地図API等が身近な例。"}];
document.getElementById('totalLabel').textContent='全'+DATA.length+'語 シラバスVer.6.5準拠';
let currentMode='flash',searchQ='',fDeck=[],fIdx=0,fOkSet=new Set(),qPool=[],qIdx=0,qScore=0,qMiss=[],qAnswered=false;
function getPool(){return DATA.filter(d=>{const q=searchQ.toLowerCase();return !q||d.term.toLowerCase().includes(q)||d.keyword.toLowerCase().includes(q);});}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function setProgress(c,t){const p=t?Math.round(c/t*100):0;document.getElementById('progBar').style.width=p+'%';document.getElementById('progLabel').innerHTML='<span>'+c+'</span> / '+t+'問';}
function onSearch(){searchQ=document.getElementById('searchInput').value.trim();if(currentMode==='flash')initFlash();else startQuiz();}
function switchMode(m){currentMode=m;document.getElementById('btnF').className='mode-btn'+(m==='flash'?' active':'');document.getElementById('btnQ').className='mode-btn'+(m==='quiz'?' active':'');document.getElementById('flashMode').style.display=m==='flash'?'block':'none';document.getElementById('quizMode').style.display=m==='quiz'?'block':'none';if(m==='flash')initFlash();else startQuiz();}
function initFlash(){fDeck=shuffle(getPool());fIdx=0;fOkSet.clear();if(!fDeck.length)return;showFlash();}
function showFlash(){if(!fDeck.length)return;const d=fDeck[fIdx];document.getElementById('flashCard').classList.remove('revealed');document.getElementById('fCat').textContent=d.cat||'';document.getElementById('fCat2').textContent=d.cat||'';document.getElementById('fKw').textContent=d.keyword;document.getElementById('fAns').textContent=d.term;document.getElementById('fDesc').textContent=d.desc;document.getElementById('fPrev').disabled=fIdx===0;document.getElementById('fNext').disabled=fIdx===fDeck.length-1;setProgress(fIdx+1,fDeck.length);}
function revealFlash(){document.getElementById('flashCard').classList.toggle('revealed');}
function flashMove(dir){fIdx=Math.max(0,Math.min(fDeck.length-1,fIdx+dir));showFlash();}
function markFlash(ok){if(ok)fOkSet.add(fDeck[fIdx].term);else fOkSet.delete(fDeck[fIdx].term);if(fIdx<fDeck.length-1){fIdx++;showFlash();}else{const ng=fDeck.length-fOkSet.size;alert('お疲れさまでした！\n✅覚えた:'+fOkSet.size+'語　❌もう一度:'+ng+'語');if(ng>0){fDeck=shuffle(fDeck.filter(d=>!fOkSet.has(d.term)));fIdx=0;showFlash();}}}
function startQuiz(){document.getElementById('quizBody').style.display='block';document.getElementById('scoreScreen').className='score-sc';qPool=shuffle(getPool());qIdx=0;qScore=0;qMiss=[];if(!qPool.length)return;showQuiz();}
function showQuiz(){if(qIdx>=qPool.length){showScore();return;}qAnswered=false;const d=qPool[qIdx];document.getElementById('qCat').textContent=d.cat||'';document.getElementById('qKw').textContent=d.keyword;const others=shuffle(DATA.filter(x=>x.term!==d.term)).slice(0,3);const choices=shuffle([d,...others]);const box=document.getElementById('choices');box.innerHTML='';choices.forEach(c=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=c.term;btn.onclick=()=>answerQuiz(c.term,d.term,d.desc,btn);box.appendChild(btn);});document.getElementById('quizFb').className='qfb';document.getElementById('quizNext').className='qnext';setProgress(qIdx,qPool.length);}
function answerQuiz(chosen,correct,desc,btn){if(qAnswered)return;qAnswered=true;document.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct');});const fb=document.getElementById('quizFb');if(chosen===correct){btn.classList.add('correct');fb.className='qfb show ok';document.getElementById('fbVerdict').textContent='✅ 正解！';qScore++;}else{btn.classList.add('wrong');fb.className='qfb show ng';document.getElementById('fbVerdict').textContent='❌ 不正解';qMiss.push({term:correct,keyword:qPool[qIdx].keyword});}document.getElementById('fbDesc').textContent=desc;const nxt=document.getElementById('quizNext');nxt.className='qnext show';nxt.textContent=qIdx===qPool.length-1?'結果を見る 🎉':'次の問題 ▶';}
function nextQuiz(){qIdx++;showQuiz();}
function showScore(){document.getElementById('quizBody').style.display='none';document.getElementById('scoreScreen').className='score-sc show';const pct=Math.round(qScore/qPool.length*100);document.getElementById('scoreBig').textContent=pct+'%';document.getElementById('scoreLabel').textContent=qScore+' / '+qPool.length+' 問正解';document.getElementById('scoreMsg').textContent=pct===100?'🎉 完璧！':pct>=80?'👏 素晴らしい！':pct>=60?'📚 もう少し！':'💪 一緒に頑張ろう！';const ml=document.getElementById('missList');if(qMiss.length>0){ml.innerHTML='<h3>❌ もう一度確認（'+qMiss.length+'語）</h3>';qMiss.forEach(m=>{ml.innerHTML+='<div class="miss-item"><div class="mt">✏️ '+m.term+'</div><div class="mk">'+m.keyword+'</div></div>';});}else ml.innerHTML='';}
initFlash();
</script></body></html>
