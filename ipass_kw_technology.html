<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート テクノロジ系キーワード</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#22263a;--border:#2d3250;--accent:#34d399;--accent2:#a78bfa;--green:#34d399;--red:#f87171;--text:#e8eaf6;--sub:#8892b0;--radius:16px;--font:'Helvetica Neue','Hiragino Sans','Meiryo',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:16px 12px 48px;}
.hd{text-align:center;padding:16px 0 8px;}
.hd h1{font-size:1.2rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hd p{color:var(--sub);font-size:.72rem;margin-top:3px;}
.mode-wrap{display:flex;justify-content:center;gap:8px;margin:10px 0;}
.mode-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:30px;color:var(--sub);cursor:pointer;font-size:.8rem;font-weight:700;padding:6px 18px;transition:all .18s;}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.search-wrap{max-width:480px;margin:0 auto 10px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:40px;padding:8px 14px 8px 38px;color:var(--text);font-size:.88rem;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none;}
.prog-wrap{max-width:480px;margin:0 auto 10px;}
.prog-bg{background:var(--surface);border-radius:99px;height:5px;overflow:hidden;}
.prog-bar{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:99px;transition:width .4s;}
.prog-label{text-align:center;font-size:.7rem;color:var(--sub);margin-top:4px;}
.prog-label span{color:var(--accent);font-weight:700;}
#flashMode{display:block;}
.flash-area{max-width:480px;margin:0 auto;}
.flash-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:26px 22px 20px;text-align:center;cursor:pointer;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:border-color .2s;user-select:none;}
.flash-card:hover{border-color:var(--accent);}
.flash-card.revealed .front{display:none;}
.flash-card.revealed .back-s{display:flex;}
.front,.back-s{width:100%;}
.back-s{display:none;flex-direction:column;gap:7px;}
.fcat{font-size:.66rem;font-weight:700;color:var(--accent);background:rgba(108,143,255,.12);padding:2px 10px;border-radius:99px;}
.fkw{font-size:1rem;font-weight:800;line-height:1.55;}
.fhint{font-size:.68rem;color:var(--sub);margin-top:4px;}
.fans{font-size:1.1rem;font-weight:900;color:var(--green);background:rgba(52,211,153,.08);border-radius:9px;padding:9px 13px;border-left:3px solid var(--green);text-align:left;line-height:1.35;}
.fdesc{font-size:.74rem;color:var(--sub);line-height:1.65;text-align:left;}
.bclose{font-size:.64rem;color:var(--sub);text-align:right;}
.flash-nav{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;flex-wrap:wrap;}
.nav-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;font-size:.8rem;font-weight:700;padding:7px 16px;transition:all .15s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.mark-btn{background:none;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.76rem;padding:6px 13px;font-weight:700;}
.mark-ok{color:var(--green);border-color:var(--green);}
.mark-ng{color:var(--red);border-color:var(--red);}
#quizMode{display:none;}
.quiz-area{max-width:480px;margin:0 auto;}
.quiz-q{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:20px 18px 16px;margin-bottom:10px;}
.qcat{font-size:.65rem;font-weight:700;color:var(--accent2);background:rgba(167,139,250,.1);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:8px;}
.qtext{font-size:.95rem;font-weight:800;line-height:1.55;}
.qsub{font-size:.68rem;color:var(--sub);margin-top:7px;}
.choices{display:flex;flex-direction:column;gap:7px;margin-bottom:9px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;font-size:.83rem;font-weight:600;padding:10px 13px;text-align:left;transition:all .18s;line-height:1.4;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(108,143,255,.08);}
.choice-btn.correct{border-color:var(--green)!important;background:rgba(52,211,153,.12)!important;color:var(--green)!important;}
.choice-btn.wrong{border-color:var(--red)!important;background:rgba(248,113,113,.1)!important;color:var(--red)!important;}
.choice-btn:disabled{cursor:default;}
.qfb{background:var(--surface);border-radius:9px;padding:11px 14px;font-size:.76rem;color:var(--sub);line-height:1.6;display:none;border-left:3px solid var(--border);}
.qfb.show{display:block;}
.qfb.ok{border-left-color:var(--green);}
.qfb.ng{border-left-color:var(--red);}
.fbv{font-weight:800;font-size:.85rem;margin-bottom:3px;}
.qfb.ok .fbv{color:var(--green);}
.qfb.ng .fbv{color:var(--red);}
.qnext{display:none;width:100%;background:var(--accent);border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:.88rem;font-weight:800;padding:12px;margin-top:9px;}
.qnext.show{display:block;}
.score-sc{display:none;text-align:center;padding:28px 20px;max-width:480px;margin:0 auto;}
.score-sc.show{display:block;}
.sbig{font-size:3.2rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.slabel{font-size:.8rem;color:var(--sub);margin-top:4px;}
.smsg{font-size:.95rem;font-weight:700;margin:12px 0 5px;}
.retry-btn{background:var(--accent);border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:.88rem;font-weight:800;padding:12px 28px;margin-top:12px;}
.miss-list{margin-top:16px;text-align:left;}
.miss-list h3{font-size:.76rem;color:var(--sub);margin-bottom:7px;font-weight:700;}
.miss-item{background:var(--card);border-radius:7px;padding:8px 12px;margin-bottom:5px;border-left:3px solid var(--red);}
.miss-item .mt{font-size:.78rem;font-weight:800;}
.miss-item .mk{font-size:.68rem;color:var(--sub);margin-top:2px;}
</style>
</head>
<body>
<div class="hd"><h1>📘 ITパスポート テクノロジ系キーワード</h1><p id="totalLabel"></p></div>
<div class="mode-wrap">
  <button class="mode-btn active" id="btnF" onclick="switchMode('flash')">🃏 フラッシュ</button>
  <button class="mode-btn" id="btnQ" onclick="switchMode('quiz')">✅ 4択クイズ</button>
</div>
<div class="search-wrap"><span class="search-ico">🔍</span><input type="text" id="searchInput" placeholder="用語・キーワードを検索…" oninput="onSearch()"></div>
<div class="prog-wrap"><div class="prog-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div><div class="prog-label" id="progLabel"></div></div>
<div id="flashMode"><div class="flash-area">
  <div class="flash-card" id="flashCard" onclick="revealFlash()">
    <div class="front"><span class="fcat" id="fCat"></span><div class="fkw" id="fKw"></div><div class="fhint">👆 タップして用語を確認</div></div>
    <div class="back-s"><span class="fcat" id="fCat2"></span><div style="font-size:.67rem;color:var(--accent2);font-weight:700;">✅ これを選べば正解！</div><div class="fans" id="fAns"></div><div class="fdesc" id="fDesc"></div><div class="bclose">もう一度タップで戻る</div></div>
  </div>
  <div class="flash-nav">
    <button class="nav-btn" id="fPrev" onclick="flashMove(-1)">◀ 前</button>
    <button class="mark-btn mark-ok" onclick="markFlash(true)">✅ 覚えた</button>
    <button class="mark-btn mark-ng" onclick="markFlash(false)">❌ もう一度</button>
    <button class="nav-btn" id="fNext" onclick="flashMove(1)">次 ▶</button>
  </div>
  <div style="text-align:center;margin-top:9px;"><button class="nav-btn" onclick="initFlash()" style="font-size:.7rem;padding:5px 11px;">🔀 シャッフル</button></div>
</div></div>
<div id="quizMode"><div class="quiz-area" id="quizBody">
  <div class="quiz-q"><span class="qcat" id="qCat"></span><div class="qtext" id="qKw"></div><div class="qsub">↑ このキーワードが表す用語はどれ？</div></div>
  <div class="choices" id="choices"></div>
  <div class="qfb" id="quizFb"><div class="fbv" id="fbVerdict"></div><div id="fbDesc"></div></div>
  <button class="qnext" id="quizNext" onclick="nextQuiz()">次の問題 ▶</button>
</div>
<div class="score-sc" id="scoreScreen">
  <div class="sbig" id="scoreBig"></div><div class="slabel" id="scoreLabel"></div><div class="smsg" id="scoreMsg"></div>
  <div class="miss-list" id="missList"></div>
  <button class="retry-btn" onclick="startQuiz()">🔄 もう一度</button>
</div></div>
<script>
const DATA=[{"cat": "セキュリティ", "term": "情報セキュリティのCIA", "keyword": "機密性・完全性・可用性の3要素", "desc": "Confidentiality（機密性）・Integrity（完全性）・Availability（可用性）。情報セキュリティの基本的な3要素。さらに真正性・否認防止・信頼性も重要。"}, {"cat": "セキュリティ", "term": "マルウェア", "keyword": "悪意ある目的で作られたソフトウェアの総称", "desc": "ウイルス・ワーム・トロイの木馬・スパイウェア・ランサムウェアなどを含む悪意あるソフトウェア全般の総称。"}, {"cat": "セキュリティ", "term": "ランサムウェア", "keyword": "ファイルを暗号化して復号と引き換えに身代金を要求するマルウェア", "desc": "感染するとPCのファイルが暗号化され金銭（身代金）を要求される。バックアップ（3-2-1ルール）が重要な対策。"}, {"cat": "セキュリティ", "term": "フィッシング", "keyword": "偽サイト・偽メールでIDやパスワードを騙し取る攻撃", "desc": "実在の企業を装ったメールやWebサイトで、パスワード・クレジットカード番号などの個人情報を盗む攻撃。"}, {"cat": "セキュリティ", "term": "ソーシャルエンジニアリング", "keyword": "人間の心理・行動を悪用して情報を盗む技術によらない手口", "desc": "電話でのなりすまし・肩越しの覗き見（ショルダーハック）・廃棄書類の漁り（スキャビンジング）など技術に依存しない情報窃取手法。"}, {"cat": "セキュリティ", "term": "SQLインジェクション", "keyword": "Webフォームに不正なSQL文を入力してDBを不正操作する攻撃", "desc": "入力値の検証が不十分なWebアプリに不正なSQL命令を埋め込み、DBの情報を盗む・改ざん・削除する攻撃。"}, {"cat": "セキュリティ", "term": "クロスサイトスクリプティング（XSS）", "keyword": "脆弱なWebページに悪意あるスクリプトを埋め込む攻撃", "desc": "Webページに不正なスクリプトを埋め込み、他の利用者のブラウザで実行させてCookieを盗むなどの攻撃。"}, {"cat": "セキュリティ", "term": "DoS・DDoS攻撃", "keyword": "大量リクエストでサーバをダウンさせるサービス妨害攻撃", "desc": "DoS（1台から）・DDoS（多数の踏み台から同時に攻撃する分散型）。サーバのリソースを枯渇させてサービスを停止させる。"}, {"cat": "セキュリティ", "term": "ゼロデイ攻撃", "keyword": "修正プログラム（パッチ）公開前の脆弱性を突く攻撃", "desc": "ベンダーが脆弱性を認識してパッチをリリースする前（0日目）に脆弱性を悪用する攻撃。防御が非常に難しい。"}, {"cat": "セキュリティ", "term": "標的型攻撃", "keyword": "特定の組織・人物を狙って巧妙に仕掛けるサイバー攻撃", "desc": "不特定多数ではなく特定の組織を狙う攻撃。実在の取引先を装ったメールで侵入する。APT（Advanced Persistent Threat）とも呼ばれる。"}, {"cat": "セキュリティ", "term": "ビジネスメール詐欺（BEC）", "keyword": "上司や取引先になりすましたメールで送金を騙し取る攻撃", "desc": "Business Email Compromise。CEOや取引先を装ったメールで担当者を騙して不正送金させるサイバー犯罪。"}, {"cat": "セキュリティ", "term": "パスワードリスト攻撃", "keyword": "他サービスで流出したID・パスワードを使い回して不正ログイン", "desc": "別サービスから流出したIDとパスワードの組み合わせを使って別サービスへの不正ログインを試みる攻撃。パスワードの使い回しが危険な理由。"}, {"cat": "セキュリティ", "term": "総当たり攻撃（ブルートフォース）", "keyword": "考えられるすべてのパスワードを機械的に試す攻撃", "desc": "パスワードの全パターンを順番に試す攻撃。短いパスワードほど短時間で突破される。アカウントロックで対策する。"}, {"cat": "セキュリティ", "term": "不正のトライアングル", "keyword": "機会・動機・正当化の3つが揃うと内部不正が起きやすい", "desc": "内部不正が起きる条件の理論。できる環境（機会）・やりたい理由（動機）・言い訳（正当化）の3つが揃うと不正が発生しやすい。"}, {"cat": "セキュリティ", "term": "多要素認証（MFA）", "keyword": "知識・所持・生体の2種類以上を組み合わせた認証方式", "desc": "パスワード（知識）＋スマホアプリ（所持）など、異なる種類の認証要素を2つ以上組み合わせる認証方式。なりすましリスクを大幅低減。"}, {"cat": "セキュリティ", "term": "シングルサインオン（SSO）", "keyword": "1回ログインすれば複数サービスをそのまま使い続けられる", "desc": "一度認証すれば複数システム・サービスを再ログインなしで使える仕組み。利便性向上とパスワード管理の簡素化に役立つ。"}, {"cat": "セキュリティ", "term": "公開鍵暗号方式", "keyword": "公開鍵で暗号化・秘密鍵で復号する鍵ペアを使う暗号化方式", "desc": "公開鍵で暗号化→秘密鍵で復号。鍵を安全に渡せない問題を解決。SSH・HTTPS・デジタル署名の基盤技術。"}, {"cat": "セキュリティ", "term": "共通鍵暗号方式", "keyword": "暗号化と復号に同じ鍵を使う暗号化方式", "desc": "送信者と受信者が同じ鍵を使う。処理が速いが、鍵を安全に相手に渡すのが課題。AESが代表的なアルゴリズム。"}, {"cat": "セキュリティ", "term": "デジタル署名", "keyword": "秘密鍵で署名し公開鍵で検証して本人性・改ざんなしを証明", "desc": "送信者が秘密鍵でデータに署名し受信者が公開鍵で検証することで、なりすまし・改ざん・否認防止を実現する技術。"}, {"cat": "セキュリティ", "term": "PKI（公開鍵基盤）", "keyword": "認証局（CA）がデジタル証明書を発行して公開鍵を保証する仕組み", "desc": "Public Key Infrastructure。CAがデジタル証明書を発行し、公開鍵が確かに本人のものであることを保証する仕組み。"}, {"cat": "セキュリティ", "term": "ISMS", "keyword": "組織全体で情報セキュリティをPDCAで継続管理する仕組み", "desc": "Information Security Management System。ISO/IEC 27001が規格。リスクアセスメントに基づき情報セキュリティを継続的に維持・改善する。"}, {"cat": "セキュリティ", "term": "バイオメトリクス認証", "keyword": "指紋・顔・虹彩など身体的特徴で本人を認証する技術", "desc": "生体情報を認証に使う方式。FRR（本人拒否率）とFAR（他人受入率）のトレードオフを考慮して精度を設定する。"}, {"cat": "セキュリティ", "term": "WAF", "keyword": "SQLインジェクション・XSSなどWebアプリ攻撃を検知・遮断", "desc": "Web Application Firewall。Webアプリ特有の攻撃を検知・ブロックするセキュリティ機器。ファイアウォールとは別に設置する。"}, {"cat": "セキュリティ", "term": "IDS／IPS", "keyword": "IDS=不正侵入を検知・通知、IPS=検知＋自動遮断するシステム", "desc": "IDS（Intrusion Detection System）は検知のみ通知。IPS（Intrusion Prevention System）は検知後に自動遮断まで実行する。"}, {"cat": "セキュリティ", "term": "ファイアウォール", "keyword": "通信ルールに基づき不正アクセスを遮断するセキュリティ機器", "desc": "設定ルールに基づき通信を許可・遮断するシステム。社内ネットワークと外部インターネットの境界に設置する。"}, {"cat": "セキュリティ", "term": "DMZ（非武装地帯）", "keyword": "外部と内部ネットワークの中間に置く安全な緩衝ゾーン", "desc": "インターネットと社内ネットワークの間に設ける隔離ゾーン。WebサーバをDMZに置くことで社内ネットワークを守る。"}, {"cat": "セキュリティ", "term": "VPN", "keyword": "公衆インターネット上に暗号化された仮想専用線を構築", "desc": "Virtual Private Network。インターネット上にトンネルを作り外部から安全に社内ネットワークへアクセスする仕組み。"}, {"cat": "セキュリティ", "term": "リスクアセスメント", "keyword": "リスクの特定・分析・評価を行うプロセス", "desc": "情報資産への脅威・脆弱性を洗い出し、リスクの大きさを評価するプロセス。結果を基にリスク対応策（回避・共有・軽減・保有）を選択する。"}, {"cat": "セキュリティ", "term": "CSIRT", "keyword": "サイバー攻撃・情報漏えいに対応する社内専門チーム", "desc": "Computer Security Incident Response Team。セキュリティインシデント発生時に対応・調査・再発防止を行う組織内専門チーム。"}, {"cat": "セキュリティ", "term": "ペネトレーションテスト", "keyword": "許可を得て実際に攻撃を試みシステムの弱点を見つける検査", "desc": "セキュリティの専門家が許可を得た上でシステムへの侵入を試みて脆弱性を発見するテスト。ペンテストとも呼ばれる。"}, {"cat": "セキュリティ", "term": "セキュリティパッチ", "keyword": "ソフトウェアの脆弱性を修正するプログラムの更新", "desc": "OSやアプリの脆弱性（セキュリティホール）を修正するための更新プログラム。定期的に適用することがマルウェア対策の基本。"}, {"cat": "セキュリティ", "term": "シャドーIT", "keyword": "会社が許可していない私物デバイスやクラウドサービスの業務利用", "desc": "IT部門の管理外で個人がスマホやクラウドサービスを業務に使うこと。情報漏えいリスクが高く脆弱性になりやすい。"}, {"cat": "セキュリティ", "term": "情報セキュリティポリシー", "keyword": "組織が守るべき情報セキュリティの方針・ルールを定めた文書", "desc": "組織全体で情報資産を守るための基本方針。基本方針・対策基準・手順書の3階層で構成されることが多い。"}, {"cat": "ネットワーク", "term": "IPアドレス", "keyword": "ネットワーク上の機器を識別する論理アドレス", "desc": "IPv4は32ビット（約43億個）・IPv6は128ビット。グローバルIPは世界唯一・プライベートIPは組織内限定。"}, {"cat": "ネットワーク", "term": "DNS", "keyword": "ドメイン名をIPアドレスに変換する仕組み（名前解決）", "desc": "Domain Name System。www.example.comのようなドメイン名をIPアドレスに変換するサービス。インターネットの電話帳に相当。"}, {"cat": "ネットワーク", "term": "DHCP", "keyword": "ネットワーク接続時にIPアドレス等を自動割り当てするプロトコル", "desc": "Dynamic Host Configuration Protocol。PCがネットに接続するとIPアドレス・サブネットマスク等を自動設定する。"}, {"cat": "ネットワーク", "term": "HTTP／HTTPS", "keyword": "Webページの送受信プロトコル（HTTPSはTLS暗号化）", "desc": "WebブラウザとWebサーバの通信規約。HTTPSはTLS（SSL）で通信を暗号化した安全版。URLがhttps://で始まる。"}, {"cat": "ネットワーク", "term": "SMTP／POP3／IMAP", "keyword": "メール送信はSMTP・受信取得はPOP3・サーバ管理はIMAP", "desc": "SMTP：送信専用。POP3：サーバからダウンロード・削除。IMAP：サーバ上でメールを管理（複数端末対応）。"}, {"cat": "ネットワーク", "term": "TCP/IP", "keyword": "インターネット通信の標準プロトコル群", "desc": "TCP（信頼性ある通信）とIP（アドレス指定・経路選択）を組み合わせたプロトコル群。インターネットの基盤技術。"}, {"cat": "ネットワーク", "term": "ルータ", "keyword": "IPアドレスを基に最適経路を選んでパケットを転送する機器", "desc": "ルーティングテーブルを参照し最適な経路でパケットを転送する機器。LANとインターネットを接続する。"}, {"cat": "ネットワーク", "term": "WPA2", "keyword": "無線LANの通信をAES暗号化するセキュリティ規格", "desc": "Wi-Fiの暗号化規格。AES暗号を使用し通信データを保護する。オープンなWi-Fiより格段にセキュリティが高い。"}, {"cat": "ネットワーク", "term": "LPWA", "keyword": "低消費電力・長距離通信のIoT向け無線通信方式", "desc": "Low Power Wide Area。スマートメーター・農業センサーなど、データ量が少ないが広域・省電力が必要なIoTデバイスに適する。"}, {"cat": "ネットワーク", "term": "BLE", "keyword": "Bluetooth Low Energy　省電力の近距離無線通信技術", "desc": "Bluetooth Low Energy。スマートウォッチ・IoTセンサーなどの省電力デバイス向け近距離無線通信規格。Bluetoothの一種。"}, {"cat": "ネットワーク", "term": "MACアドレス", "keyword": "ネットワーク機器のNICに固定された48ビットの物理アドレス", "desc": "製造時に機器に割り当てられる固有の識別番号。LANの中で機器を識別するために使われる。IPアドレスと違い原則として変更できない。"}, {"cat": "ネットワーク", "term": "サブネットマスク", "keyword": "IPアドレスのネットワーク部とホスト部を区別するための値", "desc": "どこまでがネットワーク番号でどこからが機器番号かを示す。例：255.255.255.0。同じネットワーク内の機器かどうかの判断に使う。"}, {"cat": "ネットワーク", "term": "ポート番号", "keyword": "通信するアプリケーションを区別する0〜65535の番号", "desc": "IPアドレスが建物の住所なら、ポート番号は部屋番号。HTTP=80・HTTPS=443・SMTP=25など、アプリごとに番号が決まっている。"}, {"cat": "ネットワーク", "term": "Wi-Fi", "keyword": "電波を使ってケーブルなしでLANに接続する無線通信技術", "desc": "IEEE 802.11シリーズの規格。Wi-Fi 6（802.11ax）が現在の主流。WPA3で暗号化して安全に使う。"}, {"cat": "ネットワーク", "term": "5G", "keyword": "超高速・超低遅延・多数同時接続の第5世代移動通信規格", "desc": "スマートフォンやIoT機器が使う通信規格。4Gより約100倍高速で遅延が少ない。自動運転・遠隔医療への活用が期待される。"}, {"cat": "ネットワーク", "term": "パケット", "keyword": "ネットワーク上を流れるデータを小さく分割した転送単位", "desc": "データを小さな塊（パケット）に分けて送ることで効率よく通信できる。受け取り側で元に戻す。"}, {"cat": "ネットワーク", "term": "URL", "keyword": "Webページの住所（インターネット上の場所を示す文字列）", "desc": "Uniform Resource Locator。https://www.example.com/page のようにプロトコル・ドメイン名・パスで構成される。"}, {"cat": "ネットワーク", "term": "Cookie", "keyword": "WebサイトがブラウザにログインIDなどを一時保存する仕組み", "desc": "サイトが利用者のブラウザに保存する小さなデータ。ログイン状態の維持・カート情報の保存に使われる。"}, {"cat": "ネットワーク", "term": "クラウドストレージ", "keyword": "インターネット上にファイルを保存・共有できるサービス", "desc": "Google Drive・OneDriveなどが代表例。スマホやPCからいつでもアクセスでき、複数の端末や人とファイルを共有できる。"}, {"cat": "ネットワーク", "term": "テザリング", "keyword": "スマートフォンをWi-Fiルーターとして他の機器をネット接続", "desc": "スマホのモバイル通信回線を使って、PCやタブレットをインターネットに接続する機能。外出先でのWi-Fi代わりに使われる。"}, {"cat": "ネットワーク", "term": "OSI参照モデル", "keyword": "ネットワーク通信を物理層〜アプリケーション層の7層で定義", "desc": "物理層・データリンク層・ネットワーク層・トランスポート層・セション層・プレゼンテーション層・アプリケーション層の7層構造。"}, {"cat": "ネットワーク", "term": "エッジコンピューティング", "keyword": "データ発生源の近くで処理してクラウドへの通信量を削減", "desc": "IoTデバイス近傍でデータを処理する方式。クラウド転送前に処理することで遅延削減・帯域節約・プライバシー保護が可能。"}, {"cat": "ハードウェア", "term": "CPU", "keyword": "演算・制御を担うコンピュータの中央処理装置", "desc": "Central Processing Unit。プログラム命令を解釈・実行する。クロック周波数・コア数が主な性能指標。"}, {"cat": "ハードウェア", "term": "GPU", "keyword": "画像処理・AI並列計算に特化したプロセッサ", "desc": "Graphics Processing Unit。多数のコアで並列処理を実行。AI・機械学習の大規模計算にも不可欠。"}, {"cat": "ハードウェア", "term": "RAM（主記憶）", "keyword": "プログラム実行中のデータを高速に一時保存する揮発性メモリ", "desc": "電源を切ると消える。CPUが直接読み書きする作業領域。容量が大きいほど多くのプログラムを快適に実行できる。"}, {"cat": "ハードウェア", "term": "ROM", "keyword": "電源を切っても消えない読み取り専用の不揮発性メモリ", "desc": "Read Only Memory。BIOSなど起動に必要なプログラムを格納。フラッシュメモリはROMの一種で書き換え可能。"}, {"cat": "ハードウェア", "term": "SSD", "keyword": "フラッシュメモリを使う高速・省電力・耐衝撃のストレージ", "desc": "Solid State Drive。HDDより高速・静音・耐衝撃だが書き換え回数に寿命がある。"}, {"cat": "ハードウェア", "term": "HDD", "keyword": "磁気ディスクにデータを記録する大容量ストレージ装置", "desc": "Hard Disk Drive。回転する磁気ディスクにデータを記録する。SSDより安価で大容量だが衝撃に弱く読み書きが遅い。"}, {"cat": "ハードウェア", "term": "VRAM", "keyword": "PC画面表示データを格納する画面表示専用メモリ", "desc": "Video RAM。GPUが画面の描画データを格納するための専用メモリ。大きいほど高解像度・高品質な描画が可能。"}, {"cat": "ハードウェア", "term": "キャッシュメモリ", "keyword": "CPUと主記憶の速度差を埋める高速小容量バッファメモリ", "desc": "CPUの高速処理に主記憶が追いつけないため、頻繁に使うデータを格納しておく高速メモリ。L1/L2/L3の階層がある。"}, {"cat": "ハードウェア", "term": "稼働率", "keyword": "システムが正常動作している時間の割合（MTBF÷（MTBF＋MTTR））", "desc": "MTBFが大きく・MTTRが小さいほど稼働率が高い。信頼性の主要指標。"}, {"cat": "ハードウェア", "term": "MTBF", "keyword": "故障と故障の間の平均動作時間（平均故障間隔）", "desc": "Mean Time Between Failures。システムが正常に動作し続ける平均時間。値が大きいほど故障しにくい。"}, {"cat": "ハードウェア", "term": "MTTR", "keyword": "障害発生から正常復旧までの平均修復時間", "desc": "Mean Time To Repair。値が小さいほど迅速に修復できる。稼働率の計算式に使われる指標。"}, {"cat": "ハードウェア", "term": "フェールセーフ", "keyword": "障害発生時に安全側（被害最小）の状態に自動移行する設計", "desc": "システム故障時に被害を最小化する方向に自動移行する設計思想。電車の自動停止・信号機の赤点灯などが例。"}, {"cat": "ハードウェア", "term": "フールプルーフ", "keyword": "人間のミスが起きにくく・起きても重大事態にならない設計", "desc": "誤操作しても重大な結果にならないよう、誤りにくい構造にする設計思想。USBコネクタの裏表がわかりやすい形状など。"}, {"cat": "ハードウェア", "term": "RAID", "keyword": "複数HDDを組み合わせて冗長性・速度を向上させる技術", "desc": "Redundant Arrays of Inexpensive Disks。RAID0（速度）・RAID1（ミラーリング）・RAID5（分散パリティ）などのレベルがある。"}, {"cat": "ハードウェア", "term": "仮想化", "keyword": "1台の物理サーバを複数の仮想マシンとして動作させる技術", "desc": "ハイパーバイザー等を使い1台の物理サーバ上に複数のOSを独立稼働させる。リソース有効活用・コスト削減に貢献。"}, {"cat": "ハードウェア", "term": "マルチコアプロセッサ", "keyword": "1つのCPUチップに複数の処理コアを搭載したプロセッサ", "desc": "デュアルコア・クアッドコアなど。複数のコアが並行して処理することで全体的な処理速度を向上させる。"}, {"cat": "ハードウェア", "term": "USB", "keyword": "PCと周辺機器を接続する最も一般的なインタフェース規格", "desc": "Universal Serial Bus。マウス・キーボード・USBメモリなどを接続する。Type-A/B/Cなど形状の種類がある。"}, {"cat": "ハードウェア", "term": "Bluetooth", "keyword": "スマートフォンやヘッドフォンを短距離でワイヤレス接続", "desc": "数メートル〜数十メートルの範囲で機器を無線接続する規格。イヤホン・マウス・スマートウォッチなどで広く使われる。"}, {"cat": "ハードウェア", "term": "RFID（ICタグ）", "keyword": "電波でタグのデータを非接触で読み書きする技術", "desc": "Radio Frequency IDentification。商品管理・入退室管理・交通系ICカード（Suica等）などで使われる非接触通信技術。"}, {"cat": "ハードウェア", "term": "NFC", "keyword": "数センチの近距離で機器同士がデータをやり取りする無線技術", "desc": "Near Field Communication。Suica・スマホ決済などで使われる近距離無線通信。RFIDの一種。"}, {"cat": "ハードウェア", "term": "デュアルシステム", "keyword": "同じ処理を2系統同時実行し結果を照合して誤りを検出する方式", "desc": "2系統のコンピュータが同じ処理を同時に行い結果を照合する。鉄道・金融など高い信頼性が必要なシステムで使われる。"}, {"cat": "ハードウェア", "term": "デュプレックスシステム", "keyword": "主系が故障したとき待機中の副系に自動切り替えする冗長構成", "desc": "主系（本番）と副系（予備）を用意し主系が故障したとき自動的に副系に切り替える。ホットスタンバイとコールドスタンバイがある。"}, {"cat": "ハードウェア", "term": "QRコード", "keyword": "2次元の白黒格子でURLや情報を格納できる日本生まれのコード", "desc": "バーコードより多くの情報を格納できる2次元コード。スマホカメラで読み取れる。デンソーウェーブが開発した。"}, {"cat": "データベース", "term": "RDBMS", "keyword": "テーブル形式でデータを管理する関係データベースシステム", "desc": "Relational Database Management System。SQL・主キー・外部キーによるテーブル間関連付けでデータを管理する。"}, {"cat": "データベース", "term": "SQL", "keyword": "データベースを操作するための問い合わせ言語", "desc": "Structured Query Language。SELECT（検索）・INSERT（挿入）・UPDATE（更新）・DELETE（削除）などでDBを操作する。"}, {"cat": "データベース", "term": "主キー", "keyword": "テーブルの各行を一意に識別する列（重複不可・NULL不可）", "desc": "Primary Key。テーブル内のレコードを唯一特定できる列。値の重複とNULLは許可されない。"}, {"cat": "データベース", "term": "外部キー", "keyword": "別テーブルの主キーを参照してテーブル間の関係を定義する列", "desc": "Foreign Key。他テーブルの主キーを参照してテーブル間のリレーションを定義し参照整合性を保つ列。"}, {"cat": "データベース", "term": "正規化", "keyword": "データの重複・更新異常を防ぐためにテーブルを適切に分割", "desc": "同じデータを複数箇所に持たないようテーブルを整理する設計手法。第1〜第3正規形の段階がある。"}, {"cat": "データベース", "term": "ACID特性", "keyword": "原子性・一貫性・分離性・耐久性のトランザクション4要素", "desc": "Atomicity（原子性）・Consistency（一貫性）・Isolation（分離性）・Durability（耐久性）。DBの信頼性の基礎。"}, {"cat": "データベース", "term": "トランザクション", "keyword": "一連のDB操作を全成功か全失敗で扱うひとまとまりの処理単位", "desc": "振込処理のような複数ステップをひとまとまりとして扱う。COMMITで確定・ROLLBACKで取り消しができる。"}, {"cat": "データベース", "term": "チェックポイント", "keyword": "DBのメモリ上データを外部記憶に書き出す操作・タイミング", "desc": "DBMSが一定間隔でメモリ上の更新データをHDD等に書き込む操作。障害回復（ロールフォワード・ロールバック）の基点となる。"}, {"cat": "データベース", "term": "デッドロック", "keyword": "複数トランザクションが互いのロック解放を待ち続ける状態", "desc": "AがリソースXをロックしYを待ち、BがYをロックしXを待つ状態。DBMSが検出して一方のトランザクションをロールバックして解消する。"}, {"cat": "データベース", "term": "E-R図", "keyword": "エンティティと関係（リレーションシップ）でDB構造を表す設計図", "desc": "Entity Relationship Diagram。DB論理設計で使う図。エンティティ（表）同士の関係を1対多・多対多などで表現する。"}, {"cat": "データベース", "term": "ビッグデータ（3V）", "keyword": "Volume・Velocity・Varietyの3要素を持つ大規模データ群", "desc": "従来DBでは扱えない規模・速度・多様性を持つデータ群。SNS・センサー・購買履歴など。分析にはAIや統計的手法を活用する。"}, {"cat": "データベース", "term": "NoSQL", "keyword": "テーブル形式に縛られない非リレーショナルデータベース", "desc": "Not Only SQL。KVS（キーバリューストア）・ドキュメント型・グラフ型など種類がある。大規模分散処理・柔軟なスキーマに強い。"}, {"cat": "データベース", "term": "インデックス（索引）", "keyword": "データベースの検索を高速化するための索引データ", "desc": "本の索引と同じ仕組み。特定の列にインデックスを設定するとデータ検索が劇的に速くなる。一方、更新処理は少し遅くなる。"}, {"cat": "データベース", "term": "ロールバック", "keyword": "トランザクション処理を取り消して開始前の状態に戻す操作", "desc": "処理途中でエラーが発生したとき、トランザクション開始前の状態に戻す操作。ATMの振込失敗時などに使われる。"}, {"cat": "データベース", "term": "ロールフォワード", "keyword": "バックアップ復元後にログを再適用して障害直前まで復元", "desc": "障害復旧の手法。バックアップからデータを復元した後、障害直前までのトランザクションログを再適用してデータを最新化する。"}, {"cat": "データベース", "term": "データマイニング", "keyword": "大量データから統計的手法で有用なパターン・法則を発見", "desc": "大量のデータを分析して人間が気づかない法則・パターン・相関関係を発見する技術。マーケティング・不正検知などに使われる。"}, {"cat": "データベース", "term": "BI（ビジネスインテリジェンス）", "keyword": "データを分析・可視化して経営判断を支援するツール・仕組み", "desc": "Business Intelligence。売上・在庫・顧客データをグラフやダッシュボードで可視化し、経営判断をデータに基づいて行うための仕組み。"}, {"cat": "AI・新技術", "term": "機械学習", "keyword": "データからコンピュータが自動でパターンを学習する技術", "desc": "教師あり・教師なし・強化学習の3種類。大量のデータを学習データとして与え、コンピュータ自身が規則を発見・学習する。"}, {"cat": "AI・新技術", "term": "ディープラーニング", "keyword": "多層ニューラルネットワークで特徴を自動抽出する機械学習", "desc": "人間の脳神経を模した多層構造で画像・音声の特徴を自動抽出・学習する手法。画像認識・音声認識・自然言語処理で高精度を発揮。"}, {"cat": "AI・新技術", "term": "教師あり学習", "keyword": "正解ラベル付きデータで予測モデルを学習させる方式", "desc": "「入力→正解出力」のセットを大量に学習させて予測モデルを構築する。スパムメール判定・画像分類などに使う。"}, {"cat": "AI・新技術", "term": "教師なし学習", "keyword": "正解ラベルなしでデータのパターン・グループを自動発見", "desc": "クラスタリング（グループ分け）・次元削減などが代表的な手法。顧客セグメンテーション・異常検知などに使われる。"}, {"cat": "AI・新技術", "term": "強化学習", "keyword": "報酬を最大化するように環境と相互作用しながら学習", "desc": "エージェントが試行錯誤しながら報酬が最大になる行動を学習する。ゲームAI・ロボット制御・自動運転などに応用される。"}, {"cat": "AI・新技術", "term": "大規模言語モデル（LLM）", "keyword": "膨大なテキストで学習した高精度の自然言語処理AIモデル", "desc": "Large Language Model。GPT・Gemini・Claudeなどが代表例。文章生成・翻訳・要約・コード生成など多様なタスクをこなす。"}, {"cat": "AI・新技術", "term": "生成AI", "keyword": "テキスト・画像・音声などを新たに生成するAI", "desc": "学習データのパターンから新しいコンテンツを生成するAI。ChatGPT・Gemini・Stable Diffusionなどが代表例。ハルシネーションに注意。"}, {"cat": "AI・新技術", "term": "ハルシネーション", "keyword": "AIが事実と異なる情報をもっともらしく生成してしまう現象", "desc": "生成AIが存在しない情報や誤った情報を確信を持って生成する現象。出力の検証・ファクトチェックが必要。"}, {"cat": "AI・新技術", "term": "ディープフェイク", "keyword": "AIで本人の動画・音声を偽造する技術", "desc": "ディープラーニングを使って実在の人物の顔・音声を別の動画に合成する技術。フェイクニュース・詐欺への悪用が問題。"}, {"cat": "AI・新技術", "term": "プロンプトエンジニアリング", "keyword": "生成AIから望む出力を得るための指示文（プロンプト）の設計技術", "desc": "AIに与える指示文を工夫することで、より正確・有用な出力を引き出す技術。Few-shot prompting・Chain-of-thoughtなどの手法がある。"}, {"cat": "AI・新技術", "term": "ファインチューニング", "keyword": "学習済みAIモデルを特定用途向けに追加学習して精度を高める手法", "desc": "大規模な事前学習済みモデルに対して、特定のタスク・ドメインのデータで追加学習させてタスク特化の精度を向上させる手法。"}, {"cat": "AI・新技術", "term": "IoT", "keyword": "モノをインターネットに接続してデータ収集・制御する技術", "desc": "Internet of Things。センサー・カメラ・家電をネットに繋ぎデータ収集・遠隔制御を行う。スマートホーム・工場・農業などで活用。"}, {"cat": "AI・新技術", "term": "センサー", "keyword": "温度・光・圧力等の物理現象を電気信号に変換するIoT入力装置", "desc": "IoTデバイスの入力側。温度・湿度・加速度・赤外線・圧力などを検知し電気信号に変換してデータを収集する。"}, {"cat": "AI・新技術", "term": "アクチュエーター", "keyword": "電気信号を物理的な動作（回転・移動等）に変換するIoT出力装置", "desc": "IoTデバイスの出力側。センサーで収集した情報をもとにモーター・バルブなどを動かして現実世界を制御する。"}, {"cat": "AI・新技術", "term": "ブロックチェーン", "keyword": "改ざんが極めて困難な分散型台帳技術", "desc": "トランザクションデータをブロックに格納しチェーン状に連結・分散管理。暗号資産・NFT・スマートコントラクトで活用される。"}, {"cat": "AI・新技術", "term": "RPA", "keyword": "定型的なPC操作をソフトウェアロボットで自動化する技術", "desc": "Robotic Process Automation。人が行うPC画面操作（入力・コピー・転記等）を記録して自動実行するツール。"}, {"cat": "AI・新技術", "term": "クラウドコンピューティング", "keyword": "サーバ・ストレージ・ソフトをインターネット経由で利用", "desc": "必要なときに必要な分だけIT資源を使える従量課金型サービス。初期投資不要・スケールアップ容易が特徴。"}, {"cat": "ソフトウェア", "term": "OS（オペレーティングシステム）", "keyword": "ハードウェアとアプリの橋渡しをする基本ソフトウェア", "desc": "Windows・macOS・Linux・iOS・Android等。ファイル管理・入出力管理・プロセス管理などをアプリに提供する。"}, {"cat": "ソフトウェア", "term": "バックアップ（フル・差分・増分）", "keyword": "データ損失に備えてデータの複製を別の場所に保管する対策", "desc": "フルバックアップ（全データ）・差分バックアップ（前回フルからの変更）・増分バックアップ（前回バックアップ以降の変更）の3種類がある。"}, {"cat": "ソフトウェア", "term": "OSS（オープンソースソフトウェア）", "keyword": "ソースコードが公開され自由に利用・改変・再配布できるソフト", "desc": "Linux・Apache・MySQLなどが代表例。GPLなどライセンス条件を守る必要がある。商用利用可能なものも多い。"}, {"cat": "ソフトウェア", "term": "レスポンシブWebデザイン", "keyword": "画面サイズに応じてレイアウトが自動変化するWeb設計手法", "desc": "スマートフォン・タブレット・PCなど異なる端末・画面サイズに対し、1つのHTMLで最適なレイアウトを自動提供する設計手法。"}, {"cat": "ソフトウェア", "term": "SaaS", "keyword": "ソフトウェアをインターネット経由でサービスとして提供", "desc": "Software as a Service。インストール不要でブラウザから利用するクラウドサービス。GmailやSalesforceが代表例。"}, {"cat": "ソフトウェア", "term": "PaaS", "keyword": "アプリの開発・実行環境をクラウドで提供するサービス", "desc": "Platform as a Service。OS・ミドルウェア・開発環境をクラウドで提供。インフラ管理なしでアプリ開発に集中できる。"}, {"cat": "ソフトウェア", "term": "IaaS", "keyword": "サーバ・ストレージ・ネットワーク等のインフラをクラウドで提供", "desc": "Infrastructure as a Service。仮想サーバ・ストレージ等をクラウドで提供。AWS・Azure・GCPが代表例。"}, {"cat": "ソフトウェア", "term": "API", "keyword": "アプリやサービス同士が機能を使い合うための接続口", "desc": "Application Programming Interface。異なるソフトウェア間でデータ・機能をやり取りするための窓口。天気予報アプリが気象庁のAPIを使うイメージ。"}, {"cat": "ソフトウェア", "term": "ローコード・ノーコード", "keyword": "プログラミングをほとんど書かずにアプリを作れる開発手法", "desc": "ドラッグ＆ドロップなどの視覚的操作でアプリを開発できる。専門知識がなくても業務アプリを作れるためDX推進の手段として注目。"}, {"cat": "ソフトウェア", "term": "ミドルウェア", "keyword": "OSとアプリの中間に位置してアプリ開発を支援するソフト", "desc": "データベース管理システム（DBMS）・Webサーバ・アプリサーバなどが該当。OSとアプリの橋渡しをする。"}, {"cat": "ソフトウェア", "term": "コンパイラ", "keyword": "プログラミング言語で書いたコードをコンピュータが実行できる形式に変換", "desc": "人間が書いたプログラム（ソースコード）を、CPUが直接実行できる機械語に変換するソフト。変換後は高速に動作する。"}, {"cat": "ソフトウェア", "term": "オブジェクト指向", "keyword": "データと処理をオブジェクトとしてまとめてプログラムを設計する考え方", "desc": "クラス（設計図）からインスタンス（実体）を作り、継承・カプセル化・ポリモーフィズムを活用してプログラムを構造化する。"}, {"cat": "ソフトウェア", "term": "アルゴリズム", "keyword": "問題を解くための手順・処理の流れ", "desc": "特定の問題を解くための手順を明確に定めたもの。探索（線形・二分）・整列（バブル・クイック）などが代表的なアルゴリズム。"}, {"cat": "ソフトウェア", "term": "データ構造", "keyword": "データをコンピュータ内でどのように整理・格納するかの形式", "desc": "配列・リスト・スタック・キュー・木構造・ハッシュテーブルなど。問題の性質に応じて適切なデータ構造を選ぶと効率が上がる。"}, {"cat": "ソフトウェア", "term": "HTML", "keyword": "Webページの構造・内容を記述するマークアップ言語", "desc": "HyperText Markup Language。タグ（<h1>・<p>・<a>等）を使ってWebページの見出し・段落・リンクなどを記述する。"}, {"cat": "ソフトウェア", "term": "CSS", "keyword": "Webページの見た目（色・フォント・レイアウト）を指定するスタイルシート", "desc": "Cascading Style Sheets。HTMLに対してデザインを適用する。レスポンシブデザインの実現にも使われる。"}, {"cat": "UI/UX", "term": "ユーザビリティ", "keyword": "有効性・効率性・満足度でシステムの使いやすさを評価する概念", "desc": "ISO 9241で定義。有効性（目標達成できるか）・効率性（労力は少ないか）・満足度（使って気持ちよいか）の3基準で評価する。"}, {"cat": "UI/UX", "term": "アクセシビリティ", "keyword": "障害者を含む誰もが情報にアクセスできるよう設計すること", "desc": "視覚・聴覚・身体・認知の障害がある人も含め、すべての人が等しく利用できるよう設計すること。WCAG2.1が国際標準。"}, {"cat": "UI/UX", "term": "ペルソナ", "keyword": "ターゲットユーザーを具体的な人物像として定義するUX手法", "desc": "実際のユーザー調査を基に「30代・営業職・スマホ中心」のような具体的な仮想人物像を作り、設計の意思決定基準とする手法。"}, {"cat": "UI/UX", "term": "A/Bテスト", "keyword": "2パターンを実際のユーザーに見せて効果を比較する検証手法", "desc": "WebページやアプリのUIを2種類用意し、実際のユーザーに表示してコンバージョン率等の目標指標が高い方を選ぶ手法。"}, {"cat": "UI/UX", "term": "UXデザイン", "keyword": "製品の使用前・中・後を通じたユーザー体験全体を設計", "desc": "User Experience Design。製品・サービスに関わるユーザーの体験全体を設計・改善する取り組み。機能だけでなく感情的満足も重視。"}, {"cat": "UI/UX", "term": "ユニバーサルデザイン", "keyword": "年齢・障害の有無にかかわらず誰もが使いやすい設計原則", "desc": "特定の人を対象とせず最初からすべての人が使いやすいよう設計する考え方。アクセシビリティより広い概念。"}, {"cat": "UI/UX", "term": "GUI", "keyword": "アイコンやボタンをマウス・タッチで操作する画面インタフェース", "desc": "Graphical User Interface。Windowsやスマホのようにアイコンやボタンをクリックやタップで操作できる仕組み。CUI（コマンド入力）と対比される。"}, {"cat": "UI/UX", "term": "レスポンシブWebデザイン", "keyword": "画面サイズに応じてレイアウトが自動変化するWeb設計手法", "desc": "スマートフォン・タブレット・PCなど異なる端末・画面サイズに対し、1つのHTMLで最適なレイアウトを自動提供する設計手法。"}, {"cat": "UI/UX", "term": "プロトタイピング", "keyword": "試作品（プロトタイプ）を早期に作ってユーザーの意見を確認", "desc": "本番開発前に紙や簡易ツールで試作品を作り、ユーザーに使ってもらってフィードバックを得る手法。手戻りを減らせる。"}, {"cat": "UI/UX", "term": "インフォグラフィック", "keyword": "複雑な情報・データを図・グラフ・絵で視覚的にわかりやすく表現", "desc": "文章だけでは伝わりにくい統計・手順・概念を図解・アイコン・色を使って直感的に理解できるようにしたグラフィック表現。"}, {"cat": "UI/UX", "term": "ダークパターン", "keyword": "利用者を意図せず不利な選択に誘導するUI設計", "desc": "キャンセルボタンを小さくする・重要な情報を隠すなど、ユーザーが気づかないうちに企業に有利な操作をさせる悪意あるUI設計。"}, {"cat": "UI/UX", "term": "シグニファイア", "keyword": "ユーザーに操作方法を直感的に伝えるデザイン上の手がかり", "desc": "ボタンの立体感（押せる）・ドアのノブの形（引く・押す）など、見た目でどう操作すべきかを示す設計上の工夫。"}, {"cat": "UI/UX", "term": "ピクトグラム", "keyword": "意味を絵記号で表した視覚的な案内サイン", "desc": "言語に関係なく意味が伝わる図記号。非常口・男女トイレ・禁煙マークなど。多様な言語・文化の人に情報を伝えるユニバーサルデザインの要素。"}];

let currentMode='flash',searchQ='',fDeck=[],fIdx=0,fOkSet=new Set(),qPool=[],qIdx=0,qScore=0,qMiss=[],qAnswered=false;
function getPool(){return DATA.filter(d=>{const q=searchQ.toLowerCase();return !q||d.term.toLowerCase().includes(q)||d.keyword.toLowerCase().includes(q);});}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function setProgress(c,t){const p=t?Math.round(c/t*100):0;document.getElementById('progBar').style.width=p+'%';document.getElementById('progLabel').innerHTML='<span>'+c+'</span> / '+t+'問';}
function onSearch(){searchQ=document.getElementById('searchInput').value.trim();if(currentMode==='flash')initFlash();else startQuiz();}
function switchMode(m){currentMode=m;document.getElementById('btnF').className='mode-btn'+(m==='flash'?' active':'');document.getElementById('btnQ').className='mode-btn'+(m==='quiz'?' active':'');document.getElementById('flashMode').style.display=m==='flash'?'block':'none';document.getElementById('quizMode').style.display=m==='quiz'?'block':'none';if(m==='flash')initFlash();else startQuiz();}
function initFlash(){fDeck=shuffle(getPool());fIdx=0;fOkSet.clear();if(!fDeck.length)return;showFlash();}
function showFlash(){if(!fDeck.length)return;const d=fDeck[fIdx];document.getElementById('flashCard').classList.remove('revealed');document.getElementById('fCat').textContent=d.cat||'';document.getElementById('fCat2').textContent=d.cat||'';document.getElementById('fKw').textContent=d.keyword;document.getElementById('fAns').textContent=d.term;document.getElementById('fDesc').textContent=d.desc;document.getElementById('fPrev').disabled=fIdx===0;document.getElementById('fNext').disabled=fIdx===fDeck.length-1;setProgress(fIdx+1,fDeck.length);}
function revealFlash(){document.getElementById('flashCard').classList.toggle('revealed');}
function flashMove(dir){fIdx=Math.max(0,Math.min(fDeck.length-1,fIdx+dir));showFlash();}
function markFlash(ok){if(ok)fOkSet.add(fDeck[fIdx].term);else fOkSet.delete(fDeck[fIdx].term);if(fIdx<fDeck.length-1){fIdx++;showFlash();}else{const ng=fDeck.length-fOkSet.size;alert('お疲れさまでした！\n✅覚えた:'+fOkSet.size+'語　❌もう一度:'+ng+'語');if(ng>0){fDeck=shuffle(fDeck.filter(d=>!fOkSet.has(d.term)));fIdx=0;showFlash();}}}
function startQuiz(){document.getElementById('quizBody').style.display='block';document.getElementById('scoreScreen').className='score-sc';qPool=shuffle(getPool());qIdx=0;qScore=0;qMiss=[];if(!qPool.length)return;showQuiz();}
function showQuiz(){if(qIdx>=qPool.length){showScore();return;}qAnswered=false;const d=qPool[qIdx];document.getElementById('qCat').textContent=d.cat||'';document.getElementById('qKw').textContent=d.keyword;const others=shuffle(DATA.filter(x=>x.term!==d.term)).slice(0,3);const choices=shuffle([d,...others]);const box=document.getElementById('choices');box.innerHTML='';choices.forEach(c=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=c.term;btn.onclick=()=>answerQuiz(c.term,d.term,d.desc,btn);box.appendChild(btn);});document.getElementById('quizFb').className='qfb';document.getElementById('quizNext').className='qnext';setProgress(qIdx,qPool.length);}
function answerQuiz(chosen,correct,desc,btn){if(qAnswered)return;qAnswered=true;document.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct');});const fb=document.getElementById('quizFb');if(chosen===correct){btn.classList.add('correct');fb.className='qfb show ok';document.getElementById('fbVerdict').textContent='✅ 正解！';qScore++;}else{btn.classList.add('wrong');fb.className='qfb show ng';document.getElementById('fbVerdict').textContent='❌ 不正解';qMiss.push({term:correct,keyword:qPool[qIdx].keyword});}document.getElementById('fbDesc').textContent=desc;const nxt=document.getElementById('quizNext');nxt.className='qnext show';nxt.textContent=qIdx===qPool.length-1?'結果を見る 🎉':'次の問題 ▶';}
function nextQuiz(){qIdx++;showQuiz();}
function showScore(){document.getElementById('quizBody').style.display='none';document.getElementById('scoreScreen').className='score-sc show';const pct=Math.round(qScore/qPool.length*100);document.getElementById('scoreBig').textContent=pct+'%';document.getElementById('scoreLabel').textContent=qScore+' / '+qPool.length+' 問正解';document.getElementById('scoreMsg').textContent=pct===100?'🎉 完璧！':pct>=80?'👏 素晴らしい！':pct>=60?'📚 もう少し！':'💪 一緒に頑張ろう！';const ml=document.getElementById('missList');if(qMiss.length>0){ml.innerHTML='<h3>❌ もう一度確認（'+qMiss.length+'語）</h3>';qMiss.forEach(m=>{ml.innerHTML+='<div class="miss-item"><div class="mt">✏️ '+m.term+'</div><div class="mk">'+m.keyword+'</div></div>';});}else ml.innerHTML='';}
initFlash();
</script></body></html>
