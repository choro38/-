<html lang="ja">
<head>
<meta charset="UTF-8">

<title>成人聴覚障害 問題集（問題演習＋キーワード穴埋め）</title>
<style>
:root{
  --bg:#f5f7fb;--card:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.65;font-size:16px}
#app{max-width:760px;margin:0 auto;padding:14px 14px 60px}
h1{font-size:1.25rem;margin:6px 0 2px}
.lead{color:var(--sub);font-size:.85rem;margin:0 0 14px}
.sec-title{font-size:1.05rem;font-weight:700;margin:18px 0 8px;display:flex;align-items:center;gap:6px}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.group h3{margin:0 0 8px;font-size:.92rem;color:var(--main-d)}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.unit-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:10px;padding:11px 12px;font-size:.95rem;font-weight:600;cursor:pointer}
.unit-btn:active{background:#dbeafe}
.unit-btn small{font-weight:500;color:var(--sub);white-space:nowrap}
.unit-btn.all-ok{background:var(--ok-bg);border-color:#a7f3d0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sub-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:.88rem;cursor:pointer;color:var(--ink);text-align:center}
.sub-btn b{display:block;font-size:.95rem}
.sub-btn small{color:var(--sub)}
.sub-btn:active{background:#f3f4f6}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.foot{margin-top:22px;font-size:.78rem;color:var(--sub);text-align:center}
.link{background:none;border:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-size:.78rem}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.back{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;background:var(--card)}
.prog{font-size:.85rem;color:var(--sub);flex:1;text-align:center}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--main);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:#eef2ff;color:#3730a3}
.tag.t-s{background:#ecfeff;color:#155e75}
.tag.t-y{background:#fdf2f8;color:#9d174d}
.starbtn{margin-left:auto;background:none;border:none;font-size:1.4rem;line-height:1;cursor:pointer;color:#d1d5db}
.starbtn.on{color:var(--star)}
.stem{font-size:1.05rem;font-weight:700;margin:4px 0 10px}
.dir{display:inline-block;padding:0 6px;border-radius:6px;margin:0 2px}
.dir.c{background:#dbeafe;color:#1e40af}
.dir.w{background:#fee2e2;color:#991b1b}
.sts{list-style:none;padding:0;margin:0 0 12px}
.sts li{padding:7px 10px;border-left:3px solid var(--line);background:#f9fafb;margin-bottom:5px;border-radius:0 8px 8px 0;font-size:.95rem}
.chs{display:grid;gap:8px}
.ch{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px;font-size:1rem;cursor:pointer;color:var(--ink)}
.ch:active{background:#f3f4f6}
.ch.right{border-color:var(--ok);background:var(--ok-bg);font-weight:700}
.ch.miss{border-color:var(--ng);background:var(--ng-bg)}
.ch:disabled{cursor:default}
.fb{margin-top:14px}
.verdict{font-weight:800;font-size:1.1rem;padding:10px 12px;border-radius:10px;margin-bottom:10px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.ng{background:var(--ng-bg);color:var(--ng)}
.jt{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:10px}
.jt td{border-top:1px solid var(--line);padding:7px 6px;vertical-align:top}
.jt td:first-child{white-space:nowrap;font-weight:700;width:3.2em}
.jt td.m{width:2em;text-align:center;font-weight:800}
.jt td.m.o{color:var(--ok)}.jt td.m.x{color:var(--ng)}

.box h4{margin:0 0 4px;font-size:.88rem}
.box ul{margin:0;padding-left:1.2em}
.box.key{background:#eff6ff;border:1px solid #bfdbfe}
.box.chg{background:#faf5ff;border:1px solid #e9d5ff}
.box.warn{background:var(--warn-bg);border:1px solid #fde68a;color:var(--warn)}

.next:active{background:var(--main-d)}
.score{font-size:2.4rem;font-weight:800;text-align:center;margin:10px 0 2px}
.center{text-align:center;color:var(--sub)}
.wl{list-style:none;padding:0;margin:12px 0}
.wl li{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--card);font-size:.9rem}
.btns{display:grid;gap:8px;margin-top:12px}
.btn2{background:var(--card);border:1px solid var(--main);color:var(--main);border-radius:12px;padding:12px;font-size:1rem;font-weight:700;cursor:pointer}

/* tabs / keyword fill-in */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.tabs button{padding:11px 6px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-weight:700;font-size:.95rem;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.kwtext{font-size:1.08rem;line-height:2.4;margin:10px 0 14px}
.blank{display:inline-block;vertical-align:baseline;border:none;border-bottom:2px dashed var(--main);background:#eff6ff;color:var(--main);border-radius:6px;padding:0 8px;margin:0 2px;font-size:1rem;cursor:pointer;min-width:4em;text-align:center;line-height:1.7;font-family:inherit}
.blank.shown{background:var(--ok-bg);color:var(--ok);border-bottom:2px solid var(--ok);font-weight:700}
.kwhint{font-size:.8rem;color:var(--sub);margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.g-ok{background:var(--ok);color:#fff;border:none;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer}
.g-ng{background:var(--card);color:var(--ng);border:1.5px solid var(--ng);border-radius:12px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer}
.unit-btn.kw{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.unit-btn.kw.all-ok{background:var(--ok-bg);border-color:#6ee7b7}
.wl b{color:var(--ok)}

/* 消去法 */
.sts li{display:flex;gap:8px;align-items:flex-start;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sts li .no{white-space:nowrap}
.sts li .mk{flex:none;margin-left:auto;min-width:2.1em;text-align:center;border:1.5px dashed #cbd5e1;border-radius:8px;color:#9ca3af;font-weight:800;line-height:1.7}
.sts li.mk-o{border-left-color:var(--ok);background:var(--ok-bg)}
.sts li.mk-o .mk{border:1.5px solid var(--ok);color:var(--ok);background:#fff}
.sts li.mk-x{border-left-color:var(--ng);background:var(--ng-bg)}
.sts li.mk-x .mk{border:1.5px solid var(--ng);color:var(--ng);background:#fff}
.mkhint{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.78rem;color:var(--sub);margin:-4px 0 6px}
.mkhint button{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.78rem;color:var(--sub);cursor:pointer}
.ch.out{opacity:.38;text-decoration:line-through}
.ch.right,.ch.miss{opacity:1;text-decoration:none}
</style>
</head>

/* ---------- 出題開始 ---------- */
function begin(list,label){
  if(!list.length){ alert("該当する問題がありません"); return; }
  S = {q:list, i:0, score:0, done:false, wrong:[], label};
  show();
}
function startUnit(n){ begin(DATA.filter(q=>q.unit===n), `${n}. ${unitName(n)}`); }
function startAll(){ begin(DATA, "全問"); }
function startRandom(){ begin(shuffle(DATA).slice(0,10), "ランダム10問"); }
function startStar(){ begin(DATA.filter(isStar), "★頻出"); }

function startWrong(){ begin(DATA.filter(q=>store.res[q.id]===false), "間違い復習"); }

/* ---------- 問題表示 ---------- */
function stemHtml(q){
  return q.stem.replace(/(正しい|間違っている)/, (m)=>`<span class="dir ${m==="正しい"?"c":"w"}">${m}</span>`);
}
function show(){
  const q = S.q[S.i];
  S.done = false;
  S.marks = [null,null,null,null,null];
  const pct = (S.i/S.q.length*100).toFixed(0);
  const hintTxt = q.dir==='n' ? "○＝当てはまる／×＝当てはまらない" : "○＝正しい文／×＝誤り文";
  $app.innerHTML = `
  <div class="topbar"><button class="back" onclick="confirmBack()">← メニュー</button><div class="prog">${S.label}｜${S.i+1} / ${S.q.length}</div><div style="width:84px"></div></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card">
    <div class="tags">
      <span class="tag">${q.unit}. ${unitName(q.unit)}</span>
      <span class="tag ${q.set==='s'?'t-s':'t-y'}">${q.set==='s'?'小テスト':'予想問題'}</span>
      <button class="starbtn ${isStar(q)?'on':''}" id="starbtn" onclick="toggleStar()" aria-label="★頻出に追加/解除">★</button>
    </div>
    <div class="stem">${stemHtml(q)}</div>
    <div class="mkhint"><span>文をタップで ${hintTxt} を記録 → 矛盾する選択肢は自動で消えます</span><button onclick="clearMarks()">クリア</button></div>
    <ul class="sts">${q.st.map((s,i)=>`<li id="st${i}" onclick="markCycle(${i})"><span class="no">(${i+1})</span><span>${s}</span><span class="mk">・</span></li>`).join("")}</ul>
    <div class="chs">${q.ch.map((c,i)=>`<button class="ch" id="ch${i}" onclick="pick(${i})">${NUM[i]} ${c}</button>`).join("")}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  window.scrollTo(0,0);
}
function confirmBack(){ if(S && S.i>0 && !confirm("途中ですがメニューに戻りますか？")) return; menu(); }
/* ---------- 消去法（○×メモ→矛盾する選択肢を自動で薄く） ---------- */
function selSet(c){
  if(c==="すべて") return [1,2,3,4,5];
  if(c==="なし") return [];
  return (c.match(/\((\d)\)/g)||[]).map(x=>+x[1]);
}
function isExcluded(q,ci){
  const target = (q.dir !== 'w');          // 「間違っている」問題では×の文が答え側
  const set = selSet(q.ch[ci]);
  for(let j=0;j<5;j++){
    const m = S.marks[j];
    if(m===null) continue;
    if((m===target) !== set.includes(j+1)) return true;
  }
  return false;
}
function refreshMarks(){
  const q = S.q[S.i];
  q.st.forEach((_,i)=>{
    const li = document.getElementById("st"+i), m = S.marks[i];
    li.className = m===null ? "" : (m ? "mk-o" : "mk-x");
    li.querySelector(".mk").textContent = m===null ? "・" : (m ? "○" : "×");
  });
  q.ch.forEach((_,i)=> document.getElementById("ch"+i).classList.toggle("out", isExcluded(q,i)));
}
function markCycle(i){
  if(S.done) return;
  const m = S.marks[i];
  S.marks[i] = (m===null) ? true : (m===true ? false : null);
  refreshMarks();
}
function clearMarks(){ if(S.done) return; S.marks=[null,null,null,null,null]; refreshMarks(); }
function toggleStar(){
  const q = S.q[S.i];
  store.stars[q.id] = !isStar(q); save();
  document.getElementById("starbtn").classList.toggle("on", isStar(q));
}

/* ---------- 解答 ---------- */
function pick(k){
  if(S.done) return;
  S.done = true;
  const q = S.q[S.i];
  const ok = k === q.a;
  if(ok) S.score++; else S.wrong.push(q);
  store.res[q.id] = ok; save();

  document.querySelectorAll(".ch").forEach((b,i)=>{
    b.disabled = true;
    if(i===q.a) b.classList.add("right");
    else if(i===k) b.classList.add("miss");
  });

  const rows = q.st.map((s,i)=>`<tr><td>(${i+1})</td><td class="m ${q.t[i]?'o':'x'}">${q.t[i]?'○':'×'}</td><td><div>${s}</div><div class="ex">${q.ex[i]}</div></td></tr>`).join("");
  const last = S.i === S.q.length-1;
  let h = `<div class="verdict ${ok?'ok':'ng'}">${ok?'⭕ 正解！':'❌ 不正解'}　正答：${NUM[q.a]} ${q.ch[q.a]}</div>`;
  if(S.marks.some(m=>m!==null)){
    const bad = []; q.st.forEach((_,i)=>{ if(S.marks[i]!==null && S.marks[i]!==(q.t[i]===1)) bad.push("("+(i+1)+")"); });
    h += `<div class="box ${bad.length?'warn':'key'}">${bad.length?`✋ 自分の○×メモが違っていた文：${bad.join(" ")}（下の表で確認）`:'👍 ○×メモはすべて合っていました'}</div>`;
  }
  if(q.warn) h += `<div class="box warn">${q.warn}</div>`;
  h += `<table class="jt">${rows}</table>
  <div class="center" style="font-size:.78rem;margin:-4px 0 10px">○＝その文は事実として正しい／×＝誤り（設問が「間違っている」場合は×が正答側）</div>`;
  if(q.key && q.key.length) h += `<div class="box key"><h4>💡 この問題のキモ</h4><ul>${q.key.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(q.chg && q.chg.length) h += `<div class="box chg"><h4>🔄 改変ポイント（小テスト → 予想問題）</h4><ul>${q.chg.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  h += `<button class="next" onclick="next()">${last?'結果を見る':'次の問題へ →'}</button>`;
  const fb = document.getElementById("fb");
  fb.innerHTML = h;
  fb.scrollIntoView({behavior:"smooth", block:"start"});
}
function next(){
  if(S.i < S.q.length-1){ S.i++; show(); } else result();
}

/* ---------- 結果 ---------- */
function result(){
  const n = S.q.length, pct = Math.round(S.score/n*100);
  let h = `<div class="topbar"><button class="back" onclick="menu()">← メニュー</button><div class="prog">${S.label}｜結果</div><div style="width:84px"></div></div>
  <div class="card"><div class="score">${S.score} / ${n}</div><div class="center">正答率 ${pct}%</div>`;
  if(S.wrong.length){
    h += `<div class="sec-title">❌ 間違えた問題</div><ul class="wl">${S.wrong.map(q=>`<li>${q.unit}. ${unitName(q.unit)}（${q.set==='s'?'小テスト':'予想'}）<br>${q.stem}</li>`).join("")}</ul>
    <div class="btns"><button class="btn2" onclick="retryWrong()">間違えた問題をもう一度</button><button class="btn2" onclick="menu()">メニューへ</button></div>`;
  } else {
    h += `<p class="center">全問正解です 🎉</p><div class="btns"><button class="btn2" onclick="menu()">メニューへ</button></div>`;
  }
  h += `</div>`;
  $app.innerHTML = h;
  window.scrollTo(0,0);
}
function retryWrong(){ begin(S.wrong.slice(), "間違い復習"); }

function kwStartUnit(n){ kwBegin(kwOf(n), `穴埋め ${n}. ${unitName(n)}`); }
function kwBegin(list,label){
  if(!list.length){ alert("該当する問題がありません"); return; }
  S = {kw:true, q:list, i:0, ok:0, ng:[], label, opened:0, total:0};

function kwShow(){

  S.opened = 0; S.answers = [];

  const body = k.text.replace(/\{\{(.+?)\}\}/g, (m,a)=>{

  el.innerHTML = `<div class="center" style="margin-bottom:6px">全部言えましたか？</div>

function kwMark(ok){

  if(S.ng.length){
    h += `<div class="sec-title">✗ まだの問題</div><ul class="wl">${S.ng.map(k=>`<li>${k.unit}. ${unitName(k.unit)}<br>${k.text.replace(/\{\{(.+?)\}\}/g,'<b>$1</b>')}</li>`).join("")}</ul>
    <div class="btns"><button class="btn2" onclick="kwBegin(S.ng.slice(),'穴埋め まだ復習')">まだの問題をもう一度</button><button class="btn2" onclick="menu()">メニューへ</button></div>`;
  } else {
    h += `<p class="center">全部覚えました 🎉</p><div class="btns"><button class="btn2" onclick="menu()">メニューへ</button></div>`;
  }
  h += `</div>`;
  $app.innerHTML = h; window.scrollTo(0,0);
}

menu();
</script>
</body>
</html>
