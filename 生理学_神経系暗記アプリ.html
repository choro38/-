<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生理学 神経系 暗記アプリ</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222536;
    --border: #2e3250;
    --accent: #6c63ff;
    --accent2: #00c9a7;
    --warn: #ff6b6b;
    --text: #e8eaf6;
    --text-dim: #7b82b0;
    --card-bg: #1e2133;
    --hidden-bg: #2a1f4e;
    --hidden-border: #6c63ff;
    --correct: #00c9a7;
    --wrong: #ff6b6b;
    --font: 'Segoe UI', 'Noto Sans JP', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .02em;
  }
  header h1 span { color: var(--accent2); }

  .mode-btns {
    display: flex;
    gap: 6px;
  }
  .mode-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: .8rem;
    cursor: pointer;
    transition: all .2s;
  }
  .mode-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .mode-btn:hover:not(.active) {
    border-color: var(--accent);
    color: var(--text);
  }

  /* ── Category tabs ── */
  .cat-bar {
    background: var(--surface);
    padding: 8px 16px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .cat-btn {
    padding: 5px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: .78rem;
    cursor: pointer;
    transition: all .15s;
  }
  .cat-btn.active {
    background: var(--surface2);
    border-color: var(--accent2);
    color: var(--accent2);
    font-weight: 600;
  }

  /* ── Progress bar ── */
  .progress-wrap {
    background: var(--surface);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .78rem;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .progress-bar {
    flex: 1;
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width .3s;
  }
  .score-badge {
    display: flex;
    gap: 10px;
  }
  .badge { display: flex; align-items: center; gap: 3px; }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .dot-ok { background: var(--correct); }
  .dot-ng { background: var(--wrong); }

  /* ── Main ── */
  main {
    flex: 1;
    padding: 16px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  /* ── Cloze mode ── */
  #cloze-view { display: flex; flex-direction: column; gap: 14px; }

  .q-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: border-color .2s;
  }
  .q-card.revealed { border-color: var(--accent2); }

  .q-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .q-tag {
    font-size: .68rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px 8px;
    color: var(--text-dim);
  }
  .q-num { font-size: .7rem; color: var(--text-dim); }

  .q-text {
    font-size: .92rem;
    line-height: 1.8;
    color: var(--text);
  }

  .blank {
    display: inline-block;
    background: var(--hidden-bg);
    border: 1.5px solid var(--hidden-border);
    border-radius: 4px;
    padding: 0 6px;
    min-width: 80px;
    text-align: center;
    cursor: pointer;
    color: transparent;
    font-weight: 700;
    user-select: none;
    transition: all .2s;
    vertical-align: baseline;
    position: relative;
    top: 1px;
  }
  .blank::before {
    content: '？';
    color: var(--accent);
    font-weight: 700;
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  .blank.open {
    background: transparent;
    border-color: var(--accent2);
    color: var(--accent2);
  }
  .blank.open::before { display: none; }

  .q-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .btn-reveal-all, .btn-ok, .btn-ng {
    padding: 6px 14px;
    border-radius: 8px;
    border: 1.5px solid;
    font-size: .78rem;
    cursor: pointer;
    font-weight: 600;
    transition: all .15s;
  }
  .btn-reveal-all {
    border-color: var(--accent);
    color: var(--accent);
    background: transparent;
  }
  .btn-reveal-all:hover { background: var(--accent); color: #fff; }
  .btn-ok {
    border-color: var(--correct);
    color: var(--correct);
    background: transparent;
  }
  .btn-ok:hover, .btn-ok.selected { background: var(--correct); color: #000; }
  .btn-ng {
    border-color: var(--wrong);
    color: var(--wrong);
    background: transparent;
  }
  .btn-ng:hover, .btn-ng.selected { background: var(--wrong); color: #fff; }

  /* ── Card mode ── */
  #card-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .flashcard {
    width: 100%;
    max-width: 680px;
    min-height: 240px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 30px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    cursor: pointer;
    transition: border-color .2s, transform .1s;
    position: relative;
    user-select: none;
  }
  .flashcard:hover { border-color: var(--accent); transform: translateY(-2px); }
  .flashcard .fc-label {
    font-size: .72rem;
    color: var(--text-dim);
    position: absolute;
    top: 14px; left: 18px;
  }
  .flashcard .fc-q {
    font-size: .88rem;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.7;
  }
  .flashcard .fc-a {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent2);
    text-align: center;
    line-height: 1.6;
    display: none;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    width: 100%;
  }
  .flashcard.flipped .fc-a { display: block; }
  .flashcard .fc-hint {
    font-size: .72rem;
    color: var(--text-dim);
    position: absolute;
    bottom: 12px;
  }
  .fc-cat-tag {
    position: absolute;
    top: 14px; right: 18px;
    font-size: .65rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
    color: var(--text-dim);
  }

  .card-nav {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .nav-btn {
    padding: 10px 22px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: .85rem;
    cursor: pointer;
    transition: all .15s;
    font-weight: 600;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.ok { border-color: var(--correct); color: var(--correct); }
  .nav-btn.ok:hover { background: var(--correct); color: #000; }
  .nav-btn.ng { border-color: var(--wrong); color: var(--wrong); }
  .nav-btn.ng:hover { background: var(--wrong); color: #fff; }
  .card-counter {
    font-size: .82rem;
    color: var(--text-dim);
    min-width: 70px;
    text-align: center;
  }

  /* ── Summary ── */
  #summary-view {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 30px 0;
  }
  #summary-view h2 { font-size: 1.3rem; color: var(--accent); }
  .sum-stats {
    display: flex; gap: 24px; flex-wrap: wrap; justify-content: center;
  }
  .sum-stat {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 24px;
    text-align: center;
    min-width: 120px;
  }
  .sum-stat .num { font-size: 2rem; font-weight: 700; }
  .sum-stat .lbl { font-size: .72rem; color: var(--text-dim); margin-top: 4px; }
  .num-ok { color: var(--correct); }
  .num-ng { color: var(--wrong); }
  .num-rate { color: var(--accent); }
  .restart-btn {
    padding: 12px 28px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
  }
  .restart-btn:hover { opacity: .85; }

  /* ── Scroll to top ── */
  .top-btn {
    position: fixed;
    bottom: 20px; right: 20px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    width: 40px; height: 40px;
    color: #fff;
    font-size: 1.1rem;
    cursor: pointer;
    opacity: .7;
    transition: opacity .2s;
    display: flex; align-items: center; justify-content: center;
  }
  .top-btn:hover { opacity: 1; }

  @media(max-width:600px){
    .q-text { font-size: .85rem; }
    .flashcard { min-height: 200px; }
    .fc-a { font-size: 1rem; }
  }
</style>
</head>
<body>

<header>
  <h1>⚡ 生理学 神経系 <span>暗記アプリ</span></h1>
  <div class="mode-btns">
    <button class="mode-btn active" onclick="setMode('cloze')">穴埋めモード</button>
    <button class="mode-btn" onclick="setMode('card')">カードモード</button>
  </div>
</header>

<div class="cat-bar" id="cat-bar"></div>

<div class="progress-wrap">
  <span id="prog-txt">0 / 0</span>
  <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="score-badge">
    <span class="badge"><span class="dot dot-ok"></span><span id="cnt-ok">0</span></span>
    <span class="badge"><span class="dot dot-ng"></span><span id="cnt-ng">0</span></span>
  </div>
</div>

<main>
  <div id="cloze-view"></div>
  <div id="card-view" style="display:none">
    <div class="flashcard" id="fc" onclick="flipCard()">
      <span class="fc-label">Q.</span>
      <div class="fc-q" id="fc-q">カードをクリックして裏返す</div>
      <span class="fc-cat-tag" id="fc-cat"></span>
      <div class="fc-a" id="fc-a"></div>
      <span class="fc-hint" id="fc-hint">タップして答えを見る</span>
    </div>
    <div class="card-nav">
      <button class="nav-btn ng" onclick="markCard(false)">✗ もう一度</button>
      <span class="card-counter" id="card-counter">0 / 0</span>
      <button class="nav-btn ok" onclick="markCard(true)">✓ 覚えた！</button>
    </div>
  </div>
  <div id="summary-view">
    <h2>🎉 完了！</h2>
    <div class="sum-stats">
      <div class="sum-stat"><div class="num num-ok" id="s-ok">0</div><div class="lbl">覚えた</div></div>
      <div class="sum-stat"><div class="num num-ng" id="s-ng">0</div><div class="lbl">要復習</div></div>
      <div class="sum-stat"><div class="num num-rate" id="s-rate">0%</div><div class="lbl">正答率</div></div>
    </div>
    <button class="restart-btn" onclick="restart()">🔄 もう一度挑戦</button>
  </div>
</main>

<button class="top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
/* ================================================================
   DATA  — カテゴリ × 問題
================================================================ */
const QUESTIONS = [
  // ── 血液
  {cat:"血液", q:"血液は成人で体重の【A】%で、pH【B】（弱アルカリ性）の液体である。", blanks:{A:"7〜8", B:"7.4±0.05"}},
  {cat:"血液", q:"血液の機能4つ：①物質の運搬 ②恒常性の維持 ③【A】 ④【B】", blanks:{A:"生体防御", B:"止血作用"}},
  {cat:"血液", q:"血漿タンパク質の【A】は量が多く、膠質浸透圧を保ち栄養状態の指標となる。", blanks:{A:"アルブミン"}},
  {cat:"血液", q:"【A】は体内に侵入した細菌・ウイルスに対する免疫を担う血漿タンパク質である。", blanks:{A:"グロブリン"}},
  {cat:"血液", q:"【A】は出血時にフィブリンへ変換され血液凝固に関わる血漿タンパク質である。", blanks:{A:"フィブリノーゲン"}},
  {cat:"血液", q:"赤血球は【A】核で、ヘモグロビンが酸素を全身に搬送する。寿命は【B】日で、脾臓で破壊される。", blanks:{A:"無", B:"120"}},
  {cat:"血液", q:"白血球（顆粒球）のうち最も多く、細菌・真菌を貪食するのは【A】である。", blanks:{A:"好中球"}},
  {cat:"血液", q:"【A】球は寄生虫を攻撃し花粉などを排除する。【B】球はアレルギー反応の開始に関与する。", blanks:{A:"好酸", B:"好塩基"}},
  {cat:"血液", q:"単球は組織へ移動すると【A】や樹状細胞に変わる。", blanks:{A:"マクロファージ"}},
  {cat:"血液", q:"T細胞は【A】で育ち、B細胞は【B】で育ち抗体を産生（液性免疫）する。", blanks:{A:"胸腺", B:"骨髄"}},
  {cat:"血液", q:"【A】細胞は命令がなくても単独でがん細胞を攻撃できる。", blanks:{A:"NK"}},
  {cat:"血液", q:"腎臓で産生される造血ホルモンを【A】という。これが骨髄の【B】に作用し赤血球へ分化を促す。", blanks:{A:"エリスロポエチン", B:"造血幹細胞"}},

  // ── 代謝
  {cat:"代謝", q:"物質が合成されることを【A】、分解されることを【B】という。", blanks:{A:"同化", B:"異化"}},
  {cat:"代謝", q:"人体の主要元素4種：【A】61%・C23%・H10%・N2.6%", blanks:{A:"O（酸素）"}},
  {cat:"代謝", q:"糖質1gは【A】kcal、脂質1gは【B】kcal、タンパク質1gは【C】kcalのエネルギーを産む。", blanks:{A:"4", B:"9", C:"4"}},
  {cat:"代謝", q:"1つのグルコースから最大【A】個のATPが合成される。", blanks:{A:"38"}},
  {cat:"代謝", q:"解糖系でグルコースが【A】へ分解され、ミトコンドリアで【B】に変換されクエン酸回路（TCA）へ入る。", blanks:{A:"ピルビン酸", B:"アセチルCoA"}},
  {cat:"代謝", q:"嫌気的条件ではピルビン酸が少量の【A】へ分解される。", blanks:{A:"乳酸"}},
  {cat:"代謝", q:"骨格筋グリコーゲンは【A】を持たないため、筋内貯蔵後に自身でのみ使用される。", blanks:{A:"グルコース-6-ホスファターゼ"}},
  {cat:"代謝", q:"脂質：グリセロールは解糖系へ、脂肪酸は【A】されてアセチルCoAを生成しクエン酸回路へ入る。", blanks:{A:"β酸化"}},
  {cat:"代謝", q:"必須アミノ酸は【A】種類で体内では合成できない。アンモニアは肝臓で【B】に転換され排泄される。", blanks:{A:"9", B:"尿素"}},
  {cat:"代謝", q:"絶食時に糖質以外の成分（乳酸・グリセロール・糖原性アミノ酸等）からグルコースを生成することを【A】という。", blanks:{A:"糖新生"}},

  // ── ホルモン
  {cat:"ホルモン", q:"ホルモンは受容体（【A】）を持つ細胞だけが反応するため、ごく微量でも強い作用を示す。", blanks:{A:"レセプター"}},
  {cat:"ホルモン", q:"①ペプチドホルモンは【A】溶性で細胞膜上受容体に結合。②ステロイドホルモンは【B】溶性で細胞内受容体に結合。", blanks:{A:"水", B:"脂"}},
  {cat:"ホルモン", q:"ステロイドホルモンは【A】から生成される。効果は比較的ゆっくりだが長続きする。", blanks:{A:"コレステロール"}},
  {cat:"ホルモン", q:"③アミノ酸誘導体ホルモンはチロシンから生成され、水溶性の【A】と脂溶性の【B】がある。", blanks:{A:"カテコールアミン", B:"甲状腺ホルモン"}},
  {cat:"ホルモン", q:"ホルモン分泌の最高中枢は【A】と【B】による階層的調節である。", blanks:{A:"視床下部", B:"下垂体"}},
  {cat:"ホルモン", q:"分泌が過剰になると上位ホルモンが抑制するフィードバックを【A】フィードバックという。", blanks:{A:"ネガティブ"}},
  {cat:"ホルモン", q:"成長ホルモン（GH）は【A】初期の深い睡眠時に多く分泌される。", blanks:{A:"入眠"}},
  {cat:"ホルモン", q:"プロラクチン（PRL）の作用：①乳腺発達 ②乳汁産生・分泌 ③【A】の抑制", blanks:{A:"排卵"}},
  {cat:"ホルモン", q:"TSHは【A】を刺激してホルモン産生を促し、ACTHは主に【B】の分泌を促進する。", blanks:{A:"甲状腺", B:"糖質コルチコイド"}},
  {cat:"ホルモン", q:"FSHと【A】は性腺活動を調節する下垂体前葉ホルモンである。", blanks:{A:"LH（黄体形成ホルモン）"}},

  // ── 神経系（体性・自律）
  {cat:"神経系", q:"神経系は【A】（脳・脊髄）と【B】に分けられ、末梢神経系はさらに体性・自律神経系に分類される。", blanks:{A:"中枢神経系", B:"末梢神経系"}},
  {cat:"神経系", q:"体性感覚神経（求心路）は皮膚・骨格筋などの感覚を中枢へ伝え、体性運動神経（遠心路）は【A】へ運動指令を伝える。", blanks:{A:"骨格筋"}},
  {cat:"神経系", q:"体性運動神経の神経筋接合部では【A】（ACh）が放出され、【B】受容体に作用して骨格筋を収縮させる。", blanks:{A:"アセチルコリン", B:"ニコチン性アセチルコリン（Nm）"}},
  {cat:"神経系", q:"体性神経系は【A】支配や拮抗支配は受けない点が自律神経系と異なる。", blanks:{A:"二重"}},
  {cat:"神経系", q:"自律神経系の特徴3つ：①自律性（不随意性）②【A】③【B】", blanks:{A:"二重支配", B:"拮抗支配"}},
  {cat:"神経系", q:"交感神経は「【A】」、副交感神経は「【B】」に働く。", blanks:{A:"闘争・逃走（Fight or Flight）", B:"休息・消化（Rest and Digest）"}},
  {cat:"神経系", q:"交感神経は【A】（T1〜L2）の側柱から起始する。節前線維は【B】く、節後線維は【C】い。", blanks:{A:"胸腰髄性", B:"短", C:"長"}},
  {cat:"神経系", q:"交感神経節前ニューロンからは【A】、節後ニューロンからは主に【B】が放出される。", blanks:{A:"ACh（アセチルコリン）", B:"ノルアドレナリン（NA）"}},
  {cat:"神経系", q:"汗腺を支配する交感神経節後線維からは例外的に【A】が放出される。", blanks:{A:"ACh（アセチルコリン）"}},
  {cat:"神経系", q:"副腎髄質は節前ニューロンが直接シナプスを形成し、【A】と【B】をホルモンとして血液中へ分泌する。", blanks:{A:"アドレナリン", B:"ノルアドレナリン"}},
  {cat:"神経系", q:"副交感神経は【A】（脳仙髄性）であり、節前線維は【B】く、節後線維は【C】い。", blanks:{A:"craniosacral outflow", B:"長", C:"短"}},
  {cat:"神経系", q:"副交感神経は節前・節後ニューロンともに【A】が神経伝達物質である。", blanks:{A:"ACh（アセチルコリン）"}},
  {cat:"神経系", q:"頸動脈洞・大動脈弓の圧受容体情報は【A】・【B】を介して延髄の孤束核へ伝わり血圧を調節する。", blanks:{A:"舌咽神経（第Ⅸ脳神経）", B:"迷走神経（第Ⅹ脳神経）"}},

  // ── 循環
  {cat:"循環", q:"心臓は右心房・右心室・左心房・【A】の4部屋から形成される。", blanks:{A:"左心室"}},
  {cat:"循環", q:"房室弁：右は【A】弁、左は【B】弁。動脈弁：右は【C】弁、左は【D】弁（最も重要）。", blanks:{A:"三尖", B:"僧帽", C:"肺動脈", D:"大動脈"}},
  {cat:"循環", q:"体循環：【A】→大動脈→全身組織→大静脈→右心房", blanks:{A:"左心室"}},
  {cat:"循環", q:"肺循環：右心室→肺動脈（CO₂→O₂交換）→【A】→左心房", blanks:{A:"肺静脈"}},
  {cat:"循環", q:"肺動脈には【A】が流れ、肺静脈には【B】が流れる。", blanks:{A:"静脈血", B:"動脈血"}},
  {cat:"循環", q:"血液量：肝臓に【A】%、静脈容量血管には【B】%分布する。", blanks:{A:"25", B:"40"}},

  // ── 脳梗塞
  {cat:"脳梗塞", q:"脳梗塞の3病型：①【A】血栓性脳梗塞 ②【B】脳塞栓症 ③ラクナ梗塞", blanks:{A:"アテローム", B:"心原性"}},
  {cat:"脳梗塞", q:"アテローム血栓性脳梗塞の前兆となる一過性脳虚血発作を【A】という。神経症状は【B】時間以内に消失する。", blanks:{A:"TIA", B:"24"}},
  {cat:"脳梗塞", q:"心原性脳塞栓症は発症から【A】時間以内の適応例に【B】による静注血栓溶解療法が行われる。", blanks:{A:"4.5", B:"rt-PA"}},
  {cat:"脳梗塞", q:"rt-PAはプラスミノーゲンを【A】へ変換し【B】を分解して血栓を溶解する。", blanks:{A:"プラスミン", B:"フィブリン"}},
  {cat:"脳梗塞", q:"心原性脳塞栓症の再発予防には【A】薬（ワルファリン・DOAC）が使われる。", blanks:{A:"抗凝固"}},
  {cat:"脳梗塞", q:"ラクナ梗塞は直径【A】mm以下の小梗塞で、【B】・視床・内包・橋などの深部に好発する。", blanks:{A:"15", B:"被殻"}},
  {cat:"脳梗塞", q:"脳梗塞で錐体路（外側皮質脊髄路）が障害されると対側の【A】が出現する。", blanks:{A:"痙性片麻痺"}},
  {cat:"脳梗塞", q:"優位半球の病変では【A】、右半球病変では【B】などの高次脳機能障害を認める。", blanks:{A:"失語症", B:"半側空間無視"}},
];

/* ================================================================
   STATE
================================================================ */
let mode = 'cloze';
let activeCat = 'すべて';
let cardIdx = 0;
let cardFlipped = false;
let scores = {};   // qIdx -> 'ok'|'ng'|null

const allCats = ['すべて', ...new Set(QUESTIONS.map(q=>q.cat))];

function filteredQs() {
  return activeCat === 'すべて' ? QUESTIONS
    : QUESTIONS.filter(q=>q.cat===activeCat);
}

/* ================================================================
   INIT
================================================================ */
window.onload = () => {
  renderCatBar();
  render();
};

function renderCatBar() {
  const bar = document.getElementById('cat-bar');
  bar.innerHTML = allCats.map(c=>`
    <button class="cat-btn ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>
  `).join('');
}

function setCat(c) {
  activeCat = c;
  cardIdx = 0; cardFlipped = false;
  renderCatBar();
  render();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  cardIdx = 0; cardFlipped = false;
  render();
}

function render() {
  const qs = filteredQs();
  updateProgress(qs);
  if (mode==='cloze') {
    document.getElementById('cloze-view').style.display='flex';
    document.getElementById('card-view').style.display='none';
    document.getElementById('summary-view').style.display='none';
    renderCloze(qs);
  } else {
    document.getElementById('cloze-view').style.display='none';
    document.getElementById('card-view').style.display='flex';
    document.getElementById('summary-view').style.display='none';
    renderCard(qs);
  }
}

/* ================================================================
   PROGRESS
================================================================ */
function updateProgress(qs) {
  const total = qs.length;
  let ok=0, ng=0;
  qs.forEach((q,i)=>{
    const gIdx = QUESTIONS.indexOf(q);
    if(scores[gIdx]==='ok') ok++;
    else if(scores[gIdx]==='ng') ng++;
  });
  const done = ok+ng;
  document.getElementById('prog-txt').textContent = `${done} / ${total}`;
  document.getElementById('prog-fill').style.width = total ? (done/total*100)+'%' : '0%';
  document.getElementById('cnt-ok').textContent = ok;
  document.getElementById('cnt-ng').textContent = ng;
}

/* ================================================================
   CLOZE MODE
================================================================ */
function renderCloze(qs) {
  const view = document.getElementById('cloze-view');
  view.innerHTML = qs.map((q,i)=>{
    const gIdx = QUESTIONS.indexOf(q);
    const sc = scores[gIdx];
    return `
    <div class="q-card" id="qcard-${gIdx}" ${sc?'data-scored="'+sc+'"':''}>
      <div class="q-header">
        <span class="q-tag">${q.cat}</span>
        <span class="q-num">${i+1} / ${qs.length}</span>
      </div>
      <div class="q-text">${buildClozeHTML(q, gIdx)}</div>
      <div class="q-actions">
        <button class="btn-reveal-all" onclick="revealAll(${gIdx})">全て表示</button>
        <button class="btn-ok ${sc==='ok'?'selected':''}" onclick="markCloze(${gIdx},'ok')">✓ 覚えた</button>
        <button class="btn-ng ${sc==='ng'?'selected':''}" onclick="markCloze(${gIdx},'ng')">✗ 要復習</button>
      </div>
    </div>`;
  }).join('');
}

function buildClozeHTML(q, gIdx) {
  let html = q.q;
  Object.entries(q.blanks).forEach(([key,val])=>{
    const id = `blank-${gIdx}-${key}`;
    html = html.replace(`【${key}】`,
      `<span class="blank" id="${id}" onclick="toggleBlank('${id}','${val.replace(/'/g,"\\'")}')"
        data-val="${val.replace(/"/g,'&quot;')}">${val}</span>`
    );
  });
  return html;
}

function toggleBlank(id, val) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function revealAll(gIdx) {
  const q = QUESTIONS[gIdx];
  Object.keys(q.blanks).forEach(key=>{
    const el = document.getElementById(`blank-${gIdx}-${key}`);
    if(el) el.classList.add('open');
  });
  document.getElementById(`qcard-${gIdx}`).classList.add('revealed');
}

function markCloze(gIdx, sc) {
  scores[gIdx] = sc;
  const card = document.getElementById(`qcard-${gIdx}`);
  card.querySelectorAll('.btn-ok,.btn-ng').forEach(b=>b.classList.remove('selected'));
  card.querySelector(sc==='ok'?'.btn-ok':'.btn-ng').classList.add('selected');
  updateProgress(filteredQs());
}

/* ================================================================
   CARD MODE
================================================================ */
function renderCard(qs) {
  if(!qs.length) return;
  if(cardIdx >= qs.length) { showSummary(qs); return; }
  const q = qs[cardIdx];
  const gIdx = QUESTIONS.indexOf(q);

  // Build Q and A text
  let qText = q.q;
  let aText = '';
  Object.entries(q.blanks).forEach(([key,val])=>{
    qText = qText.replace(`【${key}】`, `<span style="color:var(--accent);font-weight:700">[　　]</span>`);
    aText += `<span style="color:var(--text-dim);font-size:.75rem">${key}:</span> ${val}　`;
  });

  const fc = document.getElementById('fc');
  fc.classList.remove('flipped');
  cardFlipped = false;
  document.getElementById('fc-q').innerHTML = qText;
  document.getElementById('fc-a').innerHTML = aText;
  document.getElementById('fc-cat').textContent = q.cat;
  document.getElementById('fc-hint').textContent = 'タップして答えを見る';
  document.getElementById('card-counter').textContent = `${cardIdx+1} / ${qs.length}`;
}

function flipCard() {
  if(cardFlipped) return;
  cardFlipped = true;
  document.getElementById('fc').classList.add('flipped');
  document.getElementById('fc-hint').textContent = '覚えた？判定してください';
}

function markCard(ok) {
  const qs = filteredQs();
  const q = qs[cardIdx];
  const gIdx = QUESTIONS.indexOf(q);
  scores[gIdx] = ok ? 'ok' : 'ng';
  cardIdx++;
  updateProgress(qs);
  if(cardIdx >= qs.length) { showSummary(qs); return; }
  renderCard(qs);
}

/* ================================================================
   SUMMARY
================================================================ */
function showSummary(qs) {
  document.getElementById('card-view').style.display='none';
  document.getElementById('cloze-view').style.display='none';
  const sv = document.getElementById('summary-view');
  sv.style.display='flex';
  let ok=0,ng=0;
  qs.forEach(q=>{
    const s = scores[QUESTIONS.indexOf(q)];
    if(s==='ok') ok++; else if(s==='ng') ng++;
  });
  const total = qs.length;
  document.getElementById('s-ok').textContent = ok;
  document.getElementById('s-ng').textContent = ng;
  document.getElementById('s-rate').textContent = total ? Math.round(ok/total*100)+'%' : '0%';
}

function restart() {
  const qs = filteredQs();
  qs.forEach(q=>{ delete scores[QUESTIONS.indexOf(q)]; });
  cardIdx=0; cardFlipped=false;
  document.getElementById('summary-view').style.display='none';
  render();
}
</script>
</body>
</html>
