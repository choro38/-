<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生理学 穴埋め暗記アプリ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: #f0f4f8;
    color: #1a2a3a;
    min-height: 100vh;
  }
  header {
    background: #1F4E79;
    color: #fff;
    padding: 16px 20px;
    text-align: center;
  }
  header h1 { font-size: 1.2rem; letter-spacing: 0.05em; }
  header p { font-size: 0.78rem; opacity: 0.75; margin-top: 4px; }

  #section-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 14px;
    background: #fff;
    border-bottom: 2px solid #e8eef4;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    padding: 6px 13px;
    border-radius: 20px;
    border: 2px solid #1F4E79;
    background: #fff;
    color: #1F4E79;
    font-size: 0.8rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn.active, .tab-btn:hover {
    background: #1F4E79;
    color: #fff;
  }

  #progress-bar-wrap { background: #e8eef4; height: 6px; }
  #progress-bar {
    height: 6px;
    background: linear-gradient(90deg, #E36C0A, #f5a623);
    width: 0%;
    transition: width 0.4s;
  }

  #stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 16px;
    font-size: 0.8rem;
    color: #555;
    background: #fff;
    border-bottom: 1px solid #e8eef4;
  }
  #stats span b { color: #1F4E79; }
  #score-display { font-weight: bold; color: #E36C0A; font-size: 0.9rem; }

  #card-area {
    padding: 16px;
    max-width: 680px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(31,78,121,0.10);
    padding: 22px 20px;
    margin-bottom: 14px;
    border-left: 5px solid #E36C0A;
  }
  .card-section-tag {
    display: inline-block;
    background: #1F4E79;
    color: #fff;
    font-size: 0.7rem;
    padding: 2px 10px;
    border-radius: 10px;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .card-text {
    font-size: 0.93rem;
    line-height: 2.0;
    color: #222;
    margin-bottom: 14px;
    word-break: break-all;
  }
  .blank-input {
    display: inline-block;
    border: none;
    border-bottom: 2px solid #E36C0A;
    background: transparent;
    min-width: 50px;
    max-width: 260px;
    font-size: 0.91rem;
    font-family: inherit;
    color: #E36C0A;
    font-weight: bold;
    text-align: center;
    outline: none;
    padding: 1px 4px;
    vertical-align: baseline;
    transition: border-color 0.2s;
  }
  .blank-input:focus { border-bottom-color: #1F4E79; }
  .blank-input.correct { border-bottom-color: #27ae60; color: #27ae60; background: #eafbf0; border-radius: 4px; }
  .blank-input.wrong { border-bottom-color: #e74c3c; color: #e74c3c; background: #fdf0f0; border-radius: 4px; }
  .blank-input[readonly] { cursor: default; }

  .btn-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    font-size: 0.85rem;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-check { background: #E36C0A; color: #fff; }
  .btn-skip { background: #e8eef4; color: #555; }
  .btn-hint { background: #fff; color: #1F4E79; border: 2px solid #1F4E79; }

  .answer-hint {
    font-size: 0.78rem;
    color: #999;
    margin-top: 8px;
    display: none;
    line-height: 1.8;
  }
  .answer-hint.show { display: block; }
  .answer-hint span { color: #27ae60; font-weight: bold; }

  .result-badge {
    display: none;
    font-size: 0.85rem;
    font-weight: bold;
    padding: 6px 14px;
    border-radius: 8px;
    margin-top: 10px;
    line-height: 1.7;
  }
  .result-badge.ok { background: #eafbf0; color: #27ae60; display: inline-block; }
  .result-badge.ng { background: #fdf0f0; color: #e74c3c; display: block; }

  #nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    position: sticky;
    bottom: 0;
    background: #fff;
    border-top: 2px solid #e8eef4;
    z-index: 10;
  }
  .nav-btn {
    padding: 10px 22px;
    border-radius: 10px;
    border: none;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.15s;
  }
  #btn-prev { background: #e8eef4; color: #555; }
  #btn-next { background: #1F4E79; color: #fff; }
  #q-counter { font-size: 0.82rem; color: #888; }

  #summary {
    display: none;
    padding: 30px 20px;
    text-align: center;
    max-width: 500px;
    margin: 0 auto;
  }
  #summary h2 { font-size: 1.4rem; color: #1F4E79; margin-bottom: 10px; }
  .score-big { font-size: 3rem; color: #E36C0A; font-weight: bold; line-height: 1; }
  .score-sub { font-size: 0.9rem; color: #888; margin-bottom: 20px; }
  .sum-msg { font-size: 1rem; color: #444; margin-bottom: 24px; line-height: 1.6; }
  #btn-restart {
    background: #E36C0A; color: #fff;
    padding: 14px 28px; border-radius: 12px;
    border: none; font-size: 1rem; font-weight: bold;
    cursor: pointer; margin: 6px;
  }
  #btn-retry-wrong {
    background: #1F4E79; color: #fff;
    padding: 14px 28px; border-radius: 12px;
    border: none; font-size: 1rem; font-weight: bold;
    cursor: pointer; margin: 6px; display: none;
  }
  #empty-state {
    display: none; text-align: center;
    padding: 60px 20px; color: #aaa; font-size: 1rem;
  }
</style>
</head>
<body>

<header>
  <h1>🧠 生理学 穴埋め暗記アプリ</h1>
  <p>オレンジキーワードを入力して覚えよう！全80問</p>
</header>

<div id="section-tabs">
  <button class="tab-btn active" data-section="all">すべて（80問）</button>
  <button class="tab-btn" data-section="血液">血液（35問）</button>
  <button class="tab-btn" data-section="代謝">代謝（13問）</button>
  <button class="tab-btn" data-section="ホルモン">ホルモン（16問）</button>
  <button class="tab-btn" data-section="神経">神経（8問）</button>
  <button class="tab-btn" data-section="脳梗塞">脳梗塞（8問）</button>
</div>

<div id="progress-bar-wrap"><div id="progress-bar"></div></div>

<div id="stats">
  <span>問題 <b id="stat-current">1</b> / <b id="stat-total">80</b></span>
  <span id="score-display">正解: <span id="stat-correct">0</span> 問</span>
</div>

<div id="card-area">
  <div id="main-card" class="card" style="display:none;"></div>
  <div id="empty-state">このセクションの問題がありません</div>
</div>

<div id="summary">
  <h2>✨ お疲れさまでした！</h2>
  <div class="score-big" id="sum-score">0</div>
  <div class="score-sub" id="sum-detail">/ 0 問</div>
  <div class="sum-msg" id="sum-msg"></div>
  <button id="btn-restart">🔄 最初からやり直す</button>
  <button id="btn-retry-wrong">❌ 間違えた問題だけ</button>
</div>

<div id="nav-row">
  <button class="nav-btn" id="btn-prev">◀ 前へ</button>
  <span id="q-counter"></span>
  <button class="nav-btn" id="btn-next">次へ ▶</button>
</div>

<script>

    html = html.replace(
      `[${i}]`,
      `<input class="blank-input" id="blank-${qIndex}-${i}" type="text" size="${len}" autocomplete="off" autocorrect="off" placeholder="　" data-answer="${encodeURIComponent(ans)}">`
    );
  }
  return html;
}

function renderCard(index) {
  const q = filteredQ[index];
  const card = document.getElementById('main-card');
  card.style.display = 'block';
  document.getElementById('empty-state').style.display = 'none';

  const alreadyAnswered = answered[index];
  const isCorrect = scores[index];

  let cardHTML = `<div class="card-section-tag">${q.section}</div>`;
  cardHTML += `<div class="card-text">${buildTemplate(q, index)}</div>`;

  if (!alreadyAnswered) {
    cardHTML += `
      <div class="btn-row">
        <button class="btn btn-check" onclick="checkAnswer(${index})">✔ 答え合わせ</button>
        <button class="btn btn-hint" onclick="showHint(${index})">💡 答えを見る</button>
        <button class="btn btn-skip" onclick="skipCard(${index})">→ スキップ</button>
      </div>
      <div class="answer-hint" id="hint-${index}">
        正解：${q.blanks.map(b => `<span>${b}</span>`).join('　')}
      </div>`;
  } else {
    const answerList = q.blanks.map(b => `<span style="color:#e74c3c;font-weight:bold">${b}</span>`).join('　');
    const badge = isCorrect
      ? `<div class="result-badge ok">✅ 正解！</div>`
      : `<div class="result-badge ng">❌ 要確認<br>正解：${answerList}</div>`;
    cardHTML += badge;
  }

  card.innerHTML = cardHTML;

  if (alreadyAnswered) {
    q.blanks.forEach((ans, i) => {
      const inp = document.getElementById(`blank-${index}-${i}`);
      if (inp) {
        inp.value = ans;
        inp.readOnly = true;
        inp.classList.add(isCorrect ? 'correct' : 'wrong');
      }
    });
  }

  card.querySelectorAll('.blank-input').forEach(inp => {
    inp.addEventListener('input', () => { inp.size = Math.max(4, inp.value.length + 2); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(index); });
  });

  updateStats();
}

function normalize(str) {
  return str.trim().replace(/\s+/g, '')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .toLowerCase();
}

function checkAnswer(index) {
  const q = filteredQ[index];
  let allCorrect = true;
  q.blanks.forEach((ans, i) => {
    const inp = document.getElementById(`blank-${index}-${i}`);
    if (!inp) return;
    const ok = normalize(inp.value) === normalize(ans);
    inp.classList.toggle('correct', ok);
    inp.classList.toggle('wrong', !ok);
    inp.readOnly = true;
    if (!ok) allCorrect = false;
  });

  answered[index] = true;
  scores[index] = allCorrect;

  const card = document.getElementById('main-card');
  const btnRow = card.querySelector('.btn-row');
  if (btnRow) btnRow.remove();
  const hint = card.querySelector('.answer-hint');
  if (hint) hint.remove();

  const badge = document.createElement('div');
  badge.className = 'result-badge ' + (allCorrect ? 'ok' : 'ng');
  const answerList = q.blanks.map(b => `<span style="color:#e74c3c;font-weight:bold">${b}</span>`).join('　');
  badge.innerHTML = allCorrect ? '✅ 正解！' : `❌ 要確認<br>正解：${answerList}`;
  card.appendChild(badge);

  updateStats();
  updateProgressBar();
  if (allCorrect && currentIndex < filteredQ.length - 1) {
    setTimeout(() => goNext(), 900);
  }
}

function showHint(index) {
  const hint = document.getElementById(`hint-${index}`);
  if (hint) hint.classList.add('show');
}

function skipCard(index) {
  answered[index] = true;
  scores[index] = false;
  goNext();
}

function goNext() {
  if (currentIndex < filteredQ.length - 1) {
    currentIndex++;
    renderCard(currentIndex);
    window.scrollTo({top: 0, behavior: 'smooth'});
  } else {
    showSummary();
  }
}

function goPrev() {
  if (currentIndex > 0) {
    currentIndex--;
    renderCard(currentIndex);
    window.scrollTo({top: 0, behavior: 'smooth'});
  }
}

function updateStats() {
  const total = filteredQ.length;
  const correctCount = Object.values(scores).filter(v => v === true).length;
  document.getElementById('stat-current').textContent = currentIndex + 1;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-correct').textContent = correctCount;
  document.getElementById('q-counter').textContent = `${currentIndex + 1} / ${total}`;
}

function updateProgressBar() {
  const answeredCount = Object.keys(answered).length;
  document.getElementById('progress-bar').style.width =
    (answeredCount / filteredQ.length * 100) + '%';
}

function showSummary() {
  document.getElementById('card-area').style.display = 'none';
  document.getElementById('nav-row').style.display = 'none';
  document.getElementById('summary').style.display = 'block';

  const total = filteredQ.length;
  const correct = Object.values(scores).filter(v => v === true).length;
  const pct = Math.round(correct / total * 100);

  document.getElementById('sum-score').textContent = correct;
  document.getElementById('sum-detail').textContent = `/ ${total} 問　(${pct}%)`;

  let msg = '';
  if (pct === 100) msg = '🎉 パーフェクト！国試合格間違いなし！';
  else if (pct >= 80) msg = '🌟 素晴らしい！あと少し！';
  else if (pct >= 60) msg = '👍 いい調子！間違えた箇所を復習しよう！';
  else msg = '💪 もう一回チャレンジ！繰り返しが力になる！';
  document.getElementById('sum-msg').textContent = msg;

  wrongIndices = filteredQ.map((_, i) => i).filter(i => !scores[i]);
  if (wrongIndices.length > 0) {
    document.getElementById('btn-retry-wrong').style.display = 'inline-block';
  }
}

function startQuiz(section, qs) {
  currentSection = section;
  filteredQ = qs;
  currentIndex = 0;
  scores = {};
  answered = {};
  wrongIndices = [];

  document.getElementById('card-area').style.display = 'block';
  document.getElementById('nav-row').style.display = 'flex';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';

  if (filteredQ.length === 0) {
    document.getElementById('main-card').style.display = 'none';
    document.getElementById('empty-state').style.display = 'block';
    updateStats();
    return;
  }
  renderCard(0);
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    startQuiz(btn.dataset.section, getFiltered(btn.dataset.section));
  });
});

document.getElementById('btn-next').addEventListener('click', goNext);
document.getElementById('btn-prev').addEventListener('click', goPrev);
document.getElementById('btn-restart').addEventListener('click', () => {
  startQuiz(currentSection, getFiltered(currentSection));
});
document.getElementById('btn-retry-wrong').addEventListener('click', () => {
  startQuiz(currentSection, wrongIndices.map(i => filteredQ[i]));
});

startQuiz('all', getFiltered('all'));
</script>
</body>
</html>
