<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知的障害⑭ 国試過去問 | 検査編</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap');

  :root {
    --bg: #F0F4F8;
    --surface: #FFFFFF;
    --primary: #2D6A8F;
    --primary-light: #E8F4FD;
    --accent: #1A9B6C;
    --accent-light: #E6F7F1;
    --warn: #C0392B;
    --warn-light: #FDECEA;
    --text: #1C2B3A;
    --text-muted: #5A7080;
    --border: #D1DDE6;
    --correct: #1A9B6C;
    --wrong: #C0392B;
    --tag-bg: #EAF2FB;
    --tag-text: #2D6A8F;
    --shadow: 0 2px 12px rgba(45,106,143,0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* Header */
  .app-header {
    background: var(--primary);
    color: white;
    padding: 18px 24px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .app-header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.15rem;
    letter-spacing: 0.03em;
  }
  .app-header .subtitle {
    font-size: 0.72rem;
    opacity: 0.82;
    margin-top: 2px;
  }
  .header-badge {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.72rem;
    white-space: nowrap;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 7px 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-outline {
    background: white;
    border: 1.5px solid var(--primary);
    color: var(--primary);
  }
  .btn-outline:hover { background: var(--primary-light); }
  .btn-outline.active { background: var(--primary); color: white; }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-accent {
    background: var(--accent);
    color: white;
  }
  .btn-accent:hover { opacity: 0.88; }
  .btn-reset {
    background: #f0f0f0;
    color: var(--text-muted);
  }
  .btn-reset:hover { background: #e0e0e0; }

  .mode-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-right: 2px;
  }

  /* Progress */
  .progress-wrap {
    padding: 10px 16px 0;
    max-width: 860px;
    margin: 0 auto;
  }
  .progress-bar-bg {
    height: 5px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .progress-text {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-align: right;
  }

  /* Score bar */
  .score-bar {
    display: flex;
    gap: 12px;
    padding: 8px 16px;
    max-width: 860px;
    margin: 0 auto;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .score-correct { color: var(--correct); font-weight: 700; }
  .score-wrong { color: var(--wrong); font-weight: 700; }

  /* Main card */
  .main-content {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .question-card {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 24px 24px 20px;
    margin-top: 12px;
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .q-num {
    background: var(--primary);
    color: white;
    border-radius: 6px;
    padding: 2px 10px;
    font-size: 0.8rem;
    font-weight: 700;
  }
  .q-source {
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 6px;
    padding: 2px 9px;
    font-size: 0.72rem;
    font-weight: 500;
  }
  .q-star {
    color: #E8A000;
    font-size: 0.88rem;
  }

  .q-text {
    font-size: 1.0rem;
    line-height: 1.75;
    font-weight: 500;
    margin-bottom: 18px;
  }

  /* Table inside question */
  .q-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.82rem;
    margin: 10px 0 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .q-table th {
    background: var(--primary-light);
    color: var(--primary);
    padding: 7px 10px;
    text-align: center;
    font-weight: 700;
    border-bottom: 1px solid var(--border);
  }
  .q-table td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  .q-table tr:last-child td { border-bottom: none; }

  /* Choices */
  .choices { display: flex; flex-direction: column; gap: 9px; }

  .choice-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: #F7FAFD;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    line-height: 1.55;
  }
  .choice-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .choice-btn:disabled { cursor: default; }

  .choice-label {
    min-width: 22px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-muted);
    font-size: 0.78rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .choice-btn.correct {
    border-color: var(--correct);
    background: var(--accent-light);
  }
  .choice-btn.correct .choice-label {
    background: var(--correct);
    color: white;
  }
  .choice-btn.wrong-selected {
    border-color: var(--wrong);
    background: var(--warn-light);
  }
  .choice-btn.wrong-selected .choice-label {
    background: var(--wrong);
    color: white;
  }
  .choice-btn.dimmed {
    opacity: 0.55;
  }

  /* 複数選択問題のチェックボックス風 */
  .choice-btn.multi-mode .choice-label {
    border-radius: 4px;
  }
  .choice-btn.selected-multi {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .choice-btn.selected-multi .choice-label {
    background: var(--primary);
    color: white;
  }

  .submit-multi {
    margin-top: 12px;
  }

  /* Result */
  .result-box {
    margin-top: 16px;
    border-radius: 10px;
    padding: 16px 18px;
    border-left: 4px solid;
    animation: fadeIn 0.25s ease;
  }
  .result-box.correct-result {
    background: var(--accent-light);
    border-color: var(--correct);
  }
  .result-box.wrong-result {
    background: var(--warn-light);
    border-color: var(--wrong);
  }
  .result-title {
    font-weight: 700;
    font-size: 1.0rem;
    margin-bottom: 10px;
  }
  .correct-result .result-title { color: var(--correct); }
  .wrong-result .result-title { color: var(--wrong); }

  .result-answer {
    font-size: 0.88rem;
    margin-bottom: 12px;
    color: var(--text);
  }

  .explanation-list { list-style: none; display: flex; flex-direction: column; gap: 9px; }
  .explanation-item {
    font-size: 0.85rem;
    line-height: 1.65;
    display: flex;
    gap: 10px;
  }
  .exp-badge {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 700;
    margin-top: 2px;
  }
  .exp-badge.ok { background: var(--correct); color: white; }
  .exp-badge.ng { background: var(--wrong); color: white; }

  /* Navigation */
  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }

  /* Summary */
  .summary-card {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 32px 24px;
    margin-top: 12px;
    text-align: center;
  }
  .summary-title {
    font-family: 'Noto Serif JP', serif;
    font-size: 1.4rem;
    color: var(--primary);
    margin-bottom: 20px;
  }
  .summary-score {
    font-size: 3rem;
    font-weight: 700;
    color: var(--primary);
  }
  .summary-score span { font-size: 1.2rem; color: var(--text-muted); }
  .summary-rate {
    font-size: 1.1rem;
    color: var(--accent);
    font-weight: 700;
    margin: 6px 0 20px;
  }
  .summary-msg {
    font-size: 0.92rem;
    color: var(--text-muted);
    margin-bottom: 24px;
    line-height: 1.7;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .star-icon { color: #E8A000; }

  /* 問題番号ナビ */
  .q-nav-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 12px 16px;
    max-width: 860px;
    margin: 0 auto;
  }
  .q-nav-dot {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .q-nav-dot.answered-ok { background: var(--accent-light); border-color: var(--correct); color: var(--correct); }
  .q-nav-dot.answered-ng { background: var(--warn-light); border-color: var(--wrong); color: var(--wrong); }
  .q-nav-dot.current { border-color: var(--primary); background: var(--primary); color: white; }
  .q-nav-dot:hover:not(.current) { border-color: var(--primary); }

  .section-divider {
    font-size: 0.72rem;
    color: var(--text-muted);
    padding: 6px 16px 2px;
    max-width: 860px;
    margin: 0 auto;
  }

  @media (max-width: 600px) {
    .question-card { padding: 16px 14px; }
    .q-text { font-size: 0.93rem; }
    .choice-btn { font-size: 0.85rem; }
    .summary-score { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <h1>🧠 知的障害⑭ 国試過去問</h1>
    <div class="subtitle">検査・発達評価編 ／ 全30問（第19〜28回）</div>
  </div>
  <div class="header-badge">ST国家試験対策</div>
</div>

<div class="controls">
  <span class="mode-label">出題順：</span>
  <button class="btn btn-outline active" id="btn-order" onclick="setMode('order')">順番通り</button>
  <button class="btn btn-outline" id="btn-random" onclick="setMode('random')">ランダム</button>
  <div style="flex:1"></div>
  <button class="btn btn-reset" onclick="resetQuiz()">🔄 最初から</button>
</div>

<div class="progress-wrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
  <div class="progress-text" id="progress-text">0 / 30</div>
</div>
<div class="score-bar">
  <span>正解：<span class="score-correct" id="score-correct">0</span></span>
  <span>不正解：<span class="score-wrong" id="score-wrong">0</span></span>
  <span style="margin-left:auto; font-size:0.72rem;" id="score-rate"></span>
</div>

<div class="section-divider" id="q-nav-label">問題を選んでジャンプ：</div>
<div class="q-nav-grid" id="q-nav-grid"></div>

<div class="main-content" id="main-content"></div>

      { ok: false, text: "【2・誤り】WISC-Ⅴでは「5つ」の指標得点（VCI・VSI・FRI・WMI・PSI）が算出できます。4つではありません（WISC-ⅣがWISC-Ⅳが4つ）。" },
      { ok: true,  text: "【3・正解★】田中ビネー知能検査Ⅴは子どもの生活年齢（CA）と等しい年齢級から開始します（基底年齢を設定するため）。" },
      { ok: false, text: "【4・誤り】LCSA（学齢期言語発達検査）はリテラシー指数ではなく「語彙・文法・言語表現・高次言語技能・コミュニケーション」等の指標を算出します。" },

  {
    id: 30,
    source: "28-pm-67",
    star: true,
    text: "田中ビネー知能検査Ⅴについて誤っているのはどれか。",
    type: "single",
    choices: [
      "知能指数はCA÷MA×100で算出される。",
      "「用途による物の指示」は１歳級の問題である。",
      "ある年齢級の項目がすべて不通過になったら中止する。",
      "基底年齢は全問できた年齢級に１を加えた年齢である。",
      "１歳級で正答が得られない場合は発達チェックができる。"
    ],
    choiceLabels: ["1","2","3","4","5"],
    answer: [0],
    answerText: "1（知能指数の算出式が逆）",
    explanation: [
      { ok: true,  text: "【1・誤り★★】最重要ポイント！比率IQの正しい公式は「MA（精神年齢）÷CA（生活年齢）×100」です。「CA÷MA×100」は逆です。CA=生活年齢（Chronological Age）、MA=精神年齢（Mental Age）。" },
      { ok: false, text: "【2・正しい】「用途による物の指示」は１歳級の検査項目です。" },
      { ok: false, text: "【3・正しい】ある年齢級の項目がすべて不通過になった時点で検査を中止します（上限年齢の設定）。" },
      { ok: false, text: "【4・正しい】基底年齢は「全問通過した年齢級」そのものです（+1は誤り）。問題文では「全問できた年齢級に1を加えた年齢」とありますが、問題の選択肢として確認が必要な箇所です。" },
      { ok: false, text: "【5・正しい】1歳級で正答が得られない場合は、0歳台の発達チェック項目で評価します。" }
    ]
  }
];

// ===================== 状態管理 =====================
let mode = 'order';
let order = [];
let currentIdx = 0;
let results = {}; // {qIdx: true/false}
let selectedMulti = [];
let answered = false;

function init() {
  order = ALL_QUESTIONS.map((_, i) => i);
  currentIdx = 0;
  results = {};
  selectedMulti = [];
  answered = false;
  renderNavGrid();
  renderQuestion();
  updateProgress();
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-order').classList.toggle('active', m === 'order');
  document.getElementById('btn-random').classList.toggle('active', m === 'random');
  if (m === 'random') {
    order = [...ALL_QUESTIONS.map((_, i) => i)].sort(() => Math.random() - 0.5);
  } else {
    order = ALL_QUESTIONS.map((_, i) => i);
  }
  currentIdx = 0;
  results = {};
  selectedMulti = [];
  answered = false;
  renderNavGrid();
  renderQuestion();
  updateProgress();
}

function resetQuiz() {
  results = {};
  selectedMulti = [];
  answered = false;
  currentIdx = 0;
  if (mode === 'random') order = [...ALL_QUESTIONS.map((_, i) => i)].sort(() => Math.random() - 0.5);
  else order = ALL_QUESTIONS.map((_, i) => i);
  renderNavGrid();
  renderQuestion();
  updateProgress();
}

function jumpTo(idx) {
  currentIdx = idx;
  selectedMulti = [];
  answered = false;
  renderQuestion();
  updateProgress();
  renderNavGrid();
}

function renderNavGrid() {
  const grid = document.getElementById('q-nav-grid');
  grid.innerHTML = '';
  order.forEach((qIdx, i) => {
    const q = ALL_QUESTIONS[qIdx];
    const dot = document.createElement('button');
    dot.className = 'q-nav-dot';
    dot.textContent = q.id;
    if (i === currentIdx) dot.classList.add('current');
    else if (results[qIdx] === true) dot.classList.add('answered-ok');
    else if (results[qIdx] === false) dot.classList.add('answered-ng');
    dot.onclick = () => jumpTo(i);
    grid.appendChild(dot);
  });
}

function updateProgress() {
  const total = ALL_QUESTIONS.length;
  const done = Object.keys(results).length;
  const correct = Object.values(results).filter(v => v).length;
  const wrong = done - correct;
  const pct = Math.round((done / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('score-correct').textContent = correct;
  document.getElementById('score-wrong').textContent = wrong;
  document.getElementById('score-rate').textContent = done > 0 ? `正答率 ${Math.round(correct/done*100)}%` : '';
}

function renderQuestion() {
  if (currentIdx >= order.length) {
    renderSummary();
    return;
  }

  const qIdx = order[currentIdx];
  const q = ALL_QUESTIONS[qIdx];
  const isAnswered = results[qIdx] !== undefined;

  const numLabel = `${currentIdx + 1} / ${order.length}`;
  const starHtml = q.star ? '<span class="q-star">★ 頻出</span>' : '';

  // テキスト整形
  const qText = q.text.replace(/\n/g, '<br>');

  // 選択肢タイプ表示
  let typeNote = '';
  if (q.type === 'multi2') typeNote = '<span class="q-source" style="background:#fff3e0;color:#e65100;">2つ選択</span>';
  if (q.type === 'multi3') typeNote = '<span class="q-source" style="background:#fff3e0;color:#e65100;">3つ選択</span>';

  let choicesHtml = '';
  if (q.type === 'single') {
    choicesHtml = `<div class="choices" id="choices-container">` +
      q.choices.map((c, i) => {
        let cls = 'choice-btn';
        if (isAnswered) {
          if (q.answer.includes(i)) cls += ' correct';
          else cls += ' dimmed';
        }
        return `<button class="${cls}" onclick="answerSingle(${qIdx}, ${i})" ${isAnswered ? 'disabled' : ''}>
          <span class="choice-label">${q.choiceLabels[i]}</span>
          <span>${c}</span>
        </button>`;
      }).join('') + `</div>`;
  } else {
    // multi
    const multiCount = q.type === 'multi2' ? 2 : 3;
    choicesHtml = `<div class="choices" id="choices-container">` +
      q.choices.map((c, i) => {
        let cls = 'choice-btn multi-mode';
        if (isAnswered) {
          if (q.answer.includes(i)) cls += ' correct';
          else cls += ' dimmed';
        } else if (selectedMulti.includes(i)) {
          cls += ' selected-multi';
        }
        return `<button class="${cls}" onclick="toggleMulti(${qIdx}, ${i}, ${multiCount})" ${isAnswered ? 'disabled' : ''}>
          <span class="choice-label">${q.choiceLabels[i]}</span>
          <span>${c}</span>
        </button>`;
      }).join('') +
      `</div>` +
      (!isAnswered ? `<button class="btn btn-primary submit-multi" onclick="submitMulti(${qIdx}, ${multiCount})">解答する（${selectedMulti.length}/${multiCount}選択中）</button>` : '');
  }

  // 解説
  let resultHtml = '';
  if (isAnswered) {
    const isCorrect = results[qIdx];
    const cls = isCorrect ? 'correct-result' : 'wrong-result';
    const icon = isCorrect ? '✅ 正解！' : '❌ 不正解';
    const expItems = q.explanation.map(e => `
      <li class="explanation-item">
        <span class="exp-badge ${e.ok ? 'ok' : 'ng'}">${e.ok ? '○' : '×'}</span>
        <span>${e.text}</span>
      </li>`).join('');
    resultHtml = `
      <div class="result-box ${cls}">
        <div class="result-title">${icon}</div>
        <div class="result-answer">正解：<strong>${q.answerText}</strong></div>
        <ul class="explanation-list">${expItems}</ul>
      </div>`;
  }

  // ナビボタン
  const navHtml = isAnswered ? `
    <div class="nav-row">
      ${currentIdx > 0 ? `<button class="btn btn-outline" onclick="prevQ()">◀ 前の問題</button>` : ''}
      ${currentIdx < order.length - 1 
        ? `<button class="btn btn-primary" onclick="nextQ()">次の問題 ▶</button>`
        : `<button class="btn btn-accent" onclick="showSummary()">📊 結果を見る</button>`}
    </div>` : '';

  document.getElementById('main-content').innerHTML = `
    <div class="question-card" style="animation:fadeIn 0.2s ease">
      <div class="q-meta">
        <span class="q-num">問${numLabel}</span>
        <span class="q-source">${q.source}</span>
        ${typeNote}
        ${starHtml}
      </div>
      <div class="q-text">${qText}</div>
      ${choicesHtml}
      ${resultHtml}
      ${navHtml}
    </div>`;
}

function answerSingle(qIdx, selectedI) {
  if (results[qIdx] !== undefined) return;
  const q = ALL_QUESTIONS[qIdx];
  const isCorrect = q.answer.includes(selectedI);
  results[qIdx] = isCorrect;
  answered = true;
  updateProgress();
  renderNavGrid();
  renderQuestion();
}

function toggleMulti(qIdx, i, maxCount) {
  if (results[qIdx] !== undefined) return;
  if (selectedMulti.includes(i)) {
    selectedMulti = selectedMulti.filter(x => x !== i);
  } else if (selectedMulti.length < maxCount) {
    selectedMulti.push(i);
  }
  renderQuestion();
}

function submitMulti(qIdx, maxCount) {
  if (selectedMulti.length !== maxCount) {
    alert(`${maxCount}つ選んでから解答してください。（現在${selectedMulti.length}つ選択中）`);
    return;
  }
  const q = ALL_QUESTIONS[qIdx];
  const sortedSelected = [...selectedMulti].sort();
  const sortedAnswer = [...q.answer].sort();
  const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedAnswer);
  results[qIdx] = isCorrect;
  selectedMulti = [];
  answered = true;
  updateProgress();
  renderNavGrid();
  renderQuestion();
}

function nextQ() {
  if (currentIdx < order.length - 1) {
    currentIdx++;
    selectedMulti = [];
    answered = false;
    renderNavGrid();
    renderQuestion();
    window.scrollTo(0, 0);
  }
}

function prevQ() {
  if (currentIdx > 0) {
    currentIdx--;
    selectedMulti = [];
    answered = false;
    renderNavGrid();
    renderQuestion();
    window.scrollTo(0, 0);
  }
}

function showSummary() {
  currentIdx = order.length;
  renderSummary();
}

function renderSummary() {
  const total = ALL_QUESTIONS.length;
  const done = Object.keys(results).length;
  const correct = Object.values(results).filter(v => v).length;
  const rate = done > 0 ? Math.round(correct / done * 100) : 0;

  let msg = '';
  if (rate >= 90) msg = '🎉 素晴らしい！この調子で本番も絶対合格できます！';
  else if (rate >= 70) msg = '👍 いい調子！苦手問題を確認してもう一周しましょう！';
  else if (rate >= 50) msg = '💪 まだまだ伸びしろあり！解説を読み込んで再チャレンジ！';
  else msg = '📖 基礎から整理して、また挑戦してみましょう！一緒に頑張ろう！';

  document.getElementById('main-content').innerHTML = `
    <div class="summary-card" style="animation:fadeIn 0.3s ease">
      <div class="summary-title">📋 結果サマリー</div>
      <div class="summary-score">${correct}<span> / ${done}問</span></div>
      <div class="summary-rate">正答率 ${rate}%</div>
      <div class="summary-msg">${msg}</div>
      <button class="btn btn-primary" onclick="resetQuiz()" style="margin-right:8px">🔄 最初からやり直す</button>
      <button class="btn btn-outline" onclick="reviewWrongs()">❌ 間違えた問題だけ復習</button>
    </div>`;
}

function reviewWrongs() {
  const wrongIdxs = Object.entries(results)
    .filter(([_, v]) => !v)
    .map(([k]) => parseInt(k));
  if (wrongIdxs.length === 0) {
    alert('間違えた問題はありません！全問正解です🎉');
    return;
  }
  order = wrongIdxs;
  currentIdx = 0;
  results = {};
  selectedMulti = [];
  answered = false;
  renderNavGrid();
  renderQuestion();
  updateProgress();
}

// 起動
init();
</script>
</body>
</html>
