<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST定期テスト対策｜呼吸・発声・発話系 前半 v2</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --border: #e2ddd6;
    --text: #2c2825;
    --sub: #7a7168;
    --accent: #3a6b8a;
    --accent-light: #e8f1f7;
    --correct: #2d7a4f;
    --correct-bg: #eaf5ef;
    --wrong: #c0392b;
    --wrong-bg: #fdf0ee;
    --star: #c8860a;
    --tag-bg: #eee9e1;
    --unit1: #3a6b8a;
    --unit2: #5a7a3a;
    --unit3: #7a4a8a;
    --unit4: #8a5a3a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ヘッダー */
  header {
    background: var(--accent);
    color: white;
    padding: 20px 24px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; }
  header p { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

  /* メイン */
  main { max-width: 780px; margin: 0 auto; padding: 20px 16px 80px; }

  /* スタートメニュー */
  #start-menu { }
  #start-menu h2 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border);
  }

  .category-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }

  .cat-btn {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
  }
  .cat-btn:hover { border-color: var(--accent); background: var(--accent-light); }
  .cat-btn .cat-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .cat-btn .cat-title { font-size: 0.9rem; font-weight: 700; }
  .cat-btn .cat-count { font-size: 0.72rem; color: var(--sub); margin-top: 4px; }
  .cat-btn[data-unit="1"] .cat-label { color: var(--unit1); }
  .cat-btn[data-unit="2"] .cat-label { color: var(--unit2); }
  .cat-btn[data-unit="3"] .cat-label { color: var(--unit3); }
  .cat-btn[data-unit="4"] .cat-label { color: var(--unit4); }

  .special-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 8px;
  }
  .special-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 14px 10px;
    cursor: pointer;
    text-align: center;
    font-size: 0.88rem;
    font-weight: 700;
    transition: opacity 0.15s;
  }
  .special-btn:hover { opacity: 0.85; }
  .special-btn.star-btn { background: var(--star); }

  /* 進捗バー */
  #progress-bar-wrap {
    display: none;
    margin-bottom: 16px;
  }
  #progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--sub);
    margin-bottom: 6px;
  }
  #progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s;
  }

  /* 問題カード */
  #quiz-area { display: none; }

  .q-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 22px 20px;
    margin-bottom: 14px;
    border: 1.5px solid var(--border);
  }

  .q-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .q-num {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: 0.05em;
  }
  .q-unit-tag {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--tag-bg);
    letter-spacing: 0.04em;
  }
  .q-unit-tag.u1 { background: #e8f1f7; color: var(--unit1); }
  .q-unit-tag.u2 { background: #edf3e8; color: var(--unit2); }
  .q-unit-tag.u3 { background: #f3eaf7; color: var(--unit3); }
  .q-unit-tag.u4 { background: #f7f0e8; color: var(--unit4); }
  .star-mark {
    font-size: 0.75rem;
    color: var(--star);
    font-weight: 700;
  }

  .q-text {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.7;
  }

  /* 記述欄 */
  .answer-input {
    width: 100%;
    min-height: 90px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.88rem;
    font-family: inherit;
    resize: vertical;
    background: var(--bg);
    transition: border-color 0.15s;
    line-height: 1.6;
  }
  .answer-input:focus { outline: none; border-color: var(--accent); background: white; }

  /* ボタン群 */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 700;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary { background: var(--tag-bg); color: var(--text); }
  .btn-secondary:hover { background: var(--border); }
  .btn-correct { background: var(--correct); color: white; }
  .btn-wrong { background: var(--wrong); color: white; }
  .btn-skip { background: transparent; color: var(--sub); border: 1.5px solid var(--border); }

  /* 解答表示 */
  .answer-reveal {
    display: none;
    margin-top: 16px;
    border-top: 1.5px solid var(--border);
    padding-top: 14px;
  }
  .answer-reveal.show { display: block; }
  .answer-label {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--sub);
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .answer-text {
    font-size: 0.9rem;
    line-height: 1.75;
    white-space: pre-wrap;
    color: var(--text);
  }
  .answer-text strong { color: var(--accent); }

  .result-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .badge-correct { background: var(--correct-bg); color: var(--correct); }
  .badge-wrong { background: var(--wrong-bg); color: var(--wrong); }

  /* スコア画面 */
  #score-screen {
    display: none;
    background: var(--surface);
    border-radius: 14px;
    padding: 32px 24px;
    text-align: center;
    border: 1.5px solid var(--border);
  }
  #score-screen h2 { font-size: 1.4rem; margin-bottom: 8px; }
  #score-num { font-size: 3rem; font-weight: 700; color: var(--accent); }
  #score-sub { font-size: 0.88rem; color: var(--sub); margin-top: 4px; margin-bottom: 24px; }
  #wrong-list { text-align: left; margin-top: 20px; }
  #wrong-list h3 { font-size: 0.85rem; font-weight: 700; color: var(--wrong); margin-bottom: 10px; }
  .wrong-item {
    font-size: 0.82rem;
    padding: 8px 10px;
    background: var(--wrong-bg);
    border-radius: 6px;
    margin-bottom: 6px;
    line-height: 1.5;
  }

  /* ナビゲーション */
  #nav-bar {
    display: none;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1.5px solid var(--border);
    padding: 10px 16px;
    display: none;
    gap: 8px;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #nav-bar.show { display: flex; }
  #nav-bar .btn { flex: 1; max-width: 160px; text-align: center; }

  /* モード切替 */
  .mode-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--tag-bg);
    border-radius: 10px;
    padding: 4px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: transparent;
    color: var(--sub);
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }

  /* 選択肢 */
  .choices-wrap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .choice-btn {
    width: 100%;
    text-align: left;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    font-size: 0.88rem;
    font-family: inherit;
    cursor: pointer;
    line-height: 1.5;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
  .choice-btn .choice-label {
    font-weight: 700;
    color: var(--accent);
    min-width: 20px;
  }
  .choice-btn.selected { border-color: var(--accent); background: var(--accent-light); }
  .choice-btn.correct-ans { border-color: var(--correct); background: var(--correct-bg); }
  .choice-btn.correct-ans .choice-label { color: var(--correct); }
  .choice-btn.wrong-ans { border-color: var(--wrong); background: var(--wrong-bg); }
  .choice-btn.wrong-ans .choice-label { color: var(--wrong); }
  .choice-btn:disabled { cursor: default; }

  /* ローディング */
  .loading-box {
    text-align: center;
    padding: 24px;
    color: var(--sub);
    font-size: 0.88rem;
  }
  .loading-spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .category-grid { grid-template-columns: 1fr; }
    .special-grid { grid-template-columns: 1fr; }
    .q-text { font-size: 0.88rem; }
  }
</style>
</head>
<body>

<header>
  <h1>呼吸・発声・発話系の構造・機能 ｜ 定期テスト対策</h1>
  <p>前半分（①②〜⑦）全111問｜記述・選択 切替可</p>
</header>

<main>

  <!-- スタートメニュー -->
  <div id="start-menu">
    <div class="mode-toggle" style="margin-bottom:16px;">
      <button class="mode-btn active" id="mode-btn-write" onclick="setMode('write')">✏️ 記述モード</button>
      <button class="mode-btn" id="mode-btn-choice" onclick="setMode('choice')">🔘 選択モード</button>
    </div>
    <h2>カテゴリーから選ぶ</h2>
    <div class="category-grid">
      <button class="cat-btn" data-unit="1" onclick="startQuiz('unit1')">
        <div class="cat-label">①② SESSION 1-2</div>
        <div class="cat-title">口腔・咽頭の構造と機能</div>
        <div class="cat-count">30問｜神経・口腔・唾液腺・咽頭・嚥下</div>
      </button>
      <button class="cat-btn" data-unit="2" onclick="startQuiz('unit2')">
        <div class="cat-label">③④ SESSION 3-4</div>
        <div class="cat-title">呼吸器系の解剖と機能・検査</div>
        <div class="cat-count">30問｜肺・気管・横隔膜・換気量・食道</div>
      </button>
      <button class="cat-btn" data-unit="3" onclick="startQuiz('unit3')">
        <div class="cat-label">⑤⑥ SESSION 5-6</div>
        <div class="cat-title">喉頭の構造と機能</div>
        <div class="cat-count">30問｜軟骨・内外喉頭筋・声帯・反回神経</div>
      </button>
      <button class="cat-btn" data-unit="4" onclick="startQuiz('unit4')">
        <div class="cat-label">⑦ SESSION 7</div>
        <div class="cat-title">発声のメカニズム・発声機能検査</div>
        <div class="cat-count">21問｜発声の仕組み・4大要素・声域・検査</div>
      </button>
    </div>

    <h2 style="margin-top:20px;">まとめて解く</h2>
    <div class="special-grid">
      <button class="special-btn" onclick="startQuiz('all')">全問（111問）</button>
      <button class="special-btn" onclick="startQuiz('random')">ランダム30問</button>
      <button class="special-btn star-btn" onclick="startQuiz('star')">★頻出のみ</button>
    </div>
  </div>

  <!-- 進捗バー -->
  <div id="progress-bar-wrap">
    <div id="progress-info">
      <span id="progress-text">1 / 30</span>
      <span id="progress-score">正解: 0</span>
    </div>
    <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  </div>

  <!-- 問題エリア -->
  <div id="quiz-area"></div>

  <!-- スコア画面 -->
  <div id="score-screen">
    <h2>お疲れさまでした！</h2>
    <div id="score-num">0 / 0</div>
    <div id="score-sub">正解率</div>
    <button class="btn btn-primary" onclick="showMenu()" style="margin-top:16px;">メニューに戻る</button>
    <div id="wrong-list"></div>
  </div>

</main>

<div id="nav-bar">
  <button class="btn btn-secondary" onclick="prevQ()">◀ 前へ</button>
  <button class="btn btn-primary" onclick="nextQ()">次へ ▶</button>
</div>

<script>
// =====================
// 問題データ
// =====================
const allQuestions = [
  // ===== ①② 口腔・咽頭 =====
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'筋肉の名称は「起始→停止」で命名される。起始と停止はそれぞれどのような部位か。',
   a:'起始＝動かない部位\n停止＝動く部位'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:true,
   q:'脳神経は全部で何対あるか。また第1〜第12脳神経の名称をすべて答えよ。',
   a:'12対\n第1：嗅神経　第2：視神経　第3：動眼神経　第4：滑車神経\n第5：三叉神経　第6：外転神経　第7：顔面神経　第8：聴（内耳）神経\n第9：舌咽神経　第10：迷走神経　第11：副神経　第12：舌下神経\n語呂：「かいでみる、うごくくるまのみつまたの、そとむくかおの、きくぜついん、まようふくぜっか」'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'脊椎の内訳（部位名と数）をすべて答えよ。',
   a:'頚椎：7個　胸椎：12個　腰椎：5個　合計：24個'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'口腔はどのような構造で囲まれており、何を境として咽頭と連絡しているか。',
   a:'囲む構造：舌・硬口蓋・頬粘膜\n境：口峡'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'乳歯・永久歯の本数をそれぞれ答えよ。',
   a:'乳歯：切歯2本×2・犬歯1本×2・臼歯2本×2　計20本\n永久歯：切歯2本×2・犬歯1本×2・小臼歯2本×2・大臼歯3本×2　計32本'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:true,
   q:'口蓋は前方と後方でそれぞれ何と呼ばれるか。その割合と組織の特徴も答えよ。',
   a:'前方2/3：硬口蓋（骨性部分）\n後方1/3：軟口蓋（厚い軟部組織）'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'軟口蓋の機能を2つ答えよ。またその運動と知覚はそれぞれ何神経が支配するか。',
   a:'機能：①嚥下時に口蓋垂が咽頭後壁にくっつき鼻咽腔を閉鎖する　②構音・嚥下・呼吸に関与\n運動：迷走神経\n知覚：舌咽神経'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:true,
   q:'舌乳頭の種類を4つ挙げ、そのうち味蕾を持たないものはどれか。',
   a:'有郭乳頭（舌根・味蕾あり）\n葉状乳頭（舌根・味蕾あり）\n茸状乳頭（舌背・味蕾あり）\n糸状乳頭（舌背・味蕾なし）\n★糸状乳頭以外はすべて味蕾を持つ'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'味覚の感知部位を答えよ。（塩味・甘味・苦味・酸味）',
   a:'塩味：舌前方外側\n甘味：舌尖部\n苦味：舌根部\n酸味：舌後方外側'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:true,
   q:'舌の味覚・知覚を支配する神経を部位別にすべて答えよ。',
   a:'舌前方2/3：味覚＝顔面神経の枝（鼓索神経）　知覚＝三叉神経第3枝\n舌後方1/3：味覚・知覚ともに舌咽神経'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'唾液腺の種類を大唾液腺・小唾液腺に分けて答えよ。',
   a:'大唾液腺：耳下腺・顎下腺・舌下腺\n小唾液腺：口唇・頬粘膜などに多数分布'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'唾液の作用を4つ答えよ。',
   a:'①消化作用（唾液中アミラーゼ）\n②口腔機能の維持・保護作用\n③口腔および全身の防御作用（唾液リゾチーム、s-IgA）\n④排泄内分泌作用'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:true,
   q:'耳下腺について、位置・唾液の性状・管の名称・開口部・支配神経・浅葉と深葉の区別をすべて答えよ。',
   a:'位置：口腔前下部・最大の大唾液腺\n唾液の性状：漿液性\n管の名称：耳下腺管（ステノン管）\n開口部：上顎第2大臼歯の頬粘膜\n支配神経：舌咽神経の枝（小錐体神経）\n浅葉・深葉：顔面神経が貫通・外側＝浅葉、内側＝深葉'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:true,
   q:'顎下腺について、唾液の性状・管の名称・開口部・支配神経をすべて答えよ。',
   a:'唾液の性状：漿液性・粘液性の混合性\n管の名称：顎下腺管（ワルトン管）\n開口部：口腔底前方の舌下小丘\n支配神経：顔面神経の枝（鼓索神経）'},
  {unit:'unit1', unitTag:'①② 口腔・咽頭', star:false,
   q:'舌下腺について、位置・唾液の性状・開口部・支配神経をすべて答えよ。',
   a:'位置：口腔底の顎下腺管付近\n唾液の性状：粘液性\n開口部：舌下小丘・舌下ヒダなど\n支配神経：顔面神経の枝（鼓索神経）'},

  // ===== ⑦ 発声のメカニズム =====
  {unit:'unit4', unitTag:'⑦ 発声', star:false,
   q:'発声の歴史的背景について、Ferrein・Garcia・Oertel・Hiranoの年代・業績を答えよ。',
   a:'1741年：Ferrein（フェラン、仏・解剖学者）＝摘出された喉頭による実験で発声中に声帯は弦として作用していることを示した\n1854年：Garcia（ガルシア、スペイン・声楽家）パリ大学声楽家教授＝喉頭鏡を発明し初めてヒトの生の声帯を観察した\n1878年：Oertel（エルテル、独・医師）＝「Laryngo-Stroboskop」により初めてヒトの声帯振動を観察\n1973年：Hirano（平野、日・医師）＝Double Structure Theory（Body & Cover Theory）を発表'},
  {unit:'unit4', unitTag:'⑦ 発声', star:true,
   q:'発声成立の主要条件を3つ挙げ、それぞれの内容を説明せよ。また声門下圧の発声必要最低圧と呼気流率の正常値も答えよ。',
   a:'①呼気流：呼気の空気力学的エネルギーが声帯振動という物理現象を惹起する。声門下圧（発声必要最低圧）＝4cmH₂O　呼気流率＝100〜200ml/sec\n②声帯振動：声門が閉鎖されていて隙間がない。左右の声帯の質量・緊張度の均衡が保たれている。声帯粘膜表面が柔らかい\n③共鳴腔：口腔・鼻腔・咽頭・喉頭の形態がよい'},
  {unit:'unit4', unitTag:'⑦ 発声', star:true,
   q:'発声のしくみについて「音源」と「声帯振動」を説明せよ。また喉頭原音とは何か。',
   a:'音源：喉頭筋の働きによって声帯を適度に閉鎖し呼気を吐くことにより閉じた声帯に振動が生じ気流が断続される。その結果疎密波を生じ音が発せられる。この音を喉頭原音という（「ブー」という音）\n声帯振動：呼気により声帯は下方から上方に吹き上げられるように振動し声帯の下縁（下唇）より左右の声帯が接する'},
  {unit:'unit4', unitTag:'⑦ 発声', star:true,
   q:'声帯の振動数を男女別に答えよ。また声帯振動の本態は何か。',
   a:'男性：毎秒100〜150回\n女性：毎秒200〜250回\nこの振動数がその人の声の高さになる\n声帯振動の本態：超高速度振動体'},
  {unit:'unit4', unitTag:'⑦ 発声', star:true,
   q:'声帯振動の一周期を順番に説明せよ。',
   a:'①両側声帯が内喉頭筋の作用で中央に寄せられ声門閉鎖が作られる\n②呼吸筋の作用で呼気流が送られる\n③声門下圧が4cmH₂Oを越えると声帯粘膜は上方に押し上げられ左右に押し開かれる\n④声帯粘膜の上部（上唇）はさらに外方に開大\n⑤下部（下唇）は復元力により内側に寄せられる\n⑥左右の声帯が衝突して再び声門閉鎖が起こる'},
  {unit:'unit4', unitTag:'⑦ 発声', star:true,
   q:'Bernoulli（ベルヌーイ）効果とは何か。発声における役割を説明せよ。',
   a:'声門がある程度狭くなると狭い部分での呼気流速が増大しその結果ベルヌーイ効果が生じて声帯縁が内方に引き寄せられる\n役割：より引きくっつきやすくし声門閉鎖を助ける'},
  {unit:'unit4', unitTag:'⑦ 発声', star:true,
   q:'発声を構成する4大要素と物理的指標（単位も含めて）を答えよ。',
   a:'声の高さ：基本周波数（Hz）\n声の強さ：音圧（dB）\n声の持続時間：呼気流量（ml/sec）\n声の性質：音色'},
  {unit:'unit4', unitTag:'⑦ 発声', star:true,

// アプリロジック
// =====================
let currentList = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let revealed = [];
let currentMode = 'write'; // 'write' or 'choice'
let choiceCache = {}; // index -> {choices, correctIndex}

function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-btn-write').classList.toggle('active', mode === 'write');
  document.getElementById('mode-btn-choice').classList.toggle('active', mode === 'choice');
}

function startQuiz(mode) {
  let list = [];
  if (mode === 'all') list = [...allQuestions];
  else if (mode === 'random') {
    const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
    list = shuffled.slice(0, 30);
  } else if (mode === 'star') {
    list = allQuestions.filter(q => q.star);
  } else {
    list = allQuestions.filter(q => q.unit === mode);
  }

  currentList = list;
  currentIndex = 0;
  correctCount = 0;
  wrongList = [];
  revealed = new Array(list.length).fill(false);
  choiceCache = {};

  document.getElementById('start-menu').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('progress-bar-wrap').style.display = 'block';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('nav-bar').classList.add('show');

  renderQuestion();
}

function renderQuestion() {
  const q = currentList[currentIndex];
  const total = currentList.length;
  const pct = ((currentIndex) / total * 100).toFixed(0);

  document.getElementById('progress-text').textContent = `${currentIndex + 1} / ${total}`;
  document.getElementById('progress-score').textContent = `正解: ${correctCount}`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const unitClass = q.unit === 'unit1' ? 'u1' : q.unit === 'unit2' ? 'u2' : q.unit === 'unit3' ? 'u3' : 'u4';
  const starHtml = q.star ? '<span class="star-mark">★ 頻出</span>' : '';

  const metaHtml = `
    <div class="q-meta">
      <span class="q-num">Q${currentIndex + 1}</span>
      <span class="q-unit-tag ${unitClass}">${q.unitTag}</span>
      ${starHtml}
    </div>
    <div class="q-text">${q.q}</div>`;

  if (currentMode === 'write') {
    renderWriteMode(q, metaHtml);
  } else {
    renderChoiceMode(q, metaHtml);
  }

  window.scrollTo(0, 0);
}

function renderWriteMode(q, metaHtml) {
  const savedAnswer = sessionStorage.getItem(`ans_${currentIndex}`) || '';
  const isRevealed = revealed[currentIndex];
  const savedResult = sessionStorage.getItem(`result_${currentIndex}`);

  let revealHtml = '';
  if (isRevealed) {
    const badgeClass = savedResult === 'correct' ? 'badge-correct' : 'badge-wrong';
    const badgeText = savedResult === 'correct' ? '✓ 正解' : '✗ 要復習';
    revealHtml = `
      <div class="answer-reveal show">
        <div class="result-badge ${badgeClass}">${badgeText}</div>
        <div class="answer-label">ANSWER</div>
        <div class="answer-text">${q.a.replace(/\n/g, '<br>')}</div>
      </div>`;
  }

  const btnHtml = isRevealed ? `
    <div class="btn-row">
      <button class="btn btn-correct" onclick="markResult('correct')">✓ 正解だった</button>
      <button class="btn btn-wrong" onclick="markResult('wrong')">✗ 要復習</button>
    </div>` : `
    <div class="btn-row">
      <button class="btn btn-primary" onclick="revealAnswer()">解答を見る</button>
      <button class="btn btn-skip" onclick="skipQ()">スキップ</button>
    </div>`;

  document.getElementById('quiz-area').innerHTML = `
    <div class="q-card">
      ${metaHtml}
      <textarea class="answer-input" id="user-answer" placeholder="ここに答えを書いてみましょう…">${savedAnswer}</textarea>
      ${btnHtml}
      ${revealHtml}
    </div>`;

  document.getElementById('user-answer')?.addEventListener('input', e => {
    sessionStorage.setItem(`ans_${currentIndex}`, e.target.value);
  });
}

function renderChoiceMode(q, metaHtml) {
  const isRevealed = revealed[currentIndex];

  if (isRevealed && choiceCache[currentIndex]) {
    // 結果表示
    const { choices, correctIndex, selectedIndex } = choiceCache[currentIndex];
    const savedResult = sessionStorage.getItem(`result_${currentIndex}`);
    const isCorrect = savedResult === 'correct';
    const labels = ['A', 'B', 'C', 'D', 'E'];

    let choicesHtml = choices.map((c, i) => {
      let cls = '';
      if (i === correctIndex) cls = 'correct-ans';
      else if (i === selectedIndex && i !== correctIndex) cls = 'wrong-ans';
      return `<button class="choice-btn ${cls}" disabled>
        <span class="choice-label">${labels[i]}</span>
        <span>${c.replace(/\n/g, '<br>')}</span>
      </button>`;
    }).join('');

    const badgeClass = isCorrect ? 'badge-correct' : 'badge-wrong';
    const badgeText = isCorrect ? '✓ 正解！' : '✗ 不正解';

    document.getElementById('quiz-area').innerHTML = `
      <div class="q-card">
        ${metaHtml}
        <div class="choices-wrap">${choicesHtml}</div>
        <div class="answer-reveal show">
          <div class="result-badge ${badgeClass}">${badgeText}</div>
          <div class="answer-label">ANSWER</div>
          <div class="answer-text">${q.a.replace(/\n/g, '<br>')}</div>
        </div>
        <div class="btn-row" style="margin-top:12px;">
          <button class="btn btn-primary" onclick="nextQ()">次の問題へ ▶</button>
        </div>
      </div>`;
    return;
  }

  if (choiceCache[currentIndex]) {
    // 選択肢生成済み・未回答
    showChoiceButtons(q, metaHtml, choiceCache[currentIndex].choices, choiceCache[currentIndex].correctIndex);
    return;
  }

  // 選択肢をAI生成
  document.getElementById('quiz-area').innerHTML = `
    <div class="q-card">
      ${metaHtml}
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <div>選択肢を生成中…</div>
      </div>
    </div>`;

  generateChoices(q).then(({ choices, correctIndex }) => {
    choiceCache[currentIndex] = { choices, correctIndex };
    showChoiceButtons(q, metaHtml, choices, correctIndex);
  }).catch(() => {
    // フォールバック：記述モードで表示
    document.getElementById('quiz-area').innerHTML = `
      <div class="q-card">
        ${metaHtml}
        <div style="color:var(--wrong);font-size:0.82rem;margin-bottom:8px;">選択肢の生成に失敗しました。記述モードで表示します。</div>
        <textarea class="answer-input" id="user-answer" placeholder="ここに答えを書いてみましょう…"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="revealAnswer()">解答を見る</button>
        </div>
      </div>`;
  });
}

function showChoiceButtons(q, metaHtml, choices, correctIndex) {
  const labels = ['A', 'B', 'C', 'D', 'E'];
  const choicesHtml = choices.map((c, i) => `
    <button class="choice-btn" onclick="selectChoice(${i}, ${correctIndex})">
      <span class="choice-label">${labels[i]}</span>
      <span>${c.replace(/\n/g, '<br>')}</span>
    </button>`).join('');

  document.getElementById('quiz-area').innerHTML = `
    <div class="q-card">
      ${metaHtml}
      <div class="choices-wrap">${choicesHtml}</div>
      <div class="btn-row">
        <button class="btn btn-skip" onclick="skipQ()">スキップ</button>
      </div>
    </div>`;
}

function selectChoice(selectedIndex, correctIndex) {
  const isCorrect = selectedIndex === correctIndex;
  if (isCorrect) correctCount++;
  else {
    if (!wrongList.includes(currentIndex)) wrongList.push(currentIndex);
  }

  choiceCache[currentIndex].selectedIndex = selectedIndex;
  sessionStorage.setItem(`result_${currentIndex}`, isCorrect ? 'correct' : 'wrong');
  revealed[currentIndex] = true;

  // 更新
  document.getElementById('progress-score').textContent = `正解: ${correctCount}`;
  const q = currentList[currentIndex];
  const unitClass = q.unit === 'unit1' ? 'u1' : q.unit === 'unit2' ? 'u2' : q.unit === 'unit3' ? 'u3' : 'u4';
  const starHtml = q.star ? '<span class="star-mark">★ 頻出</span>' : '';
  const metaHtml = `
    <div class="q-meta">
      <span class="q-num">Q${currentIndex + 1}</span>
      <span class="q-unit-tag ${unitClass}">${q.unitTag}</span>
      ${starHtml}
    </div>
    <div class="q-text">${q.q}</div>`;
  renderChoiceMode(q, metaHtml);
}

function generateChoices(q) {
  // グローバルインデックスから選択肢を取得
  const globalIndex = allQuestions.indexOf(q);
  if (globalIndex >= 0 && choicesDataAll[globalIndex]) {
    return Promise.resolve(choicesDataAll[globalIndex]);
  }
  // currentListのインデックスからも試みる
  const listIndex = currentList.indexOf(q);
  if (listIndex >= 0) {
    // allQuestionsで同じ問題を探す
    const ai = allQuestions.findIndex(aq => aq.q === q.q);
    if (ai >= 0 && choicesDataAll[ai]) {
      return Promise.resolve(choicesDataAll[ai]);
    }
  }
  return Promise.reject(new Error('選択肢データが見つかりません'));
}

function revealAnswer() {
  const ans = document.getElementById('user-answer')?.value || '';
  sessionStorage.setItem(`ans_${currentIndex}`, ans);
  revealed[currentIndex] = true;
  renderQuestion();
}

function markResult(result) {
  sessionStorage.setItem(`result_${currentIndex}`, result);
  if (result === 'correct') {
    correctCount++;
  } else {
    if (!wrongList.includes(currentIndex)) wrongList.push(currentIndex);
  }
  revealed[currentIndex] = true;
  document.getElementById('progress-score').textContent = `正解: ${correctCount}`;
  renderQuestion();
  setTimeout(() => nextQ(), 500);
}



function skipQ() {
  nextQ();
}

function nextQ() {
  const ua = document.getElementById('user-answer');
  if (ua) sessionStorage.setItem(`ans_${currentIndex}`, ua.value);
  if (currentIndex < currentList.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showScore();
  }
}

function prevQ() {
  const ua = document.getElementById('user-answer');
  if (ua) sessionStorage.setItem(`ans_${currentIndex}`, ua.value);
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
}

  const pct = total > 0 ? Math.round(correctCount / total * 100) : 0;
  document.getElementById('score-num').textContent = `${correctCount} / ${total}`;
  document.getElementById('score-sub').textContent = `正解率 ${pct}%`;

  let wrongHtml = '';
  if (wrongList.length > 0) {
    wrongHtml = '<h3>📝 要復習リスト</h3>';
    wrongList.forEach(i => {
      const q = currentList[i];
      wrongHtml += `<div class="wrong-item"><strong>Q${i+1}：</strong>${q.q}</div>`;
    });
  } else {
    wrongHtml = '<div style="text-align:center;color:var(--correct);font-weight:700;margin-top:16px;">全問正解！素晴らしい🎉</div>';
  }
  document.getElementById('wrong-list').innerHTML = wrongHtml;
}

function showMenu() {
  sessionStorage.clear();
  choiceCache = {};
  document.getElementById('start-menu').style.display = 'block';
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('progress-bar-wrap').style.display = 'none';
  document.getElementById('nav-bar').classList.remove('show');
}
</script>
</body>
</html>
