<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社会保障 第1・2回 ミニテスト対策</title>
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1C2530; --sub:#5B6773; --line:#DDE3E8;
  --accent:#2E4A7D; --accent-soft:#E6ECF7; --accent-ink:#FFFFFF;
  --star:#B26A00; --star-soft:#FFF1DA;
  --ok:#1E7A4F; --ok-soft:#E2F4EA; --ng:#B93A2E; --ng-soft:#FBE7E4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171C; --surface:#1B222A; --ink:#E8EDF2; --sub:#9AA7B4; --line:#2C3641;
    --accent:#8FB0E8; --accent-soft:#232F45; --accent-ink:#10161D;
    --star:#F0B35A; --star-soft:#3A2D14;
    --ok:#6FD0A0; --ok-soft:#173326; --ng:#F0877B; --ng-soft:#3A1E1B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7; font-size:16px;
  padding:0 0 calc(32px + env(safe-area-inset-bottom));
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.wrap{max-width:640px; margin:0 auto; padding:0 16px}

/* ---------- ヘッダー ---------- */
header{padding:calc(20px + env(safe-area-inset-top)) 0 12px}
header h1{margin:0; font-size:1.55rem; letter-spacing:.04em; line-height:1.3}
header p{margin:2px 0 0; color:var(--sub); font-size:.85rem}
.seg{display:flex; margin-top:14px; background:var(--line); border-radius:10px; padding:3px}
.seg button{flex:1; border:0; background:transparent; padding:9px 6px; border-radius:8px; font-weight:600; color:var(--sub)}
.seg button.on{background:var(--surface); color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg small{font-weight:400; margin-left:4px}

/* ---------- メニュー：単元 ---------- */
.sec-title{margin:22px 0 4px; font-size:1.15rem; font-weight:700}
.sec-note{margin:0 0 6px; color:var(--sub); font-size:.8rem}
.round{
  margin:18px 0 0; padding:7px 12px; font-size:.95rem; font-weight:700;
  background:var(--accent); color:var(--accent-ink); border-radius:8px 8px 0 0;
}
.cats{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px}
.cats li+li{border-top:1px solid var(--line)}
.cats button{
  width:100%; min-height:56px; text-align:left; background:transparent; border:0;
  padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-size:1.02rem; font-weight:600;
}
.cats button:active{background:var(--accent-soft)}
.cat-meta{display:flex; align-items:center; gap:8px; flex-shrink:0; color:var(--sub); font-size:.85rem; font-weight:400}
.wbadge{background:var(--ng-soft); color:var(--ng); border-radius:999px; padding:1px 9px; font-size:.75rem; font-weight:700}

/* ---------- メニュー：その他 ---------- */
.others{margin-top:28px}
.others h2{margin:0 0 8px; font-size:.9rem; color:var(--sub); font-weight:600}
.chips{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.chips button{
  border:1px solid var(--line); background:var(--surface); border-radius:10px;
  padding:9px 10px; text-align:left; min-height:52px; line-height:1.35;
}
.chips button b{display:block; font-size:.95rem}
.chips button span{font-size:.75rem; color:var(--sub)}
.chips button:disabled{opacity:.45; cursor:default}
.chips button.star b{color:var(--star)}
.chips button.rev b{color:var(--ng)}
.shuffle{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:.9rem; color:var(--sub)}
.shuffle input{width:20px; height:20px; accent-color:var(--accent)}

/* ---------- クイズ ---------- */
.screen{display:none}
.screen.on{display:block}
.qhead{display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.back{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:.9rem}
.qtitle{flex:1; font-weight:700; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qcount{font-size:.9rem; color:var(--sub); font-variant-numeric:tabular-nums}
.progress{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.progress div{height:100%; width:0; background:var(--accent); transition:width .25s}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 16px; margin-top:14px}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.tag{font-size:.75rem; padding:1px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600}
.tag.src{background:var(--bg); color:var(--sub); font-weight:400}
.tag.star{background:var(--star-soft); color:var(--star)}
.tag.chk{background:var(--ng-soft); color:var(--ng)}
.qtext{font-size:1.08rem; line-height:2; margin:0}
.blank{
  display:inline-block; min-width:4.2em; text-align:center; margin:0 .15em;
  border-bottom:2px solid var(--accent); color:var(--sub); font-size:.9em; padding:0 .2em;
}
.blank.filled{color:var(--accent); font-weight:700; background:var(--accent-soft); border-radius:4px 4px 0 0}
.btn-main{
  width:100%; min-height:54px; margin-top:16px; border:0; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1.05rem;
}
.judge{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.judge button{min-height:54px; border-radius:10px; border:2px solid; font-weight:700; font-size:1.02rem; background:var(--surface)}
.judge .j-ok{border-color:var(--ok); color:var(--ok)}
.judge .j-ng{border-color:var(--ng); color:var(--ng)}
.tfbtns{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.tfbtns button{
  min-height:84px; font-size:2.4rem; font-weight:700; border-radius:12px;
  border:2px solid var(--line); background:var(--surface);
}
.tfbtns .t-o{color:var(--ok)}
.tfbtns .t-x{color:var(--ng)}
.tfbtns button:disabled{cursor:default; opacity:.5}
.tfbtns button.chosen{opacity:1; border-color:currentColor}
.explain{margin-top:16px; padding:12px 14px; background:var(--bg); border-left:4px solid var(--accent); border-radius:0 8px 8px 0; font-size:.95rem}
.explain b{display:block; font-size:.8rem; color:var(--sub); margin-bottom:2px}
.verdict{margin-top:16px; font-weight:700; font-size:1.1rem}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.hide{display:none!important}

/* ---------- 結果 ---------- */
.score{text-align:center; padding:26px 0 6px}
.score .big{font-size:3.2rem; font-weight:800; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums}
.score .of{color:var(--sub)}
.score .msg{margin-top:6px; font-weight:700}
.rlist{margin:16px 0 0; padding:0; list-style:none}
.rlist li{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--ng); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:.92rem}
.rlist .ra{margin-top:4px; font-weight:700; color:var(--accent)}
.rlist .re{margin-top:4px; color:var(--sub); font-size:.85rem}
.ractions{display:grid; gap:10px; margin-top:18px}
.ractions button{min-height:52px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:600}
.ractions button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.ractions button:disabled{opacity:.45}
@media (prefers-reduced-motion: reduce){.progress div{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= メニュー ================= -->
<section id="s-menu" class="screen on">
  <header>
    <h1>社会保障</h1>
    <p>第1・2回 ミニテスト対策</p>
    <div class="seg" role="tablist">
      <button id="seg-fill" class="on" data-mode="fill">穴埋め<small id="n-fill"></small></button>
      <button id="seg-tf" data-mode="tf">○×<small id="n-tf"></small></button>
    </div>
  </header>

  <h2 class="sec-title">単元から選ぶ</h2>
  <p class="sec-note">タップするとその単元の問題がすぐ始まります</p>
  <div id="cat-area"></div>

  <div class="others">
    <h2>ほかの出題方法</h2>
    <div class="chips">
      <button id="o-all"><b>全問</b><span id="o-all-n"></span></button>
      <button id="o-rand"><b>ランダム10問</b><span>全単元から抽出</span></button>
      <button id="o-star" class="star"><b>★頻出</b><span id="o-star-n"></span></button>
      <button id="o-wrong" class="rev"><b>間違えた問題</b><span id="o-wrong-n"></span></button>
    </div>
    <label class="shuffle"><input type="checkbox" id="shuffle"> 出題順をシャッフルする</label>
  </div>
</section>

<!-- ================= クイズ ================= -->
<section id="s-quiz" class="screen">
  <div class="qhead">
    <button class="back" id="btn-back">← 戻る</button>
    <div class="qtitle" id="q-title"></div>
    <div class="qcount" id="q-count"></div>
  </div>
  <div class="progress"><div id="bar"></div></div>

  <div class="card">
    <div class="meta" id="q-meta"></div>
    <p class="qtext" id="q-text"></p>

    <div id="fill-actions">
      <button class="btn-main" id="btn-reveal">答えを見る</button>
      <div class="judge hide" id="judge">
        <button class="j-ng" id="btn-ng">✕ まだ</button>
        <button class="j-ok" id="btn-ok">○ 覚えた</button>
      </div>
    </div>

    <div id="tf-actions" class="hide">
      <div class="tfbtns">
        <button class="t-o" id="btn-o" aria-label="正しい">○</button>
        <button class="t-x" id="btn-x" aria-label="誤り">×</button>
      </div>
    </div>

    <div id="verdict" class="verdict hide"></div>
    <div id="explain" class="explain hide"></div>
    <button class="btn-main hide" id="btn-next">次へ</button>
  </div>
</section>

<!-- ================= 結果 ================= -->
<section id="s-result" class="screen">
  <div class="score">
    <div class="big" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="msg" id="r-msg"></div>
  </div>
  <ul class="rlist" id="r-list"></ul>
  <div class="ractions">
    <button class="primary" id="r-wrong">間違えた問題だけもう一度</button>
    <button id="r-again">同じ問題をもう一度</button>
    <button id="r-menu">単元メニューへ戻る</button>
  </div>
</section>

</div>

73", "type": "fill", "round": 2, "src": "障害等級表（2級）", "q": "2級の障害には、（　　　）の機能を欠くものが含まれる。", "a": "そしゃく", "exp": "そしゃく・嚥下の障害は2級が最上位。", "star": true, "cat": "障害年金", "check": false}, {"id": "f74", "type": "fill", "round": 2, "src": "障害等級表（2級）", "q": "2級の障害には、音声又は言語機能に（　　　）な障害を有するものが含まれる。", "a": "著しい", "exp": "音声又は言語機能の障害は2級が最上位。", "star": true, "cat": "障害年金", "check": false}, {"id": "f75", "type": "fill", "round": 2, "src": "障害等級表（3級）", "q": "3級（厚生年金のみ）の聴覚の障害は、両耳の聴力が、（　　　）センチメートル以上では通常の話声を解することができない程度のものである。", "a": "40", "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "f76", "type": "fill", "round": 2, "src": "障害等級表（3級）", "q": "3級の障害には、そしゃく又は（　　　）の機能に相当程度の障害を残すものが含まれる。", "a": "言語", "exp": "2級が「著しい」、3級が「相当程度」、障害手当金が「障害を残す」。", "star": true, "cat": "障害年金", "check": false}, {"id": "f77", "type": "fill", "round": 2, "src": "障害等級表（3級）", "q": "3級の障害には、精神若しくは神経系統に、労働が（　　　）制限を受けるものが含まれる。", "a": "著しい", "exp": "障害手当金は「労働が制限を受けるもの」。", "star": false, "cat": "障害年金", "check": false}], "tf": [{"id": "t1", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告は、疾病・老齢・失業等の事態に対して、社会保険や社会扶助による経済保障で対応することを内容に含む。", "a": true, "exp": "勧告の定義の前半。", "star": true, "cat": "社会保障の定義", "check": false}, {"id": "t2", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告は、最低限の生活保障とあわせて、公衆衛生および精神衛生の向上を図ることを内容としている。", "a": false, "exp": "正しくは「公衆衛生および社会福祉」。※精神衛生は、私の知る限り公衆衛生の一分野として整理されることが多く、迷いやすい隣接概念。レジュメの記載は「社会福祉」。", "star": false, "cat": "社会保障の定義", "check": true}, {"id": "t3", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告が示した定義は、現在の視点から見ると、制度の対象者もその目的もかなり限定されたものといえる。", "a": true, "exp": "最低限度の生活保障に重点があった。", "star": true, "cat": "社会保障の定義", "check": false}, {"id": "t4", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告が示した社会保障は、当時からすべての国民を対象にしていた。", "a": false, "exp": "すべての国民を対象にするのは現在の捉え方。", "star": false, "cat": "社会保障の定義", "check": false}, {"id": "t5", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "現在の社会保障制度は、すべての国民を対象にして、生活の安定を図る役割を果たしている。", "a": true, "exp": "", "star": true, "cat": "社会保障の定義", "check": false}, {"id": "t6", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "現代の社会保障は、個人の責任や自助努力で対応できる事態に対して、公的な給付を行うものである。", "a": false, "exp": "「対応できる」ではなく、個人の責任や自助努力では「対応し難い」事態。", "star": false, "cat": "社会保障の定義", "check": false}, {"id": "t7", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "社会保障の成立過程で最も重要な制度は、ドイツの社会保険である。", "a": false, "exp": "レジュメでは「イギリスの救貧法」とされている。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t8", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "イギリスでは、18世紀の前半から救貧を目的としたいくつかの法律が制定された。", "a": false, "exp": "16世紀の前半（エリザベス救貧法は1601年）。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t9", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法は1601年に施行され、200年以上存続した。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t10", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法では、救貧事業は国が一括して運営した。", "a": false, "exp": "教区単位で運営。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t11", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法では、貧民監督官が教区から救貧税を徴収して救貧事業を行った。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t12", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法の救貧事業の財源は、労使が拠出する保険料であった。", "a": false, "exp": "財源は教区から徴収する救貧税。保険料（拠出）はビスマルク以降。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t13", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "居宅保護（院外救済）は、ギルバート法による給付要件の緩和などで増加した。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t14", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "居宅保護の増加により支出が減少し、救貧税が引き下げられた。", "a": false, "exp": "支出が増大して救貧税が引き上げられ、新救貧法の契機となった。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t15", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "エリザベス救貧法は、1834年に大改正され、新救貧法と呼ばれた。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t16", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "新救貧法では、救貧行政は教区ごとに分散して行われた。", "a": false, "exp": "中央に救貧法委員会を置き、貧民処遇の一元化・中央集権化が図られた。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t17", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "新救貧法では、中央に救貧法委員会が設置された。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t18", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "新救貧法では、貧民を「自立労働者」と「労働能力がありながら救済を受ける貧民」に明確に区分した。", "a": true, "exp": "前者より後者の処遇を低くするのが劣等処遇。", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t19", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "社会保険制度を導入したのは、イギリスのウェッブ夫妻である。", "a": false, "exp": "導入したのはドイツのビスマルク。", "star": false, "cat": "ドイツの社会保険", "check": false}, {"id": "t20", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ビスマルクの社会保険は、今日の社会保障の先駆としての一面を持つ。", "a": true, "exp": "拠出原理に基づき権利として給付される。", "star": true, "cat": "ドイツの社会保険", "check": false}, {"id": "t21", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ビスマルクの社会保険は、救貧法と同じ原理に基づいて給付が行われた。", "a": false, "exp": "救貧法とは異なり、拠出原理に基づく権利としての給付。", "star": false, "cat": "ドイツの社会保険", "check": false}, {"id": "t22", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ビスマルクは、社会主義運動を弾圧する一方で、社会保険を導入した。", "a": true, "exp": "飴と鞭。", "star": true, "cat": "ドイツの社会保険", "check": false}, {"id": "t23", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ナショナル・ミニマムを強く主張したのは、ビスマルクである。", "a": false, "exp": "ウェッブ夫妻らの社会民主主義者。", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t24", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ウェッブ夫妻は、社会保障と最低賃金制等によるナショナル・ミニマムを強く主張した。", "a": true, "exp": "", "star": true, "cat": "ウェッブ夫妻", "check": false}, {"id": "t25", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "世界大恐慌では、失業保険給付だけでなく、大量失業そのものをなくすための根本的な政策が要請された。", "a": true, "exp": "", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t26", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "ケインズ理論は、公共事業の拡大などによる総需要の拡大を主張した。", "a": true, "exp": "", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t27", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "ニューディール政策は、F.ルーズベルト大統領の下でイギリスで行われた。", "a": false, "exp": "アメリカ。", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t28", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "1935年のアメリカの社会保障法は、「社会保障」という言葉が法律に用いられた最初といわれる。", "a": true, "exp": "", "star": true, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t29", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "第二次世界大戦は、社会保障を促す契機の一つになったといわれる。", "a": true, "exp": "", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t30", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "1950年代後半には、ナショナル・ミニマムの保障にとどまらず、よりゆとりのある生活を保障すべきだとの主張がなされた。", "a": true, "exp": "", "star": false, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t31", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "日本で社会保障あるいは社会政策が中央政府によって初めて導入されたのは、1922年の健康保険法である。", "a": false, "exp": "最初は1874年の恤救規則。健康保険法は1922年に制定（1927年施行）。", "star": false, "cat": "日本の社会保障の歴史", "check": false}, {"id": "t32", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "シドニー・ウェッブのナショナル・ミニマム論は、主にすべての社会成員を念頭に置いていた。", "a": false, "exp": "主に賃金労働者を念頭。すべての社会成員に広げたのはビアトリス。", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t33", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "シドニー・ウェッブがナショナル・ミニマム論を提唱したのは、1905年である。", "a": false, "exp": "1901年。1905年は救貧法委員会の設置とビアトリスの少数派報告。", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t34", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "ビアトリス・ウェッブは、年金等を含む保障を予防的（防貧的）に行うべきだと主張した。", "a": true, "exp": "", "star": true, "cat": "ウェッブ夫妻", "check": false}, {"id": "t35", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "ビアトリス・ウェッブは、すべての社会成員が健全な生活を送れるようにすべきだと主張した。", "a": true, "exp": "", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t36", "type": "tf", "round": 1, "src": "レジュメ5P", "q": "ベヴァリッジ報告は、イギリスの福祉国家の基となった。", "a": true, "exp": "", "star": true, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t37", "type": "tf", "round": 1, "src": "レジュメ5P", "q": "「ゆりかごから墓場まで」は、ビスマルクの社会保険を象徴する言葉である。", "a": false, "exp": "福祉国家イギリス（ベヴァリッジ報告）を象徴する言葉。", "star": false, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t38", "type": "tf", "round": 1, "src": "レジュメ5P", "q": "ベヴァリッジ報告は、戦中の1942年に発表された。", "a": true, "exp": "", "star": true, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t39", "type": "tf", "round": 1, "src": "レジュメ6P", "q": "恤救規則は、貧困は個人の責任によるものではないという考えに立っていた。", "a": false, "exp": "貧困は個人の責任とされ、惰民養成を招くという理由で、改正案も不成立に終わった。", "star": false, "cat": "日本の社会保障の歴史", "check": false}, {"id": "t40", "type": "tf", "round": 1, "src": "スライド（新救貧法）", "q": "新救貧法の院内救済の原則では、労働能力のある者に対するワークハウス以外での救済が禁じられた。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t41", "type": "tf", "round": 1, "src": "スライド（新救貧法）", "q": "新救貧法は、居宅保護を原則とした。", "a": false, "exp": "院内救済（ワークハウス内）が原則。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t42", "type": "tf", "round": 1, "src": "スライド（新救貧法）", "q": "新救貧法の劣等処遇の原則では、救済を受ける者の生活は、最下層の自立労働者以下とされた。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t43", "type": "tf", "round": 1, "src": "スライド（ビスマルク）", "q": "ビスマルクの社会保険は、強制加入による財源確保や給付保障によって、国民の不安を除去する機能も果たした。", "a": true, "exp": "", "star": false, "cat": "ドイツの社会保険", "check": false}, {"id": "t44", "type": "tf", "round": 1, "src": "スライド（ベヴァリッジ報告1）", "q": "ベヴァリッジ報告は、五つの巨人のうち無知が最悪であるとした。", "a": false, "exp": "最悪は困窮（貧困）。", "star": true, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t45", "type": "tf", "round": 1, "src": "スライド（ベヴァリッジ報告2）", "q": "ベヴァリッジ報告は、多子貧困発生阻止のため、児童手当の創設を提言した。", "a": true, "exp": "", "star": false, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t46", "type": "tf", "round": 1, "src": "スライド（恤救規則）", "q": "恤救規則は、中央政府によって導入された公的扶助制度である。", "a": true, "exp": "", "star": true, "cat": "日本の社会保障の歴史", "check": false}, {"id": "t47", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "公的年金は強制加入で、年金額の実質価値が維持される終身年金である。", "a": true, "exp": "", "star": true, "cat": "公的年金と私的年金", "check": false}, {"id": "t48", "type": "tf", "round": 2, "src": "レ const LS_KEY = 'shakaihosho_quiz01_wrong_v2';

let mode = 'fill';
let queue = [], idx = 0, results = [];
let lastItems = [], lastTitle = '';
let answered = false;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---- 間違えた問題の保存（localStorage。使えない環境でも動くよう try/catch） ---- */
function loadWrong(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; } }
function saveWrong(){ try { localStorage.setItem(LS_KEY, JSON.stringify(wrong)); } catch(e){} }
let wrong = loadWrong();

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function show(name){
  ['menu','quiz','result'].forEach(n => $('s-' + n).classList.toggle('on', n === name));
  window.scrollTo(0, 0);
}

/* ---- 穴埋め表示 ---- */
function parseAns(a){
  if (!/[①-⑤]/.test(a)) return [a.trim()];
  return a.split(/[\s　]*(?=[①-⑤])/).map(s => s.replace(/^[①-⑤]\s*/, '').trim()).filter(Boolean);
}
function fillHtml(q, reveal){
  const ans = parseAns(q.a);
  const CIRC = '①②③④⑤';
  let seq = 0;
  return esc(q.q).replace(/（[\s　]*([①-⑤]?)[\s　]*）/g, (m, n) => {
    let k;
    if (n) k = CIRC.indexOf(n); else k = seq++;
    const a = ans[Math.min(k, ans.length - 1)];
    return reveal
      ? '<span class="blank filled">' + (n ? n + ' ' : '') + esc(a) + '</span>'
      : '<span class="blank">' + (n || '　') + '</span>';
  });
}

/* ---- メニュー ---- */
function renderMenu(){
  const list = DATA[mode];
  $('seg-fill').classList.toggle('on', mode === 'fill');
  $('seg-tf').classList.toggle('on', mode === 'tf');
  $('n-fill').textContent = DATA.fill.length + '問';
  $('n-tf').textContent = DATA.tf.length + '問';

  const rounds = [...new Set(list.map(q => q.round))].sort((a, b) => a - b);
  let html = '';
  rounds.forEach(r => {
    const cats = [];
    list.filter(q => q.round === r).forEach(q => { if (!cats.includes(q.cat)) cats.push(q.cat); });
    html += '<h3 class="round">第' + r + '回</h3><ul class="cats">';
    cats.forEach(c => {
      const items = list.filter(q => q.round === r && q.cat === c);
      const w = items.filter(q => wrong[q.id]).length;
      html += '<li><button data-round="' + r + '" data-cat="' + esc(c) + '">'
            + '<span>' + esc(c) + '</span>'
            + '<span class="cat-meta">' + (w ? '<span class="wbadge">要復習 ' + w + '</span>' : '')
            + items.length + '問</span></button></li>';
    });
    html += '</ul>';
  });
  $('cat-area').innerHTML = html;

  const stars = list.filter(q => q.star), ws = list.filter(q => wrong[q.id]);
  $('o-all-n').textContent = list.length + '問';
  $('o-star-n').textContent = stars.length + '問';
  $('o-wrong-n').textContent = ws.length ? ws.length + '問' : 'まだありません';
  $('o-star').disabled = !stars.length;
  $('o-wrong').disabled = !ws.length;
}

/* ---- 開始 ---- */
function start(items, title, forceShuffle){
  if (!items.length) return;
  lastItems = items; lastTitle = title;
  queue = (forceShuffle || $('shuffle').checked) ? shuffle(items) : items.slice();
  idx = 0; results = [];
  show('quiz'); renderQ();
}

function renderQ(){
  const q = queue[idx];
  answered = false;
  $('q-title').textContent = lastTitle;
  $('q-count').textContent = (idx + 1) + ' / ' + queue.length;
  $('bar').style.width = (idx / queue.length * 100) + '%';
  $('q-meta').innerHTML = '<span class="tag">第' + q.round + '回・' + esc(q.cat) + '</span>'
    + (q.src ? '<span class="tag src">' + esc(q.src) + '</span>' : '')
    + (q.star ? '<span class="tag star">★頻出</span>' : '')
    + (q.check ? '<span class="tag chk">要確認</span>' : '');

  $('verdict').classList.add('hide');
  $('explain').classList.add('hide');
  $('btn-next').classList.add('hide');

  if (q.type === 'fill'){
    $('q-text').innerHTML = fillHtml(q, false);
    $('fill-actions').classList.remove('hide');
    $('tf-actions').classList.add('hide');
    $('btn-reveal').classList.remove('hide');
    $('judge').classList.add('hide');
  } else {
    $('q-text').textContent = q.q;
    $('fill-actions').classList.add('hide');
    $('tf-actions').classList.remove('hide');
    ['btn-o','btn-x'].forEach(id => { $(id).disabled = false; $(id).classList.remove('chosen'); });
  }
}

function showExplain(q){
  const e = $('explain');
  if (!q.exp){ e.classList.add('hide'); return; }
  e.innerHTML = '<b>解説</b>' + esc(q.exp);
  e.classList.remove('hide');
}

function record(q, ok){
  results[idx] = { q, ok };
  if (ok) delete wrong[q.id]; else wrong[q.id] = 1;
  saveWrong();
}

function advance(){
  idx++;
  if (idx >= queue.length) renderResult(); else { renderQ(); window.scrollTo(0, 0); }
}

/* 穴埋め */
$('btn-reveal').onclick = () => {
  const q = queue[idx];
  $('q-text').innerHTML = fillHtml(q, true);
  showExplain(q);
  $('btn-reveal').classList.add('hide');
  $('judge').classList.remove('hide');
};
$('btn-ok').onclick = () => { record(queue[idx], true); advance(); };
$('btn-ng').onclick = () => { record(queue[idx], false); advance(); };

/* ○× */
function answerTF(v){
  if (answered) return;
  answered = true;
  const q = queue[idx], ok = (v === q.a);
  record(q, ok);
  $('btn-o').disabled = true; $('btn-x').disabled = true;
  $(v ? 'btn-o' : 'btn-x').classList.add('chosen');
  const vd = $('verdict');
  vd.className = 'verdict ' + (ok ? 'ok' : 'ng');
  vd.textContent = (ok ? '正解' : '不正解') + '　答え：' + (q.a ? '○' : '×');
  showExplain(q);
  $('btn-next').textContent = (idx + 1 >= queue.length) ? '結果を見る' : '次へ';
  $('btn-next').classList.remove('hide');
}
$('btn-o').onclick = () => answerTF(true);
$('btn-x').onclick = () => answerTF(false);
$('btn-next').onclick = advance;

/* ---- 結果 ---- */
function renderResult(){
  show('result');
  const total = results.length, ok = results.filter(r => r.ok).length;
  const pct = Math.round(ok / total * 100);
  $('r-score').textContent = pct + '%';
  $('r-of').textContent = ok + ' / ' + total + '問';
  $('r-msg').textContent = pct === 100 ? '全問クリア！' : pct >= 80 ? 'あと少しです' : pct >= 60 ? '間違えた問題を重点的に' : 'もう一周して定着させましょう';

  const ng = results.filter(r => !r.ok);
  $('r-list').innerHTML = ng.map(r => {
    const q = r.q;
    const body = q.type === 'fill' ? fillHtml(q, true) : esc(q.q);
    const ans = q.type === 'fill' ? '' : '<div class="ra">答え：' + (q.a ? '○' : '×') + '</div>';
    return '<li>' + body + ans + (q.exp ? '<div class="re">' + esc(q.exp) + '</div>' : '') + '</li>';
  }).join('');
  $('r-wrong').disabled = !ng.length;
  $('r-wrong').textContent = ng.length ? '間違えた問題だけもう一度（' + ng.length + '問）' : '間違いなし！';
}
$('r-wrong').onclick = () => start(results.filter(r => !r.ok).map(r => r.q), '間違えた問題');
$('r-again').onclick = () => start(lastItems, lastTitle);
$('r-menu').onclick = goMenu;

function goMenu(){ renderMenu(); show('menu'); }
$('btn-back').onclick = goMenu;

/* ---- メニュー操作 ---- */
$('cat-area').addEventListener('click', e => {
  const b = e.target.closest('button[data-cat]');
  if (!b) return;
  const r = Number(b.dataset.round), c = b.dataset.cat;
  start(DATA[mode].filter(q => q.round === r && q.cat === c), c);
});
$('o-all').onclick  = () => start(DATA[mode], '全問');
$('o-rand').onclick = () => start(shuffle(DATA[mode]).slice(0, 10), 'ランダム10問', true);
$('o-star').onclick = () => start(DATA[mode].filter(q => q.star), '★頻出');
