<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社会保障 ミニテスト対策（第1〜7回）</title>
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#1C2530; --sub:#5B6773; --line:#DDE3E8;
  --accent:#2E4A7D; --accent-soft:#E6ECF7; --accent-ink:#FFFFFF;
  --star:#B26A00; --star-soft:#FFF1DA;
  --ok:#1E7A4F; --ok-soft:#E2F4EA; --ng:#B93A2E; --ng-soft:#FBE7E4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12171C; --surface:#1B222A; --ink:#E8EDF2; --sub:#9AA7B4; --line:#2C3641;
    --accent:#8FB0E8; --accent-soft:#232F45; --accent-ink:#10161D;
    --star:#F0B35A; --star-soft:#3A2D14;
    --ok:#6FD0A0; --ok-soft:#173326; --ng:#F0877B; --ng-soft:#3A1E1B;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7; font-size:16px;
  padding:0 0 calc(32px + env(safe-area-inset-bottom));
}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.wrap{max-width:640px; margin:0 auto; padding:0 16px}

/* ---------- ヘッダー ---------- */
header{padding:calc(20px + env(safe-area-inset-top)) 0 12px}
header h1{margin:0; font-size:1.55rem; letter-spacing:.04em; line-height:1.3}
header p{margin:2px 0 0; color:var(--sub); font-size:.85rem}
.seg{display:flex; margin-top:14px; background:var(--line); border-radius:10px; padding:3px}
.seg button{flex:1; border:0; background:transparent; padding:9px 6px; border-radius:8px; font-weight:600; color:var(--sub)}
.seg button.on{background:var(--surface); color:var(--accent); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg small{font-weight:400; margin-left:4px}

/* ---------- メニュー：単元 ---------- */
.sec-title{margin:22px 0 4px; font-size:1.15rem; font-weight:700}
.sec-note{margin:0 0 6px; color:var(--sub); font-size:.8rem}
.round{
  margin:18px 0 0; padding:7px 12px; font-size:.95rem; font-weight:700;
  background:var(--accent); color:var(--accent-ink); border-radius:8px 8px 0 0;
}
.cats{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-top:0; border-radius:0 0 8px 8px}
.cats li+li{border-top:1px solid var(--line)}
.cats button{
  width:100%; min-height:56px; text-align:left; background:transparent; border:0;
  padding:10px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  font-size:1.02rem; font-weight:600;
}
.cats button:active{background:var(--accent-soft)}
.cat-meta{display:flex; align-items:center; gap:8px; flex-shrink:0; color:var(--sub); font-size:.85rem; font-weight:400}
.wbadge{background:var(--ng-soft); color:var(--ng); border-radius:999px; padding:1px 9px; font-size:.75rem; font-weight:700}

/* ---------- メニュー：その他 ---------- */
.others{margin-top:28px}
.others h2{margin:0 0 8px; font-size:.9rem; color:var(--sub); font-weight:600}
.chips{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.chips button{
  border:1px solid var(--line); background:var(--surface); border-radius:10px;
  padding:9px 10px; text-align:left; min-height:52px; line-height:1.35;
}
.chips button b{display:block; font-size:.95rem}
.chips button span{font-size:.75rem; color:var(--sub)}
.chips button:disabled{opacity:.45; cursor:default}
.chips button.star b{color:var(--star)}
.chips button.rev b{color:var(--ng)}
.shuffle{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:.9rem; color:var(--sub)}
.shuffle input{width:20px; height:20px; accent-color:var(--accent)}

/* ---------- クイズ ---------- */
.screen{display:none}
.screen.on{display:block}
.qhead{display:flex; align-items:center; gap:10px; padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.back{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 12px; font-size:.9rem}
.qtitle{flex:1; font-weight:700; font-size:.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qcount{font-size:.9rem; color:var(--sub); font-variant-numeric:tabular-nums}
.progress{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.progress div{height:100%; width:0; background:var(--accent); transition:width .25s}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px 16px; margin-top:14px}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px}
.tag{font-size:.75rem; padding:1px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600}
.tag.src{background:var(--bg); color:var(--sub); font-weight:400}
.tag.star{background:var(--star-soft); color:var(--star)}
.tag.chk{background:var(--ng-soft); color:var(--ng)}
.qtext{font-size:1.08rem; line-height:2; margin:0}
.blank{
  display:inline-block; min-width:4.2em; text-align:center; margin:0 .15em;
  border-bottom:2px solid var(--accent); color:var(--sub); font-size:.9em; padding:0 .2em;
}
.blank.filled{color:var(--accent); font-weight:700; background:var(--accent-soft); border-radius:4px 4px 0 0}
.btn-main{
  width:100%; min-height:54px; margin-top:16px; border:0; border-radius:10px;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1.05rem;
}
.judge{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.judge button{min-height:54px; border-radius:10px; border:2px solid; font-weight:700; font-size:1.02rem; background:var(--surface)}
.judge .j-ok{border-color:var(--ok); color:var(--ok)}
.judge .j-ng{border-color:var(--ng); color:var(--ng)}
.tfbtns{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.tfbtns button{
  min-height:84px; font-size:2.4rem; font-weight:700; border-radius:12px;
  border:2px solid var(--line); background:var(--surface);
}
.tfbtns .t-o{color:var(--ok)}
.tfbtns .t-x{color:var(--ng)}
.tfbtns button:disabled{cursor:default; opacity:.5}
.tfbtns button.chosen{opacity:1; border-color:currentColor}
.explain{margin-top:16px; padding:12px 14px; background:var(--bg); border-left:4px solid var(--accent); border-radius:0 8px 8px 0; font-size:.95rem}
.explain b{display:block; font-size:.8rem; color:var(--sub); margin-bottom:2px}
.verdict{margin-top:16px; font-weight:700; font-size:1.1rem}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--ng)}
.hide{display:none!important}

/* ---------- 結果 ---------- */
.score{text-align:center; padding:26px 0 6px}
.score .big{font-size:3.2rem; font-weight:800; color:var(--accent); line-height:1.1; font-variant-numeric:tabular-nums}
.score .of{color:var(--sub)}
.score .msg{margin-top:6px; font-weight:700}
.rlist{margin:16px 0 0; padding:0; list-style:none}
.rlist li{background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--ng); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:.92rem}
.rlist .ra{margin-top:4px; font-weight:700; color:var(--accent)}
.rlist .re{margin-top:4px; color:var(--sub); font-size:.85rem}
.ractions{display:grid; gap:10px; margin-top:18px}
.ractions button{min-height:52px; border-radius:10px; border:1px solid var(--line); background:var(--surface); font-weight:600}
.ractions button.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.ractions button:disabled{opacity:.45}
@media (prefers-reduced-motion: reduce){.progress div{transition:none}}

.round{display:flex; align-items:center; justify-content:space-between}
.rall{border:1px solid rgba(255,255,255,.55); background:transparent; color:var(--accent-ink); border-radius:999px; padding:3px 12px; font-size:.78rem; font-weight:600; min-height:30px}
.rall:active{background:rgba(255,255,255,.2)}
.note{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); color:var(--ink)}
.note b{color:var(--star)}
.seg small{font-size:.7rem}
.seg button{padding:9px 2px}
.mix{display:block; font-size:.72rem; color:var(--sub); font-weight:400; line-height:1.3}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:16px}
.orow{display:flex; gap:6px; align-items:stretch}
.opt{flex:1; text-align:left; display:flex; gap:10px; align-items:flex-start; padding:12px; min-height:52px;
  background:var(--surface); border:1.5px solid var(--line); border-radius:10px; font-size:1rem}
.opt .n{flex:none; font-weight:700; color:var(--accent)}
.opt:active:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.opt.ng{border-color:var(--ng); background:var(--ng-soft)}
.orow.struck .opt .t{text-decoration:line-through; opacity:.45}
.elim{flex:none; width:44px; border:1px solid var(--line); background:var(--surface); border-radius:10px; color:var(--sub); font-size:1.1rem}
.orow.struck .elim{background:var(--ng-soft); color:var(--ng); border-color:var(--ng)}
.hint{font-size:.8rem; color:var(--sub); margin:10px 0 0}
</style>
</head>
<body>
<div class="wrap">

<!-- ================= メニュー ================= -->
<section id="s-menu" class="screen on">
  <header>
    <h1>社会保障</h1>
    <p>第1〜7回 ミニテスト対策</p>
    <div class="seg" role="tablist">
      <button id="seg-all" class="on" data-mode="all">すべて<small id="n-all"></small></button>
      <button id="seg-fill" data-mode="fill">穴埋め<small id="n-fill"></small></button>
      <button id="seg-tf" data-mode="tf">○×<small id="n-tf"></small></button>
      <button id="seg-mc" data-mode="mc">5択<small id="n-mc"></small></button>
    </div>
  </header>

  <h2 class="sec-title">単元から選ぶ</h2>
  <p class="sec-note">第1〜7回すべて。タップするとその単元の問題がすぐ始まります（上のボタンで形式を絞れます）</p>
  <div id="cat-area"></div>

  <div class="others">
    <h2>ほかの出題方法</h2>
    <div class="chips">
      <button id="o-all"><b>全問</b><span id="o-all-n"></span></button>
      <button id="o-rand"><b>ランダム10問</b><span>全単元から抽出</span></button>
      <button id="o-star" class="star"><b>★頻出</b><span id="o-star-n"></span></button>
      <button id="o-wrong" class="rev"><b>間違えた問題</b><span id="o-wrong-n"></span></button>
    </div>
    <label class="shuffle"><input type="checkbox" id="shuffle"> 出題順をシャッフルする</label>
  </div>
</section>

<!-- ================= クイズ ================= -->
<section id="s-quiz" class="screen">
  <div class="qhead">
    <button class="back" id="btn-back">← 戻る</button>
    <div class="qtitle" id="q-title"></div>
    <div class="qcount" id="q-count"></div>
  </div>
  <div class="progress"><div id="bar"></div></div>

  <div class="card">
    <div class="meta" id="q-meta"></div>
    <p class="qtext" id="q-text"></p>

    <div id="fill-actions">
      <button class="btn-main" id="btn-reveal">答えを見る</button>
      <div class="judge hide" id="judge">
        <button class="j-ng" id="btn-ng">✕ まだ</button>
        <button class="j-ok" id="btn-ok">○ 覚えた</button>
      </div>
    </div>

    <div id="tf-actions" class="hide">
      <div class="tfbtns">
        <button class="t-o" id="btn-o" aria-label="正しい">○</button>
        <button class="t-x" id="btn-x" aria-label="誤り">×</button>
      </div>
    </div>

    <div id="mc-actions" class="hide">
      <div class="opts" id="opts"></div>
      <p class="hint">右端の×で選択肢に取り消し線を引けます（消去法）。</p>
    </div>

    <div id="verdict" class="verdict hide"></div>
    <div id="explain" class="explain hide"></div>
    <button class="btn-main hide" id="btn-next">次へ</button>
  </div>
</section>

<!-- ================= 結果 ================= -->
<section id="s-result" class="screen">
  <div class="score">
    <div class="big" id="r-score"></div>
    <div class="of" id="r-of"></div>
    <div class="msg" id="r-msg"></div>
  </div>
  <ul class="rlist" id="r-list"></ul>
  <div class="ractions">
    <button class="primary" id="r-wrong">間違えた問題だけもう一度</button>
    <button id="r-again">同じ問題をもう一度</button>
    <button id="r-menu">単元メニューへ戻る</button>
  </div>
</section>

</div>

73", "type": "fill", "round": 2, "src": "障害等級表（2級）", "q": "2級の障害には、（　　　）の機能を欠くものが含まれる。", "a": "そしゃく", "exp": "そしゃく・嚥下の障害は2級が最上位。", "star": true, "cat": "障害年金", "check": false}, {"id": "f74", "type": "fill", "round": 2, "src": "障害等級表（2級）", "q": "2級の障害には、音声又は言語機能に（　　　）な障害を有するものが含まれる。", "a": "著しい", "exp": "音声又は言語機能の障害は2級が最上位。", "star": true, "cat": "障害年金", "check": false}, {"id": "f75", "type": "fill", "round": 2, "src": "障害等級表（3級）", "q": "3級（厚生年金のみ）の聴覚の障害は、両耳の聴力が、（　　　）センチメートル以上では通常の話声を解することができない程度のものである。", "a": "40", "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "f76", "type": "fill", "round": 2, "src": "障害等級表（3級）", "q": "3級の障害には、そしゃく又は（　　　）の機能に相当程度の障害を残すものが含まれる。", "a": "言語", "exp": "2級が「著しい」、3級が「相当程度」、障害手当金が「障害を残す」。", "star": true, "cat": "障害年金", "check": false}, {"id": "f77", "type": "fill", "round": 2, "src": "障害等級表（3級）", "q": "3級の障害には、精神若しくは神経系統に、労働が（　　　）制限を受けるものが含まれる。", "a": "著しい", "exp": "障害手当金は「労働が制限を受けるもの」。", "star": false, "cat": "障害年金", "check": false}], "tf": [{"id": "t1", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告は、疾病・老齢・失業等の事態に対して、社会保険や社会扶助による経済保障で対応することを内容に含む。", "a": true, "exp": "勧告の定義の前半。", "star": true, "cat": "社会保障の定義", "check": false}, {"id": "t2", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告は、最低限の生活保障とあわせて、公衆衛生および精神衛生の向上を図ることを内容としている。", "a": false, "exp": "正しくは「公衆衛生および社会福祉」。※精神衛生は、私の知る限り公衆衛生の一分野として整理されることが多く、迷いやすい隣接概念。レジュメの記載は「社会福祉」。", "star": false, "cat": "社会保障の定義", "check": true}, {"id": "t3", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告が示した定義は、現在の視点から見ると、制度の対象者もその目的もかなり限定されたものといえる。", "a": true, "exp": "最低限度の生活保障に重点があった。", "star": true, "cat": "社会保障の定義", "check": false}, {"id": "t4", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "1950年の勧告が示した社会保障は、当時からすべての国民を対象にしていた。", "a": false, "exp": "すべての国民を対象にするのは現在の捉え方。", "star": false, "cat": "社会保障の定義", "check": false}, {"id": "t5", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "現在の社会保障制度は、すべての国民を対象にして、生活の安定を図る役割を果たしている。", "a": true, "exp": "", "star": true, "cat": "社会保障の定義", "check": false}, {"id": "t6", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "現代の社会保障は、個人の責任や自助努力で対応できる事態に対して、公的な給付を行うものである。", "a": false, "exp": "「対応できる」ではなく、個人の責任や自助努力では「対応し難い」事態。", "star": false, "cat": "社会保障の定義", "check": false}, {"id": "t7", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "社会保障の成立過程で最も重要な制度は、ドイツの社会保険である。", "a": false, "exp": "レジュメでは「イギリスの救貧法」とされている。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t8", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "イギリスでは、18世紀の前半から救貧を目的としたいくつかの法律が制定された。", "a": false, "exp": "16世紀の前半（エリザベス救貧法は1601年）。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t9", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法は1601年に施行され、200年以上存続した。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t10", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法では、救貧事業は国が一括して運営した。", "a": false, "exp": "教区単位で運営。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t11", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法では、貧民監督官が教区から救貧税を徴収して救貧事業を行った。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t12", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "エリザベス救貧法の救貧事業の財源は、労使が拠出する保険料であった。", "a": false, "exp": "財源は教区から徴収する救貧税。保険料（拠出）はビスマルク以降。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t13", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "居宅保護（院外救済）は、ギルバート法による給付要件の緩和などで増加した。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t14", "type": "tf", "round": 1, "src": "レジュメ1P", "q": "居宅保護の増加により支出が減少し、救貧税が引き下げられた。", "a": false, "exp": "支出が増大して救貧税が引き上げられ、新救貧法の契機となった。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t15", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "エリザベス救貧法は、1834年に大改正され、新救貧法と呼ばれた。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t16", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "新救貧法では、救貧行政は教区ごとに分散して行われた。", "a": false, "exp": "中央に救貧法委員会を置き、貧民処遇の一元化・中央集権化が図られた。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t17", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "新救貧法では、中央に救貧法委員会が設置された。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t18", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "新救貧法では、貧民を「自立労働者」と「労働能力がありながら救済を受ける貧民」に明確に区分した。", "a": true, "exp": "前者より後者の処遇を低くするのが劣等処遇。", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t19", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "社会保険制度を導入したのは、イギリスのウェッブ夫妻である。", "a": false, "exp": "導入したのはドイツのビスマルク。", "star": false, "cat": "ドイツの社会保険", "check": false}, {"id": "t20", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ビスマルクの社会保険は、今日の社会保障の先駆としての一面を持つ。", "a": true, "exp": "拠出原理に基づき権利として給付される。", "star": true, "cat": "ドイツの社会保険", "check": false}, {"id": "t21", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ビスマルクの社会保険は、救貧法と同じ原理に基づいて給付が行われた。", "a": false, "exp": "救貧法とは異なり、拠出原理に基づく権利としての給付。", "star": false, "cat": "ドイツの社会保険", "check": false}, {"id": "t22", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ビスマルクは、社会主義運動を弾圧する一方で、社会保険を導入した。", "a": true, "exp": "飴と鞭。", "star": true, "cat": "ドイツの社会保険", "check": false}, {"id": "t23", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ナショナル・ミニマムを強く主張したのは、ビスマルクである。", "a": false, "exp": "ウェッブ夫妻らの社会民主主義者。", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t24", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "ウェッブ夫妻は、社会保障と最低賃金制等によるナショナル・ミニマムを強く主張した。", "a": true, "exp": "", "star": true, "cat": "ウェッブ夫妻", "check": false}, {"id": "t25", "type": "tf", "round": 1, "src": "レジュメ2P", "q": "世界大恐慌では、失業保険給付だけでなく、大量失業そのものをなくすための根本的な政策が要請された。", "a": true, "exp": "", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t26", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "ケインズ理論は、公共事業の拡大などによる総需要の拡大を主張した。", "a": true, "exp": "", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t27", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "ニューディール政策は、F.ルーズベルト大統領の下でイギリスで行われた。", "a": false, "exp": "アメリカ。", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t28", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "1935年のアメリカの社会保障法は、「社会保障」という言葉が法律に用いられた最初といわれる。", "a": true, "exp": "", "star": true, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t29", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "第二次世界大戦は、社会保障を促す契機の一つになったといわれる。", "a": true, "exp": "", "star": false, "cat": "世界大恐慌と大戦", "check": false}, {"id": "t30", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "1950年代後半には、ナショナル・ミニマムの保障にとどまらず、よりゆとりのある生活を保障すべきだとの主張がなされた。", "a": true, "exp": "", "star": false, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t31", "type": "tf", "round": 1, "src": "レジュメ3P", "q": "日本で社会保障あるいは社会政策が中央政府によって初めて導入されたのは、1922年の健康保険法である。", "a": false, "exp": "最初は1874年の恤救規則。健康保険法は1922年に制定（1927年施行）。", "star": false, "cat": "日本の社会保障の歴史", "check": false}, {"id": "t32", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "シドニー・ウェッブのナショナル・ミニマム論は、主にすべての社会成員を念頭に置いていた。", "a": false, "exp": "主に賃金労働者を念頭。すべての社会成員に広げたのはビアトリス。", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t33", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "シドニー・ウェッブがナショナル・ミニマム論を提唱したのは、1905年である。", "a": false, "exp": "1901年。1905年は救貧法委員会の設置とビアトリスの少数派報告。", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t34", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "ビアトリス・ウェッブは、年金等を含む保障を予防的（防貧的）に行うべきだと主張した。", "a": true, "exp": "", "star": true, "cat": "ウェッブ夫妻", "check": false}, {"id": "t35", "type": "tf", "round": 1, "src": "レジュメ4P", "q": "ビアトリス・ウェッブは、すべての社会成員が健全な生活を送れるようにすべきだと主張した。", "a": true, "exp": "", "star": false, "cat": "ウェッブ夫妻", "check": false}, {"id": "t36", "type": "tf", "round": 1, "src": "レジュメ5P", "q": "ベヴァリッジ報告は、イギリスの福祉国家の基となった。", "a": true, "exp": "", "star": true, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t37", "type": "tf", "round": 1, "src": "レジュメ5P", "q": "「ゆりかごから墓場まで」は、ビスマルクの社会保険を象徴する言葉である。", "a": false, "exp": "福祉国家イギリス（ベヴァリッジ報告）を象徴する言葉。", "star": false, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t38", "type": "tf", "round": 1, "src": "レジュメ5P", "q": "ベヴァリッジ報告は、戦中の1942年に発表された。", "a": true, "exp": "", "star": true, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t39", "type": "tf", "round": 1, "src": "レジュメ6P", "q": "恤救規則は、貧困は個人の責任によるものではないという考えに立っていた。", "a": false, "exp": "貧困は個人の責任とされ、惰民養成を招くという理由で、改正案も不成立に終わった。", "star": false, "cat": "日本の社会保障の歴史", "check": false}, {"id": "t40", "type": "tf", "round": 1, "src": "スライド（新救貧法）", "q": "新救貧法の院内救済の原則では、労働能力のある者に対するワークハウス以外での救済が禁じられた。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t41", "type": "tf", "round": 1, "src": "スライド（新救貧法）", "q": "新救貧法は、居宅保護を原則とした。", "a": false, "exp": "院内救済（ワークハウス内）が原則。", "star": false, "cat": "救貧法（イギリス）", "check": false}, {"id": "t42", "type": "tf", "round": 1, "src": "スライド（新救貧法）", "q": "新救貧法の劣等処遇の原則では、救済を受ける者の生活は、最下層の自立労働者以下とされた。", "a": true, "exp": "", "star": true, "cat": "救貧法（イギリス）", "check": false}, {"id": "t43", "type": "tf", "round": 1, "src": "スライド（ビスマルク）", "q": "ビスマルクの社会保険は、強制加入による財源確保や給付保障によって、国民の不安を除去する機能も果たした。", "a": true, "exp": "", "star": false, "cat": "ドイツの社会保険", "check": false}, {"id": "t44", "type": "tf", "round": 1, "src": "スライド（ベヴァリッジ報告1）", "q": "ベヴァリッジ報告は、五つの巨人のうち無知が最悪であるとした。", "a": false, "exp": "最悪は困窮（貧困）。", "star": true, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t45", "type": "tf", "round": 1, "src": "スライド（ベヴァリッジ報告2）", "q": "ベヴァリッジ報告は、多子貧困発生阻止のため、児童手当の創設を提言した。", "a": true, "exp": "", "star": false, "cat": "ベヴァリッジ報告と福祉国家", "check": false}, {"id": "t46", "type": "tf", "round": 1, "src": "スライド（恤救規則）", "q": "恤救規則は、中央政府によって導入された公的扶助制度である。", "a": true, "exp": "", "star": true, "cat": "日本の社会保障の歴史", "check": false}, {"id": "t47", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "公的年金は強制加入で、年金額の実質価値が維持される終身年金である。", "a": true, "exp": "", "star": true, "cat": "公的年金と私的年金", "check": false}, {"id": "t48", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "公的年金の財源は、本人の保険料のみで、国庫負担はない。", "a": false, "exp": "保険料のほか、運用収入、後世代の保険料、国庫負担（税金）。", "star": true, "cat": "公的年金と私的年金", "check": false}, {"id": "t49", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "企業年金は、企業が従業員の福利厚生の一環として実施するもので、事業主負担の比重が高い。", "a": true, "exp": "", "star": false, "cat": "公的年金と私的年金", "check": false}, {"id": "t50", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "私的年金は、年金額の価値維持が容易である。", "a": false, "exp": "価値維持が困難（物価変動に合わせられない）。", "star": false, "cat": "公的年金と私的年金", "check": false}, {"id": "t51", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "私的年金には、支給期間を一定期間に限った有期年金が多い。", "a": true, "exp": "", "star": false, "cat": "公的年金と私的年金", "check": false}, {"id": "t52", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "1961年に国民皆年金体制が成立した。", "a": true, "exp": "", "star": true, "cat": "制度体系", "check": false}, {"id": "t53", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "1985年の改正の結果、現役世代は全て厚生年金の被保険者となる。", "a": false, "exp": "現役世代は全て国民年金の被保険者。会社員・公務員等はさらに厚生年金に加入。", "star": false, "cat": "制度体系", "check": false}, {"id": "t54", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "賦課方式は、その時々の加入者の保険料により年金給付を賄う方式である。", "a": true, "exp": "", "star": true, "cat": "財政方式", "check": false}, {"id": "t55", "type": "tf", "round": 2, "src": "レジュメ1P", "q": "賦課方式では、現役世代が納めた保険料は、将来の自分の年金のために積み立てられる。", "a": false, "exp": "その時の年金受給者への支払いに充てられる（世代間扶養）。", "star": false, "cat": "財政方式", "check": false}, {"id": "t56", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "賦課方式では、少子高齢化が進んでも、保険料負担はほとんど影響を受けない。", "a": false, "exp": "後世代になるほど保険料負担が上昇し、少子高齢化が進む過程では特に大きな問題。", "star": false, "cat": "財政方式", "check": false}, {"id": "t57", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "積立方式は、金利変動の影響を受けやすい。", "a": true, "exp": "", "star": true, "cat": "財政方式", "check": false}, {"id": "t58", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "積立方式は、人口構成の変動の影響を受けやすい。", "a": false, "exp": "人口構成の変動の影響は受けにくい。受けやすいのは金利変動。", "star": false, "cat": "財政方式", "check": false}, {"id": "t59", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "積立方式では、想定を超えた賃金・物価の上昇があると、年金額の価値維持が困難になる。", "a": true, "exp": "", "star": false, "cat": "財政方式", "check": false}, {"id": "t60", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "第2号被保険者とは、国民年金のみに加入する自営業者等である。", "a": false, "exp": "第2号は厚生年金の被保険者。自営業者等は第1号。", "star": false, "cat": "被保険者の区分", "check": false}, {"id": "t61", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "第3号被保険者は、第2号被保険者の被扶養配偶者で、20歳以上60歳未満の者である。", "a": true, "exp": "", "star": true, "cat": "被保険者の区分", "check": false}, {"id": "t62", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "老齢基礎年金は、原則として10年の資格期間を満たした者が65歳に達したときに支給される。", "a": true, "exp": "", "star": true, "cat": "老齢年金", "check": false}, {"id": "t63", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "老齢基礎年金は、原則として25年の資格期間が必要である。", "a": false, "exp": "資料では10年。", "star": false, "cat": "老齢年金", "check": false}, {"id": "t64", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "老齢基礎年金の支給率は、65歳支給を基準として76〜184％である。", "a": true, "exp": "", "star": false, "cat": "老齢年金", "check": false}, {"id": "t65", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "老齢厚生年金は、老齢基礎年金の資格期間を満たしていなくても支給される。", "a": false, "exp": "老齢基礎年金の資格期間を満たした者に支給。", "star": false, "cat": "老齢年金", "check": false}, {"id": "t66", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "在職老齢年金では、老齢基礎年金の全部または一部が支給停止される。", "a": false, "exp": "支給停止の対象は老齢厚生年金。老齢基礎年金は在職中でも全額支給。", "star": true, "cat": "老齢年金", "check": false}, {"id": "t67", "type": "tf", "round": 2, "src": "レジュメ2P", "q": "在職者の年金と報酬の合計額が一定額を超える場合、老齢厚生年金の全部または一部が支給停止される。", "a": true, "exp": "", "star": true, "cat": "老齢年金", "check": false}, {"id": "t68", "type": "tf", "round": 2, "src": "レジュメ3P", "q": "初診日とは、障害の原因となった病気やけがについて、初めて医師または歯科医師の診療を受けた日をいう。", "a": true, "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "t69", "type": "tf", "round": 2, "src": "レジュメ3P", "q": "初診日とは、障害の程度を定める日をいう。", "a": false, "exp": "障害の程度を定める日は障害認定日。", "star": false, "cat": "障害年金", "check": false}, {"id": "t70", "type": "tf", "round": 2, "src": "レジュメ3P", "q": "障害基礎年金は、障害認定日に障害等級の1級または2級に該当する場合に支給される。", "a": true, "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "t71", "type": "tf", "round": 2, "src": "レジュメ3P", "q": "障害基礎年金には、3級の年金がある。", "a": false, "exp": "3級は厚生年金のみ。", "star": false, "cat": "障害年金", "check": false}, {"id": "t72", "type": "tf", "round": 2, "src": "レジュメ3P", "q": "障害厚生年金は、障害基礎年金に上乗せして支給される。", "a": true, "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "t73", "type": "tf", "round": 2, "src": "レジュメ3P", "q": "障害手当金は、厚生年金のみにある一時金である。", "a": true, "exp": "", "star": false, "cat": "障害年金", "check": false}, {"id": "t74", "type": "tf", "round": 2, "src": "レジュメ5P", "q": "1985年までの公的年金制度は、被保険者の職業に応じて分立していた。", "a": true, "exp": "", "star": false, "cat": "制度体系", "check": false}, {"id": "t75", "type": "tf", "round": 2, "src": "レジュメ5P", "q": "旧制度では、民間企業の常用労働者は国民年金に加入していた。", "a": false, "exp": "民間企業の常用労働者は厚生年金保険。国民年金は自営業者等。", "star": false, "cat": "制度体系", "check": false}, {"id": "t76", "type": "tf", "round": 2, "src": "レジュメ5P", "q": "旧制度では、国家公務員・地方公務員等は、各共済組合に加入していた。", "a": true, "exp": "", "star": false, "cat": "制度体系", "check": false}, {"id": "t77", "type": "tf", "round": 2, "src": "レジュメ5P", "q": "自営業者の減少や産業構造の変化等により、（旧）国民年金制度の維持が困難となることが予想された。", "a": true, "exp": "", "star": false, "cat": "制度体系", "check": false}, {"id": "t78", "type": "tf", "round": 2, "src": "レジュメ5P", "q": "全職業に共通の基礎年金は、厚生年金を改組して創設された。", "a": false, "exp": "国民年金を改組して創設。", "star": false, "cat": "制度体系", "check": false}, {"id": "t79", "type": "tf", "round": 2, "src": "レジュメ5P", "q": "厚生年金保険と共済年金は、基礎年金に上乗せされる、いわゆる二階建ての制度に再編された。", "a": true, "exp": "", "star": true, "cat": "制度体系", "check": false}, {"id": "t80", "type": "tf", "round": 2, "src": "レジュメ5P", "q": "旧制度では、専業主婦は自動的に自分の老齢年金の受給権を持っていた。", "a": false, "exp": "任意加入しない限り受給権を持たなかった。新制度の第3号被保険者で固有の受給権を取得。", "star": false, "cat": "制度体系", "check": false}, {"id": "t81", "type": "tf", "round": 2, "src": "スライド（国民年金）", "q": "被用者は、自動的に国民年金にも加入している。", "a": true, "exp": "", "star": true, "cat": "被保険者の区分", "check": false}, {"id": "t82", "type": "tf", "round": 2, "src": "スライド（初診日・障害認定日）", "q": "障害認定日は、初診日から起算して2年経過した日である。", "a": false, "exp": "1年6か月経過した日、またはそれ以内にその傷病が治った日。", "star": false, "cat": "障害年金", "check": false}, {"id": "t83", "type": "tf", "round": 2, "src": "スライド（財政方式）", "q": "現在の日本の公的年金は、賦課方式を基本としており、世代間扶養にあたる。", "a": true, "exp": "", "star": true, "cat": "財政方式", "check": false}, {"id": "t84", "type": "tf", "round": 2, "src": "障害等級表（1級・2級）", "q": "聴覚の障害で、1級は両耳の聴力レベルが100デシベル以上のものである。", "a": true, "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "t85", "type": "tf", "round": 2, "src": "障害等級表（1級・2級）", "q": "聴覚の障害で、2級は両耳の聴力レベルが100デシベル以上のものである。", "a": false, "exp": "2級は90デシベル以上。100デシベル以上は1級。", "star": false, "cat": "障害年金", "check": false}, {"id": "t86", "type": "tf", "round": 2, "src": "障害等級表（2級）", "q": "2級の障害には、そしゃくの機能を欠くものが含まれる。", "a": true, "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "t87", "type": "tf", "round": 2, "src": "障害等級表（2級）", "q": "2級の障害には、音声又は言語機能に相当程度の障害を有するものが含まれる。", "a": false, "exp": "2級は「著しい障害」。「相当程度」は3級。", "star": false, "cat": "障害年金", "check": false}, {"id": "t88", "type": "tf", "round": 2, "src": "障害等級表（3級）", "q": "3級の聴覚の障害は、両耳の聴力が、40センチメートル以上では通常の話声を解することができない程度のものである。", "a": true, "exp": "", "star": true, "cat": "障害年金", "check": false}, {"id": "t89", "type": "tf", "round": 2, "src": "障害等級表（3級）", "q": "3級の障害は、労働が制限を受ける程度のものである。", "a": false, "exp": "3級は「労働が著しい制限を受ける」程度。「労働が制限を受ける」は障害手当金。", "star": false, "cat": "障害年金", "check": false}, {"id": "t90", "type": "tf", "round": 2, "src": "障害等級表（3級）", "q": "3級の障害には、精神若しくは神経系統に、労働が著しい制限を受けるものが含まれる。", "a": true, "exp": "", "star": false, "cat": "障害年金", "check": false}], "mc": [{"id": "q1", "round": 3, "cat": "国民皆保険", "q": "わが国で国民皆保険が実現した年はどれか。", "opts": ["1946年", "1950年", "1958年", "1961年", "1973年"], "ans": 3, "exp": "1961年に国民皆年金とともに実現した（授業メモ）。1958年は新国民健康保険法の制定、1973年は福祉元年。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q2", "round": 3, "cat": "国民皆保険", "q": "国民皆保険の説明として正しいのはどれか。", "opts": ["国民すべてがいずれかの保険に加入する", "国民すべてが同一の保険制度に加入する", "希望する国民のみが保険に加入する", "労働者のみがいずれかの保険に加入する", "高齢者のみが公的保険に加入する"], "ans": 0, "exp": "制度は分かれているが、国民すべてがいずれかの医療保険に強制的に加入する。基本は「いつでも、どこでも、誰でも安心して医療を受けられる」こと。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q3", "round": 3, "cat": "国民皆保険", "q": "医療保険に一部負担が設けられている理由として挙げられるのはどれか。", "opts": ["診療報酬の引き下げ", "乱受診の防止", "医師の人材確保", "保険者の事務の簡素化", "医療機関の経営の安定"], "ans": 1, "exp": "病気になった人とならない人との公平性の確保、乱受診の防止、医療費増加に対する財政安定化のため。医療費のすべてが保障されるわけではない。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q4", "round": 3, "cat": "健康保険", "q": "協会けんぽが主な対象とする事業所はどれか。", "opts": ["主に大企業", "主に公務員の職場", "主に私立学校の法人", "主に自営業の事業所", "主に中小企業"], "ans": 4, "exp": "全国健康保険協会管掌健康保険（協会けんぽ）は主に民間の中小企業が対象。大企業は組合管掌健康保険（組合健保）。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q5", "round": 3, "cat": "健康保険", "q": "協会けんぽの保険料率の設定方法はどれか。", "opts": ["都道府県ごとに設定される", "全国一律で設定される", "市町村ごとに設定される", "事業所ごとに設定される", "加入者ごとに設定される"], "ans": 0, "exp": "都道府県ごとに、地域の医療費水準を反映して設定される（都道府県単位の財政運営）。組合健保は3〜13％の範囲で組合が自主的に決める。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q6", "round": 3, "cat": "健康保険", "q": "総合健保組合の設立に必要な、常時の従業員数はどれか。", "opts": ["常時おおむね2400人以上", "常時おおむね2600人以上", "常時おおむね2800人以上", "常時おおむね3000人以上", "常時おおむね3200人以上"], "ans": 3, "exp": "総合健保組合は常時3000人以上（同種・同業、または一定地域の企業）。単一健保組合は単独で常時おおむね700人以上。厚生労働大臣の認可が必要。", "star": false, "check": false, "note": "", "type": "mc"}, {"id": "q7", "round": 3, "cat": "健康保険", "q": "組合健保が行うことのできる給付はどれか。", "opts": ["診療報酬点数の独自の設定", "法定給付に上乗せする附加給付", "自己負担割合の独自の設定", "被扶養者の範囲の独自の拡大", "保険診療の独自の対象拡大"], "ans": 1, "exp": "一部負担の還元、家族療養費、手当金について、法定給付のほかに附加給付を行える。保険料率や事業主の負担割合も法律の範囲内で自主的に決められる。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q8", "round": 3, "cat": "健康保険", "q": "同一世帯の被扶養者の認定基準はどれか。", "opts": ["年収130万円未満かつ被保険者と同額未満", "年収120万円未満かつ被保険者の半分未満", "年収140万円未満かつ被保険者の半分未満", "年収130万円未満かつ被保険者の4分の3未満", "年収130万円未満かつ被保険者の半分未満"], "ans": 4, "exp": "対象者が被保険者と同一世帯の場合は、年収130万円未満かつ被保険者の年収の半分未満。別世帯は、130万円未満かつ被保険者からの仕送額より少ないこと。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q9", "round": 3, "cat": "健康保険", "q": "60歳以上または障害者の場合の、被扶養者の年収の基準はどれか。", "opts": ["年収170万円未満", "年収180万円未満", "年収190万円未満", "年収200万円未満", "年収210万円未満"], "ans": 1, "exp": "60歳以上または障害者は180万円未満。年収には年金なども含まれる。19歳以上23歳未満は令和7年10月から150万円未満。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q10", "round": 3, "cat": "健康保険", "q": "月々の健康保険料の算定の基礎となるものはどれか。", "opts": ["報酬月額", "平均標準報酬月額", "標準賞与額", "基本給のみの額", "標準報酬月額"], "ans": 4, "exp": "報酬を区切りのよい幅で区分した標準報酬月額（第1級5万8000円〜第50級139万円）に保険料率を乗じる。平均標準報酬月額は厚生年金の年金額算出の基礎。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q11", "round": 3, "cat": "健康保険", "q": "総報酬制で、保険料の対象に加わるものはどれか。", "opts": ["賞与・期末手当", "結婚祝金", "見舞金", "退職金", "出張旅費の実費"], "ans": 0, "exp": "賞与・期末手当等にも、標準報酬月額と同じ保険料率で保険料がかかる（標準賞与額は年度累計573万円が上限）。見舞金や結婚祝金は臨時的な報酬で除かれる。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q12", "round": 3, "cat": "国民健康保険", "q": "国民健康保険の保険者はどれか。", "opts": ["市町村と健康保険組合", "市町村と国民健康保険組合", "都道府県と全国健康保険協会", "全国健康保険協会と国保組合", "市町村と後期高齢者医療広域連合"], "ans": 1, "exp": "市町村（特別区を含む）と国民健康保険組合。市町村が保険者＝市町村国保、国保組合が保険者＝国保組合。2018年4月からは都道府県も共同保険者。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q13", "round": 3, "cat": "国民健康保険", "q": "2018年度から国民健康保険の財政運営の責任主体となったのはどれか。", "opts": ["都道府県", "市町村", "国", "全国健康保険協会", "国民健康保険団体連合会"], "ans": 0, "exp": "2015年成立の法律により、2018年度から財政運営の責任主体が市町村から都道府県に移行。市町村は資格の取得・喪失、保険料の徴収、保健事業等を担う。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q14", "round": 3, "cat": "国民健康保険", "q": "国民健康保険組合は、同種の事業・業務に従事する何人以上で組織されるか。", "opts": ["260人以上", "280人以上", "300人以上", "320人以上", "340人以上"], "ans": 2, "exp": "同種の事業・業務に従事する300人以上で組織。医師・歯科医師・薬剤師・弁護士・理容美容業・土木建築業などがある。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q15", "round": 3, "cat": "国民健康保険", "q": "国民健康保険の保険料の納付義務者はどれか。", "opts": ["被保険者本人", "世帯主", "世帯の最年長者", "事業主", "世帯の扶養者"], "ans": 1, "exp": "加入者がいる世帯の世帯主が負担する。世帯主本人が加入者でなくても、家族に加入者がいれば納付義務者になる。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q16", "round": 3, "cat": "国民健康保険", "q": "国民健康保険料の資産割は、何に応じて算定されるか。", "opts": ["収入の額", "加入者一人当たりの定額", "一世帯当たりの定額", "預貯金の額", "固定資産税の額"], "ans": 4, "exp": "所得割（収入に応じて）、資産割（固定資産税に応じて）、被保険者均等割（一人当たり定額）、世帯別平等割（一世帯当たり定額）の組合せで賦課される。", "star": false, "check": false, "note": "", "type": "mc"}, {"id": "q17", "round": 3, "cat": "国民健康保険", "q": "国民健康保険に投入される国庫負担は、給付費のおよそ何％か。", "opts": ["41％", "43％", "45％", "47％", "49％"], "ans": 0, "exp": "給付費の41％の国庫負担が投入される。2018年度の移行後も、都道府県に対して給付費の41％が支出される。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q18", "round": 3, "cat": "診療報酬", "q": "診療報酬を決定するのは誰か。", "opts": ["厚生労働大臣", "中央社会保険医療協議会", "社会保険診療報酬支払基金", "全国健康保険協会", "都道府県知事"], "ans": 0, "exp": "厚生労働大臣が、中央社会保険医療協議会（中医協）の議論を踏まえて決定する（厚生労働大臣告示）。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q19", "round": 3, "cat": "診療報酬", "q": "診療報酬の計算方法はどれか。", "opts": ["包括払い制", "定額払い制", "出来高払い制", "人頭払い制", "成功報酬制"], "ans": 2, "exp": "実施した医療行為ごとに各項目の点数を加え、1点＝10円で計算する。点数表は医科・歯科・調剤の3種類。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q20", "round": 3, "cat": "診療報酬", "q": "診療報酬の請求を審査し、支払う機関はどれか。", "opts": ["中央社会保険医療協議会", "後期高齢者医療広域連合", "全国健康保険協会", "健康保険組合連合会", "社会保険診療報酬支払基金"], "ans": 4, "exp": "審査支払機関は、社会保険診療報酬支払基金と国民健康保険団体連合会。保険医療機関は診療報酬を請求し、一部負担分を差し引いた額の支払いを受ける。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q21", "round": 3, "cat": "自己負担", "q": "現役並み所得者に当たる、課税所得の基準はどれか。", "opts": ["課税所得125万円以上", "課税所得135万円以上", "課税所得145万円以上", "課税所得155万円以上", "課税所得165万円以上"], "ans": 2, "exp": "課税所得145万円以上で窓口負担が3割。75歳以上の2割判定は、課税所得28万円以上かつ年金収入等が単身200万円以上・複数320万円以上。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q22", "round": 4, "cat": "高齢者医療制度", "q": "老人保健制度が創設された年はどれか。", "opts": ["1973年", "1978年", "1983年", "1989年", "1997年"], "ans": 2, "exp": "老人保健制度は1983年創設。市町村が実施主体で、各医療保険者からの拠出金と公費が財源だった。", "star": false, "check": false, "note": "", "type": "mc"}, {"id": "q23", "round": 4, "cat": "高齢者医療制度", "q": "後期高齢者医療制度が施行された年はどれか。", "opts": ["2000年", "2004年", "2006年", "2007年", "2008年"], "ans": 4, "exp": "2006年の健康保険法等の改正で創設され、2008年4月に施行。後期高齢者医療制度の成立により老人保健制度は廃止。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q24", "round": 4, "cat": "高齢者医療制度", "q": "後期高齢者医療制度の保険者はどれか。", "opts": ["市町村", "後期高齢者医療広域連合", "都道府県", "全国健康保険協会", "国民健康保険団体連合会"], "ans": 1, "exp": "都道府県の区域ごとにすべての市町村が加入する広域連合が保険者。保険料の徴収や窓口業務は市町村が行う。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q25", "round": 4, "cat": "高齢者医療制度", "q": "後期高齢者医療制度で、保険料の徴収と窓口業務を行うのはどれか。", "opts": ["後期高齢者医療広域連合", "都道府県", "社会保険診療報酬支払基金", "市町村", "地域包括支援センター"], "ans": 3, "exp": "広域連合は主に制度の運営、市町村は主に窓口業務と保険料の徴収を行う。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q26", "round": 4, "cat": "高齢者医療制度", "q": "後期高齢者医療制度の被保険者はどれか。", "opts": ["70歳以上と一定の障害のある65歳以上70歳未満", "75歳以上と一定の障害のある60歳以上75歳未満", "65歳以上と一定の障害のある40歳以上65歳未満", "75歳以上と一定の障害のある65歳以上75歳未満", "75歳以上の医療保険の被扶養者を除く者"], "ans": 3, "exp": "広域連合内に住所のある75歳以上の高齢者と、65歳以上75歳未満で一定の障害の状態にある人（申請が必要）。従来の老人保健制度と異なり、各医療保険の被保険者・被扶養者から除かれる。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q27", "round": 4, "cat": "高齢者医療制度", "q": "後期高齢者医療の費用負担（自己負担を除く）で、現役世代の支援金は約何割か。", "opts": ["約4割", "約1割", "約2割", "約3割", "約5割"], "ans": 0, "exp": "保険料（約1割）、公費（約5割）、現役世代からの後期高齢者支援金（約4割）。若者が給付費の4割、高齢者が1割（スライド）。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q28", "round": 4, "cat": "高齢者医療制度", "q": "後期高齢者医療の公費負担の内訳（国：都道府県：市町村）はどれか。", "opts": ["2：1：1", "4：1：1", "3：1：1", "4：2：1", "5：2：1"], "ans": 1, "exp": "公費は約5割で、内訳は国：都道府県：市町村＝4：1：1。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q29", "round": 4, "cat": "高齢者医療制度", "q": "前期高齢者医療制度で、保険者間の負担の不均衡を調整する方法はどれか。", "opts": ["各保険者の保険料収入に応じた費用負担", "各保険者の医療費総額に応じた費用負担", "国庫負担による全額の補填", "前期高齢者の一つの保険者への集約", "各保険者の75歳未満の加入者数に応 ype": "mc"}, {"id": "q58", "round": 5, "cat": "認定・ケアプラン", "q": "介護サービス計画の作成費用の利用者負担はどれか。", "opts": ["利用者の自己負担はない", "利用者が1割を負担する", "利用者が2割を負担する", "利用者が半額を負担する", "利用者が全額を負担する"], "ans": 0, "exp": "計画作成費用は全額が保険給付の対象。利用者は自己負担なしで作成してもらえる。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q59", "round": 5, "cat": "給付・財源", "q": "介護保険の保険給付費の財源構成（公費：保険料）はどれか。", "opts": ["公費60％：保険料40％", "公費40％：保険料60％", "公費45％：保険料55％", "公費50％：保険料50％", "公費55％：保険料45％"], "ans": 3, "exp": "公費（税財源）50％、保険料50％。保険料は第1号23％・第2号27％（令和2年度予算の資料）。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q60", "round": 5, "cat": "給付・財源", "q": "特別養護老人ホームの入所は、原則として要介護何以上か。", "opts": ["要介護1以上", "要介護2以上", "要介護3以上", "要介護4以上", "要介護5のみ"], "ans": 2, "exp": "介護老人福祉施設（特別養護老人ホーム）の利用は原則として要介護3以上に限られる。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q61", "round": 5, "cat": "給付・財源", "q": "市町村が条例で独自に定める保険給付はどれか。", "opts": ["介護給付", "予防給付", "附加給付", "市町村特別給付", "地域支援事業"], "ans": 3, "exp": "市町村特別給付（横出しサービス）。移送・配食・寝具乾燥・理美容など。附加給付は医療保険の用語。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q62", "round": 5, "cat": "施設・サービス", "q": "介護保険の施設サービスを提供する施設はどれか。", "opts": ["養護老人ホーム", "軽費老人ホーム", "介護老人保健施設", "有料老人ホーム", "サービス付き高齢者向け住宅"], "ans": 2, "exp": "介護老人福祉施設（特養）、介護老人保健施設、介護医療院が介護保険の施設。後ろの4つは介護保険の施設サービスではない。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q63", "round": 5, "cat": "施設・サービス", "q": "介護保険で、市町村が事業者の指定・監督を行うサービスはどれか。", "opts": ["地域密着型介護サービス", "居宅サービス", "施設サービス", "訪問看護", "福祉用具貸与"], "ans": 0, "exp": "地域密着型介護サービスは市町村が指定・監督。居宅サービスや施設サービスは都道府県（政令市・中核市を含む）が指定・監督する。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q64", "round": 5, "cat": "施設・サービス", "q": "定期巡回・随時対応型訪問介護看護の対象者はどれか。", "opts": ["要支援者のみ", "要介護者のみ", "要介護者と要支援者", "65歳以上の全員", "第2号被保険者のみ"], "ans": 1, "exp": "地域密着型サービスの一類型で、対象は要介護者のみ。介護予防サービスは規定されていない。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q65", "round": 5, "cat": "地域包括ケア", "q": "地域包括支援センターに配置される専門職の組合せはどれか。", "opts": ["医師・看護師・介護福祉士", "保健師・理学療法士・栄養士", "社会福祉士・言語聴覚士・薬剤師", "看護師・作業療法士・保育士", "保健師・社会福祉士・主任ケアマネジャー"], "ans": 4, "exp": "保健師（または地域保健に経験のある看護師）、社会福祉士、主任介護支援専門員が配置される。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q66", "round": 5, "cat": "地域包括ケア", "q": "地域包括支援センターの機能に含まれるのはどれか。", "opts": ["権利擁護", "要介護認定の審査・判定", "介護保険料の算定", "サービス事業者の指定", "診療報酬の審査"], "ans": 0, "exp": "4つの機能：総合相談支援、権利擁護、包括的・継続的ケアマネジメント支援、介護予防ケアマネジメント。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q67", "round": 5, "cat": "地域包括ケア", "q": "令和8年の改正で廃止されることになった、介護支援専門員の仕組みはどれか。", "opts": ["実務経験の要件", "都道府県知事への登録", "実務研修受講試験", "5年ごとの更新制", "介護支援専門員名簿の作成"], "ans": 3, "exp": "更新制は廃止され、研修は柔軟に受講できるよう見直し。施行は公布後1年6月以内に政令で定める日。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q68", "round": 5, "cat": "成年後見", "q": "判断能力が最も低い人が対象となる法定後見の類型はどれか。", "opts": ["保佐", "後見", "補助", "任意後見", "未成年後見"], "ans": 1, "exp": "重い順に後見（重度）・保佐（中度）・補助（軽度）。任意後見は法定後見ではない。未成年後見は未成年者を保護する別の制度。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q69", "round": 5, "cat": "成年後見", "q": "任意後見の事務が実際に開始されるのはいつか。", "opts": ["任意後見契約を締結した時点", "公正証書を作成した時点", "任意後見監督人が選任された時点", "本人が65歳に達した時点", "家庭裁判所に契約を届け出た時点"], "ans": 2, "exp": "本人の判断能力が不十分になった後、家庭裁判所が任意後見監督人を選任した時点で開始する。契約は公正証書で締結する。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q70", "round": 5, "cat": "成年後見", "q": "法定後見と比べた、任意後見の特徴はどれか。", "opts": ["本人が結んだ契約を取り消せる", "家庭裁判所が代理権の範囲を定める", "監督人が選任されない場合がある", "市町村長が開始の申立てを行える", "本人が結んだ契約を取り消せない"], "ans": 4, "exp": "任意後見人は契約で定めた範囲内で代理できるが、本人が結んだ契約の取消権はない。監督人は全件で選任される。", "star": true, "check": false, "note": "", "type": "mc"}, {"id": "q71", "round": 6, "cat": "生活保護", "q": "生活保護法が、その理念の根拠としている日本国憲法の条文はどれか。", "opts": ["第13条（幸福追求権）", "第14条（法の下の平等）", "第25条（生存権）", "第27条（勤労の権利）", "第29条（財産権）"], "ans": 2, "exp": "生活保護法第1条は憲法第25条の理念に基づく。戦前の救護法と異なり、生活保護を国民の権利として認めている（第6回p.1、手書き「旧：権利ではなかった」）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q72", "round": 6, "cat": "生活保護", "q": "現行（新）生活保護法が制定された年はどれか。", "opts": ["1946年", "1950年", "1954年", "1959年", "1961年"], "ans": 1, "exp": "現行の（新）生活保護法は1950（昭和25）年制定（p.1）。1946年は旧生活保護法。1959年は国民年金法、1961年は国民皆保険の実施。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q73", "round": 6, "cat": "生活保護", "q": "保護の補足性の原理について、正しいものはどれか。", "opts": ["保護を受ける国民の側で守るべき最小限の要件", "国が責任をもって守るべき最小限の要件", "性別や社会的身分を問わず保護を適用する原理", "健康で文化的な最低限度の生活水準を示す原理", "申請手続きを保護の実施の前提とする原則"], "ans": 0, "exp": "原理①国家責任②無差別平等③最低生活保障は「国側」が守るもの。④補足性だけが「国民側」で守るべき最小限の要件（p.1、スライド）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q74", "round": 6, "cat": "生活保護", "q": "補足性の原理で、生活保護に優先して活用することが求められるものはどれか。", "opts": ["福祉事務所長による指導・指示", "民生委員による見守り・相談", "民法上の扶養義務者による扶養", "保護施設への入所措置", "医療扶助による現物給付"], "ans": 2, "exp": "優先して活用するもの＝本人の労働能力、利用し得る資産、扶養義務者による扶養、他の制度による保障（p.1、スライド）。手書き「3親等以内よりも先にチェックする」。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q75", "round": 6, "cat": "生活保護", "q": "本人から数えて三親等にあたる親族はどれか。", "opts": ["叔父・叔母", "兄弟姉妹", "祖父母", "従兄弟姉妹", "義父母"], "ans": 0, "exp": "親等図（p.12）：一親等＝父母・子・義父母、二親等＝祖父母・孫・兄弟姉妹、三親等＝曽祖父母・叔父叔母・甥姪・曽孫、四親等＝従兄弟姉妹・玄孫。手書き「本人を基準に」。保育現場の家族図（ジェノグラム）の読み方と同じ発想。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q76", "round": 6, "cat": "生活保護", "q": "補足性の原理が機能しているかを確認するために行われる調査はどれか。", "opts": ["要介護認定のための訪問調査", "障害支援区分の認定調査", "資力調査（ミーンズ・テスト）", "福祉サービスの第三者評価調査", "生活実態に関する全国統計調査"], "ans": 2, "exp": "資力調査（Means Test：ミーンズ・テスト）は所得にとどまらず、土地・住宅・家財道具・耐久消費財・有価証券・預貯金等の資産にも及ぶ（p.1）。手書き「1年以上くり返し使える（車・テレビ・PC・ピアノ）」は先生の補足。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q77", "round": 6, "cat": "生活保護", "q": "急迫した状況にある要保護者に、申請がなくても保護を行うことができるのは、どの原則の例外か。", "opts": ["申請保護の原則", "基準及び程度の原則", "必要即応の原則", "世帯単位の原則", "最低生活保障の原理"], "ans": 0, "exp": "申請保護の原則：申請手続きが実施の前提。ただし急迫した状況（病気で生存が危うい等）では、申請がなくても職権で保護できる（p.1・p.3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q78", "round": 6, "cat": "生活保護", "q": "保護の要否や程度を世帯単位で判定する原則の、例外にあたるものはどれか。", "opts": ["急迫時に職権で保護を開始する", "現在地で保護を実施する", "応急的に保護を行う", "扶養義務者に調査を行う", "一員を世帯分離して適用する"], "ans": 4, "exp": "世帯単位の原則にも、世帯内の一員を世帯分離して保護を適用する例外がある（p.2、手書き「例外」）。Q&A A9：親の介護のため同居する場合、両親だけ保護を受けられることがある。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q79", "round": 6, "cat": "生活保護", "q": "要保護者の年齢別・健康状態等の個々の事情を考慮して、有効かつ適切に行うとする原則はどれか。", "opts": ["基準及び程度の原則", "申請保護の原則", "世帯単位の原則", "必要即応の原則", "保護の補足性の原理"], "ans": 3, "exp": "実施の4原則＝申請保護・基準及び程度・必要即応・世帯単位。必要即応は機械的運用を戒める原則（p.2）。「原理（4つ）」と「原則（4つ）」の区別に注意。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q80", "round": 6, "cat": "生活保護", "q": "生活保護の基準（最低生活費を測定する基準）を定めるのは誰か。", "opts": ["厚生労働大臣", "都道府県知事", "市町村長", "福祉事務所長", "内閣総理大臣"], "ans": 0, "exp": "基準及び程度の原則：厚生労働大臣の定める基準により、不足分を補う程度に行う。この基準は保護の要否の判定基準も兼ねる（p.1〜2・p.4）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q81", "round": 6, "cat": "生活保護", "q": "生活保護の扶助の種類として、規定されていないものはどれか。", "opts": ["住宅扶助", "出産扶助", "障害扶助", "生業扶助", "葬祭扶助"], "ans": 2, "exp": "扶助は8種：生活・教育・住宅・医療・介護・出産・生業・葬祭（p.2）。障害は独立した扶助ではなく、生活扶助の「障害者加算」で対応する（Q&A A4）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q82", "round": 6, "cat": "生活保護", "q": "原則として現物給付で行われる扶助の組合せはどれか。", "opts": ["生活扶助と住宅扶助", "教育扶助と生業扶助", "出産扶助と葬祭扶助", "医療扶助と出産扶助", "医療扶助と介護扶助"], "ans": 4, "exp": "医療扶助と介護扶助だけが原則現物給付（医療券・介護券で指定機関から給付）。他の扶助は金銭給付（p.7）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q83", "round": 6, "cat": "生活保護", "q": "介護扶助が新設される契機となった法律はどれか。", "opts": ["老人福祉法", "介護保険法", "老人保健法", "高齢者医療確保法", "社会福祉法"], "ans": 1, "exp": "介護扶助は介護保険法に伴う法改正で導入された。要介護者・要支援者であることが受給要件（p.8）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q84", "round": 6, "cat": "生活保護", "q": "教育扶助の対象となる教育の期間はどれか。", "opts": ["就学前の幼稚園期間", "高等学校の就学期間", "大学・短大の就学期間", "義務教育期間", "専門学校の就学期間"], "ans": 3, "exp": "教育扶助は義務教育期間に限る（手書き：小中＝教育扶助）。就学前の幼稚園・大学等は対象外（p.7）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q85", "round": 6, "cat": "生活保護", "q": "高等学校への就学費用が支給される扶助はどれか。", "opts": ["教育扶助", "生活扶助", "住宅扶助", "出産扶助", "生業扶助"], "ans": 4, "exp": "2005年度より、高校就学費用は生業扶助（技能習得費の一環）として支給される（p.7・p.8、手書き「高＝生業」）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q86", "round": 6, "cat": "生活保護", "q": "身体上または精神上著しい障害があり、日常生活を営むことが困難な要保護者を入所させる保護施設はどれか。", "opts": ["更生施設", "医療保護施設", "授産施設", "宿所提供施設", "救護施設"], "ans": 4, "exp": "保護施設は5種：救護・更生・医療保護・授産・宿所提供。救護施設は重複障害者・精神障害者等の受け皿となってきた（p.2）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q87", "round": 6, "cat": "生活保護", "q": "生業扶助を行うことを目的とする保護施設はどれか。", "opts": ["救護施設", "更生施設", "授産施設", "医療保護施設", "宿所提供施設"], "ans": 2, "exp": "授産施設：要保護者に技能習得の指導を行い、習熟度に応じて工賃収入を得させ自立助長を図る（スライドp.2）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q88", "round": 6, "cat": "生活保護", "q": "保護施設として、規定されていないものはどれか。", "opts": ["救護施設", "更生施設", "医療保護施設", "婦人保護施設", "授産施設"], "ans": 3, "exp": "生活保護法の保護施設は救護・更生・医療保護・授産・宿所提供の5種（p.2）。婦人保護施設は売春防止法に基づく施設で、社会福祉法では第一種社会福祉事業。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q89", "round": 6, "cat": "生活保護", "q": "保護施設の設置主体として、規定されていないものはどれか。", "opts": ["都道府県", "一般社団法人", "市町村", "社会福祉法人", "日本赤十字社"], "ans": 1, "exp": "設置主体は都道府県、市町村、地方独立行政法人、社会福祉法人、日本赤十字社に限定（p.2）。NPO法人・一般社団法人・営利法人などは設置できない。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q90", "round": 6, "cat": "生活保護", "q": "生活保護法上、保護の実施機関とされているものはどれか。", "opts": ["福祉事務所を管理する福祉事務所長", "民生委員協議会の会長", "福祉事務所を管理する町村長", "保健所を管理する保健所長", "児童相談所を管理する所長"], "ans": 2, "exp": "法律上の実施機関＝都道府県知事・市長・福祉事務所を管理する町村長。実際は福祉事務所長に事務を委任している（p.2、手書き「実際は」）。「所長」は委任先であり実施機関そのものではない点が罠。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q91", "round": 6, "cat": "生活保護", "q": "居住地がないか明らかでない要保護者に対し、現在地を所管する福祉事務所が行う保護はどれか。", "opts": ["居住地保護", "現在地保護", "職権保護", "応急的保護", "施設保護"], "ans": 1, "exp": "居住地を有する者は居住地保護、居住地がないか不明な者は現在地保護（p.2）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q92", "round": 6, "cat": "生活保護", "q": "保護の開始の申請があった場合、実施機関は原則として何日以内に決定の通知をしなければならないか。", "opts": ["7日", "10日", "14日", "21日", "30日"], "ans": 2, "exp": "原則14日以内。扶養義務者の資産状況の調査などに日時を要する特別な理由がある場合は最長30日まで延期できる（p.2、Q&A A3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q93", "round": 6, "cat": "生活保護", "q": "保護の申請から30日以内に通知がない場合、申請者は申請をどのようにみなすことができるか。", "opts": ["承認されたものとみなす", "却下されたものとみなす", "取り下げたものとみなす", "再申請を要するものとみなす", "保留中のものとみなす"], "ans": 1, "exp": "30日以内に通知がない場合、申請者は実施機関が申請を却下したものとみなすことができる（p.2〜3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q94", "round": 6, "cat": "生活保護", "q": "要保護者が実施機関の立入調査等を拒んだ場合に、実施機関がとることができる措置はどれか。", "opts": ["申請の却下や保護の停止・廃止", "刑罰を科して強制的に調査する", "民生委員が代わって調査を行う", "調査拒否分を減額して支給する", "扶養義務者に調査対象を変更する"], "ans": 0, "exp": "立入調査や検診命令を拒んだ場合は、保護の開始・変更の申請を却下、または保護の変更・停止・廃止ができる（p.3）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q95", "round": 6, "cat": "生活保護", "q": "実施機関が被保護者に行う指導・指示について、正しいものはどれか。", "opts": ["被保護者の同意がなければ行えない", "被保護者の自由を制限して行える", "自由を尊重し必要最小限にとどめる", "書面による場合に限り行える", "福祉事務所長のみが行える"], "ans": 2, "exp": "指導・指示は被保護者の自由を尊重し、必要最小限にとどめなければならない（p.3）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q96", "round": 6, "cat": "生活保護", "q": "被保護者の権利として定められているものはどれか。", "opts": ["保護金品に租税が課されないこと", "保護を受ける権利を他人に譲ること", "保護の種類を自ら選択すること", "指導や指示を拒否すること", "保護金品を担保にすること"], "ans": 0, "exp": "権利＝不利益変更の禁止・公課禁止・差押禁止・譲渡禁止（p.3）。手書き「税金かからない」。不利益変更は正当な理由（要保護性の消滅、立入調査の拒否、指示に従わない等）があれば可能。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q97", "round": 6, "cat": "生活保護", "q": "被保護者の義務として、規定されていないものはどれか。", "opts": ["能力に応じて勤労に励む義務", "収入や世帯の変動を届け出る義務", "指導・指示に従う義務", "資力があるのに受けた保護費の返還義務", "扶養義務者へ保護開始を通知する義務"], "ans": 4, "exp": "義務＝生活上の義務・届出の義務・指示等に従う義務・費用返還義務（p.3）。扶養義務者への通知義務は規定されていない。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q98", "round": 6, "cat": "生活保護", "q": "保護費として支給される額は、どのように算定されるか。", "opts": ["最低生活費に収入を加えた額", "最低生活費から収入を差し引いた額", "収入から最低生活費を差し引いた額", "最低生活費の一定割合の額", "前年の課税所得を基準とした額"], "ans": 1, "exp": "最低生活費と収入を比較し、収入が最低生活費に満たない場合に、その差額を保護費として支給（p.4・p.5）。預貯金や保険の払戻金なども使い尽くした後に初めて保護適用となる。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q99", "round": 6, "cat": "生活保護", "q": "資料の生活扶助基準額の例（令和8年10月1日現在）で、東京都区部等の高齢者単身世帯（68歳）の額はどれか。", "opts": ["69,950円", "72,980円", "77,980円", "82,980円", "86,980円"], "ans": 2, "exp": "東京都区部等：高齢者単身68歳＝77,980円（p.4・Q&A A5）。69,950円は同世帯の地方郡部等の額。", "note": "金額は年度ごとに改定される。試験では数値そのものより『地域差がある』『差額支給』の理解が問われやすい。", "star": false, "check": true, "type": "mc"}, {"id": "q100", "round": 6, "cat": "生活保護", "q": "国民健康保険の加入者が生活保護を受けるようになった場合の取扱いはどれか。", "opts": ["国保に加入したまま自己負担のみ扶助", "国保を脱退し医療扶助の対象となる", "国保の資格を保持し保険料のみ免除", "後期高齢者医療制度へ切り替わる", "国保と医療扶助の両方を全額受ける"], "ans": 1, "exp": "国保加入者は国保から脱退し、医療費の全額が医療扶助の対象。後期高齢者医療の加入者も同様に脱退手続きが必要（p.6）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q101", "round": 6, "cat": "生活保護", "q": "被用者保険の加入者が生活保護を受けるようになった場合の取扱いはどれか。", "opts": ["資格を維持し自己負担分が医療扶助", "資格を喪失し全額が医療扶助の対象", "国民健康保険へ強制的に切り替わる", "保険給付の対象外となる", "保険料のみが生活扶助で支給される"], "ans": 0, "exp": "被用者保険は被保険者資格を喪失しない。保険給付を受け、自己負担部分が医療扶助の対象となる（p.6）。国保・後期高齢者医療との違いが頻出。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q102", "round": 6, "cat": "生活保護", "q": "医療保険の非加入者である40歳以上65歳未満の被保護者が受ける介護サービスの給付はどれか。", "opts": ["介護保険の第2号被保険者として受ける", "介護保険の第1号被保険者として受ける", "介護扶助と介護保険を併用して受ける", "介護扶助で給付される", "介護サービスは給付されない"], "ans": 3, "exp": "40〜64歳で医療保険に加入していない被保護者は介護保険の被保険者にならず、介護扶助を受ける（p.6）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q103", "round": 6, "cat": "生活保護", "q": "65歳以上の被保護者の介護サービス給付について、正しいものはどれか。", "opts": ["介護扶助が優先し保険は補完的に適用", "介護保険が優先し自己負担は介護扶助", "介護扶助のみで全額が給付される", "介護保険の被保険者とはならない", "自己負担も保険料も介護扶助で賄う"], "ans": 1, "exp": "65歳以上の被保護者は介護保険の第1号被保険者となり、介護保険の給付が優先。利用者負担分は介護扶助から支給される（p.6）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q104", "round": 6, "cat": "生活保護", "q": "65歳以上の被保護者の介護保険料は、どの扶助に加算されて支給されるか。", "opts": ["介護扶助", "医療扶助", "住宅扶助", "教育扶助", "生活扶助"], "ans": 4, "exp": "介護保険の保険料分は生活扶助に加算される（p.6）。自己負担分は介護扶助、保険料は生活扶助、と区別。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q105", "round": 6, "cat": "生活保護", "q": "生活保護のQ&Aで、自動車の保有が例外的に認められる場合として挙げられているものはどれか。", "opts": ["維持費を保護費から支出する場合", "処分価値が高く売却が難しい場合", "障害のある方の通院に必要な場合", "家族の送迎用として使用する場合", "レジャー用に年数回使用する場合"], "ans": 2, "exp": "原則は保有不可（利用し得る資産・維持費が生計を圧迫）。障害のある方や公共交通機関の利用が著しく困難な地域の居住者が、通勤・通院・通所・通学に必要で、処分価値が小さく維持費が賄える等の要件を満たす場合に例外（Q&A A7）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q106", "round": 6, "cat": "生活保護", "q": "住宅ローンがある場合の生活保護の取扱いについて、正しいものはどれか。", "opts": ["住宅ローンがあると受給できない", "受給可だが保護費での返済は原則不可", "保護費から住宅ローンを返済できる", "住宅扶助でローンが全額支給される", "ローンが残る持家は直ちに売却が必要"], "ans": 1, "exp": "住宅ローンがあるだけで受給できないことはない。ただし保護費からの返済は最低限度の生活保障の趣旨から原則認められない（Q&A A11）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q107", "round": 6, "cat": "児童福祉", "q": "児童福祉法における「児童」の定義はどれか。", "opts": ["満12歳に満たない者", "満15歳に満たない者", "満18歳に満たない者", "満20歳に満たない者", "満22歳に満たない者"], "ans": 2, "exp": "児童＝満18歳に満たない者（p.5）。乳児＝満1歳未満、幼児＝満1歳〜小学校就学の始期、少年＝小学校就学の始期〜満18歳。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q108", "round": 6, "cat": "児童福祉", "q": "児童福祉法における「幼児」の定義はどれか。", "opts": ["満1歳に満たない者", "満1歳から小学校就学の始期まで", "小学校就学の始期から満18歳まで", "満3歳から小学校就学の始期まで", "満1歳から満6歳に達するまで"], "ans": 1, "exp": "乳児（0歳〜満1歳未満）／幼児（満1歳〜小学校就学の始期＝およそ6歳の4月まで）／少年（就学の始期〜満18歳）（p.5）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q109", "round": 6, "cat": "児童福祉", "q": "児童福祉法で法の対象とされている「妊産婦」の定義はどれか。", "opts": ["妊娠中または出産後6か月以内の女子", "妊娠中または出産後6週間以内の女子", "妊娠中または出産後1年以内の女子", "妊娠12週以降または出産後1年以内の女子", "出産後1年以内の女子のみ"], "ans": 2, "exp": "妊産婦＝妊娠中または出産後1年以内の女子（p.5）。「6週間」は産褥期（じょく婦）の目安で別概念。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q110", "round": 6, "cat": "児童福祉", "q": "児童相談所に置くことが義務づけられている職員はどれか。", "opts": ["保育士", "民生委員", "社会福祉主事", "介護支援専門員", "児童福祉司"], "ans": 4, "exp": "都道府県は児童相談所を設置し、そこに児童福祉司を置く義務がある（p.5、マーカー）。業務：相談・調査・判定・指導・一時保護。児童福祉司＝ケースワーカー（スライドp.3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q111", "round": 6, "cat": "児童福祉", "q": "児童福祉法に規定する児童委員を兼ねるのは誰か。", "opts": ["保育士", "民生委員", "児童福祉司", "社会福祉主事", "家庭相談員"], "ans": 1, "exp": "児童委員は、民間人に委嘱された民生委員がこれを兼ねる（p.5）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q112", "round": 6, "cat": "児童福祉", "q": "児童相談所の設置が義務づけられている自治体はどれか。", "opts": ["都道府県", "市町村", "指定都市のみ", "中核市のみ", "福祉事務所設置市"], "ans": 0, "exp": "都道府県が児童相談所を設置（義務）。指定都市は設置権をもつ（スライドp.4）。", "note": "資料のスライド（中核市＝児童相談所を除く福祉事務）は旧情報の可能性。児童福祉法改正で中核市・特別区も児童相談所を設置できる。先生の説明を優先し、試験前に確認を。", "star": true, "check": true, "type": "mc"}, {"id": "q113", "round": 6, "cat": "児童福祉", "q": "児童福祉法で、児童を心身ともに健やかに育成する責任を負うとされているのは誰か。", "opts": ["保護者と学校の教職員", "国と都道府県のみ", "国・地方公共団体と保護者", "都道府県と市町村のみ", "児童福祉施設の長と保護者"], "ans": 2, "exp": "国及び地方公共団体は、児童の保護者とともに児童を心身ともに健やかに育成する責任を負う（第2条、p.5）。", "note": "資料の第1条の文言（『すべて国民は…努めなければならない／すべて児童は…愛護されなければならない』）は2016年改正前の旧表現。現行は『児童の権利に関する条約の精神に則り、適切に養育される等の権利を有する』。", "star": false, "check": true, "type": "mc"}, {"id": "q114", "round": 6, "cat": "児童福祉", "q": "児童福祉法に規定される児童福祉施設はどれか。", "opts": ["更生施設", "授産施設", "婦人保護施設", "児童厚生施設", "老人デイサービスセンター"], "ans": 3, "exp": "児童福祉施設：助産施設・乳児院・母子生活支援施設・保育所・児童厚生施設・児童養護施設…等（第7条、p.5）。更生・授産は保護施設、婦人保護施設は売春防止法。", "note": "資料の施設名（知的障害児施設、盲ろうあ児施設、肢体不自由児施設、重症心身障害児施設、情緒障害児短期治療施設）は旧名称。現行は障害児入所施設・児童発達支援センター・児童心理治療施設等に再編。", "star": false, "check": true, "type": "mc"}, {"id": "q115", "round": 6, "cat": "福祉事務所等", "q": "福祉事務所の設置が義務づけられているのはどれか。", "opts": ["都道府県と指定都市・中核市に限る", "都道府県および市（特別区を含む）", "市（特別区を含む）のみ", "都道府県と町村のみ", "市町村（特別区を含む）すべて"], "ans": 1, "exp": "福祉事務所：都道府県及び市（特別区を含む）は設置義務、町村は任意（スライドp.3）。町村は未設置でも役場で申請できる（Q&A A1）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q116", "round": 6, "cat": "福祉事務所等", "q": "福祉事務所が所管する福祉六法に含まれないものはどれか。", "opts": ["精神保健福祉法", "生活保護法", "児童福祉法", "老人福祉法", "身体障害者福祉法"], "ans": 0, "exp": "福祉六法＝生活保護法・児童福祉法・母子及び父子並びに寡婦福祉法・老人福祉法・身体障害者福祉法・知的障害者福祉法（スライドp.3）。", "note": "スライドの『母子及び寡婦福祉法』は旧名称。現行は『母子及び父子並びに寡婦福祉法』（2014年改称）。", "star": true, "check": true, "type": "mc"}, {"id": "q117", "round": 6, "cat": "福祉事務所等", "q": "指定都市の人口要件はどれか。", "opts": ["人口10万人以上", "人口20万人以上", "人口30万人以上", "人口50万人以上", "人口100万人以上"], "ans": 3, "exp": "指定都市＝政令で指定された人口50万人以上の市（大阪・横浜など）。中核市＝人口20万人以上（船橋・松山など）（スライドp.4）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q118", "round": 6, "cat": "福祉事務所等", "q": "資料で中核市の事務として挙げられているものはどれか。", "opts": ["精神障害者保健福祉手帳の交付", "宝くじの発売", "国道・都道府県道の管理", "市街地開発計画の決定", "身体障害者手帳の交付"], "ans": 4, "exp": "中核市：身体障害者手帳の交付、飲食店営業等の許可、介護サービス事業者の指定、保育所・特別養護老人ホームの設置認可・監督、保健所の設置など。精神障害者保健福祉手帳・国道管理・宝くじ等は指定都市の権限（スライドp.4）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q119", "round": 6, "cat": "障害者福祉", "q": "身体障害者福祉法における「身体障害者」の要件はどれか。", "opts": ["別表の障害があり手帳の交付を受けた15歳以上", "別表の障害があり手帳の交付を受けた20歳以上", "別表の障害があり手帳の交付を受けた18歳以上", "別表の障害があり手帳の交付を受けた65歳未満", "別表の障害があれば手帳の交付は要しない"], "ans": 2, "exp": "身体障害者＝別表に掲げる身体上の障害がある18歳以上の者で、身体障害者手帳の交付を受けた者（p.6）。", "note": "手帳そのものは、18歳未満でも保護者の申請により交付される（障害児も対象）。『18歳以上』は法上の『身体障害者』の定義。", "star": true, "check": true, "type": "mc"}, {"id": "q120", "round": 6, "cat": "障害者福祉", "q": "身体障害者手帳を交付するのは誰か。", "opts": ["都道府県知事・特別区の区長・市町村長", "福祉事務所長または児童相談所長", "厚生労働大臣または都道府県知事", "都道府県知事・指定都市の市長のみ", "都道府県知事・指定都市・中核市の市長"], "ans": 4, "exp": "都道府県知事、指定都市市長または中核市市長が、申請に基づき認定したとき交付（p.6、概要p.9）。精神障害者保健福祉手帳は指定都市まで（中核市は含まない）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q121", "round": 6, "cat": "障害者福祉", "q": "身体障害者手帳に記載される障害の級別はどれか。", "opts": ["1級から3級", "1級から4級", "1級から5級", "1級から6級", "1級から7級"], "ans": 3, "exp": "障害の級別は1〜6級（施行規則別表第5号）。7級は単独では交付対象とならないが、7級が2つ以上重複、または6級以上と重複する場合は対象（p.6・p.9）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q122", "round": 6, "cat": "障害者福祉", "q": "7級の障害のみを有する場合の身体障害者手帳の取扱いはどれか。", "opts": ["単独でも交付の対象となる", "6級として交付される", "児童に限り交付される", "指定都市の長が認めた場合に交付される", "単独では交付の対象とならない"], "ans": 4, "exp": "7級単独では手帳の対象外。ただし7級が2つ以上重複する場合、または7級が6級以上の障害と重複する場合は対象（p.9マーカー）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q123", "round": 6, "cat": "障害者福祉", "q": "身体障害者障害程度等級表で、聴覚障害として認定される最も重い等級はどれか。", "opts": ["1級", "3級", "4級", "2級", "6級"], "ans": 3, "exp": "聴覚障害は2級（両耳100dB以上＝両耳全ろう）〜6級。1級はない。3級＝両耳90dB以上、4級＝両耳80dB以上または語音明瞭度50％以下、6級＝両耳70dB以上など（p.10）。ST国試で重要。", "note": "等級表は施行規則別表第5号を参照。障害年金や補聴器助成の基準（デシベル）と混同しない。", "star": true, "check": true, "type": "mc"}, {"id": "q124", "round": 6, "cat": "障害者福祉", "q": "聴覚障害の6級に該当する、両耳の聴力レベルはどれか。", "opts": ["60デシベル以上", "70デシベル以上", "80デシベル以上", "90デシベル以上", "100デシベル以上"], "ans": 1, "exp": "6級＝両耳の聴力レベルが70dB以上（40cm以上の距離で発声された会話語を理解し得ない）、または一側耳90dB以上かつ他側耳50dB以上（p.10）。2級100dB・3級90dB・4級80dB。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q125", "round": 6, "cat": "障害者福祉", "q": "音声機能、言語機能又はそしゃく機能の「喪失」に該当する等級はどれか。", "opts": ["2級", "3級", "4級", "5級", "6級"], "ans": 1, "exp": "音声・言語・そしゃく機能の喪失＝3級、著しい障害＝4級（p.10）。STの対象領域として重要。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q126", "round": 6, "cat": "障害者福祉", "q": "身体障害者福祉法施行令第36条で定められている障害はどれか。", "opts": ["心臓の機能の障害", "じん臓の機能の障害", "呼吸器の機能の障害", "小腸の機能の障害", "音声機能の障害"], "ans": 3, "exp": "法別表は心臓・じん臓・呼吸器等を示し、『その他政令で定める障害』が施行令第36条：ぼうこう又は直腸、小腸、ヒト免疫不全ウイルスによる免疫、肝臓の機能の障害（p.9）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q127", "round": 6, "cat": "障害者福祉", "q": "知的障害者福祉法について、正しいものはどれか。", "opts": ["知的障害者の定義規定がない", "知的障害者を18歳以上と定義している", "知能指数50以下と定義している", "手帳の交付が法律で定められている", "障害の程度が3等級に区分されている"], "ans": 0, "exp": "知的障害者福祉法には対象となる知的障害者の定義や、身体障害者手帳のような障害認定に関する規定はない（p.6、手書き「定義なし」）。療育手帳制度が設けられている。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q128", "round": 6, "cat": "障害者福祉", "q": "療育手帳制度は、何を根拠として運用されているか。", "opts": ["知的障害者福祉法の条文", "児童福祉法の条文", "障害者基本法の条文", "厚生事務次官通知", "障害者総合支援法の条文"], "ans": 3, "exp": "昭和48年9月27日厚生省発児第156号厚生事務次官通知（技術的助言＝ガイドライン）。各自治体が実施要綱を定める（概要p.13）。法律上の手帳ではない点が身体・精神との違い。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q129", "round": 6, "cat": "障害者福祉", "q": "療育手帳の交付に際し、知的障害と判定する機関はどれか。", "opts": ["児童相談所または知的障害者更生相談所", "福祉事務所または身体障害者更生相談所", "保健所または精神保健福祉センター", "地域包括支援センターまたは福祉事務所", "市町村の障害福祉担当窓口または保健所"], "ans": 0, "exp": "児童相談所または知的障害者更生相談所で知的障害と判定された者に、都道府県知事・指定都市市長・児童相談所設置の中核市市長が交付（p.6、概要p.13）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q130", "round": 6, "cat": "障害者福祉", "q": "日常生活の介助を必要とする者が療育手帳の重度（A）となる、知能指数の目安はどれか。", "opts": ["概ね20以下", "概ね35以下", "概ね50以下", "概ね70以下", "概ね85以下"], "ans": 1, "exp": "重度（A）＝①知能指数概ね35以下で日常生活の介助が必要、または異食・興奮などの問題行動あり、②概ね50以下で盲・ろうあ・肢体不自由等を有する者（概要p.13）。それ以外はB。", "note": "重度（A）とそれ以外（B）の区分は国のガイドライン。自治体により細分化・名称（『愛の手帳』『みどりの手帳』等）が異なる（スライドp.3）。", "star": true, "check": true, "type": "mc"}, {"id": "q131", "round": 6, "cat": "障害者福祉", "q": "精神障害者保健福祉手帳の有効期限はどれか。", "opts": ["交付日から1年を経過する月の末日", "交付日から3年を経過する月の末日", "交付日から5年を経過する月の末日", "交付日から2年を経過する月の末日", "有効期限は定められていない"], "ans": 3, "exp": "有効期限は交付日から2年を経過する日の属する月の末日。2年ごとに都道府県知事の認定を受ける（概要p.14）。1〜3級（1級＝日常生活の用を弁ずることを不能ならしめる程度）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q132", "round": 6, "cat": "障害者福祉", "q": "精神障害者保健福祉手帳を交付するのは誰か。", "opts": ["都道府県知事・指定都市・中核市の市長", "市町村長", "都道府県知事または指定都市市長", "精神保健福祉センター所長", "保健所長"], "ans": 2, "exp": "根拠は精神保健福祉法第45条。居住地の市区町村を経由して都道府県知事に申請する（概要p.14）。身体障害者手帳とは異なり中核市長は交付者に含まれない。", "note": "概要の交付者数は平成21年度末と古い。数値は暗記不要。", "star": true, "check": true, "type": "mc"}, {"id": "q133", "round": 7, "cat": "民生委員", "q": "民生委員の任期はどれか。", "opts": ["1年", "2年", "3年", "4年", "5年"], "ans": 2, "exp": "民生委員の任期は3年。給与は支給されない（無給。手書き「交通費○」）（⑦p.1）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q134", "round": 7, "cat": "民生委員", "q": "民生委員を委嘱するのは誰か。", "opts": ["都道府県知事", "市町村長", "福祉事務所長", "民生委員協議会長", "厚生労働大臣"], "ans": 4, "exp": "都道府県知事の推薦により厚生労働大臣が委嘱（法5条）。推薦する人と委嘱する人が異なる点が頻出（⑦p.1）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q135", "round": 7, "cat": "民生委員", "q": "民生委員の職務として、規定されているものはどれか。", "opts": ["生活保護の要否と程度の決定を行うこと", "福祉事務所等の関係行政機関への協力", "保護費の支給を代わって行うこと", "要保護者に対する強制的な立入調査", "福祉事務所長の職務の指揮監督を行うこと"], "ans": 1, "exp": "職務＝住民の生活状態の把握、相談・助言その他の援助、福祉事務所等の関係行政機関の業務への協力（⑦p.1）。保護の決定は実施機関の権限。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q136", "round": 7, "cat": "民生委員", "q": "民生委員協議会の任務として、規定されているものはどれか。", "opts": ["保護の要否の決定", "児童の一時保護の決定", "各種手帳の交付の決定", "福祉事務所等との連絡", "民生委員の委嘱"], "ans": 3, "exp": "民生委員協議会の任務は、民生委員の連絡及び調整、福祉事務所等の関係行政機関との連絡（⑦p.1）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q137", "round": 7, "cat": "民生委員", "q": "民生委員の区域を定めるのは誰か。", "opts": ["都道府県知事の意見をきいた市町村長", "厚生労働大臣の意見をきいた都道府県知事", "福祉事務所長の意見をきいた市町村長", "民生委員協議会の意見をきいた厚生労働大臣", "市町村長の意見をきいた都道府県知事"], "ans": 4, "exp": "区域は都道府県知事が市町村長の意見をきいて定める（⑦p.1）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q138", "round": 7, "cat": "医療法", "q": "医療法の性格として、資料に示されているものはどれか。", "opts": ["医療従事者の資格と業務に関する基本法", "医療施設と医療提供の理念の基本法", "医療保険の給付と負担に関する基本法", "感染症の予防と医療に関する基本法", "診療報酬の算定と支払に関する基本法"], "ans": 1, "exp": "医療法は医療施設と医療提供の理念に関する基本法で、9章構成（⑦p.2）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q139", "round": 7, "cat": "医療法", "q": "医療法第1条の2に示される医療の内容として、正しいものはどれか。", "opts": ["治療のみを内容とする良質かつ適切なもの", "予防と治療のみを内容とする適切なもの", "治療と介護を一体的に行う効率的なもの", "予防やリハビリを含む良質かつ適切なもの", "公衆衛生と治療を内容とする効率的なもの"], "ans": 3, "exp": "医療は治療のみならず、疾病の予防やリハビリテーションを含む良質かつ適切なもの（⑦p.2）。STに直結する条文。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q140", "round": 7, "cat": "医療法", "q": "医療法で、病院と診療所を区別する入院施設の病床数の基準はどれか（病院の下限）。", "opts": ["10床以上", "15床以上", "20床以上", "30床以上", "50床以上"], "ans": 2, "exp": "病院＝20人以上の患者を入院させる施設。診療所＝入院施設がない、または19人以下（無床診療所0床、有床診療所19床以下）（⑦p.2）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q141", "round": 7, "cat": "医療法", "q": "有床診療所の入院施設の収容人数として、正しいものはどれか。", "opts": ["19人以下", "10人以下", "20人以下", "29人以下", "30人以下"], "ans": 0, "exp": "診療所の入院施設は19人以下（⑦p.2）。20人以上は病院。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q142", "round": 7, "cat": "医療法", "q": "助産所について、正しいものはどれか。", "opts": ["妊婦・産婦・じょく婦20人以上は入所不可", "妊婦・産婦・じょく婦5人以上は入所不可", "入所施設を設けることができない", "妊婦・産婦・じょく婦10人以上は入所不可", "医師の管理下でのみ開設できる"], "ans": 3, "exp": "助産所は妊婦・産婦・じょく婦10人以上の入所施設を有してはならない（⑦p.2）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q143", "round": 7, "cat": "医療法", "q": "医療事故（予期しなかった死亡・死産）の報告先はどれか。", "opts": ["都道府県の医療安全支援センター", "地域医療支援病院の管理者", "都道府県医療審議会の会長", "厚生労働省の医政局長", "医療事故調査・支援センター"], "ans": 4, "exp": "医療事故は、一般社団法人・一般財団法人である医療事故調査・支援センターへ報告（⑦p.2）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q144", "round": 7, "cat": "保助看法", "q": "看護師の免許を与えるのは誰か。", "opts": ["都道府県知事", "市町村長", "保健所長", "日本看護協会長", "厚生労働大臣"], "ans": 4, "exp": "看護師（5条）は厚生労働大臣免許。准看護師（6条）は都道府県知事免許（⑦p.3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q145", "round": 7, "cat": "保助看法", "q": "准看護師の免許を与えるのは誰か。", "opts": ["厚生労働大臣", "市町村長", "都道府県知事", "保健所長", "指定都市の市長"], "ans": 2, "exp": "准看護師は都道府県知事免許（保助看法6条）。看護師との違いが頻出（⑦p.3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q146", "round": 7, "cat": "保助看法", "q": "看護師の業務として、保助看法5条に定められているものはどれか。", "opts": ["診療と調剤", "予防接種の実施", "医薬品の処方", "リハビリテーション計画の立案", "療養上の世話または診療の補助"], "ans": 4, "exp": "看護師＝傷病者若しくはじょく婦に対する療養上の世話又は診療の補助を行うことを業とする者（⑦p.3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q147", "round": 7, "cat": "保助看法", "q": "じょく婦とは、およそどの時期にある女性か。", "opts": ["妊娠初期から中期の期間", "分娩後およそ1年以内の期間", "分娩後およそ6か月以内の期間", "分娩後およそ6週間の期間", "妊娠36週以降の分娩前の期間"], "ans": 3, "exp": "産褥期（分娩後およそ6週間）の女性。児童福祉法の妊産婦（出産後1年以内）との違いに注意（⑦p.3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q148", "round": 7, "cat": "保助看法", "q": "看護師が医師の指示なしに行える業務はどれか。", "opts": ["静脈注射の実施と薬剤の投与", "点滴の実施と刺入部の管理", "採血の実施と検体の提出", "診療機器の操作と調整", "療養上の世話（食事の介助）"], "ans": 4, "exp": "療養上の世話（観察・食事・清拭・排泄介助）は医師の指示なしで可。診療の補助は医師の指示が必要で、与薬・採血・静脈注射・点滴・機器操作などが該当（⑦p.3）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q149", "round": 7, "cat": "保助看法", "q": "保助看法37条で原則禁止される行為はどれか。", "opts": ["医師の指示なしの医薬品の授与", "医師の指示下での診療の補助業務", "療養上の世話", "臨時応急の手当", "助産師による助産"], "ans": 0, "exp": "医師の指示なしに診療機械の使用や医薬品の授与等を行うことを禁止。臨時応急の手当等は除く（⑦p.3）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q150", "round": 7, "cat": "独占資格", "q": "名称独占のみで、業務独占がない資格はどれか。", "opts": ["医師", "言語聴覚士", "薬剤師", "看護師", "歯科技工士"], "ans": 1, "exp": "名称独占のみ＝保健師・臨床検査技師・理学療法士・言語聴覚士。業務独占＋名称独占＝医師・歯科医師・薬剤師・助産師・看護師・診療放射線技師（⑦p.4）。", "note": "資格の分類（特に保健師・歯科技工士・あん摩マッサージ指圧師等）は書籍により異なる場合がある。資料の分類を優先。", "star": true, "check": true, "type": "mc"}, {"id": "q151", "round": 7, "cat": "独占資格", "q": "業務独占と名称独占の両方をもつ資格はどれか。", "opts": ["あん摩マッサージ指圧師", "臨床検査技師", "診療放射線技師", "理学療法士", "作業療法士"], "ans": 2, "exp": "資料の分類では診療放射線技師は業務独占＋名称独占（⑦p.4）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q152", "round": 7, "cat": "独占資格", "q": "業務独占のみで名称独占のない資格はどれか。", "opts": ["保健師", "臨床検査技師", "診療放射線技師", "言語聴覚士", "柔道整復師"], "ans": 4, "exp": "資料では柔道整復師・歯科技工士・あん摩マッサージ指圧師・はり師・きゅう師が業務独占のみ（⑦p.4）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q153", "round": 7, "cat": "独占資格", "q": "名称独占の目的として、資料に示されているものはどれか。", "opts": ["有資格者に業務を独占させること", "無資格者の就業を禁止すること", "診療報酬の算定を可能にすること", "患者の信頼と資格の信用力の確保", "養成校の入学定員を管理すること"], "ans": 3, "exp": "名称独占の目的は、質・安全の確保、患者の信頼、資格の信用力、無資格者の弊害防止（⑦p.4）。業務を独占させるためではない。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q154", "round": 7, "cat": "言語聴覚士法", "q": "言語聴覚士法第1条（目的）として、正しいものはどれか。", "opts": ["医療の普及及び向上に寄与すること", "障害者の社会参加に寄与すること", "国民の健康の保持に寄与すること", "地域包括ケアの推進に寄与すること", "福祉サービスの質の向上に寄与すること"], "ans": 0, "exp": "資格を定めるとともにその業務が適正に運用されるよう規律し、もって医療の普及及び向上に寄与（⑦p.5）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q155", "round": 7, "cat": "言語聴覚士法", "q": "言語聴覚士の免許を与えるのは誰か。", "opts": ["厚生労働大臣", "都道府県知事", "文部科学大臣", "日本言語聴覚士協会長", "養成校の学校長"], "ans": 0, "exp": "言語聴覚士法2条・3条：厚生労働大臣の免許を受けて、言語聴覚士の名称を用いて、言語訓練その他の訓練・検査・助言・指導を行う（⑦p.5）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q156", "round": 7, "cat": "言語聴覚士法", "q": "言語聴覚士の免 命令で、施行規則がこれにあたる", "内閣が定める命令で、施行令がこれにあたる"], "ans": 4, "exp": "政令＝内閣が定める命令（施行令）。省令＝担当大臣が定める命令（施行規則）。政令は法律の委任がなければ罰則を設けられない（⑦p.7）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q170", "round": 7, "cat": "法令・刑罰", "q": "刑法上の刑罰（主刑）として、規定されていないものはどれか。", "opts": ["過料", "罰金", "拘留", "科料", "禁錮"], "ans": 0, "exp": "刑罰は死刑・懲役・禁錮・罰金・拘留・科料・没収の7種（没収は付加刑）。過料は行政上の秩序罰で刑罰ではない（⑦p.7）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q171", "round": 7, "cat": "法令・刑罰", "q": "刑罰の重さの順として、正しいものはどれか。", "opts": ["死刑＞懲役・禁錮＞拘留＞罰金＞科料", "死刑＞懲役・禁錮＞罰金＞拘留＞科料", "死刑＞罰金＞懲役・禁錮＞拘留＞科料", "死刑＞懲役・禁錮＞科料＞罰金＞拘留", "懲役・禁錮＞死刑＞罰金＞拘留＞科料"], "ans": 1, "exp": "重さの順は死刑＞懲役・禁錮＞罰金＞拘留＞科料（⑦p.7）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q172", "round": 7, "cat": "法令・刑罰", "q": "拘留の期間として、正しいものはどれか。", "opts": ["1日以上30日未満", "1日以上10日未満", "1か月以上3か月未満", "1日以上1年未満", "30日以上1年未満"], "ans": 0, "exp": "拘留は1日以上30日未満。罰金は1万円以上、科料は千円以上1万円未満（⑦p.7）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q173", "round": 7, "cat": "法令・刑罰", "q": "科料の額として、正しいものはどれか。", "opts": ["千円以上1万円未満", "千円未満", "1万円以上", "1万円以上10万円未満", "10万円以上"], "ans": 0, "exp": "科料は千円以上1万円未満、罰金は1万円以上（⑦p.7）。", "note": "", "star": true, "check": false, "type": "mc"}, {"id": "q174", "round": 7, "cat": "法令・刑罰", "q": "令和7年6月に創設され、懲役と禁錮を一本化した刑はどれか。", "opts": ["拘置刑", "拘禁刑", "収容刑", "矯正刑", "自由刑"], "ans": 1, "exp": "拘禁刑は有期で1か月以上20年以下（加重時30年）。作業は義務ではなく、必要に応じて行う（⑦p.7）。", "note": "資料のマーカー部分（懲役は労働を強制、禁錮は強制されない）は旧制度の記述。試験では資料に沿う可能性もあるため、新旧を併せて理解する。", "star": true, "check": true, "type": "mc"}, {"id": "q175", "round": 7, "cat": "法令・刑罰", "q": "行政における「指示」について、正しいものはどれか。", "opts": ["法的拘束力があり違反者に罰則が科される", "実際上の拘束力もない", "指導・勧告・助言より弱いものである", "民間の主体には行えない", "法的拘束力はないが実際上の拘束力がある"], "ans": 4, "exp": "指示は法的拘束力はないが実際上の拘束力がある。指導・勧告・助言は指示よりさらに弱い（⑦p.7）。", "note": "", "star": false, "check": false, "type": "mc"}, {"id": "q176", "round": 7, "cat": "法令・刑罰", "q": "犯罪の被害者本人または法定代理人が捜査機関に申告することはどれか。", "opts": ["告発", "自首", "請求", "告訴", "通告"],
