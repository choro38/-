<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート キーワード→用語当て</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --card: #22263a;
  --border: #2d3250;
  --accent: #6c8fff;
  --accent2: #a78bfa;
  --green: #34d399;
  --red: #f87171;
  --yellow: #fbbf24;
  --text: #e8eaf6;
  --sub: #8892b0;
  --radius: 16px;
  --font: 'Helvetica Neue','Hiragino Sans','Meiryo',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:16px 12px 40px;}

/* ヘッダー */
.hd{text-align:center;padding:18px 0 10px;}
.hd h1{font-size:1.3rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hd p{color:var(--sub);font-size:.75rem;margin-top:3px;}

/* モード切り替え */
.mode-wrap{display:flex;justify-content:center;gap:8px;margin:12px 0;}
.mode-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:30px;color:var(--sub);cursor:pointer;font-size:.82rem;font-weight:700;padding:7px 20px;transition:all .18s;}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* カテゴリタブ */
.tabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:0 auto 14px;max-width:640px;}
.tab-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:30px;color:var(--sub);cursor:pointer;font-size:.72rem;font-weight:600;padding:4px 12px;transition:all .15s;white-space:nowrap;}
.tab-btn:hover{border-color:var(--accent);color:var(--accent);}
.tab-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* 進捗バー */
.prog-wrap{max-width:480px;margin:0 auto 14px;}
.prog-bar-bg{background:var(--surface);border-radius:99px;height:6px;overflow:hidden;}
.prog-bar{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:99px;transition:width .4s;}
.prog-label{text-align:center;font-size:.72rem;color:var(--sub);margin-top:5px;}
.prog-label span{color:var(--accent);font-weight:700;}

/* ── フラッシュカード ── */
#flashMode{display:block;}
.flash-area{max-width:480px;margin:0 auto;}
.flash-card{
  background:var(--card);border:2px solid var(--border);border-radius:var(--radius);
  padding:28px 24px 22px;text-align:center;cursor:pointer;
  min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  transition:border-color .2s,box-shadow .2s;
  user-select:none;
}
.flash-card:hover{border-color:var(--accent);box-shadow:0 8px 28px rgba(108,143,255,.18);}
.flash-cat{font-size:.68rem;font-weight:700;color:var(--accent);letter-spacing:.07em;background:rgba(108,143,255,.12);padding:3px 12px;border-radius:99px;}
.flash-kw{font-size:1.1rem;font-weight:800;line-height:1.5;color:var(--text);}
.flash-hint{font-size:.72rem;color:var(--sub);margin-top:4px;}
.flash-ans{
  font-size:1.4rem;font-weight:900;color:var(--green);
  background:rgba(52,211,153,.08);border-radius:10px;padding:10px 18px;
  border-left:3px solid var(--green);width:100%;text-align:left;
  display:none;
}
.flash-desc{font-size:.78rem;color:var(--sub);line-height:1.6;text-align:left;width:100%;display:none;}
.flash-card.revealed .flash-ans{display:block;}
.flash-card.revealed .flash-desc{display:block;}
.flash-card.revealed .flash-hint{display:none;}

.flash-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;}
.nav-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:.88rem;font-weight:700;padding:9px 22px;transition:all .15s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.flash-result-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;color:var(--sub);cursor:pointer;font-size:.78rem;padding:7px 16px;transition:all .15s;display:flex;gap:6px;}
.flash-result-btn:hover{border-color:var(--green);color:var(--green);}
.flash-result-btn.ng:hover{border-color:var(--red);color:var(--red);}

/* ── 4択クイズ ── */
#quizMode{display:none;}
.quiz-area{max-width:480px;margin:0 auto;}
.quiz-q{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:24px 20px 20px;margin-bottom:14px;}
.quiz-q .qcat{font-size:.68rem;font-weight:700;color:var(--accent2);letter-spacing:.07em;background:rgba(167,139,250,.1);padding:3px 12px;border-radius:99px;display:inline-block;margin-bottom:10px;}
.quiz-q .qtext{font-size:1rem;font-weight:800;line-height:1.55;}
.quiz-q .qsub{font-size:.72rem;color:var(--sub);margin-top:8px;}

.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.choice-btn{
  background:var(--surface);border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);cursor:pointer;font-size:.88rem;font-weight:600;
  padding:12px 16px;text-align:left;transition:all .18s;line-height:1.4;
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(108,143,255,.08);}
.choice-btn.correct{border-color:var(--green)!important;background:rgba(52,211,153,.12)!important;color:var(--green)!important;}
.choice-btn.wrong{border-color:var(--red)!important;background:rgba(248,113,113,.1)!important;color:var(--red)!important;}
.choice-btn:disabled{cursor:default;}

.quiz-fb{background:var(--surface);border-radius:10px;padding:12px 16px;font-size:.8rem;color:var(--sub);line-height:1.6;display:none;border-left:3px solid var(--border);}
.quiz-fb.show{display:block;}
.quiz-fb.ok{border-left-color:var(--green);}
.quiz-fb.ng{border-left-color:var(--red);}
.quiz-fb .fb-verdict{font-weight:800;font-size:.9rem;margin-bottom:4px;}
.quiz-fb.ok .fb-verdict{color:var(--green);}
.quiz-fb.ng .fb-verdict{color:var(--red);}

.quiz-next{display:none;width:100%;background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.92rem;font-weight:800;padding:13px;margin-top:10px;transition:opacity .15s;}
.quiz-next:hover{opacity:.85;}
.quiz-next.show{display:block;}

/* スコア画面 */
.score-screen{display:none;text-align:center;padding:32px 20px;max-width:480px;margin:0 auto;}
.score-screen.show{display:block;}
.score-big{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.score-label{font-size:.85rem;color:var(--sub);margin-top:4px;}
.score-msg{font-size:1rem;font-weight:700;margin:16px 0 8px;color:var(--text);}
.retry-btn{background:var(--accent);border:none;border-radius:10px;color:#fff;cursor:pointer;font-size:.92rem;font-weight:800;padding:13px 32px;margin-top:16px;transition:opacity .15s;}
.retry-btn:hover{opacity:.85;}

/* ミス一覧 */
.miss-list{margin-top:20px;text-align:left;}
.miss-list h3{font-size:.8rem;color:var(--sub);margin-bottom:8px;font-weight:700;}
.miss-item{background:var(--card);border-radius:8px;padding:10px 14px;margin-bottom:6px;border-left:3px solid var(--red);}
.miss-item .mt{font-size:.82rem;font-weight:800;color:var(--text);}
.miss-item .mk{font-size:.72rem;color:var(--sub);margin-top:3px;}
</style>
</head>
<body>

<div class="hd">
  <h1>🎯 ITパスポート キーワード→用語当て</h1>
  <p>キーワードを見て正しい用語を答えよう</p>
</div>

<!-- モード切り替え -->
<div class="mode-wrap">
  <button class="mode-btn active" id="btnFlash" onclick="switchMode('flash')">🃏 フラッシュカード</button>
  <button class="mode-btn" id="btnQuiz" onclick="switchMode('quiz')">✅ 4択クイズ</button>
</div>

<!-- カテゴリタブ -->
<div class="tabs" id="tabWrap"></div>

<!-- 進捗 -->
<div class="prog-wrap" id="progWrap">
  <div class="prog-bar-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div>
  <div class="prog-label" id="progLabel"></div>
</div>

<!-- ── フラッシュカードエリア ── -->
<div id="flashMode">
  <div class="flash-area">
    <div class="flash-card" id="flashCard" onclick="revealFlash()">
      <span class="flash-cat" id="fCat"></span>
      <div class="flash-kw" id="fKw"></div>
      <div class="flash-hint">👆 タップして用語を確認</div>
      <div class="flash-ans" id="fAns"></div>
      <div class="flash-desc" id="fDesc"></div>
    </div>
    <div class="flash-nav">
      <button class="nav-btn" id="fPrev" onclick="flashMove(-1)">◀ 前へ</button>
      <button class="flash-result-btn" id="fOk" onclick="markFlash(true)" title="覚えた">✅ 覚えた</button>
      <button class="flash-result-btn ng" id="fNg" onclick="markFlash(false)" title="もう一度">❌ もう一度</button>
      <button class="nav-btn" id="fNext" onclick="flashMove(1)">次へ ▶</button>
    </div>
    <div style="text-align:center;margin-top:10px;">
      <button class="nav-btn" onclick="shuffleFlash()" style="font-size:.75rem;padding:6px 14px;">🔀 シャッフル</button>
      <button class="nav-btn" onclick="resetFlash()" style="font-size:.75rem;padding:6px 14px;margin-left:4px;">🔄 リセット</button>
    </div>
  </div>
</div>

<!-- ── 4択クイズエリア ── -->
<div id="quizMode">
  <div class="quiz-area" id="quizBody">
    <div class="quiz-q">
      <span class="qcat" id="qCat"></span>
      <div class="qtext" id="qKw"></div>
      <div class="qsub">↑ このキーワードが表す用語はどれ？</div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="quiz-fb" id="quizFb">
      <div class="fb-verdict" id="fbVerdict"></div>
      <div id="fbDesc"></div>
    </div>
    <button class="quiz-next" id="quizNext" onclick="nextQuiz()">次の問題 ▶</button>
  </div>
  <div class="score-screen" id="scoreScreen">
    <div class="score-big" id="scoreBig"></div>
    <div class="score-label" id="scoreLabel"></div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="miss-list" id="missList"></div>
    <button class="retry-btn" onclick="startQuiz()">🔄 もう一度</button>
  </div>
</div>

<script>
// ============================================================
// データ
// ============================================================
const DATA = [
  {cat:"セキュリティ",term:"フィッシング",keyword:"偽サイト・偽メールで情報を騙し取る手口",desc:"正規サービスを装ったメール・サイトで、IDやパスワードを入力させて盗む攻撃。"},
  {cat:"セキュリティ",term:"ソーシャルエンジニアリング",keyword:"人間の心理・行動を利用した情報窃取",desc:"電話・なりすまし・肩越し覗き見など、技術ではなく人を騙してパスワード等を入手する手法。"},
  {cat:"セキュリティ",term:"マルウェア",keyword:"悪意のあるソフトウェアの総称",desc:"ウイルス・ワーム・トロイの木馬・ランサムウェアなど、悪意ある目的で作られたソフトの総称。"},
  {cat:"セキュリティ",term:"ランサムウェア",keyword:"ファイルを暗号化して身代金を要求",desc:"感染するとファイルが暗号化され、復号と引き換えに金銭を要求されるマルウェア。"},
  {cat:"セキュリティ",term:"DoS攻撃",keyword:"大量リクエストでサーバをダウンさせる",desc:"サービス妨害攻撃。複数の端末から同時に行うものをDDoS攻撃という。"},
  {cat:"セキュリティ",term:"SQLインジェクション",keyword:"悪意あるSQL文を入力してDBを操作",desc:"Webフォームに不正なSQL命令を入力し、データベースを不正に操作する攻撃。"},
  {cat:"セキュリティ",term:"クロスサイトスクリプティング（XSS）",keyword:"Webに悪意あるスクリプトを埋め込む",desc:"脆弱なWebページに悪意あるスクリプトを埋め込み、利用者のブラウザで実行させる攻撃。"},
  {cat:"セキュリティ",term:"ゼロデイ攻撃",keyword:"パッチ公開前の脆弱性を突く攻撃",desc:"修正プログラムが提供される前（0日目）に脆弱性を悪用する攻撃。"},
  {cat:"セキュリティ",term:"多要素認証（MFA）",keyword:"知識・所持・生体の2種以上を組み合わせ",desc:"パスワード＋スマホ認証など、異なる種類の認証を複数組み合わせてセキュリティを高める。"},
  {cat:"セキュリティ",term:"公開鍵暗号方式",keyword:"暗号化と復号で異なる鍵を使う",desc:"公開鍵で暗号化し、秘密鍵で復号する。鍵を安全に配布できるのが特徴。"},
  {cat:"セキュリティ",term:"デジタル署名",keyword:"秘密鍵で署名して本人確認・改ざん検出",desc:"送信者が秘密鍵で署名し、受信者が公開鍵で検証することで、なりすまし・改ざんを防ぐ。"},
  {cat:"セキュリティ",term:"PKI（公開鍵基盤）",keyword:"認証局が公開鍵の正当性を証明",desc:"認証局（CA）がデジタル証明書を発行し、公開鍵の正当性を保証する仕組み。"},
  {cat:"セキュリティ",term:"VPN",keyword:"公衆網上に仮想的な専用線を構築",desc:"インターネット上に暗号化されたトンネルを作り、安全に通信する技術。"},
  {cat:"セキュリティ",term:"ファイアウォール",keyword:"通信を監視して不正アクセスを遮断",desc:"設定したルールに基づいてネットワーク通信を制御し、不正なアクセスをブロックする装置・ソフト。"},
  {cat:"セキュリティ",term:"IDS／IPS",keyword:"不正侵入を検知・防御するシステム",desc:"IDSは検知のみ、IPSは検知＋自動遮断まで行う不正侵入対策システム。"},
  {cat:"セキュリティ",term:"情報セキュリティの3要素（CIA）",keyword:"機密性・完全性・可用性",desc:"Confidentiality（機密性）・Integrity（完全性）・Availability（可用性）の頭文字。"},
  {cat:"セキュリティ",term:"リスクアセスメント",keyword:"リスクの特定・分析・評価",desc:"情報資産への脅威や脆弱性を洗い出し、リスクの大きさを評価するプロセス。"},
  {cat:"セキュリティ",term:"ISMS",keyword:"情報セキュリティマネジメントシステム",desc:"ISO/IEC 27001が規格。組織全体で情報セキュリティを継続的に維持・改善する仕組み。"},
  {cat:"ネットワーク",term:"IPアドレス",keyword:"ネットワーク上の機器を識別する番号",desc:"インターネット上で機器を特定するための論理アドレス。IPv4は32ビット、IPv6は128ビット。"},
  {cat:"ネットワーク",term:"MACアドレス",keyword:"NICに固定されたハードウェアアドレス",desc:"ネットワークインターフェースカードに製造時に割り当てられた物理アドレス（48ビット）。"},
  {cat:"ネットワーク",term:"DNS",keyword:"ドメイン名をIPアドレスに変換",desc:"ドメイン名（例：google.com）をIPアドレスに変換するサービス。電話帳に相当。"},
  {cat:"ネットワーク",term:"DHCP",keyword:"IPアドレスを自動的に割り当てる",desc:"ネットワーク接続時にIPアドレス等を自動配布するプロトコル。"},
  {cat:"ネットワーク",term:"HTTP／HTTPS",keyword:"Webページの通信プロトコル（S=暗号化）",desc:"HTTPはWebの基本プロトコル。HTTPSはTLSで暗号化した安全版。"},
  {cat:"ネットワーク",term:"TCP/IP",keyword:"インターネット標準の通信プロトコル群",desc:"TCPが信頼性ある通信を、IPがアドレス指定・経路選択を担うプロトコルの組み合わせ。"},
  {cat:"ネットワーク",term:"ルータ",keyword:"異なるネットワーク間でパケットを転送",desc:"IPアドレスを基に最適な経路を選んでパケットを転送する機器。"},
  {cat:"ネットワーク",term:"LAN／WAN",keyword:"LAN=構内、WAN=広域ネットワーク",desc:"LAN（Local Area Network）は建物内、WAN（Wide Area Network）は地理的に広い範囲のネットワーク。"},
  {cat:"ネットワーク",term:"無線LAN（Wi-Fi）",keyword:"電波で機器をネットワーク接続",desc:"IEEE 802.11規格の無線ネットワーク。WPA3などのセキュリティ規格で保護する。"},
  {cat:"ハードウェア",term:"CPU",keyword:"演算・制御を行う中央処理装置",desc:"Central Processing Unit。コンピュータの頭脳にあたり、プログラムの命令を解釈・実行する。"},
  {cat:"ハードウェア",term:"RAM（主記憶）",keyword:"プログラム実行中のデータを一時保存",desc:"電源を切ると消えるが高速な揮発性メモリ。容量が大きいほど多くのプログラムを同時実行できる。"},
  {cat:"ハードウェア",term:"ROM",keyword:"電源を切っても消えない読み取り専用メモリ",desc:"Read Only Memory。BIOSなど起動に必要なプログラムを格納する不揮発性メモリ。"},
  {cat:"ハードウェア",term:"SSD",keyword:"半導体を使った高速ストレージ",desc:"フラッシュメモリを使うストレージ。HDDより高速・耐衝撃だが書き換え寿命がある。"},
  {cat:"ハードウェア",term:"GPU",keyword:"画像処理・並列計算に特化したプロセッサ",desc:"Graphics Processing Unit。AI・機械学習の並列計算にも活用される。"},
  {cat:"ハードウェア",term:"キャッシュメモリ",keyword:"CPUとRAM間の高速バッファ",desc:"CPUと主記憶の速度差を埋めるための高速小容量メモリ。L1/L2/L3の階層がある。"},
  {cat:"データベース",term:"RDBMS",keyword:"表形式でデータを管理するDB",desc:"Relational Database Management System。テーブル間をキーで関連付けて管理する。"},
  {cat:"データベース",term:"SQL",keyword:"データベースを操作するための言語",desc:"Structured Query Language。SELECT・INSERT・UPDATE・DELETEなどの命令でDBを操作する。"},
  {cat:"データベース",term:"主キー（PRIMARY KEY）",keyword:"レコードを一意に識別する列",desc:"テーブル内の各行を唯一に特定する列。NULL不可・重複不可。"},
  {cat:"データベース",term:"外部キー（FOREIGN KEY）",keyword:"別テーブルの主キーを参照する列",desc:"テーブル間の関係を定義し、参照整合性を保つための列。"},
  {cat:"データベース",term:"正規化",keyword:"データの冗長性を排除してテーブルを分割",desc:"データの重複や更新異常を防ぐためにテーブルを適切に分割する設計手法。"},
  {cat:"データベース",term:"ACID特性",keyword:"原子性・一貫性・分離性・耐久性",desc:"トランザクションが満たすべき4つの性質。Atomicity・Consistency・Isolation・Durability。"},
  {cat:"データベース",term:"トランザクション",keyword:"一連のDB操作を1つのまとまりとして扱う",desc:"複数の操作を「すべて成功」か「すべて失敗」として扱う仕組み。COMMITで確定、ROLLBACKで取消。"},
  {cat:"アルゴリズム",term:"二分探索",keyword:"ソート済みデータを半分ずつ絞り込む",desc:"整列済みデータを中央値と比較して範囲を半分にしながら目的の値を探す。O(log n)。"},
  {cat:"アルゴリズム",term:"スタック",keyword:"LIFO（後入れ先出し）のデータ構造",desc:"最後に入れたデータを最初に取り出す。プログラムの関数呼び出し管理などに使われる。"},
  {cat:"アルゴリズム",term:"キュー",keyword:"FIFO（先入れ先出し）のデータ構造",desc:"最初に入れたデータを最初に取り出す。プリンタの印刷待ちなどに使われる。"},

  {cat:"ストラテジ",term:"3C分析",keyword:"顧客・競合・自社の3軸で市場を把握",desc:"Customer・Competitor・Companyの3視点から事業環境を分析する手法。"},

// ============================================================
// 共通ユーティリティ
// ============================================================
const CATS = ["すべて", ...new Set(DATA.map(d=>d.cat))];
let activeCat = "すべて";
let currentMode = "flash";

function getPool(){
  return activeCat === "すべて" ? [...DATA] : DATA.filter(d=>d.cat===activeCat);
}
function shuffle(arr){ return arr.sort(()=>Math.random()-.5); }

// タブ
function buildTabs(){
  const w = document.getElementById("tabWrap");
  w.innerHTML = "";
  CATS.forEach(cat=>{
    const b = document.createElement("button");
    const n = cat==="すべて" ? DATA.length : DATA.filter(d=>d.cat===cat).length;
    b.className = "tab-btn"+(cat===activeCat?" active":"");
    b.textContent = `${cat} (${n})`;
    b.onclick = ()=>{
      activeCat = cat;
      buildTabs();
      if(currentMode==="flash"){ initFlash(); }
      else { startQuiz(); }
    };
    w.appendChild(b);
  });
}

function switchMode(m){
  currentMode = m;
  document.getElementById("btnFlash").className = "mode-btn"+(m==="flash"?" active":"");
  document.getElementById("btnQuiz").className  = "mode-btn"+(m==="quiz"?" active":"");
  document.getElementById("flashMode").style.display = m==="flash"?"block":"none";
  document.getElementById("quizMode").style.display  = m==="quiz"?"block":"none";
  if(m==="flash"){ initFlash(); }
  else{ startQuiz(); }
}

function setProgress(cur, total){
  const pct = total ? Math.round(cur/total*100) : 0;
  document.getElementById("progBar").style.width = pct+"%";
  document.getElementById("progLabel").innerHTML = `<span>${cur}</span> / ${total} 問`;
}

// ============================================================
// フラッシュカード
// ============================================================
let fDeck = [];
let fIdx  = 0;
let fOkSet = new Set();

function initFlash(){
  fDeck = shuffle(getPool());
  fIdx  = 0;
  fOkSet.clear();
  showFlashCard();
}

function showFlashCard(){
  if(!fDeck.length) return;
  const d = fDeck[fIdx];
  const card = document.getElementById("flashCard");
  card.classList.remove("revealed");
  document.getElementById("fCat").textContent  = d.cat;
  document.getElementById("fKw").textContent   = d.keyword;
  document.getElementById("fAns").textContent  = d.term;
  document.getElementById("fDesc").textContent = d.desc;
  document.getElementById("fPrev").disabled = fIdx===0;
  document.getElementById("fNext").disabled = fIdx===fDeck.length-1;
  setProgress(fIdx+1, fDeck.length);
}

function revealFlash(){
  document.getElementById("flashCard").classList.toggle("revealed");
}

function flashMove(dir){
  fIdx = Math.max(0, Math.min(fDeck.length-1, fIdx+dir));
  showFlashCard();
}

function markFlash(ok){
  const term = fDeck[fIdx].term;
  if(ok){ fOkSet.add(term); } else { fOkSet.delete(term); }
  if(fIdx < fDeck.length-1){ fIdx++; showFlashCard(); }
  else {
    // 最後→未覚え枚数を表示
    const ng = fDeck.length - fOkSet.size;
    alert(`お疲れさまでした！\n覚えた: ${fOkSet.size}語　/ もう一度: ${ng}語`);
    if(ng > 0){
      // もう一度リストに戻す
      fDeck = shuffle(fDeck.filter(d=>!fOkSet.has(d.term)));
      fIdx = 0;
      showFlashCard();
    }
  }
}

function shuffleFlash(){
  fDeck = shuffle(getPool());
  fIdx  = 0;
  fOkSet.clear();
  showFlashCard();
}
function resetFlash(){ initFlash(); }

// ============================================================
// 4択クイズ
// ============================================================
let qPool    = [];
let qIdx     = 0;
let qScore   = 0;
let qMiss    = [];
let qAnswered = false;

function startQuiz(){
  document.getElementById("quizBody").style.display    = "block";
  document.getElementById("scoreScreen").style.display = "none";
  document.getElementById("scoreScreen").className     = "score-screen";

  qPool     = shuffle(getPool());
  qIdx      = 0;
  qScore    = 0;
  qMiss     = [];
  showQuiz();
}

function showQuiz(){
  if(qIdx >= qPool.length){ showScore(); return; }
  qAnswered = false;
  const d = qPool[qIdx];

  document.getElementById("qCat").textContent = d.cat;
  document.getElementById("qKw").textContent  = d.keyword;

  // 選択肢：正解＋同カテゴリから3つ（足りなければ他カテゴリ）
  const sameCat = DATA.filter(x=>x.cat===d.cat && x.term!==d.term);
  const others  = DATA.filter(x=>x.term!==d.term);
  let pool3 = shuffle(sameCat).slice(0,3);
  if(pool3.length < 3){
    const extra = shuffle(others.filter(x=>!pool3.includes(x))).slice(0,3-pool3.length);
    pool3 = pool3.concat(extra);
  }
  const choices = shuffle([d, ...pool3]);

  const box = document.getElementById("choices");
  box.innerHTML = "";
  choices.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "choice-btn";
    btn.textContent = c.term;
    btn.onclick = ()=>answerQuiz(c.term, d.term, d.desc, btn);
    box.appendChild(btn);
  });

  const fb = document.getElementById("quizFb");
  fb.className = "quiz-fb";
  fb.style.display = "none"; // reset
  const nxt = document.getElementById("quizNext");
  nxt.className = "quiz-next";

  setProgress(qIdx, qPool.length);
}

function answerQuiz(chosen, correct, desc, btn){
  if(qAnswered) return;
  qAnswered = true;

  const allBtns = document.querySelectorAll(".choice-btn");
  allBtns.forEach(b=>{
    b.disabled = true;
    if(b.textContent === correct) b.classList.add("correct");
  });

  const fb = document.getElementById("quizFb");
  const verdict = document.getElementById("fbVerdict");
  const fbDesc  = document.getElementById("fbDesc");

  if(chosen === correct){
    btn.classList.add("correct");
    fb.className = "quiz-fb show ok";
    verdict.textContent = "✅ 正解！";
    qScore++;
  } else {
    btn.classList.add("wrong");
    fb.className = "quiz-fb show ng";
    verdict.textContent = "❌ 不正解";
    qMiss.push({term:correct, keyword: qPool[qIdx].keyword});
  }
  fbDesc.textContent = desc;
  fb.style.display = "block";

  const nxt = document.getElementById("quizNext");
  nxt.className = "quiz-next show";
  nxt.textContent = qIdx===qPool.length-1 ? "結果を見る 🎉" : "次の問題 ▶";
}

function nextQuiz(){
  qIdx++;
  showQuiz();
}

function showScore(){
  document.getElementById("quizBody").style.display    = "none";
  const sc = document.getElementById("scoreScreen");
  sc.className = "score-screen show";

  const pct = Math.round(qScore/qPool.length*100);
  document.getElementById("scoreBig").textContent   = `${pct}%`;
  document.getElementById("scoreLabel").textContent = `${qScore} / ${qPool.length} 問正解`;

  let msg = "";
  if(pct===100)     msg = "🎉 完璧！全問正解です！";
  else if(pct>=80)  msg = "👏 素晴らしい！あと少し！";
  else if(pct>=60)  msg = "📚 もう少し！苦手を確認しよう";
  else              msg = "💪 一緒に頑張ろう！復習しよう";
  document.getElementById("scoreMsg").textContent = msg;

  setProgress(qPool.length, qPool.length);

  const ml = document.getElementById("missList");
  if(qMiss.length > 0){
    ml.innerHTML = `<h3>❌ もう一度確認しよう（${qMiss.length}語）</h3>`;
    qMiss.forEach(m=>{
      ml.innerHTML += `<div class="miss-item"><div class="mt">✏️ ${m.term}</div><div class="mk">${m.keyword}</div></div>`;
    });
  } else {
    ml.innerHTML = "";
  }
}

// ============================================================
// 初期化
// ============================================================
buildTabs();
initFlash();
</script>
