<!DOCTYPE html>

<title>病理学 全12単元 完全対策</title>
<style>
:root{--bg:#F4F3EF;--sur:#FFF;--sur2:#EDECEA;--bdr:#D5D3CC;--tx:#191815;--sub:#6A6860;--ac:#1F4E8C;--acl:#E6EDF8;--acd:#163A6B;--ok:#236B2E;--okb:#E8F2EA;--ng:#8B1A1A;--ngb:#F5E8E8;--yb:#FFF3CD;--yc:#7A5C00;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;color:var(--tx);min-height:100vh}
.hd{background:var(--ac);padding:.85rem 1.2rem;display:flex;justify-content:space-between;align-items:center}
.hd-t{color:#fff;font-size:14px;font-weight:600}.hd-s{color:rgba(255,255,255,.65);font-size:11px;margin-top:2px}
.hd-r{text-align:right}.hd-pct{color:#fff;font-size:24px;font-weight:700;line-height:1}.hd-pl{color:rgba(255,255,255,.65);font-size:10px}
#prog-wrap{padding:.65rem 1.2rem .2rem}
.pb-r{display:flex;justify-content:space-between;margin-bottom:4px}.pb-l{font-size:11px;color:var(--sub)}
.pb{height:3px;background:var(--bdr);border-radius:2px;overflow:hidden}.pf{height:100%;background:var(--ac);border-radius:2px;transition:width .3s}
#mode-bar{display:flex;gap:5px;padding:.5rem 1.2rem;flex-wrap:wrap}
.mbtn{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--bdr);background:var(--sur);color:var(--sub);cursor:pointer;white-space:nowrap}
.mbtn.on{background:var(--acl);color:var(--ac);border-color:var(--ac)}
#cat-bar{display:flex;gap:5px;padding:0 1.2rem .5rem;flex-wrap:wrap}
.fbtn{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--bdr);background:var(--sur);color:var(--sub);cursor:pointer;white-space:nowrap}
.fbtn.on{background:var(--yb);color:var(--yc);border-color:#C8A82A}
#main{padding:0 1.2rem 2rem}
.qcard{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:1rem 1.15rem;margin-bottom:.85rem}
.qmeta{font-size:10px;color:var(--sub);margin-bottom:.45rem}.cpill{background:var(--acl);color:var(--ac);border-radius:10px;padding:2px 7px;font-size:10px}
.past{background:#FEF0CD;color:#7A5C00;border-radius:10px;padding:2px 7px;font-size:10px;border:1px solid #C8A82A;margin-left:4px}
.qtext{font-size:15px;line-height:1.7;font-weight:500}
#choices{display:flex;flex-direction:column;gap:6px}
.ch{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border:1px solid var(--bdr);border-radius:8px;background:var(--sur);cursor:pointer;text-align:left;font-size:13.5px;line-height:1.55;color:var(--tx);width:100%}
.ch:hover{border-color:var(--ac);background:var(--acl)}
.ch.ok{border-color:var(--ok);background:var(--okb);color:var(--ok)}.ch.ok .cn{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.ng{border-color:var(--ng);background:var(--ngb);color:var(--ng)}.ch.ng .cn{background:var(--ng);border-color:var(--ng);color:#fff}
.ch.rv{border-color:var(--ok);background:var(--okb);color:var(--ok)}.ch.rv .cn{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.dis{cursor:default}.ch.dis:hover{border-color:inherit;background:inherit}
.ch.ok.dis:hover{border-color:var(--ok);background:var(--okb)}.ch.ng.dis:hover{border-color:var(--ng);background:var(--ngb)}.ch.rv.dis:hover{border-color:var(--ok);background:var(--okb)}
.cn{width:20px;height:20px;min-width:20px;border-radius:50%;background:var(--sur2);border:1px solid var(--bdr);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
#exp-box{margin-top:.85rem;padding:10px 12px;border-radius:8px;background:var(--sur2);border-left:3px solid var(--ac);font-size:12.5px;line-height:1.7;color:#3A3830;display:none}
#next-btn{display:none;width:100%;margin-top:.85rem;padding:10px;border-radius:8px;background:var(--ac);color:#fff;border:none;font-size:13px;cursor:pointer}
.res{background:var(--sur);border:1px solid var(--bdr);border-radius:10px;padding:1.75rem 1.25rem;text-align:center}
.rs{font-size:52px;font-weight:700;color:var(--ac)}.rl{font-size:13px;color:var(--sub);margin:.2rem 0 1.1rem}
.rbd{display:flex;justify-content:center;gap:18px;margin-bottom:1.25rem}
.ri{text-align:center}.rin{font-size:22px;font-weight:600}.ril{font-size:11px;color:var(--sub)}
.ri.c .rin{color:var(--ok)}.ri.w .rin{color:var(--ng)}
.rbs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.rbtn{padding:10px 16px;border-radius:8px;border:1px solid var(--bdr);background:var(--sur);font-size:13px;cursor:pointer;color:var(--tx)}
.rbtn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>
<body>
<div class="hd">
  <div><div class="hd-t">病理学 全12単元 完全対策</div><div class="hd-s">152問・4択・過去問傾向完全反映</div></div>

</div>

<script>
const ALL = [{"c": "①病理学とは", "p": 0, "q": "病理学の定義として最も適切なものはどれか。", "a": 2, "cs": ["臓器の外科的摘出と機能回復を研究する学問", "疾病の症状と薬物療法の効果を研究する学問", "疾病の原因・発生機序・形態変化・機能異常を研究する学問", "生体の正常な構造と機能を研究する学問"], "ep": "<strong>病理学</strong>は疾病の原因・発生機序・形態変化・機能異常を研究する学問。確定診断（最終診断）に不可欠。正常構造を研究するのは解剖学・生理学。"}, {"c": "①病理学とは", "p": 1, "q": "手術中に迅速に行う病理診断に使用する標本はどれか。", "a": 3, "cs": ["ホルマリン固定パラフィン包埋標本", "グルタールアルデヒド固定標本", "H-E染色永久標本", "凍結標本（凍結切片）"], "ep": "術中迅速診断には<strong>凍結標本</strong>を使用。通常の工程（固定→脱水→包埋→切片作製）では数日かかるが、凍結切片は30分以内に診断できる。過去問出題済み。"}, {"c": "①病理学とは", "p": 1, "q": "献体を用いた全身の系統的解剖を何というか。", "a": 0, "cs": ["系統解剖", "病理解剖（剖検）", "法医解剖", "臨床解剖"], "ep": "<strong>系統解剖</strong>は献体を用いた医学教育目的の解剖。病理解剖（剖検）は死因解明目的、法医解剖は犯罪・事故の死因究明目的。過去問出題済み。"}, {"c": "①病理学とは", "p": 0, "q": "H-E染色でヘマトキシリンに染まるものはどれか。", "a": 1, "cs": ["細胞質（赤色）", "核（青紫色）", "細菌（黒色）", "脂肪滴（黄色）"], "ep": "H-E染色では<strong>ヘマトキシリン→核（青紫）、エオジン→細胞質（赤色）</strong>に染まる。最も基本的な組織染色法で核と細胞質を明瞭に区別できる。"}, {"c": "①病理学とは", "p": 1, "q": "組織を薄くスライスする器具はどれか。", "a": 2, "cs": ["遠心分離機", "ホモジナイザー", "ミクロトーム（マイクロトーム）", "恒温槽"], "ep": "<strong>ミクロトーム</strong>はパラフィン包埋された組織ブロックを数μmの薄切り切片に切り出す器具。病理標本作製の「切片作製」工程で使用する。過去問出題済み。"}, {"c": "①病理学とは", "p": 0, "q": "病理標本作製の工程を正しい順番に並べたものはどれか。", "a": 2, "cs": ["脱水→固定→包埋→切片作製→染色", "固定→包埋→脱水→切片作製→染色", "固定→脱水→包埋→切片作製→染色", "染色→固定→脱水→包埋→切片作製"], "ep": "病理標本作製は<strong>固定（ホルマリン）→脱水→包埋（パラフィン）→切片作製（ミクロトーム）→染色（H-E）</strong>の順。固定で形態を保つことが最初の重要工程。"}, {"c": "①病理学とは", "p": 0, "q": "代表的な固定液として正しいものはどれか。", "a": 1, "cs": ["アルコール（エタノール）", "ホルマリン（ホルムアルデヒド）", "生理食塩水", "グリセリン"], "ep": "<strong>ホルマリン（ホルムアルデヒド）</strong>が最も代表的な固定液。タンパク質を変性・架橋させて組織の形態を保持する。固定の目的は組織の変性を防ぎ形態を保つこと。"}, {"c": "①病理学とは", "p": 0, "q": "生検（biopsy）の定義として正しいものはどれか。", "a": 0, "cs": ["生体から組織を採取して病理検査を行うこと", "死後に全身を解剖して死因を明らかにすること", "手術で摘出した臓器を病理検査すること", "手術中に凍結切片で迅速診断すること"], "ep": "<strong>生検（biopsy）</strong>は生体から組織を採取して病理検査を行うこと。内視鏡生検・針生検・切除生検などがある。剖検は死後の解剖、術中迅速診断は凍結切片を使用する。"}, {"c": "①病理学とは", "p": 0, "q": "病理診断が「最終診断（確定診断）」となることが多い理由はどれか。", "a": 3, "cs": ["画像診断より安価だから", "外科的治療と同時に行えるから", "患者への侵襲が最も少ないから", "組織・細胞の形態学的変化を直接観察して診断するから"], "ep": "病理診断は組織・細胞の形態学的変化を<strong>顕微鏡で直接観察</strong>して診断するため、最も確実な最終診断（確定診断）となる。「病理診断＝最終診断」は病理学の根幹概念。"}, {"c": "①病理学とは", "p": 0, "q": "剖検（病理解剖）の主な目的として正しいものはどれか。", "a": 1, "cs": ["生前の治療効果を評価するための手術", "手術中の迅速診断を行うこと", "生体から組織を採取して診断すること", "死後に全身を調べ死因や病態を明らかにすること"], "ep": "<strong>剖検（病理解剖）</strong>は死後に全身を調べ死因や病態を明らかにすること。医療の検証・教育にも重要な意義がある。生前の治療が適切だったかを確認する「医療の鏡」とも呼ばれる。"}, {"c": "②病因論", "p": 1, "q": "イタイイタイ病の原因物質はどれか。", "a": 1, "cs": ["有機水銀（メチル水銀）", "カドミウム", "一酸化炭素", "珪酸（シリカ）"], "ep": "<strong>イタイイタイ病</strong>はカドミウムによる富山県神通川流域の公害病。骨軟化症・慢性腎炎が主症状。有機水銀→水俣病、珪酸→珪肺、一酸化炭素→CO中毒。過去問出題済み。"}, {"c": "②病因論", "p": 1, "q": "高山病の発生に関わる物理的因子はどれか。", "a": 3, "cs": ["温度（低温）", "機械的外力", "放射線", "気圧（低気圧）"], "ep": "高山病は高所での<strong>低気圧（気圧低下）</strong>により血中酸素分圧が低下して起きる。潜函病（減圧症）も気圧が原因だが逆方向（高圧→低圧への急激な変化）。過去問出題済み。"}, {"c": "②病因論", "p": 1, "q": "一酸化炭素のヘモグロビンへの結合力は酸素の何倍か。", "a": 2, "cs": ["20〜40倍", "100〜150倍", "200〜400倍", "500〜1000倍"], "ep": "一酸化炭素（CO）のヘモグロビンへの結合力は酸素の<strong>200〜400倍</strong>。低濃度でも組織窒息を起こす。CO中毒の皮膚は桜色を呈する。過去問出題済み。"}, {"c": "②病因論", "p": 1, "q": "日本の四大公害病に含まれないものはどれか。", "a": 3, "cs": ["イタイイタイ病", "四日市喘息", "第二水俣病", "珪肺"], "ep": "四大公害病は<strong>イタイイタイ病・四日市喘息・水俣病・第二水俣病</strong>の4つ。珪肺はシリカ粉塵による職業性疾患で公害病ではない。四日市喘息の原因は亜硫酸ガス。"}, {"c": "②病因論", "p": 1, "q": "母体から胎児への感染経路を何というか。", "a": 0, "cs": ["垂直感染", "水平感染", "飛沫感染", "空気感染"], "ep": "<strong>垂直感染</strong>は親から子への感染（経胎盤感染・産道感染・母乳感染）。水平感染は個体間の感染（接触・飛沫・空気感染）。過去問出題済み。"}, {"c": "②病因論", "p": 0, "q": "サリドマイドによる胎児障害はどれか。", "a": 1, "cs": ["先天性心疾患・難聴・白内障", "四肢の低形成（短肢症・無肢症）", "精神発達遅滞", "小頭症・精神発達遅滞"], "ep": "サリドマイドは1950〜60年代の催眠鎮静薬で、妊娠初期の服用→<strong>四肢の低形成（短肢症・無肢症）</strong>。先天性心疾患・難聴・白内障は風疹ウイルスによる先天性風疹症候群。"}, {"c": "②病因論", "p": 0, "q": "アニリン（化学物質）による職業癌はどれか。", "a": 2, "cs": ["肺癌", "皮膚癌", "膀胱癌", "悪性中皮腫"], "ep": "アニリンは染料工業で使用される化学物質で<strong>膀胱癌</strong>を起こす職業癌。タール→皮膚癌・肺癌、アスベスト→悪性中皮腫・肺癌との区別が重要。過去問出題済み。"}, {"c": "②病因論", "p": 0, "q": "疾病の内因に含まれないものはどれか。", "a": 3, "cs": ["年齢（老齢・小児期）", "性差（男女差）", "遺伝的素因", "化学的因子（薬物・毒物）"], "ep": "内因は体内にある発病の素因：年齢・性差・民族・遺伝・臓器特性など。<strong>化学的因子（薬物・毒物）</strong>は体外からの原因（外因）に分類される。"}, {"c": "②病因論", "p": 0, "q": "医原性疾患（医原病）の定義として正しいものはどれか。", "a": 1, "cs": ["原因不明の状態（特発性）", "医療行為によって新たに生じた疾患", "職業従事者に生じる特定の疾患", "患者自身の行動によって生じた疾患"], "ep": "<strong>医原性疾患（医原病）</strong>は医療行為によって生じる疾患。例：副腎皮質ステロイドの長期投与→骨粗鬆症・感染症、抗癌剤→骨髄抑制。原因不明は特発性、職業由来は職業病。"}, {"c": "②病因論", "p": 0, "q": "風疹ウイルスによる胎児障害（先天性風疹症候群）の3大症状はどれか。", "a": 0, "cs": ["先天性心疾患・難聴・白内障", "四肢の低形成・精神発達遅滞・小頭症", "骨変形・夜盲症・出血傾向", "腎奇形・心奇形・口唇裂"], "ep": "先天性風疹症候群の3大症状は<strong>先天性心疾患・難聴・白内障</strong>。妊娠初期（特に4週以内）の感染で重篤な胎児障害が生じる。STとして難聴は言語発達障害の原因として重要。"}, {"c": "③先天異常・染色体", "p": 1, "q": "ダウン症候群（21トリソミー）の常染色体は何本か。", "a": 2, "cs": ["44本", "46本", "45本", "47本"], "ep": "ダウン症候群の染色体は計47本（常染色体45本＋性染色体2本）。<strong>常染色体だけで数えると45本</strong>（21番が3本のため22対＋1＝45本）。過去問出題済み（頻出の引っかけ）。"}, {"c": "③先天異常・染色体", "p": 1, "q": "血友病の遺伝様式はどれか。", "a": 2, "cs": ["常染色体顕性遺伝", "常染色体潜性遺伝", "伴性潜性遺伝", "多因子遺伝"], "ep": "血友病は<strong>伴性潜性遺伝（X染色体連鎖劣性）</strong>。血友病A＝第Ⅷ因子欠損、血友病B＝第Ⅸ因子欠損。女性は保因者になりやすく男性に多く発症する。過去問出題済み。"}, {"c": "③先天異常・染色体", "p": 0, "q": "ターナー症候群の染色体表現として正しいものはどれか。", "a": 0, "cs": ["45,X", "47,XXY", "47,XY,+21", "46,XX"], "ep": "<strong>ターナー症候群</strong>は45,X（性染色体が1本のみ）。女性の性染色体異常で、低身長・翼状頸・外反肘・内性器の形成不全（不妊症・原発性無月経）が特徴。頻度は1例/女児2000出産。"}, {"c": "③先天異常・染色体", "p": 0, "q": "クラインフェルター症候群の染色体表現として正しいものはどれか。", "a": 1, "cs": ["45,X", "47,XXY", "47,XY,+21", "46,XY"], "ep": "<strong>クラインフェルター症候群</strong>は47,XXY（X染色体が1本多い）。男性の性染色体異常で、男性性器の形成不全・女性化乳房・長い四肢が特徴。頻度は1例/男児500〜1000出産。"}, {"c": "③先天異常・染色体", "p": 0, "q": "マルファン症候群の遺伝様式と原因として正しいものはどれか。", "a": 1, "cs": ["常染色体潜性遺伝・血液凝固第Ⅷ因子の欠損", "常染色体顕性遺伝・フィブリリン遺伝子異常→結合組織の脆弱化", "伴性潜性遺伝・ジストロフィン蛋白の欠損", "多因子遺伝・尿酸の代謝異常"], "ep": "マルファン症候群は<strong>常染色体顕性遺伝</strong>、<strong>フィブリリン遺伝子の異常→結合組織の脆弱化</strong>→骨格系（クモ状指・長い四肢）・心血管系（解離性大動脈瘤）・眼（水晶体偏位）の障害。"}, {"c": "③先天異常・染色体", "p": 0, "q": "フェニルケトン尿症の遺伝様式と主な症状の組み合わせはどれか。", "a": 3, "cs": ["常染色体顕性遺伝・解離性大動脈瘤", "伴性潜性遺伝・血液凝固障害", "多因子遺伝・高血糖", "常染色体潜性遺伝・精神発達遅滞"], "ep": "フェニルケトン尿症は<strong>常染色体潜性遺伝</strong>。フェニルアラニン分解酵素活性の低下→脳への蓄積→<strong>精神発達遅滞</strong>。新生児マス・スクリーニング対象疾患。"}, {"c": "③先天異常・染色体", "p": 0, "q": "先天性風疹症候群はどの時期の感染で最も重篤な障害が生じるか。", "a": 0, "cs": ["妊娠初期（特に妊娠4週以内）", "妊娠中期（妊娠15〜22週）", "妊娠後期（妊娠28週以降）", "分娩直後（産道通過時）"], "ep": "風疹ウイルスは<strong>妊娠初期（特に4週以内）</strong>の感染で最も重篤な先天性心疾患・難聴・白内障が生じる。妊娠週数が進むほど胎児障害のリスクは低下する（器官形成期が最も感受性高い）。"}, {"c": "③先天異常・染色体", "p": 0, "q": "先天異常・奇形の出生頻度はどれくらいか。", "a": 1, "cs": ["約1%（軽度〜重度すべてを含む）", "約4%（軽度〜重度すべてを含む）", "約10%（軽度〜重度すべてを含む）", "約20%（軽度〜重度すべてを含む）"], "ep": "先天異常・奇形を認める子の出生頻度は<strong>約4%</strong>（軽度〜重度すべてを含む）。頻度の高い奇形は心室中隔欠損症・口唇裂/口蓋裂・ダウン症候群。"}, {"c": "③先天異常・染色体", "p": 0, "q": "ダウン症候群の臨床的特徴として含まれないものはどれか。", "a": 3, "cs": ["平坦な顔貌・眼裂上斜位", "舌挺出・筋緊張低下", "猿線（単一手掌横紋）", "水晶体偏位・解離性大動脈瘤"], "ep": "ダウン症候群の特徴：平坦な顔貌・眼裂上斜位・舌挺出・猿線・精神発育遅延・先天性心奇形・筋緊張低下・臍ヘルニア。<strong>水晶体偏位・解離性大動脈瘤</strong>はマルファン症候群の特徴。"}, {"c": "③先天異常・染色体", "p": 0, "q": "口唇裂・口蓋裂の発生原因と問題点の組み合わせで正しいものはどれか。", "a": 2, "cs": ["胎児期のHPV感染・聴覚障害が主", "染色体異常（トリソミー）・精神発達遅滞が主", "顎顔面形成期の癒合不全・哺乳力低下・構音障害・不正咬合など", "出生後の栄養障害・骨変形が主"], "ep": "口唇裂・口蓋裂は<strong>顎顔面・口腔領域の形成期における癒合不全</strong>。問題点：哺乳力低下・審美性低下・<strong>構音障害</strong>・上顎の発育障害・不正咬合・滲出性中耳炎。STとして構音障害への対応が重要。"}, {"c": "④代謝障害・退行性病変", "p": 1, "q": "くる病の主な病態はどれか。", "a": 0, "cs": ["骨変形（骨の石灰化障害）", "夜盲症（暗順応障害）", "出血傾向（凝固障害）", "巨赤芽球性貧血"], "ep": "くる病はビタミンD欠乏→骨の石灰化障害→<strong>骨変形</strong>（O脚・X脚など）。夜盲症＝ビタミンA欠乏、出血傾向＝ビタミンK欠乏、巨赤芽球性貧血＝ビタミンB12・葉酸欠乏。過去問出題済み。"}, {"c": "④代謝障害・退行性病変", "p": 1, "q": "膵臓B（β）細胞が障害されて生じる糖尿病の型はどれか。", "a": 0, "cs": ["インスリン依存型（1型糖尿病）", "インスリン非依存型（2型糖尿病）", "続発性糖尿病", "妊娠糖尿病"], "ep": "膵臓B細胞の障害でインスリンが産生されないのが<strong>インスリン依存型（1型）</strong>。2型は末梢細胞のレセプターが減少しインスリンが効きにくい（インスリン非依存型）。過去問出題済み。"}, {"c": "④代謝障害・退行性病変", "p": 1, "q": "閉塞性黄疸（肝後性黄疸）で増加するビリルビンはどれか。", "a": 1, "cs": ["間接ビリルビン", "直接ビリルビン", "ウロビリノゲン", "ステルコビリン"], "ep": "肝後性黄疸は胆道閉塞→肝臓で処理された<strong>直接（抱合型）ビリルビン</strong>が排泄できず増加。間接ビリルビン増加は肝前性黄疸（溶血性黄疸）。過去問出題済み。"}, {"c": "④代謝障害・退行性病変", "p": 1, "q": "水腎症で腎実質に起こる萎縮の種類はどれか。", "a": 2, "cs": ["廃用性萎縮", "老人性萎縮", "圧迫性萎縮", "神経性萎縮"], "ep": "水腎症は尿路閉塞→尿による腎盂内圧上昇→<strong>圧迫性萎縮</strong>（腎実質が圧迫されて萎縮）。廃用性萎縮は機能停止による萎縮（寝たきりの骨格筋など）。過去問出題済み。"}, {"c": "④代謝障害・退行性病変", "p": 1, "q": "肝臓で作られたコレステロールを末梢細胞へ運ぶリポタンパクはどれか。", "a": 0, "cs": ["LDL（低比重リポタンパク）", "HDL（高比重リポタンパク）", "VLDL（超低比重リポタンパク）", "カイロミクロン"], "ep": "<strong>LDL（悪玉コレステロール）</strong>が肝臓から末梢細胞へコレステロールを運ぶ。HDL（善玉）は末梢から肝臓へ逆運搬。LDL過剰が動脈硬化の原因となる。過去問出題済み。"}, {"c": "④代謝障害・退行性病変", "p": 1, "q": "凝固壊死の代表的な疾患はどれか。", "a": 1, "cs": ["脳梗塞（脳軟化症）", "心筋梗塞", "肺膿瘍", "腎盂腎炎"], "ep": "<strong>凝固壊死</strong>は高度のタンパク質変性による壊死で<strong>心筋梗塞</strong>が代表。脳梗塞は高度の自己融解による<strong>融解壊死（脳軟化症）</strong>が代表。両者の区別は国試頻出。過去問出題済み。"}, {"c": "④代謝障害・退行性病変", "p": 0, "q": "痛風の特徴として正しいものはどれか。", "a": 3, "cs": ["カルシウムが関節内に沈着し急性炎症を起こす", "免疫複合体が関節滑膜に沈着しパンヌスを形成する", "エストロゲン減少により骨量が低下する", "高尿酸血症により尿酸塩が関節・皮下に沈着し炎症を起こす"], "ep": "<strong>痛風</strong>は50歳代・男性に多く、<strong>高尿酸血症→尿酸塩が関節（母趾など）・皮下に沈着→炎症</strong>。慢性期に痛風結節を形成。カルシウム沈着は偽痛風、パンヌス形成は関節リウマチの特徴。"}, {"c": "④代謝障害・退行性病変", "p": 0, "q": "糖尿病の三大細小血管障害はどれか。", "a": 2, "cs": ["脳梗塞・心筋梗塞・大動脈瘤", "高血圧・脂質異常症・肥満", "糖尿病性腎症・糖尿病性網膜症・糖尿病性神経障害", "壊疽・感染症・低血糖"], "ep": "糖尿病の<strong>三大細小血管障害：糖尿病性腎症・糖尿病性網膜症・糖尿病性神経障害</strong>。脳梗塞・心筋梗塞は大血管障害。STとして嚥下障害・構音障害への影響も重要。"}, {"c": "④代謝障害・退行性病変", "p": 0, "q": "壊死とアポトーシスの違いとして正しいものはどれか。", "a": 1, "cs": ["壊死はプログラムされた細胞死、アポトーシスは偶発的な細胞死", "壊死は偶発的・受動的、アポトーシスはプログラムされた自発的な細胞死", "壊死は細胞1個ずつ起きる、アポトーシスは組織ごと起きる", "壊死はDNAが断片化する、アポトーシスはタンパク質が変性する"], "ep": "<strong>壊死</strong>＝偶発的・受動的・組織ごと（炎症を伴う）。<strong>アポトーシス</strong>＝プログラムされた・自発的・細胞ごと（DNAが断片化・炎症を伴わない）。発生過程や腫瘍治療の根拠として重要。"}, {"c": "④代謝障害・退行性病変", "p": 0, "q": "廃用性萎縮の代表例として正しいものはどれか。", "a": 3, "cs": ["加齢による全身の諸臓器の萎縮", "尿路閉塞による腎実質の萎縮", "閉経後の子宮・卵巣の縮小", "長期臥床による骨格筋の萎縮"], "ep": "<strong>廃用性萎縮</strong>は組織の機能停止→萎縮。代表例：<strong>長期臥床による骨格筋の萎縮（寝たきり）</strong>。加齢→老人性萎縮、尿路閉塞→圧迫性萎縮、閉経後の子宮→生理的萎縮に分類される。"}, {"c": "④代謝障害・退行性病変", "p": 0, "q": "印環細胞と最も関連する疾患はどれか。", "a": 2, "cs": ["肺腺癌", "大腸癌（腺癌）", "胃癌", "膀胱移行上皮癌"], "ep": "<strong>印環細胞</strong>は細胞質内に粘液が貯留し核が偏在した細胞（印鑑の輪のように見える）。主に<strong>胃癌（低分化型腺癌）</strong>で観察される。クルーケンベルグ腫瘍（転移性卵巣癌）にも見られる。"}, {"c": "④代謝障害・退行性病変", "p": 0, "q": "三大栄養素の欠乏・代謝異常に関する組み合わせで正しいものはどれか。", "a": 0, "cs": ["蛋白質欠乏→低アルブミン血症・浮腫　脂質異常→動脈硬化症　糖質代謝異常→糖尿病", "蛋白質欠乏→高血糖　脂質異常→骨軟化症　糖質代謝異常→脂肪肝", "蛋白質欠乏→骨粗鬆症　脂質異常→低血糖　糖質代謝異常→痛風", "蛋白質欠乏→貧血のみ　脂質異常→感染症　糖質代謝異常→壊血病"], "ep": "三大栄養素の代謝障害：<strong>蛋白質欠乏→低アルブミン血症→浮腫、脂質異常→動脈硬化症・黄色腫、糖質代謝異常→糖尿病</strong>。肝硬変では蛋白質合成障害により低アルブミン→腹水・浮腫が生じる。"}, {"c": "⑤進行性病変", "p": 1, "q": "細胞の容積が増加する変化を何というか。", "a": 2, "cs": ["過形成", "萎縮", "肥大", "化生"], "ep": "<strong>肥大</strong>は細胞の容積増加、過形成は細胞数の増加。どちらも結果として臓器が大きくなる。萎縮は容積減少、化生は別の種類の細胞への置換。過去問出題済み。"}, {"c": "⑤進行性病変", "p": 1, "q": "外科手術の清潔な切開創に起こる治癒形式はどれか。", "a": 0, "cs": ["一次治癒", "二次治癒", "肉芽治癒", "瘢痕治癒"], "ep": "<strong>一次治癒</strong>は創縁が密着し無菌的、肉芽組織・瘢痕が少ない。二次治癒は創縁が離れ感染を伴い肉芽組織が多く瘢痕が残る。過去問出題済み。"}, {"c": "⑤進行性病変", "p": 1, "q": "肉芽組織の主要な構成要素の組み合わせはどれか。", "a": 3, "cs": ["好中球と肥満細胞", "形質細胞とマクロファージ", "好酸球と好塩基球", "線維芽細胞と新生毛細血管"], "ep": "肉芽組織の主要構成要素は<strong>線維芽細胞（膠原線維形成）と新生毛細血管（結合組織増殖を促進）</strong>に炎症細胞（マクロファージなど）が加わる。経過とともに膠原線維化し瘢痕組織となる。過去問出題済み。"}, {"c": "⑤進行性病変", "p": 0, "q": "再生できない組織はどれか。", "a": 2, "cs": ["皮膚の表皮", "消化管粘膜上皮", "心筋", "骨髄造血細胞"], "ep": "<strong>心筋・中枢神経（脳）・水晶体・エナメル質</strong>は再生できない（不可逆的）。皮膚表皮・消化管粘膜・骨髄造血細胞は生理的再生が盛ん。STとして脳の再生能がないことは神経リハビリの根拠に直結。"}, {"c": "⑤進行性病変", "p": 0, "q": "腸上皮化生の説明として正しいものはどれか。", "a": 1, "cs": ["腸粘膜が胃粘膜に置換される現象", "胃粘膜上皮が腸上皮に置換される現象（ピロリ菌関連・胃癌リスク↑）", "気管支の線毛上皮が重層扁平上皮に置換される現象", "食道の扁平上皮が円柱上皮に置換される現象"], "ep": "<strong>腸上皮化生</strong>は胃粘膜上皮が腸上皮に置換される化生（置換現象）。ヘリコバクター・ピロリ菌感染と関連し、胃癌リスクを高める前癌状態。扁平上皮化生（気管支→重層扁平上皮・タバコ関連）と区別。"}, {"c": "⑤進行性病変", "p": 0, "q": "骨折治癒の過程を正しい順番に並べたものはどれか。", "a": 3, "cs": ["仮骨形成→肉芽組織形成→骨芽細胞が骨新生→破骨細胞が骨質吸収", "破骨細胞が骨質吸収→骨芽細胞が骨新生→仮骨形成→肉芽組織形成", "肉芽組織形成→破骨細胞が骨質吸収→骨芽細胞が骨新生→仮骨形成", "肉芽組織形成→仮骨形成→破骨細胞が過剰骨質吸収→骨芽細胞が骨新生"], "ep": "骨折治癒の過程：<strong>①肉芽組織の形成→②仮骨の形成→③破骨細胞が過剰な骨質を吸収→④骨芽細胞が骨新生（骨の改変）</strong>。機能に適応して最終的な形態がつくられる。"}, {"c": "⑤進行性病変", "p": 0, "q": "前立腺肥大症の病態として正しいものはどれか。", "a": 1, "cs": ["細胞容積の増加による肥大", "細胞数の増加による過形成（尿道周囲に好発）", "腺癌の発生による腫大", "線維化による硬結"], "ep": "前立腺肥大症は正式には<strong>過形成（細胞数の増加）</strong>で、尿道周囲（移行域）に好発。50歳以降に加齢とともに増加し性ホルモン（アンドロゲン）の不均衡が関与する。"}, {"c": "⑤進行性病変", "p": 0, "q": "生理的再生の例として正しいものはどれか。", "a": 2, "cs": ["骨折後の肉芽組織による修復", "胃粘膜が腸粘膜に置換されること", "皮膚の表皮・毛髪・爪・血液細胞の日常的な入れ替わり", "慢性胃炎によるポリープの形成"], "ep": "<strong>生理的再生</strong>は正常過程で消失した細胞・組織の補充。例：皮膚の表皮・消化管粘膜・毛髪・爪・血液細胞。病的再生は病的な条件下での再生。骨折後の修復は進行性病変（創傷治癒）。"}, {"c": "⑤進行性病変", "p": 0, "q": "肉芽組織が最終的に変化するものはどれか。", "a": 0, "cs": ["瘢痕組織（傷跡）", "軟骨組織", "骨組織", "リンパ組織"], "ep": "肉芽組織は経過とともに膠原線維化が進み、毛細血管や炎症細胞が消失→<strong>膠原線維（コラーゲン）の集まりである瘢痕組織（傷跡）</strong>に置き換わる。瘢痕は収縮し白色の硬い傷跡となる。"}, {"c": "⑤進行性病変", "p": 0, "q": "偽関節とはどのような状態か。", "a": 3, "cs": ["骨折が完全に治癒し過剰な骨質が形成された状態", "骨折後に感染が起きて骨髄炎に移行した状態", "骨折端が過剰に骨化して関節可動域が制限された状態", "骨折治癒が不全で線維・軟骨組織で癒合し骨折部に異常可動性が残る状態"], "ep": "<strong>偽関節</strong>は骨折治癒が不全（治療不全）で骨質の形成が妨げられ、<strong>線維組織や軟骨組織で癒合→骨折部に異常可動性</strong>が残る状態。固定不十分や血流障害が原因となる。"}, {"c": "⑥循環障害", "p": 0, "q": "充血とうっ血の違いとして正しいものはどれか。", "a": 1, "cs": ["充血＝静脈血のうっ滞→暗赤色　うっ血＝動脈血の流入増加→紅色", "充血＝動脈血の流入増加→紅色・熱感　うっ血＝静脈血のうっ滞→暗赤色", "充血＝細胞間隙への水分貯留　うっ血＝血管内腔の閉塞", "充血＝静脈圧上昇が原因　うっ血＝動脈拡張が原因"], "ep": "<strong>充血</strong>は末梢血管の拡張→動脈血の流入増加→<strong>紅色・熱感</strong>。<strong>うっ血</strong>は静脈の狭窄・閉塞→静脈圧上昇→静脈血のうっ滞→<strong>暗赤色に腫脹</strong>。"}, {"c": "⑥循環障害", "p": 0, "q": "血栓症成立の3条件（Virchow〔ウィルヒョウ〕の3徴）はどれか。", "a": 0, "cs": ["血管壁の傷害・血流の変化・血液成分の変化", "血管径の拡張・静脈圧の上昇・血液粘度の低下", "細菌の侵入・白血球の増加・血小板の減少", "血管壁の石灰化・血液量の増加・血液pH低下"], "ep": "Virchow（ドイツの病理学者）が提唱した<strong>血栓形成の3条件：血管壁の傷害・血流の変化・血液成分の変化</strong>。3つが重なると血栓が形成されやすくなる。"}, {"c": "⑥循環障害", "p": 0, "q": "浮腫の原因として含まれないものはどれか。", "a": 3, "cs": ["毛細血管の静脈圧上昇", "血液膠質浸透圧の低下（低アルブミン血症）", "リンパ管の閉塞", "動脈血の過剰な流入（充血）"], "ep": "浮腫の原因4つ：①毛細血管静脈圧上昇（心不全・静脈閉塞）、②血液膠質浸透圧低下（低アルブミン血症）、③リンパ管閉塞（腫瘍による）、④毛細血管透過性亢進（炎症）。<strong>動脈血の過剰流入（充血）</strong>は浮腫の原因ではない。"}, {"c": "⑥循環障害", "p": 1, "q": "門脈圧亢進症の合併症として正しいものはどれか。", "a": 1, "cs": ["大動脈瘤・肺高血圧症", "食道静脈瘤・痔核・臍静脈怒張（メドゥサの頭）", "深部静脈血栓症・肺塞栓症", "腎動脈狭窄・腎性高血圧"], "ep": "門脈圧亢進症（肝硬変症などによる）では側副循環として<strong>食道静脈瘤・痔核（直腸静脈）・臍静脈怒張（メドゥサの頭）</strong>が生じる。食道静脈瘤の破裂は大量出血を招く。過去問出題済み。"}, {"c": "⑥循環障害", "p": 0, "q": "ショックの定義として最も正しいものはどれか。", "a": 2, "cs": ["血圧が90mmHg以下になった状態", "心臓が1回の収縮で送り出す血液量が減少した状態", "全身の急性の末梢循環不全状態（有効循環血液量と血管容積の著しい不均衡）", "脳への血流が一時的に途絶した状態"], "ep": "<strong>ショック</strong>は全身の急性の末梢循環不全状態。有効循環血液量の減少→血圧低下→全身組織の低酸素状態→組織・臓器の変性・壊死。脳・心臓への血流は最後まで守られる（カテコールアミン分泌→末梢血管収縮）。"}, {"c": "⑥循環障害", "p": 1, "q": "高血圧の診断基準として正しいものはどれか。", "a": 0, "cs": ["拡張期血圧90mmHg以上または収縮期血圧140mmHg以上", "拡張期血圧80mmHg以上または収縮期血圧130mmHg以上", "拡張期血圧100mmHg以上または収縮期血圧160mmHg以上", "拡張期血圧70mmHg以上または収縮期血圧120mmHg以上"], "ep": "高血圧の診断基準は<strong>拡張期血圧90mmHg以上または収縮期血圧140mmHg以上</strong>。本態性高血圧が90%以上（多因子遺伝病）。二次性高血圧（5%未満）の最多原因は腎臓（腎性高血圧）。過去問出題済み。"}, {"c": "⑥循環障害", "p": 0, "q": "DIC（播種性血管内凝固症候群）で最終的に出血傾向が生じる理由はどれか。", "a": 3, "cs": ["大量出血により赤血球が急速に失われるため", "心機能の低下により血液が全身に届かないため", "腎機能低下により凝固因子が産生されなくなるため", "凝固機転の亢進→凝固因子の消費・減少→線溶系の二次的亢進→出血傾向"], "ep": "DICでは感染症・悪性腫瘍などで<strong>凝固機転が亢進→全身の小血管に血栓多発→凝固因子が消費・減少→線溶系が二次的に亢進→高度の出血傾向</strong>。「凝固して出血する」逆説的な病態。"}, {"c": "⑥循環障害", "p": 0, "q": "エコノミークラス症候群（旅行者血栓症）の機序として正しいものはどれか。", "a": 2, "cs": ["気圧低下により血液が濃縮され脳梗塞を起こす", "長時間の座位で下肢の動脈血流が途絶え組織が壊死する", "下肢深部静脈の血栓が剥がれ肺動脈を閉塞し急性肺血栓塞栓症が生じる", "心房細動による左心房内血栓が肺動脈に塞栓する"], "ep": "エコノミークラス症候群は「旅行者血栓症」。長時間の同一姿勢→筋静脈ポンプ機能低下→<strong>下肢深部静脈の血栓症→肺動脈血栓塞栓症</strong>。飛行機以外（車・電車・船・災害避難所）でも発生する。"}, {"c": "⑥循環障害", "p": 0, "q": "右心不全によるうっ血で特に障害される臓器はどれか。", "a": 1, "cs": ["肺（肺水腫）", "肝臓（うっ血肝）", "腎臓（腎不全）", "脳（脳浮腫）"], "ep": "<strong>右心不全</strong>は右心室の機能低下→肺以外の全身諸臓器のうっ血→特に<strong>肝臓のうっ血（うっ血肝・肝腫大）</strong>が著明。左心不全は左心室の機能低下→肺のうっ血→<strong>肺水腫</strong>が生じる。"}, {"c": "⑥循環障害", "p": 0, "q": "心筋梗塞の原因血管として最も多いものはどれか。", "a": 0, "cs": ["左冠状動脈前下行枝", "右冠状動脈", "左冠状動脈回旋枝", "左冠状動脈主幹部"], "ep": "<strong>左冠状動脈前下行枝</strong>の閉塞が最多→左心室前壁・心室中隔前半に梗塞巣。右冠状動脈→左心室後壁・中隔後半、左冠状動脈回旋枝→左心室側壁から後壁に梗塞巣を生じる。過去問出題済み。"}, {"c": "⑦炎症・免疫・感染症", "p": 1, "q": "炎症の5徴候に含まれないものはどれか。", "a": 1, "cs": ["発赤", "貧血", "腫脹", "機能障害"], "ep": "炎症の5徴候は<strong>発赤・発熱・腫脹・疼痛・機能障害</strong>の5つ。貧血は含まれない。過去問では「5徴候に含まれるのはどれか→疼痛」として出題済み。"}, {"c": "⑦炎症・免疫・感染症", "p": 1, "q": "急性期の炎症に主に関与する細胞はどれか。", "a": 2, "cs": ["リンパ球", "マクロファージ", "好中球", "形質細胞"], "ep": "急性炎症の主役は<strong>好中球</strong>（細菌を貪食）。慢性炎症ではマクロファージ・リンパ球・形質細胞が主体。過去問出題済み。"}, {"c": "⑦炎症・免疫・感染症", "p": 1, "q": "肥満細胞（マスト細胞）と関連するアレルギーの型はどれか。", "a": 0, "cs": ["Ⅰ型（即時型・IgE依存性）", "Ⅱ型（細胞傷害型）", "Ⅲ型（免疫複合型）", "Ⅳ型（遅延型）"], "ep": "肥満細胞はIgE受容体をもち<strong>Ⅰ型（即時型・IgE依存性）</strong>アレルギーで中心的役割を果たす。IgEが肥満細胞に結合し抗原が再侵入すると脱顆粒→アレルギー症状。過去問出題済み。"}, {"c": "⑦炎症・免疫・感染症", "p": 1, "q": "シェーライン・ヘノッホ紫斑病の機序はどれか。", "a": 3, "cs": ["IgEによる肥満細胞の活性化", "B細胞欠損による液性免疫不全", "抗アセチルコリン受容体抗体によるシナプス伝達抑制", "アレルギー性血管炎による血管壁の障害"], "ep": "シェーライン・ヘノッホ紫斑病は<strong>アレルギー性血管炎（Ⅲ型アレルギー関連）</strong>による血管壁の障害で出血傾向を呈する。過去問出題済み。"}, {"c": "⑦炎症・免疫・感染症", "p": 1, "q": "ブラジキニンの主な作用はどれか。", "a": 3, "cs": ["血管収縮", "血小板の凝集促進", "白血球の遊走促進", "疼痛の誘発"], "ep": "<strong>ブラジキニン</strong>は炎症メディエーターの一種で<strong>疼痛の誘発</strong>に関与。ヒスタミンは血管拡張・透過性亢進、セロトニンは血小板凝集・血管収縮に関与する。過去問出題済み。"}, {"c": "⑦炎症・免疫・感染症", "p": 0, "q": "Ⅴ型アレルギーに分類される唯一の疾患はどれか。", "a": 1, "cs": ["重症筋無力症", "バセドウ病（グレーブス病）", "全身性エリテマトーデス（SLE）", "特発性血小板減少性紫斑病（ITP）"], "ep": "Ⅴ型（刺激型）アレルギーは<strong>バセドウ病のみ</strong>。TSH受容体に対する自己抗体が結合しTSHが作用しているような刺激を与え甲状腺機能亢進を引き起こす。重症筋無力症はⅡ型アレルギー。"}, {"c": "⑦炎症・免疫・感染症", "p": 0, "q": "飛沫感染と空気感染の粒子径の組み合わせはどれか。", "a": 2, "cs": ["飛沫感染：5μm以下　空気感染：5μm以上", "飛沫感染：1μm以下　空気感染：10μm以上", "飛沫感染：5μm以上　空気感染：5μm以下", "飛沫感染：10μm以上　空気感染：1μm以下"], "ep": "<strong>飛沫感染：5μm以上</strong>（インフルエンザ・風疹ウイルス）。<strong>空気感染：5μm以下</strong>（核粒子として長時間漂う：結核菌・麻疹ウイルス）。粒子径の数字は頻出。"}, {"c": "⑦炎症・免疫・感染症", "p": 0, "q": "AIDS（後天性免疫不全症候群）で高度に障害される免疫機能はどれか。", "a": 0, "cs": ["細胞性免疫（CD4陽性T細胞の障害）", "液性免疫（B細胞による抗体産生）", "補体活性化経路", "好中球の貪食能"], "ep": "<strong>AIDS</strong>はHIV（Human Immunodeficiency Virus）の感染によりCD4陽性T細胞が障害され<strong>細胞性免疫が高度に低下</strong>。日和見感染（ニューモシスチス肺炎）・カポジ肉腫などを合併する。"}, {"c": "⑦炎症・免疫・感染症", "p": 0, "q": "日和見感染の定義として正しいものはどれか。", "a": 1, "cs": ["健康な成人が病原性の強い細菌に感染して発症すること", "免疫能が低下した患者が通常は無害な微生物や弱毒病原体に感染して発症すること", "抗菌薬の長期投与により耐性菌が出現すること", "院内での感染症に罹患すること"], "ep": "<strong>日和見感染</strong>は免疫能が低下した患者（AIDS・白血病・免疫抑制剤使用者など）や小児・高齢者が、通常は無害な微生物や弱毒病原体に感染して発症すること。代表：カンジダ・ニューモシスチス・イロベチー。"}, {"c": "⑦炎症・免疫・感染症", "p": 0, "q": "菌交代現象の定義として正しいものはどれか。", "a": 2, "cs": ["細菌が突然変異を起こし薬剤耐性を獲得すること", "病原菌が新しい宿主に適応して毒性を高めること", "抗菌薬の大量・長期投与→常在菌叢が減少・死滅→病原微生物が繁殖・感染すること", "免疫力の低下により通常は無害な微生物が病原性を示すこと"], "ep": "<strong>菌交代現象</strong>は抗菌薬の大量・長期投与→常在菌叢が減少・死滅→病原微生物が繁殖・感染する現象。常在菌は病原微生物の繁殖を抑える拮抗作用（コロニー抵抗性）を持つ。"}, {"c": "⑦炎症・免疫・感染症", "p": 0, "q": "MRSA（メチシリン耐性黄色ブドウ球菌）が問題となる感染症はどれか。", "a": 0, "cs": ["院内感染症（hospital-acquired infection）", "垂直感染（母→子への感染）", "空気感染（核粒子による感染）", "日和見感染の代表的原因菌"], "ep": "<strong>MRSA</strong>（Methicillin-Resistant Staphylococcus Aureus：メチシリン耐性黄色ブドウ球菌）は<strong>院内感染症</strong>の代表的な原因菌。多剤耐性のため治療が困難。院内感染は患者・医療従事者・家族・面会者間で伝播する。"}, {"c": "⑦炎症・免疫・感染症", "p": 0, "q": "ウイルスと細菌の特徴の違いとして正しいものはどれか。", "a": 3, "cs": ["ウイルスは細胞壁を持ち宿主細胞外でも増殖できる", "細菌は宿主の細胞内でのみ増殖できる細胞構造を持たない", "ウイルスと細菌はどちらも細胞壁を持ち宿主細胞外で増殖できる", "ウイルスは宿主の細胞内でのみ増殖し細胞構造を持たない粒子、細菌は生きた細胞なしでも増殖できる"], "ep": "<strong>ウイルス</strong>は宿主細胞内でのみ増殖・細胞構造を持たない粒子。<strong>細菌</strong>は生きた細胞がなくても増殖可能・細胞壁を持つ。クラミジアは細胞壁を持つが宿主細胞内でのみ増殖する中間的な存在。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "腫瘍の定義として最も適切なものはどれか。", "a": 1, "cs": ["炎症による組織の腫脹が固まった状態", "生体自身由来の細胞が自律的・無目的・過剰に増殖した組織のかたまり", "微生物が体内で増殖して形成した膿のかたまり", "血管内で血液が凝固して形成した塊"], "ep": "<strong>腫瘍</strong>は生体自身に由来する細胞の自律的・無目的・過剰な増殖で形成される組織のかたまり。再生は治ればなくなるが腫瘍は刺激がなくても増殖し続ける点が異なる。"}, {"c": "⑧腫瘍総論", "p": 1, "q": "非上皮性悪性腫瘍の総称はどれか。", "a": 2, "cs": ["癌腫", "腺癌", "肉腫", "リンパ腫"], "ep": "非上皮性（支持組織：筋肉・骨・血管・神経など）の悪性腫瘍の総称は<strong>肉腫</strong>。上皮性の悪性腫瘍の総称は癌腫（癌）。リンパ腫はリンパ系腫瘍で独立した分類。過去問出題済み。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "TNM分類のT・N・Mそれぞれが意味するものはどれか。", "a": 3, "cs": ["T：腫瘍の組織型　N：壊死の程度　M：転移の速度", "T：治療の回数　N：リンパ球の数　M：形態の変化", "T：血液検査値　N：神経浸潤の有無　M：薬物感受性", "T：原発巣の大きさ・浸潤深さ（T1〜T4）　N：リンパ節転移の程度（N0〜N3）　M：遠隔転移の有無（M0〜M1）"], "ep": "TNM分類：<strong>T（Tumor）</strong>＝原発巣の大きさ・浸潤深さ（T1〜T4）、<strong>N（Node）</strong>＝リンパ節転移の程度（N0〜N3）、<strong>M（Metastasis）</strong>＝遠隔転移の有無（M0〜M1）。"}, {"c": "⑧腫瘍総論", "p": 1, "q": "喉頭癌の好発部位はどれか。", "a": 3, "cs": ["喉頭蓋", "披裂部", "梨状陥凹", "声帯（声門部）"], "ep": "喉頭癌は<strong>声帯（声門部）</strong>に最も多く発生し<strong>嗄声（かすれ声）</strong>が早期症状。組織型は高分化型扁平上皮癌。危険因子：喫煙・飲酒。STとして音声障害・嚥下障害との関連が重要。過去問出題済み。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "腫瘍マーカーCA19-9が最も関連する癌はどれか。", "a": 2, "cs": ["前立腺癌", "肝細胞癌", "膵癌・胆道癌", "大腸癌・乳癌"], "ep": "<strong>CA19-9</strong>（Carbohydrate Antigen 19-9：細胞表面の糖鎖抗原）は<strong>膵癌・胆道癌</strong>のマーカー。PSA＝前立腺癌、AFP＝肝細胞癌、CEA＝大腸癌・肺癌・乳癌のマーカー。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "良性腫瘍と悪性腫瘍の比較で正しいものはどれか。", "a": 1, "cs": ["良性腫瘍：境界不明瞭・浸潤性発育　悪性腫瘍：被膜あり・膨張性発育", "良性腫瘍：被膜あり・境界明瞭・膨張性発育　悪性腫瘍：境界不明瞭・浸潤性発育", "良性腫瘍：転移多い・再発多い　悪性腫瘍：転移なし・再発少ない", "良性腫瘍：発育速度が速い　悪性腫瘍：発育速度が遅い"], "ep": "<strong>良性腫瘍</strong>：被膜あり・境界明瞭・膨張性（周囲を圧迫）・発育遅い・転移なし。<strong>悪性腫瘍</strong>：境界不明瞭・浸潤性（組織間を縫って発育）・発育速い・転移多い・予後不良。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "分化度と悪性度の関係として正しいものはどれか。", "a": 2, "cs": ["高分化＝悪性度高い、低分化＝悪性度低い", "高分化＝悪性度高い、未分化＝悪性度最も低い", "高分化＝悪性度低い、未分化＝悪性度最も高い", "分化度と悪性度に相関関係はない"], "ep": "<strong>分化が進み成熟している（高分化）ほど悪性度は低い</strong>（発生母組織に類似している）。未分化はどの正常組織にも類似していない状態で最も悪性度が高い。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "クルーケンベルグ腫瘍の特徴として正しいものはどれか。", "a": 1, "cs": ["胃癌が左鎖骨上窩リンパ節に転移したもの", "主に胃癌が原発の転移性卵巣癌で印環細胞が特徴", "直腸膀胱窩への胃癌の播種性転移", "胃癌の血行性肝転移"], "ep": "<strong>クルーケンベルグ腫瘍</strong>は転移性卵巣癌の一つで、<strong>主に胃癌が原発（印環細胞が特徴）で両側性卵巣腫瘍</strong>を形成する。ウィルヒョウ転移＝左鎖骨上窩リンパ節、シュニッツラー転移＝直腸膀胱窩への播種。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "播種性転移の特徴として正しいものはどれか。", "a": 3, "cs": ["血液の流れを介して遠隔臓器に転移する", "リンパの流れを介して所属リンパ節に転移する", "癌細胞が基底膜を突破し血管壁を侵食する", "体腔内で広がり漿膜面にこぼれ落ちて転移巣を形成する"], "ep": "<strong>播種性転移</strong>は癌細胞が体腔の表面（腹膜・胸膜）に広がり→体腔内にこぼれ落ち→<strong>漿膜表面に転移巣を形成</strong>する。血行性転移（静脈→遠隔臓器）、リンパ行性転移（リンパ管→所属リンパ節）とは経路が異なる。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "ヒト乳頭腫ウイルス（HPV）が最も強く関連する悪性腫瘍はどれか。", "a": 0, "cs": ["子宮頸癌", "肝細胞癌", "鼻咽頭癌", "成人T細胞白血病"], "ep": "<strong>HPV（Human Papillomavirus：ヒト乳頭腫ウイルス）</strong>は<strong>子宮頸癌</strong>の主因。HBV・HCV→肝細胞癌、EBウイルス→鼻咽頭癌・バーキットリンパ腫、HTLV-1→成人T細胞白血病と関連。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "ヘリコバクター・ピロリ（H.pylori）が関連する悪性腫瘍はどれか。", "a": 1, "cs": ["肝細胞癌", "胃癌", "膀胱癌", "肺腺癌"], "ep": "<strong>ヘリコバクター・ピロリ</strong>は<strong>胃癌</strong>の主要な危険因子。慢性胃炎→萎縮性胃炎→腸上皮化生→胃癌という経路で発癌に関与する。除菌治療が胃癌の予防につながる。"}, {"c": "⑧腫瘍総論", "p": 0, "q": "悪性腫瘍が「5年後再発なしで治癒と評価」される根拠として正しいものはどれか。", "a": 2, "cs": ["5年間は再発しないことが法律で定められているから", "悪性腫瘍は5年以内にすべて再発するから", "悪性腫瘍の多くは5年以内に再発することが多く、5年間再発なければ根治と判断できる臨床的根拠がある", "免疫系が5年で完全に腫瘍を排除できるから"], "ep": "悪性腫瘍の<strong>5年生存率</strong>を治癒の基準とするのは、多くの悪性腫瘍では再発の多くが5年以内に起きるため、5年間再発なしで根治と判断できる臨床的根拠がある（乳癌は10年が基準）。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "鉄欠乏性貧血の赤血球の変化はどれか。", "a": 0, "cs": ["小型化（小球性低色素性貧血）", "大型化（大球性貧血）", "鎌状変形", "正常と同じ大きさ"], "ep": "<strong>鉄欠乏性貧血</strong>：鉄不足→ヘモグロビン量減少→<strong>赤血球の小型化（小球性低色素性貧血）</strong>。原因：消化管出血・月経血増加・摂取不足・吸収障害。大型化はビタミンB12・葉酸欠乏（巨赤芽球性貧血）。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "悪性貧血の機序として正しいものはどれか。", "a": 2, "cs": ["鉄の摂取不足によりヘモグロビン合成が障害される", "骨髄造血能の著しい低下により血球全般の合成が障害される", "抗内因子抗体の産生→内因子分泌減少→ビタミンB12の吸収障害", "放射線・薬剤による骨髄抑制により汎血球減少症が生じる"], "ep": "<strong>悪性貧血</strong>は抗内因子抗体が産生→胃の固有腺から分泌される<strong>内因子が減少→ビタミンB12の腸管吸収障害→巨赤芽球性貧血</strong>。高度の萎縮性胃炎・胃切除後でも起きる。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "溶血性貧血が引き起こす黄疸の種類はどれか。", "a": 1, "cs": ["肝性黄疸", "肝前性黄疸（溶血性黄疸）", "肝後性黄疸（閉塞性黄疸）", "核黄疸"], "ep": "溶血性貧血では赤血球の崩壊が亢進→<strong>間接ビリルビンが大量産生→肝前性黄疸（溶血性黄疸）</strong>が生じる。直接ビリルビン増加は肝後性（閉塞性）黄疸で生じる。"}, {"c": "⑨血液・造血器系", "p": 1, "q": "アウエル小体（Auer小体）が見られる疾患はどれか。", "a": 0, "cs": ["急性骨髄性白血病（AML）", "慢性骨髄性白血病（CML）", "急性リンパ性白血病（ALL）", "多発性骨髄腫"], "ep": "アウエル小体は白血病細胞内の<strong>針状の封入体</strong>で<strong>急性骨髄性白血病（AML）</strong>に特徴的。CMLにはフィラデルフィア染色体（9番と22番染色体の相互転座）が特徴的。過去問出題済み。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "ATL（成人T細胞白血病）の感染経路・潜伏期・予後の組み合わせはどれか。", "a": 3, "cs": ["経飛沫感染・潜伏期1〜2週間・予後良好", "性感染・潜伏期10年以上・予後良好", "経胎盤感染・潜伏期20〜30年・予後中等度", "経母乳感染・潜伏期50年以上・発症後2年以内にほとんど死亡（予後不良）"], "ep": "ATLはHTLV-1が原因で<strong>経母乳感染</strong>が主。潜伏期が<strong>50年以上</strong>と極めて長く、発症のピークは60歳頃。発症後<strong>2年以内にほとんど死亡</strong>（予後不良）。日本では沖縄・鹿児島・宮崎・長崎に多い。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "フィラデルフィア染色体が特徴的な白血病はどれか。", "a": 1, "cs": ["急性骨髄性白血病（AML）", "慢性骨髄性白血病（CML）", "急性リンパ性白血病（ALL）", "成人T細胞白血病（ATL）"], "ep": "<strong>フィラデルフィア染色体</strong>は9番染色体と22番染色体の相互転座によって生じる異常染色体で、<strong>慢性骨髄性白血病（CML）</strong>に特徴的。CMLは80〜90%が急性転化する。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "多発性骨髄腫で「骨の打ち抜き像」が生じる理由はどれか。", "a": 2, "cs": ["骨芽細胞が過剰に活性化され骨密度が増加するため", "M蛋白が骨に直接沈着して骨を破壊するため", "骨髄腫細胞が破骨細胞を活性化し骨質を溶解するため", "尿酸塩が骨内に沈着して骨の構造を変形させるため"], "ep": "多発性骨髄腫では腫瘍化した形質細胞が<strong>破骨細胞を活性化→骨の溶解→X線で「骨の打ち抜き像」・高カルシウム血症・易骨折性</strong>が生じる。M蛋白は腎臓尿細管に沈着→腎機能障害。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "急性リンパ性白血病（ALL）の好発年齢はどれか。", "a": 0, "cs": ["幼児（85%が幼児、好発年齢3〜6歳）", "青年期（15〜25歳）", "中高年（40〜60歳）", "高齢者（60歳以上）"], "ep": "<strong>急性リンパ性白血病（ALL）</strong>は<strong>85%が幼児</strong>で好発年齢は3〜6歳。小児白血病の最多。白血病細胞は低分化型（芽球）で主として芽球よりなる急性型。慢性リンパ性白血病は60歳以上に多い。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "再生不良性貧血の機序として正しいものはどれか。", "a": 1, "cs": ["鉄の不足によりヘモグロビン合成が障害される", "骨髄造血能の著しい低下→血球全般の合成障害→汎血球減少症", "赤血球の崩壊（溶血）が亢進して間接ビリルビンが増加する", "ビタミンB12欠乏により造血細胞のDNA合成が障害される"], "ep": "<strong>再生不良性貧血</strong>は放射線・薬剤・重篤な感染症などにより<strong>骨髄造血能が著しく低下→赤血球・白血球・血小板すべての合成が障害→汎血球減少症</strong>が生じる。"}, {"c": "⑨血液・造血器系", "p": 0, "q": "悪性リンパ腫の特徴として正しいものはどれか。", "a": 2, "cs": ["造血幹細胞が骨髄で無制限に増殖する疾患", "形質細胞の腫瘍化によりM蛋白が産生される疾患", "リンパ球の腫瘍化で主にリンパ節・脾臓・扁桃腺に発生するが全身どの臓器にも発生しうる", "赤血球の崩壊亢進により間接ビリルビンが増加する疾患"], "ep": "<strong>悪性リンパ腫</strong>はリンパ球の腫瘍化で主にリンパ節・脾臓・扁桃腺に発生するが、胃・腸・甲状腺・肺・肝臓・皮膚・脳など全身どの臓器にも発生しうる。造血幹細胞の無制限増殖は白血病。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "肺腺癌の特徴として正しいものはどれか。", "a": 0, "cs": ["女性・非喫煙者にも多く末梢型で無症状のことが多い・近年増加", "男性・喫煙者に多く肺門型で血痰・咳嗽が早期から出現", "男性・肺門型・神経内分泌細胞由来で進行が早く悪性度高い", "喀痰細胞診が有効で肺門型・扁平上皮癌"], "ep": "<strong>肺腺癌</strong>は最多（60%）で<strong>女性・非喫煙者にも多く末梢型で無症状が多い</strong>。近年増加傾向。扁平上皮癌（男性・肺門型・喀痰細胞診有効）、小細胞癌（肺門型・神経内分泌細胞由来・進行早い）と区別。"}, {"c": "⑩呼吸器・口腔", "p": 1, "q": "誤嚥性肺炎の特徴として正しいものはどれか。", "a": 3, "cs": ["ウイルスが原因で飛沫感染し肺全体が出血性に変化する", "シリカ粉塵の長期吸入による肺の線維性増殖性変化", "結核菌の空気感染で乾酪様壊死巣を形成する", "食物・唾液・吐物の誤嚥による気管支肺炎で口腔内細菌も関与する"], "ep": "<strong>誤嚥性肺炎</strong>は食物・唾液・吐物の誤嚥→気管支肺炎で口腔内細菌（嫌気性菌など）も関与。STとして嚥下機能評価・嚥下リハビリ・口腔ケアによる予防は最も核心的な役割。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "肺結核症の感染様式と壊死巣の特徴の組み合わせはどれか。", "a": 1, "cs": ["飛沫感染（5μm以上）・凝固壊死", "空気感染（飛沫核感染・5μm以下）・乾酪様変化", "接触感染・融解壊死", "経口感染・肉芽腫形成のみ"], "ep": "肺結核症は<strong>空気感染（飛沫核感染・5μm以下）</strong>で、病巣の中心部にチーズ様の<strong>乾酪様変化（乾酪様壊死）</strong>が生じる。粟粒結核は血行性に全身諸臓器に播種される。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "アスベスト（石綿）が引き起こす疾患の組み合わせはどれか。", "a": 2, "cs": ["珪肺結節・肺気腫", "腺癌・腎細胞癌", "悪性中皮腫（悪性胸膜中皮腫）・肺癌・石綿肺", "気管支喘息・間質性肺炎"], "ep": "アスベストは微細な針状繊維で体内で分解されない。<strong>暴露後20〜40年の潜伏期を経て石綿肺・悪性中皮腫（悪性胸膜中皮腫）・肺癌</strong>を起こす。1987年頃から問題化し今後も患者増加が懸念される。"}, {"c": "⑩呼吸器・口腔", "p": 1, "q": "インフルエンザウイルスが引き起こす肺炎の種類はどれか。", "a": 3, "cs": ["大葉性肺炎", "気管支肺炎", "間質性肺炎", "出血性肺炎"], "ep": "インフルエンザウイルスによる肺炎は<strong>出血性肺炎</strong>（ウイルス性肺炎）。大葉性肺炎・気管支肺炎は細菌性が多い（炎症の場は肺胞腔）。間質性肺炎はウイルス・膠原病・塵肺症・化学物質なども原因。過去問出題済み。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "う蝕の発生に関わる「カイスの輪」の3要素はどれか。", "a": 0, "cs": ["細菌（ミュータンス菌）・食物（砂糖）・宿主（歯質・唾液量）", "細菌・温度・pH", "食物・口腔内細菌数・フッ素", "口腔乾燥・咬合力・歯垢の量"], "ep": "<strong>カイスの輪</strong>：ストレプトコッカス・ミュータンス（細菌）・砂糖（食物）・歯質・唾液量（宿主）の3要素が重なるとう蝕が発生。う蝕は蓄積性疾患で自然治癒しない。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "鼻咽頭癌（リンパ上皮腫）の特徴として正しいものはどれか。", "a": 1, "cs": ["声門に好発し嗄声が早期症状で喫煙・飲酒が危険因子", "上咽頭に好発し低分化型扁平上皮癌でEBウイルスが関与", "上顎洞に好発し扁平上皮癌で鼻閉が主症状", "声帯に好発し高分化型扁平上皮癌で予後良好"], "ep": "<strong>鼻咽頭癌（リンパ上皮腫）</strong>は上咽頭に好発し低分化型扁平上皮癌で<strong>EBウイルス</strong>が関与する。中国・東南アジアに多い。喉頭癌（声門・高分化型扁平上皮癌・喫煙飲酒）と区別。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "口腔で最も多い悪性腫瘍の好発部位と組織型はどれか。", "a": 2, "cs": ["歯肉・腺癌", "口蓋・移行上皮癌", "舌縁部・高分化型扁平上皮癌", "口唇・小細胞癌"], "ep": "口腔で最も多い悪性腫瘍は<strong>舌癌</strong>（舌＞歯肉）で、好発部位は<strong>舌縁部</strong>、組織型は<strong>高分化型扁平上皮癌</strong>が多い。危険因子：喫煙・飲酒。口腔内潰瘍が2週間以上改善しない場合は癌を疑う。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "珪肺の原因物質と組織学的特徴の組み合わせはどれか。", "a": 0, "cs": ["シリカ（珪酸・二酸化珪素）・珪肺結節（同心円状の膠原線維の沈着）", "石綿（アスベスト）・アスベスト小体", "石炭粉塵・黒色の粒子沈着", "金属粉塵・線維性胸膜炎"], "ep": "<strong>珪肺</strong>は鉱山・採石・研磨業・陶器製造業で<strong>シリカ（二酸化珪素）</strong>を長期吸入→肺の線維性増殖性変化→<strong>珪肺結節（同心円状の膠原線維の沈着）</strong>が特徴的な組織学的所見。"}, {"c": "⑩呼吸器・口腔", "p": 0, "q": "副鼻腔炎が慢性化した場合に起こる病態はどれか。", "a": 3, "cs": ["肺高血圧症", "急性脳炎", "滲出性中耳炎のみ", "上顎洞蓄膿症（生理的な空洞に好中球が貯留）"], "ep": "副鼻腔炎が慢性化すると<strong>上顎洞蓄膿症</strong>（副鼻腔・特に上顎洞に膿が貯留する状態）になる。蓄膿は生理的な空洞に好中球が貯留した状態で、過去問では「蓄膿→生理的な空洞に好中球が溜まる」として出題済み。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "食道癌の組織型・好発部位・臨床的特徴の組み合わせで正しいものはどれか。", "a": 1, "cs": ["腺癌90%・食道上部・喫煙との関連が強い", "扁平上皮癌90%・食道中部（50%）・嚥下障害で発見されることが多い", "移行上皮癌・食道下部・バレット食道のみを経由", "小細胞癌・食道全体・神経内分泌細胞由来"], "ep": "食道癌は<strong>扁平上皮癌が90%</strong>、好発は<strong>食道中部（50%）</strong>＞食道下部（30%）。60歳以上の男性に多く、<strong>嚥下障害で発見</strong>（STに直結）。漿膜がないため進行すると縦隔に浸潤しやすい。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "バレット食道の定義として正しいものはどれか。", "a": 2, "cs": ["食道胃接合部の縦走裂傷（マロリー・ワイス症候群）", "肝硬変を背景に食道静脈が怒張した状態", "逆流性食道炎により食道下部に円柱上皮化生が生じた状態（食道腺癌の前癌病変）", "ヘリコバクター・ピロリ感染による食道の腸上皮化生"], "ep": "<strong>バレット食道</strong>は逆流性食道炎（下部食道括約筋の機能不全→胃酸逆流）により食道下部粘膜に<strong>円柱上皮化生（腸上皮化生）</strong>が生じた状態。食道腺癌の前癌病変として重要。"}, {"c": "⑪消化器・腎泌尿器", "p": 1, "q": "マロリー・ワイス症候群の機序と病変の組み合わせはどれか。", "a": 3, "cs": ["胃酸過多により胃粘膜が潰瘍化し上部消化管出血をきたす", "食道静脈瘤が破裂し大量吐血をきたす", "ピロリ菌感染により胃粘膜が萎縮し腸上皮化生が生じる", "激しい嘔吐の繰り返しで腹腔内圧が上昇し食道胃接合部に縦走する裂傷が形成される"], "ep": "<strong>マロリー・ワイス症候群</strong>は多量の飲酒などによる激しい嘔吐の繰り返し→腹腔内圧上昇→<strong>食道胃接合部粘膜に縦走する裂傷（潰瘍）形成→出血</strong>。過去問出題済み。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "胃潰瘍の攻撃因子と防御因子の正しい組み合わせはどれか。", "a": 0, "cs": ["攻撃因子：胃酸・消化酵素・H.pylori　防御因子：粘膜上皮・粘液", "攻撃因子：粘膜上皮・粘液　防御因子：胃酸・消化酵素", "攻撃因子：インスリン・グルカゴン　防御因子：プロスタグランジン", "攻撃因子：アルカリ液・胆汁　防御因子：胃酸・粘膜"], "ep": "胃潰瘍は<strong>攻撃因子（胃酸・消化酵素・ヘリコバクター・ピロリ）が防御因子（粘膜上皮・粘液）を上回る</strong>とバランスが崩れて発生する。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "胃癌の特徴として含まれないものはどれか。", "a": 3, "cs": ["50〜60歳代の男性に多い", "好発部位は幽門前庭部・小彎側", "組織型は腺癌", "欧米に多く日本・アジアでは少ない"], "ep": "胃癌は<strong>日本・中国・韓国などに多く欧米では少ない</strong>。50〜60歳代の男性に多い。好発部位：幽門前庭部・小彎側。組織型：腺癌。危険因子：ヘリコバクター・ピロリ・塩分の過剰摂取・喫煙・遺伝的素因。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "クローン病と潰瘍性大腸炎の鑑別で正しいものはどれか。", "a": 0, "cs": ["クローン病：非連続性・縦走潰瘍・裂溝（深い）　潰瘍性大腸炎：直腸から連続性・浅い表在性潰瘍", "クローン病：直腸に好発し連続性の浅い潰瘍　潰瘍性大腸炎：回腸末端部に好発", "クローン病：大腸のみ・腸壁全層が侵される　潰瘍性大腸炎：小腸のみ・粘膜のみ", "クローン病：浅い表在性潰瘍・両側性　潰瘍性大腸炎：縦走潰瘍・裂溝"], "ep": "<strong>クローン病</strong>：回腸末端部に好発・口腔から肛門まで・<strong>非連続性</strong>・縦走潰瘍・裂溝（深い）。<strong>潰瘍性大腸炎</strong>：直腸から上行性・大腸のみ・<strong>連続性</strong>・浅い表在性潰瘍。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "肝硬変症の5つの合併症を機能低下と対応させた組み合わせで誤っているものはどれか。", "a": 2, "cs": ["タンパク質合成障害→低アルブミン血症→浮腫（腹水）", "血液凝固因子産生低下→出血傾向", "ビリルビン代謝障害→高血圧", "肝内血流障害→門脈圧亢進症→食道静脈瘤"], "ep": "<strong>誤り：ビリルビン代謝障害→高血圧ではなく→黄疸</strong>。肝硬変の5大合併症：①タンパク合成↓→腹水・浮腫、②凝固因子↓→出血傾向、③ビリルビン代謝↓→黄疸、④門脈圧亢進→食道静脈瘤、⑤解毒↓→肝性脳症。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "急性糸球体腎炎の発症機序として正しいものはどれか。", "a": 1, "cs": ["糸球体に細菌が直接侵入し化膿性炎症を起こす", "A群β溶血性連鎖球菌感染後1〜3週後に免疫複合体（Ⅲ型アレルギー）が糸球体に沈着して発症", "尿路からの上行性細菌感染により腎実質と腎盂に炎症が起きる", "自己抗体（抗GBM抗体）が糸球体基底膜に直接結合して破壊する"], "ep": "急性糸球体腎炎は小児に多く、<strong>A群β溶血性連鎖球菌の上気道感染→1〜3週後→免疫複合体（Ⅲ型アレルギー）が糸球体に沈着</strong>→腎炎発症。<strong>糸球体に病原体は存在しない</strong>点が重要。"}, {"c": "⑪消化器・腎泌尿器", "p": 1, "q": "膀胱癌の組織型・症状・危険因子の組み合わせで正しいものはどれか。", "a": 2, "cs": ["扁平上皮癌・タンパク尿・慢性腎炎", "腺癌・排尿困難・前立腺肥大", "移行上皮癌（尿路上皮癌）・無症候性肉眼的血尿・喫煙・アニリン（職業癌）", "小細胞癌・頻尿・HPV感染"], "ep": "膀胱癌は<strong>移行上皮癌（尿路上皮癌）</strong>が最多。<strong>無症候性肉眼的血尿</strong>（痛みのない血尿）が特徴的。50歳以上の男性に多く危険因子は<strong>喫煙・アニリン（職業癌）</strong>。過去問出題済み。"}, {"c": "⑪消化器・腎泌尿器", "p": 1, "q": "子宮に発生する腫瘍で最も多いものはどれか。", "a": 0, "cs": ["子宮筋腫（良性・平滑筋腫）", "子宮体癌（腺癌）", "子宮頸癌（扁平上皮癌）", "子宮肉腫（平滑筋肉腫）"], "ep": "<strong>子宮筋腫</strong>（平滑筋腫）は子宮に発生する腫瘍のうち最も多い<strong>良性腫瘍</strong>。エストロゲンで発育促進→30〜40歳に多く更年期以降は退縮傾向。漿膜下・筋層内・粘膜下の3型に分類。過去問出題済み。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "ネフローゼ症候群の必須条件と生じる合併症の組み合わせで正しいものはどれか。", "a": 1, "cs": ["血尿→高アルブミン血症→腎機能障害", "タンパク尿→低アルブミン血症→浮腫・脂質異常症（高LDLコレステロール血症）", "高血圧→高カルシウム血症→骨粗鬆症", "発熱→白血球増加→感染症"], "ep": "ネフローゼ症候群の必須条件：<strong>タンパク尿→低アルブミン血症（血液中のアルブミンが血管外へ漏れる）→浮腫（膠質浸透圧低下）・脂質異常症（高LDLコレステロール血症）</strong>が生じる。"}, {"c": "⑪消化器・腎泌尿器", "p": 0, "q": "胆石症の3Fとして正しいものはどれか。", "a": 2, "cs": ["Fatty（脂肪）・Forty（40代）・Fever（発熱）", "Female（女性）・Forty（40代）・Fever（発熱）", "Female（女性）・Fat（肥満）・Forty（40代）", "Fat（脂肪食）・Fiber（食物繊維）・Forty（40代）"], "ep": "胆石症の3F：<strong>Female（女性）・Fat（肥満）・Forty（40歳代）</strong>。胆囊胆石（80%）の70%はコレステロール胆石。胆管胆石（20%）の70%はビリルビンカルシウム石。無症候性胆石（サイレントストーン）も多い。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "子宮頸癌と子宮体癌の鑑別で正しいものはどれか。", "a": 3, "cs": ["子宮頸癌：腺癌・閉経後50歳以降・近年減少　子宮体癌：扁平上皮癌・30〜50歳代・HPV感染", "子宮頸癌：20%・閉経後に多い　子宮体癌：80%・HPV感染が主因", "子宮頸癌：10〜20歳代・HTLV-1感染　子宮体癌：HPV感染・30歳代", "子宮頸癌：扁平上皮癌・HPV感染・30〜50歳代（80%）　子宮体癌：腺癌・閉経後50歳以降（20%）・近年増加"], "ep": "<strong>子宮頸癌</strong>：全子宮癌の80%・扁平上皮癌・HPV感染・30〜50歳代。<strong>子宮体癌</strong>：全子宮癌の20%・腺癌・閉経後50歳以降・近年増加傾向。組織型・原因・年齢の3点で鑑別。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "乳癌の特徴として正しいものはどれか。", "a": 1, "cs": ["20〜30歳代に多く両側性で境界明瞭・弾性軟", "40〜50歳代に多く片側性で可動性乏しく硬い・乳房外側上部に好発", "30〜40歳代に多く両側性で可動性があり弾性軟", "組織型は移行上皮癌で血尿が初発症状"], "ep": "<strong>乳癌</strong>は40〜50歳代女性に多く、<strong>片側性で可動性が乏しく硬い腫瘤</strong>、乳房外側上部に好発。組織型は無性腫瘍・腺癌。乳腺線維腺腫（20〜30歳代・両側性・境界明瞭・弾性軟・良性）との鑑別が重要。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "脳梗塞の種類と機序の組み合わせで正しいものはどれか。", "a": 2, "cs": ["脳血栓症：心房細動による左心房内血栓の剥離が原因", "脳塞栓症：脳血管の粥状硬化による血栓形成が原因", "脳血栓症：脳血管の粥状硬化による血栓形成　脳塞栓症：心房細動・弁膜症による血栓の剥離が原因", "ラクナ梗塞：大脳皮質に生じる大梗塞　脳血栓症：穿通枝の閉塞"], "ep": "<strong>脳血栓症</strong>：脳血管自体の粥状硬化→血栓形成→閉塞。<strong>脳塞栓症</strong>：心房細動・弁膜症→左心房内血栓の剥離→血流に乗って脳血管を閉塞。<strong>ラクナ梗塞</strong>：穿通枝動脈の閉塞→脳深部の小梗塞巣。"}, {"c": "⑫生殖器・神経・運動器", "p": 1, "q": "くも膜下出血と脳出血の原因の組み合わせで正しいものはどれか。", "a": 2, "cs": ["くも膜下出血：高血圧　脳出血：先天性動脈瘤の破裂", "くも膜下出血：外傷による静脈の破綻　脳出血：粥状硬化による閉塞", "くも膜下出血：先天性動脈瘤の破裂（ウィリス動脈輪）　脳出血：高血圧（被殻・視床に好発）", "くも膜下出血：心房細動による塞栓　脳出血：静脈の閉塞"], "ep": "<strong>くも膜下出血</strong>の最多原因：ウィリス動脈輪の<strong>先天性動脈瘤の破裂</strong>（好発：前大脳動脈-前交通動脈分岐部）。<strong>脳出血</strong>の最多原因：<strong>高血圧</strong>で被殻・視床に好発。過去問出題済み。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "アルツハイマー病とパーキンソン病の鑑別で正しいものはどれか。", "a": 1, "cs": ["アルツハイマー病：40〜60歳・黒質の変性・レビー小体形成　パーキンソン病：60歳以降・脳全体の萎縮・老人斑", "アルツハイマー病：60歳以降・脳全体の萎縮・老人斑（アミロイドβ沈着）　パーキンソン病：40〜60歳・黒質のメラニン含有細胞の変性・レビー小体形成", "アルツハイマー病：30歳代・白質の脱髄病変多発　パーキンソン病：60歳以降・上位・下位運動ニューロンの変性", "アルツハイマー病・パーキンソン病ともに脱髄疾患で視力障害・四肢麻痺を呈する"], "ep": "<strong>アルツハイマー病</strong>：60歳以降・脳全体の萎縮・老人斑（アミロイドβ蛋白沈着）。<strong>パーキンソン病</strong>：40〜60歳・黒質のメラニン含有細胞の変性・レビー小体形成・静止時振戦・筋固縮・無動。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "ALS（筋萎縮性側索硬化症）の特徴として正しいものはどれか。", "a": 3, "cs": ["下位運動ニューロンのみ侵され感覚障害を伴う", "抗アセチルコリン受容体抗体による神経筋接合部の障害", "ジストロフィン遺伝子変異による筋原性萎縮", "上位・下位両方の運動ニューロン変性で構音障害・嚥下障害・呼吸困難を呈する"], "ep": "<strong>ALS</strong>は中高年・男性に多く<strong>上位・下位両方の運動ニューロンの変性</strong>による筋萎縮が特徴。<strong>構音障害・嚥下障害・呼吸困難</strong>（呼吸筋の障害）を呈する。感覚は保たれる。STとして最も重要な神経疾患の一つ。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "重症筋無力症の特徴として正しいものはどれか。", "a": 1, "cs": ["Ⅰ型アレルギーにより肥満細胞が活性化され筋収縮が障害される", "Ⅱ型アレルギーにより抗アセチルコリン受容体抗体が産生されシナプス伝達が抑制→易疲労性・眼瞼下垂", "Ⅲ型アレルギーにより免疫複合体が筋肉に沈着し筋力が低下する", "ジストロフィン蛋白の欠損により筋細胞が変性・壊死する"], "ep": "重症筋無力症は<strong>Ⅱ型アレルギー</strong>で<strong>抗AChR（アセチルコリン受容体）抗体</strong>が産生→シナプス伝達抑制→<strong>易疲労性（使うほど力が出ない）・眼瞼下垂・休息で回復・夕方に悪化（日内変動）</strong>。女性に多い。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "デュシェンヌ型とベッカー型筋ジストロフィーの違いとして正しいものはどれか。", "a": 3, "cs": ["デュシェンヌ型：常染色体顕性遺伝・成人発症で軽症　ベッカー型：伴性潜性遺伝・小児発症で重症", "デュシェンヌ型：感覚障害を伴い予後良好　ベッカー型：運動のみで予後不良", "デュシェンヌ型：女性に多い　ベッカー型：男女同数", "デュシェンヌ型：ジストロフィン蛋白の完全欠損→重症　ベッカー型：ジストロフィン蛋白の量的減少→軽症"], "ep": "どちらも<strong>伴性潜性遺伝（X染色体連鎖劣性）</strong>・ジストロフィン遺伝子変異が原因。<strong>デュシェンヌ型</strong>：ジストロフィン<strong>完全欠損</strong>→重症（歩行困難・呼吸困難・心不全で死亡）。<strong>ベッカー型</strong>：ジストロフィン<strong>量的減少</strong>→軽症。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "関節リウマチの特徴として正しいものはどれか。", "a": 0, "cs": ["40歳代・女性に多く関節滑膜を中心にⅢ型アレルギーを介した慢性炎症（パンヌス形成）", "50歳代・男性に多く尿酸塩の沈着による急性関節炎", "20〜30歳代・男性に多く回腸末端部から口腔側への非連続性病変", "60歳以上・男性に多くジストロフィン欠損による関節周囲筋の萎縮"], "ep": "<strong>関節リウマチ</strong>は40歳代・女性に多く、<strong>関節滑膜を中心に慢性炎症をきたす自己免疫疾患（膠原病）</strong>。Ⅲ型アレルギー・リウマトイド因子（自己抗体）・<strong>パンヌス（肉芽組織）形成</strong>が特徴。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "骨粗鬆症の分類と原因の組み合わせで正しいものはどれか。", "a": 3, "cs": ["老人性骨粗鬆症：エストロゲン減少が主因　閉経後骨粗鬆症：加齢が主因", "老人性骨粗鬆症：ビタミンD欠乏のみ　閉経後骨粗鬆症：ビタミンK欠乏のみ", "老人性骨粗鬆症：女性のみ発症　閉経後骨粗鬆症：男女両方に発症", "老人性骨粗鬆症：加齢による全身の萎縮の一部　閉経後骨粗鬆症：エストロゲン減少→骨芽細胞活性化障害→骨量減少"], "ep": "<strong>老人性骨粗鬆症</strong>：加齢による全身の萎縮の一部分症。<strong>閉経後骨粗鬆症</strong>：閉経後10年程度経過した女性で<strong>エストロゲン分泌減少→骨芽細胞の活性化に関与できなくなる→骨量減少</strong>。骨の強度＝骨密度（カルシウム）＋コラーゲン量。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "精上皮腫（セミノーマ）の特徴として正しいものはどれか。", "a": 1, "cs": ["PSAが上昇し骨転移をきたしやすい高悪性度の腫瘍", "放射線感受性が高く予後は良好な腫瘍（精巣腫瘍のうち最多）", "エストロゲン依存性で閉経後に増大する", "前立腺の被膜辺縁部に好発する腺癌"], "ep": "<strong>精上皮腫（セミノーマ）</strong>は精巣腫瘍のうち最多の胚細胞腫瘍で、<strong>放射線感受性が高く予後は良好</strong>。PSA上昇・骨転移は前立腺癌、エストロゲン依存性は子宮筋腫の特徴。過去問出題済み。"}, {"c": "⑫生殖器・神経・運動器", "p": 0, "q": "前立腺癌と前立腺肥大症の好発部位と腫瘍マーカーの組み合わせで正しいものはどれか。", "a": 2, "cs": ["前立腺癌：尿道周囲（移行域）・CA19-9　前立腺肥大症：被膜辺縁部・AFP", "前立腺癌：被膜辺縁部・AFP　前立腺肥大症：尿道周囲・PSA", "前立腺癌：被膜辺縁部（末梢域）・PSA　前立腺肥大症：尿道周囲（移行域）・腫瘍マーカーなし", "前立腺癌：膀胱頸部・CEA　前立腺肥大症：直腸側・CA19-9"], "ep": "<strong>前立腺癌</strong>：被膜辺縁部（末梢域）に好発・腫瘍マーカーは<strong>PSA</strong>・ホルモン依存性・骨転移が多い。<strong>前立腺肥大症</strong>：尿道周囲（移行域）に好発・過形成（細胞数増加）・腫瘍マーカーなし。"}, {"c": "★過去問", "p": 1, "q": "ACTHが高値になる疾患はどれか。", "a": 2, "cs": ["原発性アルドステロン症", "褐色細胞腫", "クッシング病（下垂体のACTH産生腫瘍）", "橋本病（慢性甲状腺炎）"], "ep": "クッシング病は下垂体のACTH産生腫瘍によりACTHが過剰分泌される。過去問出題済み。"}, {"c": "★過去問", "p": 1, "q": "視神経が障害される疾患はどれか。", "a": 0, "cs": ["緑内障", "白内障", "角膜炎", "網膜剥離"], "ep": "緑内障は眼圧の上昇により視神経が圧迫・障害される。白内障は水晶体の混濁。過去問出題済み。"}, {"c": "★過去問", "p": 1, "q": "アフタ性口内炎の組織学的特徴はどれか。", "a": 3, "cs": ["肉芽腫形成", "膿瘍形成", "壊疽性変化", "線維性偽膜形成（線維素性滲出物）"], "ep": "アフタ性口内炎は白色の浅い潰瘍で、組織学的に線維性偽膜が形成される。過去問出題済み。"}, {"c": "★過去問", "p": 1, "q": "膀胱癌の深達度による分類で正しいものはどれか。", "a": 1, "cs": ["浸潤性癌：粘膜〜粘膜下層にとどまる", "表在性癌：粘膜〜粘膜下層にとどまる（カリフラワー様）", "表在性癌：筋層に達している", "浸潤性癌：粘膜のみにとどまる"], "ep": "表在性癌は粘膜〜粘膜下層にとどまりカリフラワー様の形態。浸潤性癌は筋層に達し予後不良。過去問出題済み。"}, {"c": "★過去問", "p": 1, "q": "二次性高血圧で最も多い原因臓器はどれか。", "a": 2, "cs": ["心臓", "副腎", "腎臓", "甲状腺"], "ep": "二次性高血圧の最多原因は腎臓（腎性高血圧）。慢性糸球体腎炎・腎動脈狭窄などが原因。過去問出題済み。"}, {"c": "★過去問", "p": 1, "q": "神経線維腫症（レックリングハウゼン病）の遺伝様式はどれか。", "a": 0, "cs": ["常染色体顕性遺伝", "常染色体潜性遺伝", "伴性潜性遺伝", "多因子遺伝"], "ep": "神経線維腫症（NF1）は常染色体顕性遺伝。皮膚の神経線維腫とカフェ・オ・レ斑が特徴。過去問出題済み。"}, {"c": "★過去問", "p": 1, "q": "血液凝固因子の産生障害をきたす疾患はどれか。", "a": 0, "cs": ["肝障害（肝硬変・肝炎など）", "腎障害（慢性腎不全）", "骨髄抑制（抗癌剤投与）", "脾機能亢進症"], "ep": "凝固因子の多くは肝臓で産生されるため、肝障害では凝固因子の産生が低下し出血傾向をきたす。過去問出題済み。"}, {"c": "循環器系疾患", "p": 0, "q": "虚血性心疾患の定義として正しいものはどれか。", "a": 1, "cs": ["心筋の炎症による心機能の低下", "冠状動脈の病変による心筋の虚血と心機能の低下", "心臓弁膜の変形による血流障害", "高血圧による心筋の過剰な肥大"], "ep": "虚血性心疾患は冠状動脈の病変→心筋の虚血→心機能の低下をきたす疾患群。狭心症と心筋梗塞に大別される。"}, {"c": "循環器系疾患", "p": 1, "q": "狭心症と心筋梗塞の違いで正しいものはどれか。", "a": 2, "cs": ["狭心症：壊死あり・持続する強い痛み", "狭心症：凝固壊死・ニトログリセリンで消失しない", "狭心症：壊死なし・15分以内・ニトログリセリン舌下で消失。心筋梗塞：凝固壊死・持続する強い痛み", "狭心症・心筋梗塞ともに壊死を生じる"], "ep": "狭心症は一過性の心筋虚血・壊死なし・ニトログリセリン舌下で消失。心筋梗塞は粥状硬化→血栓→冠動脈閉塞→凝固壊死。"}, {"c": "循環器系疾患", "p": 0, "q": "求心性肥大の原因として正しいものはどれか。", "a": 0, "cs": ["高血圧・大動脈弁狭窄症による圧負荷→心臓の壁が厚くなり心腔が狭くなる", "大動脈弁閉鎖不全による容量負荷→心腔が広がる", "心房細動による不整脈→心筋の廃用性萎縮", "心筋炎による線維化・収縮"], "ep": "求心性肥大は圧負荷の上昇により心臓の壁が厚くなり心腔が狭くなるタイプ。高血圧・弁狭窄が原因。拡張性肥大（弁閉鎖不全→容量負荷）と区別する。"}, {"c": "循環器系疾患", "p": 0, "q": "ファロー四徴症の4つの奇形の組み合わせはどれか。", "a": 3, "cs": ["心室中隔欠損・心房中隔欠損・動脈管開存・大動脈騎乗", "肺動脈狭窄・心房中隔欠損・大動脈騎乗・左心室肥大", "心室中隔欠損・大動脈騎乗・肺高血圧症・左心室肥大", "肺動脈狭窄・心室中隔欠損・大動脈騎乗・右心室肥大"], "ep": "ファロー四徴症：肺動脈狭窄・心室中隔欠損・大動脈騎乗・右心室肥大の4奇形。語呂：はい・しつ・だい・みぎ。"}, {"c": "循環器系疾患", "p": 0, "q": "動脈硬化の4大危険因子はどれか。", "a": 1, "cs": ["高血圧・肥満・飲酒・ストレス", "高血圧・糖尿病・脂質異常症・喫煙", "糖尿病・肥満・喫煙・運動不足", "脂質異常症・高血圧・飲酒・加齢"], "ep": "動脈硬化の4大危険因子：高血圧・糖尿病・脂質異常症・喫煙。これらが重なると動脈硬化が加速する。"}, {"c": "循環器系疾患", "p": 0, "q": "粥状硬化症（アテローム硬化）の成り立ちとして正しいものはどれか。", "a": 2, "cs": ["カルシウムが血管壁に沈着し血管が硬化する", "尿酸塩が血管壁に沈着し炎症を起こす", "内膜の脂肪沈着→貪食細胞が取り込み粥腫形成→潰瘍化→血栓形成・動脈瘤", "免疫複合体が血管壁に沈着し血管炎を起こす"], "ep": "粥状硬化症：内膜のLDL沈着→マクロファージが取り込み粥腫（アテローム）形成→潰瘍化→血栓形成・石灰沈着→動脈瘤。"}, {"c": "循環器系疾患", "p": 0, "q": "解離性大動脈瘤と嚢状大動脈瘤の違いとして正しいものはどれか。", "a": 0, "cs": ["解離性：内膜の亀裂→中膜に血液侵入（高血圧・マルファン症候群）。嚢状：血管壁が三層のまま膨れる（動脈硬化・梅毒）", "解離性：血管壁が三層のまま膨れる。嚢状：内膜の亀裂→中膜に血液侵入", "解離性・嚢状ともに動脈硬化のみが原因", "解離性：静脈に生じる。嚢状：動脈に生じる"], "ep": "解離性：内膜の亀裂→中膜に血液侵入（高血圧・マルファン症候群）。嚢状：血管壁が三層のまま膨れる（動脈硬化・梅毒）。"}, {"c": "循環器系疾患", "p": 0, "q": "心室中隔欠損症の病態として正しいものはどれか。", "a": 2, "cs": ["左右の心房が交通する先天性心疾患", "肺動脈と大動脈が交通する先天性心疾患", "左右の心室が交通する先天性心疾患（最も頻度が高い）", "心臓弁膜の変形による血流障害"], "ep": "心室中隔欠損症は左右の心室が交通する先天性心疾患で、先天性心疾患の中で最も頻度が高い。"}, {"c": "シラバス補完", "p": 0, "q": "乾酪様変化（乾酪様壊死）の特徴として正しいものはどれか。", "a": 1, "cs": ["脳梗塞で生じる高度な自己融解による壊死", "結核病巣の中心部にチーズ様の壊死が生じる", "心筋梗塞で生じる高度なタンパク質変性による壊死", "ガス産生菌の感染で生じる壊死"], "ep": "乾酪様変化は結核に特徴的で、病巣の中心部にチーズ様の壊死が生じる。融解壊死＝脳梗塞、凝固壊死＝心筋梗塞と区別。"}, {"c": "シラバス補完", "p": 0, "q": "ネフローゼ症候群と急性糸球体腎炎の鑑別で正しいものはどれか。", "a": 3, "cs": ["ネフローゼ：血尿・高血圧が主。急性糸球体腎炎：タンパク尿・浮腫が主", "どちらも細菌の直接感染による腎炎", "どちらも免疫複合体の沈着によって生じる", "ネフローゼ：タンパク尿→低アルブミン→浮腫。急性糸球体腎炎：連鎖球菌後→免疫複合体（III型）→血尿・乏尿"], "ep": "ネフローゼ症候群：大量タンパク尿→低アルブミン→浮腫。急性糸球体腎炎：連鎖球菌感染後→免疫複合体が糸球体に沈着→血尿・乏尿・高血圧。"}, {"c": "シラバス補完", "p": 0, "q": "粟粒結核の病態として正しいものはどれか。", "a": 0, "cs": ["結核菌が血行性に全身諸臓器に播種され粟粒大の多数の病巣を形成する", "結核菌が空気感染で肺のみに病巣を形成する", "結核菌が経口感染で消化管のみに感染する", "結核菌の初感染後に石灰化するだけ"], "ep": "粟粒結核は結核菌が血行性に全身諸臓器に播種され、粟粒大の多数の病巣を各臓器に形成する重症型。"}, {"c": "シラバス補完", "p": 0, "q": "多発性硬化症（MS）の特徴として正しいものはどれか。", "a": 2, "cs": ["60歳以降に発症し脳全体の萎縮と老人斑が特徴", "40〜60歳に発症し黒質のメラニン含有細胞の変性とレビー小体が特徴", "全中枢神経の白質に脱髄病変が多発し視力障害・四肢麻痺など多彩な神経症状を呈する", "中高年・男性に多く上位・下位運動ニューロンの変性による筋萎縮"], "ep": "多発性硬化症（MS）は脱髄疾患で、全中枢神経の白質に脱髄病変が多発する。視力障害・四肢麻痺など多彩な神経症状を呈し再発・寛解を繰り返す。"}, {"c": "シラバス補完", "p": 0, "q": "家族性大腸ポリポーシスの特徴として正しいものはどれか。", "a": 0, "cs": ["常染色体顕性遺伝・大腸粘膜に多発するポリープ・放置すると癌化", "伴性潜性遺伝・小腸に多発するポリープ・自然治癒することが多い", "多因子遺伝・胃に多発するポリープ・抗菌薬で治療可能", "常染色体潜性遺伝・直腸にのみポリープが生じる・癌化しない"], "ep": "家族性大腸ポリポーシスは常染色体顕性遺伝。大腸粘膜に多発するポリープが生じ放置すると必ず癌化するため予防的大腸切除が行われる。"}, {"c": "シラバス補完", "p": 0, "q": "リウマチ性心内膜炎と感染性心内膜炎の違いで正しいものはどれか。", "a": 1, "cs": ["リウマチ性：黄色ブドウ球菌が弁に直接感染。感染性：自己抗体による弁の炎症", "リウマチ性：A群β溶血性連鎖球菌感染後の自己抗体による弁の炎症。感染性：細菌が直接弁に感染（抜歯後など）", "リウマチ性・感染性ともに細菌の直接感染による", "リウマチ性：ウイルス感染。感染性：真菌感染"], "ep": "リウマチ性心内膜炎はA群β溶血性連鎖球菌感染後の自己抗体による免疫反応で弁に炎症。感染性心内膜炎は抜歯後などに細菌が直接弁に感染する。どちらも最終的に心弁膜症→心肥大をきたす。"}, {"c": "シラバス補完", "p": 0, "q": "感染性心内膜炎の原因として正しいものはどれか。", "a": 2, "cs": ["A群β溶血性連鎖球菌感染後の自己抗体による心内膜炎", "HPV感染による心内膜の腫瘍性変化", "抜歯後・手術後・カテーテル操作後に細菌（緑色連鎖球菌など）が直接弁に感染", "アレルギー性血管炎による心内膜の障害"], "ep": "感染性心内膜炎は抜歯後・手術後・カテーテル操作→血流に細菌が入り心内膜（弁）に直接感染する。起因菌は緑色連鎖球菌・黄色ブドウ球菌が多い。"}];

let deck=[], idx=0, answered=false, corrN=0, wrongN=0;
let wrongIds=new Set(), mode='all', catF='all';

const CATS = [...new Set(ALL.map(q=>q.c))];

function buildDeck(){
  let src = mode==='weak' ? ALL.filter((_,i)=>wrongIds.has(i)) : [...ALL];
  if(catF!=='all') src = src.filter(q=>q.c===catF);
  if(src.length===0) src=[...ALL];
  deck = src.map(q=>({...q, _o:ALL.indexOf(q)}));
  idx=0; answered=false;
}

function shuf(){
  buildDeck();
  for(let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  render();
}

function setMode(m){mode=m;buildDeck();render();}
function setCat(c){catF=c;buildDeck();render();}

function pick(ci){
  if(answered) return;
  answered=true;
  const cur=deck[idx];
  const ok = ci===cur.a;
  if(ok) corrN++; else {wrongN++; wrongIds.add(cur._o);}
  
  const buttons=document.querySelectorAll('#choices .ch');
  buttons.forEach((btn,i)=>{
    btn.classList.add('dis');
    btn.classList.remove('ch');
    btn.classList.add('ch');
    if(i===cur.a){
      btn.classList.add(ok&&i===ci?'ok':'rv');
    } else if(i===ci){
      btn.classList.add('ng');
    }
  });
  
  const ep=document.getElementById('exp-box');
  ep.innerHTML = '<strong>解説：</strong>' + cur.ep;
  ep.style.display='block';
  
  const nb=document.getElementById('next-btn');
  nb.textContent = idx+1<deck.length?'次の問題 →':'結果を見る →';
  nb.style.display='block';
  
  updateStats();
}

function next(){
  idx++;answered=false;
  render();
}

function pct(){
  const t=corrN+wrongN;
  return t?Math.round(corrN/t*100):null;
}

function updateStats(){
  const p=pct();
  document.getElementById('hp').textContent = p!==null?p+'%':'-';
  document.getElementById('qcount').textContent = idx+'/'+deck.length;
  document.getElementById('pf').style.width = deck.length?Math.round(idx/deck.length*100)+'%':'0%';
}

function renderModebar(){
  const mb=document.getElementById('mode-bar');
  mb.innerHTML='';
  [['all','全問('+ALL.length+')'],['weak','苦手('+wrongIds.size+')']].forEach(([m,lbl])=>{
    const btn=document.createElement('button');
    btn.className='mbtn'+(mode===m?' on':'');
    btn.textContent=lbl;
    btn.addEventListener('click',()=>setMode(m));
    mb.appendChild(btn);
  });
  const shufBtn=document.createElement('button');
  shufBtn.className='mbtn';
  shufBtn.textContent='シャッフル';
  shufBtn.addEventListener('click',shuf);
  mb.appendChild(shufBtn);
}

function renderCatbar(){
  const cb=document.getElementById('cat-bar');
  cb.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='fbtn'+(catF==='all'?' on':'');
  allBtn.textContent='すべて';
  allBtn.addEventListener('click',()=>setCat('all'));
  cb.appendChild(allBtn);
  CATS.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='fbtn'+(catF===c?' on':'');
    btn.textContent=c;
    btn.addEventListener('click',()=>setCat(c));
    cb.appendChild(btn);
  });
}

function render(){
  renderModebar();
  renderCatbar();
  updateStats();
  
  const main=document.getElementById('main');
  main.innerHTML='';
  
  if(!deck.length){buildDeck();}
  
  if(idx>=deck.length){
    // Result screen
    const p=pct();
    const res=document.createElement('div');
    res.className='res';
    res.innerHTML='<div class="rs">'+(p!==null?p+'%':'-')+'</div>'
      +'<div class="rl">正答率（'+corrN+'問正解 / '+(corrN+wrongN)+'問）</div>'
      +'<div class="rbd">'
        +'<div class="ri c"><div class="rin">'+corrN+'</div><div class="ril">正解</div></div>'
        +'<div class="ri w"><div class="rin">'+wrongN+'</div><div class="ril">不正解</div></div>'
        +'<div class="ri"><div class="rin">'+wrongIds.size+'</div><div class="ril">苦手登録</div></div>'
      +'</div>'
      +'<div class="rbs" id="res-btns"></div>';
    main.appendChild(res);
    const btns=document.getElementById('res-btns');
    const r1=document.createElement('button');r1.className='rbtn';r1.textContent='最初から';
    r1.addEventListener('click',()=>{idx=0;answered=false;corrN=0;wrongN=0;render();});
    btns.appendChild(r1);
    if(wrongIds.size>0){
      const r2=document.createElement('button');r2.className='rbtn pri';r2.textContent='苦手のみ練習';
      r2.addEventListener('click',()=>setMode('weak'));
      btns.appendChild(r2);
    }
    const r3=document.createElement('button');r3.className='rbtn';r3.textContent='シャッフル';
    r3.addEventListener('click',shuf);
    btns.appendChild(r3);
    return;
  }
  
  const cur=deck[idx];
  document.getElementById('qlabel').textContent='第'+(idx+1)+'問 '+cur.c+(cur.p?' ⚡':'');
  
  // Question card
  const qc=document.createElement('div');qc.className='qcard';
  const qm=document.createElement('div');qm.className='qmeta';
  const cp=document.createElement('span');cp.className='cpill';cp.textContent=cur.c;
  qm.appendChild(cp);
  if(cur.p){const pt=document.createElement('span');pt.className='past';pt.textContent='過去問傾向';qm.appendChild(pt);}
  const qt=document.createElement('div');qt.className='qtext';qt.textContent=cur.q;
  qc.appendChild(qm);qc.appendChild(qt);
  main.appendChild(qc);
  
  // Choices
  const chs=document.getElementById('choices')||document.createElement('div');
  chs.id='choices';chs.innerHTML='';
  chs.className='';
  chs.style.cssText='display:flex;flex-direction:column;gap:6px';
  const nums=['①','②','③','④'];
  cur.cs.forEach((txt,ci)=>{
    const btn=document.createElement('button');
    btn.className='ch';
    const cn=document.createElement('span');cn.className='cn';cn.textContent=nums[ci];
    const ctxt=document.createElement('span');ctxt.textContent=txt;
    btn.appendChild(cn);btn.appendChild(ctxt);
    btn.addEventListener('click',()=>pick(ci));
    chs.appendChild(btn);
  });
  main.appendChild(chs);
  
  // Explanation box
  const ep=document.createElement('div');ep.id='exp-box';ep.style.display='none';
  ep.style.cssText='margin-top:.85rem;padding:10px 12px;border-radius:8px;background:var(--sur2);border-left:3px solid var(--ac);font-size:12.5px;line-height:1.7;color:#3A3830;display:none';
  main.appendChild(ep);
  
  // Next button
  const nb=document.createElement('button');
  nb.id='next-btn';
  nb.style.cssText='display:none;width:100%;margin-top:.85rem;padding:10px;border-radius:8px;background:var(--ac);color:#fff;border:none;font-size:13px;cursor:pointer';
  nb.addEventListener('click',next);
  main.appendChild(nb);
}

buildDeck();render();
</script>
</body>
</html>
