<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ST定期テスト対策｜後半分 新形式100問</title>
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --border: #dde3ea;
  --text: #1a2332;
  --sub: #6b7a8d;
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --correct: #16a34a;
  --correct-bg: #f0fdf4;
  --wrong: #dc2626;
  --wrong-bg: #fef2f2;
  --star: #d97706;
  --tag-multi: #7c3aed;
  --tag-combo: #0891b2;
  --tag-blank: #b45309;
  --tag-multi-bg: #f5f3ff;
  --tag-combo-bg: #ecfeff;
  --tag-blank-bg: #fffbeb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

/* ヘッダー */
header { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); color: #fff; padding: 20px 24px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; }
header p { font-size: 0.75rem; opacity: 0.8; margin-top: 3px; }

main { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; }

/* スタートメニュー */
.start-title { font-size: 0.8rem; font-weight: 700; color: var(--sub); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--border); }

.format-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.fmt-badge { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
.fmt-multi { background: var(--tag-multi-bg); color: var(--tag-multi); border: 1px solid #c4b5fd; }
.fmt-combo { background: var(--tag-combo-bg); color: var(--tag-combo); border: 1px solid #a5f3fc; }
.fmt-blank { background: var(--tag-blank-bg); color: var(--tag-blank); border: 1px solid #fcd34d; }

.cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.cat-btn { background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 14px 12px; cursor: pointer; text-align: left; transition: all 0.15s; }
.cat-btn:hover { border-color: var(--accent); background: var(--accent-light); }
.cat-label { font-size: 0.68rem; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; margin-bottom: 3px; }
.cat-title { font-size: 0.88rem; font-weight: 700; }
.cat-count { font-size: 0.68rem; color: var(--sub); margin-top: 3px; }

.all-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: opacity 0.15s; margin-bottom: 8px; }
.all-btn:hover { opacity: 0.88; }
.rand-btn { width: 100%; background: var(--star); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 0.9rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: opacity 0.15s; }
.rand-btn:hover { opacity: 0.88; }

/* 進捗 */
#progress-wrap { display: none; margin-bottom: 16px; }
#prog-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--sub); margin-bottom: 5px; }
#prog-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
#prog-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; }

/* 問題カード */
#quiz-area { display: none; }
.q-card { background: var(--surface); border-radius: 16px; padding: 22px 20px; margin-bottom: 14px; border: 1.5px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.04); }

.q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.q-num { font-size: 0.7rem; font-weight: 700; color: var(--sub); }
.q-type-badge { font-size: 0.65rem; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
.q-type-multi { background: var(--tag-multi-bg); color: var(--tag-multi); }
.q-type-combo { background: var(--tag-combo-bg); color: var(--tag-combo); }
.q-type-blank { background: var(--tag-blank-bg); color: var(--tag-blank); }
.q-unit { font-size: 0.65rem; color: var(--sub); background: #f1f5f9; padding: 2px 7px; border-radius: 10px; }

.q-text { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; line-height: 1.75; }
.q-text .blank { display: inline-block; background: #e0e7ff; border-bottom: 2px solid var(--accent); padding: 0 6px; border-radius: 3px; font-weight: 700; color: var(--accent); min-width: 60px; text-align: center; }
.q-note { font-size: 0.75rem; color: var(--sub); margin-bottom: 10px; font-style: italic; }

/* 選択肢 */
.choices { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.choice { padding: 10px 14px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--surface); font-size: 0.86rem; font-family: inherit; cursor: pointer; text-align: left; transition: all 0.12s; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
.choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-light); }
.choice-label { font-weight: 700; color: var(--accent); min-width: 22px; flex-shrink: 0; }
.choice.selected { border-color: var(--accent); background: var(--accent-light); }
.choice.selected .choice-label { color: var(--accent); }
.choice.correct-ans { border-color: var(--correct); background: var(--correct-bg); }
.choice.correct-ans .choice-label { color: var(--correct); }
.choice.wrong-ans { border-color: var(--wrong); background: var(--wrong-bg); }
.choice.wrong-ans .choice-label { color: var(--wrong); }
.choice:disabled { cursor: default; }
.choice.partial { border-color: var(--star); background: #fffbeb; }

/* 複数選択用チェックボックス風 */
.checkbox { width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 4px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; }
.choice.selected .checkbox { background: var(--accent); border-color: var(--accent); color: #fff; }
.choice.correct-ans .checkbox { background: var(--correct); border-color: var(--correct); color: #fff; }
.choice.wrong-ans .checkbox { background: var(--wrong); border-color: var(--wrong); color: #fff; }

/* ボタン */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.84rem; font-weight: 700; font-family: inherit; transition: all 0.12s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.88; }
.btn-sub { background: #f1f5f9; color: var(--text); }
.btn-sub:hover { background: var(--border); }
.btn-skip { background: transparent; color: var(--sub); border: 1.5px solid var(--border); }

/* 解説 */
.explanation { display: none; margin-top: 14px; border-top: 1.5px solid var(--border); padding-top: 12px; }
.explanation.show { display: block; }
.exp-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
.exp-correct { background: var(--correct-bg); color: var(--correct); }
.exp-wrong { background: var(--wrong-bg); color: var(--wrong); }
.exp-partial { background: #fffbeb; color: var(--star); }
.exp-text { font-size: 0.86rem; line-height: 1.7; white-space: pre-wrap; }
.exp-label { font-size: 0.68rem; font-weight: 700; color: var(--sub); letter-spacing: 0.08em; margin-bottom: 5px; }

/* スコア画面 */
#score-screen { display: none; background: var(--surface); border-radius: 16px; padding: 32px 24px; text-align: center; border: 1.5px solid var(--border); }
#score-screen h2 { font-size: 1.3rem; margin-bottom: 8px; }
#score-big { font-size: 3rem; font-weight: 700; color: var(--accent); }
#score-pct { font-size: 0.85rem; color: var(--sub); margin-top: 4px; margin-bottom: 8px; }
.score-breakdown { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
.score-item { font-size: 0.78rem; color: var(--sub); }
.score-item strong { display: block; font-size: 1.2rem; font-weight: 700; color: var(--text); }
#wrong-review { text-align: left; margin-top: 20px; }
#wrong-review h3 { font-size: 0.82rem; font-weight: 700; color: var(--wrong); margin-bottom: 8px; }
.wrong-item { font-size: 0.78rem; padding: 7px 10px; background: var(--wrong-bg); border-radius: 6px; margin-bottom: 5px; line-height: 1.5; }

/* ナビ */
#nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1.5px solid var(--border); padding: 10px 16px; display: none; gap: 8px; justify-content: center; z-index: 100; }
#nav.show { display: flex; }
#nav .btn { flex: 1; max-width: 150px; text-align: center; }

@media(max-width:480px){
  .cat-grid { grid-template-columns: 1fr; }
  .q-text { font-size: 0.88rem; }
}
</style>
</head>
<body>
<header>
  <h1>ST定期テスト対策｜後半分 新形式100問</h1>
  <p>複数選択・組み合わせ・穴埋め選択の3形式ミックス（⑧〜⑭）</p>
</header>

<main>
<div id="start-menu">
  <div class="start-title">出題形式</div>
  <div class="format-legend">
    <span class="fmt-badge fmt-multi">🔲 複数選択｜正しいものをすべて選べ</span>
    <span class="fmt-badge fmt-combo">🔗 組み合わせ｜正しい対応を選べ</span>
    <span class="fmt-badge fmt-blank">📝 穴埋め｜空欄に入る語句を選べ</span>
  </div>
  <div class="start-title">カテゴリーから選ぶ</div>
  <div class="cat-grid">
    <button class="cat-btn" onclick="startQuiz('u8')"><div class="cat-label">⑧ SESSION 8</div><div class="cat-title">口腔咽頭の病態</div><div class="cat-count">18問</div></button>
    <button class="cat-btn" onclick="startQuiz('u10')"><div class="cat-label">⑩ SESSION 10</div><div class="cat-title">呼吸器・食道の病態</div><div class="cat-count">16問</div></button>
    <button class="cat-btn" onclick="startQuiz('u11')"><div class="cat-label">⑪ SESSION 11</div><div class="cat-title">音声障害１（良性疾患）</div><div class="cat-count">18問</div></button>
    <button class="cat-btn" onclick="startQuiz('u12')"><div class="cat-label">⑫ SESSION 12</div><div class="cat-title">音声障害２（悪性腫瘍）</div><div class="cat-count">16問</div></button>
    <button class="cat-btn" onclick="startQuiz('u13')"><div class="cat-label">⑬ SESSION 13</div><div class="cat-title">音声障害３（機能的）</div><div class="cat-count">16問</div></button>
    <button class="cat-btn" onclick="startQuiz('u14')"><div class="cat-label">⑭ SESSION 14</div><div class="cat-title">反回神経麻痺・甲状腺</div><div class="cat-count">16問</div></button>
  </div>
  <button class="all-btn" onclick="startQuiz('all')">全100問に挑戦</button>
  <button class="rand-btn" onclick="startQuiz('random')">ランダム30問</button>
</div>

<div id="progress-wrap">
  <div id="prog-info"><span id="prog-text">1/100</span><span id="prog-score">正解: 0</span></div>
  <div id="prog-bar"><div id="prog-fill" style="width:0%"></div></div>
</div>

<div id="quiz-area"></div>

<div id="score-screen">
  <h2>お疲れさまでした！</h2>
  <div id="score-big">0/0</div>
  <div id="score-pct"></div>
  <div class="score-breakdown">
    <div class="score-item"><strong id="s-multi">-</strong>複数選択</div>
    <div class="score-item"><strong id="s-combo">-</strong>組み合わせ</div>
    <div class="score-item"><strong id="s-blank">-</strong>穴埋め</div>
  </div>
  <button class="btn btn-primary" onclick="showMenu()" style="margin-top:8px;">メニューに戻る</button>
  <div id="wrong-review"></div>
</div>
</main>

<div id="nav">
  <button class="btn btn-sub" onclick="prevQ()">◀ 前へ</button>
  <button class="btn btn-primary" onclick="nextQ()">次へ ▶</button>
</div>

<script>
// ===================================================================
// 問題データ（100問）
// type: 'multi'=複数選択, 'combo'=組み合わせ, 'blank'=穴埋め

// blank: q(空欄__), choices[], correct=正解インデックス

 choices:['ムンプスウィルスによる感染症である','通常は両側性に耳下腺が腫脹する','顎下腺は腫脹しない','感音難聴を生じ得る3Mの1つである','EBウイルスが原因である'],

 correct:[0,1,2,4]},

{u:'u8', type:'multi', tag:'⑧口腔咽頭',

let results=[], selections=[];

function startQuiz(mode){
  let list=[];
  if(mode==='all') list=[...Q];
  else if(mode==='random'){list=[...Q].sort(()=>Math.random()-0.5).slice(0,30);}
  else list=Q.filter(q=>q.u===mode);

  currentList=list; idx=0; correct=0; wrongList=[];
  results=new Array(list.length).fill(null);
  selections=new Array(list.length).fill(null);
  typeCounts={multi:{total:0,correct:0},combo:{total:0,correct:0},blank:{total:0,correct:0}};

  document.getElementById('start-menu').style.display='none';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('progress-wrap').style.display='block';
  document.getElementById('quiz-area').style.display='block';
  document.getElementById('nav').classList.add('show');
  render();
}

function render(){
  const q=currentList[idx];
  const total=currentList.length;
  document.getElementById('prog-text').textContent=`${idx+1}/${total}`;
  document.getElementById('prog-score').textContent=`正解: ${correct}`;
  document.getElementById('prog-fill').style.width=(idx/total*100).toFixed(0)+'%';

  const typeBadge={multi:'🔲 複数選択',combo:'🔗 組み合わせ',blank:'📝 穴埋め'};
  const typeClass={multi:'q-type-multi',combo:'q-type-combo',blank:'q-type-blank'};

  let noteHtml='';
  
  const qText = q.type==='blank'
    ? q.q.replace(/__/g,'<span class="blank">　　　</span>')
    : q.q;

  const answered = results[idx]!==null;
  const sel = selections[idx];

  let choicesHtml='';
  const labels=['A','B','C','D','E'];

  if(q.type==='multi'){
    choicesHtml='<div class="choices">';
    q.choices.forEach((c,i)=>{
      let cls='choice';
      let checkContent='';
      if(answered){
        const isCorrect=q.correct.includes(i);
        const isSelected=sel&&sel.includes(i);
        if(isCorrect&&isSelected){cls+=' correct-ans';checkContent='✓';}
        else if(isCorrect&&!isSelected){cls+=' correct-ans';checkContent='✓';}
        else if(!isCorrect&&isSelected){cls+=' wrong-ans';checkContent='✗';}
        else{checkContent='';}
      } else {
        if(sel&&sel.includes(i)){cls+=' selected';checkContent='✓';}
      }
      const dis=answered?'disabled':'';
      choicesHtml+=`<button class="${cls}" ${dis} onclick="toggleMulti(${i})">
        <div class="checkbox">${checkContent}</div>
        <span>${c}</span>
      </button>`;
    });
    choicesHtml+='</div>';
  } else {
    choicesHtml='<div class="choices">';
    q.choices.forEach((c,i)=>{
      let cls='choice';
      if(answered){
        if(i===q.correct){cls+=' correct-ans';}
        else if(sel===i&&i!==q.correct){cls+=' wrong-ans';}
      } else {
        if(sel===i) cls+=' selected';
      }
      const dis=answered?'disabled':'';
      choicesHtml+=`<button class="${cls}" ${dis} onclick="selectSingle(${i})">
        <span class="choice-label">${labels[i]}</span>
        <span>${c}</span>
      </button>`;
    });
    choicesHtml+='</div>';
  }

  let btnHtml='';
  if(q.type==='multi'&&!answered){
    btnHtml=`<div class="btn-row"><button class="btn btn-primary" onclick="submitMulti()">確認する</button><button class="btn btn-skip" onclick="nextQ()">スキップ</button></div>`;
  } else if(!answered){
    btnHtml=`<div class="btn-row"><button class="btn btn-skip" onclick="nextQ()">スキップ</button></div>`;
  } else {
    btnHtml=`<div class="btn-row"><button class="btn btn-primary" onclick="nextQ()">次へ ▶</button></div>`;
  }

  let expHtml='';
  if(answered){
    const r=results[idx];
    const badgeCls=r==='correct'?'exp-correct':r==='partial'?'exp-partial':'exp-wrong';
    const badgeText=r==='correct'?'✓ 正解！':r==='partial'?'△ 部分正解':'✗ 不正解';
    let ansText='';
    if(q.type==='multi'){
      const correctLabels=q.correct.map(i=>labels[i]+'：'+q.choices[i]).join('\n');
      ansText=`正解：${q.correct.map(i=>labels[i]).join('・')}\n${correctLabels}`;
    } else {
      ansText=`正解：${labels[q.correct]}　${q.choices[q.correct]}`;
    }
    const expNote = q.exp ? `<div class="exp-label" style="margin-top:10px;">EXPLANATION</div><div class="exp-text" style="color:#374151;">${q.exp}</div>` : '';
    expHtml=`<div class="explanation show">
      <div class="exp-badge ${badgeCls}">${badgeText}</div>
      <div class="exp-label">ANSWER</div>
      <div class="exp-text">${ansText}</div>
      ${expNote}
    </div>`;
  }

  document.getElementById('quiz-area').innerHTML=`
    <div class="q-card">
      <div class="q-meta">
        <span class="q-num">Q${idx+1}</span>
        <span class="q-type-badge ${typeClass[q.type]}">${typeBadge[q.type]}</span>
        
      </div>
      <div class="q-text">${qText}</div>
      ${choicesHtml}
      ${btnHtml}
      ${expHtml}
    </div>`;
  window.scrollTo(0,0);
}

function toggleMulti(i){
  if(results[idx]!==null) return;
  let sel=selections[idx]||[];
  if(sel.includes(i)) sel=sel.filter(x=>x!==i);
  else sel=[...sel,i];
  selections[idx]=sel;
  render();
}

function submitMulti(){
  const q=currentList[idx];
  const sel=selections[idx]||[];
  const correctSet=new Set(q.correct);
  const selSet=new Set(sel);
  let r='wrong';
  if(sel.length===q.correct.length&&q.correct.every(i=>selSet.has(i))){r='correct';}
  else if(q.correct.some(i=>selSet.has(i))){r='partial';}
  results[idx]=r;
  typeCounts[q.type].total++;
  if(r==='correct'){correct++;typeCounts[q.type].correct++;}
  else if(r!=='partial'){wrongList.push(idx);}
  render();
}

function selectSingle(i){
  if(results[idx]!==null) return;
  const q=currentList[idx];
  selections[idx]=i;
  const r=i===q.correct?'correct':'wrong';
  results[idx]=r;
  typeCounts[q.type].total++;
  if(r==='correct'){correct++;typeCounts[q.type].correct++;}
  else{wrongList.push(idx);}
  render();
}

function nextQ(){
  if(idx<currentList.length-1){idx++;render();}
  else showScore();
}
function prevQ(){if(idx>0){idx--;render();}}

function showScore(){
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('progress-wrap').style.display='none';
  document.getElementById('nav').classList.remove('show');
  document.getElementById('score-screen').style.display='block';

  const total=currentList.length;
  const pct=Math.round(correct/total*100);
  document.getElementById('score-big').textContent=`${correct}/${total}`;
  document.getElementById('score-pct').textContent=`正解率 ${pct}%`;

  const fmt=(t)=>t.total>0?`${t.correct}/${t.total}`:'-';
  document.getElementById('s-multi').textContent=fmt(typeCounts.multi);
  document.getElementById('s-combo').textContent=fmt(typeCounts.combo);
  document.getElementById('s-blank').textContent=fmt(typeCounts.blank);

  let wHtml='';
  if(wrongList.length>0){
    wHtml='<h3>📝 要復習リスト</h3>';
    wrongList.forEach(i=>{
      wHtml+=`<div class="wrong-item"><strong>Q${i+1}（${currentList[i].tag}）：</strong>${currentList[i].q.substring(0,40)}…</div>`;
    });
  } else {
    wHtml='<div style="text-align:center;color:var(--correct);font-weight:700;margin-top:16px;">全問正解！素晴らしい🎉</div>';
  }
  document.getElementById('wrong-review').innerHTML=wHtml;
}

function showMenu(){
  document.getElementById('start-menu').style.display='block';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('progress-wrap').style.display='none';
  document.getElementById('nav').classList.remove('show');
}
</script>
</body>
</html>
