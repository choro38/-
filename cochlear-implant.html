, "g": "g6", "cat": "小児のハビリテーション", "q": "小児のハビリテーションについて、正しいのはどれか。", "opts": ["装用直後から聴覚のみで訓練する", "視覚情報の併用は聴覚発達を妨げる", "訓練は病院内で完結させる", "保護者の関与は最小限にとどめる", "母子関係の改善を図る"], "ans": [4], "exp": "<div><b>【正解】⑤<\/b><\/div><div>母子間の愛着形成・情緒的コミュニケーションを深める支援を行う。<\/div><div>×1：聴覚情報も視覚情報も併用して脳を活性化する。<\/div><div>×2：視覚情報の併用は妨げない。聴覚のみに限らない。<\/div><div>×3：病院と学校など関係各所の連携は不可欠。<\/div><div>×4：長期にわたる継続的な家族の協力が前提。<\/div><div>【出典】過去問 問題14<\/div>", "star": false, "memo": "※過去問の(1)「重度内耳奇形で顔面痙攣が出現することがある」と(5)「送信コイルの磁石は音入れ時の強度を維持する」は、過去問に解説がなく根拠が確認できないため本問では不採用。", "chk": true}, {"id": "q19", "g": "g6", "cat": "小児のハビリテーション", "q": "小児のハビリテーションについて、間違っているのはどれか。", "opts": ["内容・頻度は個々の児に応じて設定する", "装用児の自発性は訓練を妨げない", "病院と学校の連携は不可欠である", "健聴の兄弟がいても個別の指導が必要である", "人工内耳と補聴器の併用は禁忌である"], "ans": [4], "exp": "<div><b>【正解】⑤（誤文）<\/b><\/div><div>禁忌ではない。補聴の基本は両耳聴で、反対耳の補聴器併用(両耳)も含めて否定しない。<\/div><div>○1：人それぞれで個別に決める。<\/div><div>○2：自発性がある方が訓練の効果は高い。<\/div><div>○3：関係各所の連携は必要不可欠。<\/div><div>○4：個々の特徴を踏まえた個別指導は不可欠。<\/div><div>【出典】過去問 問題15<\/div>", "star": true, "memo": "※過去問解説は「ハイブリッド装用(同じ耳での電気音響刺激:EAS)は別に禁忌ではない。それが両耳だとしても」と書いている。厳密には、同側の併用はEAS、反対耳の補聴器併用はバイモーダル装用で区別される(補足)。", "chk": true}, {"id": "q20", "g": "g6", "cat": "成人中途失聴者", "q": "成人<ruby>中途失聴者<rt>ちゅうとしっちょうしゃ<\/rt><\/ruby>の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に強く影響する因子として、正しいのはどれか。", "opts": ["失聴期間", "失聴原因の違い", "年齢", "性別", "手術を受けた耳の左右"], "ans": [0], "exp": "<div><b>【正解】①<\/b><\/div><div>失聴期間が長いと語音聴取能および分解能への影響がある。<\/div><div>×2：成人中途失聴者では失聴原因の違いによる語音聴取能の差はない(先生・過去問)。<\/div><div>×3：影響はあるものの強く影響するとは限らない。<\/div><div>×4：強く影響する因子ではない。<\/div><div>×5：強く影響する因子ではない。<\/div><div>【出典】過去問 問題16<\/div>", "star": true, "memo": "※「失聴原因で差はない」は先生・過去問の説明。ただし後迷路性病変や中枢性聴覚障害の合併は、適応判断で別に「慎重な判断」の対象(神経が働かない場合は電気刺激が伝わっても処理できないため)。", "chk": true}, {"id": "q21", "g": "g6", "cat": "成人のリハビリテーション", "q": "成人<ruby>装用<rt>そうよう<\/rt><\/ruby>者のリハビリテーションについて、正しいのはどれか。", "opts": ["読話を併用すると聴取能は悪化する", "中途失聴者では発音訓練を行う", "複数人での会話は相手の正面で話す", "騒音下での会話を積極的に増やす", "家族との会話を減らすよう指導する"], "ans": [2], "exp": "<div><b>【正解】③<\/b><\/div><div>マイクは前からの音を拾う。正面なら読話も併用できる。<\/div><div>×1：悪化しない。特に長期失聴者では読話併用が必要。<\/div><div>×2：発音訓練は特に行わない(言語記憶があるため)。<\/div><div>×4：騒音下の会話は避ける(S/N比が悪く聞き取りが悪くなる)。<\/div><div>×5：家族との会話を増やすよう指導する(聴覚連合野の活性化につながる)。<\/div><div>【出典】過去問 問題17<\/div>", "star": false, "memo": "", "chk": false}, {"id": "q22", "g": "g6", "cat": "成人装用者の聴こえ", "q": "成人<ruby>装用<rt>そうよう<\/rt><\/ruby>者の聴こえについて、間違っているのはどれか。", "opts": ["過去の記憶と照合して聴こえは少しずつ良くなる", "一対一の会話は可能になる", "会話への積極性は聴取能に影響する", "音楽の聴取は良好である", "短〜中期間の失聴では電話が可能な場合もある"], "ans": [3], "exp": "<div><b>【正解】④（誤文）<\/b><\/div><div>現在の人工内耳システムでは音楽の聴取は難しい。<\/div><div>○1：言語記憶との照合で徐々に改善する。<\/div><div>○2：多人数より一対一の方が聞き取りやすい(S/N比)。<\/div><div>○3：影響する。おしゃべりが大事(脳の可塑性)。<\/div><div>○5：長期失聴者ではかなり厳しいが、短〜中期間なら可能なケースもある。<\/div><div>【出典】過去問 問題18<\/div>", "star": true, "memo": "", "chk": false}, {"id": "q23", "g": "g6", "cat": "装用後の注意", "q": "人工内耳の<ruby>装用<rt>そうよう<\/rt><\/ruby>後について、正しいのはどれか。", "opts": ["モノポーラ電気メスはインプラント近傍を避ける", "放射線治療は受けられない", "MRIは一切受けられない", "頭部外傷で電極が損傷することはない", "再手術後は語音聴取能が必ず低下する"], "ans": [0], "exp": "<div><b>【正解】①<\/b><\/div><div>電気メスは注意。バイポーラは使用できるが電極から1cm以上離す必要がある。<\/div><div>×2：受けられる。<\/div><div>×3：型にもよるが、最新機種は磁石を取り外さなくても1.5T・3.0TのMRIが受けられる。<\/div><div>×4：頭部打撲で電極を損傷することがある。<\/div><div>×5：再手術後はほぼ同じか改善する場合がある(機種変更)。<\/div><div>【出典】過去問 問題19<\/div>", "star": false, "memo": "※MRIは機種・磁場強度・撮像条件で可否が異なる。過去問の解説は「最新機種は1.5T・3.0T可」。実際は必ず各機種の添付文書・施設の基準で確認すること。", "chk": true}, {"id": "q24", "g": "g6", "cat": "STの役割", "q": "人工内耳における<ruby>言語聴覚士<rt>げんごちょうかくし<\/rt><\/ruby>の役割として、間違っているのはどれか。", "opts": ["聴取能の評価", "機器の説明", "装用後の聴能・言語訓練", "術前後の聴力検査の実施", "適応の最終決定"], "ans": [4], "exp": "<div><b>【正解】⑤（誤文）<\/b><\/div><div>適応は当事者・家族・医師・療育担当者の意見の一致で決まる。最終決定は医師の業務。<\/div><div>○1：STの役割。<\/div><div>○2：STの役割。<\/div><div>○3：STの役割(リハビリテーション)。<\/div><div>○4：医師の指示のもとでSTが行う検査に含まれる。<\/div><div>【出典】過去問 問題20<\/div>", "star": false, "memo": "※過去問では「難聴の診断」「緊急時のすべての対応」も医師の業務として誤り。本問は選択肢が異なる。検査の範囲は言語聴覚士法の診療補助の規定に沿って授業で確認。", "chk": true}, {"id": "q25", "g": "g4", "cat": "成人の適応(2026年改定)", "q": "成人人工内耳適応基準(2026年版)で、平均聴力レベル70dB以上90dB未満の場合に用いる<ruby>語音明瞭度<rt>ごおんめいりょうど<\/rt><\/ruby>の測定条件として、正しいのはどれか。", "opts": ["補聴器装用下・55dB SPLで50%以下", "補聴器装用下・60dB SPLで50%以下", "補聴器装用下・65dB SPLで50%以下", "補聴器装用下・70dB SPLで50%以下", "補聴器装用下・75dB SPLで50%以下"], "ans": [2], "exp": "<div><b>【正解】③<\/b><\/div><div>会話音圧相当の65 dB SPLで、補聴器装用下の語音明瞭度が50%以下。<\/div><div>×1：55 dB SPLではない。<\/div><div>×2：60 dB SPLではない。<\/div><div>×4：70 dB SPLではない。<\/div><div>×5：75 dB SPLではない。<\/div><div>【出典】成人人工内耳適応基準(2026)<\/div>", "star": false, "memo": "※2026年版の改定内容。授業資料(2017年版)は「最高語音明瞭度が50%以下」で、測定条件の書き方が異なる。授業・定期試験でどちらを問うかは先生に確認すること。選択肢は数値を昇順に並べたため、正解が3番になっている。", "chk": true}, {"id": "q26", "g": "g4", "cat": "成人の適応(2017年版)", "q": "成人の言語習得前〜言語習得中の<ruby>失聴<rt>しっちょう<\/rt><\/ruby>例の扱いとして、正しいのはどれか。", "opts": ["禁忌とされ手術は行わない", "慎重な適応判断が必要とされる", "言語習得後の失聴と同様に判断する", "適応基準の対象外とされる", "本人の意思のみで適応が決まる"], "ans": [1], "exp": "<div><b>【正解】②<\/b><\/div><div>慎重な適応判断が必要なもの(2-E)。一応禁忌ではない。<\/div><div>×1：禁忌ではない。<\/div><div>×3：習得後は言語記憶がある分、習得前・中とは区別される。<\/div><div>×4：対象外ではなく、慎重な判断の対象。<\/div><div>×5：本人の意思および家族の意向を確認して決定する。<\/div><div>【出典】過去問 問題8・9の解説<\/div>", "star": true, "memo": "※「近年は10代後半の先天聾の装用例が報告されているが、成人では少ない」は先生・過去問の解説。2022年小児基準では言語習得期前・期が対象。", "chk": true}, {"id": "q27", "g": "g3", "cat": "マッピング", "q": "<ruby>電気誘発複合電位<rt>でんきゆうはつふくごうでんい<\/rt><\/ruby>(ECAP)<ruby>閾値<rt>いきち<\/rt><\/ruby>の位置づけとして、正しいのはどれか。", "opts": ["Tレベルより低い値になる", "Tレベルと同じ値になる", "Cレベルより高い値になる", "TレベルとCレベルの中間付近になる", "UCLと一致する値になる"], "ans": [3], "exp": "<div><b>【正解】④<\/b><\/div><div>ECAP(electrically evoked Compound Action Potential)閾値は概ねTレベルとCレベルの中間くらいに来る。<\/div><div>×1：Tレベルより高い。<\/div><div>×2：Tレベルと一致するとは限らない。<\/div><div>×3：Cレベルより高くなるのは通常ではない。<\/div><div>×5：不快閾と一致するわけではない。<\/div><div>【出典】過去問 問題7(3)<\/div>", "star": false, "memo": "※個人差が大きい。ECAP閾値はあくまでCレベル設定の参考(自分で報告できない小児で有用)。過去問では略称が「EAP」と表記されている。", "chk": true}, {"id": "q28", "g": "g2", "cat": "手術の副作用", "q": "人工内耳の手術の副作用と関与する神経の組合せとして、正しいのはどれか。", "opts": ["味覚低下―鼓索神経", "めまい―蝸牛神経", "顔面麻痺―三叉神経", "複視―顔面神経", "舌運動障害―鼓索神経"], "ans": [0], "exp": "<div><b>【正解】①<\/b><\/div><div>鼓索神経は舌の前方2/3の味覚を担い、中耳を通る。<\/div><div>×2：めまいは前庭神経(前庭機能)。蝸牛神経は聴覚。<\/div><div>×3：顔面麻痺は顔面神経。三叉神経は顔面の感覚。<\/div><div>×4：複視は動眼・滑車・外転神経(眼球運動)。顔面神経ではない。<\/div><div>×5：舌の運動は舌下神経。鼓索神経は味覚と唾液腺。<\/div><div>【出典】過去問 問題5の解説<\/div>", "star": true, "memo": "", "chk": false}], "comb": [{"id": "p01", "cat": "システム", "q": "人工内耳システムについて、正しいのはどれか。<br>(1) <ruby>有毛細胞<rt>ゆうもうさいぼう<\/rt><\/ruby>に電気刺激される<br>(2) 解析された信号は<ruby>送信<rt>そうしん<\/rt><\/ruby>コイルから<ruby>受信<rt>じゅしん<\/rt><\/ruby>コイルに送られる<br>(3) 入力音声のフォルマント情報を電極に割り振る<br>(4) <ruby>皮弁<rt>ひべん<\/rt><\/ruby>の厚さは刺激電流に影響しない<br>(5) <ruby>体外器<rt>たいがいき<\/rt><\/ruby>はスピーチプロセッサーおよび<ruby>送信<rt>そうしん<\/rt><\/ruby>コイルで構成される", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(2)(3)(4)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [3], "exp": "<div><b>【正解】④ (2)(3)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　電気刺激の標的は有毛細胞ではなく、らせん神経節（蝸牛神経）。<\/div><div>(2) ○　搬送波により、体外の送信コイルから体内の受信コイルへ皮膚越しに送られる（電磁誘導＝ワイヤレス電力伝送 WPT：Wireless Power Transfer）。<\/div><div>(3) ○　周波数（フォルマント）情報を各電極に割り振る（例：F1→12〜15番、F2→8〜7番。電極番号は機種依存）。※補足参照<\/div><div>(4) ×　皮弁（皮膚）が厚いとより大きな電力が必要＝影響する。消費電力の要因：皮弁の厚さ・刺激レート・T/Cレベル・パルス幅・周囲の音環境。電力の内訳は電磁誘導（送信）が約7割（スライド）。<\/div><div>(5) ○　体外器＝スピーチプロセッサー＋送信コイル／体内器（インプラント）＝受信コイル＋電極。<\/div><div>※(3)：現行の主流ストラテジー（ACE：Advanced Combination Encoder、CIS：Continuous Interleaved Sampling 等）は周波数帯域分割が基本で、フォルマント抽出は初期の方式。正答表の表現に従い○扱い。<\/div><div>※(4)：厳密には皮弁厚が影響するのは、体外⇔体内の伝送効率・消費電力。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p02", "cat": "電極", "q": "電極について、正しいのはどれか。<br>(1) 頂部に到達する深さまで挿入されない<br>(2) 多チャンネルの電極が多く使用される<br>(3) <ruby>基底回転<rt>きていかいてん<\/rt><\/ruby>に近い部分の電極は高音を担当する<br>(4) 挿入電極は基本的に<ruby>前庭階<rt>ぜんていかい<\/rt><\/ruby>へ挿入される<br>(5) <ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>への再挿入は不可能である", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [0], "exp": "<div><b>【正解】① (1)(2)(3)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　蝸牛頂部までは入れない。昔は約1.5回転、近年はそれ以上入る機種もある（機種・電極長で異なる。講義）。<\/div><div>(2) ○　単チャンネルでは蝸牛の1か所しか刺激できず、周波数情報を伝えにくい。<\/div><div>(3) ○　蝸牛入口（基底回転）＝高周波数／蝸牛奥（頂回転）＝低周波数。<\/div><div>(4) ×　鼓室階へ挿入される。前庭階よりも神経（らせん神経節）が近いため。<\/div><div>(5) ×　再挿入は可能（再手術後の語音聴取能は同程度〜改善する場合がある→問19(1)。報告により減少もある：スライド）。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "p03", "cat": "術前検査", "q": "術前に行う検査として、間違っているのはどれか。<br>(1) <ruby>自記<rt>じき<\/rt><\/ruby>オーディオメトリー<br>(2) アブミ骨筋反射検査<br>(3) <ruby>語音聴力検査<rt>ごおんちょうりょくけんさ<\/rt><\/ruby><br>(4) ティンパノメトリー<br>(5) <ruby>聴性脳幹反応<rt>ちょうせいのうかんはんのう<\/rt><\/ruby>検査", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(1)(3)(5)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [1], "exp": "<div><b>【正解】② (1)(2)(4)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　正答表上は「行わない検査」（間違い）。<\/div><div>(2) ×　正答表上は「行わない検査」（間違い）。<\/div><div>(3) ○　人工内耳の適応基準は小児・成人とも平均聴力レベルと語音明瞭度が重要。<\/div><div>(4) ×　正答表上は「行わない検査」（間違い）。<\/div><div>(5) ○　ABR（Auditory Brainstem Response）：閾値の測定ができ、聴神経の評価にも使える。クリック音のため周波数特異性がない（欠点）。乳幼児にはASSR（Auditory Steady-State Response）の80Hz（睡眠時）、40Hzは覚醒時で成人の詐聴用（スライド）。<\/div><div>※臨床では、中耳の状態評価としてティンパノメトリーやアブミ骨筋反射検査を術前に行う施設も多い。本問は「適応判定の中心となる検査か」という授業・正答表の基準による出題と考えられる（要確認：講師に確認推奨）。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p04", "cat": "手術", "q": "手術について、正しいのはどれか。<br>(1) 術前検査としてCT, MRI等の画像検査は必須である<br>(2) 無理に挿入すると、屈曲やショートする<br>(3) ダイヤモンドバーを用いて<ruby>乳突削開術<rt>にゅうとつさっかいじゅつ<\/rt><\/ruby>を行う<br>(4) <ruby>顔面神経<rt>がんめんしんけい<\/rt><\/ruby>や<ruby>動眼神経<rt>どうがんしんけい<\/rt><\/ruby>に細心の注意が必要である<br>(5) 耳介の前を5cm程度切開する", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(2)(3)(4)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [0], "exp": "<div><b>【正解】① (1)(2)(3)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　CT（Computed Tomography）・MRI（Magnetic Resonance Imaging）で電極挿入スペースを確認。中耳炎・蝸牛神経・内耳奇形なども評価。<\/div><div>(2) ○　電極は繊細。無理な挿入で屈曲・損傷・ショート（短絡）の恐れ。<\/div><div>(3) ○　乳突削開術（にゅうとつさっかいじゅつ）：側頭骨の乳突部を削開して蝸牛へアプローチする。<\/div><div>(4) ×　注意が必要なのは顔面神経（＋鼓索神経）。動眼神経（第Ⅲ脳神経）は術野から離れた別の経路。<\/div><div>(5) ×　切開は耳介の後ろ（耳後部切開）。<\/div><div>※ノート補正：「前だと頬骨に埋め込むことになる」は不正確。受信刺激器は側頭骨（耳の後ろ上方）に設置するため、耳後部から切開する。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "p05", "cat": "手術合併症", "q": "手術の副作用について、正しいのはどれか。<br>(1) <ruby>味覚<rt>みかく<\/rt><\/ruby>低下<br>(2) <ruby>複視<rt>ふくし<\/rt><\/ruby><br>(3) めまい<br>(4) 知覚過敏<br>(5) <ruby>顔面麻痺<rt>がんめんまひ<\/rt><\/ruby>", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(1)(3)(5)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [2], "exp": "<div><b>【正解】③ (1)(3)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　鼓索神経（顔面神経の枝）が近くを走るため。ドリルの振動・熱による一過性が多く、3〜5か月程度で回復（講義）。<\/div><div>(2) ×　複視は眼球運動系の障害で、術野から離れており典型的な副作用ではない。<\/div><div>(3) ○　前庭（前庭神経・前庭器官）が近いため。<\/div><div>(4) ×　典型的な副作用ではない。<\/div><div>(5) ○　顔面神経が近くを走るため。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "p06", "cat": "マッピング", "q": "マッピングについて、間違っているのはどれか。<br>(1) 刺激頻度を増やすと、聴こえは劣化する<br>(2) 周波数割り振りを変えると、聴こえは変化する<br>(3) バイポーラ刺激はモノポーラ刺激に比べて聴神経をより高いレートで刺激可能である<br>(4) 第1フォルマントの情報は第2フォルマントに比べて<ruby>頂回転<rt>ちょうかいてん<\/rt><\/ruby>に近い電極に割り当てられる<br>(5) 術後のマッピングは頻回に実施しない方が良い", "opts": ["(1)(2)(3)", "(1)(3)(5)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [1], "exp": "<div><b>【正解】② (1)(3)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　刺激数が多いほど聞き取りが明瞭になる人もいる（個人差あり）。「劣化する」と断定している点が誤り。<\/div><div>(2) ○　刺激される場所（電極）が変われば聴こえも変わる。変更直後は一旦悪化するが、脳内のテンプレートが作り直され改善する例がある（母音聴取能76%→一旦低下→92%：スライド）。<\/div><div>(3) ×　逆。モノポーラ刺激の方が必要なエネルギー（電流）が少なく、より高いレートで刺激可能。<\/div><div>(4) ○　フォルマントは周波数の低い方から番号が付く（F1＜F2）。低周波＝頂回転側。<\/div><div>(5) ×　実施した方が良い。術後すぐに全電極が使えるとは限らず、調整は不可欠。例：2歳9か月の音入れ時は使用電極5本・DR（Dynamic Range）3〜5→3か月後22本・DR35〜53（スライド）。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "p07", "cat": "マッピング", "q": "マッピングについて、正しいのはどれか。<br>(1) UCLに注意して、Cレベルを設定する<br>(2) Cレベルを上げると<ruby>嗅覚<rt>きゅうかく<\/rt><\/ruby>障害をきたす<br>(3) <ruby>電気誘発複合電位<rt>でんきゆうはつふくごうでんい<\/rt><\/ruby>(EAP)の<ruby>閾値<rt>いきち<\/rt><\/ruby>はTレベルより低い<br>(4) Cレベルは音入れ後に増加する傾向にある<br>(5) ダイナミックレンジが狭いと聴こえにくい", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(1)(4)(5)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [2], "exp": "<div><b>【正解】③ (1)(4)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　UCL（Uncomfortable Loudness Level：不快閾値）を超えない程度で、C（Comfortable）レベルを設定する。<\/div><div>(2) ×　嗅覚への影響は通常ない。Cレベルが高すぎる場合に起こりうるのは、顔面神経刺激（顔面痙攣）と、鼓索神経刺激による味覚の異常（講義・スライド）。出題の主眼は顔面神経刺激（痙攣）と思われる。<\/div><div>(3) ×　高い。EAP閾値（EAP＝ECAP：Electrically evoked Compound Action Potential）は、概ねCレベルとTレベル（Threshold）の中間付近に来る（個人差あり）。NRT（Neural Response Telemetry）は測定システム名で、EAPが測定対象（講義）。<\/div><div>(4) ○　装用に慣れるにつれ、Cレベルは増加する傾向がある。<\/div><div>(5) ○　ダイナミックレンジ＝C−Tレベルの幅。狭いと音の強弱の情報が少なく聞き取りにくい。<\/div><div>※(2)の原文は「嗅覚障害」（授業スライドで確認）。配布紙の「味覚障害」は誤記として講義で訂正された。Cレベル過大では顔面神経刺激（痙攣）と味覚の異常の両方が起こりうる。ノートの「顔面神経麻痺」は、正確には刺激症状（痙攣）（麻痺は手術合併症で問5(5)）。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "p08", "cat": "成人適応基準", "q": "成人人工内耳の適応条件について、間違っているのはどれか。<br>(1) <ruby>中途失聴者<rt>ちゅうとしっちょうしゃ<\/rt><\/ruby><br>(2) 両耳平均聴力レベル90dB以上の場合<br>(3) 平均聴力レベルが70dB以上、90dB未満で、適切な補聴<ruby>装用<rt>そうよう<\/rt><\/ruby>下の最高<ruby>語音明瞭度<rt>ごおんめいりょうど<\/rt><\/ruby>が80%以下の難聴<br>(4) 先天性の視覚聴覚二重障害<br>(5) 本人の意欲が重要で、家族の協力は特に必要無い", "opts": ["(1)(2)(3)", "(1)(3)(5)", "(2)(3)(4)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [4], "exp": "<div><b>【正解】⑤ (3)(4)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　言語記憶があるのは大きな利点。<\/div><div>(2) ○　裸耳での聴力検査で、（両耳）平均聴力レベル（500・1000・2000Hz）が90dB以上の重度感音難聴（成人基準2017 1-i）。<\/div><div>(3) ×　最高語音明瞭度は「50%以下」（80%以下ではない）。70dB以上90dB未満で、適切な補聴器装用下の最高語音明瞭度が50%以下の高度感音難聴（成人基準2017 1-ii）。<\/div><div>(4) ×　正答表では「間違い」扱い。基準上は禁忌ではなく、言語習得前・習得中の失聴は「慎重な適応判断が必要」（成人基準2017 2-E）。<\/div><div>(5) ×　成人基準：「本人の意思および家族の意向を確認して手術適応を決定する」。<\/div><div>※(4)：ノートの「成人の先天聾の装用例は報告されていない」は不正確。成人後に人工内耳を施行した先天性難聴の症例報告はある（耳鼻咽喉科・頭頸部外科 91巻8号, 2019）。ただし言語習得前失聴は慎重な適応判断の対象。<\/div><div>※配布資料は成人基準（2017）。2017年基準は両耳が対象。<\/div><div>※(4)：授業スライドは「10代後半の先天聾の装用例は報告されているが、成人ではない」としつつ、2000年頃から思春期以降の手術例で聞き取りが改善した報告もある（多くはない）とする。<\/div><div>2026年（講義スライド）：一側性高度難聴・非対称性難聴も人工内耳の適応対象に（2026年6月以降の保険適用）。数値は授業スライドによるもので学会原本は未確認。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p09", "cat": "慎重な適応判断", "q": "<ruby>慎重<rt>しんちょう<\/rt><\/ruby>な適応判断が必要なものについて、正しいのはどれか。<br>(1) 言語習得後の<ruby>失聴<rt>しっちょう<\/rt><\/ruby><br>(2) 画像診断で<ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>に人工内耳を挿入できる部位が確認できない<br>(3) 高度の<ruby>伝音性難聴<rt>でんおんせいなんちょう<\/rt><\/ruby><br>(4) 重複障害および中枢性聴覚障害<br>(5) 反復性の急性中耳炎が存在する場合", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [3], "exp": "<div><b>【正解】④ (2)(4)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　慎重な判断が必要なのは言語習得前・習得中の失聴。習得後は言語記憶があり、むしろ人工内耳の価値が高い。<\/div><div>(2) ○　成人基準2-A／小児基準6-A。<\/div><div>(3) ×　適応基準に伝音難聴への言及はない（人工内耳は感音難聴が対象）。<\/div><div>(4) ○　小児基準6-D：人工内耳による聴覚補償が有効であるとする予測が必要。成人基準では後迷路性病変・中枢性聴覚障害の合併（2-C）。<\/div><div>(5) ○　小児基準6-B。なお小児基準では中耳炎などの感染症の活動期は「禁忌」（5）、成人基準では中耳の活動性炎症が「慎重な適応判断」（2-B）。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "p10", "cat": "小児適応判定", "q": "小児人工内耳適応判定について、必要なものはどれか。<br>(1) 発達および言語能力検査<br>(2) <ruby>補聴器<rt>ほちょうき<\/rt><\/ruby><ruby>装用<rt>そうよう<\/rt><\/ruby>効果の判定<br>(3) <ruby>味覚<rt>みかく<\/rt><\/ruby>検査<br>(4) <ruby>聴性脳幹反応<rt>ちょうせいのうかんはんのう<\/rt><\/ruby>検査<br>(5) <ruby>前庭<rt>ぜんてい<\/rt><\/ruby>機能検査", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [1], "exp": "<div><b>【正解】② (1)(2)(4)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　小児基準 I-1-C「言語発達全般および難聴との鑑別に必要な他疾患に関する知識を有していること」が根拠（授業の説明）。<\/div><div>(2) ○　6カ月以上の最適な補聴器装用下で、平均聴力レベルが45dBよりも改善しない場合／最高語音明瞭度が50%以下の場合（小児基準2022 II-2。旧2014版は50%未満）。<\/div><div>(3) ×　不要。<\/div><div>(4) ○　ABR：閾値の測定ができ、聴神経の評価にも使える。<\/div><div>(5) ×　適応判定に必須ではない。<\/div><div>※(1)：ノートに「基準に『言語能力検査』と明記はないのでは？」との疑問あり。基準本文に検査名としての記載はなく、講師に確認推奨。<\/div><div>※(5)：前庭機能検査は判定に必須ではないが、施設によりめまい・平衡機能の評価目的で実施されることがある。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p11", "cat": "小児適応条件", "q": "小児人工内耳の適応条件について、正しいのはどれか。<br>(1) 視覚を主体として<ruby>療育<rt>りょういく<\/rt><\/ruby>を行う機関との連携が確保されていること<br>(2) 地域におけるコミュニケーション指導法などについて把握していること<br>(3) 言語発達全般および難聴との鑑別に必要な他疾患に関する知識を有していること<br>(4) 短期的な家族の協力が見込まれること<br>(5) 聴覚検査、<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby>適合について熟練していること", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(2)(3)(4)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [3], "exp": "<div><b>【正解】④ (2)(3)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　「聴覚を主体として」療育を行う機関との連携（小児基準 I-2）。<\/div><div>(2) ○　小児基準 I-1-B：地域における療育の状況、特にコミュニケーション指導法などの把握。<\/div><div>(3) ○　小児基準 I-1-C。<\/div><div>(4) ×　乳幼児期からの装用には長期にわたる支援が必要で、継続的な家族の協力が見込まれること（小児基準 I-3）。<\/div><div>(5) ○　小児基準 I-1-A：乳幼児の聴覚障害について熟知し、聴力検査・補聴器適合に熟練していること。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "p12", "cat": "小児適応条件", "q": "小児人工内耳の適応条件について、間違っているのはどれか。<br>(1) 適応年齢は原則1歳以上(体重8kg以上)とする<br>(2) 6カ月以上の最適な<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby><ruby>装用<rt>そうよう<\/rt><\/ruby>下の最高<ruby>語音明瞭度<rt>ごおんめいりょうど<\/rt><\/ruby>が80%以下<br>(3) 言語習得後の<ruby>失聴<rt>しっちょう<\/rt><\/ruby>で補聴効果が十分でない場合は、<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby><ruby>装用<rt>そうよう<\/rt><\/ruby>下で6ヶ月間の観察を要する<br>(4) 6カ月以上の最適な<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby><ruby>装用<rt>そうよう<\/rt><\/ruby>下の平均聴力レベルが45dBよりも改善しない<br>(5) 音声を用いて学習を行う小児に対し、最初は片耳<ruby>装用<rt>そうよう<\/rt><\/ruby>での効果を十分な観察期間をもって評価する", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(2)(3)(4)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [3], "exp": "<div><b>【正解】④ (2)(3)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　小児基準 II-1-A：原則体重8kg以上または1歳以上。1歳以上で体重8kg未満の場合は手術適応を慎重に判断する。<\/div><div>(2) ×　「50%以下」が正しい（2022基準 II-2-iii。旧2014版は50%未満）。<\/div><div>(3) ×　言語習得期以後の失聴では、補聴器の効果が十分でない高度難聴と確認された後は、獲得した言語を失わないよう早期に人工内耳を検討することが望ましい（II-1-B）。<\/div><div>(4) ○　小児基準 II-2-ii。<\/div><div>(5) ×　補聴の基本は両耳聴であり、両耳聴の実現に人工内耳の両耳装用が有効な場合はこれを否定しない（II-3）。<\/div><div>※版の違い：現行の小児基準2022（日本耳科学会PDF）は「原則体重8kg以上または1歳以上」「最高語音明瞭度50%以下」。授業・過去問の文は旧版2014（「原則1歳以上(体重8kg以上)」「50%未満」）に基づく。80%は両版で誤りなので正答は変わらない。<\/div><div>※スライド例「ペンドレッド症候群（前庭水管拡大を伴う非症候群性難聴）」：Pendred症候群（Vaughan Pendred：アイルランド出身の医師が報告）は甲状腺腫を伴う症候群性難聴で、「非症候群性」は前庭水管拡大症（DFNB4）との混同の可能性→要確認。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p13", "cat": "小児 語音聴取能の影響因子", "q": "小児人工内耳の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に与える影響因子について、間違っているのはどれか。<br>(1) 術前の視覚活用は術後の<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>に影響する<br>(2) 会話環境は<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>に影響しない<br>(3) 電極数や刺激範囲は<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>に影響しない<br>(4) <ruby>装用<rt>そうよう<\/rt><\/ruby>開始年齢の影響は大きい<br>(5) 重度より軽度<ruby>内耳奇形<rt>ないじきけい<\/rt><\/ruby>の場合の方が、<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>が低下する", "opts": ["(1)(2)(3)", "(1)(2)(5)", "(2)(3)(4)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [3], "exp": "<div><b>【正解】④ (2)(3)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　手話の言語処理が聴覚連合野で行われているとの報告があり、術前から視覚情報で聴覚中枢を刺激しておくと術後の言語獲得がスムーズになる可能性（ノートでも仮説レベル）。<\/div><div>(2) ×　影響する。乳幼児は親や周囲の会話を聴いて言語を学ぶ。<\/div><div>(3) ×　影響する。スライド（A. Naito, 2000）：22本→11本でも間引きなら聴取能はほぼ不変（母音86→80%、子音55→50%）だが、連続して欠損し刺激範囲が狭くなると明らかに低下（母音38%、子音26%）。『数より壊れ方』。<\/div><div>(4) ○　早いほど脳の可塑性が高い。<\/div><div>(5) ×　逆。重度の奇形ほど聴取能は低い。例：Mondini（カルロ・モンディーニ：18世紀イタリアの解剖学者）型より共通腔（common cavity）の方が聴取能が低い。<\/div><div>※(1)：聴覚野が視覚（手話等）で再編される（クロスモーダル可塑性）と術後成績が低下するとの報告もあり、見解は一致していない。正答表では○扱い。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p14", "cat": "小児ハビリテーション", "q": "小児のハビリテーションについて、正しいのはどれか。<br>(1) 重度<ruby>内耳奇形<rt>ないじきけい<\/rt><\/ruby>例では<ruby>顔面痙攣<rt>がんめんけいれん<\/rt><\/ruby>が出現することがある<br>(2) 人工内耳<ruby>装用<rt>そうよう<\/rt><\/ruby>直後から聴覚のみでの訓練を行う<br>(3) 母子関係の改善を図る<br>(4) 早期支援は、言語力・言語性認知能力を高める<br>(5) <ruby>送信<rt>そうしん<\/rt><\/ruby>コイルの磁石は音入れ時の強度を維持する", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(1)(4)(5)", "(2)(3)(4)", "(2)(4)(5)"], "ans": [1], "exp": "<div><b>【正解】② (1)(3)(4)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　内耳奇形では顔面神経の走行異常を伴うことがあり、電気刺激による顔面神経刺激（顔面攣縮）が起こりやすいと考えられる（顔面神経＝第Ⅶ脳神経、聴神経＝第Ⅷ脳神経）。※ノートも「解説なし」。<\/div><div>(2) ×　聴覚情報も視覚情報も併用して脳を活性化する（授業の説明）。<\/div><div>(3) ○　母子間の愛着形成・情緒的コミュニケーションを深める支援を行う。<\/div><div>(4) ○　脳の可塑性。<\/div><div>(5) ×　成長や皮膚（皮弁）の状態に合わせて調整・交換する。スライド：磁石が強すぎると皮膚が壊死する。音入れ＝初回の電気刺激開始。<\/div><div>※(2)：聴覚のみで訓練する療育（聴覚口話法・AVT：Auditory-Verbal Therapy）もあり、療育方針は施設・家族の選択で異なる（スライドにオーディトリー・バーバル法：シェパード・センター＝シドニーが登場）。正答表は「併用」の立場。<\/div><div>※(1)：スライドに根拠なし。講義では共通腔など内耳奇形で骨が薄く電流が漏れ、顔面神経を刺激しうると説明（音声認識の誤りあり、要確認）。(5)は講義スライドで確認済み。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p15", "cat": "小児ハビリテーション", "q": "小児のハビリテーションについて、間違っているのはどれか。<br>(1) ハビリテーションの内容・頻度は共通している<br>(2) <ruby>装用<rt>そうよう<\/rt><\/ruby>児の自発性は訓練を妨げない<br>(3) 人工内耳と<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby>の両耳<ruby>装用<rt>そうよう<\/rt><\/ruby>は<ruby>禁忌<rt>きんき<\/rt><\/ruby>である<br>(4) 病院と学校の連携は不可欠である<br>(5) 健聴の兄弟をもつ<ruby>装用<rt>そうよう<\/rt><\/ruby>者では訓練・指導は特に必要ない", "opts": ["(1)(2)(3)", "(1)(3)(5)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [1], "exp": "<div><b>【正解】② (1)(3)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　個々の発達・聴取能・環境に応じて異なる（人それぞれ）。<\/div><div>(2) ○　自発性がある方が訓練の効果が高い。<\/div><div>(3) ×　禁忌ではない。人工内耳と補聴器の併用（装用側の組合せに関わらず）は否定されない。<\/div><div>(4) ○　関係各所の連携は必要不可欠。<\/div><div>(5) ×　必要。個々の特徴を踏まえた個別指導が不可欠。<\/div><div>※ノート補正：「ハイブリッド装用」は通常、同側耳での電気・音響刺激併用（EAS：Electric Acoustic Stimulation）を指す。一側人工内耳＋対側補聴器は bimodal（バイモーダル）装用と呼ぶ。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "p16", "cat": "成人 語音聴取能の影響因子", "q": "成人<ruby>中途失聴者<rt>ちゅうとしっちょうしゃ<\/rt><\/ruby>の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に強く影響する因子について、正しいのはどれか。<br>(1) <ruby>失聴<rt>しっちょう<\/rt><\/ruby>原因<br>(2) 会話環境<br>(3) <ruby>失聴<rt>しっちょう<\/rt><\/ruby>期間<br>(4) 電極数および刺激範囲<br>(5) 年齢", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(2)(3)(4)", "(2)(3)(5)", "(3)(4)(5)"], "ans": [2], "exp": "<div><b>【正解】③ (2)(3)(4)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　成人中途失聴者では、失聴原因の違いによる語音聴取能の差はない。<\/div><div>(2) ○　豊富な会話によるウェルニッケ野への刺激が必要＝脳の可塑性。<\/div><div>(3) ○　失聴期間が長いと、語音聴取能および分解能に影響する。<\/div><div>(4) ○　中途失聴に限らず影響する。連続した電極の欠損で刺激範囲が狭くなると低下（スライド）。<\/div><div>(5) ×　成人中途失聴の場合、年齢の影響はあるものの強く影響するとは限らない。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "p17", "cat": "成人リハビリテーション", "q": "成人<ruby>装用<rt>そうよう<\/rt><\/ruby>者のリハビリテーションについて、正しいのはどれか。<br>(1) <ruby>読話<rt>どくわ<\/rt><\/ruby>を併用すると<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>は悪化する<br>(2) <ruby>中途失聴者<rt>ちゅうとしっちょうしゃ<\/rt><\/ruby>では発音訓練を行う<br>(3) 家族との会話を増やすように指導する<br>(4) 騒音下での会話は避ける<br>(5) 複数の人数での会話は相手の正面で話す", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [4], "exp": "<div><b>【正解】⑤ (3)(4)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　悪化しない。特に長期失聴者では読話併用が必要。<\/div><div>(2) ×　発音訓練は特に行わない（言語記憶があるため）。<\/div><div>(3) ○　聴覚連合野の活性化につながる。<\/div><div>(4) ○　S/N比（Signal-to-Noise ratio）が悪化し、聞き取りが低下する。<\/div><div>(5) ○　マイクは前方の音を拾う。正面なら読話も併用できる。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "p18", "cat": "成人 聴こえ", "q": "成人<ruby>装用<rt>そうよう<\/rt><\/ruby>者の聴こえについて、間違っているのはどれか。<br>(1) 過去の記憶と照合してきこえは少しずつ良くなる<br>(2) 術後の<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>に会話への積極性は特に影響しない<br>(3) 電話での会話は不可能である<br>(4) 音楽の聴取は良好である<br>(5) 一対一の会話は可能になる", "opts": ["(1)(2)(3)", "(1)(4)(5)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [2], "exp": "<div><b>【正解】③ (2)(3)(4)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　過去の聴覚記憶と照合しながら、聴こえが徐々に改善する。<\/div><div>(2) ×　影響する。おしゃべり（会話経験）が重要＝脳の可塑性。<\/div><div>(3) ×　長期失聴者では困難だが、短〜中期間の失聴者では可能な場合もある。<\/div><div>(4) ×　現在の人工内耳のシステムでは音楽聴取は難しい。<\/div><div>(5) ○　多人数より一対一の方が聞き取りやすい（S/N比）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "p19", "cat": "装用後", "q": "<ruby>装用<rt>そうよう<\/rt><\/ruby>後について、正しいのはどれか。<br>(1) 再手術後の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>はほぼ同じ場合がある<br>(2) モノポーラメスはインプラントの近くでは避けたほうが良い<br>(3) 放射線治療は受けられない<br>(4) 頭部打撲によって電極を損傷することがある<br>(5) MRIは受けられない", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [1], "exp": "<div><b>【正解】② (1)(2)(4)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　ほぼ同じか改善（機種変更など）。<\/div><div>(2) ○　単極（モノポーラ）の電気メスは注意。双極（バイポーラ）は使用可だが、電極から1cm以上離す必要あり（授業資料）。<\/div><div>(3) ×　受けられる。<\/div><div>(4) ○　頭部外傷（打撲）でインプラント・電極が損傷することがある。<\/div><div>(5) ×　機種による。最新のインプラントは磁石を取り外さなくても1.5テスラ・3.0テスラのMRIが受けられる。<\/div><div>※(3)：「受けられる」は一般論。機種ごとに照射条件（累積線量など）の制限があり、事前に主治医・メーカーへの確認が必要。<\/div><div>※(5)：MRIの可否・条件（磁場強度、頭部固定バンドの要否等）は機種・撮像条件で異なる。バイポーラメスの「1cm」も機種の添付文書で要確認。<\/div><div>※授業の警告スライド：電気メス手術／電磁波照射・温熱療法／神経刺激／電気ショック／イオン放射線療法／MRIが「誘導電流の発生を伴う医学療法」として警告対象。放射線・MRIは「絶対不可」ではなく条件付き。「受けられる／受けられない」は版により逆転して出題されるので、「条件付きで可」と覚える。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "p20", "cat": "言語聴覚士の役割", "q": "<ruby>言語聴覚士<rt>げんごちょうかくし<\/rt><\/ruby>の役割について、間違っているのはどれか。<br>(1) 難聴の診断<br>(2) <ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>の評価<br>(3) 機器の説明<br>(4) 適応の最終決定<br>(5) 緊急時におけるすべての対応", "opts": ["(1)(2)(3)", "(1)(4)(5)", "(2)(3)(4)", "(2)(4)(5)", "(3)(4)(5)"], "ans": [1], "exp": "<div><b>【正解】② (1)(4)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　診断は医師の業務。<\/div><div>(2) ○　STの役割。<\/div><div>(3) ○　STの役割。<\/div><div>(4) ×　適応は本人・家族・医師・療育担当者の意見が一致して決める（小児基準 I-4）。STが最終決定するのではない。<\/div><div>(5) ×　緊急時の医学的対応は医師の業務。<\/div>", "star": false, "memo": "", "chk": false}], "ox": [{"id": "t001", "cat": "問1(1)｜システム", "ctx": "人工内耳システムについて、正しいのはどれか。", "q": "<ruby>有毛細胞<rt>ゆうもうさいぼう<\/rt><\/ruby>に電気刺激される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>電気刺激の標的は有毛細胞ではなく、らせん神経節（蝸牛神経）。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "t002", "cat": "問1(2)｜システム", "ctx": "人工内耳システムについて、正しいのはどれか。", "q": "解析された信号は<ruby>送信<rt>そうしん<\/rt><\/ruby>コイルから<ruby>受信<rt>じゅしん<\/rt><\/ruby>コイルに送られる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>搬送波により、体外の送信コイルから体内の受信コイルへ皮膚越しに送られる（電磁誘導＝ワイヤレス電力伝送 WPT：Wireless Power Transfer）。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t003", "cat": "問1(3)｜システム", "ctx": "人工内耳システムについて、正しいのはどれか。", "q": "入力音声のフォルマント情報を電極に割り振る", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>周波数（フォルマント）情報を各電極に割り振る（例：F1→12〜15番、F2→8〜7番。電極番号は機種依存）。※補足参照<\/div><div>※(3)：現行の主流ストラテジー（ACE：Advanced Combination Encoder、CIS：Continuous Interleaved Sampling 等）は周波数帯域分割が基本で、フォルマント抽出は初期の方式。正答表の表現に従い○扱い。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t004", "cat": "問1(4)｜システム", "ctx": "人工内耳システムについて、正しいのはどれか。", "q": "<ruby>皮弁<rt>ひべん<\/rt><\/ruby>の厚さは刺激電流に影響しない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>皮弁（皮膚）が厚いとより大きな電力が必要＝影響する。消費電力の要因：皮弁の厚さ・刺激レート・T/Cレベル・パルス幅・周囲の音環境。電力の内訳は電磁誘導（送信）が約7割（スライド）。<\/div><div>※(4)：厳密には皮弁厚が影響するのは、体外⇔体内の伝送効率・消費電力。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t005", "cat": "問1(5)｜システム", "ctx": "人工内耳システムについて、正しいのはどれか。", "q": "<ruby>体外器<rt>たいがいき<\/rt><\/ruby>はスピーチプロセッサーおよび<ruby>送信<rt>そうしん<\/rt><\/ruby>コイルで構成される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>体外器＝スピーチプロセッサー＋送信コイル／体内器（インプラント）＝受信コイル＋電極。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "t006", "cat": "問2(1)｜電極", "ctx": "電極について、正しいのはどれか。", "q": "頂部に到達する深さまで挿入されない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>蝸牛頂部までは入れない。昔は約1.5回転、近年はそれ以上入る機種もある（機種・電極長で異なる。講義）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t007", "cat": "問2(2)｜電極", "ctx": "電極について、正しいのはどれか。", "q": "多チャンネルの電極が多く使用される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>単チャンネルでは蝸牛の1か所しか刺激できず、周波数情報を伝えにくい。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t008", "cat": "問2(3)｜電極", "ctx": "電極について、正しいのはどれか。", "q": "<ruby>基底回転<rt>きていかいてん<\/rt><\/ruby>に近い部分の電極は高音を担当する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>蝸牛入口（基底回転）＝高周波数／蝸牛奥（頂回転）＝低周波数。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "t009", "cat": "問2(4)｜電極", "ctx": "電極について、正しいのはどれか。", "q": "挿入電極は基本的に<ruby>前庭階<rt>ぜんていかい<\/rt><\/ruby>へ挿入される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>鼓室階へ挿入される。前庭階よりも神経（らせん神経節）が近いため。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "t010", "cat": "問2(5)｜電極", "ctx": "電極について、正しいのはどれか。", "q": "<ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>への再挿入は不可能である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>再挿入は可能（再手術後の語音聴取能は同程度〜改善する場合がある→問19(1)。報告により減少もある：スライド）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t011", "cat": "問3(1)｜術前検査", "ctx": "術前に行う検査として、間違っているのはどれか。", "q": "<ruby>自記<rt>じき<\/rt><\/ruby>オーディオメトリー", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>正答表上は「行わない検査」（間違い）。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t012", "cat": "問3(2)｜術前検査", "ctx": "術前に行う検査として、間違っているのはどれか。", "q": "アブミ骨筋反射検査", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>正答表上は「行わない検査」（間違い）。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t013", "cat": "問3(3)｜術前検査", "ctx": "術前に行う検査として、間違っているのはどれか。", "q": "<ruby>語音聴力検査<rt>ごおんちょうりょくけんさ<\/rt><\/ruby>", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>人工内耳の適応基準は小児・成人とも平均聴力レベルと語音明瞭度が重要。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "t014", "cat": "問3(4)｜術前検査", "ctx": "術前に行う検査として、間違っているのはどれか。", "q": "ティンパノメトリー", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>正答表上は「行わない検査」（間違い）。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t015", "cat": "問3(5)｜術前検査", "ctx": "術前に行う検査として、間違っているのはどれか。", "q": "<ruby>聴性脳幹反応<rt>ちょうせいのうかんはんのう<\/rt><\/ruby>検査", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>ABR（Auditory Brainstem Response）：閾値の測定ができ、聴神経の評価にも使える。クリック音のため周波数特異性がない（欠点）。乳幼児にはASSR（Auditory Steady-State Response）の80Hz（睡眠時）、40Hzは覚醒時で成人の詐聴用（スライド）。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t016", "cat": "問4(1)｜手術", "ctx": "手術について、正しいのはどれか。", "q": "術前検査としてCT, MRI等の画像検査は必須である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>CT（Computed Tomography）・MRI（Magnetic Resonance Imaging）で電極挿入スペースを確認。中耳炎・蝸牛神経・内耳奇形なども評価。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t017", "cat": "問4(2)｜手術", "ctx": "手術について、正しいのはどれか。", "q": "無理に挿入すると、屈曲やショートする", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>電極は繊細。無理な挿入で屈曲・損傷・ショート（短絡）の恐れ。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t018", "cat": "問4(3)｜手術", "ctx": "手術について、正しいのはどれか。", "q": "ダイヤモンドバーを用いて<ruby>乳突削開術<rt>にゅうとつさっかいじゅつ<\/rt><\/ruby>を行う", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>乳突削開術（にゅうとつさっかいじゅつ）：側頭骨の乳突部を削開して蝸牛へアプローチする。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t019", "cat": "問4(4)｜手術", "ctx": "手術について、正しいのはどれか。", "q": "<ruby>顔面神経<rt>がんめんしんけい<\/rt><\/ruby>や<ruby>動眼神経<rt>どうがんしんけい<\/rt><\/ruby>に細心の注意が必要である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>注意が必要なのは顔面神経（＋鼓索神経）。動眼神経（第Ⅲ脳神経）は術野から離れた別の経路。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t020", "cat": "問4(5)｜手術", "ctx": "手術について、正しいのはどれか。", "q": "耳介の前を5cm程度切開する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>切開は耳介の後ろ（耳後部切開）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t021", "cat": "問5(1)｜手術合併症", "ctx": "手術の副作用について、正しいのはどれか。", "q": "<ruby>味覚<rt>みかく<\/rt><\/ruby>低下", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>鼓索神経（顔面神経の枝）が近くを走るため。ドリルの振動・熱による一過性が多く、3〜5か月程度で回復（講義）。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "t022", "cat": "問5(2)｜手術合併症", "ctx": "手術の副作用について、正しいのはどれか。", "q": "<ruby>複視<rt>ふくし<\/rt><\/ruby>", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>複視は眼球運動系の障害で、術野から離れており典型的な副作用ではない。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t023", "cat": "問5(3)｜手術合併症", "ctx": "手術の副作用について、正しいのはどれか。", "q": "めまい", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>前庭（前庭神経・前庭器官）が近いため。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "t024", "cat": "問5(4)｜手術合併症", "ctx": "手術の副作用について、正しいのはどれか。", "q": "知覚過敏", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>典型的な副作用ではない。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t025", "cat": "問5(5)｜手術合併症", "ctx": "手術の副作用について、正しいのはどれか。", "q": "<ruby>顔面麻痺<rt>がんめんまひ<\/rt><\/ruby>", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>顔面神経が近くを走るため。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "t026", "cat": "問6(1)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "刺激頻度を増やすと、聴こえは劣化する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>刺激数が多いほど聞き取りが明瞭になる人もいる（個人差あり）。「劣化する」と断定している点が誤り。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t027", "cat": "問6(2)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "周波数割り振りを変えると、聴こえは変化する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>刺激される場所（電極）が変われば聴こえも変わる。変更直後は一旦悪化するが、脳内のテンプレートが作り直され改善する例がある（母音聴取能76%→一旦低下→92%：スライド）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t028", "cat": "問6(3)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "バイポーラ刺激はモノポーラ刺激に比べて聴神経をより高いレートで刺激可能である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>逆。モノポーラ刺激の方が必要なエネルギー（電流）が少なく、より高いレートで刺激可能。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "t029", "cat": "問6(4)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "第1フォルマントの情報は第2フォルマントに比べて<ruby>頂回転<rt>ちょうかいてん<\/rt><\/ruby>に近い電極に割り当てられる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>フォルマントは周波数の低い方から番号が付く（F1＜F2）。低周波＝頂回転側。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t030", "cat": "問6(5)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "術後のマッピングは頻回に実施しない方が良い", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>実施した方が良い。術後すぐに全電極が使えるとは限らず、調整は不可欠。例：2歳9か月の音入れ時は使用電極5本・DR（Dynamic Range）3〜5→3か月後22本・DR35〜53（スライド）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t031", "cat": "問7(1)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "UCLに注意して、Cレベルを設定する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>UCL（Uncomfortable Loudness Level：不快閾値）を超えない程度で、C（Comfortable）レベルを設定する。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "t032", "cat": "問7(2)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "Cレベルを上げると<ruby>嗅覚<rt>きゅうかく<\/rt><\/ruby>障害をきたす", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>嗅覚への影響は通常ない。Cレベルが高すぎる場合に起こりうるのは、顔面神経刺激（顔面痙攣）と、鼓索神経刺激による味覚の異常（講義・スライド）。出題の主眼は顔面神経刺激（痙攣）と思われる。<\/div><div>※(2)の原文は「嗅覚障害」（授業スライドで確認）。配布紙の「味覚障害」は誤記として講義で訂正された。Cレベル過大では顔面神経刺激（痙攣）と味覚の異常の両方が起こりうる。ノートの「顔面神経麻痺」は、正確には刺激症状（痙攣）（麻痺は手術合併症で問5(5)）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t033", "cat": "問7(3)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "<ruby>電気誘発複合電位<rt>でんきゆうはつふくごうでんい<\/rt><\/ruby>(EAP)の<ruby>閾値<rt>いきち<\/rt><\/ruby>はTレベルより低い", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>高い。EAP閾値（EAP＝ECAP：Electrically evoked Compound Action Potential）は、概ねCレベルとTレベル（Threshold）の中間付近に来る（個人差あり）。NRT（Neural Response Telemetry）は測定システム名で、EAPが測定対象（講義）。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t034", "cat": "問7(4)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "Cレベルは音入れ後に増加する傾向にある", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>装用に慣れるにつれ、Cレベルは増加する傾向がある。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t035", "cat": "問7(5)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "ダイナミックレンジが狭いと聴こえにくい", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>ダイナミックレンジ＝C−Tレベルの幅。狭いと音の強弱の情報が少なく聞き取りにくい。<\/div>", "star": false, "memo": "", "chk": false}, {"id": "t036", "cat": "問8(1)｜成人適応基準", "ctx": "成人人工内耳の適応条件について、間違っているのはどれか。", "q": "<ruby>中途失聴者<rt>ちゅうとしっちょうしゃ<\/rt><\/ruby>", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>言語記憶があるのは大きな利点。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t037", "cat": "問8(2)｜成人適応基準", "ctx": "成人人工内耳の適応条件について、間違っているのはどれか。", "q": "両耳平均聴力レベル90dB以上の場合", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>裸耳での聴力検査で、（両耳）平均聴力レベル（500・1000・2000Hz）が90dB以上の重度感音難聴（成人基準2017 1-i）。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "t038", "cat": "問8(3)｜成人適応基準", "ctx": "成人人工内耳の適応条件について、間違っているのはどれか。", "q": "平均聴力レベルが70dB以上、90dB未満で、適切な補聴<ruby>装用<rt>そうよう<\/rt><\/ruby>下の最高<ruby>語音明瞭度<rt>ごおんめいりょうど<\/rt><\/ruby>が80%以下の難聴", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>最高語音明瞭度は「50%以下」（80%以下ではない）。70dB以上90dB未満で、適切な補聴器装用下の最高語音明瞭度が50%以下の高度感音難聴（成人基準2017 1-ii）。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "t039", "cat": "問8(4)｜成人適応基準", "ctx": "成人人工内耳の適応条件について、間違っているのはどれか。", "q": "先天性の視覚聴覚二重障害", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>正答表では「間違い」扱い。基準上は禁忌ではなく、言語習得前・習得中の失聴は「慎重な適応判断が必要」（成人基準2017 2-E）。<\/div><div>※(4)：ノートの「成人の先天聾の装用例は報告されていない」は不正確。成人後に人工内耳を施行した先天性難聴の症例報告はある（耳鼻咽喉科・頭頸部外科 91巻8号, 2019）。ただし言語習得前失聴は慎重な適応判断の対象。<\/div><div>※(4)：授業スライドは「10代後半の先天聾の装用例は報告されているが、成人ではない」としつつ、2000年頃から思春期以降の手術例で聞き取りが改善した報告もある（多くはない）とする。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t040", "cat": "問8(5)｜成人適応基準", "ctx": "成人人工内耳の適応条件について、間違っているのはどれか。", "q": "本人の意欲が重要で、家族の協力は特に必要無い", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>成人基準：「本人の意思および家族の意向を確認して手術適応を決定する」。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t041", "cat": "問9(1)｜慎重な適応判断", "ctx": "<ruby>慎重<rt>しんちょう<\/rt><\/ruby>な適応判断が必要なものについて、正しいのはどれか。", "q": "言語習得後の<ruby>失聴<rt>しっちょう<\/rt><\/ruby>", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>慎重な判断が必要なのは言語習得前・習得中の失聴。習得後は言語記憶があり 0", "cat": "問12(5)｜小児適応条件", "ctx": "小児人工内耳の適応条件について、間違っているのはどれか。", "q": "音声を用いて学習を行う小児に対し、最初は片耳<ruby>装用<rt>そうよう<\/rt><\/ruby>での効果を十分な観察期間をもって評価する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>補聴の基本は両耳聴であり、両耳聴の実現に人工内耳の両耳装用が有効な場合はこれを否定しない（II-3）。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t061", "cat": "問13(1)｜小児 語音聴取能の影響因子", "ctx": "小児人工内耳の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に与える影響因子について、間違っているのはどれか。", "q": "術前の視覚活用は術後の<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>に影響する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>手話の言語処理が聴覚連合野で行われているとの報告があり、術前から視覚情報で聴覚中枢を刺激しておくと術後の言語獲得がスムーズになる可能性（ノートでも仮説レベル）。<\/div><div>※(1)：聴覚野が視覚（手話等）で再編される（クロスモーダル可塑性）と術後成績が低下するとの報告もあり、見解は一致していない。正答表では○扱い。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t062", "cat": "問13(2)｜小児 語音聴取能の影響因子", "ctx": "小児人工内耳の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に与える影響因子について、間違っているのはどれか。", "q": "会話環境は<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>に影響しない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>影響する。乳幼児は親や周囲の会話を聴いて言語を学ぶ。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t063", "cat": "問13(3)｜小児 語音聴取能の影響因子", "ctx": "小児人工内耳の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に与える影響因子について、間違っているのはどれか。", "q": "電極数や刺激範囲は<ruby>聴取能<rt>ちょうしゅのう<\/rt><\/ruby>に影響しない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>影響する。スライド（A. Naito, 2000）：22本→11本でも間引きなら聴取能はほぼ不変（母音86→80%、子音55→50%）だが、連続して欠損し刺激範囲が狭くなると明らかに低下（母音38%、子音26%）。『数より壊れ方』。<\/div>", "star": false, "memo": "", "chk": true}, {"id": "t064", "cat": "問13(4)｜小児 語音聴取能の影響因子", "ctx": "小児人工内耳の<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に与える影響因子について、間違っているのはどれか。", "q": "<ruby>装用<rt>そうよう<\/rt><\/ruby>開始年齢の影響は大きい", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>早いほど脳の可塑性が高い。<\/div>", "star": true, "memo": "", "chk": true}, {"id": "t065", "cat": "問13(5)｜小児 語音聴取能の影響因子", "ctx const KEY = 'cochlear-implant-v1';
let S = {res:{}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const NUM = ['①','②','③','④','⑤'];
const ALL = D.questions.concat(D.kokushi, D.comb, D.ruikei, D.ox, D.oxr);
const app = document.getElementById('app');
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null) continue; e.append(c.nodeType ? c : document.createTextNode(c)); }
  return e;
}
function mount(...nodes){ app.replaceChildren(...nodes); window.scrollTo(0,0); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- ホーム ---------- */
function home(){
  const nodes = [];
  nodes.push(h('header', {class:'top'},
    h('h1', {}, '人工内耳'),
    h('p', {class:'lead'}, '試験対策 ｜ 過去問ベース')));

  nodes.push(h('h2', {class:'sec'}, '単元別（5択）'));
  const grid = h('div', {class:'cats'});
  D.groups.forEach(g => {
    const qs = D.questions.filter(q => q.g === g.id);
    const ok = qs.filter(q => S.res[q.id] === 'o').length;
    grid.append(h('button', {class:'cat', style:'--c:'+g.color, onclick:()=>startQuiz(qs, g.name)},
      h('span', {class:'nm'}, g.name),
      h('span', {class:'sb'}, g.sub),
      h('span', {class:'ct'}, h('span', {}, qs.length + '問'), h('span', {}, '正解済 ' + ok)),
      h('span', {class:'bar'}, h('i', {style:'width:'+Math.round(ok/qs.length*100)+'%'}))));
  });
  nodes.push(grid);

  nodes.push(h('h2', {class:'sec'}, '国試問題（授業で扱った過去問）'));
  const kgrid = h('div', {class:'cats'});
  D.kgroups.forEach(g => {
    const qs = D.kokushi.filter(q => q.g === g.id);
    const ok = qs.filter(q => S.res[q.id] === 'o').length;
    kgrid.append(h('button', {class:'cat', style:'--c:'+g.color, onclick:()=>startQuiz(qs, '国試：' + g.name)},
      h('span', {class:'nm'}, g.name),
      h('span', {class:'sb'}, g.sub),
      h('span', {class:'ct'}, h('span', {}, qs.length + '問'), h('span', {}, '正解済 ' + ok)),
      h('span', {class:'bar'}, h('i', {style:'width:'+Math.round(ok/qs.length*100)+'%'}))));
  });
  nodes.push(kgrid);

  nodes.push(h('h2', {class:'sec'}, '出題モード'));
  const wrong = ALL.filter(q => S.res[q.id] === 'x');
  const stars = D.questions.filter(q => q.star);
  nodes.push(h('div', {class:'modes'},
    h('button', {class:'mode', onclick:()=>startQuiz(D.questions, '5択 全問')}, '全問（' + D.questions.length + '）'),
    h('button', {class:'mode', onclick:()=>startQuiz(shuffle(D.questions), '5択 ランダム')}, 'ランダム'),
    h('button', {class:'mode', onclick:()=>startQuiz(D.kokushi, '国試 全問')}, '国試 全問（' + D.kokushi.length + '）'),
    h('button', {class:'mode', onclick:()=>startQuiz(shuffle(D.kokushi), '国試 ランダム')}, '国試 ランダム'),
    h('button', {class:'mode', onclick:()=>startQuiz(stars, '★頻出')}, h('b', {}, '★'), '頻出（' + stars.length + '）'),
    h('button', {class:'mode', disabled: wrong.length ? null : 'disabled', onclick:()=>startQuiz(wrong, '間違えた問題')}, '間違えた問題（' + wrong.length + '）')));

  const okc = a => a.filter(q => S.res[q.id] === 'o').length;
  const card = (nm, sb, list, title) => h('button', {class:'cat', onclick:()=>startQuiz(list, title)},
    h('span', {class:'nm'}, nm), h('span', {class:'sb'}, sb),
    h('span', {class:'ct'}, h('span', {}, list.length + '問'), h('span', {}, '正解済 ' + okc(list))));
  nodes.push(h('h2', {class:'sec'}, 'そのほかの学習'));
  nodes.push(h('div', {class:'more'},
    card('過去問（組合せ形式）', '原本どおり。記述(1)〜(5)から正しい組合せを選ぶ', D.comb, '過去問（組合せ形式）'),
    card('類題（組合せ形式）', '過去問の各肢を逆の文にした類題20問＋講義の追加3問', D.ruikei, '類題（組合せ形式）'),
    card('肢別○×（過去問）', '過去問の各記述（20問×5肢）を1つずつ○×で判定', D.ox, '肢別○×（過去問）'),
    card('肢別○×（類題）', '類題・追加問題の各記述（23問×5肢）を○×で判定', D.oxr, '肢別○×（類題）')));
  nodes.push(h('div', {class:'modes', style:'margin-top:10px'},
    h('button', {class:'mode', onclick:()=>startQuiz(shuffle(D.ruikei), '類題 ランダム')}, '類題 ランダム'),
    h('button', {class:'mode', onclick:()=>startQuiz(shuffle(D.ox), '肢別○×（過去問）ランダム')}, '肢別○×（過去問）ランダム'),
    h('button', {class:'mode', onclick:()=>startQuiz(shuffle(D.oxr), '肢別○×（類題）ランダム')}, '肢別○×（類題）ランダム')));

  nodes.push(h('div', {class:'foot'},
    h('button', {class:'link', onclick:()=>{ if(confirm('学習記録（○×）をすべて消しますか？')){ S={res:{}}; save(); home(); } }}, '学習記録をリセット')));
  mount(...nodes);
}

/* ---------- クイズ ---------- */
let Q = null;
function startQuiz(list, title){
  if (!list.length) { alert('該当する問題がありません。'); return; }
  Q = {list: list.slice(), title, i:0, correct:0, wrong:[]};
  renderQ();
}
function renderQ(){
  const q = Q.list[Q.i];
  const lab = q.lab || NUM;
  const need = q.ans.length;
  const sel = new Set();
  let answered = false;
  const opts = h('div', {class:'opts'});
  const rows = [];
  const resBox = h('div', {});
  const actBox = h('div', {class:'act'});

  function grade(){
    answered = true;
    const right = sel.size === need && q.ans.every(a => sel.has(a));
    rows.forEach((r,idx) => {
      const b = r.querySelector('.opt'); b.disabled = true;
      const x = r.querySelector('.elim'); if (x) x.disabled = true;
      b.classList.remove('sel');
      if (q.ans.includes(idx)) b.classList.add('ok');
      else if (sel.has(idx)) b.classList.add('ng');
    });
    S.res[q.id] = right ? 'o' : 'x'; save();
    if (right) Q.correct++; else Q.wrong.push(q);
    resBox.append(
      h('div', {class:'res ' + (right?'ok':'ng')}, right ? '正解' : '不正解　正答：' + q.ans.map(i=>lab[i]).join('・')),
      h('div', {class:'exp', html:q.exp}),
      q.memo ? h('div', {class:'memo'}, '※ メモ・要確認\n' + q.memo) : null);
    actBox.replaceChildren(h('button', {class:'btn', onclick:next}, Q.i+1 < Q.list.length ? '次の問題へ' : '結果を見る'));
  }
  function next(){ Q.i++; if (Q.i < Q.list.length) renderQ(); else resultView(); }

  const gradeBtn = h('button', {class:'btn', disabled:'disabled', onclick:grade}, '回答する');
  q.opts.forEach((t, idx) => {
    const b = h('button', {class:'opt', onclick:()=>{
      if (answered) return;
      if (need > 1) {
        if (sel.has(idx)) sel.delete(idx);
        else if (sel.size < need) sel.add(idx);
        rows.forEach((r,k)=>r.querySelector('.opt').classList.toggle('sel', sel.has(k)));
        if (sel.size === need) gradeBtn.removeAttribute('disabled'); else gradeBtn.setAttribute('disabled','disabled');
      } else { sel.add(idx); grade(); }
    }}, h('span', {class:'n'}, lab[idx]), h('span', {class:'t'}, t));
    const row = h('div', {class:'orow'}, b);
    if (!q.two) {
      row.append(h('button', {class:'elim', title:'消去法：この選択肢に取り消し線', 'aria-label':'この選択肢を消去', onclick:()=>row.classList.toggle('struck')}, '×'));
    }
    rows.push(row); opts.append(row);
  });
  if (need > 1) actBox.append(gradeBtn);

  mount(
    h('div', {class:'nav'},
      h('button', {class:'back', onclick:()=>{ if((!answered && Q.i===0) || confirm('クイズを中断してホームに戻りますか？')) home(); }}, '← ホーム'),
      h('span', {class:'ttl'}, Q.title),
      h('span', {class:'prog'}, (Q.i+1) + ' / ' + Q.list.length)),
    h('div', {class:'bar', style:'margin:0 0 12px;--c:var(--pri)'}, h('i', {style:'width:'+Math.round(Q.i/Q.list.length*100)+'%'})),
    h('div', {class:'card'},
      h('div', {class:'chips'},
        h('span', {class:'chip'}, q.cat),
        need > 1 ? h('span', {class:'chip multi'}, need + 'つ選べ') : null,
        q.star ? h('span', {class:'chip star'}, '★頻出') : null,
        q.off ? h('span', {class:'chip off'}, '公式正答と一致') : null,
        q.chk ? h('span', {class:'chip chk'}, '※要確認あり') : null),
      q.ctx ? h('div', {class:'ctx', html:'設問：' + q.ctx}) : null,
      h('div', {class:'qtext', html:q.q}),
      opts,
      h('p', {class:'hint'}, q.two ? 'この記述は正しいか、誤りかを選んでください。' : (need > 1 ? need + 'つ選んで「回答する」を押してください。右端の×で消去法ができます。' : '右端の×で選択肢に取り消し線を引けます（消去法）。')),
      actBox, resBox));
}
function resultView(){
  const n = Q.list.length, pct = Math.round(Q.correct / n * 100);
  const nodes = [
    h('div', {class:'nav'}, h('span', {class:'ttl'}, Q.title + ' の結果')),
    h('div', {class:'card'},
      h('div', {}, n + '問中'),
      h('div', {class:'score'}, Q.correct + '問正解（' + pct + '%）'),
      h('div', {class:'act'},
        Q.wrong.length ? h('button', {class:'btn', onclick:()=>startQuiz(Q.wrong, '間違えた問題')}, '間違いだけやり直す（' + Q.wrong.length + '）') : null,
        h('button', {class:'btn ghost', onclick:home}, 'ホームへ')))
  ];
  if (Q.wrong.length) {
    const ul = h('ul', {class:'wlist'});
    Q.wrong.forEach(q => {
      const lab = q.lab || NUM;
      ul.append(h('li', {},
        h('div', {html:q.q}),
        h('div', {class:'a'}, '正答：' + q.ans.map(i=>lab[i] + ' ' + q.opts[i]).join(' ／ '))));
    });
    nodes.push(h('h2', {class:'sec'}, '間違えた問題'), ul);
  }
  mount(...nodes);
}

home();
</script>
