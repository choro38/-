<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人工内耳 試験対策</title>
<style>
:root{
  --bg:#f2f5f4; --card:#ffffff; --ink:#1b2a29; --sub:#5b6b69; --line:#d9e1df;
  --pri:#1f6f6b; --pri-ink:#ffffff; --star:#b9770e; --ok:#23703f; --ok-bg:#e4f3e9;
  --ng:#a8342d; --ng-bg:#fbe9e7; --note:#8a5a00; --note-bg:#fff3d6; --blank:#d7ece9;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121a19; --card:#1a2524; --ink:#e6efed; --sub:#9bb0ac; --line:#2e3e3c;
    --pri:#4fb3ac; --pri-ink:#0b1514; --star:#e0a443; --ok:#6fd199; --ok-bg:#183326;
    --ng:#ff8f86; --ng-bg:#3a1f1c; --note:#f0c36b; --note-bg:#33280f; --blank:#244744;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
  line-height:1.7;font-size:16px;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:720px;margin:0 auto;padding:16px 14px 56px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
ruby rt{font-size:.55em;color:var(--sub)}
h1{font-size:1.45rem;margin:0;line-height:1.35}
.lead{margin:.2rem 0 0;color:var(--sub);font-size:.9rem}
.sec{font-size:1.05rem;margin:26px 0 10px}
.top{padding:6px 2px 4px}

/* カテゴリーカード（最上部・最も目立たせる） */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.cats{grid-template-columns:1fr}}
.cat{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);
  border-left:8px solid var(--c);border-radius:12px;padding:14px 14px 12px;min-height:128px;display:flex;flex-direction:column}
.cat:hover{border-color:var(--c)}
.cat .nm{font-size:1.15rem;font-weight:700;line-height:1.35}
.cat .sb{font-size:.8rem;color:var(--sub);margin-top:4px;flex:1}
.cat .ct{font-size:.85rem;margin-top:8px;display:flex;justify-content:space-between}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--pri))}

/* 出題モード（カテゴリーより控えめ） */
.modes{display:flex;flex-wrap:wrap;gap:8px}
.mode{flex:1 1 auto;min-width:110px;padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:.92rem}
.mode b{color:var(--star)}
.mode[disabled]{opacity:.4;cursor:default}
.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.more{grid-template-columns:1fr}}
.more .cat{min-height:0;border-left-width:4px;border-left-color:var(--sub)}
.more .cat .nm{font-size:1rem}
.foot{margin-top:30px;text-align:center}
.link{background:none;border:none;color:var(--sub);text-decoration:underline;font-size:.85rem}

/* 画面共通 */
.nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.ttl{font-weight:700;flex:1;font-size:.95rem}
.prog{font-size:.85rem;color:var(--sub);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--sub)}
.chip.star{border-color:var(--star);color:var(--star);font-weight:700}
.chip.multi{border-color:var(--pri);color:var(--pri);font-weight:700}
.chip.off{border-color:var(--ok);color:var(--ok)}
.opt.sel{border-color:var(--pri);background:var(--blank)}
.chip.chk{border-color:var(--note);color:var(--note);background:var(--note-bg)}
.qtext{font-size:1.05rem;font-weight:600;margin:4px 0 14px}
.ctx{font-size:.85rem;color:var(--sub);margin:0 0 6px}

/* 選択肢 */
.opts{display:flex;flex-direction:column;gap:8px}
.orow{display:flex;gap:6px;align-items:stretch}
.opt{flex:1;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:11px 12px;background:var(--card);
  border:1.5px solid var(--line);border-radius:10px}
.opt .n{flex:none;font-weight:700;color:var(--pri)}
.opt:hover:not([disabled]){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ng{border-color:var(--ng);background:var(--ng-bg)}
.orow.struck .opt .t{text-decoration:line-through;opacity:.45}
.elim{flex:none;width:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--sub);font-size:1.1rem}
.orow.struck .elim{background:var(--ng-bg);color:var(--ng);border-color:var(--ng)}
.act{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:11px 20px;border-radius:10px;border:1.5px solid var(--pri);background:var(--pri);color:var(--pri-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--pri)}
.res{margin-top:14px;padding:10px 14px;border-radius:10px;font-weight:700}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.ng{background:var(--ng-bg);color:var(--ng)}
.exp{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.exp div+div{margin-top:4px}
.memo{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--note-bg);color:var(--note);font-size:.85rem;white-space:pre-line}
.hint{font-size:.8rem;color:var(--sub);margin:8px 0 0}

/* 結果 */
.score{font-size:2.2rem;font-weight:800;color:var(--pri);margin:4px 0}
.wlist{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.wlist li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem}
.wlist .a{color:var(--ok);font-weight:700;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .3s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = {"ruikei": [{"id": "r01", "cat": "システム（類題1）", "q": "人工内耳システムについて、間違っているのはどれか。<br>(1) <ruby>皮弁<rt>ひべん<\/rt><\/ruby>の厚さは刺激電流に影響する<br>(2) <ruby>体外器<rt>たいがいき<\/rt><\/ruby>は<ruby>受信<rt>じゅしん<\/rt><\/ruby>コイルおよび電極で構成される<br>(3) らせん神経節細胞に電気刺激される<br>(4) 入力音声の周波数情報は、周波数に関係なく全電極へ均等に割り振られる<br>(5) 解析された信号は<ruby>受信<rt>じゅしん<\/rt><\/ruby>コイルから<ruby>送信<rt>そうしん<\/rt><\/ruby>コイルに送られる", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(1)(2)(5)", "(2)(3)(4)", "(2)(4)(5)"], "ans": [4], "exp": "<div><b>【正解】⑤ (2)(4)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　皮弁が厚いとより多くの電力を要する。電力消費の要因：皮弁の厚さ・刺激レート・T,Cレベルの大きさ・パルス幅・周囲の音環境。電力の内訳は電磁誘導（送信）が約7割（スライド）。　［元：問1(4)の逆］<\/div><div>(2) ×　体外器＝スピーチプロセッサー＋送信コイル／体内器（インプラント）＝受信コイル＋電極。　［元：問1(5)の逆］<\/div><div>(3) ○　電気刺激の標的は有毛細胞ではなく、らせん神経節細胞（スライド：有毛細胞は機能せず、らせん神経節細胞が電気刺激を受ける）。　［元：問1(1)の逆］<\/div><div>(4) ×　周波数ごとに各電極へ割り振られる。フォルマントF1は蝸牛奥（低周波側）、F2は蝸牛入口寄り（高周波側）（スライド）。　［元：問1(3)の逆］<\/div><div>(5) ×　逆。体外の送信コイルから体内の受信コイルへ、搬送波（電磁誘導＝ワイヤレス電力伝送 WPT：Wireless Power Transfer）で送られる。　［元：問1(2)の逆］<\/div><div>※『皮弁の厚さが影響する』のは、厳密には体外⇔体内の伝送効率・電力消費。<\/div>", "star": true, "memo": "", "chk": false}, {"id": "r02", "cat": "電極（類題2）", "q": "電極について、間違っているのはどれか。<br>(1) <ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>への再挿入は可能である<br>(2) 単チャンネルの電極が多く使用される<br>(3) <ruby>基底回転<rt>きていかいてん<\/rt><\/ruby>に近い部分の電極は低音を担当する<br>(4) 挿入電極は基本的に<ruby>鼓室階<rt>こしつかい<\/rt><\/ruby>へ挿入される<br>(5) 電極は<ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>の頂部まで必ず挿入される", "opts": ["(1)(2)(3)", "(1)(2)(5)", "(1)(3)(4)", "(1)(3)(5)", "(2)(3)(5)"], "ans": [4], "exp": "<div><b>【正解】⑤ (2)(3)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　再挿入は可能。再挿入後の語音聴取能は増加・改善の報告が多いが、減少の報告もある（スライド）。　［元：問2(5)の逆］<\/div><div>(2) ×　多チャンネルが主流（3社：コクレア社＝オーストラリア、メドエル社＝オーストリア、バイオニクス社＝米国）。単チャンネルでは周波数情報（フォルマント）を入れられない。　［元：問2(2)の逆］<\/div><div>(3) ×　逆。基底回転（蝸牛入口）＝高周波数、頂回転（蝸牛奥）＝低周波数。　［元：問2(3)の逆］<\/div><div>(4) ○　鼓室階は蝸牛窓から連続して挿入しやすく、前庭階よりらせん神経節（神経）に近い。　［元：問2(4)の逆］<\/div><div>(5) ×　頂部までは入らない。昔は約1.5回転、近年はそれ以上入る電極もある（機種で異なる。講義）。　［元：問2(1)の逆］<\/div>", "star": true, "memo": "", "chk": false}, {"id": "r03", "cat": "術前検査（聴性誘発反応）（類題3）", "q": "術前の聴力評価について、間違っているのはどれか。<br>(1) 40Hz ASSR（<ruby>聴性<rt>ちょうせい<\/rt><\/ruby>定常反応）は、乳幼児の聴力検査に用いられる<br>(2) ASSRは、各周波数ごとに聴力<ruby>閾値<rt>いきち<\/rt><\/ruby>を推定できる<br>(3) ABRは、<ruby>閾値<rt>いきち<\/rt><\/ruby>の測定ができる<br>(4) <ruby>語音聴力検査<rt>ごおんちょうりょくけんさ<\/rt><\/ruby>は、適応基準の判定に用いられない<br>(5) ABR（<ruby>聴性脳幹反応<rt>ちょうせいのうかんはんのう<\/rt><\/ruby>）は、オージオグラムに対応する周波数特異性をもつ", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(1)(3)(4)", "(1)(4)(5)", "(2)(4)(5)"], "ans": [3], "exp": "<div><b>【正解】④ (1)(4)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　乳幼児の聴力検査は80Hz ASSR（睡眠時の方が反応の出現性が良い）。40Hz ASSRは覚醒時に行い、成人の詐聴の検査に用いる。ASSR＝Auditory Steady-State Response（スライド）。　［元：スライド］<\/div><div>(2) ○　周波数特異性があり、各周波数ごとに推定可能（スライド）。　［元：スライド］<\/div><div>(3) ○　刺激音圧を下げ、波形（V波）が出る最小の音圧が閾値（例：20dB）。　［元：問3(5)］<\/div><div>(4) ×　用いられる。適応基準は小児・成人とも平均聴力レベルと語音明瞭度が重要。　［元：問3(3)の逆］<\/div><div>(5) ×　ABR（Auditory Brainstem Response）はクリック音を用いるため周波数特異性がない（欠点）。閾値の測定はできる。　［元：問3(5)＋スライド］<\/div>", "star": true, "memo": "", "chk": false}, {"id": "r04", "cat": "手術（類題4）", "q": "手術について、間違っているのはどれか。<br>(1) 術前検査として、CT・MRI等の画像検査は不要である<br>(2) <ruby>顔面神経<rt>がんめんしんけい<\/rt><\/ruby>や<ruby>鼓索神経<rt>こさくしんけい<\/rt><\/ruby>に細心の注意が必要である<br>(3) 皮膚切開は耳介の後ろに行う<br>(4) <ruby>乳突削開術<rt>にゅうとつさっかいじゅつ<\/rt><\/ruby>は、ダイヤモンドバーではなく電気メスを用いて行う<br>(5) 無理に挿入しても、電極は屈曲やショートしない", "opts": ["(1)(2)(4)", "(1)(3)(4)", "(1)(4)(5)", "(2)(3)(5)", "(2)(4)(5)"], "ans": [2], "exp": "<div><b>【正解】③ (1)(4)(5)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　必須。電極を挿入するスペース、内耳奇形、蝸牛神経、中耳炎などを確認。髄膜炎後は蝸牛の骨化が進行するため早期の手術が必要（スライド）。　［元：問4(1)の逆］<\/div><div>(2) ○　顔面神経・鼓索神経（味覚）付近の操作に注意（スライド）。動眼神経（第Ⅲ脳神経）ではない。　［元：問4(4)の逆］<\/div><div>(3) ○　耳介の後ろ（耳後部切開）。剃毛はほぼ不要、抜糸・ガーゼ交換も不要（スライド）。　［元：問4(5)の逆］<\/div><div>(4) ×　乳突削開術はダイヤモンドバー（先端にダイヤモンドを付けた骨を削る器具）を用いる。モノポーラ電気メスはインプラント近くでは避ける。　［元：問4(3)の逆］<\/div><div>(5) ×　無理に挿入すると屈曲・ショート（短絡）する。　［元：問4(2)の逆］<\/div>", "star": true, "memo": "", "chk": false}, {"id": "r05", "cat": "手術合併症（類題5）", "q": "手術の副作用について、間違っているのはどれか。<br>(1) <ruby>顔面麻痺<rt>がんめんまひ<\/rt><\/ruby>は、手術の副作用として典型的ではない<br>(2) めまいは、手術の副作用として典型的ではない<br>(3) <ruby>味覚<rt>みかく<\/rt><\/ruby>低下は、手術の副作用として典型的ではない<br>(4) <ruby>複視<rt>ふくし<\/rt><\/ruby>は、手術の副作用として典型的ではない<br>(5) 知覚過敏は、手術の副作用として典型的ではない", "opts": ["(1)(2)(3)", "(1)(2)(4)", "(1)(3)(4)", "(1)(3)(5)", "(3)(4)(5)"], "ans": [0], "exp": "<div><b>【正解】① (1)(2)(3)<\/b><\/div><div>【問題の型】間違っているものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　顔面神経が近くを走るため起こりうる。国試頻出：めまい・顔面麻痺・味覚低下。　［元：問5(5)］<\/div><div>(2) ×　前庭神経・前庭器が近く、蝸牛開放に伴うリンパ液の流出などでめまいが起こりうる。　［元：問5(3)］<\/div><div>(3) ×　鼓索神経の障害による典型的な副作用。ドリルの振動・熱による一過性が多く、3〜5か月程度で回復（講義）。　［元：問5(1)］<\/div><div>(4) ○　複視は典型的な副作用ではない。　［元：問5(2)］<\/div><div>(5) ○　典型的な副作用ではない。　［元：問5(4)］<\/div>", "star": true, "memo": "", "chk": false}, {"id": "r06", "cat": "マッピング（類題6）", "q": "マッピングについて、正しいのはどれか。<br>(1) 第1フォルマントの情報は第2フォルマントに比べて、<ruby>基底回転<rt>きていかいてん<\/rt><\/ruby>に近い電極に割り当てられる<br>(2) 術後のマッピングは頻回に実施した方が良い<br>(3) 周波数割り振りを変えても、聴こえは変化しない<br>(4) 刺激頻度を増やすと、聴こえが明瞭になる人もいる<br>(5) モノポーラ刺激はバイポーラ刺激に比べて、聴神経をより高いレートで刺激可能である", "opts": ["(1)(2)(5)", "(1)(3)(4)", "(2)(3)(4)", "(2)(3)(5)", "(2)(4)(5)"], "ans": [4], "exp": "<div><b>【正解】⑤ (2)(4)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　逆。F1は低周波数のため頂回転側（蝸牛奥）、F2は基底回転側（蝸牛入口）。　［元：問6(4)の逆］<\/div><div>(2) ○　術後は変化していくため頻回に調整。例：2歳9か月の音入れ時は使用電極5本・DR（Dynamic Range）3〜5→3か月後22本・DR35〜53（スライド）。　［元：問6(5)の逆］<\/div><div>(3) ×　変化する。変更直後は一旦悪化するが、脳内のテンプレートが作り直され改善する例がある（母音聴取能 76%→一旦低下→92%：スライド）。　［元：問6(2)の逆］<\/div><div>(4) ○　刺激数が多いほど聴き取りが明瞭になる人もいる（個人差あり）。スライド：1500回/秒→14400回/秒→31600回/秒へ機器は進歩。　［元：問6(1)の逆］<\/div><div>(5) ○　モノポーラは電流が広い範囲に流れ、低い電流でT・Cレベルが得られる→エネルギーが少なく電池が長持ち→高いレートで刺激可能。　［元：問6(3)の逆］<\/div>", "star": true, "memo": "", "chk": false}, {"id": "r07", "cat": "マッピング（類題7）", "q": "マッピングについて、間違っているのはどれか。<br>(1) UCLを超える強さで、Cレベルを設定する<br>(2) Cレベルは音入れ後に減少する傾向にある<br>(3) Cレベルを上げすぎると、<ruby>顔面神経<rt>がんめんしんけい<\/rt><\/ruby>刺激が起こりうる<br>(4) <ruby>電気誘発複合電位<rt>でんき , "exp": "<div><b>【正解】④ (1)(4)(5)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ○　ただしダブルピーク等でうまくいかない例もある（講義）。　［元：問7(3)］<\/div><div>(2) ×　高い（TとCの中間付近）。　［元：問7(3)］<\/div><div>(3) ×　乳幼児こそ有用（T・Cが測れないため）。　［元：追加（講義）］<\/div><div>(4) ○　NRT（Neural Response Telemetry：神経反応テレメトリー）はコクレア社の測定システム名。測定対象はらせん神経節細胞の反応（EAP／ECAP）（スライド・講義）。　［元：追加（講義）］<\/div><div>(5) ○　乳幼児は大きさの応答ができないため、EAP閾値を目安にT・Cを設定（講義）。　［元：追加（講義）］<\/div>", "star": true, "memo": "", "chk": false}, {"id": "r23", "cat": "成人 語音聴取・失聴期間（追加23）", "q": "成人の語音聴取と人工内耳について、正しいのはどれか。<br>(1) 7歳未満の小児例と60歳以上の高齢者の症例は、減少している<br>(2) <ruby>失聴<rt>しっちょう<\/rt><\/ruby>期間が10年未満では電話が可能な例が多く、30年以上では<ruby>読話<rt>どくわ<\/rt><\/ruby>の併用が必要となる傾向がある<br>(3) 語音聴取に必要な基本的3要素は、周波数分解能・大きさの分解能・時間分解能である<br>(4) 全身麻酔の手術が可能であれば、特に年齢の上限はない<br>(5) 成人<ruby>中途失聴者<rt>ちゅうとしっちょうしゃ<\/rt><\/ruby>では、<ruby>失聴<rt>しっちょう<\/rt><\/ruby>原因によって<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に大きな差がある", "opts": ["(1)(2)(3)", "(1)(3)(4)", "(1)(4)(5)", "(2)(3)(4)", "(3)(4)(5)"], "ans": [3], "exp": "<div><b>【正解】④ (2)(3)(4)<\/b><\/div><div>【問題の型】正しいものを選ぶ問題（各肢の○＝記述は正しい／×＝記述は誤り）<\/div><div>(1) ×　増加が顕著（スライド）。　［元：追加（講義）］<\/div><div>(2) ○　スライド：失聴期間と聴こえの関係（A. Naito, 1998）。　［元：問16(3)］<\/div><div>(3) ○　スライド：語音聴取に必要な基本的3要素。　［元：追加（講義）］<\/div><div>(4) ○　スライド：日本での手術件数の推移。7歳未満の小児と60歳以上の高齢者の症例の増加が顕著。　［元：問16(5)］<\/div><div>(5) ×　差はない（原因は不明が半数：スライド）。　［元：問16(1)］<\/div>", "star": false, "memo": "", "chk": false}], "oxr": [{"id": "u001", "cat": "類題1(1)｜システム", "ctx": "人工内耳システムについて、間違っているのはどれか。", "q": "<ruby>皮弁<rt>ひべん<\/rt><\/ruby>の厚さは刺激電流に影響する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>皮弁が厚いとより多くの電力を要する。電力消費の要因：皮弁の厚さ・刺激レート・T,Cレベルの大きさ・パルス幅・周囲の音環境。電力の内訳は電磁誘導（送信）が約7割（スライド）。<\/div><div>（元：問1(4)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u002", "cat": "類題1(2)｜システム", "ctx": "人工内耳システムについて、間違っているのはどれか。", "q": "<ruby>体外器<rt>たいがいき<\/rt><\/ruby>は<ruby>受信<rt>じゅしん<\/rt><\/ruby>コイルおよび電極で構成される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>体外器＝スピーチプロセッサー＋送信コイル／体内器（インプラント）＝受信コイル＋電極。<\/div><div>（元：問1(5)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u003", "cat": "類題1(3)｜システム", "ctx": "人工内耳システムについて、間違っているのはどれか。", "q": "らせん神経節細胞に電気刺激される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>電気刺激の標的は有毛細胞ではなく、らせん神経節細胞（スライド：有毛細胞は機能せず、らせん神経節細胞が電気刺激を受ける）。<\/div><div>（元：問1(1)の逆）<\/div>", "star": true, "memo": "", "chk": false}, {"id": "u004", "cat": "類題1(4)｜システム", "ctx": "人工内耳システムについて、間違っているのはどれか。", "q": "入力音声の周波数情報は、周波数に関係なく全電極へ均等に割り振られる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>周波数ごとに各電極へ割り振られる。フォルマントF1は蝸牛奥（低周波側）、F2は蝸牛入口寄り（高周波側）（スライド）。<\/div><div>（元：問1(3)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u005", "cat": "類題1(5)｜システム", "ctx": "人工内耳システムについて、間違っているのはどれか。", "q": "解析された信号は<ruby>受信<rt>じゅしん<\/rt><\/ruby>コイルから<ruby>送信<rt>そうしん<\/rt><\/ruby>コイルに送られる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>逆。体外の送信コイルから体内の受信コイルへ、搬送波（電磁誘導＝ワイヤレス電力伝送 WPT：Wireless Power Transfer）で送られる。<\/div><div>（元：問1(2)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u006", "cat": "類題2(1)｜電極", "ctx": "電極について、間違っているのはどれか。", "q": "<ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>への再挿入は可能である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>再挿入は可能。再挿入後の語音聴取能は増加・改善の報告が多いが、減少の報告もある（スライド）。<\/div><div>（元：問2(5)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u007", "cat": "類題2(2)｜電極", "ctx": "電極について、間違っているのはどれか。", "q": "単チャンネルの電極が多く使用される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>多チャンネルが主流（3社：コクレア社＝オーストラリア、メドエル社＝オーストリア、バイオニクス社＝米国）。単チャンネルでは周波数情報（フォルマント）を入れられない。<\/div><div>（元：問2(2)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u008", "cat": "類題2(3)｜電極", "ctx": "電極について、間違っているのはどれか。", "q": "<ruby>基底回転<rt>きていかいてん<\/rt><\/ruby>に近い部分の電極は低音を担当する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>逆。基底回転（蝸牛入口）＝高周波数、頂回転（蝸牛奥）＝低周波数。<\/div><div>（元：問2(3)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u009", "cat": "類題2(4)｜電極", "ctx": "電極について、間違っているのはどれか。", "q": "挿入電極は基本的に<ruby>鼓室階<rt>こしつかい<\/rt><\/ruby>へ挿入される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>鼓室階は蝸牛窓から連続して挿入しやすく、前庭階よりらせん神経節（神経）に近い。<\/div><div>（元：問2(4)の逆）<\/div>", "star": true, "memo": "", "chk": false}, {"id": "u010", "cat": "類題2(5)｜電極", "ctx": "電極について、間違っているのはどれか。", "q": "電極は<ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>の頂部まで必ず挿入される", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>頂部までは入らない。昔は約1.5回転、近年はそれ以上入る電極もある（機種で異なる。講義）。<\/div><div>（元：問2(1)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u011", "cat": "類題3(1)｜術前検査（聴性誘発反応）", "ctx": "術前の聴力評価について、間違っているのはどれか。", "q": "40Hz ASSR（<ruby>聴性<rt>ちょうせい<\/rt><\/ruby>定常反応）は、乳幼児の聴力検査に用いられる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>乳幼児の聴力検査は80Hz ASSR（睡眠時の方が反応の出現性が良い）。40Hz ASSRは覚醒時に行い、成人の詐聴の検査に用いる。ASSR＝Auditory Steady-State Response（スライド）。<\/div><div>（元：スライド）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u012", "cat": "類題3(2)｜術前検査（聴性誘発反応）", "ctx": "術前の聴力評価について、間違っているのはどれか。", "q": "ASSRは、各周波数ごとに聴力<ruby>閾値<rt>いきち<\/rt><\/ruby>を推定できる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>周波数特異性があり、各周波数ごとに推定可能（スライド）。<\/div><div>（元：スライド）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u013", "cat": "類題3(3)｜術前検査（聴性誘発反応）", "ctx": "術前の聴力評価について、間違っているのはどれか。", "q": "ABRは、<ruby>閾値<rt>いきち<\/rt><\/ruby>の測定ができる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>刺激音圧を下げ、波形（V波）が出る最小の音圧が閾値（例：20dB）。<\/div><div>（元：問3(5)）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u014", "cat": "類題3(4)｜術前検査（聴性誘発反応）", "ctx": "術前の聴力評価について、間違っているのはどれか。", "q": "<ruby>語音聴力検査<rt>ごおんちょうりょくけんさ<\/rt><\/ruby>は、適応基準の判定に用いられない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>用いられる。適応基準は小児・成人とも平均聴力レベルと語音明瞭度が重要。<\/div><div>（元：問3(3)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u015", "cat": "類題3(5)｜術前検査（聴性誘発反応）", "ctx": "術前の聴力評価について、間違っているのはどれか。", "q": "ABR（<ruby>聴性脳幹反応<rt>ちょうせいのうかんはんのう<\/rt><\/ruby>）は、オージオグラムに対応する周波数特異性をもつ", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>ABR（Auditory Brainstem Response）はクリック音を用いるため周波数特異性がない（欠点）。閾値の測定はできる。<\/div><div>（元：問3(5)＋スライド）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u016", "cat": "類題4(1)｜手術", "ctx": "手術について、間違っているのはどれか。", "q": "術前検査として、CT・MRI等の画像検査は不要である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>必須。電極を挿入するスペース、内耳奇形、蝸牛神経、中耳炎などを確認。髄膜炎後は蝸牛の骨化が進行するため早期の手術が必要（スライド）。<\/div><div>（元：問4(1)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u017", "cat": "類題4(2)｜手術", "ctx": "手術について、間違っているのはどれか。", "q": "<ruby>顔面神経<rt>がんめんしんけい<\/rt><\/ruby>や<ruby>鼓索神経<rt>こさくしんけい<\/rt><\/ruby>に細心の注意が必要である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>顔面神経・鼓索神経（味覚）付近の操作に注意（スライド）。動眼神経（第Ⅲ脳神経）ではない。<\/div><div>（元：問4(4)の逆）<\/div>", "star": true, "memo": "", "chk": false}, {"id": "u018", "cat": "類題4(3)｜手術", "ctx": "手術について、間違っているのはどれか。", "q": "皮膚切開は耳介の後ろに行う", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>耳介の後ろ（耳後部切開）。剃毛はほぼ不要、抜糸・ガーゼ交換も不要（スライド）。<\/div><div>（元：問4(5)の逆）<\/div>", "star": true, "memo": "", "chk": false}, {"id": "u019", "cat": "類題4(4)｜手術", "ctx": "手術について、間違っているのはどれか。", "q": "<ruby>乳突削開術<rt>にゅうとつさっかいじゅつ<\/rt><\/ruby>は、ダイヤモンドバーではなく電気メスを用いて行う", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>乳突削開術はダイヤモンドバー（先端にダイヤモンドを付けた骨を削る器具）を用いる。モノポーラ電気メスはインプラント近くでは避ける。<\/div><div>（元：問4(3)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u020", "cat": "類題4(5)｜手術", "ctx": "手術について、間違っているのはどれか。", "q": "無理に挿入しても、電極は屈曲やショートしない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>無理に挿入すると屈曲・ショート（短絡）する。<\/div><div>（元：問4(2)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u021", "cat": "類題5(1)｜手術合併症", "ctx": "手術の副作用について、間違っているのはどれか。", "q": "<ruby>顔面麻痺<rt>がんめんまひ<\/rt><\/ruby>は、手術の副作用として典型的ではない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>顔面神経が近くを走るため起こりうる。国試頻出：めまい・顔面麻痺・味覚低下。<\/div><div>（元：問5(5)）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u022", "cat": "類題5(2)｜手術合併症", "ctx": "手術の副作用について、間違っているのはどれか。", "q": "めまいは、手術の副作用として典型的ではない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>前庭神経・前庭器が近く、蝸牛開放に伴うリンパ液の流出などでめまいが起こりうる。<\/div><div>（元：問5(3)）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u023", "cat": "類題5(3)｜手術合併症", "ctx": "手術の副作用について、間違っているのはどれか。", "q": "<ruby>味覚<rt>みかく<\/rt><\/ruby>低下は、手術の副作用として典型的ではない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>鼓索神経の障害による典型的な副作用。ドリルの振動・熱による一過性が多く、3〜5か月程度で回復（講義）。<\/div><div>（元：問5(1)）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u024", "cat": "類題5(4)｜手術合併症", "ctx": "手術の副作用について、間違っているのはどれか。", "q": "<ruby>複視<rt>ふくし<\/rt><\/ruby>は、手術の副作用として典型的ではない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>複視は典型的な副作用ではない。<\/div><div>（元：問5(2)）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u025", "cat": "類題5(5)｜手術合併症", "ctx": "手術の副作用について、間違っているのはどれか。", "q": "知覚過敏は、手術の副作用として典型的ではない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>典型的な副作用ではない。<\/div><div>（元：問5(4)）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u026", "cat": "類題6(1)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "第1フォルマントの情報は第2フォルマントに比べて、<ruby>基底回転<rt>きていかいてん<\/rt><\/ruby>に近い電極に割り当てられる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>逆。F1は低周波数のため頂回転側（蝸牛奥）、F2は基底回転側（蝸牛入口）。<\/div><div>（元：問6(4)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u027", "cat": "類題6(2)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "術後のマッピングは頻回に実施した方が良い", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>術後は変化していくため頻回に調整。例：2歳9か月の音入れ時は使用電極5本・DR（Dynamic Range）3〜5→3か月後22本・DR35〜53（スライド）。<\/div><div>（元：問6(5)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u028", "cat": "類題6(3)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "周波数割り振りを変えても、聴こえは変化しない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>変化する。変更直後は一旦悪化するが、脳内のテンプレートが作り直され改善する例がある（母音聴取能 76%→一旦低下→92%：スライド）。<\/div><div>（元：問6(2)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u029", "cat": "類題6(4)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "刺激頻度を増やすと、聴こえが明瞭になる人もいる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>刺激数が多いほど聴き取りが明瞭になる人もいる（個人差あり）。スライド：1500回/秒→14400回/秒→31600回/秒へ機器は進歩。<\/div><div>（元：問6(1)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u030", "cat": "類題6(5)｜マッピング", "ctx": "マッピングについて、正しいのはどれか。", "q": "モノポーラ刺激はバイポーラ刺激に比べて、聴神経をより高いレートで刺激可能である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>モノポーラは電流が広い範囲に流れ、低い電流でT・Cレベルが得られる→エネルギーが少なく電池が長持ち→高いレートで刺激可能。<\/div><div>（元：問6(3)の逆）<\/div>", "star": true, "memo": "", "chk": false}, {"id": "u031", "cat": "類題7(1)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "UCLを超える強さで、Cレベルを設定する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>UCL（Uncomfortable Loudness Level：不快閾値）を超えないように、C（Comfortable：最大快適閾値）レベルを設定する。<\/div><div>（元：問7(1)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u032", "cat": "類題7(2)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "Cレベルは音入れ後に減少する傾向にある", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>増加する傾向（慣れとともにダイナミックレンジが広がる。短期失聴の成人ほど毎週上がりやすい：講義）。<\/div><div>（元：問7(4)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u033", "cat": "類題7(3)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "Cレベルを上げすぎると、<ruby>顔面神経<rt>がんめんしんけい<\/rt><\/ruby>刺激が起こりうる", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>Cレベルが過大だと、近くを走る顔面神経が刺激され顔面痙攣が起こりうる（骨が薄い共通腔など）。鼓索神経の刺激による味覚の異常も起こりうる。嗅覚障害は起こらない（過去問7(2)の逆）。出題の主眼は顔面神経刺激（痙攣）と思われる。<\/div><div>（元：問7(2)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u034", "cat": "類題7(4)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "<ruby>電気誘発複合電位<rt>でんきゆうはつふくごうでんい<\/rt><\/ruby>（EAP）の<ruby>閾値<rt>いきち<\/rt><\/ruby>は、Tレベルより高い", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>EAP（＝ECAP：Electrically evoked Compound Action Potential）閾値は概ねTとCの中間付近。NRT（Neural Response Telemetry：神経反応テレメトリー）は測定システム名で、EAPが測定対象。<\/div><div>（元：問7(3)の逆）<\/div>", "star": true, "memo": "", "chk": false}, {"id": "u035", "cat": "類題7(5)｜マッピング", "ctx": "マッピングについて、間違っているのはどれか。", "q": "ダイナミックレンジが広いと、聴こえにくい", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>狭いと音情報が少なく聴こえにくい。広い方が聴こえやすい（スライド：狭くなる→脳が認識しにくい）。<\/div><div>（元：問7(5)の逆）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u036", "cat": "類題8(1)｜成人適応基準", "ctx": "成人人工内耳の適応条件について、正しいのはどれか。", "q": "平均聴力レベル70dB以上90dB未満で、適切な<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby><ruby>装用<rt>そうよう<\/rt><\/ruby>下の最高<ruby>語音明瞭度<rt>ごおんめいりょうど<\/rt><\/ruby>が50%以下の高度<ruby>感音難聴<rt>かんおんなんちょう<\/rt><\/ruby>は適応条件に該当する", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>成人基準2017 ii。（過去問の『80%以下』は誤り）<\/div><div>（元：問8(3)の逆）<\/div>", "star": true, "memo": "", "chk": false}, {"id": "u037", "cat": "類題8(2)｜成人適応基準", "ctx": "成人人工内耳の適応条件について、正しいのはどれか。", "q": "両耳の平均聴力レベルが90dB以上でも、適応条件に該当しない", "opts": ["○ 正しい記述", "× 誤った記述"], " ": "", "chk": false}, {"id": "u113", "cat": "追加23(3)｜成人 語音聴取・失聴期間", "ctx": "成人の語音聴取と人工内耳について、正しいのはどれか。", "q": "語音聴取に必要な基本的3要素は、周波数分解能・大きさの分解能・時間分解能である", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>スライド：語音聴取に必要な基本的3要素。<\/div><div>（元：追加（講義））<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u114", "cat": "追加23(4)｜成人 語音聴取・失聴期間", "ctx": "成人の語音聴取と人工内耳について、正しいのはどれか。", "q": "全身麻酔の手術が可能であれば、特に年齢の上限はない", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [0], "exp": "<div>スライド：日本での手術件数の推移。7歳未満の小児と60歳以上の高齢者の症例の増加が顕著。<\/div><div>（元：問16(5)）<\/div>", "star": false, "memo": "", "chk": false}, {"id": "u115", "cat": "追加23(5)｜成人 語音聴取・失聴期間", "ctx": "成人の語音聴取と人工内耳について、正しいのはどれか。", "q": "成人<ruby>中途失聴者<rt>ちゅうとしっちょうしゃ<\/rt><\/ruby>では、<ruby>失聴<rt>しっちょう<\/rt><\/ruby>原因によって<ruby>語音聴取能<rt>ごおんちょうしゅのう<\/rt><\/ruby>に大きな差がある", "opts": ["○ 正しい記述", "× 誤った記述"], "lab": ["○", "×"], "two": true, "ans": [1], "exp": "<div>差はない（原因は不明が半数：スライド）。<\/div><div>（元：問16(1)）<\/div>", "star": false, "memo": "", "chk": false}], "kgroups": [{"id": "k1", "name": "原理・構造・装用後", "sub": "体外部・体内部の働き、装用後の注意", "color": "#1f6f6b"}, {"id": "k2", "name": "マッピング・調整", "sub": "T/Cレベル、初回調整、訴えへの対処", "color": "#9a5a1a"}, {"id": "k3", "name": "適応基準・制度", "sub": "成人・小児・EAS基準、保険適用", "color": "#7a4a8c"}, {"id": "k4", "name": "人工聴覚器", "sub": "人工中耳・骨固定型・ABI・EASの使い分け", "color": "#2f6fa3"}, {"id": "k5", "name": "難聴の原因・症候群", "sub": "遺伝子・症候群・進行性難聴", "color": "#b04a5a"}, {"id": "k6", "name": "聴覚補償・ハビリ", "sub": "環境調整・補聴援助・リング6音・聴覚疲労", "color": "#4a7a3a"}], "kokushi": [{"id": "k01", "g": "k2", "cat": "マッピング", "q": "人工内耳プログラミングについて正しいのはどれか。", "opts": ["ラウドネスは電極の刺激頻度で調整する。", "ピッチの知覚は電極の刺激位置で変化する。", "幼児は成人に比べてTレベルの刺激にすばやく反応する。", "装用閾値が同じであれば、語音明瞭度の個人差は生じない。", "プログラミング後の語音聴取検査の呈示音圧は40dBSPLで実施する。"], "ans": [1], "exp": "<div>【出典】第28回 午前 問99（スライド表記：2026年度 午前 問題99／28-99）<\/div><div>ピッチ（高さ）は電極の刺激位置、ラウドネス（大きさ）は刺激する電荷量（電流×パルス幅）で決まる。<\/div><div>×1：刺激頻度ではなく電荷量で調整する。<\/div><div>×3：資料で×。<\/div><div>×4：装用閾値（検出）が同じでも、語音明瞭度（聞き分け）には個人差がある（失聴期間、可塑性など）。<\/div><div>×5：資料の注記「言葉の聴き取り検査 ☞ HL（ヒアリングレベル：dB）」。SPLではなくHLで表す。<\/div>", "star": true, "off": true, "memo": "", "chk": false}, {"id": "k02", "g": "k3", "cat": "EAS", "q": "<ruby>残存聴力活用型<rt>ざんぞんちょうりょくかつようがた<\/rt><\/ruby>人工内耳の適応基準(2023)と合致しないのはどれか。", "opts": ["適応年齢は18歳以上である。", "125Hzと250Hzの聴力が65dBHL以下である。", "反復性の急性中耳炎の手術適応は慎重に判断する。", "中耳炎などの感染症の活動期の手術は禁忌である。", "補聴器装用による語音明瞭度が65dBSPLで60%以下である。"], "ans": [0], "exp": "<div>【出典】第28回 午後 問99（スライド表記：2026年度 午後 問題99）<\/div><div>EAS（Electric Acoustic Stimulation）の適応年齢は小児人工内耳適応基準に準じる（18歳以上に限らない）。<\/div><div>○2〜5：基準（2023）に合致。<\/div><div>※資料にはEAS基準の旧版（2014）も載っている。2014：125・250・500Hzが65dB以下、2000Hzが80dB以上、4000・8000Hzが85dB以上、語音弁別能は65dB SPLで60%未満、年齢は生後12か月以上。2023：125・250Hzが65dB以下、2000・4000・8000Hzがそれぞれ65・75・85dB以上、60%以下。<\/div>", "star": true, "off": true, "memo": "", "chk": false}, {"id": "k03", "g": "k1", "cat": "原理・適応", "q": "人工内耳について正しいのはどれか。", "opts": ["加齢性難聴は適応とならない。", "失聴期間は語音の聴取成績に影響しない。", "手術後のMRI検査は禁忌である。", "装用閾値は残存聴力に依存する。", "電極アレイは内有毛細胞の機能を代行する。"], "ans": [4], "exp": "<div>【出典】第28回 午後 問100（スライド表記：2026年度 午後 問題100／28-200）<\/div><div>電極アレイは、障害された内有毛細胞の機能を代行して、聴神経（らせん神経節細胞）を電気刺激する。<\/div><div>×1：資料で×（加齢性難聴も適応になりうる）。<\/div><div>×2：失聴期間は影響する（資料：失聴期間10年未満は母音約92.5%・子音約85.7%、30年以上は母音65%・子音30%）。<\/div><div>×3：資料で×（MRIは機種・条件により可能。N22は1998年以降の製品が磁石を取り外してMRI対応、N24はすべてMRI対応）。<\/div><div>×4：装用閾値は約40dBでそろい、残存聴力には依存しない（①②資料の内容より）。<\/div>", "star": true, "off": true, "memo": "※28-200は資料内で選択肢の並びが別。ここは午後問100の並びを採用", "chk": true}, {"id": "k04", "g": "k1", "cat": "原理・適応", "q": "人工内耳について誤っているのはどれか。", "opts": ["電極で聴神経を刺激する。", "入力音声は体外部でコード化される。", "蝸牛奇形に対する手術は禁忌である。", "音のラウドネスは刺激する電荷量で調整する。", "神経反応テレメトリーで聴神経の活動性を確認する。"], "ans": [2], "exp": "<div>【出典】第27回 午後 問99（スライド表記：2025年度 午後 問題99）<\/div><div>蝸牛奇形（制御困難な髄液噴出が見込まれる高度な内耳奇形）は禁忌ではなく、慎重な適応判断が必要なもの。禁忌は中耳炎などの感染症の活動期。<\/div><div>○1・2：基本構造。<\/div><div>○4：ラウドネスは電荷量（電流×パルス幅）で調整する。<\/div><div>○5：神経反応テレメトリー（NRT）は、電極から聴神経を刺激して誘発される複合活動電位を別の電極で記録する。<\/div>", "star": true, "off": true, "memo": "資料では4と5に丸があるが、問いは「誤っているのはどれか」", "chk": true}, {"id": "k05", "g": "k6", "cat": "聴覚補償・環境調整", "q": "9歳の女児。通常の学級に在籍し人工内耳を<ruby>装用<rt>そうよう<\/rt><\/ruby>している。保護者から<ruby>担任教諭<rt>たんにんきょうゆ<\/rt><\/ruby>あてに学校生活中の聞き取りが困難との<ruby>訴え<rt>うったえ<\/rt><\/ruby>があった。環境調整として適切なのはどれか。3つ選んでください。<br>a. 教室の席の位置を配慮する。<br>b. 大声で話すよう児童全員に伝える。<br>c. 保護者にノートテイクをしてもらう。<br>d. <ruby>無線補聴援助<rt>むせんほちょうえんじょ<\/rt><\/ruby>システムを用意する。<br>e. 机や椅子の脚部にテニスボールをつける。", "opts": ["a, b, c", "a, b, e", "a, d, e", "b, c, d", "c, d, e"], "ans": [2], "exp": "<div>【出典】第27回 午後 問100（スライド表記：2026年 27-200）<\/div><div>適切なのは a（席の配慮）、d（無線補聴援助システム）、e（脚部にテニスボールをつけて騒音を減らす）。<\/div><div>無線補聴援助システム（Roger等）：話し手の声をワイヤレスマイクが集音して受信機へ送るので、騒音下や離れた距離でも語音認識が改善する。<\/div><div>※b・cが不適切な理由は資料に記載がない。<\/div>", "star": false, "off": true, "memo": "", "chk": false}, {"id": "k06", "g": "k1", "cat": "装用後の注意", "q": "人工内耳について正しいのはどれか。3つ選んでください。", "opts": ["自動体外式除細動器(AED)の使用は禁忌である", "断線した送信ケーブルの交換は健康保険適応となる", "MRI検査の制限はない", "送信コイルの故障の原因として汗などの湿気が多い", "静電気を生じやすい場ではサウンドプロセッサを外す"], "ans": [1, 3, 4], "exp": "<div>【出典】27-99（スライド表記：2026年 国家試験 27-99）<\/div><div>正しいのは2・4・5（資料の丸印）。<\/div><div>2：送信ケーブルなどのヘッドセットは健康保険適用（ランニングコスト）。<\/div><div>4：汗や湿気は故障の原因。<\/div><div>5：静電気の影響を避ける。<\/div><div>×3：MRIは機種・条件により制限がある。<\/div>", "star": false, "off": false, "memo": "※要確認：公式の正解表は1問1答で、この形式は見当たらない。出典の回・年が不明（先生の表記ミスの可能性）", "chk": true}, {"id": "k07", "g": "k3", "cat": "適応・制度", "q": "人工内耳について誤っているのはどれか。", "opts": ["補聴器と併用できる。", "小児では1歳以上が適応となる。", "日本では成人の一側性難聴も保険適用となる。", "電極の不具合はテレメトリー機能で確認できる。", "電極を交換しなくてもサウンドプロセッサは新しい機種に交換できる。"], "ans": [2], "exp": "<div>【出典】第26回 午前 問95（スライド表記：2024年 国家試験 午前 問題95）<\/div><div>出題当時、日本で人工内耳の保険適用になるのは両側性難聴（一側性難聴は対象外）。<\/div><div>○1：HAの聴取能が母音90%以上なら、CIとHAの両耳装用が成立する。<\/div><div>○2：原則1歳以上（体重8kg以上）。<\/div><div>○4：電極の不具合は、インピーダンス（抵抗値）テレメトリーで確認する。<\/div><div>○5：次の世代で古い機種の部品は製造されなくなり修理不能。健康保険適用で最新機種と交換できる。<\/div><div>※追記：一側性高度難聴に対する人工内耳は、2026年3月に保険収載されたと報告されている（一次ソース未確認）。出題当時の正答は3のまま。<\/div>", "star": true, "off": true, "memo": "※追記部分は一次ソース未確認", "chk": true}, {"id": "k08", "g": "k4", "cat": "人工聴覚器", "q": "人工聴覚器について適切でない組合せはどれか。<br>a. <ruby>人工中耳<rt>じんこうちゅうじ<\/rt><\/ruby> ―― 振動子は両側<ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>を刺激する。<br>b. 人工内耳 ―― 電極の刺激位置でピッチ感覚が変わる。<br>c. <ruby>骨固定型<rt>こつこていがた<\/rt><\/ruby><ruby>補聴器<rt>ほちょうき<\/rt><\/ruby> ―― <ruby>外耳道閉鎖症<rt>がいじどうへいさしょう<\/rt><\/ruby>が適応となる。<br>d. <ruby>聴性<rt>ちょうせい<\/rt><\/ruby>脳幹インプラント ―― 皿電極を使用する。<br>e. <ruby>残存聴力活用型<rt>ざんぞんちょうりょくかつようがた<\/rt><\/ruby>インプラント ―― <ruby>谷型<rt>たにがた<\/rt><\/ruby>聴力が適応となる。", "opts": ["a, b", "a, e", "b, c", "c, d", "d, e"], "ans": [1], "exp": "<div>【出典】第26回 午後 問95（スライド表記：2024年 国家試験 午後 問題95）<\/div><div>適切でないのは a と e。<\/div><div>×a：人工中耳の振動子は両側の蝸牛を刺激しない。<\/div><div>×e：EASの適応は谷型ではなく高音障害型。<\/div><div>○b：電極の刺激位置でピッチ感覚が変わる。<\/div><div>○c：骨固定型補聴器は外耳道閉鎖症が適応。<\/div><div>○d：聴性脳幹インプラント（ABI）は蝸牛神経核を刺激する皿電極（plate electrode）を使う。<\/div>", "star": false, "off": true, "memo": "", "chk": false}, {"id": "k09", "g": "k3", "cat": "成人の適応", "q": "成人人工内耳適応基準(2017)では、<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby><ruby>装用<rt>そうよう<\/rt><\/ruby>下の最高<ruby>語音明瞭度<rt>ごおんめいりょうど<\/rt><\/ruby>が(A:左列)以下であり、かつ平均聴力レベルが(B:右列)以上である場合には手術適応となる。(A)(B)の組み合わせで正しいのはどれか。", "opts": ["30%－55dB", "50%－70dB", "70%－85dB", "60%－80dB", "40%－60dB"], "ans": [1], "exp": "<div>【出典】第25回 午後 問99（スライド表記：25-199）<\/div><div>成人基準（2017）：①裸耳の平均聴力レベル（500・1000・2000Hz）90dB以上の重度感音難聴、または②平均聴力レベル70dB以上90dB未満で、適切な補聴器装用下の最高語音明瞭度50%以下の高度感音難聴。<\/div><div>資料の注記：②の追加は補聴器の限界（補装具としての評価＝会話聴取が良好か）を反映。<\/div><div>※2026年版では、補聴器装用下の65dB SPLでの語音明瞭度50%以下に変わっている（日本耳科学会）。<\/div>", "star": true, "off": false, "memo": "※未照合（公式の正解表を取得できず）。2026年版との違いに注意", "chk": true}, {"id": "k10", "g": "k4", "cat": "人工聴覚器", "q": "<ruby>水平型<rt>すいへいがた<\/rt><\/ruby><ruby>混合性難聴<rt>こんごうせいなんちょう<\/rt><\/ruby>に適応となる人工聴覚器はどれか。<br>a. 人工内耳<br>b. <ruby>人工中耳<rt>じんこうちゅうじ<\/rt><\/ruby><br>c. <ruby>骨固定型<rt>こつこていがた<\/rt><\/ruby><ruby>補聴器<rt>ほちょうき<\/rt><\/ruby><br>d. <ruby>聴性<rt>ちょうせい<\/rt><\/ruby>脳幹インプラント<br>e. <ruby>残存聴力活用型<rt>ざんぞんちょうりょくかつようがた<\/rt><\/ruby>人工内耳", "opts": ["a, b", "a, e", "b, c", "c, d", "d, e"], "ans": [2], "exp": "<div>【出典】第25回 午前 問100（スライド表記：2023年度 午前 問題100）<\/div><div>混合性難聴（伝音成分を含む）には、人工中耳と骨固定型補聴器が適応。<\/div><div>×人工内耳：高度〜重度の感音難聴。×ABI：聴神経が使えない場合。×EAS：高音障害型。<\/div>", "star": false, "off": false, "memo": "※未照合（公式の正解表を取得できず）。除外した選択肢の理由は補足整理", "chk": true}, {"id": "k11", "g": "k5", "cat": "難聴の原因・症候群", "q": "1歳時に人工内耳<ruby>植込術<rt>うえこみじゅつ<\/rt><\/ruby>を受けた女児。4歳時に他障害の存在が判明した。可能性のある疾患はどれか。<br>a. ワーデンブルグ症候群<br>b. 脳性麻痺<br>c. チャージ症候群<br>d. アッシャー症候群<br>e. 自閉症スペクトラム障害", "opts": ["a, b", "a, e", "b, c", "c, d", "d, e"], "ans": [4], "exp": "<div>【出典】第25回 午後 問93（スライド表記：2023年 第25回 午後 問題93）<\/div><div>資料の丸印は5（d, e）。<\/div><div>d アッシャー症候群：先天性の難聴に網膜色素変性症が遅れて加わる（タイプ1は視覚症状が10歳前後から、タイプ2は思春期以降が多い）。<\/div><div>e 自閉スペクトラム症：聴覚障害児のASD診断は年齢とともに増加（3〜5歳で2.0%、6〜11歳で2.7%、12〜17歳で4.2%）。<\/div><div>a ワーデンブルグ症候群：虹彩（目）の色素異常、前頭部白髪などが特徴。<\/div><div>c チャージ症候群：耳介の変形や聴覚障害、眼の異常（視覚聴覚二重障害）があり、頭頸部をはじめ全身に多岐にわたる障害がある。<\/div>", "star": false, "off": false, "memo": "※要確認：資料のメモ（アッシャー→「術前の画像検査で判る」、脳性麻痺→「重度内耳奇形(Common cavity)との鑑別」）の意味が不明。正答は資料の丸印。未照合", "chk": true}, {"id": "k12", "g": "k5", "cat": "難聴の原因・症候群", "q": "幼児期の<ruby>進行性<rt>しんこうせい<\/rt><\/ruby>難聴の原因はどれか。2つ選んでください。", "opts": ["先天性風疹症候群", "GJB2遺伝子変異", "先天性サイトメガロウイルス感染", "SLC26A4遺伝子変異", "ムンプス感染"], "ans": [2, 3], "exp": "<div>【出典】第25回 問89（スライド表記：2023年 第25回 問題89）<\/div><div>先天性サイトメガロウイルス（CMV）感染：無症候性の感染児の約6〜16%に、成長とともに進行性（遅発性）の難聴がみられる。<\/div><div>SLC26A4遺伝子変異：前庭水管拡大症の原因で、進行性の難聴がみられる。<\/div><div>※他の選択肢の理由は資料に記載なし。<\/div>", "star": false, "off": false, "memo": "※未照合（公式の正解表を取得できず）", "chk": true}, {"id": "k13", "g": "k2", "cat": "マッピング", "q": "人工内耳の設定でCレベル(MCL)を上げた場合に予測されるのはどれか。", "opts": ["顔面神経刺激症状が消える", "プロソディの聴取が悪化する", "ラウドネスが大きくなる", "バッテリーの持続時間が長くなる", "音の大小が分かりにくくなる"], "ans": [2], "exp": "<div>【出典】第24回 午後 問100（スライド表記：2022年 第24回 問題200）<\/div><div>Cレベルを上げると、音の大きさ（ラウドネス）が大きくなる。<\/div><div>×4：電力を多く消費するので、バッテリーの持続時間は短くなる。<\/div><div>×1：漏れ電流が顔面神経を刺激しやすくなる（消えない）。<\/div><div>×2・5：ダイナミックレンジ（TレベルとCレベルの幅）が広がるので、入力音の変化が分かりやすくなり、音の大小や抑揚（プロソディ）は分かりやすくなる。<\/div>", "star": true, "off": false, "memo": "※公式正答は4番で、資料と選択肢の並びが違う。資料の並びと丸印に従った", "chk": true}, {"id": "k14", "g": "k6", "cat": "聴覚ハビリテーション", "q": "リング6音に含まれるのはどれか。", "opts": ["b", "m", "p", "t", "k"], "ans": [1], "exp": "<div>【出典】第24回 午後 問92（スライド表記：24-192）<\/div><div>リングの6サウンド：ウー・イー・アーの3母音と、sh・m・sの3子音。ことばの音領域の聴こえ具合を、日常生活の中でも確認できるテスト。カナダのダニエル・リング（Daniel Ling）教授が開発。<\/div>", "star": true, "off": false, "memo": "※公式正答は3番で、資料と選択肢の並びが違う。資料の並びと丸印に従った", "chk": true}, {"id": "k15", "g": "k3", "cat": "EAS・適応", "q": "オージオグラムを示す。推定される臨床像として適切なのはどれか。<br>（図は省略。右耳：500Hz 50dB・1000Hz 110dB・2000Hz 115dB、左耳：500Hz 45dB・1000Hz 85dB・2000Hz 115dB。低音域は30dB前後に保たれ、高音域で急に低下する）", "opts": ["EAS(残存聴力活用型人工内耳)の適応となる。", "身体障害者程度等級の2級に該当する。", "子音の聞き取りは障害されない。", "ドアの開閉音を聞き取れない。", "耳小骨固着の存在を推定する。"], "ans": [0], "exp": "<div>【出典】第23回 午前 問96（スライド表記：2021年 午前 問題96）<\/div><div>低音域が保たれ、高音域が急に低下する高音障害型 → EASの適応。<\/div><div>×2：4分法＝（500Hz＋1000Hz×2＋2000Hz）÷4。右（50+220+115）÷4＝96.3dB、左（45+170+115）÷4＝82.5dB。両耳100dB以上ではないので2級ではない。<\/div><div>×3：高音の子音は聞き取りにくい。<\/div><div>※4・5の理由は資料に記載なし。<\/div>", "star": true, "off": false, "memo": "※図を文章にしてある（数値はスライドの4分法の式から。低音域の数値は図の読み取り）。公式正答1と一致", "chk": true}, {"id": "k16", "g": "k1", "cat": "原理", "q": "人工内耳体外部の*部位（<ruby>送信<rt>そうしん<\/rt><\/ruby>コイル）の機能はどれか。（元の問題では図で*部位を示す）", "opts": ["外部の音を拾う", "音を処理して電気信号に置き換える", "体内部(インプラント)と交信する", "プロセッサに電力を供給する", "2.4GHzデジタル無線通信を行う"], "ans": [2], "exp": "<div>【出典】第23回 午前 問99（スライド表記：2021年「23回」午前 問題99）<\/div><div>送信コイルは、体内部（インプラント）の受信コイルと交信する（搬送波を電磁誘導で送る）。<\/div><div>1＝マイク、2＝スピーチプロセッサ、4＝電池（ボックス）。<\/div><div>×5：コード信号は、N22で2.5MHz、N24で5MHzの搬送波に乗せて送る。2.4GHzはWi-FiやBluetoothなどの周波数帯。<\/div>", "star": false, "off": false, "memo": "※図の代わりに「送信コイル」と明記した。公式正答3と一致", "chk": true}, {"id": "k17", "g": "k2", "cat": "マッピング", "q": "人工内耳調整後に、「<ruby>流水音<rt>りゅうすいおん<\/rt><\/ruby>が頭に響きうるさい」との<ruby>訴え<rt>うったえ<\/rt><\/ruby>があった。対処法はどれか。", "opts": ["全電極のTレベルを下げる。", "プロセッサの感度を上げる。", "蝸牛頂付近電極のTレベルを下げる。", "蝸牛底付近電極のCレベルを下げる。", "刺激レートを上げる。"], "ans": [3], "exp": "<div>【出典】第23回 午前 問100（スライド表記：2021年「23回」午前 問題100）<\/div><div>流水音は高周波（約4kHz以上）の音。高周波は蝸牛底（基底回転）側の電極が担当するので、その電極のCレベル（大きいけれど、うるさくない大きさ）を下げる。<\/div><div>×1・3：Tレベルは聞こえ始めの電流量。<\/div><div>×2：感度を上げるとさらに大きく聞こえる。<\/div>", "star": true, "off": true, "memo": "※1・2・3・5の理由は補足整理", "chk": true}, {"id": "k18", "g": "k5", "cat": "難聴の原因・症候群", "q": "誤っているのはどれか。", "opts": ["SLC26A4遺伝子変異 → 前庭水管拡大症", "糸球体腎炎 → Alport症候群", "網膜色素変性症 → ワーデンブルグ症候群", "GJB2遺伝子変異 → 非症候性難聴", "OTOF遺伝子変異 → auditory neuropathy spectrum disorder"], "ans": [2], "exp": "<div>【出典】第23回 問96（スライド表記：2021年 国家試験 問題96）<\/div><div>網膜色素変性症を併発するのはアッシャー（Usher）症候群（常染色体劣性）。ワーデンブルグ症候群Ⅰ型は常染色体優性で、虹彩の色素異常が特徴。<\/div><div>○5：OTOF変異はオトフェリンというタンパク質が作れず、内有毛細胞と聴神経の間の聴覚信号の伝達に障害を起こす。<\/div>", "star": true, "off": true, "memo": "", "chk": false}, {"id": "k19", "g": "k2", "cat": "マッピング（小児）", "q": "幼児の人工内耳初回調整に際して誤っているのはどれか。", "opts": ["神経反応テレメトリーを参考にして設定する", "聴性行動反応を確認しながら実施する", "予想される行動を予め保護者に伝える", "すべての電極を時間をかけて設定する", "術後創部の腫脹に合わせて磁石の強度を変える"], "ans": [3], "exp": "<div>【出典】第23回 午後 問98（スライド表記：2021年「23回」問題198）<\/div><div>初回調整は、使える電極から少しずつ設定する（初回は一部の電極と狭いダイナミックレンジ）。<\/div><div>資料の例（音入れ時2歳9か月）：音入れ時は電極5本・DR3〜5 → 2週間後10本 → 1か月後18本 → 3か月後22本（ほぼ完成）→ 1年後に安定。<\/div><div>○1・2：NRTと聴性行動観察を参考にする。<\/div><div>○5：磁石は、頭部の成長や創部の腫脹に合わせて強度を調整する（強すぎると皮膚が壊死する）。<\/div>", "star": true, "off": false, "memo": "※公式正答は1番で、資料と選択肢の並びが違う。資料の並びと丸印に従った。選択肢3の資料表記は「骨導」だがメモに従い「行動」に修正（確認済み）", "chk": true}, {"id": "k20", "g": "k5", "cat": "難聴の原因・症候群", "q": "新生児聴覚スクリーニングをパスしていた児が4歳児に難聴と診断された。考えられるのはどれか。", "opts": ["GJB2変異", "前庭水管拡大症", "耳硬化症", "トリーチャー・コリンズ症候群", "先天性風疹症候群"], "ans": [1], "exp": "<div>【出典】第23回 午後 問92（スライド表記：23-192）<\/div><div>新生児聴覚スクリーニングをパスしても、後から進行する難聴 → 前庭水管拡大症（SLC26A4遺伝子変異）。<\/div><div>※他の選択肢の理由は資料に記載なし。<\/div>", "star": true, "off": false, "memo": "※公式正答は3番で、資料と選択肢の並びが違う。資料の並びと丸印に従った", "chk": true}, {"id": "k21", "g": "k3", "cat": "成人の適応", "q": "成人の人工内耳で正しいのはどれか", "opts": ["送信コイルは受信機にケーブルで接続する", "電極で蝸牛有毛細胞を刺激する", "EAS(残存聴力活用型人工内耳)は音刺激で高音域の音情報を入力する", "平均聴力が70dBでも適応になる場合がある", "プログラミングでハウリングを防止する"], "ans": [3], "exp": "<div>【出典】第22回 問199（スライド表記：2020年「22回」問題199）<\/div><div>平均聴力レベルが70dB以上90dB未満でも、補聴器装用下の最高語音明瞭度が50%以下なら適応になる。<\/div><div>×3：EASで音刺激（補聴器）が担当するのは低音域。<\/div><div>×1：送信コイルは皮膚越しに磁石で体内の受信コイルとつながる。<\/div><div>×2：刺激部位はらせん神経節細胞。<\/div><div>※5の理由は資料に記載なし。<\/div>", "star": true, "off": false, "memo": "※未照合（公式の正解表を取得できず）", "chk": true}, {"id": "k22", "g": "k6", "cat": "聴覚補償・環境調整", "q": "聴覚補償・<ruby>情報保障<rt>じょうほうほしょう<\/rt><\/ruby>支援について誤っている組み合わせはどれか。", "opts": ["FM補聴システム ―― 近接する周波数帯域を使用する機器が近くにあると混信の可能性がある", "赤外線補聴システム ―― 柱や家具の背後でも使用できる", "要約筆記 ―― 要約筆記者を養成するためのカリキュラムが定められている", "磁気誘導ループシステム ―― 既存の建物でも敷設できる", "字幕表示システム ―― 無線LAN環境が不要なシステムがある"], "ans": [1], "exp": "<div>【出典】第22回 問200（スライド表記：2020年「22回」問題200）<\/div><div>赤外線補聴システムは直進性の光（近赤外線、搬送波2.3MHz、FM変調）を使う。柱などの陰にデッドポイントができるので、背後では使えない。屋外や強い直射光の下でも使えない。<\/div><div>○1：FM補聴システム（169MHz帯）は、近接した周波数のチャンネルを同時に使うと混信・干渉が起こる。<\/div><div>○3：厚生労働省の要約筆記者養成カリキュラムがある。<\/div><div>○4：ループアンテナ内に誘導磁界をつくる。<\/div><div>○5：無線LANが不要な字幕表示システムもある。<\/div>", "star": true, "off": false, "memo": "※未照合（公式の正解表を取得できず）", "chk": true}, {"id": "k23", "g": "k6", "cat": "聴覚補償・環境調整", "q": "無線補聴支援システムを使用する目的として正しいのはどれか。2つ選びなさい。", "opts": ["分割帯域を細かく調整する", "方向感を改善する", "SN比を改善する", "音響利得を大きくする", "反響音を低減する"], "ans": [2, 4], "exp": "<div>【出典】第22回 問99（スライド表記：2020年「22回」問題99）<\/div><div>無線補聴支援システム：話し手の声をワイヤレスマイクが集音し、受信機へ送る。話し手と聞き手の距離が離れても、周囲の騒音や反響音の影響を受けにくくなる。<\/div><div>→ SN比の改善と、反響音の低減が目的。<\/div>", "star": false, "off": false, "memo": "※未照合（公式の正解表を取得できず）", "chk": true}, {"id": "k24", "g": "k3", "cat": "小児の適応", "q": "小児人工内耳手術の適応ガイドライン(2014)の医学的条件について誤っているのはどれか。2つ選びなさい。", "opts": ["手術前の遺伝子検査は必須", "補聴器装用下での最高語音明瞭度は50%以下", "裸耳の聴力検査で平均聴力レベルは90dB以上", "中耳炎など感染症の活動期の手術は禁忌", "適応年齢は1歳以上(体重8kg以上)"], "ans": [0, 1], "exp": "<div>【出典】第22回 問98（スライド表記：2020年「22回」問題98）<\/div><div>2014年版：6か月以上の最適な補聴器装用下の最高語音明瞭度は「50%未満」（2022年版は「50%以下」）。選択肢2は誤り。<\/div><div>×1：手術前の遺伝子検査は必須ではない。<\/div><div>○3：裸耳の平均聴力レベル90dB以上。○4：禁忌は中耳炎などの感染症の活動期。○5：原則1歳以上（体重8kg以上）。<\/div>", "star": true, "off": false, "memo": "※未照合（公式の正解表を取得できず）。2014年版の問題。現行は2022年版で、年齢は「体重8kg以上または1歳以上」、語音は「50%以下」", "chk": true}, {"id": "k25", "g": "k6", "cat": "騒音", "q": "<ruby>聴覚疲労<rt>ちょうかくひろう<\/rt><\/ruby>について誤っているのはどれか", "opts": ["電車内等騒音下のヘッドフォン聴取で生じやすい", "瞬間的な騒音暴露によって生じる", "音響の大きいコンサートの後などに環境音の聞こえ方が変化する", "繰り返すことによって恒常的な閾値上昇につながる", "一過性の閾値の上昇が観察される"], "ans": [1], "exp": "<div>【出典】第22回 午後 問41（スライド表記：22-141）<\/div><div>瞬間的な騒音暴露で生じるのは「音響外傷」で、聴覚疲労ではない（資料の注記）。<\/div><div>聴覚疲労は、騒音にさらされた後の一過性の閾値上昇が観察される。<\/div>", "star": false, "off": false, "memo": "※未照合（公式の正解表を取得できず）。回・問番号はスライド表記からの推定", "chk": true}, {"id": "k26", "g": "k6", "cat": "聴覚補償・環境調整", "q": "11歳の人工内耳<ruby>装用<rt>そうよう<\/rt><\/ruby>児。一対一の会話では不自由がないものの、教室では騒音のために聞き取りが難しいと<ruby>訴え<rt>うったえ<\/rt><\/ruby>ている。対応として適切でないのはどれか。", "opts": ["ノートテイクを利用する", "机や椅子の脚にカバーをする", "プログラムを調整してC値(MCL)を上げる", "デジタル無線通信システムを用いる", "両耳の人工内耳を検討する"], "ans": [2], "exp": "<div>【出典】第21回 問99（スライド表記：2019年「21回」問題99）<\/div><div>C値（MCL）を上げると、入力音声だけでなく騒音も大きく入力され、苦痛を生じる。<\/div><div>○4：補聴援助システム（2.4GHz帯のデジタル無線方式）。<\/div><div>○5：人工内耳の両側装用は、騒音下の語音聴取成績が約9倍向上する可能性がある（Laszigら、2004、N=23）。<\/div><div>○2：脚にカバー（テニスボールなど）で騒音を減らす。<\/div><div>○1：ノートテイクは聴覚補償の手段。<\/div>", "star": true, "off": false, "memo": "※未照合（公式の正解表を取得できず）", "chk": true}], "groups": [{"id": "g1", "name": "システム・電極", "sub": "システム構成・電極の挿入部位と周波数配置", "color": "#1f6f6b"}, {"id": "g2", "name": "術前検査・手術", "sub": "術前検査・手術手技・副作用と神経", "color": "#2f6fa3"}, {"id": "g3", "name": "マッピング", "sub": "T/Cレベル・ダイナミックレンジ・ECAP", "color": "#9a5a1a"}, {"id": "g4", "name": "成人の適応基準", "sub": "成人基準（2017／2026）・慎重な適応判断", "color": "#7a4a8c"}, {"id": "g5", "name": "小児の適応基準", "sub": "小児基準（2022）・適応判定・例外・禁忌", "color": "#b04a5a"}, {"id": "g6", "name": "リハビリ・装用後", "sub": "聴取能の影響因子・ハビリテーション・装用後・STの役割", "color": "#4a7a3a"}], "questions": [{"id": "q01", "g": "g1", "cat": "システム構成", "q": "人工内耳システムについて、正しいのはどれか。", "opts": ["有毛細胞が電気刺激される", "蝸牛神経核が電気刺激される", "受信コイルと電極は体外器に含まれる", "信号は送信コイルから受信コイルへ送られる", "マイクは体内器に含まれる"], "ans": [3], "exp": "<div><b>【正解】④<\/b><\/div><div>搬送波(電磁誘導)で、体外の送信コイルから体内の受信コイルへ皮膚越しに送られる(電力も同時に送る)。<\/div><div>×1：刺激の標的はらせん神経節細胞(聴神経の一次ニューロン)。有毛細胞はバイパスする。<\/div><div>×2：蝸牛神経核は聴性脳幹インプラント(ABI: Auditory Brainstem Implant)の刺激部位。<\/div><div>×3：受信コイルと電極は体内器(インプラント)。体外器はマイク・スピーチプロセッサ・送信コイル。<\/div><div>×5：マイクは体外器(スピーチプロセッサ側)にある。<\/div><div>【出典】過去問 問題1<\/div>", "star": true, "memo": "※過去問の選択肢(3)「フォルマント情報を電極に割り振る」は旧方式(F0/F1/F2方式)の説明。現行機種は周波数帯域分割方式が主流のため本問では不採用(補足)。(4)皮弁の厚さは、過去問・先生資料では「影響する(必要な電力が増える)」。", "chk": true}, {"id": "q02", "g": "g1", "cat": "電極", "q": "電極について、正しいのはどれか。", "opts": ["電極は基本的に前庭階へ挿入される", "単チャンネルの電極が多く使用される", "頂部に到達する深さまで挿入される", "蝸牛への再挿入は不可能である", "基底回転に近い電極は高音を担当する"], "ans": [4], "exp": "<div><b>【正解】⑤<\/b><\/div><div>蝸牛入口(基底回転)が高周波数、蝸牛頂が低周波数を担当する(トノトピー)。<\/div><div>×1：挿入先は鼓室階。神経(らせん神経節)に近いため。<\/div><div>×2：現在は多チャンネルが標準。1か所しか刺激できないと音の高さの情報が伝わらない。<\/div><div>×3：蝸牛頂部には到達しない深さまで挿入される(約1.5回転程度が目安。機種・術式で異なる)。<\/div><div>×4：再挿入は可能(再手術・機種変更でほぼ同等以上の聴取能になる場合もある)。<\/div><div>【出典】過去問 問題2<\/div>", "star": true, "memo": "※「一回転半くらい」はさやの授業メモ。蝸牛は約2.5回転で、挿入深さは電極の長さや術式で異なる。", "chk": true}, {"id": "q03", "g": "g1", "cat": "電極", "q": "<ruby>蝸牛<rt>かぎゅう<\/rt><\/ruby>に挿入される電極アレイの留置部位として、正しいのはどれか。", "opts": ["前庭階内", "中央階（蝸牛管）内", "蝸牛軸（骨ラセン板）内", "鼓室階内", "正円窓の外側（中耳腔）"], "ans": [3], "exp": "<div><b>【正解】④<\/b><\/div><div>鼓室階は骨ラセン板を介してらせん神経節に近く、電極が通る部屋。正円窓付近から入る。<\/div><div>×1：前庭階は鼓室階より神経から遠い。標準の挿入先ではない。<\/div><div>×2：中央階はコルチ器と内リンパを含む繊細な部屋。ここを傷つけないよう避ける。<\/div><div>×3：らせん神経節は蝸牛軸内にあるが、電極はその内部には入らず鼓室階の中を走る。<\/div><div>×5：正円窓は挿入経路(入口)であり、留置部位ではない。<\/div><div>【出典】プレテスト問3の復習<\/div>", "star": true, "memo": "", "chk": false}, {"id": "q04", "g": "g2", "cat": "術前検査", "q": "人工内耳の術前に行う検査として、間違っているのはどれか。", "opts": ["自記オージオメトリー", "純音聴力検査", "語音聴力検査", "聴性脳幹反応検査", "側頭骨CT検査"], "ans": [0], "exp": "<div><b>【正解】①（誤文）<\/b><\/div><div>自記オージオメトリー(Békésy audiometry)は補充現象や病巣の鑑別に使う検査で、人工内耳の術前評価の標準ではない。<\/div><div>○2：適応基準の聴力判定に必須。<\/div><div>○3：適応基準で「語音明瞭度」が重要。補聴器装用下でも測定する。<\/div><div>○4：閾値の推定と聴神経の評価ができる(ABR: Auditory Brainstem Response)。<\/div><div>○5：電極挿入スペース、中耳炎、内耳奇形の確認に必要。<\/div><div>【出典】過去問 問題3<\/div>", "star": true, "memo": "※過去問の正答では、自記オージオメトリー・アブミ骨筋反射検査・ティンパノメトリーが「間違い」扱い。ただし臨床では中耳の状態評価でティンパノメトリー等を実施する施設もあるため、本問では自記オージオメトリーのみを誤りとして出題(過去問と選択肢構成が異なる)。", "chk": true}, {"id": "q05", "g": "g2", "cat": "手術", "q": "人工内耳の手術について、正しいのはどれか。", "opts": ["耳介の前方を5cm程度切開する", "顔面神経と動眼神経に注意が必要である", "術前の画像検査は原則として不要である", "無理に挿入しても電極は屈曲しない", "乳突削開にはダイヤモンドバーを用いる"], "ans": [4], "exp": "<div><b>【正解】⑤<\/b><\/div><div>乳突削開術(にゅうとつさっかいじゅつ)でダイヤモンドバーを用いる。<\/div><div>×1：切開は耳介の後方。前方だと頬骨側にインプラントを埋め込むことになる。<\/div><div>×2：注意するのは顔面神経と鼓索神経。動眼神経は眼球運動を担う別の部位の神経。<\/div><div>×3：CT・MRIは必須。電極挿入スペース、中耳炎、蝸牛神経、内耳奇形を確認する。<\/div><div>×4：無理に挿入すると屈曲やショートする(繊細な構造)。<\/div><div>【出典】過去問 問題4<\/div>", "star": true, "memo": "※「ショート」は先生の過去問解説(さやメモ)の表現。電極の屈曲・折れ込みが損傷の原因になる。", "chk": true}, {"id": "q06", "g": "g2", "cat": "手術の副作用", "q": "人工内耳の手術の副作用として、誤っているのはどれか。", "opts": ["味覚低下", "複視", "めまい", "顔面神経麻痺", "耳鳴"], "ans": [1], "exp": "<div><b>【正解】②（誤文）<\/b><\/div><div>複視は動眼神経など眼球運動を担う神経の障害で、耳の手術野の近くを通る神経ではない。<\/div><div>○1：鼓索神経が近くを走るため。<\/div><div>○3：前庭神経・前庭に近いため。<\/div><div>○4：顔面神経が近くを走るため。<\/div><div>○5：術後に出現・増悪することがある。<\/div><div>【出典】過去問 問題5<\/div>", "star": true, "memo": "※耳鳴は過去問の選択肢外で、私が追加した。一般に術後に報告される症状。過去問で誤りとされた「知覚過敏」は本問では不採用。", "chk": true}, {"id": "q07", "g": "g3", "cat": "マッピング", "q": "マッピングについて、間違っているのはどれか。", "opts": ["刺激頻度を増やすと聴こえは劣化する", "周波数割り振りを変えると聴こえは変化する", "Cレベルは不快閾を超えない範囲で設定する", "Tレベルは音が聞こえ始める電流量である", "ECAP閾値はTとCの間に位置することが多い"], "ans": [0], "exp": "<div><b>【正解】①（誤文）<\/b><\/div><div>一律に劣化するわけではない。刺激数が多いほど聞き取りが明瞭になる人もいる。<\/div><div>○2：刺激される場所が変われば聴こえは変わる。<\/div><div>○3：UCL(Uncomfortable Loudness Level)を超えない程度でCレベルを設定する。<\/div><div>○4：T(Threshold)レベルは聞こえ始めの電流量。<\/div><div>○5：ECAP閾値は概ねTレベルとCレベルの中間くらいに来る。<\/div><div>【出典】過去問 問題6<\/div>", "star": true, "memo": "※過去問の選択肢(3)「バイポーラ刺激はモノポーラ刺激より高いレートで刺激可能」は、過去問解説では誤(モノポーラの方が低エネルギーで高レート刺激が可能)。本問では不採用。", "chk": true}, {"id": "q08", "g": "g3", "cat": "マッピング", "q": "マッピングについて、正しいのはどれか。", "opts": ["ダイナミックレンジが広いと聴こえにくい", "ECAP閾値はTレベルより低い", "Cレベルは不快閾を超える値に設定する", "Cレベルは音入れ後に増加する傾向にある", "Cレベルを上げすぎると嗅覚障害をきたす"], "ans": [3], "exp": "<div><b>【正解】④<\/b><\/div><div>装用に慣れる(脳の可塑性)と、快適に感じる電流量が増えていく傾向がある。<\/div><div>×1：逆。T-Cレベルの幅(ダイナミックレンジ)が狭いと音の情報が少なく聴こえにくい。<\/div><div>×2：ECAP閾値はTレベルより高く、概ねTとCの中間くらい。<\/div><div>×3：UCLを超えないように設定する。<\/div><div>×5：誤り。嗅覚は関係しない。<\/div><div>【出典】過去問 問題7<\/div>", "star": true, "memo": "※過去問の元の選択肢(2)は、さやの資料では「嗅覚障害」で誤、配布された小テストでは「味覚障害」で正解だったとのメモ。臨床的には高い刺激で顔面神経刺激症状が出ることがある。本問は「嗅覚障害」を誤りとして採用。", "chk": true}, {"id": "q09", "g": "g4", "cat": "成人の適応(2017年版)", "q": "成人人工内耳の適応条件(2017年版)について、間違っているのはどれか。", "opts": ["裸耳の平均聴力レベルが90dB以上である", "中途失聴者は適応の対象になる", "両耳聴の実現のため両耳装用も検討される", "手術適応の決定前に本人と家族の意向を確認する", "70〜90dB未満で装用下の語音明瞭度が60%以下"], "ans": [4], "exp": "<div><b>【正解】⑤（誤文）<\/b><\/div><div>正しくは「平均聴力レベル70dB以上90dB未満で、適切な補聴器装用下の最高語音明瞭度が50%以下」。<\/div><div>○1：裸耳の平均聴力レベル(500・1000・2000Hz)が90dB以上の重度感音難聴。<\/div><div>○2：言語記憶があるのは大きい。<\/div><div>○3：両耳聴の実現に有用な場合は両耳装用を否定しない。<\/div><div>○4：「本人の意思および家族の意向を確認して手術適応を決定する」と明記されている。<\/div><div>【出典】過去問 問題8<\/div>", "star": false, "memo": "※授業資料は2017年版(最高語音明瞭度50%以下)。2026年版では「補聴器装用下の65dB SPLでの語音明瞭度50%以下」に変更されている(日本耳科学会)。過去問は「80%以下」だったが、本問は数値±20%ルールに合わせて60%に変更。", "chk": true}, {"id": "q10", "g": "g4", "cat": "慎重な適応判断", "q": "人工内耳の適応で、<ruby>慎重<rt>しんちょう<\/rt><\/ruby>な適応判断が必要なものとして正しいのはどれか。", "opts": ["高度の伝音難聴", "言語習得後の失聴", "画像診断で蝸牛への挿入部位が確認できない場合", "裸耳の平均聴力レベル90dB以上の重度感音難聴", "高齢であること"], "ans": [2], "exp": "<div><b>【正解】③<\/b><\/div><div>成人基準2-A、小児基準6-Aに明記。電極を入れられるかが前提。<\/div><div>×1：適応基準に伝音難聴への言及はない。<\/div><div>×2：慎重判断が必要なのは言語習得前・中の失聴。習得後は言語記憶があり価値が高い。<\/div><div>×4：適応条件そのもの(慎重判断の対象ではない)。<\/div><div>×5：適応基準に年齢上限の記載はない。<\/div><div>【出典】過去問 問題9<\/div>", "star": true, "memo": "※過去問の(4)重複障害・中枢性聴覚障害、(5)反復性急性中耳炎は小児基準6-B・6-D。成人基準では「後迷路性病変や中枢性聴覚障害の合併」「中耳の活動性炎症」。", "chk": true}, {"id": "q11", "g": "g5", "cat": "小児の適応判定", "q": "小児人工内耳の適応判定に必須でないのはどれか。", "opts": ["味覚検査", "補聴器装用効果の判定", "聴性脳幹反応検査", "聴性行動反応検査", "側頭骨CT検査"], "ans": [0], "exp": "<div><b>【正解】①（誤文）<\/b><\/div><div>適応判定には不要。<\/div><div>○2：6カ月以上の最適な補聴器装用後の効果を判定する。<\/div><div>○3：閾値の測定ができ、聴神経も評価できる。<\/div><div>○4：2022年基準でも行動反応検査が聴力判定に使われる。<\/div><div>○5：蝸牛に挿入できる部位の確認に必要。<\/div><div>【出典】過去問 問題10<\/div>", "star": true, "memo": "※過去問は「(1)発達および言語能力検査」を必要扱いだが、2022年基準に検査実施の明記はない(根拠は医療機関の必要事項Cの「他疾患に関する知識」。さやの指摘)。前庭機能検査も過去問では不要扱いだが施設により実施されるため、いずれも本問では不採用。", "chk": true}, {"id": "q12", "g": "g5", "cat": "小児の適応条件(2022年版)", "q": "小児人工内耳の適応条件(2022年版)として、正しいのはどれか。", "opts": ["視覚を主体に療育を行う機関との連携", "短期的な家族の協力が見込まれること", "医療機関単独で完結する支援体制", "当事者を除く医師と療育担当者の意見一致", "聴覚を主体に療育を行う機関との連携"], "ans": [4], "exp": "<div><b>【正解】⑤<\/b><\/div><div>療育機関に関する必要事項「聴覚を主体として療育を行う機関との連携が確保されていること」。<\/div><div>×1：視覚ではなく聴覚が主体。<\/div><div>×2：幼児期からの装用には長期にわたる支援が必要で、継続的な家族の協力が見込まれること。<\/div><div>×3：家族および医療施設内外の専門職種との一貫した協力体制が前提条件。<\/div><div>×4：当事者(家族および本人)、医師、療育担当者の意見の一致が必要。<\/div><div>【出典】過去問 問題11<\/div>", "star": true, "memo": "", "chk": false}, {"id": "q13", "g": "g5", "cat": "小児の適応条件(2022年版)", "q": "小児人工内耳の適応条件(2022年版)について、間違っているのはどれか。", "opts": ["裸耳の平均聴力レベルが90dB以上", "装用下の平均聴力レベルが45dBより改善しない", "手術時期は原則体重8kg以上または1歳以上", "6カ月以上の補聴器装用下の最高語音明瞭度が60%以下", "補聴の基本は両耳聴で両耳装用も否定しない"], "ans": [3], "exp": "<div><b>【正解】④（誤文）<\/b><\/div><div>正しくは「6カ月以上の最適な補聴器装用下の最高語音明瞭度が50%以下」。<\/div><div>○1：聴力条件(i)。<\/div><div>○2：6カ月以上の最適な補聴器装用後に確認する(聴力条件ii)。<\/div><div>○3：1歳以上で体重8kg未満の場合は慎重に判断する。<\/div><div>○5：両耳聴の実現のために人工内耳は有用。<\/div><div>【出典】過去問 問題12<\/div>", "star": true, "memo": "※先生の資料に「50%未満」との記載があるとのさやの指摘。日本耳科学会の公式(2022)は「50%以下」。過去問は「80%以下」だったが本問は±20%ルールで60%に変更。過去問の「1歳以上(体重8kg以上)」は2022年版では「体重8kg以上または1歳以上」。", "chk": true}, {"id": "q14", "g": "g5", "cat": "小児の適応条件(2022年版)", "q": "言語習得期以後に<ruby>失聴<rt>しっちょう<\/rt><\/ruby>し、<ruby>補聴器<rt>ほちょうき<\/rt><\/ruby>の効果が十分でない高度難聴と確認された小児の対応として、正しいのはどれか。", "opts": ["補聴器装用下で6カ月間の観察を要する", "言語を獲得済みのため適応外となる", "獲得した言語を失わないよう早期に検討する", "片耳での効果を観察してから両耳を検討する", "成人の適応基準に準じて判断する"], "ans": [2], "exp": "<div><b>【正解】③<\/b><\/div><div>獲得した言語を保持し失わないために、早期に人工内耳を検討
