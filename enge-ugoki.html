<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>嚥下の動き 辞書＆クイズ</title>
<style>
:root{
  --bg-primary:#ffffff;--surface-1:#f4f3ee;
  --text-primary:#1f1e1d;--text-secondary:#66645f;
  --border-tertiary:#e3e1da;--border-secondary:#c8c6bd;
  --bg-accent:#e6f1fb;--border-accent:#85b7eb;--text-accent:#0c447c;
  --text-success:#0f6e56;--text-danger:#a32d2d;--bg-success:#e2f4ec;--bg-danger:#fbe9e9;--radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-primary:#1f1e1d;--surface-1:#2b2a27;
    --text-primary:#f0eee8;--text-secondary:#a8a69e;
    --border-tertiary:#3a3935;--border-secondary:#55534d;
    --bg-accent:#0c2a47;--border-accent:#378add;--text-accent:#b5d4f4;
    --text-success:#5dcaa5;--text-danger:#f09595;--bg-success:#0f3a2e;--bg-danger:#472020;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg-primary:#1f1e1d;--surface-1:#2b2a27;
  --text-primary:#f0eee8;--text-secondary:#a8a69e;
  --border-tertiary:#3a3935;--border-secondary:#55534d;
  --bg-accent:#0c2a47;--border-accent:#378add;--text-accent:#b5d4f4;
  --text-success:#5dcaa5;--text-danger:#f09595;--bg-success:#0f3a2e;--bg-danger:#472020;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-size:15px;line-height:1.7;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:10;background:var(--bg-primary);border-bottom:1px solid var(--border-tertiary);padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:16px;font-weight:600;margin:0;flex:1;line-height:1.3}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--text-secondary)}
button{font:inherit;color:inherit;cursor:pointer;background:var(--bg-primary);border:1px solid var(--border-secondary);border-radius:var(--radius);padding:8px 12px;min-height:40px;-webkit-tap-highlight-color:transparent}
button:active{background:var(--surface-1)}
.ico{padding:4px 10px;min-height:34px;font-size:13px}
main{max-width:860px;margin:0 auto;padding:12px 14px}
.panel{display:none}.panel.on{display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg-primary);border-top:1px solid var(--border-tertiary);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:transparent;min-height:56px;font-size:12px;color:var(--text-secondary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.3}
nav button b{font-size:19px;font-weight:400;line-height:1}
nav button.on{color:var(--text-accent);background:var(--bg-accent)}
h2{font-size:16px;margin:16px 0 8px;font-weight:600}
.lead{font-size:13px;color:var(--text-secondary);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:13px;padding:5px 11px;min-height:34px;border-radius:999px}
.chip.on{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent)}
.lab{font-size:12px;color:var(--text-secondary);margin:8px 0 0}
input[type=search]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--border-secondary);border-radius:var(--radius);background:var(--bg-primary);color:var(--text-primary);min-height:44px}
.grp{font-size:13px;font-weight:600;margin:16px 0 6px;color:var(--text-accent);display:flex;justify-content:space-between;align-items:center;gap:8px}
.grp button{font-size:12px;padding:3px 10px;min-height:30px;font-weight:400}
.card{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;margin:0 0 8px}
.card .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .h b{font-size:15px;font-weight:600}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--border-secondary);color:var(--text-secondary)}
.star{color:#d4900a;font-size:15px}
.card dl{margin:6px 0 0;display:grid;grid-template-columns:4.2em minmax(0,1fr);gap:2px 8px;font-size:14px}
.card dt{color:var(--text-secondary);font-size:12px;padding-top:2px}
.card dd{margin:0}
.nvb{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--bg-accent);color:var(--text-accent)}
.empty{text-align:center;color:var(--text-secondary);padding:30px 0}
.simgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.simgrid button{text-align:left;padding:10px 12px;min-height:64px;background:var(--surface-1);border-color:var(--border-tertiary)}
.simgrid button small{display:block;color:var(--text-secondary);font-size:11px}
.simbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.simbar b{font-size:14px;flex:1}
iframe.simf{width:100%;border:0;display:block;min-height:300px;background:transparent}
.menuhead{font-size:14px;font-weight:600;margin:14px 0 6px}
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cat{text-align:left;padding:10px 12px;min-height:68px;background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent);font-weight:600;line-height:1.4}
.cat small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.modes button{background:var(--surface-1);border-color:var(--border-tertiary);font-size:13px}
.prog{height:6px;border-radius:3px;background:var(--surface-1);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--border-accent);width:0;transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary)}
.qtext{font-size:16px;line-height:1.8;margin:8px 0 12px}
ruby rt{font-size:.55em}
.opt{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;margin:0 0 8px;padding:11px 12px;min-height:48px;line-height:1.5}
.opt .n{flex:none;width:1.6em;color:var(--text-secondary)}
.opt.ok{background:var(--bg-success);border-color:var(--text-success);color:var(--text-success)}
.opt.ng{background:var(--bg-danger);border-color:var(--text-danger);color:var(--text-danger)}
.opt[disabled]{cursor:default;opacity:1}
.fb{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;margin:4px 0 10px;font-size:14px}
.fb .v{font-weight:600;margin-bottom:2px}
.fb .v.ok{color:var(--text-success)}.fb .v.ng{color:var(--text-danger)}
.primary{background:var(--bg-accent);border-color:var(--border-accent);color:var(--text-accent);font-weight:600;width:100%}
.score{font-size:34px;font-weight:600;text-align:center;margin:10px 0 0}
.sub{text-align:center;color:var(--text-secondary);font-size:13px;margin-bottom:12px}
.wrong{border-left:3px solid var(--text-danger);border-radius:6px;background:var(--surface-1);padding:8px 10px;margin:0 0 8px;font-size:13px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.foot{font-size:11px;color:var(--text-secondary);margin-top:22px;line-height:1.6}
@media (min-width:640px){.simgrid,.catgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <h1>嚥下の動き 辞書＆クイズ<small>筋・神経・動きをまとめて確認</small></h1>
  <button class="ico" id="themeBtn" type="button" aria-label="表示テーマを切り替え">自動</button>
</header>
<main>
  <section class="panel on" id="p-dict">
    <p class="lead">筋・動き・手術を検索できます。★は国試で出やすいポイントです。</p>
    <input type="search" id="q" placeholder="例：舌下神経、開口、輪状咽頭筋" aria-label="検索" autocomplete="off">
    <div class="chips"><button class="chip" id="ft" type="button">絞り込み ▼</button><button class="chip" id="fs" type="button">★ 頻出のみ</button><button class="chip" id="fx" type="button">クリア</button></div>
    <div id="fbox" style="display:none">
    <div class="lab">部位・単元</div><div class="chips" id="fr"></div>
    <div class="lab">種類</div><div class="chips" id="fk"></div>
    <div class="lab">支配神経</div><div class="chips" id="fn"></div>
    </div>
    <div id="dres"></div>
  </section>
  <section class="panel" id="p-sim">
    <div id="simlist">
      <p class="lead">動かして確認できるシミュレーターです。筋を選ぶと、動き・支配神経が表示されます。</p>
      <div class="simgrid" id="simgrid"></div>
    </div>
    <div id="simview" style="display:none">
      <div class="simbar"><button class="ico" id="simback" type="button">← 一覧</button><b id="simtitle"></b><button class="ico" id="simquiz" type="button">この単元のクイズ</button></div>
      <div id="simhost"></div>
    </div>
  </section>
  <section class="panel" id="p-quiz">
    <div id="qmenu"></div>
    <div id="qrun" style="display:none"></div>
  </section>
  <p class="foot">※ シミュレーターの図は理解用の模式図です。授業資料にない一般解剖学の内容は、教科書で確認してください。</p>
</main>
<nav>
  <button type="button" data-t="dict" class="on"><b>📖</b>動き辞書</button>
  <button type="button" data-t="sim"><b>🎞</b>シミュレーター</button>
  <button type="button" data-t="quiz"><b>✏️</b>クイズ</button>
</nav>
<script>

咽頭弁形成術","咽頭縫縮術","輪状咽頭筋切断術","喉頭蓋管形成術","喉頭挙上術"],"a":4,"e":"喉頭挙上の不足には喉頭挙上術（舌骨下筋群切断術を併用することもある）。"}]};
var DOCS={"mast":"<!DOCTYPE html><html lang=\"ja\" data-stick=\"wrap\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><style>\n:root{--bg-primary:#ffffff;--surface-1:#f4f3ee;--text-primary:#1f1e1d;--text-secondary:#66645f;--border-tertiary:#e3e1da;--border-secondary:#c8c6bd;--bg-accent:#e6f1fb;--border-accent:#85b7eb;--text-accent:#0c447c;--text-success:#0f6e56;--text-danger:#a32d2d;--radius:10px;color-scheme:light}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg-primary:#1f1e1d;--surface-1:#2b2a27;--text-primary:#f0eee8;--text-secondary:#a8a69e;--border-tertiary:#3a3935;--border-secondary:#55534d;--bg-accent:#0c2a47;--border-accent:#378add;--text-accent:#b5d4f4;--text-success:#5dcaa5;--text-danger:#f09595;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg-primary:#1f1e1d;--surface-1:#2b2a27;--text-primary:#f0eee8;--text-secondary:#a8a69e;--border-tertiary:#3a3935;--border-secondary:#55534d;--bg-accent:#0c2a47;--border-accent:#378add;--text-accent:#b5d4f4;--text-success:#5dcaa5;--text-danger:#f09595;color-scheme:dark}\n*,*::before,*::after{box-sizing:border-box}\nhtml{-webkit-text-size-adjust:100%}\nbody{margin:0;padding:4px 0 8px;background:transparent;color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,\"Hiragino Sans\",\"Noto Sans JP\",\"Yu Gothic\",sans-serif;font-size:15px;line-height:1.7}\n.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}\nbutton{font:inherit;color:var(--text-primary);cursor:pointer;background:var(--bg-primary);border:1px solid var(--border-secondary);border-radius:var(--radius);padding:7px 12px;min-height:36px;-webkit-tap-highlight-color:transparent}\nbutton:active{background:var(--surface-1)}\ninput[type=range]{width:100%;accent-color:var(--text-accent)}\nsvg{max-width:100%;height:auto}\nh3,h4{margin:8px 0 4px}\ntext{fill:var(--text-primary)}\ntext.t{font-size:14px;fill:var(--text-primary) ht:1.7;min-height:44px}\n.res b{font-weight:500}\n.note{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;font-size:13px;line-height:1.7;margin-top:8px}\ntable.t{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}\ntable.t td,table.t th{border-bottom:0.5px solid var(--border-tertiary);padding:4px 6px;text-align:left;font-weight:400}\ntable.t th{color:var(--text-secondary);font-size:12px}\n<\/style>\n<div class=\"wrap\">\n<div>\n<svg width=\"100%\" viewBox=\"0 0 340 350\" role=\"img\">\n<title>咀嚼中の口腔を上から見た図<\/title>\n<desc>上が前方。下顎の歯列、舌、頬、口唇、口峡。食物が臼歯の上、頬側、舌側のどこにあるかを示す。左が患者の右で、右側で噛んでいる。<\/desc>\n<defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M2 1L8 5L2 9\" fill=\"none\" stroke=\"context-stroke\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/marker><\/defs>\n<text class=\"ts\" x=\"8\" y=\"14\">← 患者の右（噛む側）<\/text>\n<text class=\"ts\" x=\"332\" y=\"14\" text-anchor=\"end\">患者の左 →<\/text>\n<rect x=\"56\" y=\"296\" width=\"228\" height=\"54\" rx=\"10\" fill=\"#7A2F3A\" opacity=\"0.35\"><\/rect>\n<text class=\"ts\" x=\"170\" y=\"344\" text-anchor=\"middle\">咽頭<\/text>\n<g id=\"cL\"><path d=\"M64 96 Q56 200 80 292\" fill=\"none\" stroke=\"#D85A30\" stroke-width=\"14\" stroke-linecap=\"round\" id=\"cLp\"><\/path><\/g>\n<g id=\"cR\"><path d=\"M276 96 Q284 200 260 292\" fill=\"none\" stroke=\"#D85A30\" stroke-width=\"14\" stroke-linecap=\"round\" id=\"cRp\"><\/path><\/g>\n<text class=\"ts\" x=\"6\" y=\"196\">頬筋<\/text>\n<g id=\"arch\">\n<path d=\"M104 276 L104 170 Q104 96 170 92 Q236 96 236 170 L236 276\" fill=\"none\" stroke=\"#888780\" stroke-width=\"15\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.55\"><\/path>\n<path d=\"M104 276 L104 170 Q104 96 170 92 Q236 96 236 170 L236 276\" fill=\"none\" stroke=\"#F1EFE8\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path>\n<\/g>\n<g id=\"tgg\"><path d=\"M128 276 Q120 190 150 152 Q170 130 190 152 Q220 190 212 276 Z\" fill=\"#ED93B1\" fill-opacity=\"0.55\" stroke=\"#D4537E\" stroke-width=\"1.5\"><\/path><text class=\"ts\" x=\"170\" y=\"226\" text-anchor=\"middle\">舌<\/text><\/g>\n<path id=\"lipL\" fill=\"none\" stroke=\"#D4537E\" stroke-width=\"12\" stroke-linecap=\"round\"><\/path>\n<path id=\"lipR\" fill=\"none\" stroke=\"#D4537E\" stroke-width=\"12\" stroke-linecap=\"round\"><\/path>\n<text class=\"ts\" x=\"170\" y=\"22\" text-anchor=\"middle\">口唇（口輪筋）<\/text>\n<line id=\"pL\" y1=\"296\" y2=\"310\" stroke=\"#D4879A\" stroke-width=\"12\" stroke-linecap=\"round\"><\/line>\n<line id=\"pR\" y1=\"296\" y2=\"310\" stroke=\"#D4879A\" stroke-width=\"12\" stroke-linecap=\"round\"><\/line>\n<text class=\"ts\" x=\"170\" y=\"290\" text-anchor=\"middle\" id=\"ikt\">口峡<\/text>\n<g id=\"parts\"><\/g>\n<line id=\"aC\" x1=\"62\" y1=\"200\" x2=\"82\" y2=\"200\" stroke=\"var(--text-primary)\" stroke-width=\"2.5\" stroke-linecap=\"round\" marker-end=\"url(#ar)\" opacity=\"0\"><\/line>\n<line id=\"aT\" x1=\"150\" y1=\"226\" x2=\"124\" y2=\"226\" stroke=\"var(--text-primary)\" stroke-width=\"2.5\" stroke-linecap=\"round\" marker-end=\"url(#ar)\" opacity=\"0\"><\/line>\n<text class=\"ts\" x=\"100\" y=\"306\" text-anchor=\"end\">歯列<\/text>\n<text class=\"ts\" x=\"62\" y=\"84\" text-anchor=\"end\" opacity=\"0\">　<\/text>\n<\/svg>\n<div class=\"st\" style=\"font-size:12px;color:var(--text-secondary);margin-top:2px\">白い帯＝下顎の歯列。帯の外側が頬側（前庭）、内側が舌側。橙の丸＝食物。<\/div>\n<\/div>\n<div>\n<div class=\"grp\">各筋のはたらき（押すとオン／オフ。オフ＝麻痺のシミュレーション）<\/div>\n<div id=\"tg\"><\/div>\n<div style=\"margin-top:6px\"><button id=\"go\">咀嚼を再生（6回）<\/button> <button id=\"rs\">リセット<\/button><\/div>\n<div class=\"cnt\" id=\"cnt\"><\/div>\n<div class=\"res\" id=\"res\">食物は最初、噛む側の臼歯の上にあります。「咀嚼を再生」を押すと、噛むたびに頬側・舌側へ落ち、頬と舌で臼歯の上へ戻される様子が見えます。<\/div>\n<\/div>\n<\/div>\n<div class=\"eff\" id=\"eff\"><\/div>\n<div class=\"note\">\n<b>準備期の分担（授業資料）<\/b>\n<table class=\"t\"><tbody><tr><th>はたらき<\/th><th>主な神経<\/th><\/tr>\n<tr><td>下顎運動（開口・閉口・咀嚼）<\/td><td>三叉神経（V）下顎神経<\/td><\/tr>\n<tr><td>口唇閉鎖・頬筋・唾液分泌<\/td><td>顔面神経（VII）<\/td><\/tr>\n<tr><td>舌による食物の移動<\/td><td>舌下神経（XII）<\/td><\/tr>\n<tr><td>口蓋（咀嚼中の保持と気道確保）<\/td><td>咽頭神経叢（IX・X）<\/td><\/tr><\/tbody><\/table>\n★ 表2「その他の協調運動」の4つ：口輪筋・頬筋（VII）、舌筋（XII）、口蓋の筋（IX・X）。プロセスモデルでは、stage I transport（舌で臼歯へ）→ processing（咀嚼）→ stage II transport（舌で中咽頭へ。咀嚼と同時進行）。<br>\n※筋の働きは表2・授業資料に沿っている。オフにしたときの所見は、表8（摂食場面の観察）や顔面神経麻痺の所見と対応づけた学習用の模式で、食物の動きは理解用に単純化している。「咽頭への早期流入」は授業資料にない一般知識。実際の咀嚼は左右の筋が両側で協調して働く。\n<\/div>\n<script>\nvar NS='http://www.w3.org/2000/svg';\nfunction $(i){return document.getElementById(i)}\nfunction lerp(a,b,k){return a+(b-a)*k}\nvar MU=[\n{k:'lip',n:'口輪筋',nv:'顔面神経（VII）',role:'口唇を閉じて、咀嚼中の食物を口腔内に保持する',off:'口唇から食物が<b>流出<\/b>する（表8「口唇からの摂取物流出」。顔面神経麻痺では水や食物がこぼれる）'},\n{k:'cheek',n:'頬筋',nv:'顔面神経（VII）',role:'頬を歯列に押しつけ、頬側（前庭）に落ちた食物を臼歯の上へ戻す',off:'頬側に食物が<b>たまる<\/b>（頬側のため込み・残留　※表8「口腔へ摂取物のため込み」に近い）'},\n{k:'tongue',n:'舌筋',nv:'舌下神経（XII）',role:'舌側に落ちた食物を臼歯の上へ戻し、食塊をまとめる',off:'舌側に食物が<b>残り<\/b>、食塊形成と送り込みが不十分になる（口腔内残渣）'},\n{k:'pal',n:'口蓋の筋',nv:'咽頭神経叢（IX・X）',role:'軟口蓋を下げて口峡を狭め、食物を口腔内に保持しつつ鼻呼吸の気道を確保する',off:'咀嚼中に食物が咽頭へ<b>早く流れ込む<\/b>（早期流入。誤嚥のリスク　※）。口峡が開いたままになる'}\n];\nvar on={lip:true,cheek:true,tongue:true,pal:true},tgb={};\nvar tg=$('tg');\nMU.forEach(function(m){var b=document.createElement('button');b.className='chip on';b.onclick=function(){on[m.k]=!on[m.k];refresh()};tg.appendChild(b);tgb[m.k]=b});\nvar efEl=$('eff'),efs={};\nMU.forEach(function(m){var d=document.createElement('div');d.className='ef';efEl.appendChild(d);efs[m.k]=d});\nvar cn=$('cnt'),cnEl={};\n[['occl','臼歯の上'],['buccal','頬側'],['lingual','舌側'],['out','口唇から流出'],['pharynx','咽頭へ早期流入']].forEach(function(c){var d=document.createElement('div');d.innerHTML='<b>0<\/b>'+c[1];cn.appendChild(d);cnEl[c[0]]=d.querySelector('b')});\nvar SL={\noccl:[[104,236],[104,220],[104,204],[104,188],[104,252],[104,268],[104,172],[104,156]],\nbuccal:[[85,236],[85,220],[85,204],[85,188],[85,252],[85,268],[85,172],[85,156]],\nlingual:[[122,236],[122,220],[122,204],[122,188],[122,252],[122,268],[122,172],[122,156]],\nout:[[150,36],[170,30],[190,36],[160,46],[180,46],[140,28],[200,28],[170,52]],\npharynx:[[150,318],[170,326],[190,318],[160,336],[180,336],[170,310],[140,326],[200,326]]};\nvar PS=[],pc=$('parts');\nfor(var i=0;i<8;i++){var c=document.createElementNS(NS,'circle');c.setAttribute('r',5.5);c.setAttribute('fill','#EF9F27');c.setAttribute('stroke','#BA7517');c.setAttribute('stroke-width',1);pc.appendChild(c);PS.push({st:'occl',x:SL.occl[i][0],y:SL.occl[i][1],el:c})}\nvar timers=[],run=false,raf=0,pCheek=0,pTongue=0,pJaw=0,aC=0,aT=0,pat=['s','b','l','b','l','s','b','l'],pi=0,leakShown=0;\nfunction assign(){var cnt={occl:0,buccal:0,lingual:0,out:0,pharynx:0};PS.forEach(function(p){var s=SL[p.st],k=cnt[p.st]++;p.tx=s[k%s.length][0];p.ty=s[k%s.length][1]});\n['occl','buccal','lingual','out','pharynx'].forEach(function(k){cnEl[k].textContent=cnt[k]})}\nfunction clr(){timers.forEach(clearTimeout);timers=[]}\nfunction reset(){clr();run=false;pi=0;PS.forEach(function(p,i){p.st='occl'});assign();PS.forEach(function(p){p.x=p.tx;p.y=p.ty});\n$('res').innerHTML='食物は最初、噛む側の臼歯の上にあります。「咀嚼を再生」を押すと、噛むたびに頬側・舌側へ落ち、頬と舌で臼歯の上へ戻される様子が見えます。';draw();loop()}\nfunction bite(){\nvar oc=PS.filter(function(p){return p.st==='occl'});\noc.forEach(function(p){var r=pat[pi%pat.length];pi++;if(r==='b')p.st='buccal';else if(r==='l')p.st='lingual'});\nif(!on.lip){var b=PS.filter(function(p){return p.st==='buccal'})[0];if(b)b.st='out'}\nif(!on.pal){var q=PS.filter(function(p){return p.st==='occl'||p.st==='lingual'})[0];if(q)q.st='pharynx'}\npJaw=1;assign();loop()}\nfunction ret(){\nif(on.cheek){PS.forEach(function(p){if(p.st==='buccal')p.st='occl'});pCheek=1;aC=1}\nif(on.tongue){PS.forEach(function(p){if(p.st==='lingual')p.st='occl'});pTongue=1;aT=1}\nassign();loop()}\nfunction finish(){\nvar c={occl:0,buccal:0,lingual:0,out:0,pharynx:0};PS.forEach(fun 90\" width=\"11\" height=\"26\" rx=\"3\" fill=\"#F1EFE8\" stroke=\"#888780\" stroke-width=\"0.8\"><\/rect>\n<rect x=\"96\" y=\"196\" width=\"11\" height=\"26\" rx=\"3\" fill=\"#F1EFE8\" stroke=\"#888780\" stroke-width=\"0.8\"><\/rect>\n<path d=\"M356 60 L356 304\" fill=\"none\" stroke=\"#888780\" stroke-width=\"8\" stroke-linecap=\"round\" opacity=\"0.4\"><\/path>\n<g id=\"ticks\"><\/g>\n<text class=\"ts\" x=\"150\" y=\"72\" text-anchor=\"middle\">鼻腔<\/text>\n<text class=\"ts\" x=\"290\" y=\"84\" text-anchor=\"middle\">鼻咽腔<\/text>\n<text class=\"ts\" x=\"170\" y=\"100\" text-anchor=\"middle\">硬口蓋<\/text>\n<path id=\"tg\" fill=\"#ED93B1\" fill-opacity=\"0.5\" stroke=\"#D4537E\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path>\n<text class=\"ts\" x=\"200\" y=\"236\" text-anchor=\"middle\">舌<\/text>\n<path id=\"air\" fill=\"none\" stroke=\"#1D9E75\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\" stroke-linecap=\"round\" marker-end=\"url(#ar)\" d=\"M96 66 Q190 54 290 70 Q335 90 338 150 L322 250\"><\/path>\n<text class=\"ts\" id=\"airt\" x=\"300\" y=\"298\" text-anchor=\"middle\"><\/text>\n<path id=\"sp\" fill=\"none\" stroke=\"#D4537E\" stroke-width=\"9\" stroke-linecap=\"round\" opacity=\"0.75\"><\/path>\n<line id=\"uv\" stroke=\"#D4537E\" stroke-width=\"6\" stroke-linecap=\"round\" opacity=\"0.85\"><\/line>\n<ellipse id=\"eu\" cx=\"340\" cy=\"88\" rx=\"3\" ry=\"2\" fill=\"#5C2B30\"><\/ellipse>\n<line id=\"gap\" stroke=\"var(--text-secondary)\" stroke-width=\"1\" stroke-dasharray=\"3 3\"><\/line>\n<text class=\"ts\" id=\"gapt\" text-anchor=\"end\">口峡<\/text>\n<polyline id=\"l_tv\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/polyline>\n<line id=\"l_lv\" stroke-linecap=\"round\"><\/line>\n<line id=\"l_uv\" stroke-linecap=\"round\"><\/line>\n<line id=\"l_pl\" stroke-linecap=\"round\"><\/line>\n<line id=\"l_pg\" stroke-linecap=\"round\"><\/line>\n<line id=\"l_sp\" stroke-linecap=\"round\"><\/line>\n<line id=\"l_spt\" stroke-linecap=\"round\"><\/line>\n<line id=\"ar1\" stroke=\"var(--text-primary)\" stroke-width=\"2.5\" stroke-linecap=\"round\" marker-end=\"url(#ar)\"><\/line>\n<text class=\"ts\" x=\"20\" y=\"22\">前（側面図）<\/text>\n<\/svg>\n<\/div>\n<div>\n<svg width=\"100%\" viewBox=\"0 0 340 320\" role=\"img\">\n<title>口蓋弓の正面図<\/title>\n<desc>口を開けて正面から見た図。口蓋舌弓、口蓋咽頭弓、口蓋垂、口峡。左が患者の右。<\/desc>\n<text class=\"ts\" x=\"10\" y=\"16\">← 患者の右<\/text>\n<text class=\"ts\" x=\"330\" y=\"16\" text-anchor=\"end\">患者の左 →<\/text>\n<ellipse cx=\"170\" cy=\"170\" rx=\"132\" ry=\"124\" fill=\"#7A2F3A\"><\/ellipse>\n<ellipse cx=\"170\" cy=\"204\" rx=\"64\" ry=\"52\" fill=\"#B85A68\"><\/ellipse>\n<path id=\"pR\" fill=\"none\" stroke=\"#A94A5A\" stroke-width=\"7\" stroke-linecap=\"round\"><\/path>\n<path id=\"pL\" fill=\"none\" stroke=\"#A94A5A\" stroke-width=\"7\" stroke-linecap=\"round\"><\/path>\n<path id=\"pal\" fill=\"#E8A0A8\"><\/path>\n<path id=\"aR\" fill=\"none\" stroke=\"#D4879A\" stroke-width=\"10\" stroke-linecap=\"round\"><\/path>\n<path id=\"aL\" fill=\"none\" stroke=\"#D4879A\" stroke-width=\"10\" stroke-linecap=\"round\"><\/path>\n<ellipse id=\"uvf\" rx=\"7\" fill=\"#E8A0A8\" stroke=\"#C9707C\" stroke-width=\"1\"><\/ellipse>\n<path d=\"M52 262 Q60 226 170 226 Q280 226 288 262 Q296 318 170 318 Q44 318 52 262 Z\" fill=\"#E8808C\" stroke=\"#B5505C\" stroke-width=\"1.2\"><\/path>\n<text class=\"ts\" x=\"170\" y=\"290\" text-anchor=\"middle\">舌<\/text>\n<line id=\"f1\" stroke=\"var(--text-primary)\" stroke-width=\"2.5\" stroke-linecap=\"round\" marker-end=\"url(#ar)\"><\/line>\n<line id=\"f2\" stroke=\"var(--text-primary)\" stroke-width=\"2.5\" stroke-linecap=\"round\" marker-end=\"url(#ar)\"><\/line>\n<text class=\"ts\" x=\"170\" y=\"64\" text-anchor=\"middle\">硬口蓋・軟口蓋<\/text>\n<text class=\"ts\" x=\"170\" y=\"196\" text-anchor=\"middle\" id=\"ik\">口峡<\/text>\n<\/svg>\n<div class=\"st\"><span style=\"color:#D4879A\">━<\/span> 口蓋舌弓（前）　<span style=\"color:#A94A5A\">━<\/span> 口蓋咽頭弓（後）<\/div>\n<\/div>\n<\/div>\n<div class=\"grp\">動きを選ぶ<\/div>\n<div id=\"mv\"><\/div>\n<div style=\"margin-top:2px\"><button id=\"pal\" class=\"chip\">一側迷走神経麻痺（患者の右）をつける<\/button><\/div>\n<div class=\"wrap\" style=\"margin-top:4px\">\n<div><div class=\"tb\" id=\"tb\"><\/div><\/div>\n<div><div class=\"info\" id=\"info\"><\/div><div class=\"warn\" id=\"warn\" style=\"display:none\"><\/div><\/div>\n<\/div>\n<div class=\"note\">★ 軟口蓋の筋は<b>「上げる」＝口蓋帆挙筋（＋口蓋垂筋）／「下げる」＝口蓋舌筋・口蓋咽頭筋／「張る」＝口蓋帆張筋<\/b>。神経は口蓋帆張筋だけ三叉神経（V）、ほかは咽頭神経叢（IX・X）。<br>※口蓋舌筋は、前の舌の図では舌の筋として扱い「舌後方を挙上」と書いたが、テキスト表3では<b>軟口蓋の筋<\/b>で、作用は「軟口蓋下降・口峡を狭くする・口蓋と舌を近づける」。この図の書き方が正しい。<br>※起始・停止、口蓋弓と筋の対応（口蓋舌弓＝口蓋舌筋、口蓋咽頭弓＝口蓋咽頭筋）、片側麻痺時の口蓋垂の偏位の細部は一般解剖学の内容。図は理解用の模式で、実際の動きの大きさとは異なる。<\/div>\n<script>\nvar NS='http://www.w3.org/2000/svg';\nfunction $(i){return document.getElementById(i)}\nfunction cl(x,a,b){return Math.max(a,Math.min(b,x))}\nfunction lerp(a,b,k){return a+(b-a)*k}\nfunction b(v){return[v,v]}\nvar MU=[\n{k:'tv',n:'口蓋帆張筋',nv:'三叉神経（V）',pos:'蝶形骨（舟状窩）・耳管軟骨 → 翼突鉤で折れ曲がり軟口蓋腱膜　※',act:'軟口蓋を<b>緊張<\/b>させる。嚥下時に<b>耳管を拡張<\/b>し、空気圧を調整する',pt:'★軟口蓋の筋で<b>これだけ三叉神経<\/b>。ほかは咽頭神経叢（IX・X）。迷走神経麻痺でも影響されない。'},\n{k:'lv',n:'口蓋帆挙筋',nv:'咽頭神経叢（IX・X）＝迷走神経',pos:'側頭骨（錐体）・耳管軟骨 → 軟口蓋　※',act:'軟口蓋を<b>挙上<\/b>し、咽頭後壁に接して<b>鼻咽腔を閉鎖<\/b>する',pt:'嚥下・発声で働く。一側麻痺では<b>カーテン兆候<\/b>（健側の口蓋弓のみ挙上）。'},\n{k:'uv',n:'口蓋垂筋',nv:'咽頭神経叢（IX・X）',pos:'後鼻棘・口蓋腱膜 → 口蓋垂　※',act:'口蓋垂を<b>緊張・短縮<\/b>させ、鼻咽腔閉鎖を補助する',pt:'口蓋垂が短く縮むのが図で見える。'},\n{k:'pl',n:'口蓋舌筋',nv:'咽頭神経叢（IX・X）',pos:'軟口蓋 → 舌の側縁　※',act:'軟口蓋を<b>下降<\/b>させ、<b>口峡を狭く<\/b>し、口蓋と舌を近づける',pt:'前口蓋弓（口蓋舌弓）をつくる　※。咀嚼中、食物が咽頭へ早く落ちないよう口腔内に保持する（表2）。'},\n{k:'pg',n:'口蓋咽頭筋',nv:'咽頭神経叢（IX・X）',pos:'軟口蓋 → 咽頭側壁・甲状軟骨　※',act:'軟口蓋を<b>下降<\/b>させ、<b>口峡を狭く<\/b>し、咽頭側壁を<b>前内方へ牽引<\/b>する',pt:'後口蓋弓（口蓋咽頭弓）をつくる　※。口蓋舌筋とセットで「下げる・狭める」。'},\n{k:'sp',n:'茎突咽頭筋',nv:'舌咽神経（IX）',pos:'側頭骨（茎状突起）→ 咽頭壁・甲状軟骨　※',act:'咽頭を<b>挙上<\/b>する',pt:'★舌咽神経が運動を支配するのはこの筋だけ。茎突咽頭筋＝IX／茎突舌骨筋＝VII（過去問③）。'},\n{k:'spt',n:'耳管咽頭筋',nv:'咽頭神経叢（IX・X）',pos:'耳管軟骨 → 咽頭壁　※',act:'咽頭を<b>挙上<\/b>する',pt:'茎突咽頭筋とともに咽頭を引き上げる（表3「咽頭の挙上」）。'}\n];\nvar byK={};MU.forEach(function( opacity=\"0.8\"><\/rect>\n<text class=\"th\" x=\"222\" y=\"268\" text-anchor=\"end\">甲状軟骨<\/text>\n<\/g>\n<g id=\"arrows\"><\/g>\n<\/svg>\n<div class=\"grp\">舌骨上筋群（挙上）<\/div>\n<div id=\"g-up\"><\/div>\n<div class=\"grp\">舌骨下筋群（引き下げ。甲状舌骨筋だけ喉頭を挙上）<\/div>\n<div id=\"g-low\"><\/div>\n<div style=\"margin-top:8px\">\n<button id=\"p-swallow\">嚥下の咽頭期：挙上グループを全部収縮<\/button>\n<button id=\"p-low\">舌骨下筋群だけ収縮<\/button>\n<button id=\"p-reset\">リセット<\/button>\n<\/div>\n<div class=\"info\" id=\"info\">筋のボタンを押すと、収縮した向きが矢印で示され、舌骨と喉頭が動きます。複数選ぶと合成されます。<\/div>\n<script>\nvar HC=[240,212],LC=[250,262];\nvar M=[\n{id:'myl',n:'顎舌骨筋',g:'up',a:{p:[262,162]},b:{p:[250,210],s:'H'},vH:[-2,-12],path:'下顎骨（顎舌骨筋線）→ 舌骨体',act:'下顎骨固定時：舌骨を挙上／舌骨固定時：下顎を下制',nv:'三叉神経（V）・下顎神経',memo:'口腔底をつくる筋。'},\n{id:'gen',n:'オトガイ舌骨筋',g:'up',a:{p:[160,142]},b:{p:[226,210],s:'H'},vH:[-10,-9],path:'下顎骨（オトガイ棘）→ 舌骨体',act:'下顎骨固定時：舌骨を前上方へ挙上／舌骨固定時：下顎を下制',nv:'舌下神経（XII）※',memo:'※解剖学ではC1線維が舌下神経に沿って走行。授業・国試では舌下神経（XII）で答える。'},\n{id:'dga',n:'顎二腹筋 前腹',g:'up',a:{p:[172,164]},b:{p:[238,214],s:'H'},vH:[-6,-9],path:'下顎骨（二腹筋窩）→ 中間腱 → 舌骨',act:'下顎骨固定時：舌骨を挙上',nv:'三叉神経（V）・下顎神経',memo:'★前腹はV、後腹はVII。1つの筋で神経が違う。'},\n{id:'dgp',n:'顎二腹筋 後腹',g:'up',a:{p:[432,98]},b:{p:[255,213],s:'H'},vH:[6,-11],path:'側頭骨（乳突切痕）→ 中間腱 → 舌骨',act:'下顎骨固定時：舌骨を後上方へ挙上',nv:'顔面神経（VII）',memo:'★前腹はV、後腹はVII。'},\n{id:'sty',n:'茎突舌骨筋',g:'up',a:{p:[402,100]},b:{p:[249,209],s:'H'},vH:[8,-8],path:'側頭骨（茎状突起）→ 舌骨',act:'舌骨を後上方へ挙上',nv:'顔面神経（VII）',memo:'★茎突舌骨筋＝VII。茎突咽頭筋＝IX（舌咽神経）と混同しない。'},\n{id:'ths',n:'甲状舌骨筋',g:'low',a:{p:[242,218],s:'H'},b:{p:[252,244],s:'L'},vL:[0,-16],path:'甲状軟骨 → 舌骨',act:'舌骨固定時：甲状軟骨（喉頭）を挙上／甲状軟骨固定時：舌骨を引き下げ',nv:'舌下神経に沿うC1線維（授業表では「脊髄神経」と表記）※',memo:'★舌骨下筋群で唯一「挙上」の作用をもつ。'},\n{id:'sth',n:'胸骨舌骨筋',g:'low',a:{p:[205,410]},b:{p:[230,217],s:'H'},vH:[-1,14],path:'胸骨柄 → 舌骨体',act:'舌骨を引き下げる',nv:'頸神経ワナ（C1〜C3）＝脊髄神経',memo:'★喉頭挙上には関与しない（過去問：挙上に関与しない筋）。'},\n{id:'omo',n:'肩甲舌骨筋',g:'low',a:{p:[372,404]},b:{p:[254,218],s:'H'},vH:[7,11],path:'肩甲骨上縁 → 舌骨',act:'舌骨を下後方へ引く',nv:'頸神経ワナ（C1〜C3）＝脊髄神経',memo:' etAttribute('y2',B[1]+dy/l*len);\nm.ar.setAttribute('opacity',on?1:0);\nm.bt.className='chip'+(on?' on':'');\n});\n}\nfunction step(){\nvar moving=false;\n['H','L'].forEach(function(k){for(var i=0;i<2;i++){var d=tgt[k][i]-cur[k][i];if(Math.abs(d)>0.25){cur[k][i]+=d*0.18;moving=true}else{cur[k][i]=tgt[k][i]}}});\ndraw();\nif(moving){raf=requestAnimationFrame(step)}\n}\nfunction update(){\nvar H=[0,0],X=[0,0];\nM.forEach(function(m){if(!sel[m.id])return;if(m.vH){H[0]+=m.vH[0];H[1]+=m.vH[1]}if(m.vL){X[0]+=m.vL[0];X[1]+=m.vL[1]}});\ncap(H,30);cap(X,18);\ntgt.H=H;tgt.L=[H[0]+X[0],H[1]+X[1]];\ncancelAnimationFrame(raf);step();\n}\nfunction show(m){\nvar h='<b>'+m.n+'<\/b>　<span style=\"color:var(--text-secondary);font-size:12px\">'+(m.g==='up'?'舌骨上筋群':'舌骨下筋群')+'<\/span>';\nh+='<div class=\"row\"><span>起始→停止<\/span><span>'+m.path+'<\/span><\/div>';\nh+='<div class=\"row\"><span>作用<\/span><span>'+m.act+'<\/span><\/div>';\nh+='<div class=\"row\"><span>支配神経<\/span><span>'+m.nv+'<\/span><\/div>';\nh+='<div class=\"row\"><span>ポイント<\/span><span>'+m.memo+'<\/span><\/div>';\ndocument.getElementById('info').innerHTML=h;\n}\nfunction setSel(ids,text){\nsel={};ids.forEach(function(i){sel[i]=1});\ndocument.getElementById('info').innerHTML=text;update();\n}\ndocument.getElementById('p-swallow').onclick=function(){setSel(['myl','gen','dga','dgp','sty','ths'],'<b>咽頭期の喉頭挙上<\/b><br>舌骨上筋群が舌骨を前上方へ引き、甲状舌骨筋が喉頭を舌骨へ引き寄せる。喉頭が上前方へ動くことで、喉頭蓋の翻転・喉頭閉鎖が起こり、食道入口部が開きやすくなる。')};\ndocument.getElementById('p-low').onclick=function(){setSel(['sth','omo','stt'],'<b>舌骨下筋群の収縮<\/b><br>舌骨と喉頭が下がる。嚥下では、挙上した舌骨・喉頭を元の位置へ戻す側の筋群。喉頭挙上には関与しない。')};\ndocument.getElementById('p-reset').onclick=function(){setSel([],'筋のボタンを押すと、収縮した向きが矢印で示され、舌骨と喉頭が動きます。複数選ぶと合成されます。')};\ndraw();\n<\/script><\/div><script>(function(){var m=document.documentElement.getAttribute('data-stick');if(!m)return;var c=document.getElementById('vis-container')||document.body;\nvar kids=[].filter.call(c.children,function(e){return !/^(STYLE|SCRIPT|H2)$/.test end\">患者の左 →<\/text>\n<text class=\"ts\" x=\"170\" y=\"292\" text-anchor=\"middle\">後（上から見た図）<\/text>\n<ellipse cx=\"170\" cy=\"148\" rx=\"76\" ry=\"90\" fill=\"#5C2B30\" opacity=\"0.5\"><\/ellipse>\n<rect x=\"108\" y=\"208\" width=\"124\" height=\"46\" rx=\"18\" fill=\"#7F77DD\" opacity=\"0.5\"><\/rect>\n<text class=\"ts\" x=\"170\" y=\"246\" text-anchor=\"middle\">輪状軟骨<\/text>\n<g id=\"thy\"><path d=\"M96 200 L170 64 L244 200\" fill=\"none\" stroke=\"#AFA9EC\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-linejoin=\"round\" opacity=\"0.85\"><\/path><text class=\"ts\" x=\"100\" y=\"150\" text-anchor=\"end\">甲状軟骨<\/text><\/g>\n<g id=\"sup\"><\/g>\n<text class=\"ts\" x=\"170\" y=\"158\" text-anchor=\"middle\" id=\"gl\">声門<\/text>\n<\/svg>\n<\/div>\n<div>\n<svg width=\"100%\" viewBox=\"0 0 340 300\" role=\"img\">\n<title>喉頭を側面から見た図<\/title>\n<desc>左が前方。輪状甲状筋が収縮すると甲状軟骨が前下方へ傾き、声帯が伸びる。<\/desc>\n<text class=\"ts\" x=\"10\" y=\"16\">前（側面図）<\/text>\n<rect x=\"124\" y=\"214\" width=\"100\" height=\"26\" rx=\"12\" fill=\"#7F77DD\" opacity=\"0.55\"><\/rect>\n<rect x=\"236\" y=\"120\" width=\"28\" height=\"126\" rx=\"10\" fill=\"#7F77DD\" opacity=\"0.55\"><\/rect>\n<text class=\"ts\" x=\"174\" y=\"262\" text-anchor=\"middle\">輪状軟骨<\/text>\n<circle cx=\"250\" cy=\"124\" r=\"9\" fill=\"#AFA9EC\" stroke=\"#7F77DD\" stroke-width=\"1\"><\/circle>\n<text class=\"ts\" x=\"272\" y=\"118\">披裂軟骨<\/text>\n<g id=\"lth\"><path d=\"M110 104 L205 94 L215 190 L120 196 Z\" fill=\"#AFA9EC\" fill-opacity=\"0.55\" stroke=\"#7F77DD\" stroke-width=\"1.5\" stroke-linejoin=\"round\"><\/path><circle cx=\"215\" cy=\"200\" r=\"3\" fill=\"#7F77DD\"><\/circle><text class=\"ts\" x=\"150\" y=\"100\">甲状軟骨<\/text><\/g>\n<line id=\"lfold\" stroke=\"#D4537E\" stroke-width=\"3\" stroke-dasharray=\"6 4\" stroke-linecap=\"round\"><\/line>\n<text class=\"ts\" x=\"170\" y=\"118\" text-anchor=\"middle\" id=\"lfl\">声帯<\/text>\n<g id=\"llines\"><\/g>\n<text class=\"ts\" x=\"170\" y=\"292\" text-anchor=\"middle\">後<\/text>\n<\/svg>\n<\/div>\n<\/div>\n<div class=\"grp\">動きを選ぶ<\/div>\n<div id=\"mv\"><\/div>\n<div style=\"margin-top:2px\"><button id=\"pal\" class=\"chip\">一側反回神経麻痺（患者の右）をつける<\/button><\/div>\n<div class=\"wrap\" style=\"margin-top:4px\">\n<div><div class=\"tb\" id=\"tb\"><\/div><\/div>\n<div><div class=\"info\" id=\"info\"><\/div><div class=\"warn\" id=\"warn\" style=\"display:none\"><\/div><\/div>\n<\/div>\n<div class=\"note\">★ 表3で<b>声門開大は後輪状披裂筋だけ<\/b>。声門閉鎖は甲状披裂筋・披裂筋・外側輪状披裂筋、声帯の伸展は輪状甲状筋。神経は輪状甲状筋だけ<b>上喉頭神経<\/b>、ほかの4つは<b>反回神経<\/b>（どちらも迷走神経X）。<br>※起始・停止、披裂軟骨の回転のしくみ、外枝の詳しい支配は、授業資料にない一般解剖学の内容。教科書で確認すること。声門の位置や角度は理解用の模式図。嚥下時の喉頭閉鎖は声帯だけでなく、仮声帯や喉頭蓋も関わる（※一般知識）。<\/div>\n<script>\nvar NS='http://www.w3.org/2000/svg';\nfunction $(i){return document.getElementById(i)}\nfunction cl(x,a,b){return Math.max(a,Math.min(b,x))}\nfunction lerp(a,b,k){return a+(b-a)*k}\nfunction b(v){return[v,v]}\nvar C={ct:'#378ADD',ta:'#D4537E',ia:'#BA7517',lca:'#1D9E75',pca:'#D85A30'};\nvar MU=[\n{k:'ct',n:'輪状甲状筋',nv:'上喉頭神経（X）',pos:'輪状軟骨の前面 → 甲状軟骨の下縁　※',act:'甲状軟骨を前下方へ傾け、声帯を<b>伸展<\/b>（緊張）させる。声が高くなる',pt:'声門の開閉ではなく<b>声帯の長さ<\/b>を変える筋。神経だけ上喉頭神経で、ほかの4つの内喉頭筋は反回神経。授業資料では、上喉頭神経（外枝）は輪状咽頭筋の運動も担うと書かれている（外枝は輪状甲状筋にも枝を出す　※）。'},\n{k:'ta',n:'甲状披裂筋',nv:'反回神経（X）',pos:'甲状軟骨の内面 → 披裂軟骨　※',act:'声帯の中を走り、声帯を短くして寄せる＝<b>声門閉鎖<\/b>',pt:'声帯そのものを形づくる筋（声帯筋を含む　※）。咽頭期の喉頭閉鎖（声帯内転）で働く。'},\n{k:'ia',n:'披裂筋',nv:'反回神経（X）',pos:'左右の披裂軟骨の後面どうしをつなぐ　※',act:'左右の披裂軟骨を引き寄せ、声門の後方を閉じる＝<b>声門閉鎖<\/b>',pt:'声門の後ろ側の閉鎖を担当。'},\n{k:'lca',n:'外側輪状披裂筋',nv:'反回神経（X）',pos:'輪状軟骨の外側 → 披裂軟骨の筋突起　※',act:'披裂軟骨を内側へ回し、声帯を内転させる＝<b>声門閉鎖<\/b>',pt:'筋突起を前外方へ引く → 声帯突起が内側へ動く（シーソーのイメージ　※）。'},\n{k:'pca',n:'後輪状披裂筋',nv:'反回神経（X）',pos:'輪状軟骨の後面 → 披裂軟骨の筋突起　※',act:'披裂軟骨を外側へ回し、声帯を開く＝<b>声門開大<\/b>',pt:'★表3で<b>声門開大はこの筋だけ<\/b>。両側麻痺すると声門が開かず、呼吸困難になる　※。'}\n];\nvar byK={};MU.forEach(function(m){byK[m.k]=m});\nvar MV=[\n{k:'quiet',n:'安静呼吸',a:{pca:b(0.3)},main:'後輪状披裂筋（軽く）',pt:'声門はやや開いている。'},\n{k:'deep',n:'深呼吸（声門を開く）',a:{pca:b(1)},main:'後輪状披裂筋',pt:'★声門を開くのはこの筋だけ。'},\n{k:'close',n:'声門閉鎖（嚥下時・息こらえ）' on><button id=\"bpost\" class=\"chip\">術後<\/button><\/div>\n<div class=\"gap\" id=\"gap\"><\/div>\n<\/div>\n<div>\n<div class=\"grp\">① 症状・障害を選ぶ<\/div><div id=\"pb\"><\/div>\n<div class=\"grp\">② 術式を選ぶ<\/div><div id=\"ob\"><\/div>\n<div class=\"info\" id=\"info\" aria-live=\"polite\"><\/div>\n<\/div>\n<\/div>\n<div class=\"qz\"><div class=\"grp\" style=\"margin-top:0\">ミニクイズ：概要から術式を答える<\/div><div class=\"q\" id=\"qq\">「問題を出す」を押してね。<\/div><div id=\"qo\"><\/div><div class=\"r\" id=\"qr\" aria-live=\"polite\"><\/div><div style=\"margin-top:6px\"><button id=\"qn\">問題を出す<\/button><\/div><\/div>\n<div class=\"note\">\n<b>誤嚥防止術の比較（表12）<\/b>\n<div class=\"scroll\"><table class=\"t\"><tr><th>術式<\/th><th>閉鎖の位置<\/th><th>発声<\/th><\/tr>\n<tr><td>仮声帯縫着術<\/td><td>喉頭<\/td><td>失われる（比較的低侵襲）<\/td><\/tr>\n<tr><td>声帯閉鎖術<\/td><td>喉頭<\/td><td>失われる<\/td><\/tr>\n<tr><td>喉頭気管分離術<\/td><td>気管<\/td><td>失われる（<b>再開通可能<\/b>）<\/td><\/tr>\n<tr><td>気管食道吻合術<\/td><td>気管<\/td><td>食道発声が可能になる場合あり<\/td><\/tr>\n<tr><td>TED with TEP手術<\/td><td>気管<\/td><td>食道発声（ボイスプロテーゼの管理が必要）<\/td><\/tr>\n<tr><td>喉頭全摘出術<\/td><td>喉頭を摘出<\/td><td>人工喉頭などで代償（永久気管孔）<\/td><\/tr><\/table><\/div>\n<br>★ 嚥下機能改善術の4つの目的：咽頭内圧上昇／食道入口部開大／喉頭挙上強化／喉頭閉鎖強化。誤嚥防止術＝気道と食道の分離。声帯の手術は、回復見込みあり・高齢・低侵襲希望＝注入術、回復見込みなし・永続＝筋膜挿入術。<br>\n※出典はテキスト第4版 p426 表12。プロジェクト内の2つのExcelで、輪状咽頭筋切断術・喉頭挙上術・舌骨下筋群切断術の分類（目的）の位置がずれて見える（セル結合のため）。この図は「ミニテスト範囲表」の並びに従った。教科書p426で確認すること。<br>\n※「筋の動きとの対応」の欄と術前術後の図は、これまでの図と結びつけた学習用の整理・模式で、表12には書かれていない。TED（tracheoesophageal diversion）、TEP（tracheoesophageal puncture）のフルスペルは一般知識。\n<\/div>\n<\/main>\n<script>\nvar NS='http://www.w3.org/2000/svg';\nfunction $(i){return document.getElementById(i)}\nfunction lerp(a,b,k){return a+(b-a)*k}\nvar REDUCE=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;\nvar OPS={\nflap:{n:'咽頭弁形成術',cat:'嚥下機能改善術',sub:'咽頭内圧上昇',sum:'軟口蓋と咽頭後壁の間に弁を作り、鼻咽腔を部分的に閉鎖する',ind:'鼻咽腔閉鎖不全（軟口蓋麻痺・口蓋裂術後など）',rem:'小児〜成人。口蓋裂術後の二次手術として多い',link:'鼻咽腔閉鎖＝口蓋帆挙筋・口蓋垂筋が軟口蓋を上げて咽頭後壁に接する動き。足りないので、弁で物理的に補う。'},\nsuture:{n:'咽頭縫縮術',cat:'嚥下機能改善術',sub:'咽頭内圧上昇',sum:'咽頭側壁を縫い縮めて咽頭腔を狭くし、咽頭収縮力を補う',ind:'咽頭収縮不全（球麻痺・頭頸部癌術後など）',rem:'成人。片側麻痺側を縫縮することが多い',link:'咽頭収縮＝上・中・下咽頭収縮筋の連続的な収縮。収縮力が足りないので、咽頭腔を狭めて圧を補う。'},\ncp:{n:'輪状咽頭筋切断術',cat:'嚥下機能改善術',sub:'食道入口部開大',sum:'食道入口部を閉鎖している輪状咽頭筋を切断し、開大しやすくする',ind:'食道入口部開大障害（輪状咽頭筋弛緩不全）：脳血管障害・球麻痺・ALS・ワレンベルグなど',rem:'成人。ボツリヌス毒素注入で効果を確認後に手術することも',link:'輪状咽頭筋は嚥下時に<b>弛緩<\/b>して開くはずが、弛緩しない。そこで筋そのものを切って開きやすくする。'},\nlift:{n:'喉頭挙上術',cat:'嚥下機能改善術',sub:'喉頭挙上強化',sum:'喉頭を前上方の位置で固定し、嚥下時の挙上量を確保する',ind:'喉頭挙上不全（頭頸部癌術後・放射線治療後・神経疾患）',rem:'成人。頭頸部癌術後に多い',link:'舌骨上筋群＋甲状舌骨筋が喉頭を前上方へ引き上げる動きが不足するので、前上方で固定して挙上量を確保する。'},\nstrap:{n:'舌骨下筋群切断術',cat:'嚥下機能改善術',sub:'喉頭挙上強化',sum:'舌骨を引き下げている舌骨下筋群を切断し、喉頭挙上を改善する',ind:'喉頭挙上不全（喉頭挙上を妨げる筋の緊張が強い場合）',rem:'成人。喉頭挙上術と組み合わせることが多い',link:'舌骨下筋群は舌骨・喉頭を引き下げる筋。緊張が強いと挙上を妨げるので切断する。テキスト表3：肩甲舌骨筋は手術で切断されることがある。'},\ntho:{n:'甲状軟骨形成術Ⅰ型',cat:'嚥下機能改善術',sub:'喉頭閉鎖強化（声帯内方移動術）',sum:'甲状軟骨を内方に押し込む',ind:'声門閉鎖不全（反回神経麻痺・声帯萎縮など）による嚥下中誤嚥',rem:'成人。声門閉鎖不全による誤嚥・嗄声に対して行う',link:'声門閉鎖＝甲状披裂筋・披裂筋・外側輪状披裂筋（反回神経）。麻痺側の声帯を正中へ寄せて閉鎖を補う。'},\naryt:{n:'披裂軟骨内転術',cat:'嚥下機能改善術',sub:'喉頭閉鎖強化（声帯内方移動術）',sum:'披裂軟骨を内転させ、声門閉鎖を改善する',ind:'声門閉鎖不全（反回神経麻痺・声帯萎縮など）による嚥下中誤嚥',rem:'成人。声門閉鎖不全による誤嚥・嗄声に対して行う',link:'同上。披裂軟骨（声帯の後ろの付け根）を回して声帯を正中へ寄せる。'},\ninj:{n:'声帯内注入術',cat:'嚥下機能改善術',sub:'喉頭閉鎖強化（声帯充填術）',sum:'声帯の中に注入材料を直接注射して膨らませる（コラーゲン・ヒアルロン酸・自家脂肪など）',ind:'反回神経麻痺、声帯萎縮（加齢・廃用）、声帯溝症、頭頸部癌術後の声帯運動障害',rem:'低侵襲で外来や短時間入院で可能。効果が一時的なものもある。回復見込みあり・高齢・低侵襲希望＝まずこちら',link:'同上。動かない声帯そのものを膨らませて隙間を埋める。'},\nfascia:{n:'筋膜挿入術',cat:'嚥下機能改善術',sub:'喉頭閉鎖強化（声帯充填術）',sum:'自家組織（大腿筋膜など）を声帯の中に挿入して膨らませる',ind:'反回神経麻痺、声帯萎縮、声帯溝症、頭頸部癌術後の声帯運動障害',rem:'吸収されにくく効果が長持ち。採取部位に傷が必要。注入術より侵襲がやや大きい。回復見込みなし・永続＝こちら',link:'同上。吸収されにくい自家組織で声帯を膨らませ、長く隙間を埋める。'},\nepi:{n:'喉頭蓋管形成術',cat:'嚥下機能改善術',sub:'喉頭閉鎖強化',sum:'喉頭蓋を管状に形成し、食塊を食道方向へ誘導しやすくする',ind:'喉頭蓋機能不全・喉頭蓋麻痺など',rem:'成人。比較的まれな術式',link:'咽頭期の喉頭蓋の翻転がうまくいかない場合に、喉頭蓋の形そのものを変える。'},\nfal:{n:'仮声帯縫着術',cat:'誤嚥防止術',sub:'気道と食道の分離（喉頭レベル）',sum:'仮声帯（室ひだ）を縫い合わせて喉頭口を閉鎖し、誤嚥を防ぐ',ind:'制御できない重度の誤嚥（脳血管障害・ALS・頭頸部癌術後など）',rem:'成人。比較的低侵襲。<b>発声は失われる<\/b>',link:'筋の動きの改 function qmenu(){
  $('#qrun').style.display='none';$('#qmenu').style.display='block';
  var h='<p class="lead">単元（シミュレーター）ごとに出題できます。選択肢は5つ、正解は1つです。</p><div class="menuhead">単元別に解く</div><div class="catgrid">';
  SIMS.forEach(function(s){
    var n=Q.filter(function(q){return q.c===s.id}).length;if(!n)return;
    var b=store.best[s.id];
    h+='<button type="button" class="cat" data-cat="'+s.id+'">'+esc(s.name)+'<small>'+n+'問'+(b!=null?'　前回 '+b+'%':'')+'</small></button>';
  });
  h+='</div><div class="menuhead">まとめて解く</div><div class="modes">'+
    '<button type="button" data-mode="all">全問（'+Q.length+'問）</button>'+
    '<button type="button" data-mode="rand">ランダム10問</button>'+
    '<button type="button" data-mode="star">★ 頻出（'+Q.filter(function(q){return q.s}).length+'問）</button>'+
    '<button type="button" data-mode="wrong"'+(store.wrong.length?'':' disabled')+'>間違い復習（'+store.wrong.length+'問）</button></div>';
  $('#qmenu').innerHTML=h;
}
$('#qmenu').onclick=function(e){
  var b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.cat)startQuiz({cat:b.dataset.cat});
  else if(b.dataset.mode)startQuiz({mode:b.dataset.mode});
};
function startQuiz(o){
  var idx=[];
  Q.forEach(function(q,i){
    if(o.cat&&q.c!==o.cat)return;
    if(o.mode==='star'&&!q.s)return;
    if(o.mode==='wrong'&&store.wrong.indexOf(i)<0)return;
    idx.push(i);
  });
  if(o.mode==='rand')idx=shuffle(idx).slice(0,10);
  else if(o.mode==='star'||o.mode==='all'||o.mode==='wrong'||o.cat)idx=shuffle(idx);
  if(!idx.length){qmenu();return}
  run={o:o,idx:idx,p:0,ok:0,miss:[],done:false};
  $('#qmenu').style.display='none';$('#qrun').style.display='block';
  showQ();
}
function showQ(){
  var i=run.idx[run.p],q=Q[i],pct=Math.round(run.p/run.idx.length*100);
  var h='<div class="qmeta"><span>'+(run.o.cat?esc(BY[run.o.cat].name):'まとめ')+(q.s?' ★':'')+'</span><span>'+(run.p+1)+' / '+run.idx.length+'</span></div>'+
    '<div class="prog"><i style="width:'+pct+'%"></i></div><div class="qtext">'+ruby(q.q)+'</div><div id="opts">';
  q.o.forEach(function(t,k){h+='<button type="button" class="opt" data-k="'+k+'"><span class="n">'+(k+1)+'</span><span>'+esc(t)+'</span></button>'});
  h+='</div><div id="fb"></div>';
  $('#qrun').innerHTML=h;
  $('#opts').onclick=function(e){var b=e.target.closest('button.opt');if(b&&!b.disabled)answer(+b.dataset.k)};
  window.scrollTo(0,0);
}
function answer(k){
  var i=run.idx[run.p],q=Q[i],good=(k===q.a);
  document.querySelectorAll('#opts .opt').forEach(function(b){
    var n=+b.dataset.k;b.disabled=true;
    if(n===q.a)b.classList.add('ok');else if(n===k)b.classList.add('ng');
  });
  if(good){run.ok++;store.wrong=store.wrong.filter(function(x){return x!==i})}
  else{run.miss.push(i);if(store.wrong.indexOf(i)<0)store.wrong.push(i)}
  save();
  var last=run.p===run.idx.length-1;
  $('#fb').innerHTML='<div class="fb"><div class="v '+(good?'ok':'ng')+'">'+(good?'正解':'不正解（正解：'+(q.a+1)+'）')+'</div>'+esc(q.e)+'</div>'+
    '<button type="button" class="primary" id="nx">'+(last?'結果を見る':'次の問題へ')+'</button>';
  $('#nx').onclick=function(){if(last)result();else{run.p++;showQ()}};
  $('#nx').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function result(){
  var n=run.idx.length,pct=Math.round(run.ok/n*100);
  if(run.o.cat){store.best[run.o.cat]=pct;save()}
  var h='<div class="score">'+run.ok+' / '+n+'</div><div class="sub">正答率 '+pct+'%</div>';
  if(run.miss.length){
    h+='<div class="menuhead">間違えた問題</div>';
    run.miss.forEach(function(i){var q=Q[i];h+='<div class="wrong"><div>'+ruby(q.q)+'</div><div><b>正解：</b>'+esc(q.o[q.a])+'</div><div style="color:var(--text-secondary)">'+esc(q.e)+'</div></div>'});
  }else h+='<div class="sub">全問正解です。</div>';
  h+='<div class="row2"><button type="button" id="again">もう一度</button><button type="button" id="tomenu">メニューへ</button></div>';
  if(run.miss.length)h+='<div class="row2" style="grid-template-columns:1fr"><button type="button" class="primary" id="retry">間違えた問題だけ解き直す</button></div>';
  $('#qrun').innerHTML=h;
  var o=run.o,miss=run.miss.slice();
  $('#again').onclick=function(){startQuiz(o)};
  $('#tomenu').onclick=qmenu;
  var r=$('#retry');if(r)r.onclick=function(){run={o:o,idx:shuffle(miss),p:0,ok:0,miss:[]};showQ()};
  window.scrollTo(0,0);
}
document.querySelector('nav button[data-t="quiz"]').addEventListener('click',function(){if(!run||!$('#qrun').offsetParent)qmenu()});
qmenu();drawChips();renderDict();applyTheme();
})();
</script>
</body>
</html>
