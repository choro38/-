<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート ストラテジ系キーワード</title>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--card:#22263a;--border:#2d3250;--accent:#f59e0b;--accent2:#a78bfa;--green:#34d399;--red:#f87171;--text:#e8eaf6;--sub:#8892b0;--radius:16px;--font:'Helvetica Neue','Hiragino Sans','Meiryo',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:16px 12px 48px;}
.hd{text-align:center;padding:16px 0 8px;}
.hd h1{font-size:1.2rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hd p{color:var(--sub);font-size:.72rem;margin-top:3px;}
.mode-wrap{display:flex;justify-content:center;gap:8px;margin:10px 0;}
.mode-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:30px;color:var(--sub);cursor:pointer;font-size:.8rem;font-weight:700;padding:6px 18px;transition:all .18s;}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.search-wrap{max-width:480px;margin:0 auto 10px;position:relative;}
.search-wrap input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:40px;padding:8px 14px 8px 38px;color:var(--text);font-size:.88rem;outline:none;}
.search-wrap input:focus{border-color:var(--accent);}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub);pointer-events:none;}
.prog-wrap{max-width:480px;margin:0 auto 10px;}
.prog-bg{background:var(--surface);border-radius:99px;height:5px;overflow:hidden;}
.prog-bar{background:linear-gradient(90deg,var(--accent),var(--accent2));height:100%;border-radius:99px;transition:width .4s;}
.prog-label{text-align:center;font-size:.7rem;color:var(--sub);margin-top:4px;}
.prog-label span{color:var(--accent);font-weight:700;}
#flashMode{display:block;}
.flash-area{max-width:480px;margin:0 auto;}
.flash-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:26px 22px 20px;text-align:center;cursor:pointer;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:border-color .2s;user-select:none;}
.flash-card:hover{border-color:var(--accent);}
.flash-card.revealed .front{display:none;}
.flash-card.revealed .back-s{display:flex;}
.front,.back-s{width:100%;}
.back-s{display:none;flex-direction:column;gap:7px;}
.fcat{font-size:.66rem;font-weight:700;color:var(--accent);background:rgba(108,143,255,.12);padding:2px 10px;border-radius:99px;}
.fkw{font-size:1rem;font-weight:800;line-height:1.55;}
.fhint{font-size:.68rem;color:var(--sub);margin-top:4px;}
.fans{font-size:1.1rem;font-weight:900;color:var(--green);background:rgba(52,211,153,.08);border-radius:9px;padding:9px 13px;border-left:3px solid var(--green);text-align:left;line-height:1.35;}
.fdesc{font-size:.74rem;color:var(--sub);line-height:1.65;text-align:left;}
.bclose{font-size:.64rem;color:var(--sub);text-align:right;}
.flash-nav{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;flex-wrap:wrap;}
.nav-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;font-size:.8rem;font-weight:700;padding:7px 16px;transition:all .15s;}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.mark-btn{background:none;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.76rem;padding:6px 13px;font-weight:700;}
.mark-ok{color:var(--green);border-color:var(--green);}
.mark-ng{color:var(--red);border-color:var(--red);}
#quizMode{display:none;}
.quiz-area{max-width:480px;margin:0 auto;}
.quiz-q{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:20px 18px 16px;margin-bottom:10px;}
.qcat{font-size:.65rem;font-weight:700;color:var(--accent2);background:rgba(167,139,250,.1);padding:2px 10px;border-radius:99px;display:inline-block;margin-bottom:8px;}
.qtext{font-size:.95rem;font-weight:800;line-height:1.55;}
.qsub{font-size:.68rem;color:var(--sub);margin-top:7px;}
.choices{display:flex;flex-direction:column;gap:7px;margin-bottom:9px;}
.choice-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:9px;color:var(--text);cursor:pointer;font-size:.83rem;font-weight:600;padding:10px 13px;text-align:left;transition:all .18s;line-height:1.4;}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(108,143,255,.08);}
.choice-btn.correct{border-color:var(--green)!important;background:rgba(52,211,153,.12)!important;color:var(--green)!important;}
.choice-btn.wrong{border-color:var(--red)!important;background:rgba(248,113,113,.1)!important;color:var(--red)!important;}
.choice-btn:disabled{cursor:default;}
.qfb{background:var(--surface);border-radius:9px;padding:11px 14px;font-size:.76rem;color:var(--sub);line-height:1.6;display:none;border-left:3px solid var(--border);}
.qfb.show{display:block;}
.qfb.ok{border-left-color:var(--green);}
.qfb.ng{border-left-color:var(--red);}
.fbv{font-weight:800;font-size:.85rem;margin-bottom:3px;}
.qfb.ok .fbv{color:var(--green);}
.qfb.ng .fbv{color:var(--red);}
.qnext{display:none;width:100%;background:var(--accent);border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:.88rem;font-weight:800;padding:12px;margin-top:9px;}
.qnext.show{display:block;}
.score-sc{display:none;text-align:center;padding:28px 20px;max-width:480px;margin:0 auto;}
.score-sc.show{display:block;}
.sbig{font-size:3.2rem;font-weight:900;background:linear-gradient(135deg,var(--green),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.slabel{font-size:.8rem;color:var(--sub);margin-top:4px;}
.smsg{font-size:.95rem;font-weight:700;margin:12px 0 5px;}
.retry-btn{background:var(--accent);border:none;border-radius:9px;color:#fff;cursor:pointer;font-size:.88rem;font-weight:800;padding:12px 28px;margin-top:12px;}
.miss-list{margin-top:16px;text-align:left;}
.miss-list h3{font-size:.76rem;color:var(--sub);margin-bottom:7px;font-weight:700;}
.miss-item{background:var(--card);border-radius:7px;padding:8px 12px;margin-bottom:5px;border-left:3px solid var(--red);}
.miss-item .mt{font-size:.78rem;font-weight:800;}
.miss-item .mk{font-size:.68rem;color:var(--sub);margin-top:2px;}
</style>
</head>
<body>
<div class="hd"><h1>📘 ITパスポート ストラテジ系キーワード</h1><p id="totalLabel"></p></div>
<div class="mode-wrap">
  <button class="mode-btn active" id="btnF" onclick="switchMode('flash')">🃏 フラッシュ</button>
  <button class="mode-btn" id="btnQ" onclick="switchMode('quiz')">✅ 4択クイズ</button>
</div>
<div class="search-wrap"><span class="search-ico">🔍</span><input type="text" id="searchInput" placeholder="用語・キーワードを検索…" oninput="onSearch()"></div>
<div class="prog-wrap"><div class="prog-bg"><div class="prog-bar" id="progBar" style="width:0%"></div></div><div class="prog-label" id="progLabel"></div></div>
<div id="flashMode"><div class="flash-area">
  <div class="flash-card" id="flashCard" onclick="revealFlash()">
    <div class="front"><span class="fcat" id="fCat"></span><div class="fkw" id="fKw"></div><div class="fhint">👆 タップして用語を確認</div></div>
    <div class="back-s"><span class="fcat" id="fCat2"></span><div style="font-size:.67rem;color:var(--accent2);font-weight:700;">✅ これを選べば正解！</div><div class="fans" id="fAns"></div><div class="fdesc" id="fDesc"></div><div class="bclose">もう一度タップで戻る</div></div>
  </div>
  <div class="flash-nav">
    <button class="nav-btn" id="fPrev" onclick="flashMove(-1)">◀ 前</button>
    <button class="mark-btn mark-ok" onclick="markFlash(true)">✅ 覚えた</button>
    <button class="mark-btn mark-ng" onclick="markFlash(false)">❌ もう一度</button>
    <button class="nav-btn" id="fNext" onclick="flashMove(1)">次 ▶</button>
  </div>
  <div style="text-align:center;margin-top:9px;"><button class="nav-btn" onclick="initFlash()" style="font-size:.7rem;padding:5px 11px;">🔀 シャッフル</button></div>
</div></div>
<div id="quizMode"><div class="quiz-area" id="quizBody">
  <div class="quiz-q"><span class="qcat" id="qCat"></span><div class="qtext" id="qKw"></div><div class="qsub">↑ このキーワードが表す用語はどれ？</div></div>
  <div class="choices" id="choices"></div>
  <div class="qfb" id="quizFb"><div class="fbv" id="fbVerdict"></div><div id="fbDesc"></div></div>
  <button class="qnext" id="quizNext" onclick="nextQuiz()">次の問題 ▶</button>
</div>
<div class="score-sc" id="scoreScreen">
  <div class="sbig" id="scoreBig"></div><div class="slabel" id="scoreLabel"></div><div class="smsg" id="scoreMsg"></div>
  <div class="miss-list" id="missList"></div>
  <button class="retry-btn" onclick="startQuiz()">🔄 もう一度</button>
</div></div>
<script>
const DATA=[{"cat": "企業活動", "term": "CSR（企業の社会的責任）", "keyword": "株主だけでなく社会・環境・ステークホルダーへの責任を果たす経営姿勢", "desc": "Corporate Social Responsibility。地域社会・環境・従業員など全ステークホルダーへの責任。ISO 26000が関連規格。"}, {"cat": "企業活動", "term": "SDGs", "keyword": "2030年までの17の持続可能な開発目標", "desc": "Sustainable Development Goals。貧困・気候変動など17目標・169ターゲット。国連が採択した国際目標。"}, {"cat": "企業活動", "term": "ESG投資", "keyword": "環境・社会・ガバナンスを基準にした投資", "desc": "Environment・Social・Governance。財務情報だけでなくESGの取り組みを評価して投資先を選ぶ考え方。"}, {"cat": "企業活動", "term": "DX（デジタルトランスフォーメーション）", "keyword": "デジタル技術で事業・社会を根本から変革すること", "desc": "単なるIT化ではなく、デジタル技術でビジネスモデルや価値創造の方法を根本から変えること。"}, {"cat": "企業活動", "term": "GX（グリーントランスフォーメーション）", "keyword": "化石燃料から脱却しカーボンニュートラルを目指す変革", "desc": "温室効果ガスの削減と産業構造転換を同時に進める取り組み。GX推進法が関連法規。"}, {"cat": "企業活動", "term": "PDCA", "keyword": "Plan→Do→Check→Actの継続改善サイクル", "desc": "計画・実行・評価・改善を繰り返して業務・品質を継続的に向上させるフレームワーク。"}, {"cat": "企業活動", "term": "OODAループ", "keyword": "観察→判断→決定→行動の素早い意思決定サイクル", "desc": "Observe・Orient・Decide・Act。PDCAより素早い状況判断に適した意思決定フレームワーク。"}, {"cat": "企業活動", "term": "BCP（事業継続計画）", "keyword": "災害・障害時に中核事業を継続するための計画", "desc": "Business Continuity Plan。大規模災害発生時に事業をできる限り継続・迅速復旧するための計画。"}, {"cat": "企業活動", "term": "BCM（事業継続管理）", "keyword": "BCPを継続的に維持・改善・訓練する管理活動", "desc": "Business Continuity Management。BCPを作って終わりではなく継続的に訓練・見直し・改善する管理活動。"}, {"cat": "企業活動", "term": "コーポレートガバナンス", "keyword": "株主等による経営者への監視・監督の枠組み", "desc": "取締役会が経営者を監視し企業の健全・透明な経営を確保する取り組み。企業活動を律する仕組み。"}, {"cat": "企業活動", "term": "コンプライアンス", "keyword": "法令・社内規定・倫理規範をすべて守ること", "desc": "法律だけでなく社会的規範・倫理・社内ルールも遵守すること。違反は企業の信頼失墜・法的制裁につながる。"}, {"cat": "企業活動", "term": "ディスクロージャー", "keyword": "企業が財務情報・経営情報を積極的に公開すること", "desc": "投資家・株主・社会に対して財務諸表・事業報告等を公開して透明性を高める活動。"}, {"cat": "企業活動", "term": "ステークホルダー", "keyword": "企業の活動に利害関係を持つすべての人・組織", "desc": "株主・従業員・顧客・取引先・地域社会・行政など、企業活動に影響を受けるすべての利害関係者。"}, {"cat": "企業活動", "term": "MVV", "keyword": "ミッション・ビジョン・バリューの企業の存在意義と方向性", "desc": "Mission（使命）・Vision（将来像）・Value（価値観）。企業の存在意義・目指す姿・行動基準を示す。"}, {"cat": "企業活動", "term": "パーパス経営", "keyword": "企業の社会的な存在意義を中心に置く経営", "desc": "利益追求だけでなく「なぜ存在するか」という社会的意義（パーパス）を経営の中心に据える考え方。"}, {"cat": "企業活動", "term": "人的資本経営", "keyword": "人材を資本として捉え価値向上に投資する経営", "desc": "従業員を「コスト」ではなく「資本（投資対象）」として位置づけ、能力開発・エンゲージメント向上に積極投資する。"}, {"cat": "企業活動", "term": "グリーンIT", "keyword": "ITの省エネ化とITによる社会の環境負荷低減の両面", "desc": "Green of IT（IT機器の省エネ）とGreen by IT（ITで社会全体の環境負荷を減らす）の2つの側面がある。"}, {"cat": "企業活動", "term": "カーボンニュートラル", "keyword": "CO2排出量と吸収量を差し引きゼロにする目標", "desc": "温室効果ガスの排出量から吸収量を差し引いてネットゼロにすること。2050年達成が日本の目標。"}, {"cat": "企業活動", "term": "OJT", "keyword": "職場での実務を通じて上司・先輩が指導する教育", "desc": "On the Job Training。実際の業務を通じて指導する教育方法。Off-JT（職場外研修）・e-ラーニングと対比される。"}, {"cat": "企業活動", "term": "リスキリング", "keyword": "新しいスキルを身に付け直す学び直し", "desc": "技術変化・業務変革に対応するために労働者が新しい職業スキルを習得し直すこと。DX推進の文脈で重要。"}, {"cat": "企業活動", "term": "タレントマネジメント", "keyword": "従業員の能力・スキルを組織全体で把握して活用する仕組み", "desc": "従業員の能力・適性・キャリアを一元管理し、適材適所の人材配置・育成・登用を行う人材管理の考え方。"}, {"cat": "企業活動", "term": "ワークライフバランス", "keyword": "仕事と生活の調和が取れた働き方の実現", "desc": "仕事と個人の生活（育児・介護・趣味等）をバランスよく両立できる環境・働き方の実現。"}, {"cat": "企業活動", "term": "DE&I", "keyword": "多様性・公平性・包括性を尊重する組織の考え方", "desc": "Diversity・Equity・Inclusion。性別・年齢・国籍・障害の有無などに関わらず多様な人材が活躍できる組織文化。"}, {"cat": "企業活動", "term": "テレワーク", "keyword": "自宅・サテライトオフィスなど会社以外の場所で働く勤務形態", "desc": "在宅勤務・モバイルワーク・サテライトオフィス勤務などの総称。労務管理やセキュリティ対策が課題。"}, {"cat": "企業活動", "term": "BYOD", "keyword": "従業員の私物デバイスを業務に利用すること", "desc": "Bring Your Own Device。私物スマートフォン・PCを会社が許可した上で業務に活用する方式。情報漏えいリスクの管理が重要。"}, {"cat": "企業活動", "term": "事業部制組織", "keyword": "製品・地域ごとに独立した事業部を置く組織形態", "desc": "各事業部が販売・製造・人事など一連の機能を持ち責任と権限を持って自律的に動く組織形態。"}, {"cat": "企業活動", "term": "マトリックス組織", "keyword": "職能別と事業別の2つの命令系統が交差する組織", "desc": "従業員が職能部門と事業部門の両方の上司に属する組織。柔軟な対応が可能だが指揮系統が複雑になる。"}, {"cat": "企業活動", "term": "プロジェクト組織", "keyword": "目的達成のため各部門から集めた期間限定チーム", "desc": "特定プロジェクト遂行のために各部門から人材を集めた一時的な組織。プロジェクト完了後は解散する。"}, {"cat": "企業活動", "term": "持株会社（ホールディングス）", "keyword": "他の会社の株を保有することで子会社を支配する会社", "desc": "事業を子会社に任せ、親 第5の社会形態。"}, {"cat": "企業活動", "term": "第4次産業革命", "keyword": "AI・IoT・ロボットなどによる産業・社会の変革", "desc": "蒸気機関（1次）・電気（2次）・IT（3次）に続く革命。AIやIoTにより製造業・サービス業が根本から変わる。"}, {"cat": "法律・知財", "term": "著作権", "keyword": "創作物が生まれた瞬間に自動発生する権利（登録不要）", "desc": "プログラムも著作物として保護される。申請・登録不要で創作の瞬間から発生する。AIが生成したデータの著作権帰属も論点。"}, {"cat": "法律・知財", "term": "特許権", "keyword": "発明を出願・審査後に20年間独占する産業財産権", "desc": "新規性・進歩性がある発明を特許庁に出願し審査後に登録。ビジネスモデル特許（コンピュータ関連発明）も対象。"}, {"cat": "法律・知財", "term": "実用新案権", "keyword": "物品の形状・構造のアイデアを保護する産業財産権", "desc": "特許より簡単な考案（物品の形状・構造）を保護。審査なしで登録できるが保護期間は出願から10年と短い。"}, {"cat": "法律・知財", "term": "意匠権", "keyword": "製品の外観・デザインを保護する産業財産権", "desc": "製品の形状・模様・色彩などの美的デザインを保護。登録が必要で出願から最長25年。"}, {"cat": "法律・知財", "term": "商標権", "keyword": "ブランド名・ロゴを保護する産業財産権", "desc": "商品・サービスを識別するマーク（文字・図形・音等）を保護。更新すれば半永久的に維持できる。"}, {"cat": "法律・知財", "term": "営業秘密（トレードシークレット）", "keyword": "秘密管理された事業上の有用な技術・営業情報", "desc": "不正競争防止法で保護。秘密として管理されていること・有用性・非公知性の3要件を満たした情報が対象。"}, {"cat": "法律・知財", "term": "パブリシティ権", "keyword": "有名人が自分の氏名・肖像の商業利用をコントロールする権利", "desc": "芸能人・スポーツ選手が名前・顔写真の無断商業利用を禁止できる権利。判例で認められた権利。"}, {"cat": "法律・知財", "term": "肖像権", "keyword": "自分の顔・姿を無断で撮影・公開されない権利", "desc": "誰でも持つ権利。有名人のパブリシティ権と違い商業的価値は問わない。SNSへの無断掲載も侵害になりうる。"}, {"cat": "法律・知財", "term": "個人情報保護法", "keyword": "個人を識別できる情報の取り扱いを規制する法律", "desc": "個人情報取扱事業者に収集目的の明示・安全管理・第三者提供の制限などを義務付ける法律。"}, {"cat": "法律・知財", "term": "匿名加工情報", "keyword": "復元できないよう加工した個人情報（本人同意なく利活用可）", "desc": "個人を識別できないよう法令の方法で加工し復元不可にした情報。本人同意なく第三者提供・利活用が可能。"}, {"cat": "法律・知財", "term": "仮名加工情報", "keyword": "他の情報と照合しなければ個人を識別できないよう加工した情報", "desc": "個人情報保護法の区分。匿名加工情報より緩い加工で済むが内部での分析利用に限定される。"}, {"cat": "法律・知財", "term": "GDPR", "keyword": "EUの個人データ保護に関する包括的規則", "desc": "General Data Protection Regulation。EU市民の個人データを厳格保護するEUの法規制。日本企業でもEU向けサービスには適用される。"}, {"cat": "法律・知財", "term": "サイバーセキュリティ基本法", "keyword": "日本のサイバーセキュリティ施策の基本理念と国の責務を定める法律", "desc": "情報通信ネットワークへの不正侵入等対処施策に関し、基本理念・国の責務などを定めた法律。"}, {"cat": "法律・知財", "term": "不正アクセス禁止法", "keyword": "正当な権限なく他者のコンピュータに侵入することを禁止", "desc": "他人のIDでログインすること・フィッシングでID取得することなどを禁止する法律。未遂も処罰対象。"}, {"cat": "法律・知財", "term": "不正指令電磁的記録に関する罪", "keyword": "ウイルスの作成・提供・保管を禁止する法律", "desc": "コンピュータウイルスの作成・提供・供用・取得・保管を犯罪とする法律。正当な理由のないウイルス保管も処罰対象。"}, {"cat": "法律・知財", "term": "特定電子メール法", "keyword": "迷惑メール（スパム）の送信を規制する法律", "desc": "広告宣伝メールをオプトアウト（受信拒否）後に送り続けることを禁止する法律。"}, {"cat": "法律・知財", "term": "景品表示法", "keyword": "誇大広告・ステルスマーケティングを規制する消費者保護法", "desc": "実際より著しく優れていると示す不当表示・過大景品を規制する。広告と明示しないステルスマーケティングも違反対象。"}, {"cat": "法律・知財", "term": "労働者派遣法", "keyword": "派遣労働のルールを定め派遣元・先の責任を規定する法律", "desc": "派遣元（派遣会社）・派遣先（クライアント企業）の責任関係・派遣可能期間などを規定する。IT業界でも広く適用される。"}, {"cat": "法律・知財", "term": "電子帳簿保存法", "keyword": "電子データの帳簿・書類保存ルールを定める法律", "desc": "税務関係書類をデータで保存する要件を定めた法律。電子取引データの保存義務化が中小企業にも影響している。"}, {"cat": "法律・知財", "term": "プロバイダ責任制限法", "keyword": "ネット権利侵害のISP責任範囲と発信者情報開示を規定", "desc": "インターネット上の誹謗中傷・権利侵害に関しプロバイダの責任を限定し、被害者が発信者情報を開示請求できる手続きを定める。"}, {"cat": "法律・知財", "term": "コピーレフト", "keyword": "改変・配布するときも元のライセンスを継続する義務", "desc": "OSSのGPLライセンスで採用。改変版ソフトウェアを配布する場合、元のライセンスを適用し続けなければならない。"}, {"cat": "法律・知財", "term": "オープンソースソフトウェア（OSS）", "keyword": "ソースコードが公開され自由に利用・改変・再配布できるソフト", "desc": "Linux・Apache・MySQLなどが代表例。GPLなどライセンス条件を守る必要がある。商用利用可能なものも多い。"}, {"cat": "法律・知財", "term": "サブスクリプション", "keyword": "月額・年額の定額料金でサービスを継続利用する課金モデル", "desc": "ソフトウェア・音楽・動画配信などで広く使われる。買い切りと違い最新バージョンを常に使える。"}, {"cat": "法律・知財", "term": "デファクトスタンダード", "keyword": "市場の競争を経て事実上の標準になった規格・製品", "desc": "公的な標準化機関が決めた規格ではなく、普及によって事実上の標準となったもの。WindowsやVHSが代表例。"}, {"cat": "法律・知財", "term": "デジュレスタンダード", "keyword": "ISOなどの公的な標準化機関が定めた公的な規格", "desc": "De Jure Standard。法律・条約・標準化団体（ISO・IEC・JIS等）が正式に制定した標準規格。"}, {"cat": "法律・知財", "term": "ISO 9000", "keyword": "品質マネジメントシステムの国際規格", "desc": "製品・サービスの品質を継続的に維持・改善するための管理体制に関する国際規格。"}, {"cat": "法律・知財", "term": "ISO 14000", "keyword": "環境マネジメントシステムの国際規格", "desc": "組織の環境への影響を管理・改善するための体制に関する国際規格。CO2削減・省エネ活動の仕組みを認証する。"}, {"cat": "法律・知財", "term": "ISO 26000", "keyword": "組織の社会的責任に関する国際規格（CSRのガイドライン）", "desc": "企業・行政・NPOなどあらゆる組織の社会的責任に関するガイドライン。認証規格ではなく手引きとして活用される。"}, {"cat": "経営戦略", "term": "SWOT分析", "keyword": "強み・弱み・機会・脅威の4象限で内外環境を整理", "desc": "Strengths・Weaknesses・Opportunities・Threats。内部環境（強み・弱み）と外部環境（機会・脅威）を整理する経営分析手法。"}, {"cat": "経営戦略", "term": "3C分析", "keyword": "Customer・Competitor・Companyの3視点で市場分析", "desc": "顧客・競合・自社の3軸から事業環境を分析する手法。市場参入・戦略立案時の基本フレームワーク。"}, {"cat": "経営戦略", "term": "PEST分析", "keyword": "政治・経済・社会・技術の4つの外部環境を分析する手法", "desc": "Politics・Economy・Society・Technology。マクロ環境（自社ではコントロールできない外部要因）を分析する手法。"}, {"cat": "経営戦略", "term": "PPM", "keyword": "市場成長率×占有率でSBUを花形・金のなる木等に分類", "desc": "Product Portfolio Management。花形・金のなる木・問題児・負け犬で事業を分類し投資優先度を決める。"}, {"cat": "経営戦略", "term": "BSC（バランストスコアカード）", "keyword": "財務・顧客・内部業務・学習成長の4視点でバランスよく評価", "desc": "Balanced Scorecard。財務指標だけでなく顧客・社内プロセス・学習・成長の非財務指標も加えた業績評価手法。"}, {"cat": "経営戦略", "term": "KGI", "keyword": "最終ゴールの達成を測る重要目標達成指標", "desc": "Key Goal Indicator。「売上10億円達成」のような最終ゴールを数値で示す。KPIの上位に位置する指標。"}, {"cat": "経営戦略", "term": "KPI", "keyword": "KGI達成に向けた進捗を測る重要業績評価指標", "desc": "Key Performance Indicator。最終目標（KGI）に向けた中間目標を数値で設定し達成状況を管理する指標。"}, {"cat": "経営戦略", "term": "CSF（重要成功要因）", "keyword": "目標達成に不可欠な成功の鍵となる要因", "desc": "Critical Success Factors。戦略目標を達成するために必ず取り組まなければならない重要な活動・条件。"}, {"cat": "経営戦略", "term": "ニッチ戦略", "keyword": "大手が手を出さない特定の小市場に集中する競争戦略", "desc": "規模が小さくても競合が少ない特定セグメントに経営資源を集中し高い利益率を狙う戦略。"}, {"cat": "経営戦略", "term": "ブルーオーシャン戦略", "keyword": "競合のいない未開拓市場を創造して戦う戦略", "desc": "既存の血みどろの競争市場（レッドオーシャン）ではなく、競争のない新市場（ブルーオーシャン）を創り出す戦略。"}, {"cat": "経営戦略", "term": "コアコンピタンス", "keyword": "競合に容易に真似できない自社固有の中核的競争力", "desc": "他社が模倣困難な企業固有の強み・能力。経営戦略立案の出発点となる概念。"}, {"cat": "経営戦略", "term": "M&A", "keyword": "企業の合併・買収による外部成長戦略", "desc": "Mergers & Acquisitions。自社開発より素早く経営資源・技術・市場を獲得する手段。TOB（公開買付け）もその形態の一つ。"}, {"cat": "経営戦略", "term": "TOB（公開買付け）", "keyword": "株式市場外で不特定多数から株を買い集めてM&Aを行う手法", "desc": "Take Over Bid。期間・価格・株数を公告し多数の株主から株式を直接購入するM&Aの手法。"}, {"cat": "経営戦略", "term": "MBO（マネジメントバイアウト）", "keyword": "経営陣が自社株を買い取って独立・非公開化する手法", "desc": "Management Buyout。現経営陣が投資ファンド等の資金協力を得て自社株式を取得し経営陣主導で運営する手法。"}, {"cat": "経営戦略", "term": "アウトソーシング", "keyword": "自社業務を外部企業に委託しコア業務に集中する戦略", "desc": "コア業務以外を専門の外部企業に委託してコスト削減・品質向上・経営資源の集中を図る経営手法。"}, {"cat": "経営戦略", "term": "OEM", "keyword": "他社ブランドで製品を製造・供給すること", "desc": "Original Equipment Manufacturer。実際に製造するメーカーが他社のブランド名で供給する形態。"}, {"cat": "経営戦略", "term": "ファブレス", "keyword": "自社工場を持たず設計・開発に特化するメーカー", "desc": "Fabrication-less。製造設備を持たず設計・企画・マーケティングに特化し製造を外部委託する企業形態。AppleやQualcommが代表例。"}, {"cat": "経営戦略", "term": "フランチャイズチェーン", "keyword": "本部がノウハウ・ブランドを提供し加盟店が運営するビジネス", "desc": "本部がノウハウ・商標・サポートを提供し、加盟店がロイヤリティを払って運営する形態。コンビニが代表例。"}, {"cat": "経営戦略", "term": "アライアンス", "keyword": "複数の企業が独立性を保ちながら特定分野で協力する業務提携", "desc": "合併・買収と違い独立性を保ちながら特定分野で協力する。技術提携・販売提携・生産提携などの形態がある。"}, {"cat": "経営戦略", "term": "バリューエンジニアリング（VE）", "keyword": "価値＝機能÷コストの向上を目指す体系的手法", "desc": "製品・サービスの価値を機能とコストの比で捉え、コストを下げるか機能を高めることで価値向上を図る。"}, {"cat": "経営戦略", "term": "バリューチェーン", "keyword": "原材料調達から販売まで価値を生み出す活動の連鎖", "desc": "マイケル・ポーターが提唱。購買・製造・出荷・販売・サービスなどの活動でどこで競争優位を持てるか分析する。"}, {"cat": "経営戦略", "term": "CRM", "keyword": "顧客との関係を管理・強化して売上と満足を向上するシステム", "desc": "Customer Relationship Management。顧客の購買履歴・属性を一元管理し個別最適化したサービスで顧客ロイヤルティを高める。"}, {"cat": "経営戦略", "term": "SCM（サプライチェーンマネジメント）", "keyword": "調達〜製造〜流通〜販売の一連の流れを統合最適化する仕組み", "desc": "Supply Chain Management。サプライヤーから顧客までの全プロセスを統合管理してリードタイム短縮・在庫削減・コスト低減を図る。"}, {"cat": "経営戦略", "term": "ERP", "keyword": "財務・人事・生産・販売など企業の基幹業務を統合管理するシステム", "desc": "Enterprise Resource Planning。基幹業務パッケージシステム。リアルタイムでデータを一元管理し経営の効率化・可視化を実現。"}, {"cat": "経営戦略", "term": "ロングテール", "keyword": "多数の少量販売商品の合計売上がヒット商品を上回る現象", "desc": "ECサイトで売れない多数の商品群（尾部）の合計売上がヒット商品を上回る現象。インターネット販売で顕著。"}, {"cat": "経営戦略", "term": "フィンテック", "keyword": "金融×IT融合の革新的サービス（FinTech）", "desc": "Finance＋Technology。モバイル決済・AI資産運用・クラウドファンディング・暗号資産などのIT活用金融サービス。"}, {"cat": "経営戦略", "term": "キャズム", "keyword": "アーリーアダプターとマジョリティの間の越えにくい大きな溝", "desc": "新製品普及においてイノベーター・アーリーアダプターから一般大衆（マジョリティ）への移行時に生じる大きな障壁。"}, {"cat": "経営戦略", "term": "プロダクトライフサイクル", "keyword": "製品が導入→成長→成熟→衰退をたどる一連の段階", "desc": "製品が市場に出てから消えるまでの4つの段階。各フェーズで最適な戦略（価格・プロモーション等）が異なる。"}, {"cat": "経営戦略", "term": "アンゾフの成長マトリクス", "keyword": "製品×市場の4象限で成長戦略を選択するフレームワーク", "desc": "市場浸透・製品開発・市場開拓・多角化の4つの成長戦略を製品の新旧と市場の新旧で整理する。"}, {"cat": "経営戦略", "term": "4P分析", "keyword": "Product・Price・Place・Promotionのマーケティングミックス", "desc": "製品・価格・流通・プロモーションの4要素でマーケティング戦略を立案する。消費者目線では4Cとも対比される。"}, {"cat": "経営戦略", "term": "ハッカソン", "keyword": "エンジニアらが短期集中でアイデアを競い開発するイベント", "desc": "HackとMarathonの合成語。数時間〜数日の短期間でソフトウェア開発のアイデアを競い合うイベント。"}, {"cat": "経営戦略", "term": "リスティング広告", "keyword": "検索キーワードに連動して表示されるクリック課金型Web広告", "desc": "検索エンジン利用者が入力したキーワードに連動して検索結果画面に表示される広告。クリックごとに課金される。"}, {"cat": "経営戦略", "term": "SEO", "keyword": "Webサイトを検索結果の上位に表示させる最適化手法", "desc": "Search Engine Optimization。検索エンジンのアルゴリズムに合わせてWebサイトを改善し自然検索の上位表示を狙う。"}, {"cat": "経営戦略", "term": "コンカレントエンジニアリング", "keyword": "複数の開発工程を並行実施して製品開発期間を短縮する手法", "desc": "設計・試作・製造準備などを同時並行で進めることで開発期間を大幅短縮する手法。"}, {"cat": "経営戦略", "term": "リーン生産方式", "keyword": "ムリ・ムラ・ムダを徹底排除して生産効率を最大化する手法", "desc": "トヨタ生産方式を体系化。JIT（ジャストインタイム）・かんばん方式などで在庫・待機・過剰生産を排除する。"}, {"cat": "経営戦略", "term": "デジタルツイン", "keyword": "実物のデジタルコピーを仮想空間に構築してシミュレーション", "desc": "工場設備・建物などをセンサーデータでリアルタイムに仮想空間に再現。異常予知・最適化・シミュレーションに活用。"}, {"cat": "経営戦略", "term": "RFP（提案依頼書）", "keyword": "発注者がベンダーに調達条件を示し提案書提出を依頼する文書", "desc": "Request For Proposal。システム導入時に発注者がIT企業（ベンダー）へ要件・条件を明示し提案書の提出を依頼する文書。"}, {"cat": "経営戦略", "term": "RFI（情報提供依頼）", "keyword": "RFP作成前にベンダーから技術情報を収集する依頼文書", "desc": "Request For Information。発注者がシステム化の方向性を検討するため、ベンダーに技術動向や対応可能範囲の情報提供を依頼する文書。"}, {"cat": "経営戦略", "term": "ASP", "keyword": "サーバ上のアプリをインターネット経由でサービス提供する事業者", "desc": "Application Service Provider。ネットワーク経由でソフトウェアを提供するサービス形態。SaaSの前身にあたる概念。"}, {"cat": "経営戦略", "term": "電子商取引（EC）", "keyword": "インターネットを通じて商品・サービスを売買する取引", "desc": "Electronic Commerce。BtoB（企業間）・BtoC（企業対消費者）・CtoC（消費者間）などの形態がある。"}, {"cat": "経営戦略", "term": "クラウドファンディング", "keyword": "インターネットで多数の人から少額ずつ資金を集める仕組み", "desc": "新製品開発・社会貢献活動などで使われる。購入型・寄付型・投資型などの種類がある。"}, {"cat": "経営戦略", "term": "フリーミアム", "keyword": "基本機能は無料で提供し有料版で収益を得るビジネスモデル", "desc": "Free＋Premium。無料で多くのユーザーを集め一部のユーザーが有料版に移行して収益を上げる。Spotifyが代表例。"}, {"cat": "経営戦略", "term": "エスクローサービス", "keyword": "第三者が代金を預かり商品受け取り確認後に決済する仕組み", "desc": "売買双方のリスク（代金未払い・商品未着）を軽減するための仲介決済サービス。フリマアプリなどで広く使われる。"}, {"cat": "経営戦略", "term": "パレート図", "keyword": "問題・原因を重要度順に棒グラフで表す品質管理ツール", "desc": "「80:20の法則」に基づき上位20%の原因が全体の80%の問題を引き起こすという考えで重要課題を特定する。"}, {"cat": "経営戦略", "term": "特性要因図（フィッシュボーン）", "keyword": "問題（結果）の原因を魚の骨のような図で整理する手法", "desc": "品質管理の7つ道具の一つ。問題を引き起こす原因を「人・機械・材料・方法」などの視点から体系的に洗い出す。"}, {"cat": "経営戦略", "term": "デシジョンツリー", "keyword": "条件分岐を木構造で表し意思決定を支援するツール", "desc": "「もし〜なら」という条件の分岐を木の枝のように展開して各選択肢の結果・確率・期待値を整理する意思決定ツール。"}, {"cat": "経営戦略", "term": "ナレッジマネジメント", "keyword": "組織内の知識・ノウハウを共有・活用する仕組み", "desc": "個人が持つ暗黙知を形式知化して組織全体で共有・活用する管理手法。SECIモデルが有名。"}, {"cat": "経営戦略", "term": "SECIモデル", "keyword": "暗黙知と形式知の変換サイクルで組織的な知識創造を説明", "desc": "共同化（暗黙知→暗黙知）・表出化（暗黙知→形式知）・連結化（形式知→形式知）・内面化（形式知→暗黙知）の4プロセス。"}, {"cat": "経営戦略", "term": "ビジネスモデルキャンバス", "keyword": "9つのブロックでビジネスモデルを1枚で可視化するツール", "desc": "価値提案・顧客セグメント・収益の流れ・主要活動など9要素でビジネスの全体像を整理する。スタートアップでも大企業でも使われる。"}, {"cat": "経営戦略", "term": "リーンスタートアップ", "keyword": "仮説→実証→学習を素早く繰り返してムダなく事業を育てる手法", "desc": "製品・サービスのMVP（最小限の製品）を早期に市場に出し顧客の反応から学習しながら素早く改善する起業手法。"}, {"cat": "経営戦略", "term": "デザイン思考", "keyword": "ユーザーへの共感から始めて革新的な解決策を生み出すプロセス", "desc": "共感→問題定義→アイデア発想→プロトタイプ→テストの5段階でユーザー中心の革新的な製品・サービスを開発する思考プロセス。"}, {"cat": "経営戦略", "term": "PoC（概念実証）", "keyword": "新技術・アイデアが実現可能かを小規模に検証する試み", "desc": "Proof of Concept。本格開発の前に技術的な実現可能性やビジネス価値を小規模な実験で検証すること。"}, {"cat": "経営戦略", "term": "プラットフォームビジネス", "keyword": "異なるユーザーグループをつなぐ場を提供して収益を得るモデル", "desc": "Amazon・Google・Uber・LINEが代表例。売り手と買い手、広告主とユーザーなど複数グループをつなぐ「場」が価値の源泉。"}];
document.getElementById('totalLabel').textContent='全'+DATA.length+'語 シラバスVer.6.5準拠';
let currentMode='flash',searchQ='',fDeck=[],fIdx=0,fOkSet=new Set(),qPool=[],qIdx=0,qScore=0,qMiss=[],qAnswered=false;
function getPool(){return DATA.filter(d=>{const q=searchQ.toLowerCase();return !q||d.term.toLowerCase().includes(q)||d.keyword.toLowerCase().includes(q);});}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function setProgress(c,t){const p=t?Math.round(c/t*100):0;document.getElementById('progBar').style.width=p+'%';document.getElementById('progLabel').innerHTML='<span>'+c+'</span> / '+t+'問';}
function onSearch(){searchQ=document.getElementById('searchInput').value.trim();if(currentMode==='flash')initFlash();else startQuiz();}
function switchMode(m){currentMode=m;document.getElementById('btnF').className='mode-btn'+(m==='flash'?' active':'');document.getElementById('btnQ').className='mode-btn'+(m==='quiz'?' active':'');document.getElementById('flashMode').style.display=m==='flash'?'block':'none';document.getElementById('quizMode').style.display=m==='quiz'?'block':'none';if(m==='flash')initFlash();else startQuiz();}
function initFlash(){fDeck=shuffle(getPool());fIdx=0;fOkSet.clear();if(!fDeck.length)return;showFlash();}
function showFlash(){if(!fDeck.length)return;const d=fDeck[fIdx];document.getElementById('flashCard').classList.remove('revealed');document.getElementById('fCat').textContent=d.cat||'';document.getElementById('fCat2').textContent=d.cat||'';document.getElementById('fKw').textContent=d.keyword;document.getElementById('fAns').textContent=d.term;document.getElementById('fDesc').textContent=d.desc;document.getElementById('fPrev').disabled=fIdx===0;document.getElementById('fNext').disabled=fIdx===fDeck.length-1;setProgress(fIdx+1,fDeck.length);}
function revealFlash(){document.getElementById('flashCard').classList.toggle('revealed');}
function flashMove(dir){fIdx=Math.max(0,Math.min(fDeck.length-1,fIdx+dir));showFlash();}
function markFlash(ok){if(ok)fOkSet.add(fDeck[fIdx].term);else fOkSet.delete(fDeck[fIdx].term);if(fIdx<fDeck.length-1){fIdx++;showFlash();}else{const ng=fDeck.length-fOkSet.size;alert('お疲れさまでした！\n✅覚えた:'+fOkSet.size+'語　❌もう一度:'+ng+'語');if(ng>0){fDeck=shuffle(fDeck.filter(d=>!fOkSet.has(d.term)));fIdx=0;showFlash();}}}
function startQuiz(){document.getElementById('quizBody').style.display='block';document.getElementById('scoreScreen').className='score-sc';qPool=shuffle(getPool());qIdx=0;qScore=0;qMiss=[];if(!qPool.length)return;showQuiz();}
function showQuiz(){if(qIdx>=qPool.length){showScore();return;}qAnswered=false;const d=qPool[qIdx];document.getElementById('qCat').textContent=d.cat||'';document.getElementById('qKw').textContent=d.keyword;const others=shuffle(DATA.filter(x=>x.term!==d.term)).slice(0,3);const choices=shuffle([d,...others]);const box=document.getElementById('choices');box.innerHTML='';choices.forEach(c=>{const btn=document.createElement('button');btn.className='choice-btn';btn.textContent=c.term;btn.onclick=()=>answerQuiz(c.term,d.term,d.desc,btn);box.appendChild(btn);});document.getElementById('quizFb').className='qfb';document.getElementById('quizNext').className='qnext';setProgress(qIdx,qPool.length);}
function answerQuiz(chosen,correct,desc,btn){if(qAnswered)return;qAnswered=true;document.querySelectorAll('.choice-btn').forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct');});const fb=document.getElementById('quizFb');if(chosen===correct){btn.classList.add('correct');fb.className='qfb show ok';document.getElementById('fbVerdict').textContent='✅ 正解！';qScore++;}else{btn.classList.add('wrong');fb.className='qfb show ng';document.getElementById('fbVerdict').textContent='❌ 不正解';qMiss.push({term:correct,keyword:qPool[qIdx].keyword});}document.getElementById('fbDesc').textContent=desc;const nxt=document.getElementById('quizNext');nxt.className='qnext show';nxt.textContent=qIdx===qPool.length-1?'結果を見る 🎉':'次の問題 ▶';}
function nextQuiz(){qIdx++;showQuiz();}
function showScore(){document.getElementById('quizBody').style.display='none';document.getElementById('scoreScreen').className='score-sc show';const pct=Math.round(qScore/qPool.length*100);document.getElementById('scoreBig').textContent=pct+'%';document.getElementById('scoreLabel').textContent=qScore+' / '+qPool.length+' 問正解';document.getElementById('scoreMsg').textContent=pct===100?'🎉 完璧！':pct>=80?'👏 素晴らしい！':pct>=60?'📚 もう少し！':'💪 一緒に頑張ろう！';const ml=document.getElementById('missList');if(qMiss.length>0){ml.innerHTML='<h3>❌ もう一度確認（'+qMiss.length+'語）</h3>';qMiss.forEach(m=>{ml.innerHTML+='<div class="miss-item"><div class="mt">✏️ '+m.term+'</div><div class="mk">'+m.keyword+'</div></div>';});}else ml.innerHTML='';}
initFlash();
</script></body></html>
