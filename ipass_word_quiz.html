<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパス 単語当てクイズ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --card: #22263a;
    --border: #2e3354;
    --indigo: #6c72ff;
    --indigo-dim: #3a3f7a;
    --lime: #aaff5a;
    --lime-dim: #4a6620;
    --red: #ff5a7a;
    --red-dim: #6a2035;
    --text: #e8eaf6;
    --text-dim: #8890b0;
    --text-muted: #555a7a;
    --strat: #7eb8ff;
    --mgmt: #ffb347;
    --tech: #80ffcc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--indigo);
    letter-spacing: 1px;
  }
  .logo span { color: var(--lime); }
  .header-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .header-stats b { color: var(--text); }

  /* ── NAV ── */
  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    overflow-x: auto;
    gap: 0;
  }
  .nav-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    padding: 14px 20px;
    font-size: 15px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: all .2s;
    min-height: 52px;
  }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active {
    color: var(--indigo);
    border-bottom-color: var(--indigo);
    font-weight: 700;
  }
  .nav-btn .badge {
    background: var(--indigo-dim);
    color: var(--indigo);
    border-radius: 8px;
    padding: 1px 6px;
    font-size: 10px;
    margin-left: 4px;
  }
  .nav-btn.weak-tab .badge {
    background: var(--red-dim);
    color: var(--red);
  }

  /* ── MAIN ── */
  main {
    flex: 1;
    padding: 16px;
    max-width: 680px;
    width: 100%;
    margin: 0 auto;
  }

  /* ── FILTER BAR ── */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--text-dim);
    padding: 9px 18px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all .2s;
    min-height: 44px;
  }
  .filter-btn:hover { border-color: var(--indigo); color: var(--text); }
  .filter-btn.active {
    background: var(--indigo);
    border-color: var(--indigo);
    color: #fff;
    font-weight: 700;
  }
  .filter-btn.strat.active { background: var(--strat); border-color: var(--strat); color: #000; }
  .filter-btn.mgmt.active  { background: var(--mgmt);  border-color: var(--mgmt);  color: #000; }
  .filter-btn.tech.active  { background: var(--tech);  border-color: var(--tech);  color: #000; }

  /* ── PROGRESS ── */
  .progress-wrap {
    margin-bottom: 16px;
  }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--indigo);
    border-radius: 2px;
    transition: width .4s ease;
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 16px;
  }
  .q-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .domain-tag {
    font-size: 13px;
    padding: 4px 12px;
    border-radius: 10px;
    font-weight: 700;
  }
  .domain-tag.strat { background: rgba(126,184,255,.15); color: var(--strat); }
  .domain-tag.mgmt  { background: rgba(255,179,71,.15);  color: var(--mgmt); }
  .domain-tag.tech  { background: rgba(128,255,204,.15); color: var(--tech); }

  .q-counter { font-size: 14px; color: var(--text-muted); margin-left: auto; }

  .q-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
    letter-spacing: .5px;
  }
  .q-text {
    font-size: 19px;
    line-height: 1.8;
    color: var(--text);
  }

  /* ── CHOICES ── */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 16px;
  }
  .choice-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 18px 18px;
    font-size: 17px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
    width: 100%;
  }
  .choice-btn:hover:not(:disabled) {
    border-color: var(--indigo);
    background: var(--indigo-dim);
  }
  .choice-num {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    transition: background .15s;
  }
  .choice-btn.correct {
    border-color: var(--lime);
    background: var(--lime-dim);
    animation: glow-correct .6s ease;
  }
  .choice-btn.correct .choice-num { background: var(--lime); color: #000; }
  .choice-btn.wrong {
    border-color: var(--red);
    background: var(--red-dim);
  }
  .choice-btn.wrong .choice-num { background: var(--red); color: #fff; }
  .choice-btn:disabled { cursor: default; }

  @keyframes glow-correct {
    0%   { box-shadow: 0 0 0 rgba(170,255,90,0); }
    40%  { box-shadow: 0 0 18px rgba(170,255,90,.5); }
    100% { box-shadow: 0 0 0 rgba(170,255,90,0); }
  }

  /* ── FEEDBACK ── */
  .feedback {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text-dim);
    margin-bottom: 16px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback .word-highlight {
    font-family: 'JetBrains Mono', monospace;
    color: var(--lime);
    font-weight: 700;
    font-size: 18px;
    display: block;
    margin-bottom: 6px;
  }

  /* ── ACTION BUTTONS ── */
  .action-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 15px 22px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s;
    min-height: 52px;
  }
  .btn:hover { opacity: .85; }
  .btn-primary { background: var(--indigo); color: #fff; flex: 1; }
  .btn-ghost   { background: var(--card); color: var(--text-dim); border: 1px solid var(--border); }
  .btn-weak    { background: var(--red-dim); color: var(--red); border: 1px solid var(--red-dim); font-size: 14px; }

  /* ── RESULT ── */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 30px 24px;
    text-align: center;
  }
  .result-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 56px;
    font-weight: 700;
    color: var(--lime);
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-label { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; }
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .result-stat {
    background: var(--surface);
    border-radius: 10px;
    padding: 14px 10px;
  }
  .result-stat .val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .result-stat .key { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .result-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* ── WEAK LIST ── */
  .weak-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .weak-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .weak-word {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--text);
    font-weight: 700;
  }
  .weak-def {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.5;
  }
  .weak-miss {
    font-size: 11px;
    color: var(--red);
    background: var(--red-dim);
    border-radius: 8px;
    padding: 2px 8px;
    white-space: nowrap;
  }
  .weak-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color .15s;
  }
  .weak-remove:hover { color: var(--red); }
  .empty-msg {
    text-align: center;
    padding: 40px;
    color: var(--text-muted);
    font-size: 14px;
  }

  /* ── STATS TAB ── */
  .stats-section { margin-bottom: 20px; }
  .stats-title {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .stat-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .stat-row .label { font-size: 13px; color: var(--text-dim); flex: 1; }
  .stat-row .val { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700; }
  .stat-row .mini { font-size: 11px; color: var(--text-muted); }
  .domain-bar-wrap { margin-bottom: 6px; }
  .domain-bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .domain-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
  .domain-bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="logo">IT<span>PASS</span>_QUIZ</div>
  <div class="header-stats">
    <span>正解率 <b id="hdr-acc">—</b></span>
    <span>苦手 <b id="hdr-weak">0</b>語</span>
    <span>総回答 <b id="hdr-total">0</b></span>
  </div>
</header>

<nav>
  <button class="nav-btn active" onclick="switchTab('quiz')">📝 クイズ</button>
  <button class="nav-btn weak-tab" onclick="switchTab('weak')">🔴 苦手単語 <span class="badge" id="weak-badge">0</span></button>
  <button class="nav-btn" onclick="switchTab('stats')">📊 成績</button>
</nav>

<main>

  <!-- ── QUIZ TAB ── -->
  <div id="tab-quiz">
    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('all',this)">全分野</button>
      <button class="filter-btn strat" onclick="setFilter('strat',this)">ストラテジ</button>
      <button class="filter-btn mgmt"  onclick="setFilter('mgmt',this)">マネジメント</button>
      <button class="filter-btn tech"  onclick="setFilter('tech',this)">テクノロジ</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-info">
        <span id="q-progress-txt">0 / 0</span>
        <span id="q-session-acc">正解率 —</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>

    <!-- 問題表示 -->
    <div id="quiz-area">
      <div class="q-card">
        <div class="q-meta">
          <span class="domain-tag" id="q-domain-tag">—</span>
          <span class="q-counter" id="q-counter"></span>
        </div>
        <div class="q-label">次の説明に当てはまる単語はどれ？</div>
        <div class="q-text" id="q-text">読み込み中…</div>
      </div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
      <div class="action-row" id="action-row" style="display:none">
        <button class="btn btn-primary" onclick="nextQ()">次の問題 →</button>
        <button class="btn btn-weak" id="btn-weak-add" onclick="toggleWeak()">🔴 苦手に追加</button>
      </div>
    </div>

    <!-- 結果表示 -->
    <div id="result-area" class="hidden">
      <div class="result-card">
        <div class="result-score" id="res-score">0%</div>
        <div class="result-label" id="res-label">セッション終了</div>
        <div class="result-grid">
          <div class="result-stat"><div class="val" id="res-correct">0</div><div class="key">正解</div></div>
          <div class="result-stat"><div class="val" id="res-wrong">0</div><div class="key">不正解</div></div>
          <div class="result-stat"><div class="val" id="res-weak-cnt">0</div><div class="key">苦手追加</div></div>
        </div>
        <div class="result-actions">
          <button class="btn btn-primary" onclick="restartQuiz()">もう一度</button>
          <button class="btn btn-ghost"   onclick="switchTab('weak')">苦手を確認</button>
          <button class="btn btn-ghost"   onclick="switchTab('stats')">成績を見る</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── WEAK TAB ── -->
  <div id="tab-weak" class="hidden">
    <div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;color:var(--text-dim)">間違えた単語を集中復習</span>
      <button class="btn btn-primary" style="font-size:12px;padding:7px 16px" onclick="startWeakQuiz()">復習クイズ開始</button>
    </div>
    <div class="weak-list" id="weak-list"></div>
  </div>

  <!-- ── STATS TAB ── -->
  <div id="tab-stats" class="hidden">
    <div class="stats-section">
      <div class="stats-title">総合成績</div>
      <div class="stat-row">
        <span class="label">累計正解率</span>
        <span class="val" id="st-acc">—</span>
        <span class="mini" id="st-acc-sub"></span>
      </div>
      <div class="stat-row">
        <span class="label">総回答数</span>
        <span class="val" id="st-total">0</span>
        <span class="mini">問</span>
      </div>
      <div class="stat-row">
        <span class="label">苦手単語数</span>
        <span class="val" id="st-weak">0</span>
        <span class="mini">語</span>
      </div>
    </div>
    <div class="stats-section">
      <div class="stats-title">分野別正解率</div>
      <div id="domain-bars"></div>
    </div>
  </div>

</main>

<script>

// ===== STATE =====
const state = {
  pool: [],
  idx: 0,
  current: null,
  answered: false,
  sessionCorrect: 0,
  sessionTotal: 0,
  weakSet: new Set(),
  weakMiss: {},  // word_id → count
  totalCorrect: 0,
  totalAnswered: 0,
  domainStats: { strat: {c:0,t:0}, mgmt: {c:0,t:0}, tech: {c:0,t:0} },
  filter: 'all',
  mode: 'normal', // 'normal' | 'weak'
};

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('ipass_quiz_state') || '{}');
    if (s.weakSet)    state.weakSet    = new Set(s.weakSet);
    if (s.weakMiss)   state.weakMiss   = s.weakMiss;
    if (s.totalCorrect)  state.totalCorrect  = s.totalCorrect;
    if (s.totalAnswered) state.totalAnswered = s.totalAnswered;
    if (s.domainStats)   state.domainStats   = s.domainStats;
  } catch(e) {}
}
function saveState() {
  localStorage.setItem('ipass_quiz_state', JSON.stringify({
    weakSet: [...state.weakSet],
    weakMiss: state.weakMiss,
    totalCorrect: state.totalCorrect,
    totalAnswered: state.totalAnswered,
    domainStats: state.domainStats,
  }));
}

// ===== QUIZ LOGIC =====
function buildPool(filter, mode) {
  let src = WORDS;
  if (mode === 'weak') src = WORDS.filter(w => state.weakSet.has(w.id));
  if (filter !== 'all') src = src.filter(w => w.domain === filter);
  return shuffle([...src]);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getWrongChoices(correct) {
  const same = WORDS.filter(w => w.domain === correct.domain && w.id !== correct.id);
  const diff = WORDS.filter(w => w.domain !== correct.domain);
  const candidates = shuffle([...same, ...diff]);
  return candidates.slice(0, 3);
}

function startQuiz() {
  state.pool = buildPool(state.filter, state.mode);
  state.idx = 0;
  state.sessionCorrect = 0;
  state.sessionTotal = 0;
  document.getElementById('quiz-area').classList.remove('hidden');
  document.getElementById('result-area').classList.add('hidden');
  if (state.pool.length === 0) {
    document.getElementById('q-text').textContent = '対象の単語がありません。フィルタを変更してください。';
    document.getElementById('choices').innerHTML = '';
    return;
  }
  loadQ();
}

function loadQ() {
  if (state.idx >= state.pool.length) { showResult(); return; }
  state.current = state.pool[state.idx];
  state.answered = false;

  // meta
  const domMap = {strat:'ストラテジ', mgmt:'マネジメント', tech:'テクノロジ'};
  const tag = document.getElementById('q-domain-tag');
  tag.textContent = domMap[state.current.domain];
  tag.className = `domain-tag ${state.current.domain}`;
  document.getElementById('q-counter').textContent = `${state.idx + 1} / ${state.pool.length}`;

  // text
  document.getElementById('q-text').textContent = state.current.def;

  // choices
  const wrongs = getWrongChoices(state.current);
  const choices = shuffle([state.current, ...wrongs]);
  const nums = ['①','②','③','④'];
  const el = document.getElementById('choices');
  el.innerHTML = '';
  choices.forEach((w, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.disabled = false;
    btn.innerHTML = `<span class="choice-num">${nums[i]}</span><span>${w.word}</span>`;
    btn.onclick = () => answer(w.id === state.current.id, btn, choices, i);
    el.appendChild(btn);
  });

  // feedback hide
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';

  // action hide
  document.getElementById('action-row').style.display = 'none';

  // progress
  updateProgress();
}

function answer(correct, clickedBtn, choices, idx) {
  if (state.answered) return;
  state.answered = true;

  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => b.disabled = true);

  state.sessionTotal++;
  state.totalAnswered++;
  state.domainStats[state.current.domain].t++;

  if (correct) {
    clickedBtn.classList.add('correct');
    state.sessionCorrect++;
    state.totalCorrect++;
    state.domainStats[state.current.domain].c++;
  } else {
    clickedBtn.classList.add('wrong');
    // 正解ボタンも表示
    btns.forEach(b => {
      if (b.querySelector('span:last-child').textContent === state.current.word) {
        b.classList.add('correct');
      }
    });
    // 苦手に自動追加
    state.weakSet.add(state.current.id);
    state.weakMiss[state.current.id] = (state.weakMiss[state.current.id] || 0) + 1;
  }

  saveState();
  updateHeaderStats();

  // feedback
  const fb = document.getElementById('feedback');
  fb.innerHTML = `<span class="word-highlight">${state.current.word}</span>　${state.current.def}`;
  fb.classList.add('show');

  // weak button state
  const bw = document.getElementById('btn-weak-add');
  if (state.weakSet.has(state.current.id)) {
    bw.textContent = '✅ 苦手リストに追加済';
    bw.disabled = true;
  } else {
    bw.textContent = '🔴 苦手に追加';
    bw.disabled = false;
  }

  document.getElementById('action-row').style.display = 'flex';
  updateProgress();
}

function toggleWeak() {
  const id = state.current.id;
  if (state.weakSet.has(id)) {
    state.weakSet.delete(id);
    document.getElementById('btn-weak-add').textContent = '🔴 苦手に追加';
  } else {
    state.weakSet.add(id);
    document.getElementById('btn-weak-add').textContent = '✅ 苦手リストに追加済';
  }
  saveState();
  updateHeaderStats();
}

function nextQ() {
  state.idx++;
  loadQ();
}

function updateProgress() {
  const total = state.pool.length;
  const done = state.idx + (state.answered ? 1 : 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('q-progress-txt').textContent = `${done} / ${total}`;
  document.getElementById('progress-fill').style.width = pct + '%';
  const acc = state.sessionTotal ? Math.round(state.sessionCorrect / state.sessionTotal * 100) : null;
  document.getElementById('q-session-acc').textContent = acc !== null ? `正解率 ${acc}%` : '正解率 —';
}

function updateHeaderStats() {
  const acc = state.totalAnswered ? Math.round(state.totalCorrect / state.totalAnswered * 100) : null;
  document.getElementById('hdr-acc').textContent = acc !== null ? acc + '%' : '—';
  document.getElementById('hdr-weak').textContent = state.weakSet.size;
  document.getElementById('hdr-total').textContent = state.totalAnswered;
  document.getElementById('weak-badge').textContent = state.weakSet.size;
}

function showResult() {
  document.getElementById('quiz-area').classList.add('hidden');
  document.getElementById('result-area').classList.remove('hidden');
  const pct = state.sessionTotal ? Math.round(state.sessionCorrect / state.sessionTotal * 100) : 0;
  document.getElementById('res-score').textContent = pct + '%';
  const labels = ['', '要復習', 'もう少し！', 'Good！', '優秀！', '満点！'];
  let li = Math.floor(pct / 20);
  document.getElementById('res-label').textContent = li >= 5 ? '満点！' : li === 0 ? '要復習' : labels[li + 1];
  document.getElementById('res-correct').textContent = state.sessionCorrect;
  document.getElementById('res-wrong').textContent = state.sessionTotal - state.sessionCorrect;
  document.getElementById('res-weak-cnt').textContent = state.weakSet.size;
}

function restartQuiz() {
  document.getElementById('quiz-area').classList.remove('hidden');
  document.getElementById('result-area').classList.add('hidden');
  state.mode = 'normal';
  startQuiz();
}

// ===== FILTER =====
function setFilter(f, btn) {
  state.filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.mode = 'normal';
  startQuiz();
}

// ===== TAB =====
function switchTab(tab) {
  ['quiz','weak','stats'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== tab);
  });
  document.querySelectorAll('.nav-btn').forEach((b, i) => {
    b.classList.toggle('active', ['quiz','weak','stats'][i] === tab);
  });
  if (tab === 'weak') renderWeak();
  if (tab === 'stats') renderStats();
}

// ===== WEAK LIST =====
function renderWeak() {
  const el = document.getElementById('weak-list');
  el.innerHTML = '';
  if (state.weakSet.size === 0) {
    el.innerHTML = '<div class="empty-msg">苦手単語はまだありません 🎉</div>';
    return;
  }
  const domMap = {strat:'ストラテジ', mgmt:'マネジメント', tech:'テクノロジ'};
  [...state.weakSet].forEach(id => {
    const w = WORDS.find(x => x.id === id);
    if (!w) return;
    const miss = state.weakMiss[id] || 0;
    const div = document.createElement('div');
    div.className = 'weak-item';
    div.innerHTML = `
      <div style="flex:1;min-width:0">
        <div class="weak-word">${w.word}</div>
        <div class="weak-def">${w.def}</div>
        <span class="domain-tag ${w.domain}" style="font-size:10px;display:inline-block;margin-top:4px">${domMap[w.domain]}</span>
      </div>
      ${miss > 0 ? `<span class="weak-miss">${miss}回ミス</span>` : ''}
      <button class="weak-remove" onclick="removeWeak('${id}',this)" title="削除">×</button>
    `;
    el.appendChild(div);
  });
}

function removeWeak(id, btn) {
  state.weakSet.delete(id);
  delete state.weakMiss[id];
  saveState();
  updateHeaderStats();
  btn.closest('.weak-item').remove();
  if (state.weakSet.size === 0) {
    document.getElementById('weak-list').innerHTML = '<div class="empty-msg">苦手単語はまだありません 🎉</div>';
  }
}

function startWeakQuiz() {
  if (state.weakSet.size === 0) {
    alert('苦手単語がありません！');
    return;
  }
  state.mode = 'weak';
  state.filter = 'all';
  switchTab('quiz');
  startQuiz();
}

// ===== STATS =====
function renderStats() {
  const acc = state.totalAnswered ? Math.round(state.totalCorrect / state.totalAnswered * 100) : null;
  document.getElementById('st-acc').textContent = acc !== null ? acc + '%' : '—';
  document.getElementById('st-acc-sub').textContent = state.totalAnswered ? `${state.totalCorrect}/${state.totalAnswered}問` : '';
  document.getElementById('st-total').textContent = state.totalAnswered;
  document.getElementById('st-weak').textContent = state.weakSet.size;

  const domMap = {strat:['ストラテジ','var(--strat)'], mgmt:['マネジメント','var(--mgmt)'], tech:['テクノロジ','var(--tech)']};
  const el = document.getElementById('domain-bars');
  el.innerHTML = '';
  Object.entries(domMap).forEach(([key, [label, color]]) => {
    const s = state.domainStats[key];
    const pct = s.t ? Math.round(s.c / s.t * 100) : 0;
    const div = document.createElement('div');
    div.className = 'domain-bar-wrap';
    div.innerHTML = `
      <div class="domain-bar-label"><span>${label}</span><span>${s.t ? pct + '% ('+s.c+'/'+s.t+')' : '未回答'}</span></div>
      <div class="domain-bar"><div class="domain-bar-fill" style="width:${pct}%;background:${color}"></div></div>
    `;
    el.appendChild(div);
  });
}

// ===== INIT =====
loadState();
updateHeaderStats();
startQuiz();
</script>
</body>
</html>
